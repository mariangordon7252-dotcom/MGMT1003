{
    "mcq":  {
                "prob-L2-q01":  "题意：标准蒙提霍尔（Monty Hall）里，换门为什么赢 2/3？问原因。\n选 C：主持人知情、必开未选的羊门，另两扇共有的 2/3 全落到没开的那扇。\n算：设玩 300 次，车在门1/2/3 各 100 次。车在1：换输 100 次；车在2或3：他只能开另一扇羊门，换必赢 200 次 → 200/300=2/3。\nA 错：剩两扇不等于各 1/2，主持人开门不是随机的。\nB 错：开门不会移动汽车，变的是信息不是车位。\nD 错：你初选门始终是 1/3，没降到 1/6。",
                "prob-L2-q02":  "题意：主持人不知情、随机开了门3，碰巧是羊；问换到门2赢的概率。\n选 D：随机主持人可能开出车；删掉露车的情形后，留、换次数一样多。\n算：设玩 600 次，车在1/2/3 各 200。开门3：车1里 100 次，车2里 100 次，车3里 100 次（露车，删）。剩 200 次，车在2 占 100 → 1/2。\nA 错：1/3 是开门前的概率，没用证据更新。\nB 错：2/3 是知情主持人的答案，照搬了。\nC 错：1/6 是「车在2且开3」一条路，没除以证据总数。",
                "prob-L2-q03":  "题意：随机主持人从你没选的两扇里随便开一扇，开门前问他开出车的概率。\n选 A：车在未选门 2/3，他恰好选中那扇 1/2，2/3×1/2=1/3。\n算：设玩 300 次：车在门1 100 次（开不出车）；车在2或3 共 200 次，一半开中车 → 100/300=1/3。\nB 错：0 是知情主持人，他从不开车门。\nC 错：1/6 只算了一扇门（如车3开3），漏了另一扇。\nD 错：1/2 是他选某扇门的概率，没乘车在那里的概率。",
                "prob-L2-q04":  "题意：标准规则改哪一条，见到山羊后换门就不再比留门好？\n选 C：主持人不知情随机开、碰巧见羊，删枝归一化后留、换各 1/2。\n算：设玩 600 次：随机开门见羊 400 次，换赢 200、留赢 200 → 各 1/2。\nA 错：100 门开 98 扇羊门，换门赢 99/100，优势更大。\nB 错：提前宣布只是说明规则，知情主持人仍是 2/3。\nD 错：换个同价奖品不影响概率结构。",
                "prob-L2-q05":  "题意：100 扇门你选门1，知情主持人开了 98 扇羊门，问换门赢的概率。\n选 D：只有初选蒙对（1/100）时换门才输，其余全赢。\n算：设玩 100 次：车在门1 1 次（换输）；车在其余门 99 次，他只留下车那扇，换必赢 → 99/100。\nA 错：剩两扇不等于各 1/2，主持人开门受约束。\nB 错：1/100 是留在原门赢的概率。\nC 错：98/100 是把开掉的门数当成了概率。",
                "prob-L2-q06":  "题意：两人都看到主持人开出羊，一个主持人知情、一个随机，两人的证据一样吗？\n选 D：同一结果在两种机制下出现的概率不同，所以是不同的证据。\n算：各玩 300 次：知情主持人 300 次都见羊；随机主持人只有 200 次见羊（100 次露车）。\nA 错：只看结果不看机制，证据还包括结果怎么产生。\nB 错：随机开门与车位无关，信息更少不是更多。\nC 错：随机主持人可能开出车，见羊就带有信息。",
                "prob-L2-q07":  "题意：看到新证据后，概率树该怎么更新？\n选 A：删去与观察矛盾的分支，剩下的除以它们的总和，重新加起来等于 1。\n算：随机主持人开3见羊：6 条各 1/6，留 2 条共 1/3；每条变 (1/6)÷(1/3)=1/2。\nB 错：不归一化，剩下的加起来不到 1。\nC 错：被删分支应变成 0，不该再乘。\nD 错：剩余分支不一定等概率，要按原比例放大。",
                "prob-L2-q08":  "题意：一个事件能经两条不同的完整路径发生，每条 1/6，问事件的概率。\n选 D：不同路径互斥，概率相加：1/6+1/6=1/3。\n算：设 600 次：路径甲 100 次，路径乙 100 次，共 200 → 200/600=1/3。\nA 错：1/36 是两条路相乘，乘法只用于同一条路上。\nB 错：1/6 只算了一条路。\nC 错：1/2 没有依据，误当成只有这两条路。",
                "prob-L2-q09":  "题意：坦克按顺序编号，缴获的都低于 1000；这支持产量约 1000 还是 100 万？\n选 B：产量小时「全低于 1000」很正常，产量大时极罕见，所以支持小产量。\n算：缴获 1 辆：产量 1000 时编号 \u003c1000 几乎必然；产量 100 万时只有约 1/1000。缴获越多差距越大。\nA 错：大产量也可能抽到低编号，逻辑上排除不了。\nC 错：两个假设都相容不等于中立，要比可能性大小。\nD 错：产量越大，低编号占比越小，反而更难见到。",
                "prob-L2-q10":  "题意：随机主持人题，已知 P(H∧E)=1/6、P(E)=1/3，P(H|E) 用哪个公式、等于几？\n选 C：条件概率 = 同时发生 ÷ 证据总概率 = (1/6)÷(1/3)=1/2。\n算：设 600 次：E（开3见羊）200 次，其中车在门1 100 次 → 100/200=1/2。\nA 错：P(H)×P(E) 是独立时的「且」，不是条件概率。\nB 错：分子分母倒了，概率不可能是 2。\nD 错：1/6 是「H 且 E」，没除以 P(E)。",
                "prob-L2-q11":  "题意：纽康姆悖论（Newcomb\u0027s paradox）中，哪种推理支持只拿盒子 B？\n选 C：证据推理：预测者很准，我只拿 B 说明他多半已预测到，B 里有百万。\nA 错：放钱在选择之前，选择不能「造成」B 里有钱。\nB 错：优势推理支持拿两盒：多拿 A 总多 $1000。\nD 错：预测者很可靠不是掷硬币；真随机就该拿两盒。",
                "prob-L2-q12":  "题意：拿两盒的一方（two-boxer）最好的论证是哪一个？\n选 A：钱已放好，选择改不了；不论 B 里是什么，多拿 A 都多 $1000。\nB 错：题设是预测者很可靠，不是常出错。\nC 错：拿两盒恰是 B 为空的证据，这是一盒派的理由。\nD 错：预测者可靠时，拿两盒通常只得 $1000。",
                "prob-L2-q13":  "题意：老师把纽康姆的预测者比作蒙提霍尔主持人，想说明什么？\n选 B：一个事件带多少信息，取决于产生它的机制：主持人是否知情、预测者是否可靠。\nA 错：两题都不是「选多的就对」。\nC 错：纽康姆至今有争议，没有公认答案。\nD 错：纽康姆恰好说明证据和因果可以分开。",
                "prob-L2-q14":  "题意：公平硬币掷两次：(i) 开始前两次都正面的概率；(ii) 第一次正面后，第二次正面的概率。\n选 D：(i) 1/2×1/2=1/4；(ii) 两次独立，第二次仍是 1/2。\n算：设 400 组：两次都正面 100 组 → 1/4；第一次正面的 200 组里第二次正面 100 → 1/2。\nA 错：(ii) 已知第一次正面，不该再乘它的 1/2。\nB 错：(i)、(ii) 两个数对调了。\nC 错：(i) 漏乘了第二次的 1/2。",
                "prob-L4-q01":  "题意：删枝后剩 4 条分支，原来各 1/6，其中 2 条换门赢；归一化后换门赢的概率？\n选 A：剩余总和 4/6，换赢 2/6，(2/6)÷(4/6)=1/2。\n算：设 600 次，每条 100 次：剩 400 次，换赢 200 → 200/400=1/2。\nB 错：1/3 是 1/6+1/6，没除以剩余总和 2/3。\nC 错：2/3 是标准版答案，这里结构不同。\nD 错：1/4 只是归一化后的一条，换赢有两条。",
                "prob-L4-q02":  "题意：主持人在三扇门里乱开；已知他开的是你没选的门且是羊，问换门赢的概率。\n选 D：删掉开你的门、开到车的情形后，换输和换赢一样多。\n算：设玩 900 次：车在1/2/3 各 300，每种开法各 100。留下：车1开2、车1开3（换输）200；车2开3、车3开2（换赢）200 → 1/2。\nA 错：2/3 是知情主持人的答案。\nB 错：1/3 是没更新的初始概率。\nC 错：3/4 没依据，删枝后数错了。",
                "prob-L4-q03":  "题意：为什么标准版换门有 2/3 优势，随机主持人版却没有？\n选 A：标准主持人受两条约束（不开你的门、不开车门），开哪扇就透露了车位。\n算：你选门1，设玩 300 次：车在2 的 100 次他只能开3，车在3 的 100 次只能开2，这 200 次开门都在「指」车。\nB 错：两版都是 3 扇门，差别在开门规则。\nC 错：两种主持人都不说谎。\nD 错：两版初选都是 1/3。",
                "prob-L4-q04":  "题意：1/10 拿 HD；赌局「正面再掷出 6」若替换你原来的机会，该接受吗？\n选 D：正面且 6 = 1/2×1/6=1/12≈8.33%，小于 10%，不接受。\n算：设 120 人都赌：正面 60，其中掷出 6 的 10 → 10/120；不赌则 12 人拿 HD。\nA 错：「且」要相乘，不能 1/2+1/6。\nB 错：8.33% 比 10% 小，替换就是亏。\nC 错：17.5% 是「额外机会」的读法。",
                "prob-L4-q05":  "题意：赌局只在你原本拿不到 HD 时才用（额外机会），总的 HD 概率是多少？\n选 D：原本 1/10 拿到；剩下 9/10 里再有 1/12 靠赌局拿到。\n算：设 120 人：原本 HD 12 人；其余 108 人去赌，108×1/12=9 人；共 21/120=17.5%。\nA 错：直接加 1/12，把原本已拿 HD 的人又算了一遍。\nB 错：1/12 只是赌局本身，没加原本的 1/10。\nC 错：相乘是「两者都发生」，不是总概率。",
                "prob-L4-q06":  "题意：HD 赌局里，为什么「正面且 6」可以直接 1/2×1/6？\n选 D：硬币和骰子独立，硬币结果不影响骰子出 6 的概率。\n算：设 12 次：正面 6 次，其中出 6 的 1 次 → 1/12。\nA 错：互斥是不能同时发生，那「且」的概率就是 0。\nB 错：公平只给出各自概率，能直接乘靠的是独立。\nC 错：不独立时要用 P(A)×P(B|A)，不能直接乘。",
                "prob-L4-q07":  "题意：认真学习的学生说「班上 10% 拿 HD，所以我正好 10%」，问题在哪？\n选 C：群体频率不等于个人在全部证据下的概率；她的准备会让概率高于 10%。\nA 错：班级频率不总等于个人概率。\nB 错：赌徒谬误是以为过去结果影响独立事件，无关。\nD 错：成绩的概率能给，只是要用个人证据。",
                "prob-L4-q08":  "题意：「以我有限的信息，我只有 10% 信心你会拿 HD」是哪种概率理解？\n选 A：认识论概率（epistemic probability）：按我掌握的证据有多大信心。\nB 错：频率讲群体比例，这句讲我对你的信心。\nC 错：客观机会指硬币、骰子这种物理随机。\nD 错：逻辑必然是概率 1，不是 10%。",
                "prob-L4-q09":  "题意：哪一句最自然地是频率说法，而不是认识论（凭证据的信心）说法？\n选 A：「班上约十分之一拿 HD」描述群体比例，是频率说法。\nB 错：「根据证据我相当确信」是信心，属认识论。\nC 错：「根据我对你的了解」是个人证据下的信心。\nD 错：「看了预报我给 30%」也是凭证据的信心。",
                "prob-L4-q10":  "题意：完整概率树的末端分支，哪一条不是必须满足的要求？\n选 D：末端分支不必等概率，如 HD 赌局树里各分支就不同。\nA 错：穷尽所有情况是必须的。\nB 错：互斥（不能同时发生）是必须的。\nC 错：概率和为 1 是必须的。",
                "prob-L4-q11":  "题意：老师说「赢的概率更高」未必决定选择，还要看什么？（预告期望效用）\n选 B：还要看奖励大小、付出的成本，以及你对风险的态度。\nA 错：最可能的不一定最理性，奖励差距会改变决定。\nC 错：独立性影响怎么算概率，不是额外的选择因素。\nD 错：概率是哪种理解，不决定该选哪个。",
                "prob-L8-q01":  "题意：问赌徒谬误（gambler\u0027s fallacy）的准确定义；考的前提是「独立」。\n选 B：关键是嘴上承认各次独立，却又说某结果「该来了」或「不会再来」。\nA 错：怀疑硬币有偏，是对公平性的判断，不是该谬误。\nC 错：太宽；该谬误特指承认独立后的错误推理。\nD 错：以为骗局会付钱，是事实前提错，不是这个谬误。",
                "prob-L8-q02":  "题意：公平且独立的硬币连出 12 次正面，问第 13 次是反面的概率；考「独立」。\n选 B：独立意味着前 12 次不改变第 13 次，仍是 1/2。\nA 错：「反面该来了」正是赌徒谬误。\nC 错：「手气正热」也假设前面影响后面，违背独立。\nD 错：1/2^13 是事先算整串 13 次的概率，不是第 13 次单次。",
                "prob-L8-q03":  "题意：每次出 6 概率都是 0.30、各次独立，问它公平吗、独立吗；分清公平与独立。\n选 C：0.30 ≠ 1/6，所以不公平；各次互不影响，所以独立。\nA 错：公平要求每面都是 1/6，0.30 不是。\nB 错：不公平也能独立，两者无关。\nD 错：「每次概率一样」是稳定，不是公平；公平要各面等概率。",
                "prob-L8-q04":  "题意：判定赌徒谬误必须有哪个前提；考「独立」，不是公平或互斥。\n选 C：该谬误就是把各次当作独立，却还让过去影响预测。\nA 错：不需要 50/50，偏骰也能犯此谬误。\nB 错：互斥是单次结果之间的关系，与该谬误无关。\nD 错：输没输钱与推理是否谬误无关。",
                "prob-L8-q05":  "题意：三天没查车就说今天更可能查，问算不算赌徒谬误；考各天是否「独立」。\n选 C：先查各天是否独立；若按排班轮换，过去几天确实带有信息。\nA 错：没先查独立就下结论，太武断。\nB 错：「总会平衡」本身就是赌徒谬误式的说法。\nD 错：这句话不自相矛盾，只可能推理有问题。",
                "prob-L8-q06":  "题意：被抓过一次后觉得以后更容易被拦，问是不是赌徒谬误；考两次被拦是否「独立」。\n选 A：第一次可能让他上了执法名单，后面被拦确实依赖第一次，不独立。\nB 错：「过去从不影响未来」不对，这里正有影响机制。\nC 错：被拦不是 50/50，且该谬误不要求公平。\nD 错：两次被拦能都发生，不互斥，也与问题无关。",
                "prob-L8-q07":  "题意：真心相信「宇宙会补偿输家」的人，为何不算严格的赌徒谬误；考他是否承认「独立」。\n选 D：他根本否认各次独立，错在事实前提，不是承认独立后乱推。\nA 错：前提「宇宙补偿」是假的，不是真前提。\nB 错：宇宙补偿没有被科学证实。\nC 错：该谬误适用于任何独立试验，不只硬币。",
                "prob-L8-q08":  "题意：受害人觉得骗局邮件多试几次总会赔钱，问主要错在哪；考这里有没有「独立」试验。\n选 B：骗局根本没有真实的赔付机会，错在事实前提。\nA 错：没有「每次都有一定机会」的独立试验，套不上。\nC 错：与德摩根律（De Morgan\u0027s laws）无关。\nD 错：题里没有混淆互斥与独立。",
                "prob-L8-q09":  "题意：长期正面比例趋近 1/2，问能否推出连出 40 次正面后反面更可能；考「独立」与长期频率。\n选 B：长期比例靠后面大量试验稀释前面的偏差，下一次仍是 1/2。\n算：40 正后再抛 960 次约 480 正，共 520/1000 = 52%，越抛越近 50%。\nA 错：长期收敛不需要短期补偿。\nC 错：公平硬币正面比例趋近 1/2，不是 1。\nD 错：硬币没有记忆，不会因此偏向反面。",
                "prob-L8-q10":  "题意：问哪个式子表示 A 与 B 独立。\n选 B：知道 B 后 A 的概率不变，即 P(A|B) = P(A)，就是独立。\nA 错：P(A∧B) = 0 表示不能同时真，那是互斥。\nC 错：这是加法规则，成立条件是互斥。\nD 错：两事件概率相等，与是否独立无关。",
                "prob-L8-q11":  "题意：知道 B 不改变 A 的概率，问知道 A 会不会改变 B 的概率；考独立的对称性。\n选 C：独立是对称的：A 独立于 B，则 B 也独立于 A。\n算：P(A|B)=P(A) ⇒ P(A∧B)=P(A)P(B) ⇒ P(B|A)=P(A∧B)÷P(A)=P(B)\nA 错：恰好相反，独立是双向的。\nB 错：能推出，对称性保证 B 也不受影响。\nD 错：独立讲的是信息，推不出任何因果。",
                "prob-L8-q12":  "题意：爆竹不会自己炸；已知炸了，问它被点过的概率 Pr(点|炸)；考条件方向与因果。\n选 D：没点的爆竹一个都不会炸，炸了的全是点过的，所以是 1；这只是信念更新。\n算：设 90 个爆竹：点过 30，没点 60\n炸：点过里 30×1/3=10，没点里 0，共 10\nPr(点|炸) = 10 ÷ 10 = 1\nA 错：1/3 是 Pr(炸|点)，条件方向弄反了。\nB 错：数值对，但爆炸不会「导致」之前被点，不是倒因果。\nC 错：没理由对半分，没点的根本不会炸。",
                "prob-L8-q13":  "题意：抽一张牌，问「是 A（Ace）」和「是黑桃」是否独立；考独立，不是互斥。\n选 C：13 张黑桃里 A 占 1/13，和整副的 4/52 = 1/13 一样，概率没变。\n算：52 张里 A 4 张：4/52 = 1/13\n13 张黑桃里 A 1 张：1/13，没变 → 独立\nA 错：能同时为真只说明不互斥，不说明不独立。\nB 错：有黑桃 A，两者能同时真，不互斥。\nD 错：P(Ace)=1/13，P(Spade)=1/4，并不相等；相等也不说明独立。",
                "prob-L8-q14":  "题意：抽一张牌，问「红桃」与「红色」是什么关系；考独立与互斥。\n选 C：知道是红桃就必然是红色，概率从 1/2 变成 1，所以不独立。\n算：52 张里红色 26 张：1/2\n13 张红桃里红色 13 张：13/13 = 1，变了 → 不独立\nA 错：知道红桃后 P(Red) 变成 1，并非不变。\nB 错：红桃同时是红色，能同时真，不互斥。\nD 错：讲不同特征不保证独立，花色决定了颜色。",
                "prob-L8-q15":  "题意：抽一张牌，问「梅花」与「黑桃」是否互斥、是否独立。\n选 B：一张牌不能有两种花色，互斥；知道是梅花，黑桃概率从 1/4 变 0，不独立。\nA 错：概率为正的互斥事件一定不独立。\nC 错：它们不能同时为真，是互斥的。\nD 错：两点都反了：不独立，且确实互斥。",
                "prob-L10-q01":  "题意：掷一次骰，「掷出 2」与「掷出 3」，结果是 5，问哪句对；考互斥的定义。\n选 B：互斥只禁止两者同时真；结果是 5 时两者都假，照样互斥。\nA 错：都假不破坏互斥，互斥不要求必有一真。\nC 错：两者互斥且概率为正，不独立；与这次是 5 无关。\nD 错：「恰有一个真」是互斥且穷尽，不是互斥本身。",
                "prob-L10-q02":  "题意：用加法规则 P(A∨B)=P(A)+P(B) 前要查什么；考加法规则的条件「互斥」。\n选 C：只有 A、B 不能同时真（互斥），相加才不会把重叠部分算两次。\nA 错：独立是乘法规则的条件，不是加法的。\nB 错：加法不要求两者等概率。\nD 错：穷尽是补集规则要的，加法不需要。",
                "prob-L10-q03":  "题意：用乘法规则 P(A∧B)=P(A)×P(B) 前要查什么；考乘法规则的条件「独立」。\n选 A：知道一个不改变另一个的概率，即独立，才能直接相乘。\nB 错：这是互斥；互斥时 P(A∧B)=0，不能相乘。\nC 错：不同时间发生也可能相关，如无放回抽球。\nD 错：公平与否和独立无关，偏骰也能相乘。",
                "prob-L10-q04":  "题意：掷一次骰，问「既是 2 又是 3」的概率；考 2 与 3 是否互斥、能否相乘。\n选 A：一次只出一个数，2 与 3 互斥，不可能同时真，概率 0。\nB 错：1/36 是相乘得来，但互斥事件不独立，不能乘。\nC 错：1/3 是 P(2∨3)，把「且」算成了「或」。\nD 错：1/6 只是其中一个的概率。",
                "prob-L10-q05":  "题意：问为何 P(K∨红桃) 不能直接 4/52+13/52；考加法规则的条件「互斥」。\n选 B：红桃 K 既是 K 又是红桃，两者重叠，直接相加会把它算两次。\n算：4 + 13 − 1 = 16 张 → 16/52 = 4/13\nA 错：独立与否不影响加法；问题出在不互斥。\nC 错：加法规则适用于任何互斥事件，不只骰子。\nD 错：加法不要求等概率。",
                "prob-L10-q06":  "题意：已知 P(A∧B)=1/3、P(A∧¬B)=1/5，求 P(A)；考两块是否「互斥」。\n选 A：A 要么带 B、要么带 ¬B，两块互斥，相加就是全部的 A。\n算：P(A) = 1/3 + 1/5 = 5/15 + 3/15 = 8/15\nB 错：1/15 是 1/3×1/5，把两块乘了。\nC 错：2/15 是 1/3−1/5，减错了。\nD 错：不需要 P(B)，两块已拼出完整的 A。",
                "prob-L10-q07":  "题意：问 (A∧B)∨(A∧¬B) 是什么；考逻辑等价与永真式的区别。\n选 B：每种情况它都和 A 真假相同，所以等价于 A；A 假时它也假，不是永真式。\nA 错：A 假时它为假，概率是 P(A)，不是 1。\nC 错：A 真时它为真，不是矛盾式。\nD 错：B 的真假被两边抵消，结果只看 A。",
                "prob-L10-q08":  "题意：A、B 独立，A、C 互斥，求 P[(A∧B)∨C]；考乘法要独立、加法要互斥。\n选 B：A∧B 用独立相乘；A∧B 含 A，A 与 C 互斥，所以它与 C 也互斥，可相加。\n算：P(A∧B) = 1/3 × 1/6 = 1/18\nP = 1/18 + 1/9 = 1/18 + 2/18 = 3/18 = 1/6\nA 错：1/18 只算了 A∧B，漏了 C。\nC 错：1/9 只是 P(C)。\nD 错：11/18 = 1/3+1/6+1/9，把 A∧B 当成了 A 加 B。",
                "prob-L10-q09":  "题意：A、B 独立且概率都为正，问哪句必然对；考独立与互斥的区别。\n选 D：独立时 P(A∧B)=P(A)P(B)，两个正数相乘仍为正，所以能同时发生。\nA 错：P(A∧B)=0 是互斥，与此矛盾。\nB 错：概率为正的互斥事件一定不独立。\nC 错：两者有重叠，不互斥，不能直接相加。",
                "prob-L10-q10":  "题意：问为何概率为正的互斥事件永远不独立；考互斥与独立的区别。\n选 B：知道一个发生，另一个概率立刻变 0，概率被改变了，所以不独立。\n算：掷骰 P(3)=1/6；得知是 2 后 P(3)=0 ≠ 1/6\nA 错：互斥事件概率可以不等，如掷出 1 与掷出偶数。\nC 错：不独立是信息关系，不需要因果。\nD 错：「互不影响」说的是因果；概率上恰恰有影响。",
                "prob-L10-q11":  "题意：P(A∨B∨C)=5/6，加上 D 后为 1，问何时能得 P(D)=1/6；考差额相减的条件「互斥」。\n选 C：D 与 A、B、C 都互斥，D 才正好是新增那块：1 − 5/6 = 1/6。\nA 错：独立时 D 会与前三者重叠，差额不等于 P(D)。\nB 错：等概率与此无关，题里也没给 P(A)。\nD 错：若 D 与前面重叠，P(D) 可能大于 1/6。",
                "prob-L10-q12":  "题意：掷两颗公平骰，问「一颗 3、另一颗 4」的概率；考有序与无序（没指定哪颗是 3）。\n选 D：(3,4) 和 (4,3) 都算，36 种里 2 种，2/36 = 1/18。\n算：36 种等可能结果，有利：(3,4)、(4,3) → 2/36 = 1/18\nA 错：1/36 只算了「骰1=3、骰2=4」一种顺序。\nB 错：1/12 = 3/36，多算了一种。\nC 错：1/6 = 6/36，多算了很多。",
                "prob-L10-q13":  "题意：3 蓝 2 绿，抽出蓝球不放回，问第二个是蓝的概率；考两次抽取是否「独立」。\n选 C：剩 2 蓝 2 绿，第二次蓝 = 2/4 = 1/2，不同于原来的 3/5，所以不独立。\nA 错：3/5 是有放回的情形，无放回时组成已变。\nB 错：2/5 是原来绿球比例；两次抽取也不互斥。\nD 错：数值对，但概率从 3/5 变成 1/2，恰说明不独立。",
                "prob-L10-q14":  "题意：偏骰 P(1)=1/5，2–6 各 4/25，求 P(偶数)；考各面「互斥」可相加，且不等可能。\n选 A：偶数 = 2、4、6，三面互斥，概率直接相加。\n算：P(偶) = 4/25 + 4/25 + 4/25 = 12/25\nB 错：1/2 = 3/6，把偏骰当成了等可能。\nC 错：3/5 = 15/25，每面多算了 1/25。\nD 错：13/25 是奇数：5/25 + 4/25 + 4/25。",
                "prob-L10-q15":  "题意：问「有利数 ÷ 总数」什么时候靠得住；考计数法的条件「等可能」。\n选 B：只有基本结果等可能时，数个数才等于算概率。\nA 错：互斥只保证能相加；不等可能时个数比不对。\nC 错：独立是乘法的条件，与数个数无关。\nD 错：偏骰六面也有限，但不能用 3/6 算偶数。",
                "prob-L10-q16":  "题意：一半人茶和咖啡都爱、一半都不爱，问咖啡 C 与茶 T 的关系；考是否「独立」。\n选 C：知道爱茶就一定爱咖啡，P(C) 从 1/2 升到 1，不独立。\n算：设 100 人：都爱 50，都不爱 50\n爱茶 50 人里爱咖啡 50 → P(C|T) = 50÷50 = 1 ≠ 1/2\nA 错：概率相等不说明独立。\nB 错：1/4 是当成独立乘出来的，实际是 1/2。\nD 错：依赖不等于因果，模型没说谁导致谁。",
                "prob-L10-q17":  "题意：知道草坪湿了，洒水器开过的概率上升，问能推出什么；考依赖与因果。\n选 A：概率被改变说明依赖（不独立），但下雨也能弄湿草坪，依赖本身定不了原因。\nB 错：湿草坪不会让洒水器打开，因果弄反了。\nC 错：概率已被改变，所以不独立；先后顺序不决定独立。\nD 错：洒水器开过和草坪湿能同时真，不互斥。",
                "prob-L10-q18":  "题意：准点概率 0.82，问何时不准点概率是 0.18；考补集规则的条件「互斥且穷尽」。\n选 D：准点与不准点不能同真、合起来又覆盖所有情况，才有 1 − 0.82 = 0.18。\nA 错：两者互斥，并不独立；补集也不靠独立。\nB 错：与以前是否延误无关。\nC 错：等可能会是各 0.5，题里明明不是。",
                "prob-L10-q19":  "题意：问哪个推理成立；考逻辑等价与概率的关系。\n选 A：等价的两句在每种情况下真假都相同，所以概率一定相同。\nB 错：概率相同不保证真假处处一致，如掷出 1 与掷出 2。\nC 错：经验上很确定不等于逻辑必然（永真式）。\nD 错：矛盾式概率是 0，不是 1/2。",
                "prob-L10-q20":  "题意：A 与 C 互斥，问能推出哪句；考互斥能否传给别的组合。\n选 B：A∧B 真时 A 必真，而 A 与 C 不能同真，所以 A∧B 与 C 也不能同真。\nA 错：B 是任意的，可能和 C 同时为真。\nC 错：概率为正的互斥事件不独立。\nD 错：A∨B 可以靠 B 为真，而 B 可能和 C 同真。"

{
    "mcq":  {
                "prob-L12-q01":  "题意：在本地生（domestic）里，住校内的占多少，即 Pr(校内|本地)。\n选 D：分母只数本地生 350+200=550，其中校内 350。\n算：本地生 350+200=550；其中校内 350；Pr=350÷550=7/11≈0.636\nA 错：350/1000 是「既本地又校内」占全体，分母错了。\nB 错：350/450 是 Pr(本地|校内)，方向反了。\nC 错：450/1000 是全体中住校内的比例 Pr(校内)。",
                "prob-L12-q02":  "题意：在住校内的学生里，本地生占多少，即 Pr(本地|校内)。\n选 C：分母只数校内生 350+100=450，其中本地 350。\n算：校内 350+100=450；其中本地 350；Pr=350÷450=7/9≈0.778\nA 错：350/550 是 Pr(校内|本地)，方向反了。\nB 错：550/1000 是全体中本地生的比例 Pr(本地)。\nD 错：200 是本地且住校外的人，不在校内。",
                "prob-L12-q03":  "题意：从 1000 人随机抽一个，他「既是本地生又住校内」的概率，即交集。\n选 A：交集的分母是全体：350÷1000=0.35。\nB 错：0.45 是全体中住校内的比例。\nC 错：约 0.636 是 Pr(校内|本地)，只除以了本地生。\nD 错：约 0.778 是 Pr(本地|校内)，只除以了校内生。",
                "prob-L12-q04":  "题意：Pr(校内)=0.45，本地生中住校内占 7/11，问两者是否独立（independent）。\n选 B：独立要求 Pr(校内|本地)=Pr(校内)；7/11≈0.636≠0.45。\nA 错：交集大于 0 说明不了独立，要比较两个概率。\nC 错：独立看数字是否相等，不看是不是同一群人。\nD 错：有 350 人既本地又校内，不互斥。",
                "prob-L12-q05":  "题意：「北岸居民里 10% 被喜鹊俯冲」写成符号是哪个概率。\n选 C：「北岸居民中」是条件，放竖线右边：Pr(S|N)=0.1。\nA 错：交集是「全体中既住北岸又被俯冲」，原句没说全体。\nB 错：Pr(N|S) 是「被俯冲者中住北岸的」，方向反了。\nD 错：Pr(S) 是全体被俯冲率，原句只说北岸。",
                "prob-L12-q06":  "题意：随机抽一个居民，他「既住北岸又被俯冲」的概率，即 Pr(N\u0026S)。\n选 A：100 人中北岸 30 人，10% 被俯冲即 3 人，占全体 0.03。\n算：设 100 人：北岸 30；其中被俯冲 30×0.1=3；Pr(N\u0026S)=3÷100=0.03\nB 错：0.10 是 Pr(S|N)，只在北岸人里算。\nC 错：0.30 是 Pr(N)，没管是否被俯冲。\nD 错：0.044 是全体被俯冲率，还加了南岸。",
                "prob-L12-q07":  "题意：两岸合起来，随机一个居民被俯冲的总概率 Pr(S)（全概率）。\n选 C：两岸被俯冲的人数相加：3+1.4=4.4 人/100 人。\n算：设 100 人：北岸 30→30×0.1=3；南岸 70→70×0.02=1.4；共 4.4，Pr(S)=0.044\nA 错：0.06 是 10% 与 2% 简单平均，没按人数加权。\nB 错：0.12 是 10%+2% 直接相加。\nD 错：0.03 只算了北岸被俯冲的人。",
                "prob-L12-q08":  "题意：为什么不能把两岸俯冲率 10% 和 2% 平均成 6%。\n选 D：北岸只占 30%、南岸 70%，人数不同，要按人数加权。\n算：设 100 人：北岸 3 人被俯冲，南岸 1.4 人，共 4.4 人 → 4.4%，不是 6%\nA 错：条件概率乘上组的比例后就能相加（全概率）。\nB 错：问题和独立无关，是两组大小不同。\nC 错：2% 是「南岸居民中」的比例，是条件概率。",
                "prob-L12-q09":  "题意：已知 D、S 的概率和交集，求「S 发生时 D 的概率」Pr(D|S)。\n选 A：交集 ÷ 条件：0.1÷0.3=1/3。\n算：设 100 人：S 有 30 人，其中也是 D 的 10 人；Pr(D|S)=10÷30=1/3\nB 错：0.2 是「S 但非 D」的比例 Pr(~D\u0026S)。\nC 错：0.1 是交集 Pr(D\u0026S)，没除以 Pr(S)。\nD 错：0.5 是 Pr(D)，忽略了条件 S。",
                "prob-L12-q10":  "题意：求「既不是 D 也不是 S」的概率 Pr(~D\u0026~S)。\n选 C：用列联表相减，剩下那格是 30 人。\n算：设 100 人：D\u0026S=10；D 非 S=50−10=40；S 非 D=30−10=20；都不是=100−10−40−20=30\nA 错：0.35=0.5×0.7 是默认独立相乘，题目没说独立。\nB 错：0.7 是 Pr(~S)，所有不是 S 的人。\nD 错：0.2 是 Pr(~D\u0026S)，读错了格子。",
                "prob-L12-q11":  "题意：A=春或夏，B=夏或秋，判断是否互斥（不能同时发生）、是否独立。\n选 B：夏天两者同时成立，不互斥；Pr(A|B)=1/2=Pr(A)，独立。\n算：设 4 人各生一季：B 有夏、秋 2 人；其中属 A 的只有夏 1 人；Pr(A|B)=1/2=Pr(A)\nA 错：生在夏天时 A、B 同时成立，不互斥。\nC 错：Pr(A|B)=Pr(A)=1/2，是独立的。\nD 错：不互斥；而且两者确实独立。",
                "prob-L12-q12":  "题意：有人把 Pr(A|B) 算成 1.5（大于 1），问错在哪。\n选 B：分子应是「A 且 B」=只有夏天 1/4，他用了「或」=3/4。\n算：正确：Pr(A\u0026B)=1/4，Pr(B)=1/2，Pr(A|B)=(1/4)÷(1/2)=1/2\nA 错：求 Pr(A|B)，分母就该是 Pr(B)。\nC 错：题目说四季等可能，1/4 没错。\nD 错：概率不能超过 1，算出 1.5 必有错。",
                "prob-L12-q13":  "题意：A、B 不能同时发生（互斥）且概率都大于 0，哪条一定成立。\n选 C：互斥则 Pr(A|B)=0，而 Pr(A)\u003e0，两者不等，所以不独立。\nA 错：互斥正是强依赖：B 发生就排除了 A。\nB 错：Pr(A|B)=0，不等于 Pr(A)。\nD 错：B 发生时 A 不可能发生，Pr(A|B)=0 不是 1。",
                "prob-L12-q14":  "题意：以一定成立的永真式（tautology）T 为条件，A 的概率 Pr(A|T) 是多少。\n选 A：T 不排除任何情形，等于没给信息：0.2÷1=0.2。\nB 错：1 是 Pr(T)，不是 Pr(A|T)。\nC 错：A 和 T 可以同时成立，交集是 0.2 不是 0。\nD 错：Pr(T)=1\u003e0，有定义；无定义的是以矛盾式为条件。",
                "prob-L12-q15":  "题意：以不可能成立的矛盾式（contradiction）F 为条件，Pr(A|F) 是多少。\n选 D：Pr(F)=0，公式成了 0/0，按标准定义无定义。\nA 错：分母为 0 就不能算，0/0 不是 0。\nB 错：0/0 也不是 1。\nC 错：0.2 是以永真式为条件的结果。",
                "prob-L12-q16":  "题意：交集 Pr(A\u0026B) 什么时候恰好等于条件概率 Pr(A|B)。\n选 B：Pr(A|B)=Pr(A\u0026B)÷Pr(B)，要相等需 Pr(B)=1 或 Pr(A\u0026B)=0。\nA 错：漏了交集为 0 的情况（0÷Pr(B)=0）。\nC 错：独立时 Pr(A|B)=Pr(A)，一般不等于 Pr(A)Pr(B)。\nD 错：上面两种情况都会相等。",
                "prob-L12-q17":  "题意：人数表里算出 1.4 个人，这张表还能用吗。\n选 B：人数表只是比例模型；换成 1000 人就是 14 人，概率不变。\nA 错：小数人数不影响结果，表和公式是同一套乘法。\nC 错：四舍五入成 1 人会引入误差，总数变成 4 人。\nD 错：1.4 就是 70×0.02，数据没问题。",
                "prob-L12-q18":  "题意：Pr(A|B) 和 Pr(B|A) 是什么关系。\n选 D：分子都是 Pr(A\u0026B)，分母分别是 Pr(B)、Pr(A)，一般不等。\n算：校园表：Pr(校内|本地)=350÷550≈0.636；Pr(本地|校内)=350÷450≈0.778\nA 错：分子相同，分母不同，所以通常不等。\nB 错：谁大取决于 Pr(A)、Pr(B) 谁小，不固定。\nC 错：方向不同只是分母不同，和因果无关。",
                "prob-L12-q19":  "题意：2×2 列联表（contingency table）的行、列合计告诉你什么。\n选 C：边际（margin）是单个类别的总数，如本地生共 550 人。\nA 错：条件概率要用格子 ÷ 合计才得到。\nB 错：交集人数在表中间的格子里。\nD 错：判断独立还要拿格子和合计比较，光看合计不够。",
                "prob-L11-q20":  "题意：A、B 各只出现 10 次，其中 8 次一起出现，问 Pr(A|B)。\n选 D：只看含 B 的 10 条，其中 8 条也有 A：8÷10=0.8。\n算：1000 条记录：含 B 的 10 条；其中也含 A 的 8 条；Pr(A|B)=8÷10=0.8\nA 错：0.008 是交集 8/1000，没除以 B 的条数。\nB 错：0.01 是 Pr(A)，忽略了条件 B。\nC 错：条件概率只需数数，不需要因果信息。",
                "prob-L11-q21":  "题意：2 阶马尔可夫（order-2 Markov）文本生成器在做什么。\n选 A：根据前两个词，给下一个词分配条件概率。\nB 错：阶数是条件里的词数，不是一次输出几个词。\nC 错：它用整个词表，不是只用最常见的两个词。\nD 错：它只看最近两个词，不看全部前文。",
                "prob-L11-q22":  "题意：词表 100 个词，2 阶马尔可夫完整表约多少条目（n^(k+1)）。\n选 C：n=100，k=2：100³=1,000,000。\n算：前两个词的组合 100×100=1 万种；每种后接 100 个词；共 100³=100 万\nA 错：200=100×2，把乘方当成乘法。\nB 错：10,000=100²，是 1 阶的表。\nD 错：100,000,000=100⁴，是 3 阶的表。",
                "prob-L11-q23":  "题意：手机根据前面那句话推荐 shops，它比较的是哪个量。\n选 D：给定前面的词，下一个词是 shops 的概率：Pr(shops|前文)。\nA 错：Pr(shops) 只是总体频率，不看上下文。\nB 错：Pr(前文|shops) 方向反了。\nC 错：除以词表大小没有意义，不是条件概率。",
                "prob-L16-q24":  "题意：T=疲倦，I=烦躁。问 Pr(T|I) 这个符号读作什么意思。\n选 B：竖线右边 I 是已知：只看烦躁的时刻，问其中疲倦的比例。\nA 错：「已知疲倦问烦躁」是 Pr(I|T)，方向反了。\nC 错：「既疲倦又烦躁」是交集 Pr(T\u0026I)。\nD 错：「既不疲倦也不烦躁」是 Pr(¬T\u0026¬I)。",
                "prob-L16-q25":  "题意：已知你现在很烦躁（I），问你疲倦（T）的可能性，即 Pr(T|I)。\n选 C：在所有烦躁的时刻里，数疲倦的占几成。\n算：设 100 个时刻：疲倦 40，不疲倦 60\n烦躁：疲倦里 40×0.8=32，不疲倦里 60×0.1=6，共 38\nPr(T|I) = 32 ÷ 38 = 16/19 ≈ 84.2%\nA 错：40% 是没看证据前的先验 Pr(T)。\nB 错：32% 是「既疲倦又烦躁」，没除以烦躁总数 38。\nD 错：80% 是 Pr(I|T)，方向反了。",
                "prob-L16-q26":  "题意：遇到一个人，他晒太阳没烧起来（¬I），问他是吸血鬼的可能性 Pr(V|¬I)。\n选 A：在所有「不烧」的人里，数吸血鬼占几个。\n算：设 10000 人：吸血鬼 100，人类 9900\n不烧：吸血鬼里 100×1%=1，人类里 9900 全不烧，共 9901\nPr(V|¬I) = 1 ÷ 9901\nB 错：1/100 是先验，没用「不烧」这个证据。\nC 错：1/10000 是交集，没除以不烧总数 9901。\nD 错：99/100 是 Pr(I|V)，方向和否定号都错。",
                "prob-L16-q27":  "题意：一片药检测阳性（P），问它真含 MDMA（M）的可能性，即 Pr(M|P)。\n选 D：在所有阳性药片里，数真药占几成。\n算：设 1000 片：真药 750，假药 250\n阳性：真药里 750×0.5=375，假药里 250×0.4=100，共 475\nPr(M|P) = 375 ÷ 475 = 15/19 ≈ 78.9%\nA 错：50% 是「真药测出阳性」Pr(P|M)，方向反了。\nB 错：75% 是先验，没用阳性这个证据。\nC 错：假药也有 100 片阳性，不能 100% 确定。",
                "prob-L16-q28":  "题意：检测对真药、假药阳性率一样。75% 是真药，阳性后真药的可能性 Pr(M|P)？\n选 C：两组阳性比例相同，阳性里真假之比仍是 3:1，等于先验 75%。\n算：设 1000 片、阳性率都取 50%：真药 750×0.5=375，假药 250×0.5=125\nPr(M|P) = 375 ÷ 500 = 75%（阳性率换成别的数也一样）\nA 错：假药也会阳性，不能确定。\nB 错：以为「阳性率一半」结论就变一半。\nD 错：不知道阳性率具体是多少也能算，结果都是 75%。",
                "prob-L16-q29":  "题意：假药永远不会阳性（假阳性 0%）。一片药阳性，问它是真药的可能性 Pr(M|P)。\n选 C：阳性的药片全是真药，所以是 100%。\n算：设 1000 片：真药 750×0.5=375 阳性，假药 250×0=0 阳性\nPr(M|P) = 375 ÷ (375+0) = 1\nA 错：50% 是真阳性率 Pr(P|M)，不是所求。\nB 错：75% 是先验，没用阳性这个证据。\nD 错：87.5% 没有任何算式依据。",
                "prob-L16-q30":  "题意：同一试剂，但只有 10% 是真药。一片阳性，问它是真药的可能性 Pr(M|P)。\n选 B：真药太少，阳性的大多是假药，后验只有约 12%。\n算：设 1000 片：真药 100，假药 900\n阳性：真药里 100×0.5=50，假药里 900×0.4=360，共 410\nPr(M|P) = 50 ÷ 410 = 5/41 ≈ 12.2%\nA 错：50% 是真阳性率 Pr(P|M)。\nC 错：78.9% 是真药占 75% 时的答案。\nD 错：10% 是先验，没用阳性这个证据。",
                "prob-L16-q31":  "题意：哪一对概率加起来一定等于 1？\n选 B：都是「真药」这一组里，阳性的比例 + 阴性的比例 = 全组 = 1。\n算：例：750 片真药里 375 阳性、375 阴性，0.5 + 0.5 = 1\nA 错：一个看真药组、一个看假药组，如 0.5+0.4≠1。\nC 错：方向相反的两个条件概率，没有相加关系。\nD 错：阳性率和先验是两回事，没有相加关系。",
                "prob-L16-q32":  "题意：吸血鬼题里，遇到的人「没烧起来」，应该求哪个量？\n选 C：已知的是「不烧」¬I，要问的是吸血鬼 V，所以是 Pr(V|¬I)。\nA 错：漏了否定号，这是「烧起来」时的情况。\nB 错：Pr(¬I|V) 是「吸血鬼不烧」，方向反了。\nD 错：这是「既是吸血鬼又会烧」，且证据也错。",
                "prob-L16-q33":  "题意：贝叶斯分母 Pr(E) 为什么要拆成「H 那条 + ¬H 那条」两项相加？\n选 D：人要么属于 H 组要么属于 ¬H 组，有证据的总人数 = 两组里有证据的人相加。\n算：例：烦躁总数 38 = 疲倦组 32 + 不疲倦组 6\nA 错：E 和 H 一般不独立，否则证据就没用了。\nB 错：两个比例来自不同组，如 0.8+0.1≠1。\nC 错：两项各乘 Pr(H)、Pr(¬H)，先验没算两次。",
                "prob-L16-q34":  "题意：千分之一的人有病，某人检测阳性，问他真有病的可能性 Pr(D|+)。\n选 C：病太少，健康人里的假阳性远多于真病人，后验只有约 2%。\n算：设 10 万人：病人 100，健康 99900\n阳性：病人里 100×0.99=99，健康里 99900×0.05=4995，共 5094\nPr(D|+) = 99 ÷ 5094 ≈ 1.9%\nA 错：99% 是「有病测出阳性」Pr(+|D)，方向反了。\nB 错：95% 是健康人测出阴性的比例，与所求无关。\nD 错：5% 是假阳性率，不是所求。",
                "prob-L16-q35":  "题意：硬币选罐，放回抽两次都黑，问当初硬币是正面（选了 X 罐）的可能性。\n选 C：X 罐黑球多，两黑在 X 罐出现得多得多。\n算：设玩 32 轮：正面 16 轮（X），反面 16 轮（Y）\n两黑：X 里 16×9/16=9 轮，Y 里 16×1/16=1 轮，共 10\nPr(X|两黑) = 9 ÷ 10\nA 错：1/2 是先验，没用两黑这个证据。\nB 错：3/4 是只抽到一个黑球时的答案。\nD 错：1/10 是选了 Y 罐的可能性。",
                "prob-L16-q36":  "题意：同样的罐子，放回抽到「先黑后白」，问是正面（X 罐）的可能性。\n选 B：先黑后白在两罐里一样常见，证据分不出罐子，仍是 1/2。\n算：设玩 32 轮：X 16 轮，Y 16 轮\n先黑后白：X 里 16×(3/4×1/4)=3，Y 里 16×(1/4×3/4)=3，共 6\nPr(X|黑白) = 3 ÷ 6 = 1/2\nA 错：只看了黑球，忘了还有一个白球。\nC 错：9/10 是抽到两黑时的答案。\nD 错：两罐一样常见，不会偏向 Y。",
                "prob-L16-q37":  "题意：课上对「睡美人问题」持什么态度？\n选 A：课上讲成有争议的难题：数硬币结果得 1/2，数醒来次数得 1/3。\nB 错：课上没说 1/2 无可争议。\nC 错：课上没说 1/3 无可争议。\nD 错：硬币始终公平，醒几次不改变硬币。",
                "prob-L16-q38":  "题意：按「三分之一派」（thirder），睡美人醒来时该认为反面的概率是多少？\n选 C：数醒来次数，反面的醒来占 2/3。\n算：抛 100 次：正面 50 次各醒 1 次=50，反面 50 次各醒 2 次=100\n反面 = 100 ÷ 150 = 2/3\nA 错：1/3 是正面的概率，对调了。\nB 错：1/2 是二分之一派（halfer）的答案。\nD 错：正面也会醒来，反面不是必然。",
                "prob-L16-q39":  "题意：「得 H 病的人几乎都有症状 E，所以有 E 的人几乎肯定得 H」错在哪？\n选 A：把 Pr(E|H) 当成 Pr(H|E)，忽视 H 很少见、别的原因也常产生 E。\n算：例：1000 人里病人 10 个全有 E，健康 990 人中 10% 有 E=99；Pr(H|E)=10÷109≈9%\nB 错：论证没有假设 E 和 H 互斥。\nC 错：问题在条件方向弄反，不是该用交集。\nD 错：Pr(E|H) 再高，H 罕见时后验仍可很低。",
                "prob-L16-q40":  "题意：先验和真阳性率不变，改哪一项能让「阳性」更能说明是真药？\n选 B：假药阳性越少，阳性里真药占比越高，证据越强。\n算：1000 片（真 750）：假阳性 40%→真 375：假 100，约 79%；5%→375：12.5，约 97%\nA 错：假阳性越多，阳性越说明不了问题。\nC 错：两者相加为 1 没有特殊意义。\nD 错：两者相等时证据毫无信息，后验=先验。",
                "prob-L16-q41":  "题意：用群体特征当证据的算法会误判个人，按贝叶斯看主要风险是什么？\n选 A：公式没错，但输入的先验或条件概率估错，算出的个人后验就错。\nB 错：贝叶斯定理对算法同样适用。\nC 错：算法用了证据，问题是输入数字不对。\nD 错：有证据时后验一般不等于先验。",
                "prob-L18-q42":  "题意：投 $1M，最好情形拿回 $4M，净赚多少（净结果=回款−投入）。\n选 B：4−1=+$3M。\nA 错：亏 $1M 是另外两种情形的净结果。\nC 错：$4M 是回款，没扣投入。\nD 错：4+1，把投入加上去了。",
                "prob-L18-q43":  "题意：投 $1M，按三种结果的概率求平均净得失（期望净值）。\n选 B：每种结果的净值 × 概率再相加，得 −0.68。\n算：2/25×(+3)=+6/25；8/25×(−1)=−8/25；15/25×(−1)=−15/25；合计 −17/25=−0.68（平均每次亏 0.68M）\nA 错：+0.32 是期望回款 2/25×4，没扣投入 $1M。\nC 错：−1 只是失败时的净值，忽略了 +3 那项。\nD 错：+0.24 只算了最好情形 2/25×3，漏了亏损项。",
                "prob-L18-q44":  "题意：投 $5M，三种结果回款 20、4、0，求期望净值。\n选 B：净值分别 +15、−1、−5，乘概率相加得 −2.12。\n算：2/25×15=30/25；8/25×(−1)=−8/25；15/25×(−5)=−75/25；合计 −53/25=−2.12\nA 错：+2.88 是期望回款，没扣投入 $5M。\nC 错：−5 只是坏主意时的净值。\nD 错：−0.68 是投 $1M 时的结果。",
                "prob-L18-q45":  "题意：付 $6 玩一次，正面得 $10、反面 $0，平均每次净赚多少。\n选 C：期望回款 $5，减票价 $6，平均亏 $1。\n算：正面 10×1/2=5；反面 0×1/2=0；期望回款 5；净 5−6=−1\nA 错：$5 是期望回款，没扣 $6。\nB 错：$4 是正面时的净赚 10−6，没算反面。\nD 错：−6 是反面时的净亏，没算正面。",
                "prob-L18-q46":  "题意：票价定多少，玩家平均不赚不亏（公平价格，fair price）。\n选 C：公平价格=期望回款=10×1/2+0×1/2=$5。\nA 错：$0 时玩家平均净赚 $5，不公平。\nB 错：$2.50 把期望回款又减了一半。\nD 错：$10 是最好结果，玩家平均亏 $5。",
                "prob-L18-q47":  "题意：有人算 $5 票的期望净收益得 −5，错在哪。\n选 B：每项里已减过 5，最后又减 5，成本扣了两次。\n算：正确：1/2×(10−5)+1/2×(0−5)=2.5−2.5=0\nA 错：公平价格下期望净收益应是 0，不是 −5。\nC 错：成本是付出去的钱，该减，只是只减一次。\nD 错：期望值就是「概率×结果」逐项相加，没错。",
                "prob-L18-q48":  "题意：付公平价格 $5 玩一次，这一次实际会怎样。\n选 D：平均净收益 0，但单次要么 +5（正面）要么 −5（反面）。\nA 错：「公平」只说平均为 0，单次不会正好持平。\nB 错：期望回款是 $5，扣票价后平均净赚 0。\nC 错：公平与玩几次无关，每次期望净收益都是 0。",
                "prob-L18-q49":  "题意：回款不变，票价高于公平价格，会怎样。\n选 A：期望净收益=期望回款−票价\u003c0，差额是庄家优势（house edge）。\nB 错：只有票价等于公平价格时才是 0。\nC 错：票价不影响硬币或骰子的概率。\nD 错：回款没变，期望回款也不变。",
                "prob-L18-q50":  "题意：马丁格尔（Martingale，输了就加倍）最大的现实风险是什么。\n选 B：连输时下注指数增长，钱或下注上限会先用完。\n算：首注 $1，连输 10 次后下一注要 2¹⁰=$1024\nA 错：硬币没有记忆，概率不会变。\nC 错：加倍不改变下一次输赢的概率。\nD 错：赢一次也只净赚首注 $1，还可能撑不到赢。",
                "prob-L18-q51":  "题意：首注 $1，连输 6 次后第 7 注赢了，总共净赚多少。\n选 C：前面共亏 63，第 7 注押 64 赢 64，净 +1。\n算：已亏 1+2+4+8+16+32=63；第 7 注押 64 赢回 64；64−63=+1\nA 错：$64 是第 7 注赢的钱，没减前面亏的 63。\nB 错：$63 是之前的总亏损。\nD 错：127 是把 63 和 64 加在一起。",
                "prob-L18-q52":  "题意：公平硬币已连出 6 次反面，下一次正面的概率是多少。\n选 B：各次独立，硬币没有记忆，仍是 1/2。\nA 错：以为反面有「手感」；过去结果不影响下一次。\nC 错：这是赌徒谬误（gambler\u0027s fallacy），正面不会「该来了」。\nD 错：连串不必结束，下一次仍可能是反面。",
                "prob-L18-q53":  "题意：公平硬币连续 8 次正面的概率。\n选 C：每次 1/2，独立相乘：(1/2)⁸=1/256。\nA 错：1/8 是把 8 次当成 8 选 1。\nB 错：1/16=(1/2)⁴，只算了 4 次。\nD 错：1/512=(1/2)⁹，多算了一次。",
                "prob-L18-q54":  "题意：Pr(F|FFF) 在问什么。\n选 A：竖线右边是条件：已知前三次按 F，下一次按 F 的概率。\nB 错：那是 Pr(FFF)，没有条件。\nC 错：概率不是次数。\nD 错：方向反了，那是「给定 F，后面接三次 F」。",
                "prob-L18-q55":  "题意：随机拿一枚硬币（A、B 各 1/2），还没抛，抛出正面的总概率 Pr(H)。\n选 C：两组正面次数相加：100 次里 37.5+7.5=45 次。\n算：设 100 次选币：A 50 次，B 50 次；正面：A 50×0.75=37.5，B 50×0.15=7.5，共 45；Pr(H)=0.45\nA 错：0.15 只是 B 的正面率。\nB 错：0.30 不是按人数加权的结果，正确是 45÷100。\nD 错：0.90 是 0.75+0.15 直接相加，没按 1/2 加权。",
                "prob-L18-q56":  "题意：抛一次见到正面，问手里是硬币 A 的概率 Pr(A|H)。\n选 D：全部正面里 A 占 37.5÷45=5/6。\n算：设 100 次选币：A 50，B 50；正面：A 37.5，B 7.5，共 45；Pr(A|H)=37.5÷45=5/6\nA 错：1/6 是 Pr(B|H)，问反了。\nB 错：1/2 是看结果之前的先验。\nC 错：3/4 是 Pr(H|A)，方向反了。",
                "prob-L18-q57":  "题意：看到正面后，什么变了、什么没变。\n选 D：变的是「手里是 A」的判断（1/2→5/6），A 本身正面率仍是 0.75。\n算：设 100 次选币：正面共 45 次，其中 A 占 37.5，即 5/6\nA 错：硬币的物理偏向不会因为被看见而改变。\nB 错：B 仍有 0.15 的正面率，只是可能性变小了。\nC 错：硬币未知时，结果带有「是哪枚硬币」的信息。",
                "prob-L18-q58":  "题意：用种子（seed）加固定规则生成的「随机数」有什么性质。\n选 A：规则固定，同一种子一定重现同一串数字（伪随机）。\nB 错：知道种子和规则就能完全预测。\nC 错：每个数由规则算出，和「重复概率」无关。\nD 错：伪随机序列照样会出现连串。",
                "prob-L18-q59":  "题意：游戏期望值 $5 是什么意思。\n选 C：玩很多次后，平均每次得到的接近 $5。\nA 错：单次可能是 $10 或 $0，不一定正好 $5。\nB 错：期望值不一定是最可能的结果，甚至可能根本拿不到。\nD 错：期望值是平均数，不是中位数。"
            },

                                      "s":  [

                                                "做什么：只看国际生（~B），数其中住校内的。\n算：国际生 100+350=450；100÷450=2/9≈0.2222\n意思：国际生里只有约 22% 住校内。"

                                                "做什么：只看非 S 的人，算其中 D 的比例。\n算：非 S=40+30=70；40÷70=4/7≈0.5714\n意思：70 个非 S 的人里 40 个是 D。"

                                      "trap":  "用 0.5×0.7=0.35 填格，等于默认独立；题目没说独立。"

                 "prob-L12-c04":  {
                                      "explain":  "题意：北岸 30%（其中 10% 被俯冲），南岸 70%（2%）。求总俯冲率 Pr(S)，及被俯冲者住北岸的概率 Pr(N|S)。\n思路：设 1000 人分两岸数被俯冲人数，相加，再北岸 ÷ 总数。",
                                      "s":  [
                                                "做什么：数「住北岸且被俯冲」的人。\n算：设 1000 人：北岸 300，300×0.1=30 → 0.03\n意思：1000 人里 30 人住北岸又被俯冲。",
                                                "做什么：数「住南岸且被俯冲」的人。\n算：南岸 700，700×0.02=14 → 0.014\n意思：1000 人里 14 人住南岸又被俯冲。",
                                                "做什么：两岸被俯冲的人相加（全概率）。\n算：30+14=44 → 44÷1000=0.044\n意思：全体里 4.4% 被俯冲。",
                                                "做什么：只看被俯冲的 44 人，数住北岸的。\n算：30÷44=15/22≈0.6818\n意思：被俯冲的人里约 68% 来自北岸。"
                                            ],
                                      "trap":  "把 10% 和 2% 平均成 6%；或把 Pr(S|N)=0.1 当成 Pr(N|S)。"
                                  },
                 "prob-L12-c05":  {
                                      "explain":  "题意：北岸 40%；北岸 15%、南岸 5% 被俯冲。求总俯冲率 Pr(S)，及被俯冲者住北岸的概率 Pr(N|S)。\n思路：设 100 人分两岸数被俯冲人数，相加，再北岸 ÷ 总数。",
                                      "s":  [
                                                "做什么：数北岸被俯冲的人。\n算：设 100 人：北岸 40，40×0.15=6 → 0.06\n意思：100 人里 6 人住北岸又被俯冲。",
                                                "做什么：数南岸被俯冲的人。\n算：南岸 60，60×0.05=3 → 0.03\n意思：100 人里 3 人住南岸又被俯冲。",
                                                "做什么：两岸相加（全概率）。\n算：6+3=9 → 0.09\n意思：全体里 9% 被俯冲。",
                                                "做什么：只看被俯冲的 9 人，数住北岸的。\n算：6÷9=2/3≈0.6667\n意思：被俯冲的 9 人里 6 人来自北岸。"
                                            ],
                                      "trap":  "南岸占 1−0.4=0.6，别用 0.4；最后除以 9，不是除以 100。"
                                  },
                 "prob-L12-c06":  {
                                      "explain":  "题意：200 名学生按是否上复习课、是否及格分四格。求及格率、上课者及格率、没上课者及格率，判断是否独立。\n思路：先数及格总数，再分别只看上课、没上课的人。",
                                      "s":  [
                                                "做什么：数及格（A）的总人数。\n算：60+20=80；80÷200=0.4\n意思：200 人里 80 人及格。",
                                                "做什么：只看上课的人（B），数及格的。\n算：上课 60+40=100；60÷100=0.6\n意思：上课的 100 人里 60 人及格。",
                                                "做什么：只看没上课的人（~B），数及格的。\n算：没上课 20+80=100；20÷100=0.2\n意思：没上课的 100 人里只有 20 人及格。"

                                      "trap":  "0.6≠0.4，所以不独立；但这不证明复习课导致及格。"

                                      "explain":  "题意：马丁格尔：从 $1 起，输了就加倍。连输 6 次后，求总亏、下一注、第 7 注赢后的净结果、连输 6 次的概率。\n思路：加总前 6 注，再翻倍，赢回减已亏，最后 (1/2)⁶。",

                                                "做什么：第 7 注赢后的总净结果。\n算：赢 64 − 已亏 63=+1\n意思：冒 $64 的险，只为净赚首注 $1。",
                                                "做什么：算连输 6 次的概率。\n算：(1/2)⁶=1/64≈0.015625\n意思：约每 64 轮就有 1 轮连输 6 次，并不罕见。"

                                                "做什么：用新比例算同一枚再抛出正面。\n算：设 60 次见到正面：A 50 次→再正面 37.5，B 10 次→再正面 1.5；共 39÷60=0.65\n意思：同一枚再抛，正面概率升到 0.65。",

{"mcq":{
"soc-L1-q01":"选 C：JTB 只有真、信、辩护三条，“确定无疑、不可怀疑”不在其中。\nA 错：相信 P 是三条之一。\nB 错：有辩护是三条之一。\nD 错：P 为真是三条之一。",
"soc-L1-q02":"选 C：Verna 案中真、信、辩护都满足却不是知识，说明 JTB 不充分。\nA 错：它不是怀疑论，不说我们一无所知。\nB 错：知识仍要求真（事实性）。\nD 错：它攻击充分性，不说辩护不必要。",
"soc-L1-q03":"选 B：信念只是碰巧为真，使它为真的不是她证据所指的那个人。\nA 错：Colin 真在悉尼，信念是真的。\nC 错：题设是正常光线、看得清楚。\nD 错：她确实相信 Colin 在悉尼。",
"soc-L1-q04":"选 D：没注册就不可能通过（必要），但注册不保证通过（不充分）。\nA 错：它是必要条件。\nB 错：把必要和充分弄反了。\nC 错：注册了也可能挂科，不充分。",
"soc-L1-q05":"选 D：前提说学习是通过的必要条件，结论却当它是充分条件。\nA 错：这里不涉及真与有效的区分。\nB 错：方向反了，是必要被当充分。\nC 错：推理里没有涉及证言。",
"soc-L1-q06":"选 B：事实性：知道 P 蕴含 P 为真，K(P) → P。\nA 错：这是逆命题，P 真不等于你知道。\nC 错：知识不要求能证明 P。\nD 错：有好证据的信念仍可能为假。",
"soc-L1-q07":"选 A：逻辑只查推理结构；前提是否可靠是另一个认识论问题。\nB 错：社会认识论关心前提来源，不只逻辑形式。\nC 错：前提假的论证也可以有效。\nD 错：有效只保证前提真则结论真。",
"soc-L2-q01":"选 C：两盒派问的是选择能因果地造成什么：钱已放好，改变不了。\nA 错：题中不涉及人群里的比例。\nB 错：“选择是什么的证据”是一盒派思路。\nD 错：与证言可靠性无关。",
"soc-L2-q02":"选 C：预测者随机时，选择不带证据，多拿 A 总是多 $1000。\nA 错：拿两盒总多 $1000，有差别。\nB 错：随机预测下选择已不是证据。\nD 错：两盒都不拿什么也得不到。",
"soc-L3-q01":"选 A：Clifford 原则：任何时候、任何地方、任何人，证据不足而信都是错的。\nB 错：按风险选择信念是 James 的思路。\nC 错：这是 Clifford 要反驳的反对意见。\nD 错：Clifford 说的是道德上错，不只是不明智。",
"soc-L3-q02":"选 B：Clifford 评价信念的依据，不看结果；船平安到达他仍有罪。\nA 错：Clifford 认为信念本身就有罪。\nC 错：碰巧为真不等于有权相信。\nD 错：没人受伤也洗白不了不负责的信念。",
"soc-L3-q03":"选 D：P2 太强：有些信念似乎私人、琐碎、不影响行动，是 James 的攻击点。\nA 错：P1、P2 若真，C 确实推得出。\nB 错：几乎人人接受不伤害他人的义务。\nC 错：P2 很有争议，论证不是无争议可靠。",
"soc-L3-q04":"选 D：“信念可自由选择”偏向 James 意志主义，不是 Clifford 的回应。\nA 错：信念会传播，是 Clifford 的回应。\nB 错：轻信成坏习惯，是 Clifford 的回应。\nC 错：信念导致行动，是 Clifford 的回应。",
"soc-L3-q05":"选 D：两种面包你都会考虑（活）、必须选一种（被迫），但不改变人生（不重大）。\nA 错：它是活的，也是被迫的。\nB 错：选面包不是重大选项。\nC 错：它不重大，而且是活的。",
"soc-L3-q06":"选 A：被迫选项无法悬置：一直拖着不选，实际就等于选了“不去”。\nB 错：上大学对他是活的选项，且活与被迫无关。\nC 错：证据并没有决定这个问题。\nD 错：上不上大学并不琐碎。",
"soc-L3-q07":"选 B：自我实现信念：证据不足时相信能跳过，会帮自己成真，所以无害。\nA 错：这正是反对“无决定性证据不行动”。\nC 错：例子说明自信有时是合理的。\nD 错：信念只可能是必要条件，不是充分条件。",
"soc-L3-q08":"选 A：门槛越严，假信念越少，但越可能错过真相。\nB 错：那是宽松门槛的结果。\nC 错：严门槛不会让真相变多。\nD 错：任何门槛都无法同时避免两种错误。",
"soc-L3-q09":"选 D：教授批评 James 没回应 Clifford 的 P1：不伤害他人的义务。\nA 错：James 不同意信念总要与证据相称。\nB 错：教授没说归谬在逻辑上无效。\nC 错：James 不允许信 2+2=5。",
"soc-L3-q10":"选 D：原则须先于权衡证据被接受，本身无充分证据，按自身标准相信它是错的。\nA 错：自我实现信念是另一个论证。\nB 错：原则针对任何信念，不只宗教。\nC 错：归谬说的恰恰是它没有充分证据。",
"soc-L5-q01":"选 A：本课的证言是广义的：书、照片、新闻、纪录片和口头报告都算。\nB 错：不限于面对面口头讲述。\nC 错：不限于法庭宣誓证词。\nD 错：不限于经认证的专家。",
"soc-L5-q02":"选 C：Hardwig：外行可因承认的专家相信 P 而有辩护，即使没有专家的证据。\nA 错：依赖专家不等于专家永远正确。\nB 错：Hardwig 认为不必亲自验证一切。\nD 错：他的核心正是证言能提供辩护。",
"soc-L5-q03":"选 C：证言把相信诊断的辩护传给病人，但不传底层证据。\nA 错：辩护确实被传递了。\nB 错：病人没拿到显微镜证据。\nD 错：证言不带来确定无疑。",
"soc-L5-q04":"选 A：证言链必须落在真实证据上；源头是乱填的，整条链的辩护崩溃。\nB 错：病人的辩护来自同一条链，也崩溃。\nC 错：权威不能让诊断变真。\nD 错：链长不能弥补源头没证据。",
"soc-L5-q05":"选 D：理性服从因相关专业能力而依赖，专家判断最终要连到证据。\nA 错：因地位服从是盲从。\nB 错：两者在依据上不同。\nC 错：理性服从仍可提问、要第二意见。",
"soc-L5-q06":"选 B：各领域都彻底自主，会让人知道得更少、更不可靠。\nA 错：例子正是反对处处追求自主。\nC 错：例子没否认数学是知识来源。\nD 错：课本属于广义证言。",
"soc-L5-q07":"选 C：没人能独立解释全部，挑战了“个人是首要知识主体”的认识论个人主义。\nA 错：与知识的事实性无关。\nB 错：合作里恰恰有很多专家。\nD 错：与 Clifford 的证据主义无关。",
"soc-L5-q08":"选 A：AI 错了也能流畅自信，切断了“流畅 = 专业”的联系。\nB 错：AI 没让过往记录变得完全可靠。\nC 错：AI 并不总是拒绝技术问题。\nD 错：AI 没有废除资格认证。",
"soc-L7-q01":"选 C：火警是显著的外部刺激，抓走所有人的注意，是外源注意。\nA 错：选择偏差是关于样本的，不是注意。\nB 错：内源注意是主动按目标定向。\nD 错：幸存者偏差关于被筛掉的数据。",
"soc-L7-q02":"选 B：选择性注意：专注任务时，显眼的无关信息也会被压制。\nA 错：漏看不说明视力差。\nC 错：观众没有撒谎，是真没看见。\nD 错：大猩猩清楚可见。",
"soc-L7-q03":"选 D：发动机弹孔少，是因为那里中弹的飞机回不来，应加固发动机。\nA 错：数据有偏，但可以纠正后使用。\nB 错：随机加固浪费了缺失数据里的信息。\nC 错：那些部位中弹后仍能返航。",
"soc-L7-q04":"选 A：样本完全随机，问题在问题措辞诱导回答（诱导式民调）。\nB 错：没有案例被筛选淘汰。\nC 错：抽样随机，不是选择偏差。\nD 错：与友谊网络抽样无关。",
"soc-L7-q05":"选 C：问题出在受访者多报或少报（测量误差），不是谁被抽到。\nA 错：抽样本身不是主要问题。\nB 错：没有按综合门槛筛选样本。\nD 错：没有被淘汰而看不见的案例。",
"soc-L7-q06":"选 B：按班级平均 50，按学生体验平均 140，两者都对。\n算：(20×20+4×200)/24 = 50；(400×20+800×200)/1200 = 140\nA 错：110 是 20 与 200 的简单平均。\nC 错：两个数位置反了。\nD 错：忽略了大班学生更多。",
"soc-L7-q07":"选 A：高连接的人出现在很多人的好友列表里，沿友谊抽样过度代表他们。\nB 错：友谊通常是对称的。\nC 错：不是低估自己的问题。\nD 错：没有被淘汰的案例。",
"soc-L7-q08":"选 C：自我选择：本来更健康的员工更愿意参加，不是项目让人健康。\nA 错：随机对照组没有幸存者偏差问题。\nB 错：正是随机试验揭示了真相。\nD 错：随机比较显示无显著效果。",
"soc-L7-q09":"选 B：伯克森悖论：招聘按综合能力筛选，在录用者中制造负相关。\nA 错：材料没说获奖者更易辞职。\nC 错：负相关来自筛选，不是因果。\nD 错：与诱导式民调无关。",
"soc-L7-q10":"选 B：抽屉问题：只发表有利结果，公开文献被结果筛选。\nA 错：与友谊网络抽样无关。\nC 错：外源注意是心理过程。\nD 错：抽样随机不能防止发表筛选。",
"soc-L9-q01":"选 B：字面只夸讲课，“字迹差”是语境中推出的暗示，属语用。\nA 错：这不是逻辑推出的结论。\nC 错：句法只管句子结构。\nD 错：语义只给出字面意思。",
"soc-L9-q02":"选 A：说“我保证”本身就建立了承诺和责任，是言语行为。\nB 错：只是描述讲课很长。\nC 错：只是描述在下雨。\nD 错：只是描述天鹅的颜色。",
"soc-L9-q03":"选 C：PHIL1005 是焦点：每人都预计别人也觉得它显著。\nA 错：大家没有商量，没有明确断言。\nB 错：焦点不必是客观最好的。\nD 错：选课不是用话语完成社会行动。",
"soc-L9-q04":"选 D：男孩喊出后，事实成为共同知识：人人知道人人都知道。\nA 错：皇帝本来就没穿衣服。\nB 错：事实是进入，而不是离开共同基础。\nC 错：旁观者早已看见。",
"soc-L9-q05":"选 A：懂意图不等于有足够证据行动，无辜解释仍然存在。\nB 错：诚实警察可以完全听懂。\nC 错：间接行贿仍然违法。\nD 错：靠局外人不懂的是暗号，不是暗示。",
"soc-L9-q06":"选 C：双方都懂 p 不等于 p 被公开放进共同基础，所以能照常相处。\nA 错：间接言语并非总失败，这次就被听懂了。\nB 错：这只是共享知识，不是共同知识。\nD 错：题设说双方都懂了。",
"soc-L9-q07":"选 B：关系管理：被拒就真的只看电影，原有友谊得以保住。\nA 错：这不是主持婚礼的言语行为。\nC 错：表白不涉及法律惩罚。\nD 错：间接表达恰恰避免制造共同知识。",
"soc-L9-q08":"选 C：字面赞美在不断累积的反证下反复出现，变成反讽信号。\nA 错：字面内容是在赞美 Brutus。\nB 错：不是共同知识排除了其他解释。\nD 错：Antony 从未直接断言。",
"soc-L9-q09":"选 A：暗示约定俗成为只有一种意思的习语后，就等于直说，失去可否认性。\nB 错：听者不确定反而保住可否认性。\nC 错：字面为真正是无辜解释的来源。\nD 错：多重受众是战略模糊的用武之地。",
"soc-L11-q01":"选 B：重描述谬误：低层机制描述本身不能排除高层能力。\nA 错：盖梯尔是知识论反例，与此无关。\nC 错：缺少额外论证，不是可靠证明。\nD 错：与幸存者偏差无关。",
"soc-L11-q02":"选 D：教授暂定地倾向图书馆技术假说：LLM 是信息检索而非真正认知。\nA 错：教授没说这是定论，也不认为它像人思考。\nB 错：他给出了幻觉、二十问等理由。\nC 错：那会犯重描述谬误。",
"soc-L11-q03":"选 D：厕所例说明幻觉：文本合理性高不保证内容为真。\nA 错：问题不在于缺山的训练数据。\nB 错：LLM 训练后不会每次聊天学新事实。\nC 错：例子不是讲条件概率。",

"soc-L13-q02":"选 C：她的说法有证据，却因“女人情绪化”的身份偏见被低估。\nA 错：她说的其实是真的。\nB 错：她有证据（Dickie 的戒指）。\nD 错：不说出来是自我压抑，不是此案。",

"soc-L13-q07":"选 B：她因不被信而愤怒，愤怒又被当作情绪化的证据，再被低估。\nA 错：恶性循环与证据需求变少无关。\nC 错：是她得到可信度不足，不是她给别人过高。\nD 错：她一直在说，不是自我压抑。",

"soc-L14-q02":"选 A：她有清楚证据，却因性别偏见被低估，是证言不正义。\nB 错：她能说清缺陷，不缺概念。\nC 错：经理无视证据，不是对证据作出回应。\nD 错：她说出来了，没有自我压抑。",
"soc-L14-q03":"选 D：怀疑是否不正义要看当时的依据和是否对证据敏感，不看事后真相。\nA 错：用事后真相倒推当初的怀疑。\nB 错：让说话者不满不等于不正义。\nC 错：尊重说话者不要求不加检查就接受。",
"soc-L14-q04":"选 C：带偏见的刻板印象不基于准确统计，它恰恰抵抗反证。\nA 错：把群体与负面特征相连是要素之一。\nB 错：抵抗反证是要素之一。\nD 错：不当的情感投入是要素之一。",

"soc-L14-q06":"选 A：怀疑是否合理看警察当时的证据，不看观众事后知道什么。\nB 错：不能推出“奇怪的人永远不可信”。\nC 错：真话当然可以值得相信。\nD 错：Kyle Reese 是真诚的。",

"soc-L14-q10":"选 B：没有身份偏见就不算（必要），但只有偏见还不够（不充分）。\nA 错：把必要和充分弄反了。\nC 错：严格框架里它是必要的。\nD 错：还要偏见实际压低了可信度。",

"soc-L15-q01":"选 B：制造怀疑只需让证据显得未定论，使公众推迟判断和行动。\nA 错：不需要证明相反结论为真。\nC 错：不需要让科学家改变结论。\nD 错：它是放大不确定，不是消除不确定。",
"soc-L15-q02":"选 C：各给同等时间暗示证据五五开，而证据分量压倒性地偏向一方，是虚假平衡。\nA 错：辩论本身不一定不理性。\nB 错：怀疑论者可能是真诚的。\nD 错：问题在呈现方式，不在科学家上电视。",
"soc-L15-q03":"选 A：资助是仔细审查方法和挑选方式的理由，仍要放到整体证据中评估。\nB 错：受资助不等于结论必假。\nC 错：利益关系不能忽视。\nD 错：公司有利益动机，更需要审查。",

"soc-L15-q05":"选 C：把细节（大小、时间）的不确定夸大成对主结论是否存在的怀疑。\nA 错：研究者都同意效应存在，报道不准确。\nB 错：给出区间正是在认真量化不确定。\nD 错：没有任何迹象表明捏造数据。",
"soc-L15-q06":"选 A：信念度 0.8 表示相当有把握，但承认可能为假。\nB 错：只有信念度为 1 才是确定为真。\nC 错：混淆了个人信念度和客观机会。\nD 错：命题只有真假，不会“80% 为真”。",
"soc-L15-q07":"选 D：按主原则，知道客观机会且无其他相关信息，信念度等于机会 0.3。\nA 错：“可能下雨”不等于确定下雨。\nB 错：两种可能不等于各占 0.5。\nC 错：可能性低于一半不等于确定不下。",
"soc-L15-q08":"选 B：互斥且穷尽的结果，信念度之和为 1。\n算：1 − 0.5 − 0.3 = 0.2\nA 错：0.3 会使总和超过 1。\nC 错：0.5 会使总和为 1.3。\nD 错：总和必须为 1，C 只能是 0.2。",
"soc-L15-q09":"选 A：决策同时看概率和后果成本，带伞成本极低，带伞可以是理性的。\nB 错：行动不需要先确定结论为真。\nC 错：行动不等于断言会下雨。\nD 错：只看概率、忽略了成本。",
"soc-L15-q10":"选 C：把“尚不确定”当作“不必改变”会拖延行动，利于从现状中获益的一方。\nA 错：不确定不能证明现行做法安全。\nB 错：它是拖延改变，不是逼人立即采纳。\nD 错：利益相关方正是借此影响讨论。",
"soc-L17-q01":"选 A：列出重量、材料和构造，是直接介绍产品的信息型广告。\nB 错：联想型广告不提供产品信息。\nC 错：没有先制造一个“问题”。\nD 错：没有针对特定受众。",

"soc-L17-q04":"选 D：每个人预期别人都看到并可能接受，于是按这种相互预期调整行为。\nA 错：重复不能在逻辑上证明讯息为真。\nB 错：私下信念当然会影响行为。\nC 错：公开播放不会告诉你别人的具体动机。",

/* ---------- 掌握度 ---------- */
function mastery(m){
  let sum = 0, cnt = 0, seen = 0;
  MCQ.filter(q => q.module === m).forEach(q => { cnt++; const r = S.mcq[q.id]; if (r) { seen++; sum += r.last ? 1 : 0; } });
  CALC.filter(q => q.module === m).forEach(q => { cnt++; const r = S.calc[q.id]; if (r) { seen++; sum += r.clean ? 1 : .5; } });
  CARDS.filter(c => c.module === m).forEach(c => { cnt++; const r = S.cards[c.id]; if (r) { seen++; sum += Math.min(r.box, 4) / 4; } });
  return {v: cnt ? sum / cnt : 0, seen, cnt};
}
function estScore(){ return MOD_ORDER.reduce((a, m) => a + MODS[m].w / 100 * mastery(m).v * 75, 0); }
const wrongIds = t => Object.keys(S.wrong).filter(id => S.wrong[id] === t && byId[id]);
function dueCards(filter){
  const now = Date.now();
  return CARDS.filter(c => (!filter || filter(c)) && (!S.cards[c.id] || S.cards[c.id].due <= now));
}

function kpProg(c){ const xs = kpItems(c); return {n: xs.length, ok: xs.filter(itemOk).length}; }

const BOX_DAYS = [0, 1, 2, 4, 7, 12];
function rateCard(id, r){
  const c = S.cards[id] || {box:0, due:0};
  if (r === 0) { c.box = 0; c.due = Date.now() + 10 * 60e3; }
  else if (r === 1) { c.box = Math.max(1, c.box); c.due = Date.now() + 864e5; }
  else { c.box = Math.min(5, c.box + 1); c.due = Date.now() + BOX_DAYS[c.box] * 864e5; }
  S.cards[id] = c; save();
}

/* ---------- 选题 ---------- */
function pool(arr, o){
  let p = arr.filter(x => (!o.mod || x.module === o.mod) && (!o.hf || x.hf));
  if (o.lec && o.lec.length) { const q = p.filter(x => o.lec.includes(x.lecture)); if (q.length) p = q; }
  return p;
}
function pickMcq(o){
  let p = pool(MCQ, o);
  if (o.unseen) { const u = p.filter(q => !S.mcq[q.id]); if (u.length) p = u; }
  const unseen = shuffle(p.filter(q => !S.mcq[q.id]));
  const wrong = shuffle(p.filter(q => S.mcq[q.id] && !S.mcq[q.id].last));
  const rest = shuffle(p.filter(q => S.mcq[q.id] && S.mcq[q.id].last)).sort((a, b) => S.mcq[a.id].t - S.mcq[b.id].t);
  return [...unseen, ...wrong, ...rest].slice(0, o.n || 15).map(q => q.id);
}
function pickCalc(o){
  const p = pool(CALC, o);
  const a = shuffle(p.filter(q => !S.calc[q.id])), b = shuffle(p.filter(q => S.calc[q.id] && !S.calc[q.id].clean)), c = shuffle(p.filter(q => S.calc[q.id] && S.calc[q.id].clean));
  return [...a, ...b, ...c].slice(0, o.n || 3).map(q => q.id);
}
function pickCards(o){
  const p = pool(CARDS, o), now = Date.now();
  const due = shuffle(p.filter(c => S.cards[c.id] && S.cards[c.id].due <= now));
  const fresh = shuffle(p.filter(c => !S.cards[c.id]));
  const later = p.filter(c => S.cards[c.id] && S.cards[c.id].due > now).sort((a, b) => S.cards[a.id].box - S.cards[b.id].box);
  return [...due, ...fresh, ...later].slice(0, o.n || 15).map(c => c.id);
}

/* ----- 练习题里的公式旁边标含义 -----
   Pr(T|I) → 「已知烦躁(I)时，疲倦(T)的概率」；A ⊃ B → 「如果 A 那么 B」。
   字母含义从题目自己的定义里取（中文翻译里的「疲倦（T）」或英文里的「tired (T)」）。模拟考不标，和真考试一样。 */
const FX_STRIP = /^(?:[的地得会是被在有都时间了而且就也并与和将把对中里你我他她它这那此该很问知已求即正总数设]|感到|觉得|现在|正在|总是)+/;
function fxLegend(q){
  if (q._lg) return q._lg;
  const lg = {};
  const zh = [q.qZh, ...(q.oZh || []), ...(q.steps || []).map(s => s.pZh), q.explain, ...(q.steps || []).map(s => s.sol)].filter(Boolean).join('\n');
  const en = [q.q, ...(q.options || []), ...(q.steps || []).map(s => s.prompt)].filter(Boolean).join('\n');
  let m, re = /([一-龥A-Za-z ]{1,10})（([A-Z])）/g;
  while ((m = re.exec(zh))) { const nm = m[1].trim().replace(FX_STRIP, '').trim(); if (nm && !lg[m[2]]) lg[m[2]] = nm; }
  re = /([a-z][a-z' ]{2,40}?)\s\(([A-Z])\)/g;
  while ((m = re.exec(en))) { if (!lg[m[2]]) { const nm = m[1].trim().split(' ').slice(-4).join(' ').replace(/^(?:of|the|a|an|that|who|which|are|is|you|get|be)\s+/, '').trim(); if (nm) lg[m[2]] = nm; } }

const FX_TOK = /^\s*(?:~|¬|not\s+)?[^|&∧∨<>()]{1,40}\s*$/;
const cj = s => (/^[A-Za-z0-9(~¬]/.test(s) ? ' ' : '') + s + (/[A-Za-z0-9)]$/.test(s) ? ' ' : '');

  let t = tok.trim(), neg = false;
  if (/^(?:~|¬|not\s+)/.test(t)) { neg = true; t = t.replace(/^(?:~|¬|not\s+)\s*/, ''); }
  const nm = t.length === 1 && lg[t];
  const s = nm ? `${nm}(${t})` : /^\d+$/.test(t) ? `结果为 ${t}` : t;

}

  const side = e => /∨|\bor\b/.test(e) ? e.split(/\s*(?:∨|\bor\b)\s*/).map(x => cj(fxName(x, lg))).join('或')
    : e.split(/\s*(?:&|∧|\band\b)\s*/).map(x => cj(fxName(x, lg))).join('且');
  const tidy = s => s.replace(/\s+/g, ' ').replace(/，\s+/g, '，').trim();
  if (inner.includes('|')) { const [a, b] = inner.split('|'); return tidy(`已知${side(b)}时，${side(a)}的概率`); }

function fx(html, lg){

    seen[key] = 1; keep.push(`<span class="fx">${all}<i>${esc(d)}</i></span>`); return `\u0001${keep.length - 1}\u0001`;

/* ----- 真值表专区：7 课复习 + 6 级练习 ----- */
const SYM = {and:'&', or:'∨', imp:'⊃'};
const OPN = {neg:'~（非）', and:'&（且）', or:'∨（或）', imp:'⊃（如果…那么）'};
const RULE = {neg:'把真假翻过来', and:'两边都 T 才 T', or:'两边都 F 才 F', imp:'只有「前 T 后 F」才 F'};
const TF = b => b ? 'T' : 'F';
const tv = b => `<i class="tv${b ? '' : ' f'}">${TF(b)}</i>`;
function rndF(vars, d){
  if (d <= 0 || (d < 3 && Math.random() < .3)) return {v: vars[ri(vars.length)]};
  if (Math.random() < .22) return {op:'neg', a: rndF(vars, d - 1)};
  return {op: ['and','or','imp'][ri(3)], a: rndF(vars, d - 1), b: rndF(vars, d - 1)};
}
function fstr(f, top){
  if (f.v) return f.v;
  if (f.op === 'neg') return '~' + fstr(f.a, false);
  const s = fstr(f.a, false) + ' ' + SYM[f.op] + ' ' + fstr(f.b, false);
  return top ? s : '(' + s + ')';
}
function fev(f, e){
  if (f.v) return e[f.v];
  if (f.op === 'neg') return !fev(f.a, e);
  const a = fev(f.a, e), b = fev(f.b, e);
  return f.op === 'and' ? a && b : f.op === 'or' ? a || b : !a || b;
}
function fvars(f, set = new Set()){ if (f.v) set.add(f.v); else { fvars(f.a, set); if (f.b) fvars(f.b, set); } return set; }
function fsubs(f, out = []){ if (f.v) return out; fsubs(f.a, out); if (f.b) fsubs(f.b, out); const s = fstr(f, true); if (!out.some(x => x.s === s)) out.push({s, f}); return out; }
function rowsOf(vars){ const n = vars.length, rows = []; for (let i = 0; i < 1 << n; i++) { const e = {}; vars.forEach((v, j) => e[v] = !((i >> (n - 1 - j)) & 1)); rows.push(e); } return rows; }
function classify(f, vars){ const vals = rowsOf(vars).map(e => fev(f, e)); return vals.every(x => x) ? 'taut' : vals.every(x => !x) ? 'contra' : 'cont'; }
// 课程写法的小解析器：'(A & B) ∨ ~B'。二元联结词嵌套时必须加括号
function PF(s){
  s = s.replace(/\s+/g, ''); let i = 0;
  const un = () => { const ch = s[i++]; if (ch === '~') return {op:'neg', a: un()}; if (ch === '(') { const f = bin(); i++; return f; } return {v: ch}; };
  const bin = () => { let a = un(); while (i < s.length && '&∨⊃'.includes(s[i])) { const op = {'&':'and', '∨':'or', '⊃':'imp'}[s[i++]]; a = {op, a, b: un()}; } return a; };
  return bin();
}
const varsOf = fs => [...new Set(fs.flatMap(f => [...fvars(f)]))].sort();
function genTT(o = {}){
  const r = Math.random(), target = o.target || (r < .35 ? 'taut' : r < .6 ? 'contra' : 'cont');
  for (let k = 0; k < 800; k++) {
    const vars = Math.random() < (o.p3 == null ? .3 : o.p3) ? ['A','B','C'] : ['A','B'];
    let f = rndF(vars, 3);
    if (!f.op) continue;
    let used = [...fvars(f)].sort();
    if (used.length < 2) continue;
    // 字母按 A、B、C 连续命名；& 和 ∨ 两边都是字母时按字母顺序写，避免同一式子里出现 B ∨ A 和 A ∨ B
    const map = {}; used.forEach((v, j) => map[v] = 'ABC'[j]);
    const norm = g => { if (g.v) return {v: map[g.v]}; if (g.op === 'neg') return {op:'neg', a: norm(g.a)};
      let a = norm(g.a), b = norm(g.b); if (g.op !== 'imp' && a.v && b.v && a.v > b.v) [a, b] = [b, a]; return {op: g.op, a, b}; };
    f = norm(f); used = [...fvars(f)].sort();
    const str = fstr(f, true);
    if (str.length > 34 || str.length < 7) continue;
    if (fsubs(f).length > (o.max || 9)) continue;
    if (fsubs(f).some(x => x.f.b && fstr(x.f.a, true) === fstr(x.f.b, true))) continue;
    if (classify(f, used) === target) return {f, vars: used};
  }
  const g = PF('A ⊃ B'), ng = {op:'neg', a:g};
  const f = target === 'taut' ? {op:'or', a:g, b:ng} : target === 'contra' ? {op:'and', a:g, b:ng} : PF('A ∨ ~B');
  return {f, vars: [...fvars(f)].sort()};
}
// 一格为什么是 T / F
function cellWhy(f, e){
  if (f.v) return `${f.v} 就是左边 ${f.v} 列：${TF(e[f.v])}`;
  const s = fstr(f, true);
  if (f.op === 'neg') { const a = fev(f.a, e); return `${s} = ~${TF(a)}：${fstr(f.a, true)} 是 ${TF(a)}，翻过来 → ${TF(!a)}`; }
  const a = fev(f.a, e), b = fev(f.b, e), v = fev(f, e);
  const why = f.op === 'and' ? (v ? '两边都 T' : '有一边是 F') : f.op === 'or' ? (v ? '有一边是 T' : '两边都 F') :
    !v ? '前件 T、后件 F，这是 ⊃ 唯一为假的情况' : !a ? '前件是 F，⊃ 自动为 T' : '后件是 T，⊃ 为 T';
  return `${s} = ${TF(a)} ${SYM[f.op]} ${TF(b)}：${why} → ${TF(v)}`;

const REL = {eq:'等价 ≡', neg:'互为否定', excl:'互斥（但不是互为否定）', none:'都不是'};
function relOf(x, y, rows){
  if (rows.every(e => fev(x, e) === fev(y, e))) return 'eq';
  if (rows.every(e => fev(x, e) !== fev(y, e))) return 'neg';
  return rows.some(e => fev(x, e) && fev(y, e)) ? 'none' : 'excl';
}

function sTT(vars, fs, o = {}){

function qWordBlock(key, text){
  if (!WORDS) { const seen = {}; WORDS = []; CARDS.forEach(c => (c.words || []).forEach(w => { const k = w.en.toLowerCase(); if (!seen[k] && k.length > 2) { seen[k] = 1; const alt = k.split(/\s*\/\s*/).filter(a => a.length > 2 && !/\.\.\./.test(a)).map(a => a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'));
      if (alt.length) WORDS.push({...w, re: new RegExp('\\b(' + alt.join('|') + ')\\b', 'i')}); } })); }
  if (!symCache['w' + key]) symCache['w' + key] = WORDS.filter(w => w.re.test(text));
  const xs = symCache['w' + key];
  return xs.length ? fold('qword', '题中词汇', xs.length, `<div class="wds">${xs.map(wordRow).join('')}</div>`) : '';
}
const anaBlock = c => c.ana ?`<div class="ana"><b>💡 打个比方</b>${fmt(c.ana)}</div>` : '';
const kTitle = c => c.zh ? `<div class="ktitle">${esc(c.zh)}<small>${esc(c.term)}</small></div>` : `<div class="ktitle">${esc(c.term)}</div>`;
// 例题里写在一行的选项「？A. … B. … C. …」拆成每个选项一行
function lxOpts(q){
  // 选项字母后面要有「.」，或者选项之间用全角空格隔开（如「A 0.4　B 0.1」），免得拆开公式里的 A、B
  const wide = /　[B-E]\s/.test(q), m = (wide ? /[？?：:。]\s*(?=A\s)/ : /[？?：:。]\s*(?=A[.．])/).exec(q);
  if (!m) return q;
  const i = m.index + 1;
  return q.slice(0, i) + '\n' + q.slice(i).trim().replace(wide ? /　+(?=[B-E]\s)/g : /\s*(?=[B-E][.．])/g, '\n').replace(/\n+/g, '\n');
}
function kpBtn(c){
  const n = (c.qs || []).length;
  const tt = /^logic-L(6|8|10)-(truth-table|connectives|inclusive-or|main-connective|logical-truth|logical-falsehood|contingent|shortcuts|equivalence|material-conditional|validity-logical-truth|me-truth-table)$/.test(c.id)
    ? `<button class="btn block" style="margin-top:12px" data-act="go" data-n="ttHome">📖 去真值表专区看分步讲解</button>` : '';
  return tt + (n ? `<button class="btn pri block" style="margin-top:12px" data-act="kpOpen" data-id="${c.id}">练这个知识点（${n} 题）</button>` : '');
}
/* ----- 单个知识点：一句话 + 对应练习 ----- */
SCR.kp = p => {
  const c = byId[p.id], x = kpSplit(c);
  const done = id => S.mcq[id] ? (S.mcq[id].last ? '<span class="good">✓</span>' : '<span class="wrong">✗</span>') : '';
  const pr = kpProg(c), auto = kpAuto(c), man = !!S.kpDone[c.id], rest = x.mcq.filter(id => !itemOk(id));
  const st = auto ? `✓ 已通过：对应的 ${pr.n} 题全部答对` : man ? `✓ 已手动标记为掌握${pr.n ? `（题目 ${pr.ok}/${pr.n} 答对）` : ''}` : pr.n ? `进度 ${pr.ok}/${pr.n} 题答对，全对后自动通过` : '这个知识点没有对应的题，可以手动标记';
  return hdr('知识点') + `<div class="kpst ${auto || man ? 'ok' : ''}"><span class="sp">${st}</span>${auto ? '' : `<button class="btn sm" data-act="kpTick" data-id="${c.id}">${man ? '取消标记' : '标记掌握'}</button>`}</div>
  <div class="card"><div class="row" style="gap:6px;flex-wrap:wrap">${pill(c.module)} ${c.hf ? '<span class="pill hf">高频</span>' : ''} ${lecPill(c.lecture)}</div>
  ${kTitle(c)}
  ${cardBody(c, {noPractice: true})}</div>
  ${x.mcq.length ? `<div class="btns" style="margin-top:0">${rest.length && rest.length < x.mcq.length ? `<button class="btn pri" data-act="kpQuiz" data-id="${c.id}" data-rest="1">只做没答对的 ${rest.length} 道</button><button class="btn" data-act="kpQuiz" data-id="${c.id}">全部 ${x.mcq.length} 道</button>` : `<button class="btn pri" data-act="kpQuiz" data-id="${c.id}">做这 ${x.mcq.length} 道选择题</button>`}</div>
  <div class="card list" style="margin-top:10px">${x.mcq.map((id, i) => `<div class="it"><span class="mut" style="min-width:22px">${i + 1}</span><span class="sp">${esc(byId[id].topic || '')}</span>${done(id)}</div>`).join('')}</div>` : ''}
  ${x.calc.length ? `<h2>计算题</h2><div class="card list">${x.calc.map(id => { const r = S.calc[id]; return `<button class="it" data-act="calcOne" data-id="${id}"><span class="sp">${esc(byId[id].topic || id)}</span>${r ? (r.clean ? '<span class="good">✓</span>' : '<span class="wrong">再练</span>') : ''}<span class="chev">${IC.chev}</span></button>`; }).join('')}</div>` : ''}
  ${x.essay.length ? `<h2>短文</h2><div class="card list">${x.essay.map(id => `<button class="it" data-act="essayOne" data-id="${id}"><span class="sp">${esc(byId[id].prompt)}</span><span class="chev">${IC.chev}</span></button>`).join('')}</div>` : ''}
  ${!(c.qs || []).length ? '<p class="empty">这个知识点暂时没有对应的题</p>' : ''}`;
};

/* ----- 秒判速查：所有知识点的考法一页看完 ----- */
SCR.cram = p => {
  const m = p.m || 'prob', cs = hfCards(CARDS.filter(c => c.module === m && c.go));

  return hdr('🎯 秒判速查') + `<p class="sub">每个知识点只留一句「看到什么 → 怎么答」。考前过一遍，点名称看完整卡片。</p>
  <div class="seg">${MOD_ORDER.map(k => `<button class="${m === k ? 'on' : ''}" data-act="cramMod" data-m="${k}">${MODS[k].name}</button>`).join('')}</div>
  <div class="chips" style="margin-top:-4px">${hfChip()}</div>
  ${lecs.map(l => `<h2>${l} <span class="mut" style="font-weight:400">${esc(LEC[l] || '')}</span></h2><div class="card list">${cs.filter(c => c.lecture === l).map(c => `<button class="it cram" data-act="kpOpen" data-id="${c.id}"><span class="sp"><b>${esc(c.zh || c.term)}</b><span class="mut"> · ${fmt(c.go.kind)}</span><br>${fmt(c.go.tip)}</span><span class="chev">${IC.chev}</span></button>`).join('')}</div>`).join('')}`;
};
const cramTile = () => `<button class="tile" data-act="go" data-n="cram"><span class="ic">${IC.alert}</span><span class="sp"><b>🎯 秒判速查</b><span class="mut">全部知识点的「看到什么 → 怎么答」，一页过完</span></span><span class="chev">${IC.chev}</span></button>`;

/* ----- 按 Lecture 专项复习 ----- */
// 「只看高频」是一个全局开关：知识库、按讲复习、秒判速查共用，存在 S.hfOnly 里
const lecCards = l => CARDS.filter(c => l === '*' ? c.hf : c.lecture === l);   // '*' = 全部讲次的高频知识点
const hfCards = cs => S.hfOnly ? cs.filter(c => c.hf) : cs;
const hfChip = () => `<button class="chip hfchip ${S.hfOnly ? 'on' : ''}" data-act="hfToggle">⭐ 只看高频</button>`;
const hfTile = () => { const cs = CARDS.filter(c => c.hf), got = cs.filter(kpPass).length;
  return `<button class="tile tthl" data-act="deckGo" data-l="*"><span class="ic">⭐</span><span class="sp"><b>高频知识点速通</b><span class="mut">只过最常考的 ${cs.length} 个（共 ${CARDS.length} 个），已通过 ${got}。时间紧就先刷这些</span></span><span class="chev">${IC.chev}</span></button>`; };
SCR.lecList = () => hdr('按 Lecture 专项复习') + `<p class="sub">选一讲，一张一张过知识点，左右滑动切换。</p>${hfTile()}<div class="chips">${hfChip()}</div>` +
  LECS.filter(l => lecCards(l).length).map(l => { const cs = lecCards(l), got = cs.filter(kpPass).length, ms = [...new Set(cs.map(c => c.module))], nh = cs.filter(c => c.hf).length;
    return `<button class="tile lecit" data-act="deckGo" data-l="${l}"><span class="sp" style="display:block"><b>${l} · ${esc(LEC[l] || '')}</b>
    <span class="row" style="gap:6px;margin-top:3px;flex-wrap:wrap">${ms.map(pill).join('')}<span class="mut">${S.hfOnly ? `高频 ${nh} 个（共 ${cs.length}）` : `${cs.length} 个知识点 · 高频 ${nh}`} · 已通过 ${got}</span></span>
    <span class="bar" style="display:block"><i style="width:${got / cs.length * 100}%;background:var(--ok)"></i></span></span><span class="chev">${IC.chev}</span></button>`; }).join('');
function deckList(p){ const all = hfCards(lecCards(p.l)); return {all, list: p.todo ? all.filter(c => !kpPass(c)) : all}; }
SCR.deck = p => {
  const {all, list} = deckList(p), todo = all.filter(c => !kpPass(c)).length;
  const title = p.l === '*' ? '⭐ 高频知识点速通' : `${p.l} · ${esc(LEC[p.l] || '')}`;
  const head = hdr(title, list.length ? `<span class="mut">${Math.min(p.i, list.length - 1) + 1}/${list.length}</span>` : '') +
    `<div class="chips" style="margin:0 0 8px"><button class="chip ${p.todo ? '' : 'on'}" data-act="deckTodo" data-v="">全部 ${all.length}</button><button class="chip ${p.todo ? 'on' : ''}" data-act="deckTodo" data-v="1">只看未通过 ${todo}</button>${p.l === '*' ? '' : hfChip()}</div>`;
  if (!all.length) return head + `<p class="empty">这一讲没有高频知识点</p><button class="btn block" data-act="hfToggle">看这一讲全部知识点</button>`;
  if (!list.length) return head + `<p class="empty">${p.l === '*' || S.hfOnly ? '高频知识点' : '这一讲的知识点'}都通过了 🎉</p><button class="btn block" data-act="deckTodo" data-v="">看全部知识点</button>`;
  const i = p.i = Math.max(0, Math.min(p.i || 0, list.length - 1)), c = list[i], ok = kpPass(c), pr = kpProg(c), last = i === list.length - 1;
  return head + `<div class="dots">${list.map((x, k) => `<i class="${kpPass(x) ? 'ok' : ''} ${k === i ? 'cur' : ''}"></i>`).join('')}</div>
  <div id="deck" class="card"><div class="row" style="gap:6px;flex-wrap:wrap">${pill(c.module)} ${c.hf ? '<span class="pill hf">高频</span>' : ''}${p.l === '*' ? lecPill(c.lecture) : ''}<span class="sp"></span>${!ok && pr.n ? `<span class="kpn">${pr.ok}/${pr.n} 题</span>` : ''}<button class="kptick ${ok ? 'on' : ''}" data-act="kpTick" data-id="${c.id}" aria-label="标记掌握">✓</button></div>
  ${kTitle(c)}
  ${cardBody(c)}</div>
  <div class="decknav"><button class="btn" data-act="deckStep" data-d="-1" ${i === 0 ? 'disabled' : ''}>‹ 上一个</button>${last ? '<button class="btn pri" data-act="back">完成</button>' : '<button class="btn pri" data-act="deckStep" data-d="1">下一个 ›</button>'}</div>
  <p class="mut" style="text-align:center;margin-top:8px">左右滑动卡片也能切换</p>`;
};
function deckMove(dir){
  const p = cur().p, n = deckList(p).list.length, ni = (p.i || 0) + dir, el = $('#deck');
  if (ni < 0 || ni >= n) { if (el) el.style.transform = ''; return; }
  p.i = ni; render(true);
  const d = $('#deck'); if (!d) return;
  d.classList.add(dir > 0 ? 'inR' : 'inL');   // CSS 滑入动画；定时移除，保证卡片最终一定完全显示
  setTimeout(() => d.classList.remove('inR', 'inL'), 260);
}
let sw = null;   // 卡片左右滑动
document.addEventListener('touchstart', e => { const d = e.target.closest('#deck'); sw = d && e.touches.length === 1 ? {x: e.touches[0].clientX, y: e.touches[0].clientY, el: d, h: null} : null; }, {passive: true});
document.addEventListener('touchmove', e => { if (!sw) return; const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (sw.h === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.h = Math.abs(dx) > Math.abs(dy);
  if (sw.h) { sw.el.classList.add('drag'); sw.el.style.transform = `translateX(${dx}px)`; } }, {passive: true});
document.addEventListener('touchend', e => { if (!sw) return; const dx = e.changedTouches[0].clientX - sw.x, s = sw; sw = null;
  s.el.classList.remove('drag');
  if (s.h && Math.abs(dx) > 60) deckMove(dx < 0 ? 1 : -1); else s.el.style.transform = ''; });
document.addEventListener('keydown', e => { if (cur().name === 'deck' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) deckMove(e.key === 'ArrowRight' ? 1 : -1); });

function kbList(){
  const q = kb.q.trim().toLowerCase();
  const cs = CARDS.filter(c => q ? [c.term, c.zh, c.one, c.en, c.def, c.defZh, c.example, ...(c.pts || []), c.ex, ...(c.words || []).map(w => w.en + ' ' + w.zh)].join(' ').toLowerCase().includes(q) : c.module === kb.mod)

  if (!cs.length) return `<p class="empty">${kb.f === 'done' ? '还没有通过的知识点' : kb.f === 'todo' ? '这里的知识点都通过了 🎉' : '没有找到'}${S.hfOnly ? '（当前只看高频）' : ''}</p>`;
  const g = {};
  cs.forEach(c => (g[c.lecture] = g[c.lecture] || []).push(c));
  return Object.keys(g).sort((a, b) => lecNum(a) - lecNum(b)).map(l => `<div class="row" style="margin:22px 0 10px"><h2 class="sp" style="font-size:15px;margin:0">${esc(l)} · ${esc(LEC[l] || '')}</h2><button class="btn sm" data-act="deckGo" data-l="${l}">专项复习 ›</button></div><div class="card list" style="padding-top:2px;padding-bottom:2px">` +

      return `<details ${kb.open[c.id] ? 'open' : ''} class="${ok ? 'pass' : ''}" data-id="${c.id}" style="border-bottom:1px solid var(--line);padding:10px 0"><summary class="row"><span class="sp"><b style="font-weight:600">${esc(c.zh || c.term)}</b> <span class="mut">${c.zh ? esc(c.term) : ''}</span>${c.one ? `<div class="ones">${fmt(c.one)}</div>` : ''}</span>${q ? pill(c.module) : ''}${c.hf ? '<span class="pill hf">高频</span>' : ''}${!ok && p.n ? `<span class="kpn">${p.ok}/${p.n}</span>` : ''}<button class="kptick ${ok ? 'on' : ''}" data-act="kpTick" data-id="${c.id}" aria-label="标记掌握">✓</button></summary>${cardBody(c, {noOne: true})}</details>`; }).join('') + '</div>').join('');
}

/* ----- 模拟考 ----- */

    const cellsOK = q.seq ? !s.err : q.cols.every((c, k) => c.f.v || q.rows.every((e, r) => s.u[k][r] === fev(c.f, e)));
    ttDone(cellsOK && (!q.ask || s.pick === q.ans)); },
  ttNext: () => { const s = sess; s.count++; if (s.count >= s.n) { finishTask(); toast(`这组做完了：${s.okN}/${s.n} 题全对`, s.okN === s.n ? 'ok' : ''); back(); } else { newTT(); render(true); } },
  cardsGo: d => startCards(pickCards({mod: d.m || null, hf: !!d.hf, n: 20})),
  flip: () => { const t = $('#cardTry'); sess.tryText = t ? t.value.trim() : ''; sess.flip = true; render(); },
  rate: d => { const s = sess, id = s.list[s.i], r = +d.r; rateCard(id, r); s.stat[r]++; if (r === 0 && !s.again[id]) { s.again[id] = 1; s.list.push(id); } s.i++; s.flip = false; s.tryText = ''; render(true); },
  kbMod: d => { kb.mod = d.m; kb.q = ''; render(); },
  essayOne: d => go('essayOne', {id: d.id}),
  kpOpen: d => go('kp', {id: d.id}),
  zhToggle: () => { zhOn = !zhOn; try { localStorage.setItem('phil1005-zh', zhOn ? '1' : '0'); } catch (e) {} render(); },
  symToggle: () => { const p = $('#symPanel'); if (!p.innerHTML) p.innerHTML = symPanel(); document.body.classList.toggle('symopen'); },
  kpQuiz: d => { const c = byId[d.id], xs = kpSplit(c).mcq; startQuiz(d.rest ? xs.filter(id => !itemOk(id)) : xs, {title: c.term}); },
  kpTick: d => { const c = byId[d.id];
    if (kpAuto(c) && !S.kpDone[c.id]) return toast('对应的题已全部答对，已自动通过');
    if (S.kpDone[c.id]) delete S.kpDone[c.id]; else { S.kpDone[c.id] = Date.now(); toast(`✓ 已标记掌握：${c.term}`, 'ok'); }
    save(); render(); },
  kbFilter: d => { kb.f = d.v; render(); },
  cramMod: d => { cur().p.m = d.m; render(true); },
  hfToggle: () => { S.hfOnly = !S.hfOnly; save(); if (cur().name === 'deck') cur().p.i = 0; render(); toast(S.hfOnly ? '⭐ 只看高频：其他知识点先跳过' : '已显示全部知识点'); },
  deckGo: d => go('deck', {l: d.l, i: 0}),
  deckStep: d => deckMove(+d.d),
  deckTodo: d => { const p = cur().p; p.todo = !!d.v; p.i = 0; render(true); },
  essayShow: () => { cur().p.show = true; render(); },
  essayTimer: () => { essayT = essayT ? null : Date.now(); render(); },
  essayChk: (d, el) => { const c = S.essayChk[d.id] || (S.essayChk[d.id] = {}); c[d.i] = el.checked; save(); render(); },
  tipChk: (d, el) => { S.tips[d.i] = el.checked; save(); },
  mockStart: () => { if (S.mock) return go('mock'); if (!MCQ.length) return toast('题库为空'); mockStart(); },
  mockGo: () => go('mock'),
  mockAbort: () => { if (confirm('放弃这次模拟考？已答内容不会保存成绩。')) { S.mock = null; save(); render(); } },
  mockSec: d => { S.mock.sec = d.s; save(); render(true); },
  mockPick: d => { const M = S.mock, id = M.mc[M.i], k = +d.k; if (M.mcAns[id] === k) delete M.mcAns[id]; else M.mcAns[id] = k; save(); render(); },
  mockMove: d => { const M = S.mock, n = M.i + +d.d; if (n >= M.mc.length) { M.sec = 'wr'; } else M.i = Math.max(0, n); save(); render(true); },
  mockJump: d => { S.mock.i = +d.i; save(); render(true); },
  mockSubmit: () => { const M = S.mock, left = M.mc.length - Object.keys(M.mcAns).length;
    if (!confirm(left ? `还有 ${left} 道选择题没答，确定交卷？` : '确定交卷？')) return;
    M.phase = 'review'; M.end = Date.now();
    M.mc.forEach(id => recMcq(id, M.mcAns[id] === byId[id].answer));
    M.calcs.forEach(id => { const q = byId[id], last = q.steps[q.steps.length - 1], v = evalExpr(M.calcAns[id] || ''); if (!isNaN(v) && Math.abs(v - last.answer) <= (last.tol || .001)) M.grade.calcs[id] = MOCK_PLAN.calcPts; });
    save(); render(true); },
  mockSee: d => { S.mock.see = +d.i; render(); },
  mockGrade: d => { const G = S.mock.grade, v = +d.v; if (d.kind === 'essay') G.essay = v; else G[d.kind][d.id] = v; save(); render(); },
  mockDone: () => { const M = S.mock, G = M.grade;
    const mc = M.mc.filter(id => M.mcAns[id] === byId[id].answer).length;
    const wr = Object.values(G.defs).reduce((a, b) => a + b, 0) + Object.values(G.calcs).reduce((a, b) => a + b, 0) + (G.essay || 0);
    const dt = new Date(M.start);
    S.mocks.push({date: md(dt) + ' ' + String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0'), mc, wr, total: mc + wr});
    const key = PLAN.findIndex(d => d.tasks.some(t => t.k === 'mock'));
    if (key >= 0) S.tasks[key + '-' + PLAN[key].tasks.findIndex(t => t.k === 'mock')] = 1;
    S.mock = null; save(); stack = [{name:'practice'}, {name:'mockHome', p:{}}]; render(true); },
  exportData: () => { const t = $('#bk'); t.value = JSON.stringify(S); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('已复制，粘贴到备忘录保存'), () => { document.execCommand('copy'); toast('已复制（如果没复制上，请手动全选框里的文字复制）'); }); } catch (e) { document.execCommand('copy'); toast('请手动全选框里的文字复制'); } },
  importData: () => { const t = $('#bk'); try { const o = JSON.parse(t.value.trim()); if (!o || typeof o !== 'object' || !o.mcq) throw 0; if (!confirm('导入会覆盖当前进度，继续？')) return; S = Object.assign(blank(), o); save(); toast('导入完成'); render(); } catch (e) { toast('备份码格式不对'); } },
  theme: d => { const h = document.documentElement; if (d.v) h.dataset.theme = d.v; else delete h.dataset.theme;
    try { d.v ? localStorage.setItem('phil1005-theme', d.v) : localStorage.removeItem('phil1005-theme'); } catch (e) {} render(); },
  reset: () => { if (confirm('清空所有做题记录、定义卡进度和模拟考成绩？') && confirm('真的清空？无法恢复。')) { S = blank(); save(); render(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
  const f = ACT[el.dataset.act];
  if (f) { if (el.tagName === 'SUMMARY') return; e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-act]')) ACT[el.dataset.act](el.dataset, el);
});
document.addEventListener('pointerdown', e => { if (e.target.closest('.kp button')) e.preventDefault(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'calcIn') { e.preventDefault(); ACT.calcCheck(); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.id) kb.open[d.dataset.id] = d.open; }, true);
let saveT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'kbq') { kb.q = el.value; $('#kbList').innerHTML = kbList(); }
  else if (el.id === 'essayTxt') { S.essay[el.dataset.id] = el.value; $('#essayWc').textContent = (el.value.match(/[A-Za-z'’-]+/g) || []).length + ' words · 自动保存'; clearTimeout(saveT); saveT = setTimeout(save, 400); }
  else if (el.dataset.mock && S.mock) { const f = el.dataset.mock; if (f === 'essayAns') S.mock.essayAns = el.value; else S.mock[f][el.dataset.id] = el.value; clearTimeout(saveT); saveT = setTimeout(save, 400); }
});
function tickTimers(){
  document.querySelectorAll('[data-timer]').forEach(el => {
    if (el.dataset.timer === 'mock' && S.mock) { const l = mockLeft(); el.textContent = hms(l); el.style.color = l < 10 * 60e3 ? 'var(--bad)' : ''; }
    if (el.dataset.timer === 'essay') { if (essayT) { const l = 600e3 - (Date.now() - essayT); el.textContent = hms(l).replace(/^(超时 )?0:/, '$1'); el.style.color = l < 0 ? 'var(--bad)' : ''; } else el.textContent = '10:00'; }
  });
}
setInterval(tickTimers, 1000);
window.addEventListener('pagehide', save);
render(true);
</script>
</body>
</html>
