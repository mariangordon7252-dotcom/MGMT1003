r attention to your phone. This is an example of:","options":["an endogenous shift of attention","an exogenous shift of attention","an epistemic bubble","serial search"],"answer":1,"explain":"外源性注意转移是被外部刺激抓走的（火警、手机通知）；内源性是自己主动决定转移。","hf":false},{"id":"soc-L19-q05","module":"soc","lecture":"L19","topic":"两种注意力经济","q":"How does the lecturer contrast Simon\u0027s original \u0027attention economy\u0027 with the modern sense of the term?","options":["Simon\u0027s sense concerns attention bought by advertisers; the modern sense concerns memos within organisations.","There is no difference between them.","Simon\u0027s sense concerns efficiently allocating one\u0027s own scarce attention (mostly endogenous); the modern sense treats attention as a commodity that advertisers bid for (mostly exogenous).","Simon\u0027s sense concerns money; the modern sense concerns time."],"answer":2,"explain":"Simon 的模型是 70 年代汽车公司高管决定先读哪份备忘录（内部分配）；现代用法是平台把你的注意力卖给广告商，广告短暂抓走你的注意（外源性）。A 把两者颠倒了。","hf":false},{"id":"soc-L19-q06","module":"soc","lecture":"L19","topic":"对 Simon 的保留","q":"What caveat does the lecturer add to Simon\u0027s picture of attention as a single limited resource?","options":["Attention is not fully like money: some tasks (e.g. listening to a podcast while driving) barely compete, and training reduces how much attention a task demands.","Attention is actually unlimited for trained people.","Attention is irrelevant to information processing.","Texting while driving is safe because driving needs no attention."],"answer":0,"explain":"现代理论认为存在不同的注意资源，有的互相竞争、有的不竞争；熟练后（开车、玩游戏）所需注意减少。但总体结论仍成立：处理信息需要时间。老师明确说开车时不应发短信（D 错）。","hf":false},{"id":"soc-L19-q07","module":"soc","lecture":"L19","topic":"认识泡泡","q":"According to C. Thi Nguyen, an epistemic bubble is:","options":["a social structure in which outside voices are actively discredited","an information network from which relevant voices have been excluded by omission","any group of people who share the same political views","a conspiracy theory about the media"],"answer":1,"explain":"泡泡＝遗漏（omission），如过滤导致没看到；回音室＝主动贬低（actively discredited）。A 是回音室的定义。","hf":true},{"id":"soc-L19-q08","module":"soc","lecture":"L19","topic":"回音室","q":"Members of an online forum regularly read the other side\u0027s posts, but only in order to explain to each other why those people are malicious and should not be trusted. In Nguyen\u0027s terms this is best described as:","options":["an epistemic bubble, because they are exposed to the other side","neither, because they are exposed to opposing views","a case of serial attention","an echo chamber, because outside voices are actively discredited"],"answer":3,"explain":"回音室的关键不是没接触对方，而是对方被主动抹黑为不可信/邪恶。所以“接触过对方观点”并不能排除回音室（A、B 是常见误解）。","hf":true},{"id":"soc-L19-q09","module":"soc","lecture":"L19","topic":"为何回音室难逃","q":"Why are echo chambers harder to escape than epistemic bubbles?","options":["Because echo chambers contain less information.","Because epistemic bubbles are always deliberately created.","Because members already distrust outside sources, so contrary evidence tends to be dismissed or even taken as confirmation, making the structure self-reinforcing.","Because echo chambers exist only offline."],"answer":2,"explain":"泡泡只需接触被遗漏的信息即可逃出（如去买份 Telegraph）；回音室则自我强化，例如阴谋论把“爱泼斯坦尸检显示颈骨骨折”反当成“他还活着、证据被伪造”的证明。","hf":true},{"id":"soc-L19-q10","module":"soc","lecture":"L19","topic":"PageRank","q":"How does Google\u0027s PageRank, as described in the lecture, decide which pages to rank highly?","options":["It ranks highly pages that many other pages link to, using popularity as a proxy for informativeness without understanding the content.","It has human experts check each page for reliability.","It ranks pages by how recently they were written.","It ranks pages by how many advertisements they carry."],"answer":0,"explain":"被“马网站圈”大量链接的网站很可能是可靠的马网站——谷歌不必懂马。人工分类目录（Yahoo 等）是 B 的老办法。缺点：规则一旦被知道就会被刻意操纵。","hf":true},{"id":"soc-L19-q11","module":"soc","lecture":"L19","topic":"过滤是否必要","q":"What is the lecturer\u0027s view of filtering online information?","options":["All filtering is epistemically bad and should be avoided.","Filtering is necessary, since most online content is irrelevant or unwanted and attention is limited; the risk is that relevant voices get filtered out.","Filtering is needed only because people are lazy.","Algorithms filter perfectly, so there are no risks."],"answer":1,"explain":"老师用 Bluesky 网络图说明：不过滤会看到德语帖和色情内容；“我们用过滤器不是因为方便或懒，而是因为不得不用”。风险在于形成漏掉相关声音的泡泡。","hf":true},{"id":"soc-L19-q12","module":"soc","lecture":"L19","topic":"邪教例子","q":"In the Jonestown example, Jim Jones\u0027s sermons increasingly portrayed the outside world as evil and anyone who said \u0027you\u0027re in a cult\u0027 as an enemy. Which feature of an echo chamber does this illustrate?","options":["Relevant voices are excluded by accidental omission.","Algorithms show users what similar users like.","Members are unable to access any outside information.","Outside voices are discredited in advance, so criticism is treated as evidence of hostility rather than as a reason to reconsider."],"answer":3,"explain":"回音室预先抹黑外部来源，批评反而被解读为“他们想害你”。C 不对：回音室成员不一定接触不到外部信息，关键是不信任。","hf":false},{"id":"soc-L19-q13","module":"soc","lecture":"L19","topic":"社会认识重启","q":"Nguyen suggests a \u0027social epistemic reboot\u0027: throwing away one\u0027s beliefs about which sources are trustworthy and starting afresh. What is the lecturer\u0027s main objection?","options":["It is too easy, so everyone already does it.","It requires believing in God, as Descartes did.","Given limited, serial attention, starting from scratch would overwhelm us, and starting in the wrong place (e.g. a conspiracy site) could corrupt everything afterwards.","Trust in sources is irrelevant to escaping echo chambers."],"answer":2,"explain":"老师认为问题在于注意力：互联网信息量巨大，从零开始无从下手；而串行注意意味着必须从某个点开始，起点一错后面全坏。","hf":false},{"id":"soc-L19-q14","module":"soc","lecture":"L19","topic":"纽拉特之船","q":"What does Neurath\u0027s metaphor of sailors rebuilding their ship at sea recommend for our beliefs about whom to trust?","options":["Gradually replace the least trustworthy parts while relying on the rest, rather than rebuilding from the ground up.","Doubt everything at once and rebuild from a single certain foundation.","Never revise any belief once it is formed.","Trust whatever source is most popular."],"answer":0,"explain":"海上修船不能拆光重来，只能换掉最不牢靠的木板、用其余部分支撑。B 是笛卡尔式重启，老师认为做不到。","hf":false},{"id":"soc-L19-q15","module":"soc","lecture":"L19","topic":"推荐反馈循环","q":"According to the critique of YouTube\u0027s recommendation system discussed in the lecture, why might users be drawn toward increasingly extreme political content?","options":["Because extreme content is always more accurate.","Because the most engaged users have the most influence on recommendations, creators play to them, and more extreme content gets produced and recommended in a feedback loop.","Because the algorithm randomly selects videos.","Because every starting topic, including outdoor survival videos, leads to extremism."],"answer":1,"explain":"最活跃的用户对推荐影响最大→内容迎合他们→更多极端内容被制作和推荐。老师的实验显示从户外生存视频出发不会走向极端，但政治内容会（D 错）。这说明在线认识环境不是被动的。","hf":false}],"calc":[],"essay":[{"id":"soc-L14-e01","module":"soc","lecture":"L14","prompt":"Explain the difference between testimonial injustice and hermeneutical injustice, illustrating each with an example.","points":["准确定义 testimonial injustice：听者的 identity prejudice 造成 credibility deficit，说话者作为 knower 受到伤害","准确定义 hermeneutical injustice：共同 hermeneutical resources 中的结构性身份偏见/缺口，使重要社会经历无法进入集体理解","各给一个恰当例子（如 Marge / Tom Robinson；sexual harassment 命名前）","点明关键区别：前者是“说了不被信”（发生在听者的可信度判断），后者是“没有共同概念说清/被理解”（结构性，不需要个人恶意）"],"model":"Testimonial injustice and hermeneutical injustice are both ways of wronging someone in their capacity as a knower, but they arise at different points. Testimonial injustice occurs when a hearer gives a speaker a credibility deficit because of identity prejudice. In The Talented Mr. Ripley, Marge has good evidence that Tom killed Dickie, yet her claim is dismissed as \u0027female intuition\u0027 because of a stereotype that women are emotional rather than rational. Here the speaker has said what she knows, but her word is unfairly discounted. Hermeneutical injustice, by contrast, occurs when a gap in the collective hermeneutical resources, caused by structural identity prejudice, obscures a significant area of someone\u0027s social experience from shared understanding. Before the concept of sexual harassment existed, women struggled to make sense of, and communicate, unwanted workplace behaviour that was dismissed as harmless flirting. So testimonial injustice concerns unfair disbelief by a particular hearer, whereas hermeneutical injustice is a structural problem that can occur even when no individual intends harm."},{"id":"soc-L14-e02","module":"soc","lecture":"L14","prompt":"Not every case of disbelieving someone is an injustice. When is doubting someone\u0027s testimony reasonable rather than an instance of testimonial injustice?","points":["说明 credibility deficit 本身不足以构成 testimonial injustice，原因必须是 identity prejudice","区分 sincerity 与 competence：可以基于能力或利益动机的相关证据合理少信","关键标准：合理怀疑基于听者当时可得的证据且对证据敏感（evidence-responsive）；偏见则 resistant to counter-evidence","不能用事后真相倒推（Terminator 例子），并给出例子（如二手车卖家、疼痛案例）"],"model":"Doubting testimony is reasonable when it rests on relevant evidence available to the hearer at the time and remains responsive to new evidence; it becomes testimonial injustice when the credibility deficit is driven by identity prejudice. A speaker may be perfectly sincere but lack competence on the topic, or may have an interest that gives the hearer reason to check, as with a used-car seller describing a car. Doubting such claims is not unjust, provided the hearer updates once independent evidence, such as a mechanic\u0027s inspection, supports the claim. What distinguishes prejudice is its resistance to counter-evidence: the hearer discounts the speaker because of the group she belongs to and keeps doing so whatever she shows. We also cannot judge a doubt by hindsight. In The Terminator, the police are reasonable not to believe Kyle Reese\u0027s story about time travel, given their evidence, even though the audience knows it is true. So the test is not whether the testimony was true, but why it was doubted and whether the doubt would yield to evidence."},{"id":"soc-L15-e01","module":"soc","lecture":"L15","prompt":"How can doubt about a well-supported scientific conclusion be manufactured even if no one tells an outright lie, and how should a careful reasoner respond?","points":["机制：selective promotion 放大少数（可能真诚的）研究；false balance 让分歧显得五五开；misleading implicature；借用专家形象（香烟“医生之选”）","目标：不必证明相反结论，只需让人推迟判断和行动，维持 status quo（烟草备忘录）","应对一：查来源与资助，但资助≠结论必假；看整体证据分量（数量、质量、可重复性）","应对二：用 credence 表达把握程度并随证据更新；区分细节不确定与主结论存疑；在不确定下仍可依据风险和成本行动"],"model":"Doubt can be manufactured without lying by distorting which evidence people see. An interested party can fund or publicise the few studies that favour it, which may be honestly conducted, so that the visible evidence looks more divided than the whole body of research. Media \u0027balance\u0027 that gives one sceptic and one scientist equal time strengthens this impression, and literally true messages can carry misleading implicatures. The tobacco industry\u0027s strategy, described in Merchants of Doubt, shows that the goal is not to prove the opposite conclusion but to make the public feel the question is unsettled, which delays action and protects the status quo. A careful reasoner should ask who funds and promotes a claim, treating this as a reason for scrutiny rather than automatic rejection, and then weigh the total evidence by its quantity, quality and replicability. She should express her view as a credence that updates on evidence, separate uncertainty about details from doubt about the main conclusion, and remember that action under uncertainty depends on both probabilities and costs, so certainty is not required before acting."},{"id":"soc-L17-e01","module":"soc","lecture":"L17","prompt":"Explain how advertising can influence behaviour without giving consumers any false information. Refer to at least two strategies discussed in the lecture.","points":["核心论点：广告的作用主要在于引导注意力（attention direction），而非提供假信息","区分信息型、联想型广告；至少讲清两种 Tim Wu 的策略：demand engineering / branding / targeting（各配例子）","共同关注（shared attention）产生相互预期/共同知识：即使私下不信，也会因预期别人的评价而改变行为（体味广告、一战海报）","可加：绝对 vs 相对标准，Galbraith 的“欲望被制造”"],"model":"Advertising often works not by asserting falsehoods but by directing attention and shaping expectations. Associative advertising simply pairs a product with a feeling, as when beer is repeatedly shown with relaxed workers, so that seeing the brand calls up that mood. Demand engineering goes further: it first makes a previously unnoticed condition seem like a problem, such as body odour that \u0027others may notice\u0027, and then offers the product as the solution. Targeting tells a particular audience that people like them want the product. None of these needs to contain a false claim. Their power is amplified by shared attention. When many people see the same public message, each person expects that others have seen it and may judge by the standard it promotes. I might not personally think mild body odour matters, but if I expect others to care, I buy deodorant anyway; wartime posters worked in the same way. Advertising can thereby create new norms and wants, which is why Galbraith questioned the idea that production merely satisfies pre-existing needs."},{"id":"soc-L19-e01","module":"soc","lecture":"L19","prompt":"Explain C. Thi Nguyen\u0027s distinction between an epistemic bubble and an echo chamber. Why are echo chambers harder to escape?","points":["Epistemic bubble：相关声音因 omission 被排除（例如过滤），没有被主动贬低","Echo chamber：相关外部声音被 actively discredited，成员预先不信任外部来源","泡泡容易逃：接触被遗漏的信息即可；回音室自我强化，反面证据被当作敌意或伪造（阴谋论、Jonestown、原教旨宗教例子）","可加：过滤本身必要，所以某种程度的泡泡不可避免；推荐算法的反馈循环可能把泡泡推向回音室"],"model":"Nguyen distinguishes two ways an information network can go wrong. An epistemic bubble is a network from which relevant voices have been excluded by omission. Because our attention is limited, we must filter, and filtering can leave out sources we ought to hear, as when a left-leaning academic\u0027s feed rarely shows news about One Nation. Nothing in a bubble tells me to distrust what is missing. An echo chamber is a social structure in which relevant outside voices have been actively discredited. Members may even read the other side, but only to explain why those people are malicious and untrustworthy. Jim Jones taught his followers that anyone who called Jonestown a cult was an enemy. Bubbles are relatively easy to escape: I simply expose myself to the omitted information. Echo chambers are self-reinforcing, because the outside evidence that could correct members\u0027 views has been discredited in advance, and contrary evidence can even be taken as confirmation, as when conspiracy theorists treat strong evidence as proof of a cover-up. Exposure alone cannot break an echo chamber."},{"id":"soc-L19-e02","module":"soc","lecture":"L19","prompt":"Herbert Simon claimed that \u0027a wealth of information creates a poverty of attention\u0027. Explain this claim and what it implies for how we find information online.","points":["解释 Simon：信息消耗接收者的注意力；信息丰富时注意力成为稀缺资源，信息成本主要由接收者承担；注意力是串行的","组织例子（层级汇总过滤）或 ANU 表格例子；现代意义：注意力被广告商购买","推论：过滤是必要的而非懒惰；PageRank 用流行度作为信息性的代理，算法推“像你的人喜欢的”","风险：可被操纵、形成认识泡泡、推荐反馈循环趋向极端；在线环境不是被动的；从零重启不可行（Neurath 之船）"],"model":"Simon\u0027s point is that information is not free to use: it consumes the attention of whoever receives it. Since attention is serial, letting us attend to only one thing at a time, an abundance of information makes attention the scarce resource, and most of the cost of information falls on the recipient rather than the producer. Organisations therefore need intermediaries who summarise and filter. Online, the same logic means filtering is necessary rather than lazy: we could never survey billions of pages. Google\u0027s PageRank solved this by ranking pages that many other pages link to, using popularity as a proxy for informativeness without understanding content, and social media feeds show us what people like us engage with. These filters are useful but carry risks: they can be gamed, they can leave relevant voices out and so create epistemic bubbles, and feedback loops can push users toward extreme content. Because the online environment actively models and shapes us, we cannot simply start afresh; we must repair our trust in sources gradually, like Neurath\u0027s sailors rebuilding their ship at sea."}]}]);
const KP = [{"cards":{"logic-L1-argument":{"ana":"劝朋友：“预报说要下雨，乌云也来了，所以带伞吧。”前两句是前提（理由），最后一句是结论。"},"logic-L1-critical-thinking":{"ana":"像做菜：食材新不新鲜（前提可靠吗）和菜谱步骤对不对（推理好吗）要分开检查，任何一样出问题菜都可能砸。"},"logic-L1-nec-suff":{"ana":"有电是手机开机的必要条件：没电肯定开不了，但有电也可能因为坏了开不了。中头奖则足以让你有钱，是充分条件。"},"logic-L4-validity":{"ana":"有效像一根“保真”管道：只要入口放进的都是真话，出口出来的一定是真话；入口是假话时，出口真假都有可能。"},"logic-L4-soundness":{"ana":"健全 = 好菜谱 + 好食材：步骤正确（有效），食材也全是新鲜的（前提都真），端出来的菜一定没问题（结论必真）。"},"logic-L4-counterexample":{"ana":"“他穿西装，所以他是经理”：只要想象一个穿西装的实习生（前提真、结论假），就证明这个推理无效。"},"logic-L4-contradictory-premises":{"ana":"前提说“灯开着”又说“灯没开”——这样的世界根本不存在，自然找不到“前提全真、结论却假”的反例，于是有效但必不健全。"},"logic-L4-conclusion-necessary":{"ana":"结论是“明天要么下雨要么不下雨”：不管前提说什么，它都不可能错，所以找不到反例，论证自动有效。"},"logic-L4-hidden-premise":{"ana":"“下雨了，所以比赛取消。”中间藏着一句没说出口的前提：“下雨的话比赛就取消”。重构就是把它写出来再检查。"},"logic-L4-proposition":{"ana":"“今天北京下雪了”可真可假，是命题；“快关窗！”“你吃饭了吗？”无所谓真假，不能当前提或结论。"},"logic-L4-entailment":{"ana":"“这是柯基”蕴涵“这是狗”，“这是狗”蕴涵“这是动物”，于是“这是柯基”直接蕴涵“这是动物”——蕴涵可以接力。"},"logic-L4-mutual-exclusivity":{"ana":"此刻“我在北京”与“我在上海”互斥，“我在上海”与“我在故宫”互斥，但“我在北京”和“我在故宫”可以同真——互斥不传递。"},"logic-L6-truth-table":{"ana":"像点奶茶：冰/不冰、加糖/不加、加珍珠/不加，3 个二选一共 2×2×2 = 8 种组合，所以 3 个原子命题要 8 行。"},"logic-L6-connectives":{"ana":"~ 像翻转键；\u0026 像串联灯泡，两开关都开才亮；∨ 像并联，任一开就亮；⊃ 像“到站就叫我”，只有到站了没叫才算失约。"},"logic-L6-inclusive-or":{"ana":"商店说“满 100 元或是会员可打折”：你既满 100 又是会员，当然也能打折——两边都真，“或”仍然成立。"},"logic-L6-main-connective":{"ana":"像俄罗斯套娃最外面那一层：先拆开它才看到里面的小块，整句的真假最终由这一层决定。"},"logic-L6-logical-truth":{"ana":"“这道题我要么做对了，要么没做对”——不用看答案也知道它必真，因为在任何情况下都成立。"},"logic-L6-logical-falsehood":{"ana":"“我现在既在睡觉又没在睡觉”——不管现实怎样都不可能成立，就像要求一盏灯同时亮着又灭着。"},"logic-L6-contingent":{"ana":"“今天会下雨”可能真也可能假，要看实际天气；大多数日常陈述都是这种偶然命题。"},"logic-L6-shortcuts":{"ana":"“带现金或能扫码”就能付款：已带现金就不必再查扫码（T∨X=T）；“有票且有身份证”才能进场：没票就直接进不了（F\u0026X=F）。"},"logic-L6-equivalence":{"ana":"“如果下雨我就带伞”和“要么不下雨，要么我带伞”说法不同，但在每一种情况下真假都一样，所以逻辑等价。"},"logic-L6-de-morgan":{"ana":"“并非（会唱歌或会跳舞）”= 既不会唱也不会跳；“并非（又高又帅）”= 不高或不帅，至少缺一样。"},"logic-L6-double-negation":{"ana":"像连按两次电灯开关：关了又开，回到原来的状态；“并非他没来”就是“他来了”。"},"logic-L6-material-conditional":{"ana":"妈妈说“如果你考满分，就给你买手机”：只有考了满分却没买才算食言；没考满分时，买不买都不算违约。"},"logic-L6-validity-logical-truth":{"ana":"有效论证像一份永不违约的保证书：“如果前提全都成立，那么结论成立”，在任何情况下都不会被打破，所以永真。"},"logic-L8-x-or-not-x":{"ana":"“这个包裹要么到了，要么没到”必真，包裹里装什么都无所谓；同理，X 再长再复杂，X ∨ ~X 都必真。"},"logic-L8-neither-notboth":{"ana":"图书馆“既不许吃东西也不许打电话”是 Neither，只吃零食就违规；“不许边吃边打电话”是 Not both，只吃不打不违规。"},"logic-L10-me-truth-table":{"ana":"像核对两人的排班表：逐天看有没有哪天两人同时上班，一天都没有就是互斥；两人都休息的日子不影响结论。"},"logic-L10-equivalence-simplify":{"ana":"“（下雨且带了伞）或（下雨且没带伞）”其实就等于“下雨了”——带不带伞两种情况合起来，只剩下雨这件事。"}}},
{"cards":{"logic-L1-argument":{"kind":"选论证的定义","tip":"看到「前提给结论提供理由」→选它；吵架、真话罗列都不是。"},"logic-L1-critical-thinking":{"kind":"公式填空/逻辑保证什么","tip":"问「逻辑保证什么」→选「前提真则结论必真」。"},"logic-L1-nec-suff":{"kind":"找推理错误类型","tip":"看到「不A就不B ∴ 有A就有B」→把必要当成充分。"},"logic-L4-validity":{"kind":"判断论证是否有效","tip":"只问「前提全T时结论能否F」→能就无效。"},"logic-L4-soundness":{"kind":"判有效/健全组合","tip":"先判有效，再查前提真假；「无效但健全」直接排除。"},"logic-L4-counterexample":{"kind":"找反例/真值表判有效","tip":"只看前提全T的行：有一行结论F→无效，该行就是反例。"},"logic-L4-contradictory-premises":{"kind":"判矛盾前提的论证","tip":"看到前提里有A和~A→直接选「有效但不健全」。"},"logic-L4-conclusion-necessary":{"kind":"判结论永真的论证","tip":"看到结论是 X ∨ ~X→有效；再看前提有假→不健全。"},"logic-L4-hidden-premise":{"kind":"补隐含前提","tip":"找前提到结论缺的那一环→选正好补上它的选项。"},"logic-L4-proposition":{"kind":"短定义/判是否命题","tip":"只看能否判真假：问句、命令排除，陈述句才能当前提。"},"logic-L4-entailment":{"kind":"蕴涵的传递与方向","tip":"蕴涵能接力：A⊨B、B⊨C→A⊨C；互斥不能接力。"},"logic-L4-mutual-exclusivity":{"kind":"判互斥的性质","tip":"互斥只禁同真、可同假；「恰好一真」「可传递」都是错项。"},"logic-L6-truth-table":{"kind":"数真值表行数","tip":"只数不同字母个数 n→行数 2ⁿ；重复字母和 ~ 不算。"},"logic-L6-connectives":{"kind":"代值算真值/符号翻译","tip":"先看 ~ 管多远，再由内向外代值；but 译成 \u0026。"},"logic-L6-inclusive-or":{"kind":"两边都真时∨取值","tip":"两边都真→选 True；「or 意为恰好一个」是干扰项。"},"logic-L6-main-connective":{"kind":"找主联结词","tip":"找所有括号之外的那个联结词→就是主联结词。"},"logic-L6-logical-truth":{"kind":"给式子判类型/术语","tip":"看到 X ∨ ~X 结构→永真；「逻辑真理」只配句子。"},"logic-L6-logical-falsehood":{"kind":"给式子判类型","tip":"\u0026 连起的式子里同时有 C 和 ~C→直接判永假。"},"logic-L6-contingent":{"kind":"给式子判类型","tip":"找到一行 T、一行 F 就停→偶然；「无法判断」是错项。"},"logic-L6-shortcuts":{"kind":"选正确捷径/速判类型","tip":"记 T∨X=T、F\u0026X=F、F⊃X=T；F∨X、T\u0026X 等于 X。"},"logic-L6-equivalence":{"kind":"选等价式/判是否等价","tip":"A⊃B 改写成 ~A∨B 或 ~(A\u0026~B)；B⊃A、A∨~B 排除。"},"logic-L6-de-morgan":{"kind":"德摩根改写/挑错","tip":"~ 拆进括号：每项加 ~ 且 \u0026 和 ∨ 互换；只改一样的都错。"},"logic-L6-double-negation":{"kind":"化简 ~~","tip":"看到 ~~ 直接删两个；配合德摩根：~(A∨~B)→~A \u0026 B。"},"logic-L6-material-conditional":{"kind":"判 ⊃ 何时为假","tip":"只有前件T后件F才假；前件假一律为T，「无法判断」是错项。"},"logic-L6-validity-logical-truth":{"kind":"论证与条件句互换","tip":"有效→(P1\u0026P2)⊃C 永真，~(P1\u0026P2)∨C 永真，(P1\u0026P2)\u0026~C 永假。"},"logic-L8-x-or-not-x":{"kind":"给复合式判类型","tip":"相同括号整体当 X：X∨~X 永真，X\u0026~X 永假，不用画表。"},"logic-L8-neither-notboth":{"kind":"规则判违规/符号化","tip":"not both＝~(A\u0026B) 只禁全做；neither＝~A\u0026~B 做任一样都违规。"},"logic-L10-me-truth-table":{"kind":"真值表判是否互斥","tip":"找一行两式同为 T→有则不互斥；互为否定→必互斥。"},"logic-L10-equivalence-simplify":{"kind":"化简后算概率","tip":"先把 (A\u0026B)∨(A\u0026~B) 化成 A；两支互斥→相加，别相乘。"}}},
{"cards":{"logic-L1-argument":{"one":"论证 = 一组前提（premises）为一个结论（conclusion）提供理由。","en":"A set of premises offered as reasons to believe a conclusion.","qs":["logic-L1-q01","soc-L1-q07"]},"logic-L1-critical-thinking":{"one":"评价论证分两步：推理是否支持结论（逻辑/概率）+ 前提是否可靠（认识论）。","en":"Critical thinking = reliable premises + good reasoning: check both premise reliability and whether premises support the conclusion.","qs":["logic-L1-q02","logic-L1-q05"]},"logic-L1-nec-suff":{"one":"充分：有 A 就保证 B（A → B）；必要：没有 A 就不可能有 B（B → A）。","en":"A is sufficient for B if A guarantees B; A is necessary for B if B cannot hold without A.","qs":["logic-L1-q04","soc-L1-q04","soc-L1-q05"]},"logic-L4-validity":{"one":"有效 ⇔ 不可能存在前提全真而结论为假的情况，与前提实际真假无关。","en":"Valid iff there is no possible situation in which all premises are true and the conclusion is false.","qs":["logic-L4-q01","logic-L4-q09","logic-L4-q10","logic-L4-q07","logic-L4-q06"]},"logic-L4-soundness":{"one":"健全 = 有效 + 所有前提事实上为真，故结论必真。","en":"Sound iff the argument is valid and all its premises are actually true.","qs":["logic-L4-q08","logic-L4-q06"]},"logic-L4-counterexample":{"one":"找一个前提全真、结论为假的可能世界：找得到 → 无效，找不到 → 有效。","en":"Test validity by seeking a possible world with all premises true and conclusion false; if one exists, invalid.","qs":["logic-L4-q13","logic-L4-q07","logic-L6-q25","logic-L6-c04","logic-L6-q24","logic-L6-q26","logic-L6-c05","logic-L4-c11"]},"logic-L4-contradictory-premises":{"one":"前提互相矛盾 → 不可能全真 → 无反例 → 论证有效，但永远不健全。","en":"Contradictory premises cannot all be true, so no counterexample exists: the argument is valid but never sound.","qs":["logic-L4-q03","logic-L4-q04","logic-L4-q02","logic-L4-c09"]},"logic-L4-conclusion-necessary":{"one":"结论是逻辑真理（不可能为假）→ 无论前提是什么，论证都有效。","en":"If the conclusion cannot be false, no counterexample exists, so the argument is valid whatever the premises.","qs":["logic-L4-q05"]},"logic-L4-hidden-premise":{"one":"隐含前提是连接已给前提与结论所需的未说出假设；重构论证就是把它写出来再评价。","en":"An unstated assumption needed to connect the stated premises to the conclusion; reconstruction makes it explicit.","qs":["logic-L4-q11","logic-L1-q03","logic-L4-q12"]},"logic-L4-proposition":{"one":"命题是可真可假的陈述，只有命题能做前提或结论；命令和问题不是命题。","en":"A statement that can be true or false; only propositions can be premises or conclusions, not commands or questions.","qs":[]},"logic-L4-entailment":{"one":"A 蕴涵 B ⇔ A 真时 B 不可能假；蕴涵可传递，论证有效 ⇔ 前提合取蕴涵结论。","en":"A entails B iff it is impossible for A to be true while B is false; entailment is transitive.","qs":["logic-L4-q15","logic-L4-q16"]},"logic-L4-mutual-exclusivity":{"one":"互斥 = 不能同时为真（可以同假）；互斥不具有传递性。","en":"Two propositions are mutually exclusive iff they cannot both be true; mutual exclusivity is not transitive.","qs":["logic-L4-q14","logic-L10-q03"]},"logic-L6-truth-table":{"one":"真值表列出原子命题的所有真值组合，n 个不同原子命题需 2ⁿ 行（与联结词个数无关）。","en":"A table giving a proposition\u0027s truth value under every valuation of its atoms; n distinct atoms need 2ⁿ rows.","qs":["logic-L6-q01","logic-L6-q02"]},"logic-L6-connectives":{"one":"~A 在 A 假时真；A \u0026 B 两真才真；A ∨ B 两假才假；A ⊃ B 仅 A 真 B 假时为假。","en":"~A true iff A false; A \u0026 B true iff both true; A ∨ B false only if both false; A ⊃ B false only if A true, B false.","qs":["logic-L6-q28","logic-L6-q19","logic-L6-q29"]},"logic-L6-inclusive-or":{"one":"本课程的 ∨ 是包容性或：两边都真时 A ∨ B 也为真，只有两边都假才假。","en":"A ∨ B is true when A, B, or both are true; false only when both are false.","qs":["logic-L6-q20"]},"logic-L6-main-connective":{"one":"主联结词是最外层、连接整个命题主要部分的联结词，决定整体真值。","en":"The outermost connective joining the main parts of a proposition; it determines the truth value of the whole.","qs":["logic-L6-q03","logic-L6-q04"]},"logic-L6-logical-truth":{"one":"逻辑真理（永真式）：在原子命题的每一种赋值下都为真，即目标列全 T。","en":"A proposition true under every possible valuation of its atomic propositions.","qs":["logic-L6-c03","logic-L6-q31","logic-L6-q08"]},"logic-L6-logical-falsehood":{"one":"逻辑假（矛盾式）：在原子命题的每一种赋值下都为假，即目标列全 F。","en":"A proposition false under every possible valuation of its atomic propositions.","qs":["logic-L6-q07","logic-L6-c02","logic-L6-q09"]},"logic-L6-contingent":{"one":"偶然命题：在某些赋值下真、某些赋值下假，目标列有 T 也有 F。","en":"A proposition true under some valuations and false under others.","qs":["logic-L6-q05","logic-L6-q06","logic-L6-c01","logic-L6-q10"]},"logic-L6-shortcuts":{"one":"主联结词一侧能定值时另一侧不必算：T ∨ X = T，F \u0026 X = F（但 T \u0026 X、F ∨ X 不能走捷径）。","en":"If one side settles the main connective\u0027s value, skip the other: T ∨ X = T, F \u0026 X = F.","qs":["logic-L6-q11","logic-L6-q08","logic-L6-q09","logic-L6-q10"]},"logic-L6-equivalence":{"one":"逻辑等价（≡）：两个命题在每一种赋值下真值都相同，有一行不同就不等价。","en":"Two propositions are logically equivalent iff they have the same truth value under every possible valuation.","qs":["logic-L6-q21","logic-L6-c07","logic-L6-q14","logic-L6-q15","logic-L6-c06"]},"logic-L6-de-morgan":{"one":"~ 穿过括号时每项都否定且 \u0026 与 ∨ 互换：~(A ∨ B) ≡ ~A \u0026 ~B，~(A \u0026 B) ≡ ~A ∨ ~B。","en":"Negation of a disjunction ≡ conjunction of negations; negation of a conjunction ≡ disjunction of negations.","qs":["logic-L6-q16","logic-L6-q17","logic-L6-q18","logic-L8-q07","logic-L6-c06"]},"logic-L6-double-negation":{"one":"两个否定相互抵消：~~A ≡ A（偶数个 ~ 消失，奇数个剩一个）。","en":"Two negations cancel: ~~A is equivalent to A.","qs":["logic-L6-q18"]},"logic-L6-material-conditional":{"one":"A ⊃ B 仅在前件 A 真、后件 B 假时为假，其余（含前件为假）都为真；≡ ~A ∨ B。","en":"A ⊃ B is false only when antecedent A is true and consequent B is false; true otherwise.","qs":["logic-L6-q12","logic-L6-q13","logic-L6-q30","logic-L6-q27","logic-L6-q14","logic-L6-q15","logic-L6-c07"]},"logic-L6-validity-logical-truth":{"one":"论证有效 ⇔ (P1 \u0026 P2 \u0026 … ) ⊃ C 是逻辑真理（即 ~(P1 \u0026 P2 \u0026 …) ∨ C 永真）。","en":"An argument is valid iff the conditional (conjunction of premises) ⊃ conclusion is a logical truth.","qs":["logic-L6-q22","logic-L6-q23","logic-L6-c04","logic-L6-c05","logic-L6-q24","logic-L6-q25","logic-L6-q26","logic-L4-c11"]},"logic-L8-x-or-not-x":{"one":"任意命题 X（可为复合）：X ∨ ~X 是逻辑真理，X \u0026 ~X 是逻辑假。","en":"For any proposition X, however complex, X ∨ ~X is a logical truth and X \u0026 ~X a logical falsehood.","qs":["logic-L8-q01","logic-L8-q02","logic-L8-c10"]},"logic-L8-neither-notboth":{"one":"Neither = ~(A ∨ B) ≡ ~A \u0026 ~B（两者都假）；Not both = ~(A \u0026 B) ≡ ~A ∨ ~B（至少一个假）。","en":"\u0027Neither A nor B\u0027 is ~(A ∨ B) ≡ ~A \u0026 ~B; \u0027not both\u0027 is ~(A \u0026 B) ≡ ~A ∨ ~B.","qs":["logic-L8-q03","logic-L8-q04","logic-L8-q05","logic-L8-q06","logic-L8-q07"]},"logic-L10-me-truth-table":{"one":"两个复合命题互斥 ⇔ 联合真值表中没有任何一行二者同为 T（同为 F 不影响）。","en":"Two compound propositions are mutually exclusive iff no row of their joint truth table makes both true.","qs":["logic-L10-q01","logic-L10-q06","logic-L10-q02","logic-L10-c08"]},"logic-L10-equivalence-simplify":{"one":"逻辑等价的命题每种情况真值相同、概率也相同，可用更简单的等价式替换，如 (A \u0026 B) ∨ (A \u0026 ~B) ≡ A。","en":"Logically equivalent propositions share truth values and probabilities, so a compound can be replaced by a simpler equivalent.","qs":["logic-L10-q04","logic-L10-q05"]}}},
{"cards":{"logic-L1-argument":{"q":"下列哪一项是论证（argument）？A. 两人激烈争吵 B. 罗列三条关于企鹅的真话 C. 「全班都认真复习了，所以平均分会提高」","a":"C","why":"论证要用前提作理由支持结论；A、B 都没有这种支持关系。"},"logic-L1-critical-thinking":{"q":"某人每一步推理都对，结论却错了。按「批判性思维＝可靠前提＋好推理」，问题出在哪？A. 推理 B. 前提 C. 不可能出现这种情况","a":"B. 前提不可靠","why":"推理没错而结论错，只能是起点前提有误，这归认识论检查。"},"logic-L1-nec-suff":{"q":"「满 18 岁是在澳洲合法买酒的必要条件（necessary）」意思是？A. 满 18 岁就一定能买 B. 未满 18 岁不能买 C. 两者都对","a":"B","why":"必要条件＝没有 A 就没有 B（B → A），不保证有 A 就有 B。"},"logic-L4-validity":{"q":"P1 所有鱼都会飞；P2 鲸是鱼；∴ 鲸会飞。该论证是？A. 有效（valid） B. 无效，因为前提假 C. 无效，因为结论假","a":"A. 有效","why":"若两前提都真，结论不可能假；前提事实上为假不影响有效性。"},"logic-L4-soundness":{"q":"P1 所有正方形都有四条边；P2 这个图形是正方形；∴ 它有四条边。若 P2 事实上为假，该论证是？A. 有效且健全 B. 有效但不健全 C. 无效","a":"B. 有效但不健全","why":"前提真则结论必真，所以有效；但 P2 为假，不满足健全（sound）。"},"logic-L4-counterexample":{"q":"证明「学生都喝咖啡；Sam 喝咖啡 ∴ Sam 是学生」无效的反例是？A. Sam 是学生且喝咖啡 B. 学生都喝咖啡，Sam 喝咖啡但不是学生 C. Sam 不喝咖啡","a":"B","why":"反例必须让所有前提为真、结论为假；A、C 都不满足。"},"logic-L4-contradictory-premises":{"q":"P1 Klein 养猫；P2 Klein 不养猫；∴ 月亮是奶酪做的。该论证是？A. 无效 B. 有效但不健全 C. 有效且健全","a":"B. 有效但不健全","why":"两前提不可能同真，就没有反例，所以有效；前提不能全真，故不健全。"},"logic-L4-conclusion-necessary":{"q":"P1 汉堡会唱歌；∴ 明天下雨或明天不下雨。该论证是？A. 无效，前提与结论无关 B. 有效但不健全 C. 健全","a":"B. 有效但不健全","why":"结论 R ∨ ~R 不可能为假，没有反例，所以有效；P1 为假，不健全。"},"logic-L4-hidden-premise":{"q":"「Jo 是医生，所以 Jo 会急救。」重构（reconstruction）应补的隐含前提是？A. 医生都会急救 B. 会急救的都是医生 C. Jo 很聪明","a":"A. 医生都会急救","why":"补上 A 后前提真则结论必真；B 方向反了，C 连接不到结论。"},"logic-L4-proposition":{"q":"下列哪一句能做论证的前提？A. 「请交作业！」 B. 「你交作业了吗？」 C. 「这首歌我听着很难听。」","a":"C","why":"只有可真可假的命题能做前提；C 讲明是说话者的感受，可真可假。"},"logic-L4-entailment":{"q":"A＝「x 是正方形」，B＝「x 是矩形」。下列哪项正确？A. A 蕴涵（entails）B B. B 蕴涵 A C. A 与 B 逻辑等价","a":"A. A 蕴涵 B","why":"x 是正方形时不可能不是矩形；矩形却不一定是正方形，蕴涵是单向的。"},"logic-L4-mutual-exclusivity":{"q":"掷一次骰子，A＝掷出偶数，B＝掷出 3。下列哪项正确？A. 互斥，且必有一个为真 B. 互斥，但可以同时为假 C. 不互斥","a":"B","why":"偶数与 3 不能同真；掷出 1 时两者都假，互斥不要求一真一假。"},"logic-L6-truth-table":{"q":"(P ⊃ Q) \u0026 (~R ∨ P) 的完整真值表需要几行？A. 4 B. 8 C. 16","a":"B. 8 行","why":"只数不同的原子命题：P、Q、R 共 3 个，2³ = 8。"},"logic-L6-connectives":{"q":"A=T, B=F 时，~A ∨ (A ⊃ B) 的真值是？A. T B. F","a":"B. F","why":"~A 为 F；A 真 B 假使 A ⊃ B 为 F；F ∨ F = F。"},"logic-L6-inclusive-or":{"q":"C＝「我会弹琴」，D＝「我会唱歌」。如果两样都会，本课中 C ∨ D 是？A. 真 B. 假 C. 既不真也不假","a":"A. 真","why":"本课的 ∨ 是包容性或，只有两边都假时才为假。"},"logic-L6-main-connective":{"q":"~(A \u0026 B) ⊃ ~C 的主联结词（main connective）是？A. 最左边的 ~ B. \u0026 C. ⊃","a":"C. ⊃","why":"最左边的 ~ 只管括号 (A \u0026 B)；把两大块连起来的是 ⊃。"},"logic-L6-logical-truth":{"q":"下列哪个是逻辑真理（logical truth）？A. A ⊃ A B. A ⊃ ~A C. A \u0026 B","a":"A. A ⊃ A","why":"A ⊃ A 要为假需 A 既真又假，不可能，所以每一行都是 T。"},"logic-L6-logical-falsehood":{"q":"将 (A ∨ B) \u0026 (~A \u0026 ~B) 分类：A. 逻辑真理 B. 逻辑假（logical falsehood） C. 偶然（contingent）","a":"B. 逻辑假","why":"~A \u0026 ~B ≡ ~(A ∨ B)，整式是 X \u0026 ~X，每一行都为假。"},"logic-L6-contingent":{"q":"将 A ⊃ (A \u0026 B) 分类：A. 逻辑真理 B. 逻辑假 C. 偶然（neither） D. 无法判断","a":"C. 偶然","why":"A=F 时为 T；A=T、B=F 时为 F；有 T 有 F 就是偶然。"},"logic-L6-shortcuts":{"q":"将 (B \u0026 ~B) \u0026 ((A ⊃ C) ∨ ~D) 分类：A. 逻辑真理 B. 逻辑假 C. 偶然","a":"B. 逻辑假","why":"左边 B \u0026 ~B 永假，主联结词是 \u0026，F \u0026 X = F，右边不用算。"},"logic-L6-equivalence":{"q":"下列哪项与 ~A ⊃ B 逻辑等价（logically equivalent）？A. A ∨ B B. ~A ∨ B C. A \u0026 B","a":"A. A ∨ B","why":"X ⊃ Y ≡ ~X ∨ Y，代入得 ~~A ∨ B，消去双重否定即 A ∨ B。"},"logic-L6-de-morgan":{"q":"~(~A ∨ B) 等价于？A. A \u0026 ~B B. A ∨ ~B C. ~A \u0026 B","a":"A. A \u0026 ~B","why":"德摩根律：每项加 ~，∨ 变 \u0026，得 ~~A \u0026 ~B，再消去双重否定。"},"logic-L6-double-negation":{"q":"~~~(A \u0026 B) 等价于？A. A \u0026 B B. ~(A \u0026 B) C. ~A \u0026 ~B","a":"B. ~(A \u0026 B)","why":"三个 ~ 是奇数个，消掉一对剩一个，仍作用于整个括号。"},"logic-L6-material-conditional":{"q":"把「如果下雨，比赛就取消」读作实质条件句（⊃），哪种情况下它为假？A. 没下雨，比赛取消 B. 下雨，比赛没取消 C. 没下雨，比赛没取消","a":"B","why":"A ⊃ B 只在前件真、后件假时为假；前件为假时整句都为真。"},"logic-L6-validity-logical-truth":{"q":"P1, P2 ∴ C 有效。哪个必是逻辑假（logical falsehood）？A. (P1 \u0026 P2) ⊃ C B. (P1 \u0026 P2) \u0026 ~C C. ~(P1 \u0026 P2) ∨ C","a":"B. (P1 \u0026 P2) \u0026 ~C","why":"B 描述「前提全真且结论假」，有效论证不可能如此，所以每行都假。"},"logic-L8-x-or-not-x":{"q":"将 (A ⊃ ~B) \u0026 ~(A ⊃ ~B) 分类：A. 逻辑真理 B. 逻辑假 C. 偶然","a":"B. 逻辑假","why":"令 X＝(A ⊃ ~B)，整式就是 X \u0026 ~X，不论 X 真假都为假。"},"logic-L8-neither-notboth":{"q":"规则 ~(S \u0026 M)（S＝穿拖鞋，M＝戴帽子）。只穿拖鞋、不戴帽子的人违规吗？A. 违规 B. 不违规","a":"B. 不违规","why":"~(S \u0026 M) ≡ ~S ∨ ~M，只禁止两样同时做；他没戴帽子，规则仍为真。"},"logic-L10-me-truth-table":{"q":"用真值表判断 A \u0026 B 与 A ∨ ~B 的关系：A. 互斥（mutually exclusive） B. 不互斥 C. 逻辑等价","a":"B. 不互斥","why":"A=T、B=T 时两式都为 T；只要有一行同真就不互斥。"},"logic-L10-equivalence-simplify":{"q":"已知 P(A \u0026 B)＝1/4，P(~A \u0026 B)＝1/3，求 P(B)。","a":"7/12","why":"两支分别要求 A、~A，互斥，合起来等价于 B：1/4＋1/3＝7/12。"}}},
{"cards":{"logic-L1-argument":{"name":"论证（前提与结论）","one":"论证（argument）：用前提当理由，支持一个结论。","pts":["写法：P1, P2 … ∴ C，∴ 读作「所以」。","前提必须真能支持结论。","吵架、罗列真话、专家背书都不是论证。"],"ex":"「乌云来了，预报也说下雨，所以带伞」：前两句是前提，最后一句是结论。","trap":"两句真话连着说不等于论证，前提要能支持结论。","ana":"劝朋友：“预报说要下雨，乌云也来了，所以带伞吧。”前两句是前提（理由），最后一句是结论。","words":[{"en":"heated disagreement","zh":"激烈争吵","m":"日常意义的吵架"},{"en":"expert testimony","zh":"专家证言","m":"专家说的话，被当作证据"},{"en":"offered as reasons","zh":"作为理由提出","m":"拿来支持结论"},{"en":"unstated premise","zh":"未说出的前提","m":"即隐含前提，被省略的假设"},{"en":"reconstruction","zh":"重构","m":"把论证完整写出，补上隐含前提"},{"en":"potato cakes / scallops","zh":"炸土豆饼","m":"同一种食物的两种叫法"},{"en":"Victoria","zh":"维多利亚州（维州）","m":"澳大利亚的一个州"},{"en":"Tasmania","zh":"塔斯马尼亚州（塔州）","m":"澳大利亚的一个州"},{"en":"conclusion","zh":"结论","m":"论证要支持的那句话"},{"en":"guarantee","zh":"保证","m":"确保一定成立"},{"en":"illustrate","zh":"说明、例示","m":"用例子展示"},{"en":"lesson","zh":"教训、启示","m":"从例子中学到的道理"}]},"logic-L1-critical-thinking":{"name":"批判性思维","one":"批判性思维（critical thinking）＝可靠前提＋好推理。","pts":["推理对不对：逻辑、概率来查。","前提靠不靠谱：认识论（epistemology）来查。","逻辑只保证：前提真则结论必真。"],"ex":"推理步步都对、结论却错→问题在前提，像地图错了，导航再准也到错地方。","trap":"以为推理对结论就一定真；前提错结论照样错。","ana":"像做菜：食材新不新鲜（前提可靠吗）和菜谱步骤对不对（推理好吗）要分开检查，任何一样出问题菜都可能砸。","words":[{"en":"reliable","zh":"可靠的","m":"值得信任、不易出错"},{"en":"confident belief","zh":"坚定的相信","m":"很有把握地相信"},{"en":"appeal to authority","zh":"诉诸权威","m":"因为某权威这么说就相信"},{"en":"memorised fallacy labels","zh":"背下来的谬误名称","m":"只记住错误推理的名字"},{"en":"theory of disease","zh":"疾病理论","m":"解释生病原因的理论"},{"en":"guarantee","zh":"保证","m":"确保一定如此"},{"en":"justified","zh":"有正当理由的","m":"有充分证据支持"},{"en":"by itself","zh":"单凭它自己","m":"不靠其他东西"}]},"logic-L1-nec-suff":{"name":"必要条件与充分条件","one":"充分（sufficient）：有A就有B；必要（necessary）：没A就没B。","pts":["充分：A → B。必要：B → A。","必要只是「不能缺」，不保证有了就成。","「不学就不过」＝学习是必要条件。"],"ex":"满18岁是买酒的必要条件：未满不能买，满了也不保证能买。","trap":"把必要当充分：从「不学就不过」推出「学了就一定过」。","ana":"有电是手机开机的必要条件：没电肯定开不了，但有电也可能因为坏了开不了。中头奖则足以让你有钱，是充分条件。","words":[{"en":"condition","zh":"条件","m":"某事成立需要的情况"},{"en":"treat … as if …","zh":"把…当成…","m":"误把一种东西当另一种"},{"en":"exclusive \u0027or\u0027","zh":"排他的或","m":"二选一，不能两个都要"},{"en":"contradictory premises","zh":"矛盾前提","m":"不可能同时为真的前提"},{"en":"required for","zh":"是……所必需的","m":"表示必要条件"},{"en":"enrolment","zh":"注册选课","m":"正式登记修读一门课"},{"en":"neither … nor","zh":"既不……也不","m":"两者都否定"},{"en":"confusing","zh":"混淆","m":"把两样东西弄混"},{"en":"sufficient","zh":"充分的","m":"单独就足够保证"},{"en":"error","zh":"错误","m":"推理中出的错"},{"en":"truth vs validity","zh":"真 vs 有效","m":"命题真假 vs 推理结构"},{"en":"testimony","zh":"证言","m":"别人告诉你的信息"}]},"logic-L4-validity":{"name":"有效性","one":"有效（valid）：前提全真时，结论不可能假。","pts":["只看推理关系，不管前提事实上真不真。","句句都真也可能无效；前提假也可能有效。","有效且结论假 → 至少一个前提假。"],"ex":"所有鱼都会飞；鲸是鱼；∴ 鲸会飞。有效，只是前提假。","trap":"以为句句都真就有效：「他喝咖啡、吃酸奶 ∴ 他养猫」无效。","ana":"有效像一根“保真”管道：只要入口放进的都是真话，出口出来的一定是真话；入口是假话时，出口真假都有可能。","words":[{"en":"if and only if (iff)","zh":"当且仅当","m":"两边互为充分必要条件"},{"en":"possible situation","zh":"可能情况","m":"可以想象、不自相矛盾的世界"},{"en":"relevant","zh":"相关的","m":"和话题有关"},{"en":"suppose","zh":"假设","m":"先当作成立来考虑"},{"en":"actually true","zh":"事实上为真","m":"在现实世界里真"},{"en":"coherently imagine","zh":"无矛盾地想象","m":"想象出的情况不自相矛盾"},{"en":"at least one","zh":"至少一个","m":"一个或更多"},{"en":"combination","zh":"组合","m":"几种情况凑在一起"}]},"logic-L4-soundness":{"name":"健全性","one":"健全（sound）＝有效＋前提事实上全真。","pts":["健全 → 结论一定真。","无效就一定不健全，句句真也没用。","有效但有假前提 → 有效不健全。"],"ex":"所有猫是哺乳动物；Cleo是猫；∴ Cleo是哺乳动物。有效且健全。","trap":"「无效但健全」不存在：健全先要有效。","ana":"健全 = 好菜谱 + 好食材：步骤正确（有效），食材也全是新鲜的（前提都真），端出来的菜一定没问题（结论必真）。","words":[{"en":"hidden premise","zh":"隐含前提","m":"没写出来但需要的前提"},{"en":"added premise","zh":"补上的前提","m":"重构时加进去的前提"},{"en":"authority","zh":"权威","m":"某领域的可靠专家"},{"en":"string theory","zh":"弦理论","m":"一种物理学理论"},{"en":"irrelevant","zh":"无关的","m":"与结论的话题无关"},{"en":"best described as","zh":"最准确的描述是","m":"选最贴切的说法"}]},"logic-L4-counterexample":{"name":"反例法","one":"反例（counterexample）：前提全真、结论却假的情况。","pts":["有反例 → 无效；不可能有 → 有效。","反例要让每个前提都真。","真值表里就是前提全T、结论F的那行。"],"ex":"若下雨则街湿；街湿；∴ 下雨。反例：洒水车弄湿街，没下雨。","trap":"把前提为假的情况当反例，如「下雨了街却没湿」。","ana":"“他穿西装，所以他是经理”：只要想象一个穿西装的实习生（前提真、结论假），就证明这个推理无效。","words":[{"en":"sprinkler","zh":"洒水器","m":"浇草地的喷水装置"},{"en":"conditional","zh":"条件句","m":"「如果…那么…」的句子"},{"en":"still holds","zh":"仍然成立","m":"依旧为真"},{"en":"describe a situation","zh":"描述一个情况","m":"说出一个可能的世界"},{"en":"test","zh":"检验","m":"用方法判断是否有效"},{"en":"row","zh":"行","m":"真值表里的一种真假组合"},{"en":"among those rows","zh":"在这些行中","m":"只看前面选出的那几行"},{"en":"enter 1 = valid, 0 = invalid","zh":"有效填 1，无效填 0","m":"计算题的输入规则"}]},"logic-L4-contradictory-premises":{"name":"矛盾前提→自动有效","one":"前提互相矛盾 → 不可能全真 → 没反例 → 有效但不健全。","pts":["结论是什么都无所谓，照样有效。","前提与结论无关不影响有效。","前提不可能全真，所以永远不健全。"],"ex":"P1 天是蓝的；P2 天不是蓝的；∴ Cleo是猫。有效但不健全。","trap":"看到前提与结论毫无关系就判无效。","ana":"前提说“灯开着”又说“灯没开”——这样的世界根本不存在，自然找不到“前提全真、结论却假”的反例，于是有效但必不健全。","words":[{"en":"contradict one another","zh":"互相矛盾","m":"不可能同时为真"},{"en":"always true of","zh":"总是适用于","m":"对这类东西都成立"},{"en":"can never be","zh":"永远不可能是","m":"任何情况下都不会"},{"en":"whenever","zh":"每当","m":"只要…就…"},{"en":"count as","zh":"算作","m":"被认定为"},{"en":"entail each other","zh":"相互蕴涵","m":"一个真另一个必真，双向"}]},"logic-L4-conclusion-necessary":{"name":"结论必真→自动有效","one":"结论不可能假（如 C ∨ ~C）→ 没反例 → 有效。","pts":["另一条自动有效路线：前提矛盾。","前提荒唐只影响健全，不影响有效。","有前提假 → 有效但不健全。"],"ex":"P1 汉堡会唱歌；∴ 明天下雨或不下雨。有效；P1假，不健全。","trap":"以为结论必真就健全；前提假照样不健全。","ana":"结论是“明天要么下雨要么不下雨”：不管前提说什么，它都不可能错，所以找不到反例，论证自动有效。","words":[{"en":"have nothing to do with","zh":"与…毫无关系","m":"话题不相干"},{"en":"certainly true","zh":"肯定为真","m":"不可能假"}]},"logic-L4-hidden-premise":{"name":"隐含前提与论证重构","one":"隐含前提（hidden premise）：没说出口、但推到结论必须有的那句。","pts":["重构：补上隐含前提再评价。","只补前提，不改对方的结论。","补完可能有效，但补的前提可能假。"],"ex":"「Jo是医生，所以会急救」：补上「医生都会急救」才有效。","trap":"补反方向：该补「医生都会急救」，不是「会急救的都是医生」。","ana":"“下雨了，所以比赛取消。”中间藏着一句没说出口的前提：“下雨的话比赛就取消”。重构就是把它写出来再检查。","words":[{"en":"strictly speaking","zh":"严格来说","m":"按逻辑标准精确判断"},{"en":"as stated","zh":"按原样","m":"不加任何前提时"},{"en":"active","zh":"活跃的","m":"好动"},{"en":"full of mischief / mischievous","zh":"淘气的","m":"爱捣蛋"},{"en":"cause trouble","zh":"惹麻烦","m":"闯祸"},{"en":"keep an eye on","zh":"看着、看管","m":"盯住不让它出事"},{"en":"relevant authority","zh":"相关权威","m":"该领域里真正的专家"},{"en":"appeal to authority","zh":"诉诸权威","m":"因为权威这么说就相信"},{"en":"reconstruction","zh":"重构","m":"把论证整理成前提和结论"},{"en":"target for objection","zh":"反驳的靶子","m":"最该被质疑的地方"},{"en":"follow from","zh":"从……推出","m":"由前提得出"},{"en":"sound","zh":"可靠的（论证）","m":"有效且前提都真"},{"en":"uncontroversially","zh":"毫无争议地","m":"没人会反对"},{"en":"inert","zh":"惰性的","m":"不起任何作用的"}]},"logic-L4-proposition":{"name":"命题","one":"命题（proposition）：能判真假的陈述，只有它能做前提或结论。","pts":["命令（关门！）不是命题。","问句（门关了吗？）不是命题。","主观说法说清是谁的感受后，仍可真可假。"],"ex":"「这首歌我听着难听」说清是我的感受，可真可假，是命题。","trap":"以为主观的话不是命题；讲清说话者后就能判真假。","ana":"“今天北京下雪了”可真可假，是命题；“快关窗！”“你吃饭了吗？”无所谓真假，不能当前提或结论。","words":[{"en":"truth value","zh":"真值","m":"真（T）或假（F）"},{"en":"statement","zh":"陈述","m":"描述事情的句子"}]},"logic-L4-entailment":{"name":"逻辑蕴涵","one":"A 蕴涵（entails）B：A 真时 B 不可能假。","pts":["可传递：A蕴涵B，B蕴涵C → A蕴涵C。","有效 ⇔ 前提合取 P1 \u0026 P2 蕴涵结论。","单向：A \u0026 B 蕴涵 A，反过来不行。"],"ex":"「x是正方形」蕴涵「x是矩形」；矩形不一定是正方形，反向不成立。","trap":"把方向弄反：A 蕴涵 C 不等于 C 蕴涵 A。","ana":"“这是柯基”蕴涵“这是狗”，“这是狗”蕴涵“这是动物”，于是“这是柯基”直接蕴涵“这是动物”——蕴涵可以接力。","words":[{"en":"follow","zh":"推出","m":"由已知必然得到"},{"en":"conjunction","zh":"合取","m":"用 \u0026 连起来的命题"},{"en":"on its own","zh":"单独地","m":"不和别的前提合用"},{"en":"actual world","zh":"现实世界","m":"事实上的情况"}]},"logic-L4-mutual-exclusivity":{"name":"互斥","one":"互斥（mutually exclusive）：不能同真，但可以同假。","pts":["不传递：A、B互斥，B、C互斥，A、C未必互斥。","互斥 ≠ 恰好一个真。","互斥和独立（independent）是两回事。"],"ex":"掷骰子：「偶数」「掷出3」互斥；掷出1时两者都假。","trap":"以为互斥就是一真一假；其实可以两个都假。","ana":"此刻“我在北京”与“我在上海”互斥，“我在上海”与“我在故宫”互斥，但“我在北京”和“我在故宫”可以同真——互斥不传递。","words":[{"en":"Venus / Mars","zh":"金星／火星","m":"行星名"},{"en":"Morning Star","zh":"晨星","m":"早上看到的金星"},{"en":"provided","zh":"只要、前提是","m":"在…条件下"},{"en":"compatible","zh":"相容的","m":"可以同时为真"},{"en":"exactly one","zh":"恰好一个","m":"不多不少一个"},{"en":"equal probability","zh":"概率相等","m":"发生可能性一样大"},{"en":"probabilistically independent","zh":"概率上独立","m":"一个发生不影响另一个的概率"}]},"logic-L6-truth-table":{"name":"真值表（2ⁿ 行）","one":"真值表（truth table）行数＝2ⁿ，n 是不同字母的个数。","pts":["1个字母2行，2个4行，3个8行。","同一字母出现几次只算一个。","联结词、~ 再多也不加行。"],"ex":"(P ⊃ Q) \u0026 (~R ∨ P)：字母P、Q、R共3个 → 8行。","trap":"按符号个数数行数；重复的字母只算一个。","ana":"像点奶茶：冰/不冰、加糖/不加、加珍珠/不加，3 个二选一共 2×2×2 = 8 种组合，所以 3 个原子命题要 8 行。","words":[{"en":"full truth table","zh":"完整真值表","m":"列出全部行的表"},{"en":"contain","zh":"包含","m":"式子里出现"},{"en":"classify","zh":"分类","m":"判断属于哪一类"},{"en":"whole proposition","zh":"整个命题","m":"整条式子，不是其中一块"},{"en":"value of","zh":"…的真值","m":"它是 T 还是 F"},{"en":"enter 1 = true, 0 = false","zh":"真填 1，假填 0","m":"计算题的输入规则"}]},"logic-L6-connectives":{"name":"四个联结词","one":"四个联结词（connective）：~ 非、\u0026 且、∨ 或、⊃ 如果…那么。","pts":["~A：A假才真。A \u0026 B：都真才真。","A ∨ B：都假才假。A ⊃ B：A真B假才假。","没括号时 ~ 只管紧跟的字母。"],"ex":"A=T, B=F：~A ∨ (A ⊃ B) = F ∨ F = F。","trap":"把 ~A ∨ B 读成 ~(A ∨ B)；没括号 ~ 只管 A。","ana":"~ 像翻转键；\u0026 像串联灯泡，两开关都开才亮；∨ 像并联，任一开就亮；⊃ 像“到站就叫我”，只有到站了没叫才算失约。","words":[{"en":"negation","zh":"否定","m":"~，把真假翻过来"},{"en":"conjunction","zh":"合取","m":"\u0026，「且」"},{"en":"disjunction","zh":"析取","m":"∨，「或」"},{"en":"translate","zh":"翻译成符号","m":"把英文句子写成公式"},{"en":"but","zh":"但是","m":"逻辑里等于 \u0026"},{"en":"identical","zh":"完全相同","m":"一模一样"},{"en":"applies to","zh":"作用于","m":"管到哪一部分"}]},"logic-L6-inclusive-or":{"name":"包容性的「或」","one":"∨ 是包容性或（inclusive or）：两边都真也算真。","pts":["只有 F ∨ F = F，其余都是 T。","日常「二选一」的排他或，本课不用。"],"ex":"C＝会弹琴，D＝会唱歌；两样都会时 C ∨ D 为真。","trap":"把「或」当「恰好一个」，于是把 T ∨ T 判成假。","ana":"商店说“满 100 元或是会员可打折”：你既满 100 又是会员，当然也能打折——两边都真，“或”仍然成立。","words":[{"en":"berries","zh":"浆果","m":"草莓、蓝莓一类"},{"en":"intend","zh":"有意要","m":"说话者心里想表达"},{"en":"exactly one","zh":"恰好一个","m":"不多不少一个"},{"en":"neither true nor false","zh":"既不真也不假","m":"没有真值"}]},"logic-L6-main-connective":{"name":"主联结词","one":"主联结词（main connective）：括号外、连起整个式子的那个。","pts":["它决定整个式子的真值，最后算它。","看括号结构，不看最左边的符号。","~ 只有管住整个式子时才是主联结词。"],"ex":"~(A \u0026 B) ⊃ ~C：~ 只管括号，连两大块的是 ⊃，主联结词是 ⊃。","trap":"看到 ~ 在最左边就选 ~；它可能只管一个括号。","ana":"像俄罗斯套娃最外面那一层：先拆开它才看到里面的小块，整句的真假最终由这一层决定。","words":[]},"logic-L6-logical-truth":{"name":"逻辑真理（永真式）","one":"逻辑真理（logical truth）：每一行都是 T，怎么赋值都真。","pts":["例：A ∨ ~A，A ⊃ A，(A ⊃ B) ∨ (B ⊃ A)。","不等于「事实上真」或「很可信」。","句子才叫逻辑真理，论证叫有效。"],"ex":"A ⊃ A：要为假需 A 既真又假，不可能 → 每行都 T。","trap":"「太阳明天升起」很可信，但不是逻辑真理。","ana":"“这道题我要么做对了，要么没做对”——不用看答案也知道它必真，因为在任何情况下都成立。","words":[{"en":"tautology","zh":"永真式","m":"即逻辑真理"},{"en":"terminology","zh":"术语","m":"课程规定的专门用词"},{"en":"sentence","zh":"句子","m":"这里指命题"}]},"logic-L6-logical-falsehood":{"name":"逻辑假（矛盾式）","one":"逻辑假（logical falsehood）：每一行都是 F，怎么赋值都假。","pts":["例：A \u0026 ~A，没有任何一行能成立。","\u0026 连的式子里同时要 C 真和 C 假 → 永假。","主联结词 \u0026 且一边永假 → 整体永假。"],"ex":"(~A \u0026 ~C) \u0026 (B \u0026 C)：左要 C 假，右要 C 真 → 每行都假。","trap":"字母多就以为是偶然命题，没发现 C 和 ~C 冲突。","ana":"“我现在既在睡觉又没在睡觉”——不管现实怎样都不可能成立，就像要求一盏灯同时亮着又灭着。","words":[{"en":"contradiction","zh":"矛盾式","m":"永远为假的命题"}]},"logic-L6-contingent":{"name":"偶然命题","one":"偶然（contingent）：有的行 T、有的行 F。","pts":["找到一行 T、一行 F 就能判定。","选项 Neither＝既非逻辑真理也非逻辑假。","「无法判断」永远不是答案。"],"ex":"A ⊃ (A \u0026 B)：A=F 时 T；A=T、B=F 时 F → 偶然。","trap":"没画完表就选「无法判断」；真值表总有答案。","ana":"“今天会下雨”可能真也可能假，要看实际天气；大多数日常陈述都是这种偶然命题。","words":[{"en":"neither","zh":"两者都不是","m":"这里指偶然命题"},{"en":"cannot be determined","zh":"无法确定","m":"判断不出来"},{"en":"without more information","zh":"缺少更多信息","m":"还需要别的条件"}]},"logic-L6-shortcuts":{"name":"真值表捷径","one":"主联结词一边已定值，另一边可不算：T ∨ X = T，F \u0026 X = F。","pts":["A ∨ ~A 直接当 T，A \u0026 ~A 直接当 F。","F ⊃ X 永远为 T。","T \u0026 X = X，F ∨ X = X，随 X 变，不能跳。"],"ex":"(B \u0026 ~B) \u0026 (…)：左边永假，F \u0026 X = F → 逻辑假，右边不用算。","trap":"(A \u0026 ~A) ∨ B 不是永假：F ∨ X = X，随 B 变 → 偶然。","ana":"“带现金或能扫码”就能付款：已带现金就不必再查扫码（T∨X=T）；“有票且有身份证”才能进场：没票就直接进不了（F\u0026X=F）。","words":[{"en":"shortcut rule","zh":"捷径规则","m":"不用算完就能定值的规则"}]},"logic-L6-equivalence":{"name":"逻辑等价（≡）","one":"逻辑等价（logically equivalent）：每一行真值都相同，记作 ≡。","pts":["比两条目标列，一行不同就不等价。","A ⊃ B ≡ ~A ∨ B ≡ ~(A \u0026 ~B)。","单向蕴涵、现实中碰巧同真都不算等价。"],"ex":"~A ⊃ B ≡ ~~A ∨ B ≡ A ∨ B。","trap":"B ⊃ A、A ∨ ~B 方向反了，与 A ⊃ B 不等价。","ana":"“如果下雨我就带伞”和“要么不下雨，要么我带伞”说法不同，但在每一种情况下真假都一样，所以逻辑等价。","words":[{"en":"differ","zh":"不同","m":"真值不一样"},{"en":"same truth value","zh":"真值相同","m":"同为 T 或同为 F"}]},"logic-L6-de-morgan":{"name":"德摩根律","one":"德摩根律（De Morgan）：~ 进括号，每项加 ~，\u0026 和 ∨ 互换。","pts":["~(A ∨ B) ≡ ~A \u0026 ~B：两个都不。","~(A \u0026 B) ≡ ~A ∨ ~B：至少一个不。","只加 ~ 不换联结词，是最常见的错。"],"ex":"~(~A ∨ B) ≡ ~~A \u0026 ~B ≡ A \u0026 ~B。","trap":"把 ~(A \u0026 B) 写成 ~A \u0026 ~B；后者等于 ~(A ∨ B)。","ana":"“并非（会唱歌或会跳舞）”= 既不会唱也不会跳；“并非（又高又帅）”= 不高或不帅，至少缺一样。","words":[{"en":"rewrite","zh":"改写","m":"换一种等价写法"},{"en":"go wrong","zh":"出错","m":"哪一步错了"},{"en":"drop","zh":"去掉","m":"删掉"},{"en":"¬ / ∧","zh":"~ / \u0026","m":"另一种写法，意思相同"}]},"logic-L6-double-negation":{"name":"双重否定","one":"双重否定（double negation）：~~A ≡ A，两个 ~ 抵消。","pts":["偶数个 ~ 全消，奇数个剩一个。","常与德摩根律连用：~(A ∨ ~B) ≡ ~A \u0026 B。"],"ex":"~~~(A \u0026 B)：三个 ~ 消掉一对，剩 ~(A \u0026 B)。","trap":"三个 ~ 全删掉；奇数个要剩一个 ~。","ana":"像连按两次电灯开关：关了又开，回到原来的状态；“并非他没来”就是“他来了”。","words":[]},"logic-L6-material-conditional":{"name":"实质条件句（⊃）","one":"A ⊃ B 只在 A 真、B 假时为假，其余都为真。","pts":["前件（antecedent）假时，整句为真。","A ⊃ B ≡ ~A ∨ B ≡ ~(A \u0026 ~B)。","⊃ 只有 T/F；Pr(B|A) 是 0 到 1 的数。"],"ex":"「若下雨，比赛就取消」：下雨了比赛没取消，才为假。","trap":"以为前件假时条件句为假或无法判断；其实为真。","ana":"妈妈说“如果你考满分，就给你买手机”：只有考了满分却没买才算食言；没考满分时，买不买都不算违约。","words":[{"en":"literally","zh":"字面意义上","m":"真的、不是比喻"},{"en":"read as","zh":"理解为","m":"按…来解读"},{"en":"submit","zh":"提交","m":"交作业"},{"en":"confirmation email","zh":"确认邮件","m":"告诉你已收到的邮件"},{"en":"conditional probability","zh":"条件概率","m":"已知 A 时 B 的概率"},{"en":"express","zh":"表达","m":"说出某个意思"},{"en":"cause","zh":"导致","m":"因果关系"}]},"logic-L6-validity-logical-truth":{"name":"有效性与逻辑真理","one":"论证有效 ⇔ (P1 \u0026 P2) ⊃ C 是逻辑真理。","pts":["等价写法：~(P1 \u0026 P2) ∨ C，也永真。","(P1 \u0026 P2) \u0026 ~C 描述反例，有效时它永假。","真值表判有效：只看前提全 T 的行，查结论。"],"ex":"A ∨ B, ~A ∴ B：前提全真只有 A=F、B=T 一行，B 真 → 有效。","trap":"看到结论 F 的行就判无效；那行前提必须全 T 才算。","ana":"有效论证像一份永不违约的保证书：“如果前提全都成立，那么结论成立”，在任何情况下都不会被打破，所以永真。","words":[{"en":"test with a truth table","zh":"用真值表检验","m":"列表找反例行"},{"en":"must be","zh":"一定是","m":"不可能不是"}]},"logic-L8-x-or-not-x":{"name":"把复杂子命题看作 X","one":"把整个括号块当 X：X ∨ ~X 永真，X \u0026 ~X 永假。","pts":["先圈出相同的括号块当作 X。","再看主联结词是否连着 X 和 ~X。","X 可以是任何复合命题，不用拆开算。"],"ex":"(A ⊃ ~B) \u0026 ~(A ⊃ ~B)：令 X＝(A ⊃ ~B)，就是 X \u0026 ~X → 逻辑假。","trap":"以为 X 必须是单个字母；X 可以是任意复合命题。","ana":"“这个包裹要么到了，要么没到”必真，包裹里装什么都无所谓；同理，X 再长再复杂，X ∨ ~X 都必真。","words":[]},"logic-L8-neither-notboth":{"name":"都不 vs 并非两者都","one":"Neither＝~(A ∨ B)，两个都不；Not both＝~(A \u0026 B)，不能两个都。","pts":["~(V ∨ D) ≡ ~V \u0026 ~D：做任一样都违规。","~(V \u0026 D) ≡ ~V ∨ ~D：两样都做才违规。","口诀：Neither 全灭，Not both 不能双活。"],"ex":"规则 ~(S \u0026 M)：只穿拖鞋、不戴帽子，不违规。","trap":"把 ~(V \u0026 D) 读成「两样都不许做」，太严了。","ana":"图书馆“既不许吃东西也不许打电话”是 Neither，只吃零食就违规；“不许边吃边打电话”是 Not both，只吃不打不违规。","words":[{"en":"light-rail","zh":"轻轨","m":"城市有轨电车"},{"en":"vape","zh":"吸电子烟","m":"抽电子烟"},{"en":"bring a dog","zh":"带狗","m":"携带宠物狗"},{"en":"break the rule","zh":"违反规则","m":"违规"},{"en":"comply","zh":"遵守","m":"没有违规"},{"en":"stricter","zh":"更严格的","m":"禁止得更多"},{"en":"forbid","zh":"禁止","m":"不许做"},{"en":"symbolise","zh":"用符号表示","m":"写成逻辑公式"}]},"logic-L10-me-truth-table":{"name":"真值表检验互斥","one":"两式互斥 ⇔ 真值表里没有一行两者同为 T。","pts":["并排写两条目标列，逐行找同 T 的行。","同为 F 的行不影响互斥。","一式是另一式的否定 → 必互斥。"],"ex":"A \u0026 B 与 A ∨ ~B：A=T、B=T 时都为 T → 不互斥。","trap":"以为 ~A ∨ ~B 是 A ∨ B 的否定；其否定是 ~A \u0026 ~B。","ana":"像核对两人的排班表：逐天看有没有哪天两人同时上班，一天都没有就是互斥；两人都休息的日子不影响结论。","words":[{"en":"relationship","zh":"关系","m":"两个命题之间是什么关系"},{"en":"pair","zh":"一对","m":"两个一组"},{"en":"the negation of the other","zh":"对方的否定","m":"一个正好是另一个加 ~"},{"en":"whenever","zh":"每当","m":"只要…就…"}]},"logic-L10-equivalence-simplify":{"name":"用逻辑等价化简","one":"逻辑等价的式子概率相同，可用简单式替换再算。","pts":["(A \u0026 B) ∨ (A \u0026 ~B) ≡ A：B 真、B 假各一支。","两支互斥，概率直接相加。","它与 A 等价，但不是逻辑真理。"],"ex":"P(A \u0026 B)＝1/4，P(~A \u0026 B)＝1/3 → P(B)＝1/4＋1/3＝7/12。","trap":"把两支概率相乘；互斥的两支应相加。","ana":"“（下雨且带了伞）或（下雨且没带伞）”其实就等于“下雨了”——带不带伞两种情况合起来，只剩下雨这件事。","words":[{"en":"probability","zh":"概率","m":"可能性大小，0 到 1"},{"en":"simplify","zh":"化简","m":"换成更简单的等价式"}]}}},

{"cards":{"prob-L2-tree":{"ana":"出门前：下雨概率 0.3，下雨时你带伞的概率 0.8，那么“下雨且带伞”这条路就是 0.3×0.8 = 0.24。"},"prob-L4-partition":{"ana":"像天气预报把明天分成“晴/阴/雨”：三种不会同时成立、覆盖所有情况、加起来 100%；漏掉“雪”就不完整。"},"prob-L4-conditioning":{"ana":"钥匙可能在家、公司或车里；你把家里翻遍没找到，就把“在家”这一项划掉，只在剩下的地方里找。"},"prob-L4-normalisation":{"ana":"披萨切 6 块，拿走 2 块后，剩下 4 块就是“新的全部”：每块从占 1/6 变成占剩余的 1/4。"},"prob-L2-condprob":{"ana":"班上 10 人戴眼镜，其中 4 个女生；已知抽到的是戴眼镜的人，她是女生的概率 = 4/10，只在“戴眼镜”这群人里算。"},"prob-L2-montyhall":{"ana":"3 张牌里 1 张 A，你先拿 1 张；看过牌的朋友总会从剩下两张里翻开一张非 A。你手里仍是 1/3，他没翻的那张是 2/3。"},"prob-L2-randomhost":{"ana":"同样 3 张牌，但朋友没看牌，随手翻开剩下两张之一，碰巧不是 A：这时你手里那张和剩下那张各 1/2。"},"prob-L4-forcedchoice":{"ana":"若你拿的牌不是 A，看过牌的朋友只剩一张非 A 可翻，“被迫”的选择就暴露了 A 在哪；随手乱翻的人没有这层信息。"},"prob-L2-selection":{"ana":"“这家店很好吃”：随机路人说的和老板自己说的，话一模一样，但说出这句话的方式不同，可信度就不同。"},"prob-L2-germantank":{"ana":"从抽奖箱摸出 5 张号码都在 1–50：若箱里只有 50 张很正常，若有 10000 张就太巧了，所以更支持“箱子小”。"},"prob-L2-newcomb":{"ana":"极准的店员早已按你的性格装好盲盒：你只拿盲盒说明你是他预测的那类人（证据），但此刻的决定改不了盒里已装的东西（因果）。"},"prob-L4-hdbet":{"ana":"你有一张 10% 中奖的票：拿它“换”一张约 8% 的票是亏；“额外送”一张、第一张没中时还能再抽，总机会就变大。"},"prob-L4-frequency":{"ana":"“这座城市 30% 的人戴眼镜”描述的是整体比例，不是说某个具体的人“有 30% 戴着眼镜”。"},"prob-L4-epistemic":{"ana":"朋友抛完硬币用手盖住：结果已经定了，但你对“正面”仍只有 1/2 的信心；他偷看后，对他来说就是 0 或 1。"},"prob-L8-gambler":{"ana":"轮盘连开 8 次红，有人押黑说“该轮到黑了”；若轮盘公平且各次独立，下一次出黑的概率和平时完全一样。"},"prob-L8-fairness":{"ana":"一枚灌铅硬币每次都有 70% 出正面：不公平；但它不“记得”上一次的结果，所以各次投掷仍然独立。"},"prob-L8-independence":{"ana":"同时掷骰子和抛硬币：知道硬币是正面，骰子出 6 仍是 1/6；反过来知道骰子是 6，硬币正面也仍是 1/2。"},"prob-L8-notcausal":{"ana":"早上看到地面湿了，你更相信夜里下过雨；但地湿并没有“造成”下雨，改变的只是你的判断。"},"prob-L8-longrun":{"ana":"前 10 次抛出 8 个正面，之后 990 次大约一半正面：共约 503/1000 ≈ 50.3%。比例接近 1/2 靠稀释，多出的 3 个正面并没被抵消。"},"prob-L8-randomness":{"ana":"魔术师洗牌：练过的他能控制顺序（确定的），但你看不出规律；按你掌握的信息，把牌序当作随机是合理的。"},"prob-L10-mutex":{"ana":"此刻你“在北京”和“在上海”不可能同时为真，但两者可以同时为假——比如你在广州。"},"prob-L10-mutexvsindep":{"ana":"一门课“得 A”和“得 B”互斥：一旦知道你得了 A，得 B 的概率立刻变成 0——知道一个大大改变另一个，所以不独立。"},"prob-L10-orrule":{"ana":"随机抽一个学生：“大一或大二” = 30% + 25%（一人只有一个年级）；但“大一或女生”不能直接加，大一女生会被算两次。"},"prob-L10-andrule":{"ana":"明天下雨 0.3、你抛硬币得正面 0.5，两者无关，可乘得 0.15；但“下雨”和“地面湿”相互关联，不能直接相乘。"},"prob-L10-complement":{"ana":"预报下雨 30%，不下雨就是 70%；抛两次硬币“至少一次正面” = 1 − 两次都反面(1/4) = 3/4。"},"prob-L10-equivalence":{"ana":"“不是没带伞”和“带了伞”逻辑等价，概率必然相同；但硬币“正面”“反面”概率都是 1/2，却显然不等价。"},"prob-L10-ordered":{"ana":"两个孩子（男女各 1/2）：“老大男、老二女”只有 1 种，概率 1/4；“一男一女”包括男女和女男，概率 1/2。"},"prob-L10-replacement":{"ana":"10 张签里 1 张中奖：第一人抽走一张没中、不放回，第二人中奖概率变成 1/9；放回重洗则仍是 1/10。"},"prob-L10-unequal":{"ana":"转盘只分“中奖/不中”两格，但中奖格只占 1/10 面积：只有两种结果，不代表各 1/2。"},"prob-L10-dependence":{"ana":"冰淇淋销量高时溺水人数也多：知道一个能帮你预测另一个（依赖），但原因是共同的“天热”，不是冰淇淋导致溺水。"}}},
{"cards":{"prob-L2-tree":{"kind":"两条路径合并求概率","tip":"看到两条路→先相乘再相加：两条 1/6 路得 1/3，不是 1/36。"},"prob-L4-partition":{"kind":"末端分支哪项非要求","tip":"看到「哪项不是要求」→选「等概率」；穷尽、互斥、和为 1 才是。"},"prob-L4-conditioning":{"kind":"见证据后如何更新树","tip":"看到「观察到…」→先删矛盾分支再归一化；「保留原值」错。"},"prob-L4-normalisation":{"kind":"删枝后算剩余概率","tip":"看到「删枝后概率」→目标分支 ÷ 剩余总和：0.1÷0.5=0.2。"},"prob-L2-condprob":{"kind":"代入 P(H|E) 公式","tip":"看到 P(H|E)→交集在上、证据在下；算出大于 1 就是颠倒了。"},"prob-L2-montyhall":{"kind":"知情主持人换不换门","tip":"知情主持人→换门赢 (n−1)/n÷可换门数，四门 3/8。"},"prob-L2-randomhost":{"kind":"随机主持人换门概率","tip":"看到「不知情/随机开门」且碰巧见羊→1/2；事前开出车是 1/3。"},"prob-L4-forcedchoice":{"kind":"解释 2/3 优势来源","tip":"问「为何 2/3」→选「主持人受约束：不开你的门、不开车门」。"},"prob-L2-selection":{"kind":"同一观察证据为何不同","tip":"看到「同样观察、不同机制」→先问观察怎么产生，证据就不同。"},"prob-L2-germantank":{"kind":"坦克编号支持哪个假设","tip":"看到「编号全低」→支持小产量；「逻辑排除」「无证据」都错。"},"prob-L2-newcomb":{"kind":"一盒/两盒对应哪种推理","tip":"只拿 B→证据推理；拿两盒→因果/占优推理（钱已放好）。"},"prob-L4-hdbet":{"kind":"HD 赌局接受与总概率","tip":"看到「额外机会」→原概率 + (1−原概率)×赌局概率；替换则比大小。"},"prob-L4-frequency":{"kind":"识别频率陈述及误用","tip":"看到「班里/群体占多少比例」→频率；个人证据能改变个人概率。"},"prob-L4-epistemic":{"kind":"识别认识论概率","tip":"看到「鉴于我的信息，我有多少信心」→认识论概率。"},"prob-L8-gambler":{"kind":"判断是否赌徒谬误","tip":"先查独立：承认独立仍说「该轮到了」→谬误；真相关或前提假→不是。"},"prob-L8-fairness":{"kind":"区分公平与独立","tip":"看到「每次 P(6)=0.3」→不公平但独立：公平看单次，独立看次与次。"},"prob-L8-independence":{"kind":"判断两事件是否独立","tip":"比 P(A|B) 与 P(A)：A 与黑桃都 1/13→独立；红桃蕴含红色→不独立。"},"prob-L8-notcausal":{"kind":"条件概率不等于因果","tip":"看到 P(点燃|爆炸)=1 →选「更新对过去的信念」，不是逆向因果。"},"prob-L8-longrun":{"kind":"长期频率是否靠补偿","tip":"看到「长期趋近 1/2」→靠大量后续试验稀释偏差；「下次更可能反面」错。"},"prob-L8-randomness":{"kind":"区分客观/认识论随机","tip":"看到「我预测不了」→认识论随机；硬币、轮盘是确定但不可预测。"},"prob-L10-mutex":{"kind":"互斥能否同真同假","tip":"互斥只排除同真，可以同假；A、C 互斥则 A∧B 与 C 也互斥。"},"prob-L10-mutexvsindep":{"kind":"判断互斥还是独立","tip":"看到「梅花与黑桃」这类互斥→不独立：知一发生另一变 0。"},"prob-L10-orrule":{"kind":"算 P(A 或 B)","tip":"看到「或」→先查互斥：互斥直接加；有重叠（K 与红桃）减去 P(A∧B)。"},"prob-L10-andrule":{"kind":"算 P(A 且 B)","tip":"看到「且」→先查独立才相乘；单骰「2 且 3」互斥得 0，别选 1/36。"},"prob-L10-complement":{"kind":"用补集算“至少一个”","tip":"看到「至少一个」→先算「一个都没有」再用 1 减：1−0.7⁴；超过 1 必错。"},"prob-L10-equivalence":{"kind":"等价式求概率","tip":"看到 (A∧B)∨(A∧¬B)→就是 A，两项互斥直接加；同概率≠等价。"},"prob-L10-ordered":{"kind":"两骰一 3 一 4 的概率","tip":"没指定哪颗出几→算两种顺序：(3,4)+(4,3)=2/36=1/18，别选 1/36。"},"prob-L10-replacement":{"kind":"无放回连抽概率","tip":"看到「不放回」→第二次用剩余数：3/5×2/4=3/10；(3/5)² 只限有放回。"},"prob-L10-unequal":{"kind":"偏骰求 P(偶数)","tip":"看到「偏骰/不等可能」→别数个数，把每个有利结果的概率相加。"},"prob-L10-dependence":{"kind":"判断依赖与因果","tip":"看到 P(A|B)≠P(A)→依赖；问是否因果→选「可能另有原因」。"}}},
{"cards":{"prob-L2-tree":{"one":"把所有情形画成分支：同一路径概率相乘，事件跨多条路径则相加。","en":"A tree listing all scenarios: multiply along a path; add the paths on which an event occurs.","qs":["prob-L2-q08"]},"prob-L4-partition":{"one":"完整概率树的末端分支须穷尽、互斥、概率和为 1（不要求等概率）。","en":"Terminal branches of a complete tree must be exhaustive, mutually exclusive, and sum to 1.","qs":["prob-L4-q10"]},"prob-L4-conditioning":{"one":"得到新证据后，删去所有与观察不相容的分支，只保留仍可能的分支。","en":"Updating on evidence by eliminating every tree branch incompatible with the observation.","qs":["prob-L2-q07","prob-L4-c04"]},"prob-L4-normalisation":{"one":"删枝后，每条保留分支概率 ÷ 保留分支总概率，使其重新和为 1。","en":"Rescaling remaining branches after conditioning: new P = old P / total remaining P, so they sum to 1.","qs":["prob-L4-q01","prob-L4-c03","prob-L2-q07"]},"prob-L2-condprob":{"one":"已知证据 E 时 H 的概率：P(H|E) = P(H∧E)/P(E)。","en":"The probability of H given evidence E: P(H|E) = P(H ∧ E) / P(E).","qs":["prob-L2-q10","prob-L2-c02"]},"prob-L2-montyhall":{"one":"知情主持人必开未选的山羊门并让你换：留门赢 1/3，换门赢 2/3。","en":"Informed host always opens an unchosen goat door and offers a switch: stay wins 1/3, switch 2/3.","qs":["prob-L2-q01","prob-L2-q05","prob-L2-c01","prob-L2-c07"]},"prob-L2-randomhost":{"one":"主持人不知情、随机开门（可能开出车）；碰巧开出山羊时留/换各 1/2。","en":"Ignorant host opens a door at random, may reveal the car; given a goat appears, stay and switch each win 1/2.","qs":["prob-L2-q02","prob-L2-q03","prob-L4-q02","prob-L2-c02","prob-L4-c04","prob-L2-q04","prob-L4-c03"]},"prob-L4-forcedchoice":{"one":"标准主持人受双重约束（不开你的门、不开车门），其选择因此携带车位信息。","en":"The standard host cannot open your door or the car door, so his forced choice carries information about the car.","qs":["prob-L4-q03","prob-L2-q01"]},"prob-L2-selection":{"one":"证据 = 观察结果 + 产生机制；同一观察在不同过程下概率不同，支持的更新也不同。","en":"Evidence depends on how an observation was generated, not just on what was observed.","qs":["prob-L2-q06","prob-L2-q13","prob-L2-q04"]},"prob-L2-germantank":{"one":"编号全低不能逻辑上排除大产量，但在小产量下更可能出现，故支持低估计。","en":"All-low serial numbers don\u0027t rule out huge production but are far likelier if production is small, supporting the lower estimate.","qs":["prob-L2-q09"]},"prob-L2-newcomb":{"one":"Evidential reasoning 支持只拿 B（选择是证据），causal reasoning 支持拿两盒（选择不能改变已放的钱）。","en":"Evidential reasoning favours one-boxing; causal reasoning favours two-boxing, since the choice cannot change the boxes.","qs":["prob-L2-q11","prob-L2-q12","prob-L2-q13","soc-L2-q01","soc-L2-q02"]},"prob-L4-hdbet":{"one":"赌局 1/12：作替换 \u003c 1/10 应拒绝；作额外机会 = 1/10 + 9/10×1/12 = 17.5%。","en":"Bet wins with 1/12: worse than 1/10 as a replacement; as an extra chance total = 1/10 + (9/10)(1/12) = 17.5%.","qs":["prob-L4-q04","prob-L4-q05","prob-L4-c05","prob-L4-c06","prob-L4-q11","prob-L4-q06"]},"prob-L4-frequency":{"one":"频率理解：概率描述一个群体中具有某属性的比例。","en":"Probability as the proportion of a population or class of cases having some feature.","qs":["prob-L4-q07","prob-L4-q09"]},"prob-L4-epistemic":{"one":"认识论概率：现有证据支持对某命题多大信心，随信息而变。","en":"The degree of confidence the available evidence supports in a proposition; it changes with information.","qs":["prob-L4-q08"]},"prob-L8-gambler":{"one":"把试验当独立，却因前面一串结果认为下一次某结果更（或更不）可能。","en":"Treating an independent outcome as more or less likely because of a preceding run of results.","qs":["prob-L8-q01","prob-L8-q02","prob-L8-q05","prob-L8-q06","prob-L8-q07","prob-L8-q08","prob-L8-c08","prob-L8-q04"]},"prob-L8-fairness":{"one":"Fairness 看单次试验内是否等概率，independence 看试验之间；独立不必公平。","en":"Fairness concerns the distribution within a trial; independence concerns relations between trials; independent need not be fair.","qs":["prob-L8-q03","prob-L8-q04","prob-L8-c09"]},"prob-L8-independence":{"one":"得知 B 不改变 A 的概率：P(A|B) = P(A)；独立具有对称性。","en":"A and B are independent iff learning one doesn\u0027t change the other\u0027s probability: P(A|B) = P(A); symmetric.","qs":["prob-L8-q10","prob-L8-q11","prob-L8-q13","prob-L8-c10","prob-L8-q14","prob-L2-q14"]},"prob-L8-notcausal":{"one":"条件概率表达信息关系：更新的是观察者的置信度，不一定是因果作用。","en":"Conditional probability tracks evidential bearing; updating changes rational credence, not necessarily the world causally.","qs":["prob-L8-q12","prob-L10-q17"]},"prob-L8-longrun":{"one":"长期比例趋近 1/2 靠稀释早期偏差，而非下一次补偿。","en":"Long-run frequencies converge by diluting early imbalance, not by the next trial compensating for it.","qs":["prob-L8-q09"]},"prob-L8-randomness":{"one":"区分客观随机（如量子候选）、确定但不可预测（硬币/轮盘）、以及据现有信息当作随机。","en":"Outcomes may be genuinely random, or deterministic but unpredictable and reasonably treated as random given available information.","qs":["prob-L18-q58"]},"prob-L10-mutex":{"one":"互斥：不可能同时为真，但可以同时为假；是逻辑关系。","en":"Mutually exclusive: no possible situation makes both true (both may be false); a logical relation.","qs":["prob-L10-q01","prob-L10-q20"]},"prob-L10-mutexvsindep":{"one":"互斥是逻辑概念，独立是概率概念；正概率的互斥事件一定不独立。","en":"Exclusivity is logical, independence probabilistic; mutually exclusive events with positive probability are never independent.","qs":["prob-L10-q10","prob-L10-q09","prob-L8-q15"]},"prob-L10-orrule":{"one":"仅当 A、B 互斥时，P(A∨B) = P(A) + P(B)。","en":"If A and B are mutually exclusive, P(A ∨ B) = P(A) + P(B).","qs":["prob-L10-q02","prob-L10-q05","prob-L10-q08","prob-L10-c12","prob-L10-q06","prob-L10-c17"]},"prob-L10-andrule":{"one":"仅当 A、B 独立时，P(A∧B) = P(A) × P(B)。","en":"If A and B are independent, P(A ∧ B) = P(A) × P(B).","qs":["prob-L10-q03","prob-L10-q04","prob-L4-q06","prob-L10-q08","prob-L10-c12","prob-L2-q14","prob-L8-c08"]},"prob-L10-complement":{"one":"因 A 与 ¬A 互斥且穷尽，P(¬A) = 1 − P(A)。","en":"P(¬A) = 1 − P(A), because A and ¬A are mutually exclusive and jointly exhaustive.","qs":["prob-L10-q18","prob-L10-q11","prob-L10-c17","prob-L8-c09","prob-L10-c11","prob-L10-c13"]},"prob-L10-equivalence":{"one":"逻辑等价 → 概率相同；概率相同 ↛ 逻辑等价。","en":"Logically equivalent propositions have equal probability, but equal probability doesn\u0027t imply equivalence.","qs":["prob-L10-q07","prob-L10-q19","prob-L10-q06","prob-L10-c11"]},"prob-L10-ordered":{"one":"是否指定哪个对象得哪个结果会改变结果数：未指定时 (3,4) 与 (4,3) 都算。","en":"Specifying which object gets which result changes the sample space: \u0027one 3, other 4\u0027 includes (3,4) and (4,3).","qs":["prob-L10-q12","prob-L10-c13","prob-L10-c15"]},"prob-L10-replacement":{"one":"有放回恢复原组成（充分混合时）各次独立；无放回改变组成，各次不独立。","en":"With replacement (well mixed) draws are independent; without replacement the first draw changes the second\u0027s probabilities.","qs":["prob-L10-q13","prob-L10-c14","prob-L10-c15"]},"prob-L10-unequal":{"one":"有利数/总数仅在基本结果等可能时成立；否则把互斥有利结果的实际概率相加。","en":"Favourable/total counting works only for equally likely outcomes; otherwise sum the actual probabilities of exclusive favourable outcomes.","qs":["prob-L10-q15","prob-L10-q14","prob-L10-c16"]},"prob-L10-dependence":{"one":"得知一个改变另一个的概率即依赖；依赖可来自关联或因果，本身不证明直接因果。","en":"Events are dependent if learning one changes the other\u0027s probability; dependence alone doesn\u0027t establish direct causation.","qs":["prob-L10-q16","prob-L10-q17","prob-L8-q14"]}}},
{"cards":{"prob-L2-tree":{"q":"概率树：P(下雨) = 0.4，下雨时堵车的概率 0.5，不下雨时堵车的概率 0.2。P(堵车) = ？","a":"0.32","why":"两条路径各自相乘再相加：0.4×0.5 + 0.6×0.2 = 0.32。"},"prob-L4-partition":{"q":"某树的末端分支为“晴”0.5、“雨”0.3、“雨或阴”0.4。它为什么不是完备划分（partition）？A. 各分支不等概率 B. 分支不互斥且总和≠1 C. 分支太少","a":"B","why":"“雨”与“雨或阴”可同时成立，且总和 1.2 ≠ 1。"},"prob-L4-conditioning":{"q":"随机主持人版：你选门1，他随机开门2，见山羊。条件化（conditioning）要删掉哪条路径？A. 车在1且开2 B. 车在2且开2 C. 车在3且开2","a":"B. 车在2且开2","why":"车在门2时开门2会露出汽车，与“见山羊”不相容。"},"prob-L4-normalisation":{"q":"删枝后剩 3 条分支，原概率为 0.1、0.2、0.2。归一化（normalisation）后第一条分支的概率是？","a":"0.2","why":"除以保留分支总和：0.1 ÷ (0.1 + 0.2 + 0.2) = 0.2。"},"prob-L2-condprob":{"q":"已知 P(H∧E) = 0.12，P(E) = 0.3，求条件概率 P(H|E)。A. 0.036 B. 0.4 C. 2.5","a":"B. 0.4","why":"P(H|E) = P(H∧E)/P(E) = 0.12/0.3 = 0.4。"},"prob-L2-montyhall":{"q":"5 扇门、1 辆车。你选门1，知情主持人打开另外 3 扇山羊门，只剩一扇未开。换门赢的概率是？","a":"4/5","why":"只有初选蒙对（1/5）时换门才输：1 − 1/5 = 4/5。"},"prob-L2-randomhost":{"q":"主持人不知道车在哪，在你没选的两扇门里随机开一扇，碰巧是山羊。此时留在原门赢的概率是？A. 1/3 B. 1/2 C. 2/3","a":"B. 1/2","why":"两条相容路径各 1/6，归一化后各 (1/6)/(1/3) = 1/2。"},"prob-L4-forcedchoice":{"q":"标准蒙提霍尔：你选门1，车其实在门3。主持人会开哪扇门？A. 门1 B. 门2 C. 门2 或门3 随机","a":"B. 门2","why":"不能开你的门、不能开车门，只剩门2：受约束的选择带有信息。"},"prob-L2-selection":{"q":"同样看到山羊，为什么标准版换门赢 2/3，随机主持人版只有 1/2？A. 门的数量不同 B. 产生证据的机制不同 C. 初选概率变了","a":"B","why":"见山羊的概率：标准版是 1，随机版是 2/3，证据意义不同。"},"prob-L2-germantank":{"q":"缴获的坦克编号全都低于 500。正确的判断是？A. 逻辑上排除了大产量 B. 两种假设都相容，所以证据中立 C. 证据更支持小产量","a":"C","why":"小产量下全是低编号更容易出现，所以更支持小产量。"},"prob-L2-newcomb":{"q":"纽康姆悖论：“无论 B 里有没有钱，多拿 A 都多 $1000”是哪种论证？A. 证据推理，支持只拿 B B. 优势论证（dominance），支持拿两盒 C. 随机推理","a":"B","why":"钱已放好、选择改变不了它，这是因果推理一方的优势论证。"},"prob-L4-hdbet":{"q":"班上 1/4 的人拿 HD。赌局：抛公平硬币，正面再掷公平骰子，掷出 1 或 2 就拿 HD。作为额外机会时，总概率是？","a":"3/8","why":"赌局 1/2×1/3 = 1/6；总概率 1/4 + 3/4×1/6 = 3/8。"},"prob-L4-frequency":{"q":"“这家医院约 5% 的新生儿是双胞胎”最自然地表达哪种概率？A. 频率理解 B. 认识论概率 C. 逻辑必然","a":"A. 频率理解","why":"它描述一个群体中具有某属性的比例。"},"prob-L4-epistemic":{"q":"侦探说：“根据现有线索，我有 70% 把握管家是凶手。”这表达哪种概率？A. 频率理解 B. 认识论概率（epistemic probability） C. 客观机会","a":"B","why":"它表达现有证据支持多大信心，新线索会改变它。"},"prob-L8-gambler":{"q":"公平骰子各次独立，已连续 10 次没出 6。有人说“下次该出 6 了”。下一次出 6 的概率？A. 大于 1/6 B. 1/6 C. 小于 1/6","a":"B. 1/6","why":"独立试验中过去的序列不改变下一次概率，这是赌徒谬误。"},"prob-L8-fairness":{"q":"一枚硬币每次出正面的概率都是 0.6，各次独立。它：A. 公平且独立 B. 不公平但独立 C. 不公平，所以不独立","a":"B","why":"公平看单次是否等概率，独立看次与次之间，二者互不决定。"},"prob-L8-independence":{"q":"从 52 张牌中抽一张。P(King) = 1/13，求 P(King|Red)，并判断两者是否独立（independent）。","a":"1/13，独立","why":"红牌 26 张中有 2 张 K：2/26 = 1/13 = P(King)。"},"prob-L8-notcausal":{"q":"某病只由病毒 X 引起，感染者中 1/4 会发病。已知某人发病，P(感染X|发病) = ？","a":"1","why":"P(发病|¬X) = 0，故 P(X|发病) = 1：更新的是信念，不是因果。"},"prob-L8-longrun":{"q":"公平硬币前 20 次有 16 次正面，之后 980 次恰好一半正面。1000 次中正面所占比例是？","a":"50.6%","why":"(16 + 490)/1000 = 50.6%：早期偏差被稀释，不是被补偿。"},"prob-L8-randomness":{"q":"轮盘落点由初始条件决定，但普通玩家无法预测。这最适合归为？A. 客观随机 B. 确定但不可预测 C. 逻辑必然","a":"B","why":"掌握全部初始条件的人原则上可预测，只是我们做不到。"},"prob-L10-mutex":{"q":"掷一次骰子：A = “掷出偶数”，B = “掷出 1”。哪项正确？A. 互斥，且可同时为假 B. 互斥，所以必有一个为真 C. 不互斥","a":"A","why":"两者不能同时为真；掷出 3 时两者都为假。"},"prob-L10-mutexvsindep":{"q":"P(A) = 0.3，P(B) = 0.4，且 A 与 B 互斥（mutually exclusive）。A 与 B 独立吗？A. 独立 B. 不独立 C. 无法判断","a":"B. 不独立","why":"互斥则 P(A∧B) = 0，不等于 0.3 × 0.4 = 0.12。"},"prob-L10-orrule":{"q":"转盘每次只停在一种颜色：红 0.25、蓝 0.35、绿 0.4。P(红∨蓝) = ？","a":"0.6","why":"红、蓝不能同时出现（互斥），可直接相加：0.25 + 0.35 = 0.6。"},"prob-L10-andrule":{"q":"抛一枚公平硬币，并独立掷一颗公平骰子。P(反面∧点数大于 4) = ？","a":"1/6","why":"两者独立才能相乘：1/2 × 2/6 = 1/6。"},"prob-L10-complement":{"q":"公平硬币独立抛 3 次，至少出现一次正面的概率是？","a":"7/8","why":"补集是“全是反面”：1 − (1/2)³ = 1 − 1/8 = 7/8。"},"prob-L10-equivalence":{"q":"已知 P(A∧B) = 1/4，P(A∧¬B) = 1/3，求 P(¬A)。","a":"5/12","why":"两支互斥且合起来等价于 A：P(A) = 7/12，P(¬A) = 5/12。"},"prob-L10-ordered":{"q":"从两副标准扑克牌中各抽一张。“一张是红桃、另一张是黑桃”的概率？A. 1/16 B. 1/8 C. 1/4","a":"B. 1/8","why":"（红桃, 黑桃）与（黑桃, 红桃）各 1/16，相加得 1/8。"},"prob-L10-replacement":{"q":"袋中 2 红 3 白，无放回（without replacement）抽两次。两次都是红球的概率是？","a":"1/10","why":"第一次后剩 1 红 4 白：2/5 × 1/4 = 1/10。"},"prob-L10-unequal":{"q":"偏骰：P(6) = 1/3，1–5 每面各 2/15。P(偶数) = ？A. 1/2 B. 3/5 C. 2/5","a":"B. 3/5","why":"按实际概率相加：2/15 + 2/15 + 5/15 = 9/15 = 3/5。"},"prob-L10-dependence":{"q":"简化模型：一半人既住海边又会游泳，另一半两者都不是。两者：A. 独立，因概率都是 1/2 B. 不独立 C. 证明住海边导致会游泳","a":"B. 不独立","why":"P(两者都) = 1/2 ≠ 1/2 × 1/2；依赖本身不证明因果。"}}},
{"cards":{"prob-L2-tree":{"name":"概率树（probability tree）","one":"概率树（probability tree）：同一条路相乘，不同的路相加。","pts":["一条完整路径 = 路上各分支概率相乘","一个事件有几条路，就把这几条路相加","末端分支加起来必须等于 1"],"ex":"设玩 600 次：车在1 的 200 次里，开门3 的 100 次 → 1/3×1/2=1/6。","trap":"把不同路径也相乘得 1/36；两条路应相加得 1/3。","ana":"出门前：下雨概率 0.3，下雨时你带伞的概率 0.8，那么“下雨且带伞”这条路就是 0.3×0.8 = 0.24。","words":[{"en":"path","zh":"路径","m":"从树根到末端的一整条分支"},{"en":"terminal branch","zh":"末端分支","m":"树最末端的一个完整结果"},{"en":"host","zh":"主持人","m":"Monty Hall 里开门的人"},{"en":"goat","zh":"山羊","m":"门后的“空奖”"},{"en":"reveal","zh":"揭开、露出","m":"打开门让人看到门后"},{"en":"unchosen / unopened","zh":"未选的 / 未打开的","m":"你没选的门 / 还关着的门"},{"en":"incompatible","zh":"不相容的","m":"与观察到的结果矛盾"},{"en":"renormalise","zh":"重新归一化","m":"重新调整使概率和为 1"}]},"prob-L4-partition":{"name":"完备划分","one":"末端分支要穷尽、互斥、加起来等于 1；不必等概率。","pts":["穷尽（exhaustive）：每种情况都在某条分支里","互斥：两条分支不能同时发生","各分支概率可以不同"],"ex":"HD 赌局树：反面 1/2、正面且 6 为 1/12、正面非 6 为 5/12，和为 1。","trap":"以为末端分支必须等概率；其实只要穷尽、互斥。","ana":"像天气预报把明天分成“晴/阴/雨”：三种不会同时成立、覆盖所有情况、加起来 100%；漏掉“雪”就不完整。","words":[{"en":"requirement","zh":"要求","m":"必须满足的条件"},{"en":"cover every possible case","zh":"覆盖所有情况","m":"即穷尽"},{"en":"occur together","zh":"同时发生","m":"两件事一起成立"},{"en":"complete path","zh":"完整路径","m":"从头走到末端的一条路"},{"en":"normalised","zh":"归一化后的","m":"调整后概率和为 1"},{"en":"remaining branch","zh":"保留的分支","m":"删枝后剩下的分支"}]},"prob-L4-conditioning":{"name":"条件化（conditioning）","one":"条件化（conditioning）：看到证据后，删掉与证据矛盾的分支。","pts":["矛盾 = 这条路发生时不可能看到这证据","删完剩下的不到 1，接着要归一化","证据要写全：开了哪扇门、看到什么"],"ex":"设玩 600 次，随机主持人开门3见羊：删掉开门2的 300 次和车在3的 100 次，剩 200。","trap":"删完直接拿原来的 1/6 当答案，忘了归一化。","ana":"钥匙可能在家、公司或车里；你把家里翻遍没找到，就把“在家”这一项划掉，只在剩下的地方里找。","words":[{"en":"evidence","zh":"证据","m":"新得到的观察信息"},{"en":"observation","zh":"观察结果","m":"你实际看到的东西"},{"en":"cross out / eliminate","zh":"划掉 / 删除","m":"把分支从树上去掉"},{"en":"given","zh":"已知","m":"在……成立的条件下"},{"en":"at random","zh":"随机地","m":"每种选择机会相等"},{"en":"happens to","zh":"碰巧","m":"不是有意，刚好如此"},{"en":"quiz variant","zh":"小测变体","m":"课堂小测里改编的版本"}]},"prob-L4-normalisation":{"name":"归一化（normalisation）","one":"归一化（normalisation）：每条剩余分支 ÷ 剩余总和，和回到 1。","pts":["新概率 = 原概率 ÷ 剩余分支总和","人数表：目标次数 ÷ 看到证据的总次数","剩余分支总和就是证据概率 P(E)"],"ex":"设玩 600 次，见羊剩 400 次，4 条各 100；换门赢 200 → 200÷400=1/2。","trap":"忘了归一化，把 1/6+1/6=1/3 当答案。","ana":"披萨切 6 块，拿走 2 块后，剩下 4 块就是“新的全部”：每块从占 1/6 变成占剩余的 1/4。","words":[{"en":"renormalise","zh":"重新归一化","m":"重新调整使概率和为 1"},{"en":"remaining","zh":"剩下的","m":"删枝后还保留的"},{"en":"originally","zh":"原本","m":"更新之前"},{"en":"sum to 1","zh":"加起来等于 1","m":"概率总和为 1"},{"en":"switch wins","zh":"换门赢","m":"换到另一扇门能拿到车"},{"en":"indistinguishable","zh":"无法区分的","m":"看不出彼此有何不同"}]},"prob-L2-condprob":{"name":"条件概率（conditional probability）","one":"条件概率（conditional probability）：E 发生的人里，H 占多少。","pts":["P(H|E) = P(H∧E) ÷ P(E)","人数表：H 且 E 的人数 ÷ E 的总人数","已用新信息更新，不再是原来的 P(H)"],"ex":"设玩 600 次：开3见羊 200 次，其中车在1 的 100 次 → 100÷200=1/2。","trap":"分子分母倒过来（算出大于 1），或忘了除以 P(E)。","ana":"班上 10 人戴眼镜，其中 4 个女生：已知抽到的人戴眼镜，此人是女生的概率 = 4/10，只在戴眼镜的人里算。","words":[{"en":"hypothesis","zh":"假设","m":"待判断真假的说法 H"},{"en":"formula","zh":"公式","m":"计算用的式子"},{"en":"toss","zh":"抛（硬币）","m":"抛一次硬币"},{"en":"both heads","zh":"两次都正面","m":"两次结果都是正面"},{"en":"in a row","zh":"连续","m":"一次接一次不中断"},{"en":"with / without replacement","zh":"有放回 / 无放回","m":"抽出后放回 / 不放回"}]},"prob-L2-montyhall":{"name":"标准蒙提霍尔问题","one":"知情主持人必开未选的羊门再让换：留门赢 1/3，换门赢 2/3。","pts":["你初选的 1/3 不因开门改变","另两扇的 2/3 全落到没开的那扇","开到只剩一扇：换门赢 (n−1)/n，五门 4/5"],"ex":"设玩 300 次：车在1 的 100 次换门输；车在2或3 的 200 次换门必赢 → 2/3。","trap":"「只剩两扇门所以各 1/2」：主持人开门不是随机的。","ana":"3 张牌里 1 张 A，你先拿 1 张；看过牌的朋友总会从剩下两张里翻开一张非 A。你手里仍是 1/3，他没翻的那张是 2/3。","words":[{"en":"contestant","zh":"参赛者","m":"选门的人，也就是你"},{"en":"constrained","zh":"受约束的","m":"被规则限制只能这样做"},{"en":"concentrate","zh":"集中","m":"概率全部汇到一处"},{"en":"causally","zh":"因果地","m":"真的造成了改变"},{"en":"switch / stay","zh":"换门 / 不换","m":"改选另一扇 / 坚持原门"},{"en":"setup","zh":"题目设定","m":"游戏的规则安排"},{"en":"no better than","zh":"不比……好","m":"至多一样好"},{"en":"prize","zh":"奖品","m":"门后的奖励"}]},"prob-L2-randomhost":{"name":"随机主持人版本","one":"主持人不知情随机开门，碰巧见羊时：留、换各 1/2。","pts":["开门前，他开出车的概率是 1/3","见羊后：删掉露车的情形再归一化，得 1/2","三门全随机的版本，条件化后也是 1/2"],"ex":"设玩 600 次：开门3 共 300 次，露车 100 次删掉；剩 200 次车1、车2 各 100 → 1/2。","trap":"把标准版的 2/3 照搬到随机主持人上。","ana":"同样 3 张牌，但朋友没看牌，随手翻开剩下两张之一，碰巧不是 A：这时你手里那张和剩下那张各 1/2。","words":[{"en":"does not know","zh":"不知道","m":"主持人不知道车在哪"},{"en":"at random","zh":"随机地","m":"每扇门机会相等"},{"en":"happens to","zh":"碰巧","m":"刚好如此，不是有意"},{"en":"reveal the car","zh":"露出汽车","m":"打开的门后正好是车"},{"en":"before any door is opened","zh":"开门之前","m":"还没有任何新信息时"},{"en":"completely at random","zh":"完全随机","m":"三扇门都可能被开"},{"en":"no better than","zh":"不比……好","m":"至多一样好"}]},"prob-L4-forcedchoice":{"name":"受约束的选择","one":"标准主持人不能开你的门、不能开车门，开哪扇就透露车在哪。","pts":["车在门2 时他只能开门3：开门由车位决定","随机主持人不受约束，开门与车位无关","要问「他为什么开这扇」，不是「剩几扇」"],"ex":"设玩 300 次，你选门1：车在2 的 100 次必开3，车在3 的 100 次必开2。","trap":"以为 2/3 优势来自门的数量，其实来自主持人的约束。","ana":"若你拿的牌不是 A，看过牌的朋友只剩一张非 A 可翻，“被迫”的选择就暴露了 A 在哪；随手乱翻的人没有这层信息。","words":[{"en":"forced choice","zh":"受约束的选择","m":"规则逼着只能这样选"},{"en":"constraint","zh":"约束","m":"限制行为的规则"},{"en":"carries information","zh":"带有信息","m":"能告诉你一些事"},{"en":"unbiased","zh":"无偏的","m":"不偏向任何一方"},{"en":"lie","zh":"说谎","m":"故意说假话"},{"en":"effectively","zh":"实际上","m":"效果上等于"},{"en":"process","zh":"过程、机制","m":"结果是怎样产生的"}]},"prob-L2-selection":{"name":"证据取决于产生机制","one":"证据 = 看到的结果 + 它怎么产生；机制不同，意义不同。","pts":["要问：谁选的、他知道什么、按什么规则","知情主持人见羊概率 1，随机主持人 2/3","同样见羊：前者换赢 2/3，后者 1/2"],"ex":"各玩 300 次：知情主持人 300 次都见羊；随机主持人只有 200 次见羊。","trap":"只问「我看到了什么」，不问「我为什么会看到它」。","ana":"“这家店很好吃”：随机路人说的和老板自己说的，话一模一样，但说出这句话的方式不同，可信度就不同。","words":[{"en":"mechanism","zh":"机制","m":"结果是怎样产生的"},{"en":"informational significance","zh":"信息意义","m":"一件事告诉了你什么"},{"en":"reliability","zh":"可靠程度","m":"有多常是对的"},{"en":"oracle","zh":"预测者","m":"纽康姆悖论里预测你选择的角色"},{"en":"universally accepted","zh":"公认的","m":"所有人都接受"},{"en":"coincide","zh":"重合、一致","m":"两者总是相同"},{"en":"unbiased","zh":"无偏的","m":"不偏向任何一方"}]},"prob-L2-germantank":{"name":"德国坦克问题","one":"编号全低排除不了大产量，但小产量时更常见，所以支持小产量。","pts":["不要只问「这个假设下证据可能吗」","要比：各假设下证据有多容易出现","两个假设都相容，不代表证据中立"],"ex":"缴获 1 辆编号 \u003c1000：产量 1000 时几乎必然；产量 100 万时只有约 1/1000。","trap":"以为「大产量仍有可能」就说明证据没有倾向。","ana":"从抽奖箱摸出 5 张号码都在 1–50：若箱里只有 50 张很正常，若有 10000 张就太巧了，所以更支持“箱子小”。","words":[{"en":"serial number","zh":"序列编号","m":"按顺序给的编号"},{"en":"sequentially","zh":"按顺序地","m":"1、2、3……依次"},{"en":"captured","zh":"缴获的","m":"被抓到手的"},{"en":"rule out","zh":"排除","m":"证明不可能"},{"en":"hypothesis","zh":"假设","m":"待检验的说法"},{"en":"consistent with","zh":"与……相容","m":"不与之矛盾"},{"en":"production","zh":"产量","m":"一共造了多少"},{"en":"either way","zh":"对任何一方","m":"不偏向哪个假设"}]},"prob-L2-newcomb":{"name":"纽康姆悖论（Newcomb\u0027s paradox）","one":"证据推理支持只拿 B；因果推理支持拿两盒（钱已放好改不了）。","pts":["一盒派：我只拿 B，说明 B 里多半有百万","两盒派：钱已放好，多拿 A 多 $1000（优势论证）","预测者若只是随机猜，显然该拿两盒"],"ex":"预测者 99% 准：100 个一盒者约 99 人得百万；100 个两盒者约 99 人只得 $1000。","trap":"以为选 B 能「造成」B 里有钱，或以为此题有公认答案。","ana":"极准的店员早已按预测装好盲盒：你只拿盲盒是“盒里有大奖”的好兆头（证据），但此刻的决定改不了盒里已装的东西（因果）。","words":[{"en":"evidential reasoning","zh":"证据推理","m":"问：我的选择预示什么"},{"en":"causal reasoning","zh":"因果推理","m":"问：我的选择能造成什么"},{"en":"dominance","zh":"优势论证","m":"每种情况下都更好"},{"en":"one-box / two-box","zh":"只拿一盒 / 拿两盒","m":"只拿 B / A 和 B 都拿"},{"en":"oracle / predictor","zh":"预测者","m":"提前预测你选择的角色"},{"en":"opaque / transparent","zh":"不透明 / 透明","m":"看不到 / 看得到里面"},{"en":"reliable","zh":"可靠的","m":"几乎总是对的"},{"en":"fixed state","zh":"固定状态","m":"盒里的钱已定下来"},{"en":"oracle","zh":"预言者","m":"题中能预测你选择的角色"},{"en":"two-boxer","zh":"两盒派","m":"主张两个盒子都拿的人"},{"en":"one-boxer","zh":"一盒派","m":"主张只拿 B 的人"},{"en":"causally bring about","zh":"因果地造成","m":"真的让某事发生"},{"en":"base rate","zh":"基础比率","m":"某类在总体中的比例"},{"en":"at random","zh":"随机地","m":"没有规律、碰运气"},{"en":"carries no evidence","zh":"不带证据","m":"不提供任何信息"}]},"prob-L4-hdbet":{"name":"HD 赌局","one":"赌局赢面只有 1/12，比原机会 1/10 小：替换拒绝，额外接受。","pts":["正面且 6：独立相乘 1/2×1/6=1/12","额外机会只对没拿 HD 的 9/10 起作用","总概率 = 1/10 + 9/10×1/12 = 17.5%"],"ex":"设 120 人：原本 HD 12 人；其余 108 人去赌，中 9 人；共 21÷120=17.5%。","trap":"额外机会写成 1/10+1/12，把已拿 HD 的人又算一遍。","ana":"你有一张 10% 中奖的票：拿它“换”一张约 8% 的票是亏；“额外送”一张、第一张没中时还能再抽，总机会就变大。","words":[{"en":"replace","zh":"替换","m":"放弃原来的，改用新的"},{"en":"extra chance","zh":"额外机会","m":"原来的保留，再多一次"},{"en":"otherwise","zh":"原本、否则","m":"不靠赌局的情况下"},{"en":"overall","zh":"总的","m":"所有途径加在一起"},{"en":"legitimate","zh":"合理的","m":"有正当依据的"},{"en":"reward","zh":"奖励","m":"赢了能得到的东西"},{"en":"attitude to risk","zh":"风险态度","m":"愿不愿冒险"},{"en":"expected utility","zh":"期望效用","m":"后面讲：同时考虑概率与价值"}]},"prob-L4-frequency":{"name":"频率理解（frequency）","one":"频率（frequency）概率 = 群体里有某属性的人占多少比例。","pts":["「班上约十分之一拿 HD」是频率说法","群体比例不一定等于某个人的概率","认真准备的学生，个人概率可高于 10%"],"ex":"100 个学生里 10 个拿 HD：频率 10%；认真学习的那群人里比例可能更高。","trap":"把班级频率直接当作自己的个人概率。","ana":"“这座城市 30% 的人戴眼镜”描述的是整体比例，不是说某个具体的人“有 30% 戴着眼镜”。","words":[{"en":"population","zh":"群体、总体","m":"被统计的一整群人"},{"en":"individual","zh":"个体","m":"群体中的某一个人"},{"en":"given all their evidence","zh":"考虑其全部证据","m":"把知道的都算进去"},{"en":"preparation","zh":"准备","m":"复习、学习的投入"},{"en":"undefined","zh":"无定义的","m":"无法给出数值"},{"en":"interpretation","zh":"解释、理解方式","m":"概率是什么意思"},{"en":"statement","zh":"陈述","m":"一句说法"}]},"prob-L4-epistemic":{"name":"认识论概率（epistemic probability）","one":"认识论概率（epistemic）：根据现有证据有多大信心；信息变，概率变。","pts":["表达「我知道多少」，不是物理随机机制","不同于客观机会：硬币、骰子那种","「根据证据，我相当确信……」是认识论说法"],"ex":"「以我有限的信息，我只有 10% 信心你拿 HD」；得知你认真学习后升到 50%。","trap":"把「信心」的说法误当成群体频率或客观机会。","ana":"朋友抛完硬币用手盖住：结果已经定了，但你对“正面”仍只有 1/2 的信心；他偷看后，对他来说就是 0 或 1。","words":[{"en":"confidence","zh":"信心","m":"相信的程度"},{"en":"limited information","zh":"有限的信息","m":"知道得不多"},{"en":"proposition","zh":"命题","m":"有真假的一句话"},{"en":"logical necessity","zh":"逻辑必然","m":"按逻辑不可能为假"},{"en":"fairly confident","zh":"相当确信","m":"比较有把握"},{"en":"defendant / guilty","zh":"被告 / 有罪的","m":"法庭上受审的人 / 犯了罪"},{"en":"forecast","zh":"预报","m":"如天气预报"}]},"prob-L8-gambler":{"name":"赌徒谬误","one":"承认各次独立，却说过去一串结果让下一次更可能（或更不可能）。","pts":["独立时，过去不改变下一次的概率","先查：当事人真认为各次独立吗？","有排班表、执法名单时，过去确实有信息，不是谬误"],"ex":"公平硬币连出 12 次正面，第 13 次反面仍是 1/2，不是「该来了」。","trap":"看到错结论就贴「赌徒谬误」，不先查是否独立。","ana":"轮盘连开 8 次红，有人押黑说“该轮到黑了”；若轮盘公平且各次独立，下一次出黑的概率和平时完全一样。","words":[{"en":"due","zh":"该来了","m":"以为某结果“到期”"},{"en":"streak","zh":"一连串","m":"连续出现同一结果"},{"en":"roster / cycle","zh":"轮班表 / 周期","m":"按计划轮流安排"},{"en":"enforcement list","zh":"执法名单","m":"被执法部门重点关注的名单"},{"en":"compensate","zh":"补偿","m":"把之前的亏欠补回来"},{"en":"premise","zh":"前提","m":"推理所依据的说法"},{"en":"scam","zh":"诈骗","m":"骗钱的把戏"},{"en":"De Morgan\u0027s laws","zh":"德摩根律","m":"逻辑中否定与且/或的转换律"}]},"prob-L8-fairness":{"name":"公平性 vs 独立性","one":"公平（fair）看一次里各结果是否等概率；独立看各次之间。","pts":["独立：知道一次结果，不改变另一次","不公平的骰子，各次仍可独立","赌徒谬误要的是独立，不是 50/50"],"ex":"骰子每次出 6 都是 0.30（≠1/6），各次独立：不公平，但独立。","trap":"把「每次概率一样」当成公平，或以为不公平就不独立。","ana":"一枚灌铅硬币每次都有 70% 出正面：不公平；但它不“记得”上一次的结果，所以各次投掷仍然独立。","words":[{"en":"biased / unfair","zh":"有偏的 / 不公平的","m":"各结果概率不相等"},{"en":"essential","zh":"必不可少的","m":"缺了就不成立"},{"en":"assumption","zh":"假设、前提","m":"事先认定的条件"},{"en":"mutually exclusive","zh":"互斥","m":"不能同时为真"},{"en":"at least one","zh":"至少一个","m":"一个或更多"},{"en":"in a row","zh":"连续","m":"一次接一次"}]},"prob-L8-independence":{"name":"独立性","one":"独立（independent）：知道 B 不改变 A 的概率，P(A|B)=P(A)。","pts":["独立时 P(A∧B) = P(A)P(B)；双向成立","能同时真 ≠ 不独立：A 与黑桃可同真却独立","「改变」指信息更新，不是因果"],"ex":"52 张里 A 占 4/52=1/13；13 张黑桃里 A 占 1/13：不变，独立。","trap":"把独立当成「不能同时发生」，那是互斥。","ana":"同时掷骰子和抛硬币：知道硬币是正面，骰子出 6 仍是 1/6；反过来知道骰子是 6，硬币正面也仍是 1/2。","words":[{"en":"symmetric","zh":"对称的","m":"反过来也成立"},{"en":"entail","zh":"蕴含","m":"一个为真另一个必真"},{"en":"standard deck","zh":"一副标准扑克","m":"52 张，4 种花色"},{"en":"suit / colour","zh":"花色 / 颜色","m":"如红桃 / 红色"},{"en":"Ace / Spade","zh":"A 牌 / 黑桃","m":"每种花色 1 张 A；黑桃 13 张"},{"en":"Heart / Club","zh":"红桃 / 梅花","m":"红桃为红色，梅花为黑色"},{"en":"well defined","zh":"有明确定义","m":"可以算出具体数值"},{"en":"dependent","zh":"依赖（不独立）","m":"知道一个会改变另一个的概率"}]},"prob-L8-notcausal":{"name":"概率更新 ≠ 因果作用","one":"条件概率说的是信息：更新的是信念度（credence），不是因果。","pts":["爆竹不会自燃，炸了必定点过：Pr(点|炸)=1","这是更新对过去的信念，不是倒因果","依赖本身看不出原因，因果要另外论证"],"ex":"90 个爆竹：点 30 个炸 10，没点 60 个炸 0 → Pr(点|炸)=10÷10=1。","trap":"把 Pr(炸|点)=1/3 和 Pr(点|炸)=1 搞混，或读成因果。","ana":"早上看到地面湿了，你更相信夜里下过雨；但地湿并没有“造成”下雨，改变的只是你的判断。","words":[{"en":"firecracker","zh":"爆竹","m":"点燃后会爆炸的鞭炮"},{"en":"lit","zh":"被点燃的","m":"light 的过去分词"},{"en":"explode","zh":"爆炸","m":"炸开"},{"en":"spontaneously","zh":"自发地","m":"没人点也自己发生"},{"en":"backward causation","zh":"倒因果","m":"后来的事造成先前的事"},{"en":"bearing","zh":"关联、影响","m":"一件事对另一件事的相关性"},{"en":"sprinkler / lawn","zh":"洒水器 / 草坪","m":"浇草坪的装置 / 草地"}]},"prob-L8-longrun":{"name":"长期频率 vs 短期补偿","one":"长期比例趋近 1/2，靠后面大量试验稀释偏差，不靠下一次补偿。","pts":["已经出现的正面不会被抹掉","下一次仍是 1/2，不偏向反面","「长期会平衡」不能为赌徒谬误辩护"],"ex":"前 10 次 8 正，后 990 次约 495 正：共约 503/1000≈50.3%。","trap":"以为趋近 1/2 要求短期内反面变多。","ana":"第一次测验考得很低，之后考了很多次正常分：总平均接近正常，但第一次的低分没被“补回”，只是被冲淡了。","words":[{"en":"in the long run","zh":"长期来看","m":"试验次数非常多时"},{"en":"proportion","zh":"比例","m":"占总数的几分之几"},{"en":"approach","zh":"趋近","m":"越来越接近"},{"en":"dilute","zh":"稀释","m":"被大量后续结果冲淡"},{"en":"imbalance","zh":"不平衡、偏差","m":"正反次数不相等"},{"en":"convergence","zh":"趋近、收敛","m":"逐渐接近某个值"},{"en":"compensation","zh":"补偿","m":"把之前的偏差抵消掉"},{"en":"biased toward","zh":"偏向","m":"更容易出现某结果"}]},"prob-L8-randomness":{"name":"客观与认识论随机","one":"分清客观随机（objective）、确定但难预测、按现有信息当作随机。","pts":["客观随机：如量子过程","确定但难预测：硬币、轮盘，知道初始条件就能算","按现有信息当作随机，是合理做法"],"ex":"有人用摄像和快速计算预测轮盘落点：对他来说轮盘不再随机。","trap":"把「我预测不了」当成「世界本身随机」。","ana":"魔术师洗牌：练过的他能控制顺序（确定的），但你看不出规律；按你掌握的信息，把牌序当作随机是合理的。","words":[]},"prob-L10-mutex":{"name":"互斥","one":"互斥（mutually exclusive）：不能同时真，但可以同时假。","pts":["互斥 ≠ 恰有一真（那是互斥且穷尽）","A、C 互斥→A∧B 与 C 也互斥，A∨B 则不一定","A∧B 与 A∧¬B 互斥：一个要 B，一个要 ¬B"],"ex":"一次掷骰「掷出 2」与「掷出 3」互斥；掷出 5 时两者都假。","trap":"以为互斥的两句必有一句为真。","ana":"此刻你“在北京”和“在上海”不可能同时为真，但两者可以同时为假——比如你在广州。","words":[{"en":"exactly one","zh":"恰好一个","m":"不多不少一个"},{"en":"follow","zh":"推出","m":"由前面能得出"},{"en":"for any B","zh":"对任意 B","m":"B 是什么都成立"},{"en":"independent","zh":"独立","m":"知道一个不改变另一个的概率"},{"en":"Club / Spade","zh":"梅花 / 黑桃","m":"扑克的两种花色"},{"en":"cannot be determined","zh":"无法确定","m":"条件不够算不出"}]},"prob-L10-mutexvsindep":{"name":"互斥 vs 独立","one":"互斥：不能同时发生；概率都 \u003e0 的互
