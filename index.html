t gets swooped?","options":["0.06","0.12","0.044","0.03"],"answer":2,"explain":"0.3×0.1 + 0.7×0.02 = 0.03 + 0.014 = 0.044。0.06 是把 10% 与 2% 直接平均（忽略组大小）；0.12 是直接相加；0.03 只算了北岸。","hf":true},{"id":"prob-L12-q08","module":"prob","lecture":"L12","topic":"全概率","q":"Why is it wrong to compute the overall swooping rate in the magpie example as (10% + 2%)/2 = 6%?","options":["Because conditional probabilities can never be added.","Because swooping on the two shores is not independent.","Because 2% is a joint probability, not a conditional one.","Because the two groups are of different sizes, so each rate must be weighted by its group\u0027s share of the population."],"answer":3,"explain":"北岸占 30%、南岸占 70%，必须按组大小加权：0.3×10% + 0.7×2%。只有两组一样大时简单平均才恰好正确。","hf":false},{"id":"prob-L12-q09","module":"prob","lecture":"L12","topic":"补全列联表","q":"Pr(D) = 0.5, Pr(S) = 0.3, and Pr(D \u0026 S) = 0.1. What is Pr(D | S)?","options":["1/3","0.2","0.1","0.5"],"answer":0,"explain":"Pr(D|S) = Pr(D\u0026S)/Pr(S) = 0.1/0.3 = 1/3。0.2 是反方向 Pr(S|D)=0.1/0.5；0.1 是交集；0.5 是 Pr(D)，若默认独立才会得到它。","hf":true},{"id":"prob-L12-q10","module":"prob","lecture":"L12","topic":"补全列联表","q":"With Pr(D) = 0.5, Pr(S) = 0.3, Pr(D \u0026 S) = 0.1, what is Pr(~D \u0026 ~S)?","options":["0.35","0.7","0.3","0.2"],"answer":2,"explain":"设 100 人：D\u0026S=10，~D\u0026S=30−10=20，D\u0026~S=50−10=40，~D\u0026~S=100−10−20−40=30 → 0.3。0.35 = 0.5×0.7 是错误地假设了独立。","hf":false},{"id":"prob-L12-q11","module":"prob","lecture":"L12","topic":"独立 vs 互斥","q":"Four seasons are equally likely. A = born in spring or summer; B = born in summer or autumn. Which is true?","options":["A and B are mutually exclusive and independent.","A and B are independent but not mutually exclusive.","A and B are neither independent nor mutually exclusive.","A and B are mutually exclusive but not independent."],"answer":1,"explain":"A\u0026B = 夏，Pr=1/4；Pr(A|B) = (1/4)/(1/2) = 1/2 = Pr(A)，独立。夏季两者同时成立，所以不互斥。这说明独立 ≠ 互斥。","hf":true},{"id":"prob-L12-q12","module":"prob","lecture":"L12","topic":"独立性","q":"Four seasons are equally likely; A = born in spring or summer, B = born in summer or autumn. A first attempt calculated Pr(A | B) as (3/4)/(1/2) = 1.5. What was the error?","options":["The denominator should have been Pr(A), not Pr(B).","The numerator used the disjunction (spring or summer or autumn) instead of the conjunction (A and B), which is only summer.","Seasons are not equally likely, so 1/4 was wrong.","Nothing: conditional probabilities can exceed 1."],"answer":1,"explain":"教授当场纠正：分子必须是 AND。(春∨夏)\u0026(夏∨秋) 只剩夏季 = 1/4，结果 1/2。概率超过 1 本身就是出错的信号。","hf":false},{"id":"prob-L12-q13","module":"prob","lecture":"L12","topic":"独立 vs 互斥","q":"A and B are mutually exclusive, and each has probability greater than 0. Which must be true?","options":["A and B are independent.","Pr(A | B) = Pr(A).","A and B are not independent.","Pr(A | B) = 1."],"answer":2,"explain":"互斥 → Pr(A\u0026B)=0 → Pr(A|B)=0，而 Pr(A)\u003e0，所以 Pr(A|B) ≠ Pr(A)，不独立。知道 B 发生就排除了 A。","hf":true},{"id":"prob-L12-q14","module":"prob","lecture":"L12","topic":"永真式条件","q":"Pr(A) = 0.2 and T is a tautology (e.g. B ∨ ~B). What is Pr(A | T)?","options":["0.2","1","0","Undefined"],"answer":0,"explain":"Pr(T)=1，A\u0026T 等价于 A，所以 Pr(A|T) = Pr(A)/1 = 0.2。永真式不排除任何可能，因此与所有命题独立。","hf":false},{"id":"prob-L12-q15","module":"prob","lecture":"L12","topic":"矛盾式条件","q":"Pr(A) = 0.2 and F is a contradiction (e.g. B \u0026 ~B). Under the standard definition used in this course, Pr(A | F) is:","options":["0","1","0.2","Undefined"],"answer":3,"explain":"Pr(F)=0，Pr(A\u0026F)=0，得到 0/0，无定义。条件概率要求 Pr(条件)\u003e0；0/0 不是 0 也不是 1。","hf":false},{"id":"prob-L12-q16","module":"prob","lecture":"L12","topic":"交集 vs 条件概率","q":"Assuming Pr(B) \u003e 0, under exactly which condition does Pr(A \u0026 B) = Pr(A | B)?","options":["Only when Pr(B) = 1.","When Pr(B) = 1 or Pr(A \u0026 B) = 0.","Whenever A and B are independent.","Never."],"answer":1,"explain":"设 x=Pr(A\u0026B)、q=Pr(B)：x = x/q ⇔ x(q−1)=0 ⇔ x=0 或 q=1。课堂口头只说了 Pr(B)=1（如永真式），笔记补全了交集为 0 的情形（如骰子 A=1、B=2）。独立并不足以使二者相等。","hf":false},{"id":"prob-L12-q17","module":"prob","lecture":"L12","topic":"假想总体","q":"Building a hypothetical table of 100 people for the magpie example produces 1.4 swooped South Shore residents. What is the right attitude to this?","options":["The table is invalid because people cannot be fractional; you must use the formula instead.","It is fine: the table is a proportional model, and scaling to 1,000 people (14 swooped) gives the same probabilities.","You should round 1.4 to 1 before continuing.","It shows the South Shore probability was given incorrectly."],"answer":1,"explain":"教授特意说明小数人数不影响计算，这只是比例模型。改用 1000 人就是 30+14=44，总体仍为 4.4%。四舍五入反而会引入误差。","hf":false},{"id":"prob-L12-q18","module":"prob","lecture":"L12","topic":"条件方向","q":"Which statement about Pr(A | B) and Pr(B | A) is correct?","options":["They are always equal because they have the same numerator.","Pr(A | B) is always larger than Pr(B | A).","They can differ only if A causes B.","They share the numerator Pr(A \u0026 B) but generally have different denominators, so they need not be equal."],"answer":3,"explain":"分子相同、分母分别是 Pr(B) 和 Pr(A)。仅当 Pr(A)=Pr(B)（或交集为 0）时相等。教授强调方向差异不必是因果关系。","hf":true},{"id":"prob-L12-q19","module":"prob","lecture":"L12","topic":"列联表","q":"In a 2×2 contingency table of counts, what do the row and column totals (the margins) give you?","options":["Conditional probabilities such as Pr(A | B)","Joint counts such as the number of A \u0026 B cases","The overall counts of each single category, e.g. the number of A cases","Whether the two variables are independent"],"answer":2,"explain":"格子读交集（联合频数），边际读单个类别的总数，除以总体得到 Pr(A)、Pr(B)。条件概率需要用格子除以对应边际；独立性需要进一步比较。","hf":false},{"id":"prob-L11-q20","module":"prob","lecture":"L11","topic":"条件概率（罕见事件）","q":"Among 1,000 message records, A appears in 10, B appears in 10, and 8 records contain both. Which is correct?","options":["Pr(A | B) = 0.008, because A and B are both rare.","Pr(A | B) = 0.01, the same as Pr(A).","Pr(A | B) cannot be computed without knowing whether A causes B.","Pr(A | B) = 0.8, even though Pr(A) and Pr(B) are each only 0.01."],"answer":3,"explain":"Pr(A|B) = 8/10 = 0.8。L11 的提醒：A、B 整体都很罕见，但在 B 的小圈子里 A 可能非常常见。0.008 是交集 Pr(A\u0026B)。","hf":false},{"id":"prob-L11-q21","module":"prob","lecture":"L11","topic":"Markov 生成器","q":"An order-2 Markov text generator:","options":["assigns probabilities to the next word conditional on the previous two words","outputs two words at a time","only uses the two most common words in the corpus","conditions on the whole preceding text, two words at a time"],"answer":0,"explain":"阶数 = 作为条件的前文长度。order 2 看最近两个词，给出 Pr(下一词 | 前两个词)，不是一次输出两个词，也不看全部前文。","hf":false},{"id":"prob-L11-q22","module":"prob","lecture":"L11","topic":"Markov 表规模","q":"With a vocabulary of 100 words, a complete order-2 Markov table (all two-word contexts × all next words) has about how many entries, using the lecture\u0027s n^(k+1) estimate?","options":["200","10,000","1,000,000","100,000,000"],"answer":2,"explain":"n^(k+1) = 100^3 = 1,000,000。order 1 是 100^2 = 10,000。窗口每多一个词，表扩大 n 倍，这就是不能只把概率表做大的原因（还有数据稀疏）。","hf":false},{"id":"prob-L11-q23","module":"prob","lecture":"L11","topic":"自动补全","q":"When a phone suggests \u0027shops\u0027 after \u0027Do you want anything from the ...\u0027, the quantity it is tracking is best described as:","options":["Pr(\u0027shops\u0027), how common the word is overall","Pr(preceding words | \u0027shops\u0027)","Pr(\u0027shops\u0027 \u0026 preceding words) divided by the vocabulary size","Pr(\u0027shops\u0027 | preceding words)"],"answer":3,"explain":"自动补全比较的是在这段前文条件下各续词的概率，而不是词本身的总体频率。前文改变了条件，排序也随之改变。","hf":false},{"id":"prob-L16-q24","module":"prob","lecture":"L16","topic":"读符号","q":"T means \u0027tired\u0027 and I means \u0027irritable\u0027. What does Pr(T | I) ask for?","options":["The probability of being irritable, given that you are tired.","The probability of being tired, given that you are irritable.","The probability of being both tired and irritable.","The probability of being neither tired nor irritable."],"answer":1,"explain":"竖线右边是已知条件：先只看烦躁的时刻，再问其中多少也疲倦。「irritable, given tired」是反方向 Pr(I|T)；「both tired and irritable」是交集。","hf":true},{"id":"prob-L16-q25","module":"prob","lecture":"L16","topic":"Bayes 定理","q":"You are tired 40% of the time. When tired, you are irritable 80% of the time; when not tired, 10% of the time. Given that you are irritable, what is the probability that you are tired?","options":["40%","32%","16/19 (about 84.2%)","80%"],"answer":2,"explain":"100 个时刻：疲倦且烦躁 40×0.8=32，不疲倦但烦躁 60×0.1=6；烦躁共 38，Pr(T|I)=32/38=16/19。32% 是交集；80% 是 Pr(I|T)（方向弄反）；40% 是先验。","hf":true},{"id":"prob-L16-q26","module":"prob","lecture":"L16","topic":"否定证据","q":"1 in 100 people is a vampire. 99% of vampires burn in sunlight; humans never do. A randomly met person does NOT burn in sunlight. What is the probability that they are a vampire?","options":["1/9901 (about 0.0101%)","1/100","1/10000","99/100"],"answer":0,"explain":"证据是 ¬I。1 万人：100 吸血鬼中 1 个不烧毁，9900 个人类全部不烧毁；不烧毁者 9901 人中吸血鬼占 1/9901。1/10000 是交集 Pr(V\u0026¬I)；1/100 是先验。","hf":true},{"id":"prob-L16-q27","module":"prob","lecture":"L16","topic":"Bayes 检测题","q":"75% of pills contain MDMA. A test is positive for 50% of pills with MDMA and 40% of pills without it. A pill tests positive. How likely is it to contain MDMA?","options":["50%","75%","100%","15/19 (about 78.9%)"],"answer":3,"explain":"1000 片：真药阳性 750×0.5=375，假药阳性 250×0.4=100；阳性共 475，375/475=15/19。检测前 75%、检测后只升到约 79%——这是弱证据，因为假阳性率很高。","hf":true},{"id":"prob-L16-q28","module":"prob","lecture":"L16","topic":"无鉴别力证据","q":"A test is positive equally often whether or not a pill contains MDMA. 75% of pills contain MDMA. A pill tests positive. What is the probability that it contains MDMA?","options":["100%","50%","75%","It cannot be determined."],"answer":2,"explain":"Pr(P|M)=Pr(P|¬M) 时证据无法区分两类，后验 = 先验 = 75%（检测结果与真假在概率上独立）。50% 是常见误解：以为「阳性率一半」就意味着结论变一半。","hf":false},{"id":"prob-L16-q29","module":"prob","lecture":"L16","topic":"零假阳性","q":"Suppose a test has a 50% true positive rate but a 0% false positive rate. A pill tests positive. What is the probability it contains MDMA (base rate 75%)?","options":["50%","75%","100%","87.5%"],"answer":2,"explain":"Pr(P|¬M)=0，分母只剩真药阳性：0.375/(0.375+0) = 1。只要没有假阳性，阳性就能完全排除 ¬M，哪怕真阳性率只有 50%。","hf":false},{"id":"prob-L16-q30","module":"prob","lecture":"L16","topic":"base rate 敏感性","q":"The same test (50% true positive, 40% false positive) is used where only 10% of pills contain MDMA. A pill tests positive. The probability it contains MDMA is closest to:","options":["50%","12.2%","78.9%","10%"],"answer":1,"explain":"0.1×0.5=0.05；0.9×0.4=0.36；0.05/0.41=5/41≈12.2%。检测性能没变，base rate 从 75% 降到 10%，后验从 78.9% 降到 12.2%。","hf":true},{"id":"prob-L16-q31","module":"prob","lecture":"L16","topic":"条件补集","q":"Which pair of probabilities must sum to 1?","options":["Pr(P | M) and Pr(P | ¬M)","Pr(P | M) and Pr(¬P | M)","Pr(M | P) and Pr(P | M)","Pr(P | M) and Pr(M)"],"answer":1,"explain":"只有同一条件下的正反结果才互补：Pr(P|M)+Pr(¬P|M)=1。真阳性率与假阳性率来自不同人群，不必相加为 1（如 50%+40%=90%）。","hf":true},{"id":"prob-L16-q32","module":"prob","lecture":"L16","topic":"否定号","q":"In the vampire problem (V = vampire, I = burns in sunlight), the person you meet does not burn. Which quantity should you compute?","options":["Pr(V | I)","Pr(¬I | V)","Pr(V | ¬I)","Pr(V \u0026 I)"],"answer":2,"explain":"证据是「没有烧毁」¬I，目标是吸血鬼 V：Pr(V|¬I)。否定号必须跟着证据进入公式。Pr(¬I|V)=1% 是方向反了的似然。","hf":false},{"id":"prob-L16-q33","module":"prob","lecture":"L16","topic":"Bayes 分母","q":"In Bayes\u0027 theorem, why does the denominator Pr(E) expand to Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H)?","options":["Because E and H are always independent.","Because Pr(E|H) + Pr(E|¬H) = 1.","Because the base rate must be counted twice.","Because H and ¬H are mutually exclusive and exhaustive, so E can arise only through one of these two routes, and both routes must be counted."],"answer":3,"explain":"全概率法则：H 与 ¬H 互斥且穷尽，证据要么来自 H 要么来自 ¬H，两条来源都要加进分母。「Pr(E|H) + Pr(E|¬H) = 1」是错的：两个条件来自不同人群，一般不相加为 1。","hf":true},{"id":"prob-L16-q34","module":"prob","lecture":"L16","topic":"base rate 忽视","q":"A condition affects 1 in 1,000 people. A test detects it 99% of the time when present and gives a false positive 5% of the time when absent. Someone tests positive. The probability they have the condition is closest to:","options":["99%","95%","about 2%","5%"],"answer":2,"explain":"10 万人：患者 100 人中阳性 99；健康 99,900 人中假阳性 4,995；Pr(D|+) = 99/5094 ≈ 1.9%。99% 是把 Pr(+|D) 当成 Pr(D|+)；忽略了极低的 base rate。（练习题，按本讲方法计算）","hf":true},{"id":"prob-L16-q35","module":"prob","lecture":"L16","topic":"罐子题","q":"A fair coin picks urn X on heads (3 black, 1 white) and urn Y on tails (1 black, 3 white). Two balls are drawn with replacement and both are black. What is the probability the coin landed heads?","options":["1/2","3/4","9/10","1/10"],"answer":2,"explain":"Pr(两黑|X)=(3/4)²=9/16，Pr(两黑|Y)=(1/4)²=1/16，先验各半，所以 Pr(X|两黑)=9/(9+1)=9/10。3/4 是只抽一个黑球时的后验。","hf":true},{"id":"prob-L16-q36","module":"prob","lecture":"L16","topic":"罐子题","q":"Same urns (X: 3 black, 1 white; Y: 1 black, 3 white; fair coin chooses). With replacement, you draw black first and then white. What is the probability of heads (urn X)?","options":["3/4","1/2","9/10","1/4"],"answer":1,"explain":"Pr(黑白|X)=3/4×1/4=3/16，Pr(黑白|Y)=1/4×3/4=3/16，两罐一样容易产生该证据，证据无鉴别力，后验 = 先验 1/2。","hf":false},{"id":"prob-L16-q37","module":"prob","lecture":"L16","topic":"睡美人问题","q":"Which statement best reflects the lecture\u0027s treatment of the Sleeping Beauty problem?","options":["There are competing arguments: one counts fair coin outcomes (heads = 1/2), another counts indistinguishable awakenings (heads = 1/3).","The lecture proved beyond dispute that heads has probability 1/2 after waking.","The lecture proved beyond dispute that heads has probability 1/3 after waking.","The coin becomes biased because Sleeping Beauty wakes up twice on tails."],"answer":0,"explain":"课堂把它作为尚有争议的哲学难题：halfer 数硬币结果，thirder 数醒来场合。硬币仍然公平。","hf":false},{"id":"prob-L16-q38","module":"prob","lecture":"L16","topic":"睡美人问题","q":"According to the thirder view of the Sleeping Beauty problem, on waking Sleeping Beauty should assign tails a probability of:","options":["1/3","1/2","2/3","1"],"answer":2,"explain":"Thirder：长期看一个正面醒来场合对应两个反面醒来场合，所以正面 1/3、反面 2/3。别把两个数对调。","hf":false},{"id":"prob-L16-q39","module":"prob","lecture":"L16","topic":"Pr(E|H) vs Pr(H|E)","q":"\"Almost everyone with disease H shows symptom E, so a person with symptom E almost certainly has H.\" What is the main flaw?","options":["It confuses Pr(E | H) with Pr(H | E), ignoring how rare H is and how often E occurs without H.","It assumes E and H are mutually exclusive.","It uses a conditional probability where a joint probability is required.","There is no flaw if Pr(E | H) is above 90%."],"answer":0,"explain":"这是反转条件概率的错误。Pr(H|E) 还取决于 base rate Pr(H) 和 Pr(E|¬H)。H 若罕见、或其他原因常产生 E，Pr(H|E) 可以很低。","hf":true},{"id":"prob-L16-q40","module":"prob","lecture":"L16","topic":"证据强弱","q":"Holding the base rate and the true positive rate Pr(P | M) fixed, which change makes a positive result stronger evidence for M?","options":["Raising the false positive rate Pr(P | ¬M)","Lowering the false positive rate Pr(P | ¬M)","Making Pr(P | M) + Pr(P | ¬M) equal 1","Making Pr(P | ¬M) equal Pr(P | M)"],"answer":1,"explain":"证据力量取决于两种条件下阳性率的差距。降低假阳性率（如从 40% 降到 5%）后验大幅上升；降到 0 时阳性即确定 M。二者相等时证据毫无信息。","hf":false},{"id":"prob-L16-q41","module":"prob","lecture":"L16","topic":"Bayes 应用","q":"The lecture mentioned that algorithms using group features as evidence can misjudge individuals. In Bayesian terms, the main risk is that:","options":["If the base rates or conditional probabilities fed in are mistaken, the posterior assigned to an individual can be wrong.","Bayes\u0027 theorem does not apply to algorithms.","Algorithms always ignore the evidence.","Posterior probabilities are always equal to base rates."],"answer":0,"explain":"公式本身没错，但输入的 base rate 或条件概率估错了，结论就会出错（algorithmic bias）；把群体猜测错套到个人身上。","hf":false},{"id":"prob-L18-q42","module":"prob","lecture":"L18","topic":"净收益","q":"In the corrected startup example, you invest $1 million and receive $4 million back if the idea is good and the founder is charismatic. What is your net gain in that outcome?","options":["Lose $1 million","Gain $3 million","Gain $4 million","Gain $5 million"],"answer":1,"explain":"净收益 = 回款 − 投入 = 4 − 1 = 300 万美元。$4M 是回款（gross payout），不是净收益。","hf":true},{"id":"prob-L18-q43","module":"prob","lecture":"L18","topic":"创业题期望值","q":"Corrected startup model, investing $1M: good idea + charismatic founder (prob 2/25) returns $4M; good idea + dull founder (8/25) returns $0; bad idea (15/25) returns $0. What is the expected NET value?","options":["+$0.32 million","−$0.68 million","−$1 million","+$0.24 million"],"answer":1,"explain":"净结果 +3、−1、−1：2/25×3 + 8/25×(−1) + 15/25×(−1) = (6−23)/25 = −0.68。+0.32 是只算回款漏扣成本（旧答案的错误）；+0.24 是只算盈利路径、漏掉亏损。","hf":true},{"id":"prob-L18-q44","module":"prob","lecture":"L18","topic":"创业题期望值","q":"Same corrected model but investing $5M: charismatic (2/25) returns $20M; dull founder (8/25) returns $4M; bad idea (15/25) returns $0. What is the expected net value?","options":["+$2.88 million","−$2.12 million","−$5 million","−$0.68 million"],"answer":1,"explain":"净结果 +15、−1、−5：2/25×15 + 8/25×(−1) + 15/25×(−5) = (30−8−75)/25 = −2.12。+2.88 是期望回款（未扣 500 万）。押更多钱不会把坏投资变好，平均亏损反而变大。","hf":true},{"id":"prob-L18-q45","module":"prob","lecture":"L18","topic":"扣除成本","q":"A fair coin game pays $10 on heads and $0 on tails, and costs $6 to play. What is the player\u0027s expected net gain?","options":["Gain $5","Gain $4","Lose $1","Lose $6"],"answer":2,"explain":"期望回款 5，减去票价 6，净 −1。也可逐项扣：1/2×(10−6) + 1/2×(0−6) = 2 − 3 = −1。","hf":true},{"id":"prob-L18-q46","module":"prob","lecture":"L18","topic":"公平价格","q":"For the game paying $10 on heads and $0 on tails (fair coin), what entry price makes the bet fair?","options":["$0","$2.50","$5","$10"],"answer":2,"explain":"公平价格 = 期望回款 = 1/2×10 + 1/2×0 = $5，此时期望净收益为 0。","hf":true},{"id":"prob-L18-q47","module":"prob","lecture":"L18","topic":"扣除成本","q":"A student computes the expected net gain of a $5 ticket as 1/2 × (10 − 5) + 1/2 × (0 − 5) − 5 = −5. What went wrong?","options":["Nothing; this is correct.","The cost was subtracted twice: once in each outcome and again at the end.","The cost should be added, not subtracted.","The probabilities should be multiplied, not added."],"answer":1,"explain":"两种做法只选一种：每路先减票价再平均（=0），或先算平均回款再减一次（5−5=0）。不能两种都做，否则成本被扣了两次。","hf":false},{"id":"prob-L18-q48","module":"prob","lecture":"L18","topic":"公平赌局","q":"You pay the fair price of $5 to play the $10/$0 coin game once. Which statement is correct?","options":["You are guaranteed to break even on this play.","You will gain $5 on average.","The bet is fair only if you play exactly twice.","Your expected net gain is $0, but on this play you will actually either gain $5 or lose $5."],"answer":3,"explain":"公平是关于平均（期望）的说法，不是保证单次收支相抵。单次结果只有 +5 或 −5，没有一次刚好是 0。","hf":false},{"id":"prob-L18-q49","module":"prob","lecture":"L18","topic":"庄家优势","q":"If a bet\u0027s price is set above its fair price while the payouts stay the same, then:","options":["the bettor\u0027s expected net gain is negative, giving the house an edge","the bettor\u0027s expected net gain is still zero","the probabilities of the outcomes change","the bettor\u0027s expected payout increases"],"answer":0,"explain":"期望回款不变、票价变高，期望净收益 = 回款 − 票价 \u003c 0，差额就是庄家优势（如回款 5 元卖 6 元）。","hf":false},{"id":"prob-L18-q50","module":"prob","lecture":"L18","topic":"Martingale","q":"In the Martingale strategy, a player doubles the stake after each loss. What is the main practical danger?","options":["The coin remembers previous losses and becomes less fair.","The required stake can grow beyond the player\u0027s money or the betting limit.","Doubling makes the next flip more likely to lose.","The strategy guarantees a large profit on every round."],"answer":1,"explain":"所需下注 1、2、4、8…指数增长，有限资金或下注上限会让你撑不到赢的那次；而赢了也只净赚最初一注。硬币没有记忆，加倍也不改变下一次的概率。","hf":true},{"id":"prob-L18-q51","module":"prob","lecture":"L18","topic":"Martingale","q":"Using the Martingale strategy with an initial stake of $1 on an even-money fair coin bet, you lose six times in a row (stakes 1, 2, 4, 8, 16, 32). If you then bet the required amount and win, what is your overall net gain?","options":["$64","$63","$1","$127"],"answer":2,"explain":"已亏 1+2+4+8+16+32 = 63；第 7 注押 64，赢得 64，净结果 64 − 63 = 1。冒着押 64 元（累计投入 127 元）的风险，只为赚 1 元。","hf":false},{"id":"prob-L18-q52","module":"prob","lecture":"L18","topic":"赌徒谬误","q":"A fair coin lands tails six times in a row. If flips are independent, what is the probability of heads on the next flip?","options":["Less than 1/2, because tails is on a streak","Exactly 1/2","More than 1/2, because heads is due","Exactly 1, because a streak must end"],"answer":1,"explain":"独立意味着过去结果不改变下一次概率。认为正面「该来了」就是 gambler\u0027s fallacy。","hf":true},{"id":"prob-L18-q53","module":"prob","lecture":"L18","topic":"随机连串","q":"What is the probability that a fair coin lands heads eight times in a row?","options":["1/8","1/16","1/256","1/512"],"answer":2,"explain":"(1/2)^8 = 1/256。罕见但完全可能——真随机序列不必正反交替，人「编」的随机序列反而常缺少长连串。","hf":false},{"id":"prob-L18-q54","module":"prob","lecture":"L18","topic":"条件概率读法","q":"A keyboard-prediction game estimates Pr(F | FFF) from a person\u0027s previous key presses. What does this expression ask?","options":["How likely the next press is F, given that the last three presses were F","How likely the last three presses were F","How many times the person has pressed F","How likely three F presses follow an F"],"answer":0,"explain":"竖线右边是已知线索：已经看到 FFF 后，下一键是 F 的概率。若人总在 FFF 后「该换 D 了」，程序就能学会这个习惯。","hf":false},{"id":"prob-L18-q55","module":"prob","lecture":"L18","topic":"不确定硬币","q":"You are equally likely to have coin A or coin B. A lands heads with probability 0.75; B with probability 0.15. Before flipping, what is the overall probability of heads?","options":["0.15","0.30","0.45","0.90"],"answer":2,"explain":"两条路径相加：0.5×0.75 + 0.5×0.15 = 0.375 + 0.075 = 0.45。0.90 是直接相加 75%+15%（漏乘 1/2）。","hf":true},{"id":"prob-L18-q56","module":"prob","lecture":"L18","topic":"不确定硬币","q":"In the same two-coin case (A: 0.75 heads, B: 0.15 heads, each picked with probability 1/2), you flip once and see heads. What is the probability you have coin A?","options":["1/6","1/2","3/4","5/6"],"answer":3,"explain":"Pr(A|H) = 0.375/0.45 = 5/6 ≈ 83.3%。3/4 是 Pr(H|A)（方向反了）；1/6 是 Pr(B|H)。","hf":true},{"id":"prob-L18-q57","module":"prob","lecture":"L18","topic":"先验与后验","q":"After seeing heads in the two-coin case, which statement is correct?","options":["Coin A\u0027s chance of landing heads has risen above 0.75.","Coin B now lands heads with probability 0.","Nothing has changed, because coin flips are independent.","Our probability that we hold coin A rises from 1/2 to 5/6, but coin A\u0027s own heads-chance remains 0.75."],"answer":3,"explain":"新证据改变的是我们对「拿到哪枚」的判断，不改变硬币本身的偏向。「Nothing has changed」一项混淆了：给定某枚硬币时各次投掷独立，但硬币类型未知时，结果确实携带关于类型的信息。","hf":false},{"id":"prob-L18-q58","module":"prob","lecture":"L18","topic":"伪随机","q":"Some computer \u0027random number\u0027 generators start from a seed and apply a fixed rule. What follows?","options":["Starting from the same seed reproduces the same sequence.","The sequence is truly unpredictable in principle.","Each number depends on the previous number\u0027s probability of being repeated.","The output cannot contain streaks."],"answer":0,"explain":"伪随机序列（pseudorandom）由初始种子按固定规则生成，看似随机，但同一起点可以重现同一序列。","hf":false},{"id":"prob-L18-q59","module":"prob","lecture":"L18","topic":"期望值含义","q":"A game has an expected value of $5. Which interpretation is correct?","options":["You will receive exactly $5 each time you play.","$5 is the most likely single outcome.","Over many repetitions, the average outcome per play approaches $5.","At least half your plays will pay $5 or more."],"answer":2,"explain":"期望值是按概率加权的平均，描述重复多次时的每次平均。$10/$0 游戏 EV 为 $5，但单次永远拿不到 $5。","hf":false}],"calc":[{"id":"prob-L12-c01","module":"prob","lecture":"L12","topic":"列联表条件概率","q":"Of 1,000 students, 350 are domestic and live on campus, 100 are international and live on campus, 200 are domestic and live off campus, and 350 are international and live off campus. Let A = lives on campus, B = domestic. Find Pr(B), Pr(A \u0026 B), and Pr(A | B).","steps":[{"label":"求 Pr(B)","prompt":"Pr(B) = ?","answer":0.55,"tol":0.001,"hint":"本地生整列：(350+200)/1000"},{"label":"求 Pr(A \u0026 B)","prompt":"Pr(A \u0026 B) = ?","answer":0.35,"tol":0.001,"hint":"交叉格 ÷ 全体：350/1000"},{"label":"求 Pr(A | B)","prompt":"Pr(A | B) = ?","answer":0.6364,"tol":0.002,"hint":"交叉格 ÷ 本地生总数：350/550"}],"final":"Pr(A | B) = 350/550 = 7/11 ≈ 0.636","work":"Pr(B) = (350 + 200)/1000 = 550/1000 = 0.55\nPr(A \u0026 B) = 350/1000 = 0.35\nPr(A | B) = Pr(A \u0026 B)/Pr(B) = 0.35/0.55 = 7/11 ≈ 0.636","explain":"AND 的分母是全体 1000；GIVEN B 的分母是 B 的总数 550。教授板书曾把 Pr(A) 误写为 35%，按表应为 450/1000 = 45%；35% 是 Pr(A\u0026B)。","table":{"cols":["B: domestic","~B: international","Total"],"rows":[["A: on campus",350,100,450],["~A: off campus",200,350,550],["Total",550,450,1000]]}},{"id":"prob-L12-c02","module":"prob","lecture":"L12","topic":"条件方向 / 独立性","q":"Using the same campus table (A = on campus, B = domestic; 350 A\u0026B, 100 A\u0026~B, 200 ~A\u0026B, 350 ~A\u0026~B), find Pr(A), Pr(B | A), and Pr(A | ~B). Are A and B independent?","steps":[{"label":"求 Pr(A)","prompt":"Pr(A) = ?","answer":0.45,"tol":0.001,"hint":"校内整行：450/1000"},{"label":"求 Pr(B | A)","prompt":"Pr(B | A) = ?","answer":0.7778,"tol":0.002,"hint":"分母换成校内学生 450"},{"label":"求 Pr(A | ~B)","prompt":"Pr(A | ~B) = ?","answer":0.2222,"tol":0.002,"hint":"国际生 450 人中住校内 100 人"}],"final":"Pr(B | A) = 7/9 ≈ 0.778; Pr(A | ~B) = 2/9 ≈ 0.222. Since Pr(A | B) = 7/11 ≈ 0.636 ≠ Pr(A) = 0.45, A and B are not independent.","work":"Pr(A) = 450/1000 = 0.45\nPr(B | A) = 350/450 = 7/9 ≈ 0.778\nPr(A | ~B) = 100/450 = 2/9 ≈ 0.222\nPr(A | B) = 350/550 ≈ 0.636 ≠ 0.45 = Pr(A), so A and B are not independent.","explain":"Pr(B|A)=0.778 与 Pr(A|B)=0.636 分子相同、分母不同。独立性要比较 Pr(A|B) 与 Pr(A)；这里本地生住校内比例 63.6%，国际生只有 22.2%，知道身份明显改变住宿概率。","table":{"cols":["B: domestic","~B: international","Total"],"rows":[["A: on campus",350,100,450],["~A: off campus",200,350,550],["Total",550,450,1000]]}},{"id":"prob-L12-c03","module":"prob","lecture":"L12","topic":"由三个概率建表","q":"Pr(D) = 0.5, Pr(S) = 0.3, and Pr(D \u0026 S) = 0.1. Complete the contingency table and find Pr(~D \u0026 S), Pr(D \u0026 ~S), Pr(~D \u0026 ~S), and Pr(D | ~S).","steps":[{"label":"求 Pr(~D \u0026 S)","prompt":"Pr(~D \u0026 S) = ?","answer":0.2,"tol":0.001,"hint":"S 行合计减交集：0.3 − 0.1"},{"label":"求 Pr(D \u0026 ~S)","prompt":"Pr(D \u0026 ~S) = ?","answer":0.4,"tol":0.001,"hint":"D 列合计减交集：0.5 − 0.1"},{"label":"求 Pr(~D \u0026 ~S)","prompt":"Pr(~D \u0026 ~S) = ?","answer":0.3,"tol":0.001,"hint":"1 − 0.1 − 0.2 − 0.4"},{"label":"求 Pr(D | ~S)","prompt":"Pr(D | ~S) = ?","answer":0.5714,"tol":0.002,"hint":"Pr(D \u0026 ~S)/Pr(~S) = 0.4/0.7"}],"final":"Pr(D | ~S) = 0.4/0.7 = 4/7 ≈ 0.571","work":"Use a hypothetical population of 100: D = 50, ~D = 50, S = 30, ~S = 70, D\u0026S = 10.\n~D\u0026S = 30 − 10 = 20 → 0.2\nD\u0026~S = 50 − 10 = 40 → 0.4\n~D\u0026~S = 100 − 10 − 20 − 40 = 30 → 0.3\nPr(D | ~S) = 40/70 = 4/7 ≈ 0.571","explain":"建表顺序：先边际 → 填交集 → 行列相减 → 补最后一格。注意 Pr(~D\u0026~S)=0.3 而不是 0.5×0.7=0.35——题目没说独立，不能相乘。","table":{"cols":["D","~D","Total"],"rows":[["S",10,20,30],["~S",40,30,70],["Total",50,50,100]]}},{"id":"prob-L12-c04","module":"prob","lecture":"L12","topic":"喜鹊例题（全概率 + 反推）","q":"30% of residents live on the North Shore (N) and 70% on the South Shore (~N). 10% of North Shore residents get swooped by magpies (S), and 2% of South Shore residents do. Find Pr(N \u0026 S), Pr(~N \u0026 S), Pr(S), and Pr(N | S).","steps":[{"label":"求 Pr(N \u0026 S)","prompt":"Pr(N \u0026 S) = ?","answer":0.03,"tol":0.0005,"hint":"Pr(S|N) × Pr(N) = 0.1 × 0.3"},{"label":"求 Pr(~N \u0026 S)","prompt":"Pr(~N \u0026 S) = ?","answer":0.014,"tol":0.0005,"hint":"0.02 × 0.7"},{"label":"求 Pr(S)","prompt":"Pr(S) = ?","answer":0.044,"tol":0.0005,"hint":"两个互斥分组的交集相加"},{"label":"求 Pr(N | S)","prompt":"Pr(N | S) = ?","answer":0.6818,"tol":0.002,"hint":"被俯冲者中北岸所占比例：0.03/0.044"}],"final":"Pr(S) = 0.044; Pr(N | S) = 0.03/0.044 = 15/22 ≈ 0.682","work":"Pr(N \u0026 S) = Pr(S | N)Pr(N) = 0.1 × 0.3 = 0.03\nPr(~N \u0026 S) = Pr(S | ~N)Pr(~N) = 0.02 × 0.7 = 0.014\nPr(S) = 0.03 + 0.014 = 0.044\nPr(N | S) = Pr(N \u0026 S)/Pr(S) = 0.03/0.044 = 15/22 ≈ 0.682","explain":"课堂原题求到 Pr(S)=4.4%；最后一步 Pr(N|S) 是按同一定义的延伸（其实就是 Bayes）。三种数字三种分母：10% 在北岸中；3% 在全体中（既北岸又被俯冲）；4.4% 是全体被俯冲率。不能把 10% 和 2% 平均成 6%。","table":{"cols":["N: North","~N: South","Total"],"rows":[["S: swooped",3,1.4,4.4],["~S: not swooped",27,68.6,95.6],["Total",30,70,100]]}},{"id":"prob-L12-c05","module":"prob","lecture":"L12","topic":"全概率（变式）","q":"40% of residents live on the North Shore (N). 15% of North Shore residents and 5% of South Shore residents get swooped (S). Find Pr(N \u0026 S), Pr(~N \u0026 S), Pr(S), and Pr(N | S).","steps":[{"label":"求 Pr(N \u0026 S)","prompt":"Pr(N \u0026 S) = ?","answer":0.06,"tol":0.0005,"hint":"0.15 × 0.4"},{"label":"求 Pr(~N \u0026 S)","prompt":"Pr(~N \u0026 S) = ?","answer":0.03,"tol":0.0005,"hint":"0.05 × 0.6"},{"label":"求 Pr(S)","prompt":"Pr(S) = ?","answer":0.09,"tol":0.0005,"hint":"0.06 + 0.03"},{"label":"求 Pr(N | S)","prompt":"Pr(N | S) = ?","answer":0.6667,"tol":0.002,"hint":"0.06/0.09"}],"final":"Pr(S) = 0.09; Pr(N | S) = 2/3 ≈ 0.667","work":"Pr(N \u0026 S) = 0.15 × 0.4 = 0.06\nPr(~N \u0026 S) = 0.05 × 0.6 = 0.03\nPr(S) = 0.06 + 0.03 = 0.09\nPr(N | S) = 0.06/0.09 = 2/3 ≈ 0.667","explain":"练习变式（数字自拟）。简单平均 (15%+5%)/2 = 10% 是错的，因为两组大小不同（40% vs 60%）。","table":{"cols":["N","~N","Total"],"rows":[["S",6,3,9],["~S",34,57,91],["Total",40,60,100]]}},{"id":"prob-L12-c06","module":"prob","lecture":"L12","topic":"独立性检验","q":"Of 200 students, 60 attended the review session and passed (A = passed, B = attended), 40 attended and failed, 20 did not attend and passed, 80 did not attend and failed. Find Pr(A), Pr(A | B), and Pr(A | ~B). Are A and B independent?","steps":[{"label":"求 Pr(A)","prompt":"Pr(A) = ?","answer":0.4,"tol":0.001,"hint":"(60+20)/200"},{"label":"求 Pr(A | B)","prompt":"Pr(A | B) = ?","answer":0.6,"tol":0.001,"hint":"参加者 100 人中及格 60"},{"label":"求 Pr(A | ~B)","prompt":"Pr(A | ~B) = ?","answer":0.2,"tol":0.001,"hint":"未参加者 100 人中及格 20"}],"final":"Pr(A) = 0.4, Pr(A | B) = 0.6, Pr(A | ~B) = 0.2; since Pr(A | B) ≠ Pr(A), A and B are not independent.","work":"Pr(A) = 80/200 = 0.4\nPr(B) = 100/200 = 0.5\nPr(A | B) = 60/100 = 0.6\nPr(A | ~B) = 20/100 = 0.2\nPr(A | B) = 0.6 ≠ 0.4 = Pr(A), so A and B are not independent.","explain":"练习题（自拟数据）。独立的定义是 Pr(A|B) = Pr(A)。也可检查 Pr(A\u0026B)=0.3 是否等于 Pr(A)Pr(B)=0.2——不等。注意不独立只说明相关，不证明参加复习导致及格（课堂提醒：相关不等于因果）。","table":{"cols":["B: attended","~B: did not attend","Total"],"rows":[["A: passed",60,20,80],["~A: failed",40,80,120],["Total",100,100,200]]}},{"id":"prob-L12-c07","module":"prob","lecture":"L12","topic":"季节例题 / 独立性","q":"The four seasons are equally likely birth seasons. Let A = born in winter, spring or summer, and B = born in summer or autumn. Find Pr(A \u0026 B), Pr(A | B), and Pr(A). Are A and B independent?","steps":[{"label":"求 Pr(A \u0026 B)","prompt":"Pr(A \u0026 B) = ?","answer":0.25,"tol":0.001,"hint":"A 与 B 同时成立的季节只有夏季"},{"label":"求 Pr(A | B)","prompt":"Pr(A | B) = ?","answer":0.5,"tol":0.001,"hint":"(1/4)/(1/2)"},{"label":"求 Pr(A)","prompt":"Pr(A) = ?","answer":0.75,"tol":0.001,"hint":"冬、春、夏三季"}],"final":"Pr(A | B) = 1/2 ≠ Pr(A) = 3/4, so A and B are not independent (and not mutually exclusive).","work":"A \u0026 B = summer only, so Pr(A \u0026 B) = 1/4\nPr(B) = 2/4 = 1/2\nPr(A | B) = (1/4)/(1/2) = 1/2\nPr(A) = 3/4\n1/2 ≠ 3/4, so A and B are not independent.","explain":"课堂原例 A=春或夏时 Pr(A|B)=1/2=Pr(A)，独立；本变式把 A 扩成三季后不再独立。分子必须用 AND（交集），教授曾把交集误写成「春或夏或秋」得 1.5，概率大于 1 就是出错信号。","table":{"cols":["Pr","A","B","A \u0026 B"],"rows":[["Spring",0.25,"T","F","F"],["Summer",0.25,"T","T","T"],["Autumn",0.25,"F","T","F"],["Winter",0.25,"T","F","F"]]}},{"id":"prob-L12-c08","module":"prob","lecture":"L12","topic":"已知独立时建表","q":"Pr(A) = 0.4 and Pr(B) = 0.5, and you are TOLD that A and B are independent. Find Pr(A \u0026 B), Pr(A \u0026 ~B), Pr(~A \u0026 ~B), and Pr(A | B).","steps":[{"label":"求 Pr(A \u0026 B)","prompt":"Pr(A \u0026 B) = ?","answer":0.2,"tol":0.001,"hint":"独立时 Pr(A\u0026B) = Pr(A)Pr(B)"},{"label":"求 Pr(A \u0026 ~B)","prompt":"Pr(A \u0026 ~B) = ?","answer":0.2,"tol":0.001,"hint":"0.4 − 0.2"},{"label":"求 Pr(~A \u0026 ~B)","prompt":"Pr(~A \u0026 ~B) = ?","answer":0.3,"tol":0.001,"hint":"Pr(~B) − Pr(A\u0026~B) = 0.5 − 0.2"},{"label":"求 Pr(A | B)","prompt":"Pr(A | B) = ?","answer":0.4,"tol":0.001,"hint":"0.2/0.5，应等于 Pr(A)"}],"final":"Pr(A \u0026 B) = 0.2, Pr(A \u0026 ~B) = 0.2, Pr(~A \u0026 ~B) = 0.3, Pr(A | B) = 0.4 = Pr(A)","work":"Independence: Pr(A \u0026 B) = Pr(A)Pr(B) = 0.4 × 0.5 = 0.2\nPr(A \u0026 ~B) = 0.4 − 0.2 = 0.2\nPr(~A \u0026 B) = 0.5 − 0.2 = 0.3\nPr(~A \u0026 ~B) = 1 − 0.2 − 0.2 − 0.3 = 0.3\nPr(A | B) = 0.2/0.5 = 0.4 = Pr(A) ✓","explain":"练习题。只有题目明确给出独立时才能用乘法 Pr(A)Pr(B)；L12 反复提醒信息不足时不能默认独立（对照 c03）。最后一步验证 Pr(A|B)=Pr(A)。","table":{"cols":["B","~B","Total"],"rows":[["A",20,20,40],["~A",30,30,60],["Total",50,50,100]]}},{"id":"prob-L11-c09","module":"prob","lecture":"L11","topic":"罕见事件的条件概率","q":"In 1,000 message records, word A appears in 10 records, word B appears in 10 records, and 8 records contain both. Find Pr(A), Pr(A \u0026 B), and Pr(A | B).","steps":[{"label":"求 Pr(A)","prompt":"Pr(A) = ?","answer":0.01,"tol":0.0005,"hint":"10/1000"},{"label":"求 Pr(A \u0026 B)","prompt":"Pr(A \u0026 B) = ?","answer":0.008,"tol":0.0005,"hint":"8/1000"},{"label":"求 Pr(A | B)","prompt":"Pr(A | B) = ?","answer":0.8,"tol":0.001,"hint":"Pr(A\u0026B)/Pr(B) = 0.008/0.01"}],"final":"Pr(A | B) = 8/10 = 0.8, although Pr(A) = Pr(B) = 0.01","work":"Pr(A) = 10/1000 = 0.01; Pr(B) = 10/1000 = 0.01\nPr(A \u0026 B) = 8/1000 = 0.008\nPr(A | B) = 0.008/0.01 = 0.8","explain":"L11 的要点：A、B 各自很罕见，但给定 B 后 A 非常常见。这正是自动补全/Markov 生成器的思路——关心的是给定前文时下一个词的条件概率，而不是词的总体频率。","table":{"cols":["B","~B","Total"],"rows":[["A",8,2,10],["~A",2,988,990],["Total",10,990,1000]]}},{"id":"prob-L16-c10","module":"prob","lecture":"L16","topic":"Bayes：疲倦与烦躁","q":"You are tired (T) 40% of the time. When tired, you are irritable (I) 80% of the time; when not tired, you are irritable 10% of the time. Find Pr(T \u0026 I), Pr(¬T \u0026 I), Pr(I), and Pr(T | I).","steps":[{"label":"求 Pr(T \u0026 I)","prompt":"Pr(T \u0026 I) = ?","answer":0.32,"tol":0.001,"hint":"Pr(I|T)Pr(T) = 0.8 × 0.4"},{"label":"求 Pr(¬T \u0026 I)","prompt":"Pr(¬T \u0026 I) = ?","answer":0.06,"tol":0.001,"hint":"Pr(I|¬T)Pr(¬T) = 0.1 × 0.6"},{"label":"求 Pr(I)","prompt":"Pr(I) = ?","answer":0.38,"tol":0.001,"hint":"两个来源相加"},{"label":"求 Pr(T | I)","prompt":"Pr(T | I) = ?","answer":0.8421,"tol":0.002,"hint":"0.32/0.38"}],"final":"Pr(T | I) = 0.32/0.38 = 16/19 ≈ 0.842","work":"Pr(T) = 0.4, Pr(¬T) = 0.6, Pr(I | T) = 0.8, Pr(I | ¬T) = 0.1\nPr(T \u0026 I) = 0.8 × 0.4 = 0.32\nPr(¬T \u0026 I) = 0.1 × 0.6 = 0.06\nPr(I) = 0.32 + 0.06 = 0.38\nPr(T | I) = Pr(I | T)Pr(T)/Pr(I) = 0.32/0.38 = 16/19 ≈ 0.842","explain":"人数表：100 个时刻，40 疲倦（32 烦躁）、60 不疲倦（6 烦躁）。后验只在 38 个烦躁时刻里数。易错：32% 是交集 Pr(T\u0026I)，不是 Pr(T|I)；80% 是 Pr(I|T)。","table":{"cols":["I: irritable","¬I","Total"],"rows":[["T: tired",32,8,40],["¬T",6,54,60],["Total",38,62,100]]}},{"id":"prob-L16-c11","module":"prob","lecture":"L16","topic":"Bayes：吸血鬼（否定证据）","q":"1% of people are vampires (V). 99% of vampires burn in sunlight (I); humans never burn. A randomly met person does NOT burn in sunlight. Find Pr(V \u0026 ¬I), Pr(¬V \u0026 ¬I), Pr(¬I), and Pr(V | ¬I).","steps":[{"label":"求 Pr(V \u0026 ¬I)","prompt":"Pr(V \u0026 ¬I) = ?","answer":0.0001,"tol":0.00001,"hint":"Pr(¬I|V) = 1 − 0.99 = 0.01；乘以 0.01"},{"label":"求 Pr(¬V \u0026 ¬I)","prompt":"Pr(¬V \u0026 ¬I) = ?","answer":0.99,"tol":0.0005,"hint":"人类不烧毁的概率为 1，乘以 0.99"},{"label":"求 Pr(¬I)","prompt":"Pr(¬I) = ?","answer":0.9901,"tol":0.00005,"hint":"0.0001 + 0.99"},{"label":"求 Pr(V | ¬I)","prompt":"Pr(V | ¬I) = ?","answer":0.000101,"tol":0.000002,"hint":"0.0001/0.9901 = 1/9901"}],"final":"Pr(V | ¬I) = 0.0001/0.9901 = 1/9901 ≈ 0.000101","work":"Pr(V) = 0.01, Pr(I | V) = 0.99 so Pr(¬I | V) = 0.01; Pr(I | ¬V) = 0 so Pr(¬I | ¬V) = 1\nPr(V \u0026 ¬I) = 0.01 × 0.01 = 0.0001\nPr(¬V \u0026 ¬I) = 0.99 × 1 = 0.99\nPr(¬I) = 0.0001 + 0.99 = 0.9901\nPr(V | ¬I) = 0.0001/0.9901 = 1/9901 ≈ 0.000101","explain":"关键是否定号：证据是 ¬I，要用 Pr(¬I|V)=0.01 和 Pr(¬I|¬V)=1，不能代入 0.99。1 万人：100 吸血鬼中 1 个不烧毁 + 9900 人类，答案 1/9901。「1% 的吸血鬼不烧毁」≠「不烧毁者中 1% 是吸血鬼」。","table":{"cols":["I: burns","¬I: does not burn","Total"],"rows":[["V: vampire",99,1,100],["¬V: human",0,9900,9900],["Total",99,9901,10000]]}},{"id":"prob-L16-c12","module":"prob","lecture":"L16","topic":"Bayes：药丸检测（阳性）","q":"75% of pills contain MDMA (M). A test is positive (P) for 50% of pills with MDMA and for 40% of pills without MDMA. A pill tests positive. Find Pr(M \u0026 P), Pr(¬M \u0026 P), Pr(P), and Pr(M | P).","steps":[{"label":"求 Pr(M \u0026 P)","prompt":"Pr(M \u0026 P) = ?","answer":0.375,"tol":0.001,"hint":"0.5 × 0.75"},{"label":"求 Pr(¬M \u0026 P)","prompt":"Pr(¬M \u0026 P) = ?","answer":0.1,"tol":0.001,"hint":"0.4 × 0.25"},{"label":"求 Pr(P)","prompt":"Pr(P) = ?","answer":0.475,"tol":0.001,"hint":"两者相加"},{"label":"求 Pr(M | P)","prompt":"Pr(M | P) = ?","answer":0.7895,"tol":0.002,"hint":"0.375/0.475 = 15/19"}],"final":"Pr(M | P) = 0.375/0.475 = 15/19 ≈ 0.789","work":"Pr(M) = 0.75, Pr(P | M) = 0.5, Pr(P | ¬M) = 0.4\nPr(M \u0026 P) = 0.5 × 0.75 = 0.375\nPr(¬M \u0026 P) = 0.4 × 0.25 = 0.1\nPr(P) = 0.375 + 0.1 = 0.475\nPr(M | P) = 0.375/0.475 = 15/19 ≈ 0.789","explain":"1000 片：真药阳性 375、假药阳性 100。检测前 75%，阳性后只升到 78.9%——弱证据，因为假阳性率 40% 与真阳性率 50% 相差不大。","table":{"cols":["P: positive","¬P: negative","Total"],"rows":[["M",375,375,750],["¬M",100,150,250],["Total",475,525,1000]]}},{"id":"prob-L16-c13","module":"prob","lecture":"L16","topic":"Bayes：药丸检测（阴性）","q":"Same setting: 75% of pills contain MDMA (M); Pr(P | M) = 0.5 and Pr(P | ¬M) = 0.4. A pill tests NEGATIVE. Find Pr(M \u0026 ¬P), Pr(¬M \u0026 ¬P), Pr(¬P), and Pr(¬M | ¬P).","steps":[{"label":"求 Pr(M \u0026 ¬P)","prompt":"Pr(M \u0026 ¬P) = ?","answer":0.375,"tol":0.001,"hint":"Pr(¬P|M) = 1 − 0.5；乘以 0.75"},{"label":"求 Pr(¬M \u0026 ¬P)","prompt":"Pr(¬M \u0026 ¬P) = ?","answer":0.15,"tol":0.001,"hint":"Pr(¬P|¬M) = 1 − 0.4 = 0.6；乘以 0.25"},{"label":"求 Pr(¬P)","prompt":"Pr(¬P) = ?","answer":0.525,"tol":0.001,"hint":"0.375 + 0.15"},{"label":"求 Pr(¬M | ¬P)","prompt":"Pr(¬M | ¬P) = ?","answer":0.2857,"tol":0.002,"hint":"0.15/0.525 = 2/7"}],"final":"Pr(¬M | ¬P) = 0.15/0.525 = 2/7 ≈ 0.286","work":"Pr(¬P | M) = 1 − 0.5 = 0.5; Pr(¬P | ¬M) = 1 − 0.4 = 0.6\nPr(M \u0026 ¬P) = 0.5 × 0.75 = 0.375\nPr(¬M \u0026 ¬P) = 0.6 × 0.25 = 0.15\nPr(¬P) = 0.375 + 0.15 = 0.525\nPr(¬M | ¬P) = 0.15/0.525 = 2/7 ≈ 0.286","explain":"补集规则只能在同一条件下用：Pr(¬P|¬M) = 1 − Pr(P|¬M) = 0.6，而不是 1 − Pr(P|M)。阴性后不含 MDMA 的概率从 25% 升到 28.6%，仍然是弱证据。","table":{"cols":["P","¬P","Total"],"rows":[["M",375,375,750],["¬M",100,150,250],["Total",475,525,1000]]}},{"id":"prob-L16-c14","module":"prob","lecture":"L16","topic":"Bayes：新试剂","q":"75% of pills contain MDMA. A new test has a true positive rate Pr(P | M) = 0.9 and a false positive rate Pr(P | ¬M) = 0.05. A pill tests positive. Find Pr(M \u0026 P), Pr(¬M \u0026 P), Pr(P), and Pr(M | P).","steps":[{"label":"求 Pr(M \u0026 P)","prompt":"Pr(M \u0026 P) = ?","answer":0.675,"tol":0.001,"hint":"0.9 × 0.75"},{"label":"求 Pr(¬M \u0026 P)","prompt":"Pr(¬M \u0026 P) = ?","answer":0.0125,"tol":0.0005,"hint":"0.05 × 0.25"},{"label":"求 Pr(P)","prompt":"Pr(P) = ?","answer":0.6875,"tol":0.0005,"hint":"两者相加"},{"label":"求 Pr(M | P)","prompt":"Pr(M | P) = ?","answer":0.9818,"tol":0.002,"hint":"0.675/0.6875 = 54/55"}],"final":"Pr(M | P) = 0.675/0.6875 = 54/55 ≈ 0.982","work":"Pr(M \u0026 P) = 0.9 × 0.75 = 0.675\nPr(¬M \u0026 P) = 0.05 × 0.25 = 0.0125\nPr(P) = 0.675 + 0.0125 = 0.6875\nPr(M | P) = 0.675/0.6875 = 54/55 ≈ 0.982","explain":"假阳性率从 40% 降到 5%，阳性证据变得很强：后验从 78.9% 升到 98.2%。证据强弱取决于 Pr(P|M) 与 Pr(P|¬M) 的差距。","table":{"cols":["P","¬P","Total"],"rows":[["M",675,75,750],["¬M",12.5,237.5,250],["Total",687.5,312.5,1000]]}},{"id":"prob-L16-c15","module":"prob","lecture":"L16","topic":"Bayes：base rate 敏感性","q":"Only 10% of pills contain MDMA. The old test has Pr(P | M) = 0.5 and Pr(P | ¬M) = 0.4. A pill tests positive. Find Pr(M \u0026 P), Pr(¬M \u0026 P), Pr(P), and Pr(M | P).","steps":[{"label":"求 Pr(M \u0026 P)","prompt":"Pr(M \u0026 P) = ?","answer":0.05,"tol":0.0005,"hint":"0.5 × 0.1"},{"label":"求 Pr(¬M \u0026 P)","prompt":"Pr(¬M \u0026 P) = ?","answer":0.36,"tol":0.001,"hint":"0.4 × 0.9"},{"label":"求 Pr(P)","prompt":"Pr(P) = ?","answer":0.41,"tol":0.001,"hint":"0.05 + 0.36"},{"label":"求 Pr(M | P)","prompt":"Pr(M | P) = ?","answer":0.122,"tol":0.002,"hint":"0.05/0.41 = 5/41"}],"final":"Pr(M | P) = 0.05/0.41 = 5/41 ≈ 0.122","work":"Pr(M \u0026 P) = 0.5 × 0.1 = 0.05\nPr(¬M \u0026 P) = 0.4 × 0.9 = 0.36\nPr(P) = 0.05 + 0.36 = 0.41\nPr(M | P) = 0.05/0.41 = 5/41 ≈ 0.122","explain":"试剂不变，只把 base rate 从 75% 改成 10%，阳性后的概率就从 78.9% 跌到 12.2%。阳性药丸中绝大多数（36/41）其实是假药——base rate 不能忽略。","table":{"cols":["P","¬P","Total"],"rows":[["M",50,50,100],["¬M",360,540,900],["Total",410,590,1000]]}},{"id":"prob-L16-c16","module":"prob","lecture":"L16","topic":"Bayes：base rate 谬误（医学检测）","q":"A disease (D) affects 1% of a population. A test is positive for 90% of people with the disease and for 9% of people without it. A randomly selected person tests positive. Using a population of 10,000, find the number with D and positive, the number without D and positive, the total positives, and Pr(D | +).","steps":[{"label":"D 且阳性人数","prompt":"Number with D and + = ?","answer":90,"tol":0.5,"hint":"10,000 × 1% = 100 人患病，其中 90% 阳性"},{"label":"无 D 但阳性人数","prompt":"Number without D and + = ?","answer":891,"tol":0.5,"hint":"9,900 × 9%"},{"label":"阳性总人数","prompt":"Total + = ?","answer":981,"tol":0.5,"hint":"90 + 891"},{"label":"求 Pr(D | +)","prompt":"Pr(D | +) = ?","answer":0.0917,"tol":0.002,"hint":"90/981"}],"final":"Pr(D | +) = 90/981 ≈ 0.092","work":"Imagine 10,000 people: 100 have D, 9,900 do not.\nD \u0026 +: 100 × 0.9 = 90\n¬D \u0026 +: 9,900 × 0.09 = 891\nTotal positives: 90 + 891 = 981\nPr(D | +) = 90/981 ≈ 0.092","explain":"练习题（数字自拟，方法同 L16 人数表）。虽然 Pr(+|D) = 90%，但 Pr(D|+) 只有约 9.2%：因为病很罕见，健康人基数大，假阳性人数（891）远超真阳性（90）。混淆 Pr(E|H) 与 Pr(H|E) 就会以为答案是 90%。","table":{"cols":["+","−","Total"],"rows":[["D",90,10,100],["¬D",891,9009,9900],["Total",981,9019,10000]]}},{"id":"prob-L16-c17","module":"prob","lecture":"L16","topic":"Bayes：罐子两黑","q":"A fair coin is tossed: heads → urn X (3 black, 1 white); tails → urn Y (1 black, 3 white). Two balls are drawn from the chosen urn with replacement; both are black (BB). Find Pr(BB | X), Pr(BB | Y), Pr(BB), and Pr(X | BB).","steps":[{"label":"求 Pr(BB | X)","prompt":"Pr(BB | X) = ?","answer":0.5625,"tol":0.001,"hint":"放回抽取，已知罐子时独立：(3/4)²"},{"label":"求 Pr(BB | Y)","prompt":"Pr(BB | Y) = ?","answer":0.0625,"tol":0.001,"hint":"(1/4)²"},{"label":"求 Pr(BB)","prompt":"Pr(BB) = ?","answer":0.3125,"tol":0.001,"hint":"0.5 × 9/16 + 0.5 × 1/16"},{"label":"求 Pr(X | BB)","prompt":"Pr(X | BB) = ?","answer":0.9,"tol":0.002,"hint":"0.28125/0.3125"}],"final":"Pr(X | BB) = 9/10 = 0.9","work":"Pr(BB | X) = (3/4)(3/4) = 9/16 = 0.5625\nPr(BB | Y) = (1/4)(1/4) = 1/16 = 0.0625\nPr(BB) = 0.5 × 9/16 + 0.5 × 1/16 = 10/32 = 0.3125\nPr(X | BB) = (0.5 × 9/16)/0.3125 = 0.28125/0.3125 = 9/10","explain":"已知罐子时放回抽取才独立可相乘；不知道罐子时不能用总体 1/2 × 1/2。两罐先验相等，后验比 = 似然比 9:1，所以 9/10。","table":{"cols":["BB","not BB","Total"],"rows":[["X (heads)",9,7,16],["Y (tails)",1,15,16],["Total",10,22,32]]}},{"id":"prob-L16-c18","module":"prob","lecture":"L16","topic":"Bayes：罐子先黑后白","q":"Same urns (X: 3 black, 1 white chosen on heads; Y: 1 black, 3 white chosen on tails; fair coin). With replacement you draw black then white (BW). Find Pr(BW | X), Pr(BW | Y), and Pr(X | BW).","steps":[{"label":"求 Pr(BW | X)","prompt":"Pr(BW | X) = ?","answer":0.1875,"tol":0.001,"hint":"3/4 × 1/4"},{"label":"求 Pr(BW | Y)","prompt":"Pr(BW | Y) = ?","answer":0.1875,"tol":0.001,"hint":"1/4 × 3/4"},{"label":"求 Pr(X | BW)","prompt":"Pr(X | BW) = ?","answer":0.5,"tol":0.001,"hint":"两罐似然相等"}],"final":"Pr(X | BW) = 1/2: the evidence does not discriminate between the urns.","work":"Pr(BW | X) = 3/4 × 1/4 = 3/16\nPr(BW | Y) = 1/4 × 3/4 = 3/16\nPr(X | BW) = (0.5 × 3/16)/(0.5 × 3/16 + 0.5 × 3/16) = 1/2","explain":"证据在两种假设下一样容易出现 → 后验 = 先验。不限定顺序的一黑一白（各 6/16）也一样。","table":null},{"id":"prob-L16-c19","module":"prob","lecture":"L16","topic":"Bayes：罐子三黑（延伸）","q":"Same urns and fair coin (X: 3 black, 1 white; Y: 1 black, 3 white). Three balls are drawn with replacement and all three are black (BBB). Find Pr(BBB | X), Pr(BBB | Y), and Pr(X | BBB).","steps":[{"label":"求 Pr(BBB | X)","prompt":"Pr(BBB | X) = ?","answer":0.4219,"tol":0.001,"hint":"(3/4)³ = 27/64"},{"label":"求 Pr(BBB | Y)","prompt":"Pr(BBB | Y) = ?","answer":0.0156,"tol":0.0005,"hint":"(1/4)³ = 1/64"},{"label":"求 Pr(X | BBB)","prompt":"Pr(X | BBB) = ?","answer":0.9643,"tol":0.002,"hint":"27/(27+1)"}],"final":"Pr(X | BBB) = 27/28 ≈ 0.964","work":"Pr(BBB | X) = (3/4)^3 = 27/64 ≈ 0.422\nPr(BBB | Y) = (1/4)^3 = 1/64 ≈ 0.0156\nPr(X | BBB) = (0.5 × 27/64)/(0.5 × 27/64 + 0.5 × 1/64) = 27/28 ≈ 0.964","explain":"练习延伸：每多一个黑球，似然比再乘 3（1 黑 3:1 → 3/4；2 黑 9:1 → 9/10；3 黑 27:1 → 27/28）。证据累积使后验越来越接近 1。","table":null},{"id":"prob-L18-c20","module":"prob","lecture":"L18","topic":"期望值：创业题（投 100 万）","q":"Corrected startup model. Pr(good idea) = 2/5 and Pr(charismatic founder) = 1/5; the table gives three outcomes: good idea + charismatic founder (2/25), good idea + dull founder (8/25), bad idea (15/25). You invest $1 million. You get $4M back in the first outcome and $0 back otherwise. Find the probabilities of the three outcomes and the expected NET value (in $ millions).","steps":[{"label":"好主意+有魅力的概率","prompt":"Pr(good \u0026 charismatic) = ?","answer":0.08,"tol":0.001,"hint":"2/25"},{"label":"好主意+乏味的概率","prompt":"Pr(good \u0026 dull) = ?","answer":0.32,"tol":0.001,"hint":"8/25"},{"label":"最好情形的净结果","prompt":"Net outcome in the best case ($M) = ?","answer":3,"tol":0.001,"hint":"回款 4 − 投入 1"},{"label":"期望净值","prompt":"Expected net value ($M) = ?","answer":-0.68,"tol":0.005,"hint":"2/25×3 + 8/25×(−1) + 15/25×(−1)"}],"final":"EV(net) = 2/25 × 3 + 8/25 × (−1) + 15/25 × (−1) = −17/25 = −$0.68 million","work":"Outcomes (net = payout − 1):\nGood \u0026 charismatic: 2/25, net +3\nGood \u0026 dull: 8/25, net −1\nBad idea: 15/25, net −1\nCheck: 2/25 + 8/25 + 15/25 = 1\nEV = (2/25)(3) + (8/25)(−1) + (15/25)(−1) = (6 − 8 − 15)/25 = −17/25 = −0.68\nExpected net loss of $0.68 million.","explain":"以教授课堂纠正版为准：旧答案漏扣了初始投资（若只算回款会得 2/25×4 = +0.32）。先问：这是回款还是净结果？成本只扣一次。","table":{"cols":["Probability","Payout ($M)","Net ($M)"],"rows":[["Good + charismatic",0.08,4,3],["Good + dull",0.32,0,-1],["Bad idea",0.6,0,-1]]}},{"id":"prob-L18-c21","module":"prob","lecture":"L18","topic":"期望值：创业题（投 500 万）","q":"Same corrected startup model, but you invest $5 million. Payouts: good idea + charismatic founder (2/25) returns $20M; good idea + dull founder (8/25) returns $4M (a fixed $1M loss); bad idea (15/25) returns $0. Find the expected gross payout, then the net outcome in each case, and the expected NET value (in $ millions).","steps":[{"label":"期望回款","prompt":"Expected gross payout ($M) = ?","answer":2.88,"tol":0.005,"hint":"2/25×20 + 8/25×4 + 15/25×0"},{"label":"最好情形净结果","prompt":"Net in best case ($M) = ?","answer":15,"tol":0.001,"hint":"20 − 5"},{"label":"坏主意净结果","prompt":"Net if bad idea ($M) = ?","answer":-5,"tol":0.001,"hint":"0 − 5"},{"label":"期望净值","prompt":"Expected net value ($M) = ?","answer":-2.12,"tol":0.005,"hint":"2/25×15 + 8/25×(−1) + 15/25×(−5)，或 2.88 − 5"}],"final":"EV(net) = 2/25 × 15 + 8/25 × (−1) + 15/25 × (−5) = −53/25 = −$2.12 million","work":"Expected payout = (2/25)(20) + (8/25)(4) + (15/25)(0) = 1.6 + 1.28 = 2.88\nNet outcomes: +15, −1, −5\nEV(net) = (2/25)(15) + (8/25)(−1) + (15/25)(−5) = (30 − 8 − 75)/25 = −2.12\nCheck: 2.88 − 5 = −2.12 ✓","explain":"两种扣成本法结果一致：逐项扣 或 最后统一扣一次（2.88 − 5）。投入变大，最坏情形损失也变大，平均亏损从 0.68 增至 2.12——押更多钱不会让坏投资变好。","table":{"cols":["Probability","Payout ($M)","Net ($M)"],"rows":[["Good + charismatic",0.08,20,15],["Good + dull",0.32,4,-1],["Bad idea",0.6,0,-5]]}},{"id":"prob-L18-c22","module":"prob","lecture":"L18","topic":"公平价格：投币","q":"A fair coin game pays $10 on heads and $0 on tails. Find the expected payout, the fair price, and the expected net gain if the ticket costs $6.","steps":[{"label":"期望回款","prompt":"Expected payout ($) = ?","answer":5,"tol":0.001,"hint":"1/2×10 + 1/2×0"},{"label":"公平价格","prompt":"Fair price ($) = ?","answer":5,"tol":0.001,"hint":"使期望净收益为 0 的价格"},{"label":"票价 $6 时期望净收益","prompt":"Expected net gain at $6 ($) = ?","answer":-1,"tol":0.001,"hint":"5 − 6，或 1/2×4 + 1/2×(−6)"}],"final":"Fair price = $5; at $6 the expected net gain is −$1 (a $1 house edge).","work":"EV(payout) = (1/2)(10) + (1/2)(0) = 5\nFair price = 5, since (1/2)(10 − 5) + (1/2)(0 − 5) = 0\nAt price 6: (1/2)(10 − 6) + (1/2)(0 − 6) = 2 − 3 = −1","explain":"公平价格 = 期望回款。高于公平价格的部分就是庄家优势。公平也不代表单次不亏：付 $5 后单次是 +5 或 −5。","table":{"cols":["Probability","Payout ($)","Net at $6 ($)"],"rows":[["Heads",0.5,10,4],["Tails",0.5,0,-6]]}},{"id":"prob-L18-c23","module":"prob","lecture":"L18","topic":"公平价格：掷骰","q":"Roll a fair six-sided die. You win $12 if it shows 6, $3 if it shows 4 or 5, and nothing otherwise. Find Pr(win $3), the expected payout, the fair price, and the expected net gain if a ticket costs $4.","steps":[{"label":"赢 $3 的概率","prompt":"Pr(4 or 5) = ?","answer":0.3333,"tol":0.002,"hint":"2/6"},{"label":"期望回款","prompt":"Expected payout ($) = ?","answer":3,"tol":0.005,"hint":"1/6×12 + 2/6×3 + 3/6×0"},{"label":"公平价格","prompt":"Fair price ($) = ?","answer":3,"tol":0.005,"hint":"= 期望回款"},{"label":"票价 $4 时期望净收益","prompt":"Expected net gain at $4 ($) = ?","answer":-1,"tol":0.005,"hint":"3 − 4（成本只扣一次）"}],"final":"Expected payout = fair price = $3; at $4 the expected net gain is −$1.","work":"Pr(6) = 1/6, Pr(4 or 5) = 2/6, Pr(1, 2 or 3) = 3/6\nEV(payout) = (1/6)(12) + (2/6)(3) + (3/6)(0) = 2 + 1 = 3\nFair price = $3\nAt $4: EV(net) = 3 − 4 = −1\n(Equivalently (1/6)(8) + (2/6)(−1) + (3/6)(−4) = (8 − 2 − 12)/6 = −1)","explain":"练习题（自拟）。逐项扣成本和最后统一扣一次结果相同，但只能选一种。","table":{"cols":["Probability","Payout ($)","Net at $4 ($)"],"rows":[["6",0.1667,12,8],["4 or 5",0.3333,3,-1],["1, 2 or 3",0.5,0,-4]]}},{"id":"prob-L18-c24","module":"prob","lecture":"L18","topic":"期望值：彩票","q":"A $2 lottery ticket wins $500 with probability 1/1000 and $20 with probability 1/100; otherwise it wins nothing. Find the expected payout, the fair price, and the expected net gain per ticket.","steps":[{"label":"期望回款","prompt":"Expected payout ($) = ?","answer":0.7,"tol":0.001,"hint":"500/1000 + 20/100"},{"label":"公平价格","prompt":"Fair price ($) = ?","answer":0.7,"tol":0.001,"hint":"= 期望回款"},{"label":"期望净收益","prompt":"Expected net gain ($) = ?","answer":-1.3,"tol":0.001,"hint":"0.7 − 2"}],"final":"Expected payout = $0.70 = fair price; expected net gain = −$1.30 per ticket.","work":"EV(payout) = (1/1000)(500) + (1/100)(20) + (989/1000)(0) = 0.5 + 0.2 = 0.7\nFair price = $0.70\nEV(net) = 0.7 − 2 = −1.30","explain":"练习题（自拟）。$500 的大奖不改变平均亏损：票价比公平价格高 $1.30。","table":{"cols":["Probability","Payout ($)","Net ($)"],"rows":[["Win $500",0.001,500,498],["Win $20",0.01,20,18],["Lose",0.989,0,-2]]}},{"id":"prob-L18-c25","module":"prob","lecture":"L18","topic":"Martingale 加倍下注","q":"On an even-money bet on a fair coin (lose the stake on tails, win the stake on heads), you follow the Martingale strategy starting at $1. You lose six times in a row (stakes 1, 2, 4, 8, 16, 32). Find your total loss so far, the next required stake, your overall net gain if the 7th bet wins, and the probability of losing six fair flips in a row.","steps":[{"label":"已亏总额","prompt":"Total lost after 6 losses ($) = ?","answer":63,"tol":0.001,"hint":"1+2+4+8+16+32"},{"label":"下一注","prompt":"Next stake ($) = ?","answer":64,"tol":0.001,"hint":"上一注 32 翻倍"},{"label":"第 7 注赢后的净结果","prompt":"Overall net gain if 7th bet wins ($) = ?","answer":1,"tol":0.001,"hint":"64 − 63"},{"label":"连输 6 次的概率","prompt":"Pr(6 losses in a row) = ?","answer":0.015625,"tol":0.0005,"hint":"(1/2)^6"}],"final":"Lost $63, next stake $64, net +$1 if it wins; Pr(six losses in a row) = 1/64 ≈ 0.0156.","work":"Total lost = 1 + 2 + 4 + 8 + 16 + 32 = 63 (= 2^6 − 1)\nNext stake = 2 × 32 = 64\nIf the 7th bet wins: +64 − 63 = +1\nPr(6 tails in a row) = (1/2)^6 = 1/64 ≈ 0.0156","explain":"连输虽罕见（1/64），但并非不可能；一旦发生，下注额指数增长，有限资金和下注上限使策略无法保证最终赚 $1。连输后下一次输赢仍是 1/2（赌徒谬误）。","table":null},{"id":"prob-L18-c26","module":"prob","lecture":"L18","topic":"不确定硬币：看到正面","q":"You are equally likely to have picked coin A or coin B. A lands heads (H) with probability 0.75; B with probability 0.15. You flip once and see heads. Find Pr(A \u0026 H), Pr(B \u0026 H), Pr(H), and Pr(A | H).","steps":[{"label":"求 Pr(A \u0026 H)","prompt":"Pr(A \u0026 H) = ?","answer":0.375,"tol":0.001,"hint":"0.5 × 0.75"},{"label":"求 Pr(B \u0026 H)","prompt":"Pr(B \u0026 H) = ?","answer":0.075,"tol":0.001,"hint":"0.5 × 0.15"},{"label":"求 Pr(H)","prompt":"Pr(H) = ?","answer":0.45,"tol":0.001,"hint":"两条路径相加"},{"label":"求 Pr(A | H)","prompt":"Pr(A | H) = ?","answer":0.8333,"tol":0.002,"hint":"0.375/0.45 = 5/6"}],"final":"Pr(H) = 0.45; Pr(A | H) = 0.375/0.45 = 5/6 ≈ 0.833","work":"Pr(A \u0026 H) = 0.5 × 0.75 = 0.375\nPr(B \u0026 H) = 0.5 × 0.15 = 0.075\nPr(H) = 0.375 + 0.075 = 0.45\nPr(A | H) = 0.375/0.45 = 5/6 ≈ 0.833","explain":"概率树：先分硬币（×），再分正反面，同一结果的不同路径相加（+），最后在所有正面中筛出 A（÷）。注意 75%、15% 是百分比；Pr(A|H)=5/6 与 Pr(H|A)=0.75 方向不同。笔记注明录音在此处截断，5/6 是按课堂数据推算。","table":{"cols":["H: heads","T: tails","Total"],"rows":[["Coin A",37.5,12.5,50],["Coin B",7.5,42.5,50],["Total",45,55,100]]}},{"id":"prob-L18-c27","module":"prob","lecture":"L18","topic":"不确定硬币：看到反面","q":"Same two coins (A: heads 0.75; B: heads 0.15; each picked with probability 0.5). You flip once and see TAILS. Find Pr(A \u0026 T), Pr(B \u0026 T), Pr(T), and Pr(A | T).","steps":[{"label":"求 Pr(A \u0026 T)","prompt":"Pr(A \u0026 T) = ?","answer":0.125,"tol":0.001,"hint":"0.5 × (1 − 0.75)"},{"label":"求 Pr(B \u0026 T)","prompt":"Pr(B \u0026 T) = ?","answer":0.425,"tol":0.001,"hint":"0.5 × (1 − 0.15)"},{"label":"求 Pr(T)","prompt":"Pr(T) = ?","answer":0.55,"tol":0.001,"hint":"0.125 + 0.425，或 1 − 0.45"},{"label":"求 Pr(A | T)","prompt":"Pr(A | T) = ?","answer":0.2273,"tol":0.002,"hint":"0.125/0.55 = 5/22"}],"final":"Pr(A | T) = 0.125/0.55 = 5/22 ≈ 0.227","work":"Pr(T | A) = 0.25, Pr(T | B) = 0.85\nPr(A \u0026 T) = 0.5 × 0.25 = 0.125\nPr(B \u0026 T) = 0.5 × 0.85 = 0.425\nPr(T) = 0.125 + 0.425 = 0.55\nPr(A | T) = 0.125/0.55 = 5/22 ≈ 0.227","explain":"练习延伸。看到反面则 B 更可信，A 的概率从 1/2 降到约 22.7%。补集规则在同一硬币条件下用：Pr(T|A) = 1 − 0.75。","table":{"cols":["H","T","Total"],"rows":[["Coin A",37.5,12.5,50],["Coin B",7.5,42.5,50],["Total",45,55,100]]}},{"id":"prob-L18-c28","module":"prob","lecture":"L18","topic":"不确定硬币 + 公平价格","q":"Same two coins (A: heads 0.75; B: heads 0.15; each picked with probability 0.5). A bet pays $1 if the flip lands heads, $0 otherwise. (a) What is the fair price before any flip? (b) You flip once and see heads. Using Pr(A | H) = 5/6, what is the probability the next flip of the same coin lands heads, and hence the fair price for the same bet on the second flip?","steps":[{"label":"首次投掷的公平价格","prompt":"Fair price before flipping ($) = ?","answer":0.45,"tol":0.001,"hint":"期望回款 = Pr(H) × $1"},{"label":"看到正面后 Pr(B | H)","prompt":"Pr(B | H) = ?","answer":0.1667,"tol":0.002,"hint":"1 − 5/6"},{"label":"第二次正面的概率","prompt":"Pr(2nd flip H | 1st flip H) = ?","answer":0.65,"tol":0.002,"hint":"5/6 × 0.75 + 1/6 × 0.15"},{"label":"第二次的公平价格","prompt":"Fair price for 2nd-flip bet ($) = ?","answer":0.65,"tol":0.002,"hint":"= 更新后正面概率 × $1"}],"final":"Fair price before flipping = $0.45; after seeing heads, Pr(next heads) = 0.65, so the fair price rises to $0.65.","work":"(a) Pr(H) = 0.5 × 0.75 + 0.5 × 0.15 = 0.45, so fair price = 0.45 × $1 = $0.45\n(b) Pr(A | H) = 5/6, Pr(B | H) = 1/6\nPr(next H | first H) = (5/6)(0.75) + (1/6)(0.15) = 0.625 + 0.025 = 0.65\nFair price = $0.65","explain":"(a) 来自课堂（正面奖 1 元时平均回款 0.45 元）；(b) 是按同一方法的延伸练习。这不是赌徒谬误：给定硬币时各次独立，但硬币未知时，第一次正面让我们更相信是 A，从而提高下一次正面的概率。硬币本身的 75% 没变。","table":null}],"essay":[]},
{"cards":[{"id":"soc-L1-epistemology","module":"soc","lecture":"L1","term":"Epistemology and social epistemology","zh":"认识论","def":"Epistemology is the philosophical study of knowledge: what knowledge is, what justifies a belief, and what counts as evidence. Social epistemology studies how knowledge depends on social context, especially how we obtain trustworthy premises from other people, sources and institutions.","defZh":"研究知识的哲学分支：什么算知识、什么使信念得到辩护、什么构成证据、我们凭什么相信。","example":"Watergate 听证会的问题“总统知道什么、何时知道”——课程关注的是普通事实性知识，而非彻底怀疑论（Matrix 式问题）。","pitfall":"批判性思维 = 可靠前提 + 好的推理：认识论检查“前提材料是否可靠”，逻辑/概率检查“推理过程是否正确”。","hf":false},{"id":"soc-L1-jtb","module":"soc","lecture":"L1","term":"Justified true belief (JTB), factivity and justification","zh":"知识的 JTB 分析（得到辩护的真信念）","def":"JTB analysis: X knows that P if and only if (1) P is true, (2) X believes that P, and (3) X is justified in believing that P; the conditions are individually necessary and jointly sufficient. Factivity: if someone knows that P, then P must be true; a false proposition cannot be known. Justification: the subject has good reasons or evidence for P (perception, reliable testimony, maps, inference), so a true belief is not merely a lucky guess.","defZh":"传统分析：X 知道 P 当且仅当 P 为真、X 相信 P、X 有理由（辩护）相信 P。三条各自必要、合起来充分。","formula":"K(X,P) ⟺ P ∧ B(X,P) ∧ J(X,P)","example":"Telstra Tower 例：初到 Canberra 的人凭“Telstra 是电信公司”猜塔名，猜对且相信，但没有证据 → 缺 justification，不算知识。","pitfall":"JTB 的完整主张包括“充分性”：Gettier 攻击的正是“三条合起来就足够”，不是说三条中某条不必要。","hf":true},{"id":"soc-L1-gettier","module":"soc","lecture":"L1","term":"Gettier case / Gettier problem","zh":"盖梯尔案例 / 盖梯尔问题","def":"A Gettier case is one in which a subject has a justified true belief that is true only by luck, so intuitively it is not knowledge; such cases show that justified true belief is not sufficient for knowledge.","defZh":"主体拥有得到辩护的真信念，但它之所以为真是出于运气，直觉上不算知识；因此 JTB 对知识不充分。","example":"Verna 在悉尼街头清楚看见一个长得极像 Colin 的人，于是相信 Colin 在悉尼。Colin 恰好确实在悉尼另一处。J、T、B 都满足，但她不知道。","pitfall":"Gettier 只证明 JTB 不充分；没有证明我们一无所知，也没有证明 truth/belief/justification 不必要。口诀：JTB 防瞎猜，Gettier 防幸运蒙对。","hf":true},{"id":"soc-L3-evidentialism","module":"soc","lecture":"L3","term":"Evidentialism (Clifford\u0027s principle) and the ethics of belief","zh":"证据主义（克利福德原则）","def":"The ethics of belief asks whether we have moral (not merely rational) responsibilities in how we form beliefs and how much evidence is needed to believe. Clifford\u0027s evidentialism answers that \u0027it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence\u0027; we have a moral duty to proportion belief to the evidence.","defZh":"任何时间、地点、任何人，在证据不足时相信任何事都是（道德上）错误的；信念应符合客观证据标准。","formula":"P1 We have a duty to avoid harming others. P2 Believing on insufficient evidence always harms others. ∴ It is always wrong to believe on insufficient evidence.","example":"船主、愤怒暴民、Pizzagate。","pitfall":"这里的 wrong 是道德意义上的；Clifford 没有说明多少证据才算 sufficient；P2 极强，是 James 的攻击点。","hf":true},{"id":"soc-L3-shipowner","module":"soc","lecture":"L3","term":"Clifford\u0027s shipowner case","zh":"船主案例","def":"A shipowner suppresses his doubts about an old emigrant ship and sincerely comes to believe it is seaworthy; it sinks. Clifford argues he is guilty because he had no right to believe on the evidence before him: sincerity does not excuse insufficient evidence.","defZh":"船主为省钱压下对旧船的怀疑，真诚相信船安全，船沉人亡。他仍有罪：真诚不能代替证据。","example":"变体：即使船平安抵达，他也不因此无罪；暴民案例同理——好结果不能洗白不负责任的信念形成（类比酒驾平安到家）。","pitfall":"Clifford 评价的是信念形成的依据，而非信念是否碰巧为真。","hf":true},{"id":"soc-L3-four-replies","module":"soc","lecture":"L3","term":"Clifford\u0027s replies to \u0027only actions harm\u0027","zh":"Clifford 对“只有行动才有害”的四个回应","def":"Against the objection that only actions, not beliefs, are wrong, Clifford replies: (1) beliefs cause actions; (2) every belief influences behaviour to some degree; (3) beliefs are not private but are communicated and relied on by others; (4) careless believing forms a harmful habit that damages society\u0027s collective pursuit of truth.","defZh":"信念导致行动；每个信念都影响行为；信念不是私人的（会传播给他人）；轻信形成坏习惯、破坏集体求真。","example":"Pizzagate：网上无证据的说法被传播，最终有人持枪到披萨店——“只是说说”并非无害（对应第4点）。","hf":false},{"id":"soc-L3-voluntarism","module":"soc","lecture":"L3","term":"Voluntarism (James, The Will to Believe)","zh":"意志主义（詹姆斯《信仰的意志》）","def":"James\u0027s voluntarism holds that, at least for genuine options that are live, forced and momentous and cannot be settled by evidence, we may legitimately choose what to believe and how much epistemic risk to accept.","defZh":"对 live、forced、momentous 且证据无法决定的真正选项，我们可以合理地选择相信什么、承担多少认识风险。","example":"恋爱中的自信、跳过裂缝、相信自己能完成大学。","pitfall":"James 不是“想信什么就信什么”：他不会允许你因喜欢就相信 2+2=5。","hf":true},{"id":"soc-L3-live","module":"soc","lecture":"L3","term":"Live, forced and momentous options","zh":"活的选项","def":"For James, an option is live when each alternative is a genuine psychological possibility for the person; forced when one cannot avoid choosing, since suspending judgement in effect chooses one side; and momentous when the choice has significant, life-changing and often unique or irreversible consequences.","defZh":"对当事人而言心理上真正可能接受的选项。","example":"要不要上大学——你能真实地想象两种选择。","pitfall":"Live 不代表正确，只代表你真的可能选它。","hf":true},{"id":"soc-L3-self-fulfilling","module":"soc","lecture":"L3","term":"Self-fulfilling belief","zh":"自我实现信念","def":"A self-fulfilling belief is one that, although adopted without sufficient prior evidence, helps bring about the fact it represents by influencing the believer\u0027s behaviour.","defZh":"形成时证据不足，但通过影响行为帮助其内容成为现实的信念；James 对 Clifford 最直接的反例。","example":"相信对方可能喜欢自己 → 更自信开放 → 关系更可能建立；相信能跳过裂缝 → 全力起跳。","pitfall":"信念可能是成功的必要条件，但不是充分条件：相信也跳不过一百米深渊。","hf":true},{"id":"soc-L3-truth-vs-error","module":"soc","lecture":"L3","term":"Believe truth vs shun error (epistemic risk)","zh":"追求真理 vs 避免错误（认识风险）","def":"James distinguishes two distinct epistemic goals, believing truth and avoiding error; a strict evidential threshold minimises false beliefs but risks missing truths, while a permissive one gains more truths at the cost of more errors, and how to weigh them is not settled by evidence alone.","defZh":"两个不同的认识目标：严格门槛→少犯错但可能错过真相；宽松门槛→发现更多真相但错误更多。如何权衡不完全由证据决定。","example":"教授用医学检测、机器学习阈值说明：门槛越严，误报越少、漏报越多。Clifford 在风险旋钮的“只避免错误”一端。","pitfall":"“避免错误”与“追求真理”不是一回事：过度避免错误会导致错过真理。","hf":true},{"id":"soc-L3-reductio","module":"soc","lecture":"L3","term":"James\u0027s reductio of Clifford","zh":"James 对 Clifford 的归谬","def":"James argues that Clifford\u0027s principle P (\u0027never believe on insufficient evidence\u0027) itself determines how evidence is to be weighed, so it must be accepted prior to evidence and is not itself held on sufficient evidence; by its own standard, believing P is wrong, so P is self-undermining.","defZh":"Clifford 的原则 P 规定如何评价证据，因此必须先于证据被接受，本身并不建立在充分证据上——按 P 自己的标准，相信 P 是错的，自我削弱。","formula":"Assume P → derive contradiction → ∴ not-P","pitfall":"教授评价：James 攻击了绝对原则，但从未真正回应 Clifford 的第一前提（避免伤害他人的义务）——两人某种程度上各说各话。","hf":true},{"id":"soc-L5-testimony","module":"soc","lecture":"L5","term":"Testimony","zh":"证言","def":"Testimony, in the broad sense, is things that other people tell us, including speech, books, photographs, news, broadcasts, documentaries, social media and records; most of what we take ourselves to know depends on it.","defZh":"广义上指他人告诉我们的东西，包括口头、书籍、照片、新闻、纪录片、社交媒体、历史记录等；我们绝大多数知识依赖它。","example":"没去过 Brazil 却知道首都；没观察过 Jupiter 却知道其卫星；家人讲述你的童年。桑葚有毒的例子：证言可能长期保留错误信息。","pitfall":"不只是法庭证词；testimony 不可缺少但并不稳定（人会说谎、记错、误解）。","hf":false},{"id":"soc-L5-autonomy","module":"soc","lecture":"L5","term":"Intellectual autonomy and epistemic individualism","zh":"思想自主 / 认识自主","def":"Intellectual (epistemic) autonomy is the Enlightenment (Kantian) ideal of forming beliefs by using one\u0027s own reason and evidence rather than deferring to authority, tradition or dogma. Epistemic individualism is the view that individual persons are the primary subjects of knowledge, each forming beliefs from their own evidence.","defZh":"启蒙（康德式）理想：用自己的理性和证据独立形成信念，而不盲从权威、传统或教条。","example":"启蒙反对“权威拥有真理、普通人只能服从”；具有平等意义：知识不只属于神职人员或有钱人。","pitfall":"Hardwig：跨所有领域追求彻底自主会让人更无知、更不可靠（从零发明 calculus）。更现实的自主是“谨慎决定何时、信谁”。","hf":true},{"id":"soc-L5-dependence","module":"soc","lecture":"L5","term":"Epistemic dependence (Hardwig)","zh":"认识论依赖（Hardwig）","def":"Epistemic dependence is the reliance of a person\u0027s justified beliefs on the knowledge, evidence or judgement of others, especially experts; Hardwig argues that B can be justified in believing P because a recognised expert A believes P, even if B does not possess or understand A\u0027s evidence.","defZh":"一个人的合理信念依赖他人（尤其专家）的知识、证据或判断。Hardwig：B 可以因为其承认的相关专家 A 相信 P 而有理由相信 P，即使 B 没有、也看不懂 A 的证据。","formula":"A is an expert about P; A believes P; B recognises A as the relevant expert ⊢ B may be justified in believing P","example":"病人知道肿块不是癌症：没看切片、看不懂报告，但医生告诉他。","pitfall":"Testimony 可以传递 justification，却不传递底层 evidence。这是本讲最重要也最易混的点。","hf":true},{"id":"soc-L5-deference","module":"soc","lecture":"L5","term":"Rational deference","zh":"理性服从（对专家）","def":"Rational deference is accepting an expert\u0027s judgement within their domain because of a relevant competence gap, not because of their status; once one reasonably recognises someone as the relevant expert, one normally has reason to defer.","defZh":"因专业能力差距（而非地位）而合理接受专家在其领域的判断。承认某人是相关专家后，通常有理性义务认真接受其判断。","example":"你找了合格电工，他说线路有火灾风险，你不能因维修贵就认为自己的直觉与其判断同等分量。","pitfall":"≠ blind obedience。仍可提问、要第二意见；但非专家往往无法独立判断自己的技术反对意见是否成立。","hf":false},{"id":"soc-L5-chain","module":"soc","lecture":"L5","term":"Testimonial chain","zh":"证言链","def":"A testimonial chain is the passing of information and justification through several people (e.g. lab evidence → pathologist → doctor → patient); justification can travel along it, but the chain must ultimately terminate in genuine evidence.","defZh":"信息与辩护经多人逐层传递；辩护可沿链传递，但链条最终必须落在真实证据上，否则整条辩护链崩溃。","example":"若 pathologist 没检查样本、随机填写结果，整条链崩塌。口诀：证言链可以很长，但不能悬空。","pitfall":"Many people repeating P ≠ evidence for P。","hf":true},{"id":"soc-L5-identify-experts","module":"soc","lecture":"L5","term":"Experts and the problem of identifying experts","zh":"识别专家的难题","def":"An expert (Hardwig\u0027s sense) is someone with objective competence in a domain, through education, training, experience and tools, enabling them to access and interpret evidence non-experts cannot properly handle. The problem of identifying experts: non-experts cannot directly test expertise, so they rely on indicators such as certification, track record and institutional support, which themselves often depend on further testimony.","defZh":"专家拥有我不懂的知识，我无法直接检验；只能依赖资格认证、过往记录、制度支持（Goldman），而这些本身又依赖证言。","example":"网上好评也是证言：需要相信是真人写的、没收钱、不是 AI 生成。AI 使 fluency（流畅）与 expertise 分离。","pitfall":"表达流畅、术语多、语气自信 ≠ 专家。","hf":false},{"id":"soc-L7-endo-exo","module":"soc","lecture":"L7","term":"Endogenous vs exogenous attention","zh":"内源性 vs 外源性注意","def":"Endogenous attention is internally directed by the person\u0027s own goals; exogenous attention is captured by salient external stimuli.","defZh":"内源：主体主动定向（我决定看什么）；外源：被外部显著刺激抓走。","example":"主动读 tutorial 题目 = endogenous；火警响起所有人转向出口 = exogenous。","pitfall":"外源注意不一定更准确；媒体/广告正是利用响、亮、情绪化刺激劫持注意（weaponisation of attention）。","hf":false},{"id":"soc-L7-selective","module":"soc","lecture":"L7","term":"Attention and selective attention (invisible gorilla)","zh":"选择性注意（看不见的大猩猩）","def":"Attention is a psychological process that makes some information more salient and available for processing than other information, leaving the rest underprocessed. Selective attention can improve performance on a focal task while making salient but task-irrelevant information effectively invisible.","defZh":"专注于一个任务会提升目标表现，却让同场景中显眼但与任务无关的信息“看不见”。","example":"数白衣球员传球次数时，许多人没看到穿大猩猩服的人走过。目击证人可能真诚自信却说法冲突。","pitfall":"漏看大猩猩不说明视力差；“眼睛看着”≠“信息被加工”。另：期待/字幕会改变对模糊刺激的解释（O Fortuna）。","hf":false},{"id":"soc-L7-selection-bias","module":"soc","lecture":"L7","term":"Selection bias and representative samples","zh":"选择偏差","def":"Selection bias occurs when the process that determines which cases enter a sample is systematically related to the characteristic or outcome being studied, so the sample differs systematically from the target population. A sample is representative when inclusion in it is not systematically connected to the characteristic being estimated, so it resembles the population in the relevant respects.","defZh":"决定案例进入样本的机制与所研究的特征/结果系统性相关，使样本系统性偏离目标总体。","example":"Eagles 球迷节目问“最好的 3-0 球队”，96% 选 Eagles；Solitude 滑雪场的人说 Solitude 最好。","pitfall":"不是任何非随机都算；样本大也不能修复系统性筛选。坏测量/撒谎、push polling（措辞诱导）都不是 selection bias；file drawer 是“结果可见性”的选择。","hf":true},{"id":"soc-L7-survivorship","module":"soc","lecture":"L7","term":"Survivorship bias","zh":"幸存者偏差","def":"Survivorship bias occurs when we draw conclusions from the cases that remain visible after a filtering process while ignoring the cases that the process removed.","defZh":"只根据通过筛选后仍可见的案例下结论，忽视被筛选过程淘汰的案例。","example":"Abraham Wald：返航轰炸机弹孔少的部位才该加装甲——那里中弹的飞机回不来。另：现任教练、幸存基金、化石偏向硬组织。","pitfall":"缺失非随机时，缺失本身就是信息。核心问：要通过什么筛选才能进入这个数据集？","hf":true},{"id":"soc-L7-friendship","module":"soc","lecture":"L7","term":"Friendship paradox","zh":"友谊悖论","def":"The friendship paradox is the tendency for most people to have fewer friends than their friends have on average, because highly connected individuals appear in many more people\u0027s friendship samples.","defZh":"多数人的朋友平均比自己朋友多，因为朋友多的人出现在更多人的朋友样本中（被过度抽中）。","example":"随机抽“一个人”与随机抽“某人的朋友”是不同抽样；右偏分布 + preferential attachment（rich get richer）。","pitfall":"不是大家都“低于平均”的失败，而是沿网络边抽样的效应；与 class size 同属 unit-of-analysis/观察选择效应。","hf":false},{"id":"soc-L7-unit","module":"soc","lecture":"L7","term":"Unit of analysis (class size example)","zh":"分析单位（班级规模例）","def":"The unit of analysis is the basic unit that is counted or sampled (events, people, classes, students); different units can yield different, individually true averages that answer different questions.","defZh":"被计数/抽样的基本单位不同（事件 vs 人，班级 vs 学生），会得出不同但各自为真的平均数。","formula":"20 classes × 20 + 4 classes × 200: class mean = 1200/24 = 50; student-experienced mean = (400×20 + 800×200)/1200 = 140","example":"婚姻离婚比例（按婚姻）vs 一个人离婚概率（按人）。","pitfall":"学校报“平均班级 50 人”、学生感觉“平均 140 人”，两者都对，回答的是不同问题。","hf":false},{"id":"soc-L7-berkson","module":"soc","lecture":"L7","term":"Berkson\u0027s paradox","zh":"伯克森悖论","def":"Berkson\u0027s paradox occurs when selecting a group on a combination of two traits creates a correlation (often negative) between the traits within the selected group, even though they are uncorrelated in the population.","defZh":"按两项特征的综合门槛筛选样本，会在被选群体内部制造总体中不存在的（常为负）相关。","example":"约会池里“越帅越不友善”；Google 员工中编程比赛成绩与工作表现负相关。（Bergstrom \u0026 West）","pitfall":"高度筛选群体内部的相关，可能与总体中的相关符号相反。","hf":false},{"id":"soc-L7-censoring","module":"soc","lecture":"L7","term":"Data censoring (right-censoring)","zh":"数据删失（右删失）","def":"Right-censoring occurs when cases whose outcomes have not yet occurred by the end of the observation window are excluded, so later cohorts can only show short outcomes and appear systematically different.","defZh":"观察窗口结束时尚未出现结果的案例被排除，使较晚的群体只能留下“结果来得早”的个体，看似系统性不同。","example":"Rap/hip-hop 音乐家“平均死亡年龄低”：年轻流派里仍活着的人不进入死亡年龄样本。","hf":false},{"id":"soc-L7-randomization","module":"soc","lecture":"L7","term":"Self-selection and randomized assignment (wellness RCT)","zh":"随机分配（健康项目随机对照试验）","def":"Self-selection is a form of selection bias in which individuals decide for themselves whether to participate, so participants (often the most motivated or extreme) differ systematically from non-participants. Randomized assignment of a treatment offer makes groups comparable in expectation, separating genuine treatment effects from such pre-existing differences.","defZh":"随机分配“是否获得参与机会”使组别在期望上可比，把真实效果与参与者原有差异分开。","example":"Workplace wellness RCT：随机比较无显著效果；只比较自愿参加者 vs 不参加者则显得参加者更健康——实为“健康导致参与”，而非项目导致健康。","pitfall":"File drawer problem：只发表有利/显著结果，公开证据被结果选择过滤，即使原始抽样随机。","hf":false},{"id":"soc-L9-three-levels","module":"soc","lecture":"L9","term":"Syntax, semantics and pragmatics","zh":"句法、语义与语用","def":"Syntax concerns the structure and combination rules of linguistic units; semantics concerns the conventional, literal meaning of words and sentences; pragmatics concerns what a speaker conveys in a social context beyond literal meaning, using shared background and conversational expectations.","defZh":"句法：结构与组合规则；语义：词句的常规/字面意义；语用：在社会语境中超出字面意义所传达的内容。","example":"被问“教授字迹怎样？”答“Professor Klein gives great lectures”——字面赞扬讲课，语用上暗示字迹不好。","pitfall":"语用意义 ≠ 撒谎：可以说字面为真的句子，通过相关性、语气、回避传达另一层意思。","hf":true},{"id":"soc-L9-speech-act","module":"soc","lecture":"L9","term":"Speech act","zh":"言语行为","def":"A speech act is an utterance that, given the appropriate authority, procedure and context, itself performs a social action and creates a new normative fact, rather than merely describing the world.","defZh":"在适当身份、程序和情境下，说出话语本身就完成一种社会行动、建立新的规范事实。","example":"\u0027I pronounce you married\u0027、\u0027I promise…\u0027、\u0027I apologise…\u0027。","pitfall":"Speech act ≠ indirect speech：承诺可以完全直接；成功依赖制度身份与情境，排练中说同样的话无效。","hf":false},{"id":"soc-L9-focal-point","module":"soc","lecture":"L9","term":"Focal point (Schelling point)","zh":"焦点 / 谢林点","def":"A focal point is an option that allows coordination without communication because each participant expects the others to find it salient as well; it need not be objectively the best option.","defZh":"每个人都预计别人也会注意到的突出选项，使无沟通时的预期收敛；不必是客观最好的。","example":"选一门 ANU 课程 → PHIL1005；间谍堪培拉会面 → Parliament House；Schelling：纽约 Grand Central、正午、heads、50–50。","pitfall":"显著性依群体经验而变（悉尼：游客选 Opera House，本地人选 Town Hall 台阶）；多个焦点竞争时协调可能失败。","hf":false},{"id":"soc-L9-common-knowledge","module":"soc","lecture":"L9","term":"Common knowledge","zh":"共同知识","def":"P is common knowledge between A and B when both know P, each knows the other knows P, each knows the other knows that they know P, and so on recursively.","defZh":"双方都知道 p，且知道对方知道，且知道对方知道自己知道……递归下去。","formula":"K_A p ∧ K_B p ∧ K_A K_B p ∧ K_B K_A p ∧ …","example":"皇帝的新衣：男孩说出口后，大家并非第一次看见事实，而是“所有人知道所有人都知道”，挑战皇帝变得可协调。","pitfall":"A、B 都知道 p（shared knowledge）≠ common knowledge。Harry \u0026 Sally：委婉邀请被拒，各自知道但不是共同知识。","hf":true},{"id":"soc-L9-common-ground","module":"soc","lecture":"L9","term":"Common ground","zh":"共同基础","def":"Common ground is the set of propositions that conversational participants have publicly committed to and can jointly rely on in subsequent conversation, typically added by explicit assertion.","defZh":"对话参与者已公开承诺、此后可共同依赖的内容，通常由明确断言加入。","example":"直接说出 p 会让后续对话必须围绕 p；暗示则让 p 留在边缘，失败后可“仿佛没发生过”。","pitfall":"全讲最重要的区分：双方高度确信说话者意指 p ≠ p 已被明确加入 common ground。","hf":true},{"id":"soc-L9-indirect-speech","module":"soc","lecture":"L9","term":"Indirect speech","zh":"间接言语","def":"Indirect speech uses pragmatic mechanisms to convey a proposition p without explicitly asserting p, so that p is understood but not placed on record in the common ground.","defZh":"利用语用机制传达 p，却不明确断言 p，使 p 被理解但不被正式放入共同基础。","example":"含蓄贿赂、委婉邀请一起看电影、隐蔽威胁、重伤者说 \u0027Nobody shot me\u0027（拒绝与警方合作）。","pitfall":"核心不是“没人听懂”，而是“有人领会，但意图没被公开、确定、可引用地摆上台面”。三大功能：可否认性、关系管理、战略模糊（Pinker, Nowak \u0026 Lee）。","hf":true},{"id":"soc-L9-deniability","module":"soc","lecture":"L9","term":"Plausible deniability, relationship management and strategic ambiguity","zh":"可信的可否认性","def":"Plausible deniability is the availability of an innocent alternative interpretation sufficient to avoid formal responsibility, so a cooperative hearer can accept an implied offer while a hostile hearer finds it hard to punish the speaker. Relationship management is using indirect speech to probe a change in relationship type while preserving the existing relationship if the proposal is declined. Strategic ambiguity is deliberately keeping a message vague so different audiences read different messages, while the implied content stays out of the common ground behind an innocuous literal reading.","defZh":"存在足以避免正式责任的无辜替代解释：合作的听者可接受暗示，敌对的听者难以据此惩罚。","example":"被拦司机不知警察是否腐败（identification problem）：直接行贿对诚实警察风险极高；暗示可被腐败警察接受（门槛 d_c），又低于诚实警察的处罚门槛 d_h（d_c \u003c d \u003c d_h）。","pitfall":"诚实警察可以完全听懂暗示；可否认性来自举证门槛和无辜解释，不必来自听者困惑。秘密代码（Friend of Dorothy）则依赖局外人不懂。","hf":true},{"id":"soc-L11-bibliotechnic","module":"soc","lecture":"L11","term":"Bibliotechnic hypothesis","zh":"图书馆技术假说（信息检索解释）","def":"The bibliotechnic hypothesis holds that large language models are best understood as sophisticated information-retrieval systems that compress, recombine and extrapolate patterns in human text, rather than as genuinely thinking agents.","defZh":"把 LLM 理解为压缩、检索、重组、外推人类文本模式的强大信息系统，而非真正的思考主体。教授倾向此说，但称之为 tentative answer。","example":"Borges 的巴别图书馆：拥有所有书 ≠ 理解它们；Ted Chiang：ChatGPT 是网络的“模糊 JPEG”。","pitfall":"不是说 LLM 只会逐字复制，它能处理新组合；也不是学界定论。","hf":true},{"id":"soc-L11-next-token","module":"soc","lecture":"L11","term":"Next-token prediction","zh":"下一 token 预测","def":"Next-token prediction is generating text by estimating Pr(next token | preceding context), selecting a token, appending it to the context, and repeating until the response is complete.","defZh":"根据 Pr(下一 token | 前文) 选一个 token，追加到前文末尾，再预测，循环直到回答完成（自回归）。","formula":"Pr(next token | preceding context)","example":"手机自动补全 \u0027Do you want anything from the …\u0027 → \u0027shops\u0027。Markov 生成器只看固定长度（order k）前文，面临长程依赖、n^(k+1) 指数增长、数据稀疏；神经网络以参数压缩并泛化。","pitfall":"Token 不严格等于词；训练时更新权重 ≠ 聊天时把文本放进 context（“LLMs don\u0027t learn after training”）。","hf":false},{"id":"soc-L11-redescription","module":"soc","lecture":"L11","term":"Redescription fallacy","zh":"重描述谬误","def":"The redescription fallacy is inferring that a system lacks a high-level capacity merely because its operation can be redescribed in low-level mechanistic terms (e.g. \u0027it is just statistics / next-token prediction, so it cannot think\u0027).","defZh":"仅因能用低层机制重新描述系统（“它只是统计/线性代数/下一 token 预测”），就推出它没有高层能力（不能思考）——缺少额外论证。","example":"Rick and Morty：“爱只是化学反应”并不证明爱不存在。（Millière \u0026 Buckner）","pitfall":"指出这一谬误并不证明
