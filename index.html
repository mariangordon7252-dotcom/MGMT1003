<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>PHIL1005 期末复习</title>
<script>try { var t = localStorage.getItem('phil1005-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* 暖色主题。浅色：奶油底 + 珊瑚主色；深色：暖炭灰（不用纯黑、不用冷蓝） */
:root{
  --bg:#faf5ee;--card:#fffdfa;--card2:#f5ede3;--tx:#3b322b;--tx2:#6e6157;--tx3:#a39486;
  --line:rgba(120,85,50,.10);--line2:rgba(120,85,50,.20);--acc:#e0705a;--onacc:#fff;--accbg:#fde9e2;
  --shadow:0 1px 2px rgba(120,80,40,.05),0 4px 14px rgba(120,80,40,.06);
  --ok:#3f9a5a;--okbg:#e8f5e9;--okline:#a5d6a7;--bad:#d64545;--badbg:#fdeceb;--badline:#f2aaa5;
  --warn:#b8741a;--warnbg:#fdf1dc;
  --prob:#f08c3a;--probbg:#fdeedd;--probtx:#a85a17;
  --logic:#8a6fd1;--logicbg:#efeafb;--logictx:#5d45a3;
  --soc:#3f9e86;--socbg:#e2f3ee;--soctx:#24705d;
  --t1:#fde9e2;--t1x:#d0604a;--t2:#e3f1e8;--t2x:#3f8a5c;--t3:#ece6f8;--t3x:#7a5fc4;--t4:#fdf0d9;--t4x:#b8741a;
  --hero:linear-gradient(135deg,#ffe4d6 0%,#fff1e0 55%,#f3ecfb 100%);--tabbg:rgba(255,253,250,.86);
  --glow:radial-gradient(900px 380px at 50% -120px,rgba(255,196,160,.35),transparent 70%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1e1a17;--card:#29231f;--card2:#342d28;--tx:#f3ece4;--tx2:#c9bcb0;--tx3:#998a7d;
  --line:rgba(255,235,210,.08);--line2:rgba(255,235,210,.17);--acc:#f0896f;--onacc:#2a1712;--accbg:#4a2f27;
  --shadow:0 2px 10px rgba(0,0,0,.25);
  --ok:#7fcf8f;--okbg:#20372a;--okline:#3f8a55;--bad:#ff8f86;--badbg:#45231f;--badline:#a8433b;
  --warn:#f5bd6b;--warnbg:#41311c;
  --prob:#f7a660;--probbg:#47301d;--probtx:#ffd0a6;--logic:#b39cf0;--logicbg:#352c4f;--logictx:#ddd0ff;--soc:#6fcfb2;--socbg:#1f3b33;--soctx:#b2ead9;
  --t1:#4a2f27;--t1x:#f7a58e;--t2:#24392c;--t2x:#8fd3a2;--t3:#352c4f;--t3x:#c4b2f5;--t4:#43341f;--t4x:#f5bd6b;
  --hero:linear-gradient(135deg,#4a2f27 0%,#3a2e24 55%,#33293f 100%);--tabbg:rgba(41,35,31,.88);
  --glow:radial-gradient(900px 380px at 50% -120px,rgba(240,137,111,.16),transparent 70%);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#1e1a17;--card:#29231f;--card2:#342d28;--tx:#f3ece4;--tx2:#c9bcb0;--tx3:#998a7d;
  --line:rgba(255,235,210,.08);--line2:rgba(255,235,210,.17);--acc:#f0896f;--onacc:#2a1712;--accbg:#4a2f27;
  --shadow:0 2px 10px rgba(0,0,0,.25);
  --ok:#7fcf8f;--okbg:#20372a;--okline:#3f8a55;--bad:#ff8f86;--badbg:#45231f;--badline:#a8433b;
  --warn:#f5bd6b;--warnbg:#41311c;
  --prob:#f7a660;--probbg:#47301d;--probtx:#ffd0a6;--logic:#b39cf0;--logicbg:#352c4f;--logictx:#ddd0ff;--soc:#6fcfb2;--socbg:#1f3b33;--soctx:#b2ead9;
  --t1:#4a2f27;--t1x:#f7a58e;--t2:#24392c;--t2x:#8fd3a2;--t3:#352c4f;--t3x:#c4b2f5;--t4:#43341f;--t4x:#f5bd6b;
  --hero:linear-gradient(135deg,#4a2f27 0%,#3a2e24 55%,#33293f 100%);--tabbg:rgba(41,35,31,.88);
  --glow:radial-gradient(900px 380px at 50% -120px,rgba(240,137,111,.16),transparent 70%);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
#view{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(88px + env(safe-area-inset-bottom))}
body.sess #view{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
body.sess .tabs{display:none}
/* 练习时左侧的符号速查抽屉 */
#symBtn{display:none;position:fixed;left:0;top:38%;z-index:41;writing-mode:vertical-rl;letter-spacing:2px;font-family:inherit;font-size:12px;font-weight:600;line-height:1;padding:10px 3px;border:0;border-radius:0 10px 10px 0;background:var(--acc);color:var(--onacc);opacity:.85;transition:left .25s}
body.symok #symBtn{display:block}
#symPanel{position:fixed;left:0;top:0;bottom:0;z-index:40;width:min(80vw,320px);background:var(--card);border-right:1px solid var(--line2);box-shadow:4px 0 24px rgba(0,0,0,.18);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-105%);transition:transform .25s;visibility:hidden}
body.symok.symopen #symPanel{transform:none;visibility:visible}
body.symok.symopen #symBtn{left:min(80vw,320px);opacity:1}
#symPanel h3{font-size:13px;color:var(--tx3);font-weight:600;margin:14px 0 6px}
#symPanel h3:first-of-type{margin-top:4px}
h1{font-size:24px;font-weight:600;margin:8px 0 2px}
h2{font-size:18px;font-weight:600;margin:22px 0 10px}
h3{font-size:16px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.sub{color:var(--tx2);font-size:14px}
.mut{color:var(--tx3);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.soft{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--accbg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.3}
.stat span{font-size:12px;color:var(--tx2)}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.m-prob{background:var(--probbg);color:var(--probtx)}.m-logic{background:var(--logicbg);color:var(--logictx)}.m-soc{background:var(--socbg);color:var(--soctx)}
.hf{background:var(--warnbg);color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;border-radius:3px}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:15px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list .it:last-child{border-bottom:0}
.chev{color:var(--tx3)}
.hdr{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}
.hdr .t{flex:1;font-weight:600;font-size:17px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx)}
.ib svg,.tabs svg{width:22px;height:22px}
.q{font-size:16px;line-height:1.65;margin:4px 0 14px;white-space:pre-wrap}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.5}
.opt .bub{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2);margin-top:-2px}
.opt.sel .bub{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.opt.ok{border-color:var(--okline);background:var(--okbg)}.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--badline);background:var(--badbg)}.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default;color:var(--tx)}
.exp{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:14.5px;color:var(--tx2);white-space:pre-wrap}
.good{color:var(--ok)}.wrong{color:var(--bad)}
.exp b.xl{color:var(--tx);font-weight:600}
.ti{display:block;background:var(--accbg);color:var(--tx);border-radius:10px;padding:6px 10px;margin:4px 0 6px}
.ti b{color:var(--acc)}
.prog{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--acc)}
input[type=text],input[type=search],textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--tx2)}
textarea{min-height:120px;resize:vertical;line-height:1.55}
.step{border-left:3px solid var(--line2);padding:4px 0 4px 12px;margin:10px 0}
.step.done{border-color:var(--okline)}
.step.cur{border-color:var(--acc)}
.sol{background:var(--card2);border-radius:10px;padding:8px 11px;margin-top:6px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;color:var(--tx2)}
.sol>b{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:1px}
.trap{background:var(--warnbg);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.trap>b{display:block;font-size:12px;font-weight:600;margin-bottom:1px}
.kp{display:flex;gap:6px;margin:8px 0}
.kp button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:17px}
.msg{font-size:14px;margin-top:6px}
pre.work{white-space:pre-wrap;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--card2);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto}
table.tt{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;text-align:center}
table.tt th,table.tt td{border:1px solid var(--line2);padding:6px 4px}
table.tt th{background:var(--card2);font-weight:600;font-size:14px}
table.tt td.cell{cursor:pointer;font-weight:600;min-width:44px}
table.tt td.cell.e{color:var(--tx3)}
table.tt td.x{background:var(--badbg);color:var(--bad)}
table.tt td.y{background:var(--okbg);color:var(--ok)}
table.tt td.h{color:var(--tx3);font-size:13px}
.ttwrap{overflow-x:auto}
table.tt th small{display:block;font-size:11px;font-weight:400;color:var(--tx3)}
table.tt th.cur{background:var(--acc);color:var(--onacc)}table.tt th.cur small{color:var(--onacc)}
table.tt th.dim{color:var(--tx3);font-weight:400}
table.tt td.hl{background:var(--accbg)}
table.tt .n{color:var(--tx3);font-size:12px;font-weight:400;width:28px;background:none}
table.tt tr.key td{background:var(--accbg)}
table.tt tr.key.cx td{background:var(--badbg)}
table.tt td.cell{background:var(--card)}
table.tt td.cell.x{background:var(--badbg)}
i.tv{font-style:normal;font-weight:600;color:var(--ok)}i.tv.f{color:var(--bad)}
.ttlines{font-size:14px;line-height:1.7;margin-top:6px;font-variant-numeric:tabular-nums}
.ttstep{font-size:14.5px;line-height:1.65}.ttstep>b{display:block;margin-bottom:2px}
.ttrows{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.ttrows span{background:var(--card2);border-radius:10px;padding:6px 12px;font-size:14.5px}
.tttree{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:14.5px;line-height:1.8}
.tttree .l2{padding-left:18px}.tttree .l3{padding-left:36px}
.tttree .l2::before,.tttree .l3::before{content:'└ ';color:var(--tx3)}
.ttno{flex:0 0 28px;height:28px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.ttno.on{background:var(--ok);color:var(--onacc)}
.tile.tthl{border-color:var(--acc);background:var(--accbg)}
.tile.tthl .ic{background:var(--acc);color:var(--onacc)}
.tile .ic.ttlv{font-size:18px;font-weight:700}
.chip.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.chip:disabled{cursor:default;opacity:1}
.btn.ttbig{min-height:64px;font-size:26px;font-weight:700}
.btn.ttbig.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.btn.ttbig.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.btn:disabled{cursor:default}
.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center}
.fc .term{font-size:24px;font-weight:600;line-height:1.3}
.kv{margin:10px 0 0}.kv b{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.kv div{white-space:pre-wrap}
.one{font-size:17px;font-weight:600;line-height:1.45;margin:8px 0 2px}
.en{color:var(--tx2);font-size:14px;font-style:italic;margin-bottom:4px}
.ones{color:var(--tx2);font-size:14px;margin-top:3px;font-weight:400}
details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.more>summary{color:var(--tx3);font-size:13px}
.kpq{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kpchip{display:block;width:100%;text-align:left;background:var(--card2);border:0;border-radius:10px;padding:8px 10px;margin-top:6px;color:var(--tx);font:inherit;font-size:14px}
.kpchip b{font-weight:600;margin-right:4px}
.syms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:baseline;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.45;width:max-content;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:86vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--ok);color:var(--onacc)}
.kptick{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:transparent;font-size:15px;font-weight:700;line-height:1}
.kptick.on{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.kpn{font-size:12px;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
details.pass{box-shadow:inset 3px 0 0 var(--ok);padding-left:10px !important}
details.pass summary b{color:var(--ok)}
.kpst{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--card2);font-size:14px}
.kpst.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--okline)}
.ana{background:var(--warnbg);border-radius:10px;padding:9px 12px;margin:10px 0 2px;font-size:14.5px;line-height:1.55}
.ana b{display:block;font-size:12px;color:var(--warn);font-weight:600;margin-bottom:2px}
/* 知识点阅读排版 */
.kc{font-size:15.5px;line-height:1.75}
.kc-one{font-size:17px;font-weight:600;line-height:1.6;background:var(--accbg);border-left:4px solid var(--acc);border-radius:4px 12px 12px 4px;padding:10px 14px;margin:12px 0 4px}
.kc-sec{margin-top:16px}
.kc-sec h4{font-size:12.5px;font-weight:600;color:var(--acc);margin:0 0 6px;letter-spacing:.5px}
.kc-sec p{margin:0;white-space:pre-wrap}
.go{margin-top:12px;background:var(--t2);border-radius:14px;padding:10px 14px}
.go-k{font-size:12.5px;font-weight:700;color:var(--t2x);margin-bottom:2px}
.go-t{font-weight:600;line-height:1.6}
.list .it.cram{align-items:flex-start;line-height:1.55;font-size:14.5px}
.list .it.cram b{font-weight:600}
.chip.hfchip{border-color:var(--warn);color:var(--warn)}
.chip.hfchip.on{background:var(--warn);border-color:var(--warn);color:var(--onacc)}
.fx>i{font-style:normal;font-size:12px;line-height:1.4;color:var(--t2x);background:var(--t2);border-radius:6px;padding:1px 6px;margin:0 2px 0 4px;display:inline-block;vertical-align:middle;white-space:normal}
.opt .fx>i{display:block;margin:2px 0 0;width:fit-content}
.fxlist{font-size:13px;line-height:1.6;margin:-2px 0 6px;color:var(--tx2)}
.fxlist code{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--tx);margin-right:8px}
.qkp-c .work{margin-bottom:6px}
details.qkp{margin:4px 0 8px;border-radius:14px;background:var(--t2);padding:2px 12px}
details.qkp>summary{display:flex;align-items:center;justify-content:space-between;list-style:none;cursor:pointer;padding:9px 0;font-size:14px;font-weight:700;color:var(--t2x)}
details.qkp>summary::-webkit-details-marker{display:none}
details.qkp[open] .fchev{transform:rotate(-90deg)}
.qkp-c{padding:2px 0 12px;font-size:14.5px;line-height:1.6}
.qkp-c+.qkp-c{border-top:1px solid var(--line);padding-top:10px}
.qkp-n{font-weight:700;margin-bottom:2px}
.qkp-t{margin-top:6px;font-weight:600}
.qkp-c .work{margin:8px 0 0}
.qkp-c .btn{margin-top:8px}
.go-mini{display:block;margin-top:2px;color:var(--tx)}
.lx{margin-top:16px;border:1px solid var(--acc);border-radius:12px;padding:10px 14px;background:var(--card)}
.lx>b{display:block;font-size:12.5px;font-weight:600;color:var(--acc);margin-bottom:4px}
.lxq{font-weight:600;line-height:1.65}
.lx details{margin-top:8px}
.lx summary{font-size:13.5px;color:var(--acc);cursor:pointer}
.lxa{margin-top:6px;background:var(--okbg);border-radius:10px;padding:8px 12px;font-size:14.5px;line-height:1.6}
.lxa .good{font-weight:600}
.kc-pts{list-style:none;margin:0;padding:0;counter-reset:kp}
.kc-pts li{counter-increment:kp;position:relative;padding-left:30px;margin:0 0 8px}
.kc-pts li::before{content:counter(kp);position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:12px;font-weight:600;line-height:20px;text-align:center}
.kc .ana,.kc .trap{margin-top:16px}
.wds{display:flex;flex-direction:column;background:var(--card2);border-radius:10px;padding:4px 12px;font-size:14px;line-height:1.5}
.wd{padding:7px 0;border-bottom:1px solid var(--line)}
.wd:last-child{border-bottom:0}
.wd b{font-weight:600;margin-right:8px}

<body>
<div id="view"></div>

<script>
const DATA = (function(P){var o={cards:[],mcq:[],calc:[],essay:[]};P.forEach(function(p){["cards","mcq","calc","essay"].forEach(function(k){(p[k]||[]).forEach(function(x){o[k].push(x)})})});return o})([{"cards":[{"id":"logic-L1-argument","module":"logic","lecture":"L1","term":"Argument (premises and conclusion)","zh":"论证（前提与结论）","def":"An argument is a set of premises offered as reasons to believe a conclusion. The premises are the supporting claims; the conclusion is the claim the premises are meant to support.","defZh":"哲学里的 argument 不是吵架，而是用一组前提（premises）为一个结论（conclusion）提供理由。标准写法：P1, P2, … ∴ C。","example":"Potato cakes：P1 Nanette 把 potato scallops 叫 ‘potato cakes’；P2 只有 Victoria 或 Tasmania 的人这么叫；P3 Nanette 不是 Tasmania 人；∴ Nanette 来自 Victoria。","pitfall":"日常生活中（政客、父母、媒体）到处是论证，只是没有把前提和结论编号写出来；前提与结论之间要有支持关系（‘Mars 是第四颗行星 ∴ 应选 PHIL1005’ 就没有支持关系）。","hf":false},{"id":"logic-L1-critical-thinking","module":"logic","lecture":"L1","term":"Critical Thinking = Reliable Premises + Good Reasoning","zh":"批判性思维 = 可靠前提 + 良好推理","def":"Evaluating an argument has two separate aspects: whether the premises support the conclusion (logic, probability, inference) and whether the premises themselves are reliable (epistemology, evidence, source reliability).","defZh":"评价论证要分别问两件事：①推理结构好不好（逻辑/概率负责）；②前提本身靠不靠谱（认识论/社会认识论负责）。","example":"导航类比：逻辑检查导航路线，认识论检查地图数据。算法再完美，地图错了也会把你精确地带到错误地点。","pitfall":"逻辑本身不告诉你哪些前提是真的，只告诉你从前提能推出什么。","hf":false},{"id":"logic-L1-nec-suff","module":"logic","lecture":"L1","term":"Necessary vs sufficient condition","zh":"必要条件 vs 充分条件","def":"A is sufficient for B if A\u0027s holding guarantees B (A → B). A is necessary for B if B cannot hold without A (B → A).","defZh":"充分：有 A 就足以保证 B。必要：没有 A 就不可能有 B，但有 A 不保证 B。","example":"注册 PHIL1005 是通过它的必要条件，但仅注册不保证通过。‘不学习就不能通过 → 所以学习就一定通过’ 是把必要条件误当成充分条件。","pitfall":"Necessary ≠ sufficient：必要是‘不能缺’，充分是‘单独就够’。","hf":false},{"id":"logic-L4-validity","module":"logic","lecture":"L4","term":"Validity","zh":"有效性","def":"An argument is valid if and only if there is no possible situation in which all of its premises are true and its conclusion is false.","defZh":"不存在‘前提全真、结论为假’的可能情况，论证就有效。有效性只描述前提与结论之间的推理关系，不管前提事实上是否为真。","example":"P1 X or Y；P2 Not X；∴ Y —— 有效。P1 All cats can fly；P2 Cleo is a cat；∴ Cleo can fly —— 有效（但不健全）。","pitfall":"①假前提不会使论证无效；②前提和结论碰巧都真也不保证有效（Klein 喝咖啡、吃酸奶 ∴ Klein 有猫 —— 无效）。","hf":true},{"id":"logic-L4-soundness","module":"logic","lecture":"L4","term":"Soundness","zh":"健全性","def":"An argument is sound if and only if it is valid and all of its premises are actually true.","defZh":"Sound = Valid + 所有前提事实上为真。健全论证的结论一定为真。","example":"All cats are mammals; Cleo is a cat; ∴ Cleo is a mammal —— valid 且 sound。All cats can fly … —— valid 但 unsound。","pitfall":"无效论证一定不健全，即使前提和结论都真；有效论证的结论只有在前提都真时才保证为真。","hf":true},{"id":"logic-L4-counterexample","module":"logic","lecture":"L4","term":"Counterexample method (testing validity)","zh":"反例法（检验有效性）","def":"To test validity, ask: can I imagine any possible world in which all the premises are true but the conclusion is false? If such a world exists, the argument is invalid; if none can exist, it is valid.","defZh":"寻找‘破防世界’：前提全部成立、结论却为假。找得到 → Invalid；找不到 → Valid。在真值表里，这个世界就是‘前提列全 T、结论列为 F’的那一行。","example":"Klein drinks coffee; Klein eats yoghurt; ∴ Klein has a cat。反例世界：Klein 喝咖啡、吃酸奶，但没有猫 → 无效。","pitfall":"反例必须让所有前提都为真；只让某个前提为假的世界不是反例。","hf":true},{"id":"logic-L4-contradictory-premises","module":"logic","lecture":"L4","term":"Contradictory premises make an argument valid","zh":"矛盾前提 → 论证自动有效（但不健全）","def":"If the premises contradict each other, they cannot all be true together, so there is no possible situation with all premises true and the conclusion false; the argument is therefore valid, though it can never be sound.","defZh":"教授说这是他几乎每年都放进期末考的概念。前提互相矛盾 → 不可能全真 → 找不到反例世界 → 按定义有效；但因为前提不可能全真，所以一定不健全。","example":"P1 The sky is blue. P2 The sky is not blue. ∴ Cleo is a cat. —— Valid but unsound。","pitfall":"直觉觉得‘前提和结论毫无关系所以无效’——错。有效性只看是否存在反例世界，不看话题是否相关。","hf":true},{"id":"logic-L4-conclusion-necessary","module":"logic","lecture":"L4","term":"Conclusion that cannot be false","zh":"结论不可能为假 → 论证自动有效","def":"If the conclusion is a logical truth (cannot be false), no situation can make the premises true and the conclusion false, so the argument is valid whatever the premises are.","defZh":"两条‘自动有效’路线：①前提不可能同时为真；②结论不可能为假。两种情况都不存在反例世界。","example":"P1 The sky is blue. P2 Hamburgers eat people. ∴ Cleo is a cat or Cleo is not a cat. —— Valid（P2 为假，所以 unsound）。","pitfall":"前提荒唐不影响有效性，只影响健全性。","hf":true},{"id":"logic-L4-hidden-premise","module":"logic","lecture":"L4","term":"Hidden premise / Argument reconstruction","zh":"隐含前提 / 论证重构","def":"A hidden premise is an unstated assumption needed to connect the explicit premises to the conclusion. Argument reconstruction makes such assumptions explicit so that the full structure can be evaluated.","defZh":"日常论证常省略背景信息；做逻辑分析时必须明确写出补入了什么前提，而不是擅自改变对方的结论。","example":"Cleo 活跃又淘气；淘气的猫会惹事；惹事的猫要看管；∴ 要看管 Cleo —— 严格说无效，缺 ‘Cleo is a cat’。Taylor Swift 说弦理论是错的 ∴ 弦理论是错的：补上 ‘相关权威应被信任’ 和 ‘Taylor Swift 是弦理论权威’ 后有效，但后者为假，故不健全。","pitfall":"Appeal to authority 不自动无效；关键是该人是否真是相关领域的可靠权威。","hf":false},{"id":"logic-L4-proposition","module":"logic","lecture":"L4","term":"Proposition (truth-apt statement)","zh":"命题（可真可假的陈述）","def":"A proposition is a statement that can be true or false; only propositions can serve as premises or conclusions. Commands and questions are not propositions.","defZh":"逻辑处理具有真值（truth value）的陈述。‘Shut the door!’（命令）和 ‘Is the door shut?’（问题）不能做前提或结论。","example":"‘Pizza tastes good to me.’ 虽然主观，但相对于说话者明确化后仍可真可假，可以进入逻辑。","hf":false},{"id":"logic-L4-entailment","module":"logic","lecture":"L4","term":"Logical entailment","zh":"逻辑蕴涵","def":"A logically entails B if and only if it is impossible for A to be true while B is false. Entailment is transitive: if A entails B and B entails C, then A entails C.","defZh":"A 真时 B 不可能假。它是命题与命题之间的关系；validity 是前提集合与结论之间的关系。论证有效 ⇔ 所有前提的合取 (P1 \u0026 P2 \u0026 P3) 逻辑蕴涵结论。","example":"多步推理链：每一步都有效，则从最初前提到最终结论整体有效。","pitfall":"口诀：互斥不能接力，蕴涵可以接力。","hf":false},{"id":"logic-L4-mutual-exclusivity","module":"logic","lecture":"L4","term":"Mutually exclusive propositions","zh":"互斥命题","def":"Two propositions are mutually exclusive if and only if they cannot both be true. Mutual exclusivity is not transitive.","defZh":"不能同时为真（但可以同时为假）。A 与 B 互斥、B 与 C 互斥，推不出 A 与 C 互斥（也推不出它们一定相容）。","example":"A = 我早上看到的是 Venus，B = 看到的是 Mars，C = 看到的是 the Morning Star。A⊥B、B⊥C，但 A 与 C 说的是同一件事，不互斥。","pitfall":"互斥 ≠ 一真一假；同一次掷骰 ‘掷出 2’ 与 ‘掷出 3’ 互斥，掷出 5 时二者同假。","hf":false},{"id":"logic-L6-truth-table","module":"logic","lecture":"L6","term":"Truth table (2ⁿ rows)","zh":"真值表（2ⁿ 行）","def":"A truth table displays the truth value of a complex proposition under every possible assignment of truth values to its atomic propositions; n distinct atomic propositions require 2ⁿ rows.","defZh":"把所有可能世界全部列出，再逐行计算。行数只取决于不同原子命题的个数：1→2，2→4，3→8，4→16。","formula":"rows = 2ⁿ","example":"两个原子命题的标准排列：TT, TF, FT, FF。","pitfall":"行数不看 connective 的个数：((A \u0026 ~B) ∨ ~(A ∨ B)) ⊃ ~~A 虽然符号很多，但只有 A、B 两个原子命题 → 4 行。","hf":false},{"id":"logic-L6-connectives","module":"logic","lecture":"L6","term":"Connectives: ~  \u0026  ∨  ⊃","zh":"四个联结词：否定、合取、析取、实质条件","def":"~A (negation) is true iff A is false; A \u0026 B (conjunction) is true iff both are true; A ∨ B (disjunction) is false only if both are false; A ⊃ B (material conditional) is false only if A is true and B is false.","defZh":"课程主用符号：~（not）、\u0026（and）、∨（or）、⊃（if…then）。部分笔记/教材写作 ¬ = ~、∧ = \u0026，同一概念不同写法。≡ 在本课程表示‘逻辑等价’，不是一个联结词。","formula":"A B | ~A  A\u0026B  A∨B  A⊃B\nT T |  F    T    T    T\nT F |  F    F    T    F\nF T |  T    F    T    T\nF F |  T    F    F    T","example":"教授说 ampersand（\u0026）和倒 V（∧）只是排版传统不同，遇到新教材先查 notation key。","pitfall":"~ 很 ‘sticky’：只黏住紧跟着它的那一块。~(A ∨ B) 与 ~A ∨ B 是不同命题。","hf":true},{"id":"logic-L6-inclusive-or","module":"logic","lecture":"L6","term":"Inclusive OR","zh":"包容性‘或’","def":"In this course ∨ is inclusive: A ∨ B is true when A is true, when B is true, or when both are true; it is false only when both are false.","defZh":"T ∨ T = T；只有 F ∨ F = F。不同于日常的 exclusive or（‘咖啡或茶，但不能两个都要’）。","pitfall":"教授明确提醒：两边都真时 OR 仍为真。","hf":false},{"id":"logic-L6-main-connective","module":"logic","lecture":"L6","term":"Main connective","zh":"主联结词","def":"The main connective is the outermost connective that joins the main parts of a proposition and determines the truth value of the whole.","defZh":"完成复杂真值表最关键的一步：先按括号拆成 chunks，从原子命题往上算，最后看主联结词那一列。","example":"(A \u0026 B) ∨ ~B：\u0026 连接 A 与 B，~ 只作用于 B，最外层的 ∨ 是主联结词。~(A \u0026 ~B) 的主联结词是最外面的 ~。","pitfall":"不要只看最左边的符号；主联结词由最外层括号结构决定。","hf":true},{"id":"logic-L6-logical-truth","module":"logic","lecture":"L6","term":"Logical truth (tautology)","zh":"逻辑真理 / 永真式","def":"A proposition is a logical truth if it is true under every possible valuation of its atomic propositions.","defZh":"主联结词那一列全是 T。","example":"A ∨ ~A；(A ⊃ B) ∨ (B ⊃ A)；(A \u0026 B) ∨ ~(A \u0026 B)。","pitfall":"Logical truth ≠ 事实上为真的命题；‘太阳明天升起’极可信，但不是逻辑真理。另外，句子才说 logical truth，论证要说 valid。","hf":true},{"id":"logic-L6-logical-falsehood","module":"logic","lecture":"L6","term":"Logical falsehood (contradiction)","zh":"逻辑假 / 矛盾式","def":"A proposition is a logical falsehood if it is false under every possible valuation of its atomic propositions.","defZh":"主联结词那一列全是 F，没有任何可能世界能让它成立。","example":"A \u0026 ~A；(~A \u0026 ~C) \u0026 (B \u0026 C)（同时要求 C 与 ~C，Quiz #2 Q4）。","hf":true},{"id":"logic-L6-contingent","module":"logic","lecture":"L6","term":"Contingent proposition (‘Neither’)","zh":"偶然命题（Quiz 选项中的 Neither）","def":"A proposition is contingent if it is true under some valuations and false under others.","defZh":"目标列既有 T 又有 F；真假取决于世界实际是什么样。","example":"A ∨ ~B（Quiz #2 Q1）；(A \u0026 C) ∨ ~(B ∨ A)（Q3）；(A \u0026 B) ∨ ~B。","pitfall":"‘Cannot determine’ 在这类题中永远不是答案——真值表总能给出判断。","hf":true},{"id":"logic-L6-shortcuts","module":"logic","lecture":"L6","term":"Truth-table shortcuts","zh":"真值表捷径","def":"If one side of the main connective settles the value, the other side need not be computed: T ∨ X = T, F \u0026 X = F, A ∨ ~A is always true, A \u0026 ~A is always false.","defZh":"教授特别强调：考试中重点是得到正确判断；能可靠看出永真/永假的结构就不必把无关列全部算完——但必须真的知道为什么。","formula":"T ∨ X = T;  F \u0026 X = F;  A ∨ ~A = T;  A \u0026 ~A = F","example":"Quiz #2 Q5：(A ∨ ~A) ∨ (B ∨ (~A \u0026 ~(B ∨ A)))，左边 A ∨ ~A 永真，T ∨ X = T → Logical truth。","pitfall":"T \u0026 X 和 F ∨ X 不能走捷径——它们的值取决于 X。例如 (A ∨ ~A) \u0026 B 是 contingent，(A \u0026 ~A) ∨ B 也是 contingent。","hf":true},{"id":"logic-L6-equivalence","module":"logic","lecture":"L6","term":"Logical equivalence (≡)","zh":"逻辑等价","def":"Two propositions are logically equivalent when they have the same truth value under every possible valuation.","defZh":"比较两条目标列，每一行都相同才算等价；文字可以完全不同。","formula":"A ⊃ B ≡ ~A ∨ B ≡ ~(A \u0026 ~B)","example":"~A ∨ B 与 ~(A \u0026 ~B) 等价（教授黑板推导：~A ∨ ~~B，再用 De Morgan）。","pitfall":"只要有一行不同就不等价；两个命题碰巧概率相同也不能反推逻辑等价。","hf":true},{"id":"logic-L6-de-morgan","module":"logic","lecture":"L6","term":"De Morgan\u0027s Laws","zh":"德摩根律","def":"The negation of a disjunction is equivalent to the conjunction of the negations, and the negation of a conjunction is equivalent to the disjunction of the negations.","defZh":"~ 穿过括号时必须同时做两件事：每一项都否定 + \u0026 与 ∨ 互换。本讲最重要、最容易翻车的规则。","formula":"~(A ∨ B) ≡ ~A \u0026 ~B\n~(A \u0026 B) ≡ ~A ∨ ~B","example":"A = I like apples，B = I like berries。~(A ∨ B)：两个都不喜欢；~(A \u0026 B)：并非两个都喜欢（至少一个不喜欢）。","pitfall":"不像乘法分配律：只把 ~ 分给 A、B 而忘了翻转联结词是最常见错误，例如把 ~(A \u0026 B) 写成 ~A \u0026 ~B。","hf":true},{"id":"logic-L6-double-negation","module":"logic","lecture":"L6","term":"Double negation","zh":"双重否定","def":"Two negations cancel: ~~A is equivalent to A; an even number of negations disappears and an odd number leaves one.","defZh":"可以在需要时加入或删除一对 ~。三个 ~ 等价于一个 ~。","formula":"~~A ≡ A","example":"‘It is not the case that Alice is not at home’ ≡ ‘Alice is at home’。","hf":false},{"id":"logic-L6-material-conditional","module":"logic","lecture":"L6","term":"Material conditional (⊃)","zh":"实质条件句","def":"The material conditional A ⊃ B (‘if A, then B’; A = antecedent, B = consequent) is false only when A is true and B is false; it is true in every other row.","defZh":"‘If A then B’ 只承诺：A 成立时 B 必须成立。唯一违约的情况是 A 真 B 假。前件为假时整个条件句为真。","formula":"A ⊃ B ≡ ~A ∨ B ≡ ~(A \u0026 ~B)","example":"‘If Professor Klein is literally a monkey, then cats can fly.’ 两部分都假，但条件句为真。提交作业却没收到确认邮件 → ‘If I submit, I receive an email’ 为假。","pitfall":"A ⊃ B 不等于条件概率 P(B|A)：前者结果只有 T/F，后者是 0–1 之间的数。教授因此在课程中少用 ⊃。","hf":true},{"id":"logic-L6-validity-logical-truth","module":"logic","lecture":"L6","term":"Validity ⇔ (premises conjunction ⊃ conclusion) is a logical truth","zh":"有效性与逻辑真理的联系","def":"An argument is valid if and only if the conditional whose antecedent is the conjunction of its premises and whose consequent is its conclusion is a logical truth.","defZh":"把全部前提用 \u0026 合并，再写成 ‘if premises then conclusion’。条件句唯一为假的情况是前件 T、后件 F，即前提全真结论假——而有效论证不允许这种情况，所以它永真。","formula":"P1, P2, P3 ⊨ C  iff  (P1 \u0026 P2 \u0026 P3) ⊃ C is a logical truth  iff  ~(P1 \u0026 P2 \u0026 P3) ∨ C is a logical truth","example":"Quiz #2 Q8：已知论证有效，问 ~(P1 \u0026 P2 \u0026 P3) ∨ C 是什么 → Logical truth。","pitfall":"用真值表判有效性：只看前提全为 T 的行，若其中有结论为 F 的行 → 无效。","hf":true},{"id":"logic-L8-x-or-not-x","module":"logic","lecture":"L8","term":"X ∨ ~X and X \u0026 ~X (X may be complex)","zh":"把复杂子命题当作 X","def":"For any proposition X, however complex, X ∨ ~X is a logical truth and X \u0026 ~X is a logical falsehood.","defZh":"先圈出完整子命题当作 X，再找主联结词，最后看形式。命题与其否定至少一个为真 → 永真；要求二者同真 → 永假。","example":"(A \u0026 B) ∨ ~(A \u0026 B)：令 X = (A \u0026 B)，即 X ∨ ~X → logical truth。(A ∨ B) \u0026 ~(A ∨ B) → logical falsehood。","pitfall":"X 不必是原子命题；看到长公式先找有没有 X 与 ~X 结构。","hf":false},{"id":"logic-L8-neither-notboth","module":"logic","lecture":"L8","term":"‘Neither’ vs ‘Not both’ (light-rail example)","zh":"‘两者都不’ vs ‘不能两者都’（轻轨例子）","def":"‘Neither A nor B’ is ~(A ∨ B), equivalent to ~A \u0026 ~B: both are false. ‘Not both A and B’ is ~(A \u0026 B), equivalent to ~A ∨ ~B: at least one is false.","defZh":"轻轨规则：V = 吸电子烟，D = 带狗。~(V ∨ D)：两样都不许，做任何一样都违规。~(V \u0026 D)：只是不许同时做，只有两样都做才违规。","formula":"Neither: ~(V ∨ D) ≡ ~V \u0026 ~D\nNot both: ~(V \u0026 D) ≡ ~V ∨ ~D","example":"某乘客只带狗不吸烟：违反 ~(V ∨ D)，但不违反 ~(V \u0026 D)。","pitfall":"口诀：Neither 是全灭，Not both 是不能双活。把 ~(V \u0026 D) 读成 ‘两项都不许做’ 是错的。","hf":true},{"id":"logic-L10-me-truth-table","module":"logic","lecture":"L10","term":"Truth-table test for mutual exclusivity","zh":"用真值表检验两个复合命题是否互斥","def":"Two compound propositions are mutually exclusive if and only if there is no row of their joint truth table in which both are true.","defZh":"并排写出两条目标列，看是否有任何一行同时为 T。没有 → 互斥；有一行就不互斥。同时为 F 的行不破坏互斥性。","example":"A \u0026 B 与 A \u0026 ~B：前者要求 B，后者要求 ~B，四行中没有一行同为 T → 互斥。A ∨ B 与 ~A ∨ ~B：A=T,B=F 时两者都真 → 不互斥。","pitfall":"真值表能检验逻辑上的互斥，但不能检验统计上的独立（independence 需要概率信息）。","hf":false},{"id":"logic-L10-equivalence-simplify","module":"logic","lecture":"L10","term":"Using logical equivalence to simplify","zh":"用逻辑等价化简","def":"Logically equivalent propositions have the same truth value in every case and therefore the same probability, so a compound can be replaced by a simpler equivalent.","defZh":"例如 (A \u0026 B) ∨ (A \u0026 ~B) ≡ A：A 真时 B 要么真要么假，恰有一支成立；A 假时两支都假。","formula":"(A \u0026 B) ∨ (A \u0026 ~B) ≡ A","example":"Weisberg Exercise 4：P(A \u0026 B) = 1/3，P(A \u0026 ~B) = 1/5，两支互斥可相加 → P(A) = 8/15，P(~A) = 7/15。","pitfall":"(A \u0026 B) ∨ (A \u0026 ~B) 不是 tautology（A 假时为假），它只是与 A 等价。全是 ∨ 或全是 \u0026 时才可随意重新分组（associativity）；混合 \u0026 与 ∨ 不能乱分配。","hf":false}],"mcq":[{"id":"logic-L1-q01","module":"logic","lecture":"L1","topic":"论证的定义","q":"In PHIL1005, an \u0027argument\u0027 is best defined as:","options":["A heated disagreement between two people","A set of premises offered as reasons to believe a conclusion","Any list of true statements about one topic","A conclusion backed by expert testimony"],"answer":1,"explain":"哲学中的 argument = 前提为结论提供理由。A 是日常意义的‘吵架’；C 只是陈述的罗列，没有支持关系；D 只是一种可能的前提来源。","hf":false},{"id":"logic-L1-q02","module":"logic","lecture":"L1","topic":"批判性思维的两个维度","q":"According to the course\u0027s formula, Critical Thinking = ?","options":["Reliable premises + good reasoning","True conclusions + confident belief","Valid arguments + appeals to authority","Good reasoning + memorised fallacy labels"],"answer":0,"explain":"课程开篇公式：Critical Thinking = Reliable Premises + Good Reasoning。认识论检查‘材料靠不靠谱’，逻辑与概率检查‘加工过程对不对’。","hf":false},{"id":"logic-L1-q03","module":"logic","lecture":"L1","topic":"论证重构","q":"\u0027Nanette says \"potato cakes\". Nanette is not from Tasmania. Therefore Nanette is from Victoria.\u0027 Which unstated premise does the reconstruction need?","options":["Everyone from Victoria says \"potato cakes\".","Only people from Victoria or Tasmania say \"potato cakes\".","Nanette once lived in Tasmania.","Most Australians say \"potato scallops\"."],"answer":1,"explain":"需要的是‘只有 Victoria 或 Tasmania 的人这么说’，加上‘不是 Tasmania’才能推出 Victoria。A 方向反了：‘所有 Victoria 人都说’ 不排除其他州的人也说。C、D 与推理无关。","hf":false},{"id":"logic-L1-q04","module":"logic","lecture":"L1","topic":"必要 vs 充分条件","q":"\u0027If you don\u0027t study, you won\u0027t pass PHIL1005. So if you study, you will pass.\u0027 What is the mistake?","options":["Treating a necessary condition as if it were sufficient","Treating a sufficient condition as if it were necessary","Using contradictory premises","Reading \u0027or\u0027 as exclusive"],"answer":0,"explain":"‘不学习就不能通过’说明学习是通过的必要条件；结论却把它当成充分条件（学习就一定通过）。这是 L1 教授的课堂例子。","hf":false},{"id":"logic-L1-q05","module":"logic","lecture":"L1","topic":"有效性不等于前提为真","q":"Someone reasons with perfectly valid steps from an old, false theory of disease. What does logic by itself guarantee?","options":["The conclusion is true","The premises are justified","Only that if the premises were true, the conclusion would have to be true","The argument is sound"],"answer":2,"explain":"逻辑只保证真值的传递：前提真则结论不能假。它不告诉你前提事实上是否正确，所以从错误理论出发仍会得到错误结论；不保证 sound。","hf":false},{"id":"logic-L4-q01","module":"logic","lecture":"L4","topic":"有效性定义","q":"An argument is valid if and only if:","options":["All of its premises and its conclusion are actually true","There is no possible situation in which all the premises are true and the conclusion is false","The conclusion is probably true given the premises","Its premises are true and relevant to the conclusion"],"answer":1,"explain":"Validity 的定义：不存在‘前提全真、结论为假’的可能情况。A 混淆了 validity 与真值；C 是概率支持，不是演绎有效；D 不是定义的一部分（矛盾前提的论证与话题无关也有效）。","hf":true},{"id":"logic-L4-q02","module":"logic","lecture":"L4","topic":"矛盾前提","q":"P1. The sky is blue. P2. The sky is not blue. Therefore, Cleo is a cat. This argument is:","options":["Invalid, because the premises are irrelevant to the conclusion","Invalid and unsound","Valid and sound","Valid but unsound"],"answer":3,"explain":"教授说几乎每年都考。P1 与 P2 矛盾，不可能同时为真，因此不存在‘前提全真且结论假’的世界 → 有效；但前提不可能全真 → 不健全。话题无关不影响有效性。","hf":true},{"id":"logic-L4-q03","module":"logic","lecture":"L4","topic":"矛盾前提","q":"Which of the following is always true of an argument whose premises contradict one another?","options":["It is invalid","It is valid, but it can never be sound","It is sound whenever its conclusion is true","Whether it is valid depends on its conclusion"],"answer":1,"explain":"矛盾前提无法全真 → 无反例世界 → 必然有效，且与结论是什么无关（排除 D）。Sound 要求所有前提事实上为真，矛盾前提做不到，所以永远不健全（排除 C）。","hf":true},{"id":"logic-L4-q04","module":"logic","lecture":"L4","topic":"矛盾前提","q":"Why does an argument with contradictory premises count as valid?","options":["Because any argument with a false premise is valid","Because the premises cannot all be true together, so there is no case with all premises true and the conclusion false","Because the conclusion must be a logical truth","Because the premises logically entail each other"],"answer":1,"explain":"关键是‘找不到反例世界’。A 错：假前提本身不决定有效与否（Klein 喝咖啡例子里的结构就无效）。C 错：结论可以是任意命题，例如 ‘Cleo is a cat’。D 无关。","hf":true},{"id":"logic-L4-q05","module":"logic","lecture":"L4","topic":"结论不可能为假","q":"P1. The sky is blue. P2. Hamburgers eat people. Therefore, Cleo is a cat or Cleo is not a cat. This argument is:","options":["Invalid, because the premises have nothing to do with Cleo","Invalid, because P2 is false","Valid, because the conclusion cannot be false; but unsound","Sound, because the conclusion is certainly true"],"answer":2,"explain":"结论 C ∨ ~C 不可能为假，所以不存在‘前提真、结论假’的情况 → 有效。P2 为假 → 不健全（排除 D）。假前提不导致无效（排除 B）。","hf":true},{"id":"logic-L4-q06","module":"logic","lecture":"L4","topic":"有效 vs 健全","q":"P1. All cats can fly. P2. Cleo is a cat. Therefore, Cleo can fly. This argument is:","options":["Valid and sound","Invalid and unsound","Invalid but sound","Valid but unsound"],"answer":3,"explain":"在‘所有猫都会飞且 Cleo 是猫’的假想世界里 Cleo 必然会飞 → 有效；P1 事实上为假 → 不健全。‘Invalid but sound’ 本身不可能（sound 要求 valid）。","hf":false},{"id":"logic-L4-q07","module":"logic","lecture":"L4","topic":"真前提真结论但无效","q":"P1. Professor Klein drinks coffee. P2. Professor Klein eats yoghurt. Therefore, Professor Klein has a cat. Suppose all three statements are in fact true. The argument is:","options":["Valid, because every statement is true","Sound, because every statement is true","Invalid, because we can coherently imagine the premises true and the conclusion false","Invalid, because the premises are false"],"answer":2,"explain":"可以想象：喝咖啡 T、吃酸奶 T、没有猫——这就是反例世界，所以无效；无效论证也不可能 sound。题目设定前提为真，D 错。","hf":false},{"id":"logic-L4-q08","module":"logic","lecture":"L4","topic":"健全性定义","q":"A sound argument is:","options":["Any argument with a true conclusion","A valid argument whose premises are all actually true","Any argument whose premises are all true","An argument with no hidden premises"],"answer":1,"explain":"Sound = valid + 所有前提事实上为真。C 缺少 valid 条件（Klein 例子前提都真但无效）。","hf":false},{"id":"logic-L4-q09","module":"logic","lecture":"L4","topic":"有效论证的推论","q":"An argument is valid, and its conclusion is false. What can we conclude?","options":["At least one premise is false","All of the premises are false","The argument is actually invalid","Nothing at all"],"answer":0,"explain":"若所有前提都真，有效性保证结论为真；现在结论假，所以不可能所有前提都真 → 至少一个前提为假。但不必全部为假（B 过强）。","hf":false},{"id":"logic-L4-q10","module":"logic","lecture":"L4","topic":"有效性组合","q":"Which combination is impossible?","options":["Valid, with false premises and a false conclusion","Valid, with all premises true and a false conclusion","Invalid, with true premises and a true conclusion","Valid, with false premises and a true conclusion"],"answer":1,"explain":"B 正是有效性定义所排除的情况。A：猫会飞类论证可以如此；C：Klein 例子；D：例如 ‘All cats are dogs; all dogs are mammals; ∴ all cats are mammals’——前提假、结论真，但有效。假前提的有效论证，结论可真可假。","hf":true},{"id":"logic-L4-q11","module":"logic","lecture":"L4","topic":"隐含前提","q":"P1. Cleo is both active and full of mischief. P2. If a cat is full of mischief, it will cause trouble. P3. If a cat will cause trouble, you should keep an eye on it. Therefore, you should keep an eye on Cleo. Strictly speaking:","options":["The argument is valid as stated","The argument is valid but unsound because cats are not mischievous","The argument is invalid; it needs the premise \u0027Cleo is active\u0027","The argument is invalid; it needs the premise \u0027Cleo is a cat\u0027"],"answer":3,"explain":"P2、P3 只谈‘猫’，但没说 Cleo 是猫。反例世界：Cleo 淘气但不是猫，前提全真而结论无依据 → 无效。补上桥梁前提 ‘Cleo is a cat’ 才连通。‘Cleo is active’ 已在 P1 中。","hf":false},{"id":"logic-L4-q12","module":"logic","lecture":"L4","topic":"诉诸权威与重构","q":"\u0027Taylor Swift says string theory is false. Therefore, string theory is false.\u0027 After adding \u0027Relevant authorities should be trusted\u0027 and \u0027Taylor Swift is an authority on string theory\u0027, the argument is best described as:","options":["Valid but unsound, because an added premise is false","Invalid, because appeals to authority are always fallacies","Sound","Still invalid, because the added premises are irrelevant"],"answer":0,"explain":"补全后形式有效；但 ‘Taylor Swift 是弦理论权威’ 为假 → 不健全。教授强调 appeal to authority 并不自动无效，关键在权威是否相关、可靠。","hf":false},{"id":"logic-L4-q13","module":"logic","lecture":"L4","topic":"反例法","q":"To show that \u0027If it rained, the street is wet. The street is wet. Therefore, it rained.\u0027 is invalid, you should describe a situation in which:","options":["It rained and the street is wet","The street is wet (say, from a sprinkler), the conditional still holds, but it did not rain","The street is dry and it did not rain","It rained but the street stayed dry"],"answer":1,"explain":"反例必须让所有前提为真且结论为假：条件句为真、街湿（前提全真），但没下雨（结论假）。D 让前提 1 变假，不是反例。真值表验算：A ⊃ B, B ∴ A 在 A=F, B=T 行前提全 T、结论 F。","hf":true},{"id":"logic-L4-q14","module":"logic","lecture":"L4","topic":"互斥不传递","q":"A and B are mutually exclusive, and B and C are mutually exclusive. Does it follow that A and C are mutually exclusive?","options":["Yes, mutual exclusivity is always transitive","No; e.g. A = \u0027I saw Venus\u0027, B = \u0027I saw Mars\u0027, C = \u0027I saw the Morning Star\u0027","Yes, provided all three have the same probability","No; A and C must then be compatible"],"answer":1,"explain":"Morning Star 就是 Venus，所以 A 与 C 可以同真 → 互斥不传递。但也不能反过来推出 A 与 C 一定相容（D 错）——只是信息不足。","hf":false},{"id":"logic-L4-q15","module":"logic","lecture":"L4","topic":"蕴涵传递","q":"A logically entails B, and B logically entails C. Which follows?","options":["A logically entails C","C logically entails A","A and C are mutually exclusive","Nothing follows about A and C"],"answer":0,"explain":"A 真时 B 不可能假，B 真时 C 不可能假 → A 真时 C 不可能假。蕴涵可以接力，互斥不能。反方向（C 蕴涵 A）不成立。","hf":false},{"id":"logic-L4-q16","module":"logic","lecture":"L4","topic":"有效性与蕴涵","q":"An argument with premises P1, P2, P3 and conclusion C is valid if and only if:","options":["Each premise on its own entails C","The conjunction P1 \u0026 P2 \u0026 P3 logically entails C","C logically entails P1 \u0026 P2 \u0026 P3","P1, P2 and P3 are mutually exclusive"],"answer":1,"explain":"把所有前提用 and 合并，论证有效 ⇔ 这个合取命题逻辑蕴涵结论。A 要求过强（Potato cakes 论证中单个前提都推不出结论）。C 方向反了。","hf":false},{"id":"logic-L6-q01","module":"logic","lecture":"L6","topic":"真值表行数","q":"How many rows does a full truth table need for a proposition containing the atomic propositions A, B and C?","options":["6","8","9","16"],"answer":1,"explain":"n 个原子命题 → 2ⁿ 行：2³ = 8。","hf":false},{"id":"logic-L6-q02","module":"logic","lecture":"L6","topic":"真值表行数","q":"How many rows does a full truth table need for ((A \u0026 ~B) ∨ ~(A ∨ B)) ⊃ ~~A ?","options":["4","8","16","32"],"answer":0,"explain":"行数只取决于不同原子命题的个数（A、B 两个）→ 2² = 4，与联结词数量无关。这是笔记列出的常见错误。","hf":false},{"id":"logic-L6-q03","module":"logic","lecture":"L6","topic":"主联结词","q":"What is the main connective of (A \u0026 B) ∨ ~B ?","options":["\u0026","~","∨","There is no main connective"],"answer":2,"explain":"\u0026 只连接 A 与 B，~ 只作用于 B，最外层的 ∨ 把 (A \u0026 B) 与 ~B 两大块连接起来，所以 ∨ 是主联结词。","hf":true},{"id":"logic-L6-q04","module":"logic","lecture":"L6","topic":"主联结词","q":"What is the main connective of ~(A ∨ B) \u0026 C ?","options":["~","∨","\u0026","⊃"],"answer":2,"explain":"~ 只作用于括号 (A ∨ B)；最外层把 ~(A ∨ B) 与 C 连接起来的是 \u0026。不要因为 ~ 在最左边就选它。","hf":true},{"id":"logic-L6-q05","module":"logic","lecture":"L6","topic":"命题分类","q":"Classify A ∨ ~B.","options":["Logical truth","Logical falsehood","Contingent (neither)","Cannot be determined"],"answer":2,"explain":"逐行：TT→T，TF→T，FT→F，FF→T。有 T 有 F → contingent（Quiz #2 Q1）。‘Cannot determine’ 永远不是这类题的答案。","hf":true},{"id":"logic-L6-q06","module":"logic","lecture":"L6","topic":"命题分类","q":"Classify (A \u0026 C) ∨ ~(B ∨ A).","options":["Logical truth","Logical falsehood","Contingent (neither)","Cannot be determined without more information"],"answer":2,"explain":"8 行中为真的行：A,B,C = TTT、TFT（A\u0026C 真）、FFT、FFF（B∨A 假，其否定真），共 4 行；例如 TTF 行：A\u0026C=F，~(B∨A)=F → F。有 T 有 F → contingent（Quiz #2 Q3）。","hf":true},{"id":"logic-L6-q07","module":"logic","lecture":"L6","topic":"命题分类","q":"Classify (~A \u0026 ~C) \u0026 (B \u0026 C).","options":["Logical truth","Cannot be determined","Contingent (neither)","Logical falsehood"],"answer":3,"explain":"左边要求 ~C（C 假），右边要求 C 真；整体是 \u0026 连接，需要 C 与 ~C 同时成立 → 每行都假 → logical falsehood（Quiz #2 Q4）。","hf":true},{"id":"logic-L6-q08","module":"logic","lecture":"L6","topic":"捷径","q":"Classify (A ∨ ~A) ∨ (B ∨ (~A \u0026 ~(B ∨ A))).","options":["Logical truth","Logical falsehood","Contingent (neither)","Cannot be determined without the full 8-row table"],"answer":0,"explain":"主联结词是中间的 ∨；左边 A ∨ ~A 永真，T ∨ X = T，右边不用算 → logical truth（Quiz #2 Q5，教授的‘秒杀’捷径）。","hf":true},{"id":"logic-L6-q09","module":"logic","lecture":"L6","topic":"捷径","q":"Classify (A \u0026 ~A) \u0026 (B ∨ C).","options":["Logical truth","Cannot be determined","Contingent (neither)","Logical falsehood"],"answer":3,"explain":"主联结词是 \u0026，左边 A \u0026 ~A 永假，F \u0026 X = F → 每行都假 → logical falsehood。","hf":true},{"id":"logic-L6-q10","module":"logic","lecture":"L6","topic":"捷径陷阱","q":"Classify (A \u0026 ~A) ∨ B.","options":["Logical truth","Logical falsehood","Contingent (neither)","Cannot be determined"],"answer":2,"explain":"陷阱：左边永假，但 F ∨ X = X，不是捷径。整体真值等于 B：B=T 时真，B=F 时假 → contingent。只有 T ∨ X 和 F \u0026 X 能直接定值。","hf":true},{"id":"logic-L6-q11","module":"logic","lecture":"L6","topic":"捷径","q":"Which of the following shortcut rules is correct?","options":["T \u0026 X = T","F ∨ X = F","T ∨ X = T","F ⊃ X = F"],"answer":2,"explain":"T ∨ X = T 正确。T \u0026 X 与 F ∨ X 都等于 X 本身，取决于 X；F ⊃ X 实际上永远为 T（前件假，条件句真）。","hf":true},{"id":"logic-L6-q12","module":"logic","lecture":"L6","topic":"实质条件句","q":"In which row is A ⊃ B false?","options":["A false, B true","A true, B true","A false, B false","A true, B false"],"answer":3,"explain":"Material conditional 只有一种违约情况：前件 A 真，后件 B 假。其余三行都为真。","hf":true},{"id":"logic-L6-q13","module":"logic","lecture":"L6","topic":"前件为假","q":"\u0027If Professor Klein is literally a monkey, then cats can fly.\u0027 Read as a material conditional, with both parts false, the sentence is:","options":["False","Impossible to evaluate","Neither true nor false","True"],"answer":3,"explain":"前件为假时 material conditional 为真：没有出现‘A 成立但 B 不成立’的违约情况。这正是 ⊃ 最反直觉的地方。","hf":false},{"id":"logic-L6-q14","module":"logic","lecture":"L6","topic":"条件等价","q":"Which proposition is logically equivalent to A ⊃ B?","options":["A ∨ ~B","~A \u0026 B","~A ∨ B","B ⊃ A"],"answer":2,"explain":"A ⊃ B 列：T F T T；~A ∨ B 列：T F T T，完全相同（Quiz #2 Q7）。A ∨ ~B 与 B ⊃ A 是‘反方向’的条件（列为 T T F T）；~A \u0026 B 只有 FT 行为真。","hf":true},{"id":"logic-L6-q15","module":"logic","lecture":"L6","topic":"条件等价","q":"Which proposition is logically equivalent to A ⊃ B?","options":["~(A \u0026 ~B)","~(A ∨ ~B)","~A \u0026 ~B","A \u0026 ~B"],"answer":0,"explain":"A ⊃ B 只排除‘A 真 B 假’这一个世界，即 ~(A \u0026 ~B)。逐行：TT→T，TF→F，FT→T，FF→T，与 A ⊃ B 相同。A \u0026 ~B 恰好是 A ⊃ B 的否定。","hf":true},{"id":"logic-L6-q16","module":"logic","lecture":"L6","topic":"De Morgan","q":"~(A ∨ B) is logically equivalent to:","options":["~A ∨ ~B","A \u0026 B","~A ∨ B","~A \u0026 ~B"],"answer":3,"explain":"De Morgan：否定穿过括号，每项都否定 + ∨ 变 \u0026。~A ∨ ~B 是只否定不翻转的典型错误（它等价于 ~(A \u0026 B)）。","hf":true},{"id":"logic-L6-q17","module":"logic","lecture":"L6","topic":"De Morgan","q":"~(A \u0026 B) is logically equivalent to:","options":["~A \u0026 ~B","~A \u0026 B","~A ∨ ~B","~(A ∨ B)"],"answer":2,"explain":"~(A \u0026 B) ≡ ~A ∨ ~B。~A \u0026 ~B（等价于 ~(A ∨ B)）在 A=T,B=F 行为假，而 ~(A \u0026 B) 为真，故不等价。","hf":true},{"id":"logic-L6-q18","module":"logic","lecture":"L6","topic":"De Morgan 应用","q":"Using double negation and De Morgan\u0027s Laws, ~(A ∨ ~B) is equivalent to:","options":["~A ∨ B","~A \u0026 B","~A \u0026 ~B","A \u0026 ~B"],"answer":1,"explain":"~(A ∨ ~B) ≡ ~A \u0026 ~~B ≡ ~A \u0026 B。逐行验算：只有 A=F,B=T 时 A ∨ ~B 为假，其否定为真；~A \u0026 B 也只在该行为真。","hf":true},{"id":"logic-L6-q19","module":"logic","lecture":"L6","topic":"括号与否定","q":"Are ~(A ∨ B) and ~A ∨ B the same proposition?","options":["Yes, they are identical","No, because both are logical falsehoods","Yes, by De Morgan\u0027s Laws","No: in the first, ~ applies to the whole disjunction; in the second, only to A"],"answer":3,"explain":"‘The NOT is very sticky’：没有括号时 ~ 只黏住 A。A=F,B=T 行：~(A ∨ B)=F，~A ∨ B=T，二者不等价；两者都是 contingent。","hf":false},{"id":"logic-L6-q20","module":"logic","lecture":"L6","topic":"Inclusive OR","q":"A = \u0027I like apples\u0027, B = \u0027I like berries\u0027. If I like both, then in this course A ∨ B is:","options":["True","False, because \u0027or\u0027 means exactly one","Neither true nor false","True only if the speaker intended inclusive or"],"answer":0,"explain":"本课程的 ∨ 是 inclusive OR：T ∨ T = T，只有两边都假时才假。","hf":false},{"id":"logic-L6-q21","module":"logic","lecture":"L6","topic":"逻辑等价定义","q":"Two propositions are logically equivalent if and only if:","options":["They have the same truth value in every row of the truth table","They have the same truth value in at least one row","They are both true in the actual world","The first logically entails the second"],"answer":0,"explain":"必须每一行都相同。C 只是事实上同真；D 只是单向蕴涵（例如 A \u0026 B 蕴涵 A，但二者不等价）。","hf":true},{"id":"logic-L6-q22","module":"logic","lecture":"L6","topic":"有效性与逻辑真理","q":"An argument with premises P1, P2, P3 and conclusion C is valid. What is (P1 \u0026 P2 \u0026 P3) ⊃ C?","options":["A logical truth","A logical falsehood","Contingent","Cannot be determined"],"answer":0,"explain":"条件句唯一为假的情况是前件 T、后件 F，也就是前提全真而结论假；有效论证排除了这种情况 → 每行都真 → logical truth（Quiz #2 Q8）。","hf":true},{"id":"logic-L6-q23","module":"logic","lecture":"L6","topic":"有效性与逻辑真理","q":"If the argument P1, P2, P3 ∴ C is valid, which of the following must be a logical truth?","options":["~(P1 \u0026 P2 \u0026 P3) ∨ C","(P1 \u0026 P2 \u0026 P3) \u0026 ~C","(P1 \u0026 P2 \u0026 P3) ∨ ~C","C ⊃ (P1 \u0026 P2 \u0026 P3)"],"answer":0,"explain":"由 X ⊃ Y ≡ ~X ∨ Y，(P1 \u0026 P2 \u0026 P3) ⊃ C ≡ ~(P1 \u0026 P2 \u0026 P3) ∨ C。B 恰是反例情况，对有效论证是 logical falsehood；C、D 不必为真（结论真不保证前提真）。","hf":true},{"id":"logic-L6-q24","module":"logic","lecture":"L6","topic":"真值表判有效性","q":"Test with a truth table: A ∨ B, ~A ∴ B.","options":["Valid","Invalid; counterexample A = T, B = F","Invalid; counterexample A = F, B = F","It cannot be tested with a truth table"],"answer":0,"explain":"前提全真的行只有 A=F, B=T（A ∨ B 真、~A 真），该行 B 为真 → 无反例 → 有效。A=T,B=F 时 ~A 假；A=F,B=F 时 A ∨ B 假，都不是反例。","hf":true},{"id":"logic-L6-q25","module":"logic","lecture":"L6","topic":"真值表判有效性","q":"Test with a truth table: A ⊃ B, B ∴ A.","options":["Valid","Valid but unsound","Invalid; counterexample A = T, B = F","Invalid; counterexample A = F, B = T"],"answer":3,"explain":"前提全真的行：TT 与 FT。FT 行中 A ⊃ B 为真、B 为真，结论 A 为假 → 反例 → 无效。TF 行 A ⊃ B 为假，不是反例。","hf":true},{"id":"logic-L6-q26","module":"logic","lecture":"L6","topic":"真值表判有效性","q":"Test with a truth table: A ⊃ B, ~B ∴ ~A.","options":["Valid","Invalid; counterexample A = T, B = F","Invalid; counterexample A = F, B = F","Invalid; counterexample A = F, B = T"],"answer":0,"explain":"前提全真的行只有 A=F, B=F（A ⊃ B 真、~B 真），该行 ~A 为真 → 有效。A=T,B=F 时 A ⊃ B 为假，不是反例；A=F,B=T 时 ~B 为假。","hf":false},{"id":"logic-L6-q27","module":"logic","lecture":"L6","topic":"条件句 vs 条件概率","q":"Which statement about A ⊃ B and the conditional probability P(B|A) is correct?","options":["They express the same thing","A ⊃ B always takes the value T or F, whereas P(B|A) is a number between 0 and 1","P(B|A) = 1 whenever A is false, just like A ⊃ B","A ⊃ B is true only if A causes B"],"answer":1,"explain":"⊃ 是真值联结词，结果只有 T/F；条件概率是‘已知 A 时 B 的概率’，可以是 0.2、0.95 等。教授因此在课程中少用 ⊃ 以免混淆。⊃ 也不表达因果。","hf":false},{"id":"logic-L6-q28","module":"logic","lecture":"L6","topic":"逐行求值","q":"What is the truth value of (A \u0026 B) ∨ ~B when A is false and B is true?","options":["True","False","Neither","It depends on C"],"answer":1,"explain":"A \u0026 B = F \u0026 T = F；~B = F；F ∨ F = F。","hf":false},{"id":"logic-L6-q29","module":"logic","lecture":"L6","topic":"自然语言翻译","q":"Let A = \u0027Alice is at home\u0027 and B = \u0027Bob is at home\u0027. Translate \u0027Alice is at home but Bob is not.\u0027","options":["A \u0026 ~B","~(A \u0026 B)","A ∨ ~B","~A \u0026 B"],"answer":0,"explain":"‘but’ 在逻辑中表示合取 \u0026；‘Bob is not’ = ~B。~(A \u0026 B) 只是‘不都在家’，范围更宽；A ∨ ~B 是析取。","hf":false},{"id":"logic-L6-q30","module":"logic","lecture":"L6","topic":"自然语言翻译","q":"Let S = \u0027I submit the assignment\u0027 and E = \u0027I receive a confirmation email\u0027. \u0027If I submit the assignment, then I receive a confirmation email\u0027 is S ⊃ E. Which situation makes it false?","options":["I don\u0027t submit and receive no email","I submit and receive no email","I don\u0027t submit but receive an email","I submit and receive the email"],"answer":1,"explain":"S ⊃ E 唯一为假的情况：S 真、E 假，即‘提交了却没收到邮件’。没提交时（S 假）条件句为真。","hf":false},{"id":"logic-L6-q31","module":"logic","lecture":"L6","topic":"术语使用","q":"Which statement uses the course\u0027s terminology correctly?","options":["\u0027The argument A, ~A ∴ C is a logical truth.\u0027","\u0027The sentence A ∨ ~A is a logical truth, and the argument A, ~A ∴ C is valid.\u0027","\u0027The sentence A ⊃ B is valid.\u0027","\u0027The argument A ∨ B ∴ A is contingent.\u0027"],"answer":1,"explain":"句子（命题）才分 logical truth / falsehood / contingent；论证才说 valid / invalid。A ∨ ~A 永真；A, ~A ∴ C 前提矛盾 → 有效。","hf":false},{"id":"logic-L8-q01","module":"logic","lecture":"L8","topic":"X ∨ ~X","q":"Classify (A \u0026 B) ∨ ~(A \u0026 B).","options":["Logical truth","Logical falsehood","Contingent","Cannot be determined without a 4-row table"],"answer":0,"explain":"令 X = (A \u0026 B)，原式是 X ∨ ~X，无论 X 真假都为真 → logical truth。逐行验算 A \u0026 B 列 T F F F，其否定 F T T T，析取全 T。","hf":false},{"id":"logic-L8-q02","module":"logic","lecture":"L8","topic":"X \u0026 ~X","q":"Classify (A ∨ B) \u0026 ~(A ∨ B).","options":["Logical falsehood","Logical truth","Contingent","Cannot be determined"],"answer":0,"explain":"令 X = (A ∨ B)，原式是 X \u0026 ~X，要求 X 与其否定同真 → 每行都假 → logical falsehood。","hf":false},{"id":"logic-L8-q03","module":"logic","lecture":"L8","topic":"轻轨例子 not both","q":"A light-rail rule says ~(V \u0026 D), where V = \u0027you vape\u0027 and D = \u0027you bring a dog\u0027. Which passenger breaks the rule?","options":["One who vapes but brings no dog","One who brings a dog but does not vape","One who both vapes and brings a dog","One who does neither"],"answer":2,"explain":"~(V \u0026 D) ≡ ~V ∨ ~D：只禁止两者同时发生。只有 V 与 D 都真时规则为假（被违反）；单独吸烟或单独带狗都与规则相容。","hf":true},{"id":"logic-L8-q04","module":"logic","lecture":"L8","topic":"轻轨例子 neither","q":"A stricter rule says ~(V ∨ D). A passenger brings a dog but does not vape. Does the passenger comply?","options":["Yes, because they do not do both","No, because ~(V ∨ D) ≡ ~V \u0026 ~D forbids each one","Yes, because ~(V ∨ D) ≡ ~V ∨ ~D","It cannot be determined"],"answer":1,"explain":"~(V ∨ D) = ‘既不能吸电子烟，也不能带狗’；D 为真则 V ∨ D 为真，其否定为假 → 违规。C 是 De Morgan 没有翻转联结词的错误写法。","hf":true},{"id":"logic-L8-q05","module":"logic","lecture":"L8","topic":"not both 翻译","q":"Which formula symbolises \u0027Not both A and B\u0027?","options":["~A \u0026 ~B","~A \u0026 B","~(A ∨ B)","~(A \u0026 B)"],"answer":3,"explain":"Not both = ~(A \u0026 B) ≡ ~A ∨ ~B，至少一个为假。~A \u0026 ~B 与 ~(A ∨ B) 都表示‘两者都不’（neither）。","hf":true},{"id":"logic-L8-q06","module":"logic","lecture":"L8","topic":"neither 翻译","q":"Which formula symbolises \u0027Neither A nor B\u0027?","options":["~(A \u0026 B)","~A ∨ ~B","~A \u0026 ~B","~(A ∨ ~B)"],"answer":2,"explain":"Neither A nor B：A 假且 B 假 = ~A \u0026 ~B ≡ ~(A ∨ B)。~(A \u0026 B) 与 ~A ∨ ~B 是 not both。","hf":true},{"id":"logic-L8-q07","module":"logic","lecture":"L8","topic":"De Morgan 常见错误","q":"A student rewrites ~(V \u0026 D) as ~V \u0026 ~D. (Some notes write this as ¬(V ∧ D) and ¬V ∧ ¬D; same meaning.) What went wrong?","options":["Nothing; the rewrite is correct","It should be ~(V ∨ D)","The negations should have been dropped: V ∨ D","The \u0026 should have become ∨: the correct form is ~V ∨ ~D"],"answer":3,"explain":"移动否定号时必须同时否定每一项并翻转联结词。~V \u0026 ~D 实际等价于 ~(V ∨ D)，比原规则更严格（禁止单独做任何一项）。","hf":true},{"id":"logic-L10-q01","module":"logic","lecture":"L10","topic":"真值表检验互斥","q":"Using a truth table, what is the relationship between A \u0026 B and A \u0026 ~B?","options":["Mutually exclusive: no row makes both true","Not mutually exclusive, because both are false when A is false","Logically equivalent","Each is a logical falsehood"],"answer":0,"explain":"一个要求 B，另一个要求 ~B，四行中没有一行同时为 T → 互斥。两者同时为 F 的行不破坏互斥性（B 错）。它们都是 contingent。","hf":false},{"id":"logic-L10-q02","module":"logic","lecture":"L10","topic":"真值表检验互斥","q":"Are A ∨ B and ~A ∨ ~B mutually exclusive?","options":["Yes, because one is the negation of the other","No, because both are logical truths","Yes, because they never have the same truth value","No: both are true whenever exactly one of A, B is true"],"answer":3,"explain":"A=T,B=F：A ∨ B=T，~A ∨ ~B=T；A=F,B=T 同理 → 有 2 行同真 → 不互斥。~A ∨ ~B 是 ~(A \u0026 B)，不是 A ∨ B 的否定（其否定是 ~A \u0026 ~B）。","hf":false},{"id":"logic-L10-q03","module":"logic","lecture":"L10","topic":"互斥的含义","q":"Which is true of mutually exclusive propositions?","options":["Exactly one of them must be true","They must have equal probability","They must be probabilistically independent","They can both be false; they just cannot both be true"],"answer":3,"explain":"互斥只排除‘同真’。同一次掷骰 ‘掷出 2’ 与 ‘掷出 3’ 互斥，掷出 5 时二者同假。非零概率的互斥事件反而不独立。","hf":false},{"id":"logic-L10-q04","module":"logic","lecture":"L10","topic":"逻辑等价化简","q":"(A \u0026 B) ∨ (A \u0026 ~B) is:","options":["A logical truth","A logical falsehood","Logically equivalent to A (and contingent)","Logically equivalent to B"],"answer":2,"explain":"A 真时 B 要么真要么假，恰好一支成立 → 真；A 假时两支都假 → 假。所以与 A 每行同值，等价于 A；A 假时为假，故不是 tautology。","hf":false},{"id":"logic-L10-q05","module":"logic","lecture":"L10","topic":"等价用于概率","q":"P(A \u0026 B) = 1/3 and P(A \u0026 ~B) = 1/5. Using mutual exclusivity and logical equivalence, what is P(A)?","options":["1/15","8/15","2/15","7/15"],"answer":1,"explain":"A \u0026 B 与 A \u0026 ~B 互斥 → 可相加：1/3 + 1/5 = 5/15 + 3/15 = 8/15；又 (A \u0026 B) ∨ (A \u0026 ~B) ≡ A，所以 P(A) = 8/15。1/15 是错误相乘；7/15 是 P(~A)。","hf":false},{"id":"logic-L10-q06","module":"logic","lecture":"L10","topic":"真值表检验互斥","q":"Which pair of propositions is mutually exclusive?","options":["A ⊃ B and ~A","A \u0026 B and ~B ∨ C","~(A \u0026 B) and A","A ⊃ B and A \u0026 ~B"],"answer":3,"explain":"A \u0026 ~B 恰是 A ⊃ B 唯一为假的情况，二者互为否定，没有一行同真。A ⊃ B 与 ~A 在 A=F 时同真；~(A \u0026 B) 与 A 在 A=T,B=F 时同真；A \u0026 B 与 ~B ∨ C 在 A,B,C 全真时同真。","hf":false}],"calc":[{"id":"logic-L6-c01","module":"logic","lecture":"L6","topic":"命题分类（真值表）","q":"Classify the proposition (A \u0026 C) ∨ ~(B ∨ A) by truth table.","steps":[{"label":"行数","prompt":"How many rows does the full truth table need?","answer":8,"tol":0.01,"hint":"三个原子命题 A, B, C → 2³"},{"label":"A=F, B=F, C=T 行","prompt":"Value of the whole proposition when A = F, B = F, C = T? (enter 1 = true, 0 = false)","answer":1,"tol":0.01,"hint":"A \u0026 C = F；B ∨ A = F，所以 ~(B ∨ A) = T"},{"label":"A=T, B=T, C=F 行","prompt":"Value of the whole proposition when A = T, B = T, C = F? (enter 1 = true, 0 = false)","answer":0,"tol":0.01,"hint":"A \u0026 C = F；B ∨ A = T，所以 ~(B ∨ A) = F"},{"label":"分类","prompt":"Classify it: enter 1 = logical truth, 2 = logical falsehood, 3 = contingent.","answer":3,"tol":0.01,"hint":"目标列既有 T 又有 F"}],"final":"Contingent (neither): true in 4 of 8 rows, false in the other 4.","work":"Atoms A, B, C -\u003e 2^3 = 8 rows. Main connective: the middle ∨.\nA B C | A\u0026C | B∨A | ~(B∨A) | whole\nT T T |  T  |  T  |   F    |  T\nT T F |  F  |  T  |   F    |  F\nT F T |  T  |  T  |   F    |  T\nT F F |  F  |  T  |   F    |  F\nF T T |  F  |  T  |   F    |  F\nF T F |  F  |  T  |   F    |  F\nF F T |  F  |  F  |   T    |  T\nF F F |  F  |  F  |   T    |  T\nThe final column contains both T and F, so the proposition is contingent.","explain":"Quiz #2 Q3 原题。先找主联结词 ∨，再分别算 A \u0026 C 与 ~(B ∨ A) 两块。注意 ~ 作用于整个括号 (B ∨ A)。只要找到一行 T、一行 F 就能判定 contingent。","table":null},{"id":"logic-L6-c02","module":"logic","lecture":"L6","topic":"命题分类（真值表）","q":"Classify the proposition (~A \u0026 ~C) \u0026 (B \u0026 C).","steps":[{"label":"行数","prompt":"How many rows does the full truth table need?","answer":8,"tol":0.01,"hint":"原子命题 A, B, C"},{"label":"为真的行数","prompt":"In how many rows is the whole proposition true?","answer":0,"tol":0.01,"hint":"左边要求 C 为假，右边要求 C 为真"},{"label":"分类","prompt":"Classify it: enter 1 = logical truth, 2 = logical falsehood, 3 = contingent.","answer":2,"tol":0.01,"hint":"全 F"}],"final":"Logical falsehood (false in all 8 rows).","work":"Atoms A, B, C -\u003e 8 rows. Main connective: the middle \u0026.\nFor the whole to be true, both ~A \u0026 ~C and B \u0026 C must be true.\n~A \u0026 ~C requires C = F; B \u0026 C requires C = T.\nNo row can make C both true and false, so every row is F.\nTherefore the proposition is a logical falsehood.","explain":"Quiz #2 Q4。不必画满 8 行：主联结词是 \u0026，两块分别要求 ~C 和 C，等于隐含了 C \u0026 ~C 结构 → 永假。","table":null},{"id":"logic-L6-c03","module":"logic","lecture":"L6","topic":"命题分类（含 ⊃）","q":"Classify the proposition (A ⊃ B) ∨ (B ⊃ A).","steps":[{"label":"行数","prompt":"How many rows does the full truth table need?","answer":4,"tol":0.01,"hint":"两个原子命题"},{"label":"A=T, B=F 行","prompt":"When A = T and B = F, what is the value of the whole proposition? (enter 1 = true, 0 = false)","answer":1,"tol":0.01,"hint":"A ⊃ B = F，但 B ⊃ A = T（前件 B 为假）"},{"label":"分类","prompt":"Classify it: enter 1 = logical truth, 2 = logical falsehood, 3 = contingent.","answer":1,"tol":0.01,"hint":"检查每一行是否至少有一边为真"}],"final":"Logical truth (true in all 4 rows).","work":"A B | A⊃B | B⊃A | (A⊃B)∨(B⊃A)\nT T |  T  |  T  |  T\nT F |  F  |  T  |  T\nF T |  T  |  F  |  T\nF F |  T  |  T  |  T\nA ⊃ B is false only in row TF, and B ⊃ A is false only in row FT, so in every row at least one disjunct is true. Logical truth.","explain":"⊃ 只在‘前件真、后件假’时为假；两个方向的条件句不会在同一行同时为假，所以析取永真。注意 B ⊃ A 的前件是 B。","table":null},{"id":"logic-L6-c04","module":"logic","lecture":"L6","topic":"真值表判有效性","q":"Use a truth table to decide whether the argument \u0027A ⊃ B, B, therefore A\u0027 is valid.","steps":[{"label":"行数","prompt":"How many rows does the truth table need?","answer":4,"tol":0.01,"hint":"原子命题 A, B"},{"label":"前提全真的行数","prompt":"In how many rows are ALL premises true?","answer":2,"tol":0.01,"hint":"A ⊃ B 与 B 同时为真：TT 与 FT"},{"label":"反例行数","prompt":"Among those rows, in how many is the conclusion false?","answer":1,"tol":0.01,"hint":"看 FT 行的 A"},{"label":"判定","prompt":"Is the argument valid? (enter 1 = valid, 0 = invalid)","answer":0,"tol":0.01,"hint":"存在前提全真、结论假的行 → ?"}],"final":"Invalid. Counterexample: A = F, B = T.","work":"A B | A⊃B | B | A (concl)\nT T |  T  | T | T\nT F |  F  | F | T\nF T |  T  | T | F   \u003c- premises all true, conclusion false\nF F |  T  | F | F\nRows with all premises true: TT and FT (2 rows). In row FT the conclusion A is false, so there is a counterexample and the argument is invalid.","explain":"反例法 + 真值表：只看前提全为 T 的行。自然语言版：‘若下雨则街湿；街湿；所以下雨’——洒水器让街湿但没下雨就是反例世界。","table":null},{"id":"logic-L6-c05","module":"logic","lecture":"L6","topic":"真值表判有效性","q":"Use a truth table to decide whether the argument \u0027A ∨ B, ~A, therefore B\u0027 is valid.","steps":[{"label":"行数","prompt":"How many rows does the truth table need?","answer":4,"tol":0.01,"hint":"原子命题 A, B"},{"label":"前提全真的行数","prompt":"In how many rows are ALL premises true?","answer":1,"tol":0.01,"hint":"~A 要求 A = F，A ∨ B 再要求 B = T"},{"label":"反例行数","prompt":"Among those rows, in how many is the conclusion false?","answer":0,"tol":0.01,"hint":"看 FT 行的 B"},{"label":"判定","prompt":"Is the argument valid? (enter 1 = valid, 0 = invalid)","answer":1,"tol":0.01,"hint":"无反例 → ?"}],"final":"Valid: the only row with all premises true (A = F, B = T) has a true conclusion.","work":"A B | A∨B | ~A | B (concl)\nT T |  T  | F  | T\nT F |  T  | F  | F\nF T |  T  | T  | T   \u003c- only row with all premises true; conclusion true\nF F |  F  | T  | F\nNo row has all premises true and the conclusion false, so the argument is valid.","explain":"这是 L1 教授举的 ‘X or Y; not X; ∴ Y’ 有效论证。TF 行结论虽假，但前提 ~A 为假，不算反例。","table":null},{"id":"logic-L6-c06","module":"logic","lecture":"L6","topic":"逻辑等价判定（De Morgan）","q":"Are ~(A \u0026 B) and ~A \u0026 ~B logically equivalent?","steps":[{"label":"~(A \u0026 B) 在 A=T,B=F","prompt":"Value of ~(A \u0026 B) when A = T, B = F? (enter 1 = true, 0 = false)","answer":1,"tol":0.01,"hint":"A \u0026 B = F，其否定为 T"},{"label":"~A \u0026 ~B 在 A=T,B=F","prompt":"Value of ~A \u0026 ~B when A = T, B = F? (enter 1 = true, 0 = false)","answer":0,"tol":0.01,"hint":"~A = F"},{"label":"不同的行数","prompt":"In how many of the 4 rows do the two propositions differ?","answer":2,"tol":0.01,"hint":"比较 TF 与 FT 两行"},{"label":"判定","prompt":"Are they logically equivalent? (enter 1 = yes, 0 = no)","answer":0,"tol":0.01,"hint":"一行不同就不等价"}],"final":"Not equivalent (they differ in rows TF and FT). The correct De Morgan form is ~(A \u0026 B) ≡ ~A ∨ ~B.","work":"A B | A\u0026B | ~(A\u0026B) | ~A | ~B | ~A\u0026~B\nT T |  T  |   F    | F  | F  |  F\nT F |  F  |   T    | F  | T  |  F\nF T |  F  |   T    | T  | F  |  F\nF F |  F  |   T    | T  | T  |  T\nThe final columns are F T T T and F F F T; they differ in rows TF and FT, so the propositions are not logically equivalent.","explain":"最经典的 De Morgan 错误：只分配否定、不翻转联结词。~A \u0026 ~B 是 neither（≡ ~(A ∨ B)），~(A \u0026 B) 是 not both。","table":null},{"id":"logic-L6-c07","module":"logic","lecture":"L6","topic":"逻辑等价判定（条件句）","q":"Are A ⊃ B and ~(A \u0026 ~B) logically equivalent?","steps":[{"label":"A ⊃ B 在 A=T,B=F","prompt":"Value of A ⊃ B when A = T, B = F? (enter 1 = true, 0 = false)","answer":0,"tol":0.01,"hint":"唯一为假的情况"},{"label":"~(A \u0026 ~B) 在 A=T,B=F","prompt":"Value of ~(A \u0026 ~B) when A = T, B = F? (enter 1 = true, 0 = false)","answer":0,"tol":0.01,"hint":"A \u0026 ~B = T，其否定为 F"},{"label":"不同的行数","prompt":"In how many of the 4 rows do the two propositions differ?","answer":0,"tol":0.01,"hint":"逐行比较"},{"label":"判定","prompt":"Are they logically equivalent? (enter 1 = yes, 0 = no)","answer":1,"tol":0.01,"hint":"每行都相同 → ?"}],"final":"Equivalent: both columns are T F T T.","work":"A B | A⊃B | ~B | A\u0026~B | ~(A\u0026~B)\nT T |  T  | F  |  F   |  T\nT F |  F  | T  |  T   |  F\nF T |  T  | F  |  F   |  T\nF F |  T  | T  |  F   |  T\nBoth final columns are T F T T, identical in every row, so A ⊃ B ≡ ~(A \u0026 ~B).","explain":"A ⊃ B 只排除 A \u0026 ~B 这一个世界。也可用 De Morgan 推：~(A \u0026 ~B) ≡ ~A ∨ ~~B ≡ ~A ∨ B ≡ A ⊃ B。","table":null},{"id":"logic-L10-c08","module":"logic","lecture":"L10","topic":"真值表检验互斥","q":"Use a truth table to decide whether A ∨ B and ~A ∨ ~B are mutually exclusive.","steps":[{"label":"A ∨ B 在 A=T,B=F","prompt":"Value of A ∨ B when A = T, B = F? (enter 1 = true, 0 = false)","answer":1,"tol":0.01,"hint":"至少一个真即真"},{"label":"同时为真的行数","prompt":"In how many of the 4 rows are BOTH propositions true?","answer":2,"tol":0.01,"hint":"检查 TF 与 FT"},{"label":"判定","prompt":"Are they mutually exclusive? (enter 1 = yes, 0 = no)","answer":0,"tol":0.01,"hint":"只要有一行同真就不互斥"}],"final":"Not mutually exclusive: both are true in rows TF and FT.","work":"A B | A∨B | ~A | ~B | ~A∨~B | both true?\nT T |  T  | F  | F  |   F    | no\nT F |  T  | F  | T  |   T    | YES\nF T |  T  | T  | F  |   T    | YES\nF F |  F  | T  | T  |   T    | no\nThere are rows in which both propositions are true, so they are not mutually exclusive.","explain":"互斥 = 没有任何一行同时为 T。~A ∨ ~B ≡ ~(A \u0026 B)，它并不是 A ∨ B 的否定（A ∨ B 的否定是 ~A \u0026 ~B，那一对才互斥）。","table":null},{"id":"logic-L4-c09","module":"logic","lecture":"L4","topic":"矛盾前提的有效性","q":"Consider the argument \u0027A, ~A, therefore C\u0027 (e.g. \u0027The sky is blue. The sky is not blue. Therefore, Cleo is a cat.\u0027). Test it with a truth table.","steps":[{"label":"行数","prompt":"How many rows does the truth table need?","answer":4,"tol":0.01,"hint":"原子命题 A 与 C"},{"label":"前提全真的行数","prompt":"In how many rows are ALL premises true?","answer":0,"tol":0.01,"hint":"A 与 ~A 能同时为真吗？"},{"label":"有效性","prompt":"Is the argument valid? (enter 1 = valid, 0 = invalid)","answer":1,"tol":0.01,"hint":"没有前提全真的行 → 不可能有反例"},{"label":"健全性","prompt":"Can the argument be sound? (enter 1 = yes, 0 = no)","answer":0,"tol":0.01,"hint":"Sound 要求所有前提事实上为真"}],"final":"Valid (no row has all premises true, hence no counterexample) but never sound.","work":"A C | A | ~A | C (concl)\nT T | T | F  | T\nT F | T | F  | F\nF T | F | T  | T\nF F | F | T  | F\nIn no row are both premises true, so there is no row with all premises true and the conclusion false. By definition the argument is valid. Because the premises cannot all be true, it cannot be sound.","explain":"教授说这是几乎每年期末都考的概念。答卷关键句：Contradictory premises cannot all be true at the same time, so there is no possible case in which all premises are true and the conclusion false; the argument is valid but unsound.","table":null},{"id":"logic-L8-c10","module":"logic","lecture":"L8","topic":"X ∨ ~X 结构","q":"Classify the proposition (A \u0026 B) ∨ ~(A \u0026 B).","steps":[{"label":"行数","prompt":"How many rows does the truth table need?","answer":4,"tol":0.01,"hint":"原子命题 A, B"},{"label":"A \u0026 B 在 A=T,B=F","prompt":"Value of A \u0026 B when A = T, B = F? (enter 1 = true, 0 = false)","answer":0,"tol":0.01,"hint":"合取要求两者都真"},{"label":"整式在 A=T,B=F","prompt":"Value of the whole proposition when A = T, B = F? (enter 1 = true, 0 = false)","answer":1,"tol":0.01,"hint":"~(A \u0026 B) = T"},{"label":"分类","prompt":"Classify it: enter 1 = logical truth, 2 = logical falsehood, 3 = contingent.","answer":1,"tol":0.01,"hint":"令 X = (A \u0026 B)"}],"final":"Logical truth: it has the form X ∨ ~X with X = (A \u0026 B).","work":"A B | A\u0026B | ~(A\u0026B) | whole\nT T |  T  |   F    |  T\nT F |  F  |   T    |  T\nF T |  F  |   T    |  T\nF F |  F  |   T    |  T\nEvery row is T. Equivalently, let X = (A \u0026 B); the proposition is X ∨ ~X, which is always true.","explain":"L8 开场复习题。先圈出完整子命题当作 X，再找主联结词 ∨，即可直接判定为永真。","table":null},{"id":"logic-L4-c11","module":"logic","lecture":"L4","topic":"真值表判有效性（三变量）","q":"Use a truth table to decide whether the argument \u0027A ⊃ B, B ⊃ C, therefore A ⊃ C\u0027 is valid.","steps":[{"label":"行数","prompt":"How many rows does the truth table need?","answer":8,"tol":0.01,"hint":"原子命题 A, B, C"},{"label":"前提全真的行数","prompt":"In how many rows are BOTH premises true?","answer":4,"tol":0.01,"hint":"TTT, FTT, FFT, FFF"},{"label":"反例行数","prompt":"Among those rows, in how many is A ⊃ C false?","answer":0,"tol":0.01,"hint":"A ⊃ C 只在 A=T, C=F 时为假"},{"label":"判定","prompt":"Is the argument valid? (enter 1 = valid, 0 = invalid)","answer":1,"tol":0.01,"hint":"无反例 → ?"}],"final":"Valid: in all 4 rows where both premises are true, A ⊃ C is true.","work":"A B C | A⊃B | B⊃C | A⊃C\nT T T |  T  |  T  |  T   \u003c- premises true, conclusion true\nT T F |  T  |  F  |  F\nT F T |  F  |  T  |  T\nT F F |  F  |  T  |  F\nF T T |  T  |  T  |  T   \u003c- premises true, conclusion true\nF T F |  T  |  F  |  T\nF F T |  T  |  T  |  T   \u003c- premises true, conclusion true\nF F F |  T  |  T  |  T   \u003c- premises true, conclusion true\nNo row has both premises true and the conclusion false, so the argument is valid.","explain":"8 行表的练习。唯一可能的反例要求 A=T、C=F，但那两行（TTF、TFF）中总有一个前提为假。这与 L4 ‘蕴涵可以接力’的思想一致。","table":null}]},
{"cards":[{"id":"prob-L2-tree","module":"prob","lecture":"L2","term":"Probability tree diagram","zh":"概率树","def":"A diagram that lays out every possible scenario as branches; each fork is an uncertain step, the probability of a complete path is the product of the probabilities along it, and an event reachable by several paths gets the sum of those paths.","defZh":"把所有可能情形展开成分支的图。沿同一路径相乘得到该完整路径的概率；一个事件可由多条路径实现时，把这些路径的概率相加。","formula":"P(path) = product of branch probabilities;  P(event) = sum of P(paths) where the event occurs","example":"Monty Hall：汽车在 Door 1（1/3）× 主持人随机开 Door 3（1/2）= 1/6。","pitfall":"沿路径是“乘”，合并不同路径是“加”，不要混用；末端分支总和必须为 1。","hf":true},{"id":"prob-L4-partition","module":"prob","lecture":"L4","term":"Partition (of terminal branches)","zh":"完备划分","def":"The terminal branches of a complete probability tree must cover all possibilities, be mutually exclusive, and have probabilities summing to 1.","defZh":"完整概率树的末端分支必须：覆盖所有可能情况、彼此不能同时发生（互斥）、概率总和为 1。","example":"三扇门 × 主持人两种选择 = 6 条末端分支，每条 1/6，加起来正好 1。","pitfall":"不要求各分支概率相等；只要求穷尽、互斥、和为 1。漏掉隐藏结局或总和变成 130% 都说明树画错了。","hf":false},{"id":"prob-L4-conditioning","module":"prob","lecture":"L4","term":"Conditioning","zh":"条件化（根据新证据缩小范围）","def":"Updating on new evidence by eliminating every branch of the tree that is incompatible with what was observed, keeping only the branches that remain possible.","defZh":"获得新证据后，划掉所有与观察不相容的分支，只保留仍可能发生的分支。划掉后剩余概率通常不再等于 1，所以还要归一化。","example":"看到主持人打开的是山羊门：删掉“主持人打开汽车门”的分支。","pitfall":"删枝之后不能直接沿用原来的分支概率（如继续说每条 1/6）。","hf":true},{"id":"prob-L4-normalisation","module":"prob","lecture":"L4","term":"Normalisation","zh":"归一化","def":"Normalisation is rescaling the probabilities of the remaining possibilities after incompatible branches have been removed, so that the remaining probabilities sum to one.","defZh":"删去不相容分支后，把每个保留分支的原概率除以保留分支的概率总和，使新概率重新加总为 1。","formula":"New P(branch) = old P(branch) / total P(remaining branches)","example":"剩 4 条分支各 1/6，总和 2/3；归一化后每条 (1/6)/(2/3) = 1/4，换门赢 2 条 → 1/2。","pitfall":"口诀：先列全，后删枝；删完以后再归一。","hf":true},{"id":"prob-L2-condprob","module":"prob","lecture":"L2","term":"Conditional probability","zh":"条件概率","def":"P(H|E) is the probability that hypothesis H is true given that evidence E is known; it equals the probability of H and E together divided by the probability of E.","defZh":"已知证据 E 时假设 H 成立的概率。等于 H 与 E 同时发生的概率除以 E 的总概率（所有能产生 E 的路径之和）。","formula":"P(H|E) = P(H ∧ E) / P(E)","example":"随机主持人：P(车在1 ∧ 开3见羊) = 1/6，P(开3见羊) = 1/6+1/6 = 1/3，所以 P(车在1 | 开3见羊) = 1/2。","pitfall":"P(H|E) 不是“汽车原本在 Door 1 的概率”，而是加入新信息之后的概率。","hf":true},{"id":"prob-L2-montyhall","module":"prob","lecture":"L2","term":"Standard Monty Hall problem","zh":"标准蒙提霍尔问题","def":"Three doors, one car. The host knows where the car is, never opens the contestant\u0027s door or the car door, always reveals a goat and always offers a switch; staying wins with probability 1/3 and switching wins with probability 2/3.","defZh":"主持人知道汽车位置、一定打开一扇未选的山羊门并给换门机会。初选门保持 1/3；两扇未选门原本共有的 2/3 集中到剩下那扇门，所以换门赢 2/3。","formula":"P(stay wins) = 1/3;  P(switch wins) = 2/3","example":"100 门版：知情主持人打开 98 扇山羊门，换门赢 99/100——只有一开始就蒙对时换门才输。","pitfall":"“只剩两扇门所以 50/50”是错的：主持人的开门不是随机的，他的知识和规则带来信息。所有规则缺一不可。","hf":true},{"id":"prob-L2-randomhost","module":"prob","lecture":"L2","term":"Random-host Monty Hall variant","zh":"随机主持人版本","def":"The host does not know where the car is and opens an unchosen door at random, so he might reveal the car; conditional on his happening to reveal a goat, staying and switching each win with probability 1/2.","defZh":"主持人不知道车在哪，随机开门，可能直接打开汽车。已知他碰巧开出山羊后，删去开出汽车的分支并归一化，留/换各 1/2。L4 的 Quiz 版（在三扇门中完全随机开门）条件化后同样是 1/2。","formula":"P(car behind 1 | host opens 3, goat) = (1/6)/(1/6+1/6) = 1/2","example":"标准主持人：“我知道车在哪，特意给你看山羊。”随机主持人：“我随便开了一扇，刚好没开出汽车。”","pitfall":"并非所有 Monty Hall 版本都应换门；同样看到山羊，生成机制不同，证据不同。","hf":true},{"id":"prob-L4-forcedchoice","module":"prob","lecture":"L4","term":"Forced choice (why the informed host is informative)","zh":"受约束的选择","def":"In the standard game the host\u0027s choice is constrained twice (he cannot open the contestant\u0027s door or the car door); this forced choice carries information about the car\u0027s location that a random host\u0027s choice does not.","defZh":"标准主持人的选择受两条限制：不能开你的门，也不能开汽车门。这种 forced choice 使他的开门携带信息，因此有 2/3 的换门优势；随机主持人没有这种约束。","example":"车在 Door 2 时，主持人只能开 Door 3——他开哪扇门由车的位置决定。","pitfall":"关键不是“最后剩两扇门”，而是“主持人为什么打开那扇门”。","hf":false},{"id":"prob-L2-selection","module":"prob","lecture":"L2","term":"Evidence depends on the selection process","zh":"证据取决于观察的产生过程","def":"Evidence is not merely what you observe; it also depends on how the observation was generated, because the same observation can have different probabilities of occurring under different processes and so supports different updates.","defZh":"证据 = 结果 + 产生机制。要考虑谁做的选择、他掌握什么信息、遵循什么规则、哪些其他结果原本可能出现。","example":"两个学生都考 100 分：一个稳定满分，一个全靠蒙对——结果相同，证据意义完全不同。","pitfall":"不要只问“我看见了什么”，还要问“我为什么会看见它”。","hf":true},{"id":"prob-L2-germantank","module":"prob","lecture":"L2","term":"German tank problem","zh":"德国坦克问题","def":"Allied analysts estimated German tank production from serial numbers on captured tanks: if all observed numbers are low, this does not logically rule out a huge production run, but it is far more probable if production is small, so it supports the lower estimate.","defZh":"坦克按顺序编号。观察到的编号都低于 1000 并不能逻辑上排除产量 1,000,000，但若只造了约 1000 辆，这种观察很正常；若造了一百万辆则很不寻常，所以证据更支持较低产量。","example":"H_A：约 1000 辆 → 看到低编号很可能；H_B：约 1,000,000 辆 → 全是低编号可能但极不可能。","pitfall":"不能只问“证据在该假设下是否可能”，而要问“该假设为真时证据有多容易出现”，并与其他假设比较——这是后面 Bayesian reasoning 的雏形。","hf":false},{"id":"prob-L2-newcomb","module":"prob","lecture":"L2","term":"Newcomb\u0027s paradox","zh":"纽康姆悖论","def":"A highly reliable predictor puts $1,000,000 in opaque box B only if it predicted you would take B alone; transparent box A always holds $1000. Evidential reasoning favours one-boxing (your choice is strong evidence about B\u0027s contents), while causal reasoning favours two-boxing (yo
