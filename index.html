ur choice cannot change what is already in the boxes).","defZh":"One-box：我的选择是 B 中有钱的强证据（evidential reasoning）。Two-box：钱已放好，我现在的选择不能因果性改变它，多拿 A 在任何固定世界都多 $1000（causal reasoning）。它是 evidence 与 causation 冲突的经典争论，没有公认唯一答案。","example":"若 oracle 只是随机预测，显然应拿两个盒子——类似 Monty Hall 中主持人是否知情。","pitfall":"本讲属于拓展内容；考点是区分“我的选择预示什么”(correlation/evidence) 与“我的选择能造成什么”(causation)。","hf":false},{"id":"prob-L4-hdbet","module":"prob","lecture":"L4","term":"The HD bet","zh":"HD 赌局","def":"One in ten students gets an HD; the bet gives you an HD if a fair coin lands heads and a die then shows 6 (probability 1/12). As a replacement for your 1/10 chance the bet is worse; as an extra chance on top of it, it raises your probability to 1/10 + 9/10 × 1/12 = 17.5%.","defZh":"Reading 1（替换）：1/12 ≈ 8.33% \u003c 10%，不接受。Reading 2（额外机会）：1/10 + 9/10×1/12 = 21/120 = 17.5%，接受。Reading 3：全班 10% 是总体频率，不一定是你的个人概率。","formula":"P(HD) = 1/10 + (9/10)(1/12) = 0.175","example":"额外机会只在原本没得 HD 的 9/10 情况下才有用，所以乘 9/10 而不是直接 1/10+1/12。","pitfall":"答案取决于如何理解题目；Reading 2 不能写成 1/10 + 1/12（那会重复计算两种途径都得 HD 的情形）。","hf":true},{"id":"prob-L4-frequency","module":"prob","lecture":"L4","term":"Frequency interpretation of probability","zh":"频率理解","def":"On the frequency reading, a probability statement describes the proportion of a population or class of cases that has some feature.","defZh":"概率描述一个群体中有多大比例具有某属性。","example":"“10% 的学生获得 HD” = 这组学生中约十分之一属于 HD 类别。","pitfall":"总体频率不一定等于某个具体个体在其全部证据下的概率：P(you get HD | your evidence) 可能高于或低于 10%。","hf":false},{"id":"prob-L4-epistemic","module":"prob","lecture":"L4","term":"Epistemic probability","zh":"认识论概率","def":"Epistemic probability measures how much confidence the available evidence supports in a proposition; it reflects what we know rather than a physical random mechanism, and it changes as we gain information.","defZh":"根据目前掌握的信息，对某命题应有多大信心。它衡量“我知道多少、证据支持到什么程度”，信息越多，个体概率估计通常越具体。","example":"“你有 10% 的可能拿 HD”= 以我有限的信息，我对此只有 10% 的信心；了解你是否认真学习后会改变。","pitfall":"要区分：这是真正的随机机制（objective chance，如公平硬币 1/2、骰子 1/6），还是因为信息不足而用概率表达不确定性？","hf":false},{"id":"prob-L8-gambler","module":"prob","lecture":"L8","term":"Gambler\u0027s fallacy","zh":"赌徒谬误","def":"The gambler\u0027s fallacy is the mistake of treating an independent outcome as more or less likely because of a preceding run of results; if the trials are genuinely independent, the earlier sequence does not change the probability of the next outcome.","defZh":"一边把连续试验当作独立，一边又因为过去出现了很多 A 而认为下一次 ¬A“该来了”。若试验独立，过去序列不为下一次提供信息。","example":"公平硬币前 50 次全是正面，第 51 次正反仍各 1/2；D\u0026D 很久没掷出某点数，下一次不会更容易出现。","pitfall":"诊断前先写出隐含前提：当事人是否真认为试验独立？诈骗邮件、执法名单、相信宇宙补偿等情形往往不是严格意义的赌徒谬误。","hf":true},{"id":"prob-L8-fairness","module":"prob","lecture":"L8","term":"Fairness vs independence","zh":"公平性 vs 独立性","def":"Fairness concerns the probability distribution within a trial, often whether the relevant outcomes are equally likely; independence concerns the relation between trials or events, namely that learning one does not change the probability of the other. Independent trials need not be fair.","defZh":"Fairness 看单次试验内各结果是否等概率；Independence 看不同试验/事件之间：知道一个是否改变另一个的概率。偏骰可以每次独立。","example":"一枚骰子每次出 6 的概率都是 0.30 且各次独立：不公平，但独立。","pitfall":"赌徒谬误需要的是独立性，不是 50/50。二十面骰出 2 的概率一直是 1/20，很久没出 2 也不会让下一掷变大。","hf":true},{"id":"prob-L8-independence","module":"prob","lecture":"L8","term":"Independence","zh":"独立性","def":"Two events are independent when learning that one occurred does not change the probability of the other; formally P(A|B) = P(A). Independence is symmetric.","defZh":"得知 B 发生不会改变对 A 的合理概率判断。这里的“改变”应读作信息/证据更新，而不是因果作用。若 A 独立于 B，则 B 也独立于 A（对称）。","formula":"A, B independent ⇔ P(A|B) = P(A);  then P(A ∧ B) = P(A)P(B)","example":"扑克牌：P(Ace) = 1/13，P(Ace|Spade) = 1/13，所以 Ace 与 Spade 独立；Ace 与 Red 也独立（2/26 = 1/13）。","pitfall":"独立 ≠ 不能同时发生；独立 ≠ 没有原因。“不同时间发生”或“是硬币”本身不自动保证独立。","hf":true},{"id":"prob-L8-notcausal","module":"prob","lecture":"L8","term":"Probability update is not causal influence","zh":"概率更新 ≠ 因果作用","def":"Conditional probability represents how one piece of information bears on another; learning that a firecracker exploded can raise the probability that it was previously lit, even though the explosion does not cause the earlier lighting. The change is in the observer\u0027s rational credence, not necessarily in the world.","defZh":"爆竹：P(E|L) = 1/3，P(E|¬L) = 0，所以 P(L|E) = 1。知道爆炸后我们确定它被点燃过——变化的是观察者的置信度，不是倒因果。","formula":"If P(E|¬L) = 0, then P(L|E) = 1","example":"若爆竹偶尔会自发爆炸，P(L|E) 会小于 1，但通常仍高于无条件的 P(L)。","pitfall":"条件概率首先表达证据关系；因果需要额外论证。","hf":true},{"id":"prob-L8-longrun","module":"prob","lecture":"L8","term":"Long-run frequency vs compensation","zh":"长期频率 vs 短期补偿","def":"That the long-run proportion of heads approaches 1/2 does not mean the next trial must compensate for past imbalance; early deviations are diluted by later trials, not reversed.","defZh":"长期比例趋近 50/50 是靠“稀释”早期偏差，不是要求下一次偏向反面来“补偿”。已发生的 40 个正面不会被改写。","example":"dilution of imbalance ≠ reversal on the next trial。","pitfall":"用“大数规律/长期会平衡”为赌徒谬误辩护是错的。","hf":false},{"id":"prob-L8-randomness","module":"prob","lecture":"L8","term":"Objective randomness vs epistemic randomness","zh":"客观随机 vs 认识论随机","def":"A coin or roulette wheel may be deterministic but unpredictable: an omniscient observer with the initial conditions might predict it, yet an ordinary agent can reasonably treat the outcome as random relative to available information; quantum processes may be candidates for genuine randomness.","defZh":"三个层次：objective randomness（世界本身不可还原的随机，量子过程是候选）；deterministic but unpredictable（硬币、轮盘可能属此类）；epistemic treatment（就现有证据把结果当随机处理是合理的）。","example":"有人用摄像设备和快速计算预测轮盘落点——对他而言轮盘不再那么“随机”。","pitfall":"教授说明自己不是物理哲学专家，量子部分只是补充，不是计算重点。","hf":false},{"id":"prob-L10-mutex","module":"prob","lecture":"L10","term":"Mutually exclusive","zh":"互斥","def":"Two propositions are mutually exclusive when there is no possible situation in which both are true; they may both be false. Mutual exclusivity is a logical relation.","defZh":"不可能同时为真；允许同时为假。它是逻辑关系（可用真值表检验），不要求必有一个为真，也不要求概率相等。","example":"同一次掷骰“掷出 2”与“掷出 3”互斥；掷出 5 时两者同时为假。A∧B 与 A∧¬B 互斥（一个要 B，一个要 ¬B）。","pitfall":"互斥 ≠ 一真一假；互斥不具有传递性；两个 contradiction 也算互斥（边界例子）。","hf":true},{"id":"prob-L10-mutexvsindep","module":"prob","lecture":"L10","term":"Mutually exclusive vs independent","zh":"互斥 vs 独立","def":"Mutually exclusive propositions cannot both be true; independent propositions are such that learning one does not change the probability of the other. For positive-probability cases, mutually exclusive events are therefore not independent.","defZh":"互斥是逻辑概念（能否同真），独立是概率概念（知道一个是否改变另一个的概率）。非零概率的互斥事件一定不独立：知道 A 发生就把 B 的概率降到 0。","example":"掷骰前 P(3) = 1/6；得知结果是 2 后 P(3) = 0，所以“2”与“3”互斥且不独立。两次独立投币都正面的概率 1/4 \u003e 0：独立事件可以共同发生。","pitfall":"高频误区：以为互斥事件彼此独立。零概率等特殊边界情形教授暂时搁置。","hf":true},{"id":"prob-L10-orrule","module":"prob","lecture":"L10","term":"OR rule (special addition rule)","zh":"加法规则（互斥时）","def":"If A and B are mutually exclusive, then P(A ∨ B) = P(A) + P(B); the rule may be applied only after checking that the disjuncts cannot both be true.","defZh":"看到 OR 不要先加：先确认两分支不能同真。可重叠时直接相加会重复计算重叠部分。","formula":"P(A ∨ B) = P(A) + P(B)   [only if A, B mutually exclusive]","example":"一次掷骰 P(2 ∨ 3) = 1/6 + 1/6 = 1/3。反例：P(King ∨ Heart) ≠ 4/52 + 13/52，因为红桃 K 被算了两次。","pitfall":"本讲尚未正式引入一般加法公式；遇到可能重叠的事件应停下检查，而不是硬套。","hf":true},{"id":"prob-L10-andrule","module":"prob","lecture":"L10","term":"AND rule (special multiplication rule)","zh":"乘法规则（独立时）","def":"If A and B are independent, then P(A ∧ B) = P(A) × P(B); the rule may be applied only after checking that learning one does not change the probability of the other.","defZh":"看到 AND 不要先乘：先确认独立性。","formula":"P(A ∧ B) = P(A) × P(B)   [only if A, B independent]","example":"两次独立投币都正面 = 1/2 × 1/2 = 1/4。反例：同一次掷骰 P(2 ∧ 3) = 0，不是 1/36。","pitfall":"给了两个概率不等于题目授权相乘；(A∧B)∧(A∧¬B) 含 B∧¬B，概率为 0，不是 1/3×1/5。","hf":true},{"id":"prob-L10-complement","module":"prob","lecture":"L10","term":"Complement rule","zh":"补集规则","def":"P(¬A) = 1 − P(A), which holds because A and ¬A are mutually exclusive and jointly exhaustive.","defZh":"A 与 ¬A 互斥且穷尽全部可能性，所以 P(¬A) = 1 − P(A)。用剩余概率求未知事件时，关键是该事件与已有并集无重叠。","formula":"P(¬A) = 1 − P(A)","example":"Quiz：P(A∨B∨C) = 5/6，D 与 A、B、C 互斥且 P(A∨B∨C∨D) = 1，所以 P(D) = 1/6。","pitfall":"若 D 与已有事件重叠，就无法由差额唯一求出 P(D)。","hf":true},{"id":"prob-L10-equivalence","module":"prob","lecture":"L10","term":"Logical equivalence and probability","zh":"逻辑等价与概率","def":"Logically equivalent propositions have the same truth value in every possible case and therefore the same probability; however, two propositions having equal probability does not show they are logically equivalent.","defZh":"逻辑等价 → 概率相同；概率相同 ↛ 逻辑等价。Tautology 概率为 1，contradiction 概率为 0。","formula":"(A∧B) ∨ (A∧¬B) ≡ A","example":"Exercise 4：P(A∧B) = 1/3，P(A∧¬B) = 1/5 → P(A) = 8/15，P(¬A) = 7/15。","pitfall":"(A∧B)∨(A∧¬B) 与 A 等价但不是 tautology（A 假时它也假）。“太阳明天升起”经验上极可信，但不是逻辑必然。","hf":false},{"id":"prob-L10-ordered","module":"prob","lecture":"L10","term":"Ordered vs unordered outcomes","zh":"有序 vs 无序结果","def":"Whether a description specifies which object has which result changes the sample space: \u0027die 1 shows 3 and die 2 shows 4\u0027 is one ordered outcome, while \u0027one die shows 3 and the other 4\u0027 includes both (3,4) and (4,3).","defZh":"题目是否指定身份/顺序会改变包含的结果数。","formula":"P(die1=3 ∧ die2=4) = 1/36;  P(one 3, other 4) = 2/36 = 1/18","example":"甲红乙蓝只有一种安排；“一红一蓝”包含甲红乙蓝与甲蓝乙红。","pitfall":"已指定“骰子1/骰子2”就不要再乘 2；说“一颗/另一颗”时要检查交换位置是否产生第二个结果。","hf":true},{"id":"prob-L10-replacement","module":"prob","lecture":"L10","term":"With vs without replacement","zh":"有放回 vs 无放回","def":"Drawing with replacement restores the original composition, so (if well mixed) successive draws are independent; drawing without replacement changes the composition, so the first draw changes the probabilities for the second and the draws are dependent.","defZh":"3 蓝 2 绿：第一次蓝 3/5。有放回后第二次蓝仍 3/5（独立）；无放回后剩 2 蓝 2 绿，第二次蓝 2/4 = 1/2（不独立）。","formula":"Without replacement: P(B1 ∧ B2) = 3/5 × 2/4 = 3/10;  with: (3/5)² = 9/25","example":"号码牌每轮放回并重新洗匀，通常可视为独立。","pitfall":"“放回”只有在系统真正恢复并充分混合时才支持独立；无放回不能写成 (3/5)²。","hf":true},{"id":"prob-L10-unequal","module":"prob","lecture":"L10","term":"Counting vs unequal outcomes (loaded die)","zh":"计数法与不等可能结果","def":"Simple counting (favourable outcomes / total outcomes) is justified only when the basic outcomes are equally likely; otherwise, sum the actual probabilities of the mutually exclusive favourable outcomes.","defZh":"有利数/总数只在基本结果等可能时可靠；更一般的方法是把互斥的具体结果按实际概率相加。","example":"偏骰 P(1) = 5/25，其余各 4/25：P(even) = 12/25，P(odd) = 13/25，而不是 3/6。","pitfall":"相加只需互斥，不需等权；等权只是简单计数法的前提。偏骰各次投掷仍可独立。","hf":true},{"id":"prob-L10-dependence","module":"prob","lecture":"L10","term":"Dependence: association vs causation","zh":"依赖：关联与因果","def":"Events are dependent whenever learning one changes the probability of the other; the dependence may come from shared preferences, sampling structure, causation or other association, so dependence by itself does not establish direct causation.","defZh":"依赖可能来自共同偏好、抽样结构、因果关系或其他统计关联。相同的边际概率也不保证独立。","example":"咖啡/茶 toy model：P(C) = P(T) = 1/2，但 P(C∧T) = 1/2 而不是 1/4；知道喜欢茶后喜欢咖啡的概率从 1/2 升到 1。咖啡与 jittery 则是因果带来的依赖。","pitfall":"相关 ≠ 直接因果（洒水器与下雨都能让草坪湿）。","hf":false}],"mcq":[{"id":"prob-L2-q01","module":"prob","lecture":"L2","topic":"标准 Monty Hall","q":"In the standard Monty Hall problem, why does switching win with probability 2/3?","options":["Once a goat is revealed, each of the two closed doors has probability 1/2, and switching breaks the tie in your favour.","The host\u0027s reveal causally moves the car toward the remaining unchosen door.","The host knows where the car is and is constrained to open an unchosen goat door, so the 2/3 initially shared by the two unchosen doors concentrates on the one left closed.","The reveal lowers the probability of your original door from 1/3 to 1/6."],"answer":2,"explain":"正确：初选 1/3 不变；知情且受约束的主持人避开汽车，未选两门共有的 2/3 集中到剩下那扇。A 是“剩两扇就 50/50”的经典误解；B 把信息更新误当成因果；D 错在初选门概率并未下降，仍是 1/3。","hf":true},{"id":"prob-L2-q02","module":"prob","lecture":"L2","topic":"随机主持人","q":"You pick Door 1. A host who does NOT know where the car is opens one of the two unchosen doors at random. He opens Door 3 and it happens to show a goat. What is the probability you win if you switch to Door 2?","options":["1/3","2/3","1/6","1/2"],"answer":3,"explain":"相容路径：车在1且开3（1/3×1/2=1/6），车在2且开3（1/6）。P(E)=1/3，归一化后各 1/2。2/3 是把标准版答案套到随机主持人上；1/6 是忘了归一化；1/3 是把初选概率当作换门概率。","hf":true},{"id":"prob-L2-q03","module":"prob","lecture":"L2","topic":"随机主持人","q":"In the random-host version (host opens one of your two unchosen doors at random), what is the probability, before any door is opened, that the host reveals the car?","options":["1/3","0","1/6","1/2"],"answer":0,"explain":"车在 Door 2 且开 Door 2：1/6；车在 Door 3 且开 Door 3：1/6；合计 1/3。这正是随机主持人与标准主持人的关键差别——标准主持人开出汽车的概率为 0，所以“看到山羊”在两种机制下概率不同（1 vs 2/3），提供的证据也不同。","hf":false},{"id":"prob-L2-q04","module":"prob","lecture":"L2","topic":"标准 Monty Hall","q":"Which change to the standard Monty Hall setup would make switching no better than staying, once a goat has been revealed?","options":["Using 100 doors, with the host opening 98 goat doors.","Announcing in advance to the contestant that the host will always reveal a goat.","Having a host who does not know where the car is open one of the unchosen doors at random, and it happens to show a goat.","Replacing the car with a different prize of the same value."],"answer":2,"explain":"随机主持人版本条件化后留/换各 1/2。A 中换门赢 99/100，优势更大；B 只是把标准规则说出来，仍是 2/3；D 与概率结构无关。","hf":true},{"id":"prob-L2-q05","module":"prob","lecture":"L2","topic":"100 门版本","q":"There are 100 doors and one car. You pick Door 1. A host who knows where the car is opens 98 of the other doors, all showing goats. What is the probability that switching wins?","options":["1/2","1/100","98/100","99/100"],"answer":3,"explain":"只有你一开始就在 100 扇里蒙对（1/100）时换门才输，所以换门赢 99/100。这个版本用来打破“剩两扇门就是 50/50”的直觉：初选保留原概率，不会突然变成二选一。","hf":false},{"id":"prob-L2-q06","module":"prob","lecture":"L2","topic":"证据与生成过程","q":"Two contestants each see a host open an unchosen door revealing a goat. In game 1 the host knows where the car is and always shows a goat; in game 2 the host opens a door at random. Which statement is correct?","options":["They have the same evidence, because they observed exactly the same thing.","The random host provides more evidence, because his choice is unbiased.","Neither observation is evidence of anything, because a goat was always going to appear.","They have different evidence, because the observation had a different probability of occurring under each process."],"answer":3,"explain":"Evidence is outcome + selection process。标准主持人下“看到山羊”是必然的，随机主持人下只是可能（概率 2/3），因此更新结果不同（2/3 vs 1/2）。A 只看结果忽略机制；B 反了——受约束的知情选择才带额外信息；C 错在随机主持人下山羊并不必然出现。","hf":true},{"id":"prob-L2-q07","module":"prob","lecture":"L2","topic":"概率树","q":"After observing new evidence, what is the correct way to update a probability tree?","options":["Cross out the branches incompatible with the observation and renormalise the remaining branches so they sum to 1.","Keep the original probabilities of the remaining branches, since the evidence does not change them.","Multiply every branch, including the eliminated ones, by the probability of the evidence.","Give every remaining branch equal probability, since the evidence makes them indistinguishable."],"answer":0,"explain":"先列全，后删枝，再归一。B 是“删枝后沿用原概率”的错误（剩余总和不再是 1）；C 没有删除不相容分支；D 只有在剩余分支原概率恰好相等时才碰巧正确，不是规则。","hf":true},{"id":"prob-L2-q08","module":"prob","lecture":"L2","topic":"概率树","q":"An event can happen via two different complete paths in a probability tree, each with probability 1/6. What is the probability of the event?","options":["1/36","1/6","1/2","1/3"],"answer":3,"explain":"不同路径（互斥的末端分支）要相加：1/6 + 1/6 = 1/3。沿同一路径才相乘；1/36 把“合并路径”误当成“沿路径相乘”。","hf":false},{"id":"prob-L2-q09","module":"prob","lecture":"L2","topic":"德国坦克问题","q":"Tanks are numbered sequentially, and every captured tank so far has a serial number below 1000. What is the right conclusion?","options":["This logically rules out the hypothesis that 1,000,000 tanks were produced.","This supports a production of about 1000 over 1,000,000, because only-low numbers are much more probable if production is small.","This is no evidence either way, because both hypotheses are consistent with the observation.","This supports a production of 1,000,000, because more tanks give more chances to see low numbers."],"answer":1,"explain":"关键不是证据在某假设下“是否可能”，而是“有多容易出现”。A 错：大产量在逻辑上仍可能；C 错：两假设都相容不代表证据中立，要比较可能性；D 方向反了。","hf":false},{"id":"prob-L2-q10","module":"prob","lecture":"L2","topic":"条件概率","q":"In the random-host problem, let H = \u0027car behind Door 1\u0027 and E = \u0027host opens Door 3 and shows a goat\u0027. Given P(H ∧ E) = 1/6 and P(E) = 1/3, which formula and value are correct?","options":["P(H|E) = P(H) × P(E) = 1/9","P(H|E) = P(E) / P(H ∧ E) = 2","P(H|E) = P(H ∧ E) / P(E) = 1/2","P(H|E) = P(H ∧ E) = 1/6"],"answer":2,"explain":"条件概率定义 P(H|E) = P(H∧E)/P(E) = (1/6)/(1/3) = 1/2。B 分子分母颠倒，得到大于 1 的“概率”，必错；A 是乱用乘法；D 忘了除以 P(E)（没归一化）。","hf":true},{"id":"prob-L2-q11","module":"prob","lecture":"L2","topic":"Newcomb 悖论","q":"In Newcomb\u0027s paradox, which reasoning supports taking only box B?","options":["Causal reasoning: choosing B alone causes the oracle to put $1,000,000 in it.","Dominance reasoning: whatever B contains, one-boxing gives more money.","Evidential reasoning: since the oracle is highly reliable, choosing B alone is strong evidence that B contains $1,000,000.","Random reasoning: the oracle\u0027s prediction is a coin flip, so it doesn\u0027t matter."],"answer":2,"explain":"One-box 依据的是“我的选择预示什么”（correlation/evidence）。A 错：钱已放好，选择不能因果性改变过去；B 的优势论证（dominance）其实支持 two-box；D 若预测随机，应拿两个盒子。","hf":false},{"id":"prob-L2-q12","module":"prob","lecture":"L2","topic":"Newcomb 悖论","q":"Which is the best statement of the two-boxer\u0027s argument in Newcomb\u0027s paradox?","options":["The money is already placed and my choice now cannot change it; in any fixed state of the boxes, taking A as well gives me $1000 more.","The oracle is usually wrong, so B is probably empty.","Taking both boxes is evidence that B contains $1,000,000.","Because the oracle is reliable, taking both boxes guarantees $1,001,000."],"answer":0,"explain":"Two-box 是 causal reasoning：问的是“我的选择能造成什么”，在任何固定世界中多拿 A 都多 $1000。B 改变了题设（oracle 极可靠）；C 方向反了，拿两盒恰恰是 B 为空的证据；D 错：若 oracle 可靠，拿两盒的人通常只得到 $1000。","hf":false},{"id":"prob-L2-q13","module":"prob","lecture":"L2","topic":"Newcomb 悖论","q":"The lecturer compared Newcomb\u0027s oracle to the Monty Hall host. What is the point of the comparison?","options":["In both cases the agent should always choose the option with more doors or boxes.","In both cases the informational significance of an event depends on the mechanism that produced it: the host\u0027s knowledge, or the oracle\u0027s reliability.","Both problems have a single universally accepted answer.","Both show that evidence and causation always coincide."],"answer":1,"explain":"共同主线：不能把信息从产生它的机制中剥离。主持人是否知情决定“看到山羊”意味着什么；oracle 是否可靠决定“自己的选择”意味着什么（若 oracle 随机预测，显然拿两盒）。Newcomb 没有公认唯一答案，恰恰展示 evidence 与 causation 的冲突。","hf":false},{"id":"prob-L2-q14","module":"prob","lecture":"L2","topic":"独立事件","q":"A fair coin will be tossed twice. (i) Before any toss, what is P(both heads)? (ii) After the first toss lands heads, what is P(second toss heads)?","options":["(i) 1/4; (ii) 1/4","(i) 1/2; (ii) 1/4","(i) 1/2; (ii) 1/2","(i) 1/4; (ii) 1/2"],"answer":3,"explain":"抛前问两次都正面：1/2×1/2 = 1/4；已知第一次正面后问第二次：P(H2|H1) = 1/2。这是两个不同问题。把 (ii) 也答成 1/4 是混淆了无条件联合概率与条件概率。","hf":true},{"id":"prob-L4-q01","module":"prob","lecture":"L4","topic":"归一化","q":"After conditioning, four branches of a probability tree remain, each originally having probability 1/6. Two of them are \u0027switch wins\u0027. What is P(switch wins) after normalisation?","options":["1/2","1/3","2/3","1/4"],"answer":0,"explain":"剩余总和 4×1/6 = 2/3；每条归一化为 (1/6)/(2/3) = 1/4；换门赢 2 条 → 1/2。1/3 是没归一化（2×1/6）；1/4 是只算了一条分支。","hf":true},{"id":"prob-L4-q02","module":"prob","lecture":"L4","topic":"Monty Hall 变体","q":"In the quiz variant, the host chooses completely at random among ALL THREE doors (he might open your door or the car door). You are told he opened a door you did not choose and it showed a goat. What is P(switch wins)?","options":["2/3","1/3","3/4","1/2"],"answer":3,"explain":"删去开到你的门和开到汽车的分支后，留与换的保留分支概率相等，归一化后 50/50。只有标准主持人那种 forced choice（不能开你的门、不能开汽车门）才产生 2/3 优势。","hf":true},{"id":"prob-L4-q03","module":"prob","lecture":"L4","topic":"Monty Hall 变体","q":"According to the lecture, what explains the 2/3 switching advantage in the standard version but not in the random-host versions?","options":["The standard host\u0027s choice is forced by two constraints (not your door, not the car door), so where he opens carries information about the car.","The standard version has three doors, while random versions effectively have two.","The random host is more likely to lie about what is behind the door.","In the random versions, the contestant\u0027s first choice is no longer 1/3."],"answer":0,"explain":"教授强调 forced choice：知情主持人受双重约束，他的选择由汽车位置决定，因此带信息。B 门数相同；C 题目里没有说谎；D 初选在所有版本中原始概率都是 1/3（只是条件化后在随机版变成 1/2）。","hf":false},{"id":"prob-L4-q04","module":"prob","lecture":"L4","topic":"HD 赌局","q":"One in ten students gets an HD. You are offered a bet: toss a fair coin; if heads, roll a die; if it shows 6 you get an HD. If accepting means the bet REPLACES your ordinary chance, should you accept?","options":["Yes, because 1/2 + 1/6 is greater than 1/10.","It makes no difference, because both are about 10%.","Yes, because the bet gives 17.5%.","No, because the bet gives 1/12 ≈ 8.33%, which is less than 1/10."],"answer":3,"explain":"“heads 且 6” 用 AND（硬币与骰子独立）：1/2×1/6 = 1/12 \u003c 1/10，替换不划算。A 错用了加法；C 的 17.5% 是“额外机会”读法（Reading 2）的答案。","hf":true},{"id":"prob-L4-q05","module":"prob","lecture":"L4","topic":"HD 赌局","q":"Same HD bet, but now the bet is an EXTRA chance used only if you would not otherwise get an HD. What is your overall probability of an HD?","options":["1/10 + 1/12 ≈ 18.3%","1/12 ≈ 8.3%","1/10 × 1/12 ≈ 0.8%","1/10 + (9/10)(1/12) = 17.5%"],"answer":3,"explain":"保留原本 1/10；只有在原本没拿 HD 的 9/10 情况下，额外机会才起作用：1/10 + 9/10×1/12 = 21/120 = 17.5%。A 把两条路径的重叠部分（本来就得 HD 又中赌局）算了两次。","hf":true},{"id":"prob-L4-q06","module":"prob","lecture":"L4","topic":"HD 赌局","q":"In the HD bet, why is it legitimate to compute P(heads and six) as 1/2 × 1/6?","options":["Because heads and six are mutually exclusive.","Because both outcomes are fair.","Because any \u0027and\u0027 question is answered by multiplying.","Because the coin toss and the die roll are independent: the coin\u0027s result does not change the die\u0027s probabilities."],"answer":3,"explain":"AND 规则的通行证是 independence。A 错：互斥事件的合取概率是 0；B 公平性不是乘法的条件（偏骰独立时也可相乘）；C 是“看到 AND 就乘”的误区。","hf":false},{"id":"prob-L4-q07","module":"prob","lecture":"L4","topic":"概率的含义","q":"A student who has studied hard and understood the course reasons: \u0027Exactly 10% of the class gets an HD, so my probability of an HD is exactly 10%.\u0027 What is the main problem?","options":["There is no problem; class frequencies always equal individual probabilities.","The student commits the gambler\u0027s fallacy.","A population frequency need not equal the probability for an individual given all their evidence; her preparation may make her probability higher than 10%.","Probabilities about grades are undefined, so no number can be given."],"answer":2,"explain":"Reading 3：10% 是总体频率；P(you get HD | your evidence) 会随个人信息（是否学习、是否缺席等）而变化。B 与连续结果无关；D 太极端——可以用 epistemic probability 表达。","hf":false},{"id":"prob-L4-q08","module":"prob","lecture":"L4","topic":"概率的含义","q":"\u0027Given my limited information, I have only 10% confidence that you will receive an HD.\u0027 Which interpretation of probability does this express?","options":["Epistemic probability","Frequency interpretation","Objective physical chance","Logical necessity"],"answer":0,"explain":"Epistemic probability 衡量现有证据支持某命题的程度，会随信息改变。频率理解描述群体比例；objective chance 指公平硬币、骰子那样设计出的随机机制。","hf":false},{"id":"prob-L4-q09","module":"prob","lecture":"L4","topic":"概率的含义","q":"Which of the following is most naturally a frequency statement rather than an epistemic one?","options":["In this class, about one in ten students ends up with an HD.","Given the evidence, I\u0027m fairly confident the defendant is guilty.","Based on what I know about you, you have a good chance of passing.","I\u0027d put 30% on it raining tomorrow, given this forecast."],"answer":0,"explain":"A 描述一个群体中的比例（frequency）。B、C、D 都是在表达基于证据的信心程度（epistemic）。","hf":false},{"id":"prob-L4-q10","module":"prob","lecture":"L4","topic":"概率树","q":"Which of the following is NOT a requirement on the terminal branches of a complete probability tree?","options":["They cover every possible case.","No two of them can occur together.","Their probabilities sum to 1.","They all have equal probability."],"answer":3,"explain":"完备划分要求：穷尽、互斥、和为 1。不要求等概率——例如 HD 赌局树里各分支概率就不同。","hf":false},{"id":"prob-L4-q11","module":"prob","lecture":"L4","topic":"概率的含义","q":"The lecturer noted that even if one option has a higher probability of winning, that may not settle what to choose. What else may matter (a preview of expected utility)?","options":["Nothing else; the most probable option is always rational.","The size of the reward, the cost of effort, and one\u0027s attitude to risk.","Only whether the trials are independent.","Only whether the probability is frequency-based or epistemic."],"answer":1,"explain":"概率不一定足以决定行动，还要考虑奖励大小、努力成本、风险偏好、结果的价值等，这会在后面的 expected utility 中展开。","hf":false},{"id":"prob-L8-q01","module":"prob","lecture":"L8","topic":"赌徒谬误","q":"Which is the best definition of the gambler\u0027s fallacy?","options":["Believing that a fair coin is biased after a long run of heads.","Treating trials as independent while nonetheless judging an outcome more likely because it has not occurred recently (or less likely because it has).","Making any arithmetic error when calculating gambling odds.","Believing a scam will eventually pay out if you keep trying."],"answer":1,"explain":"赌徒谬误 = 承认（或假设）独立，却因过去序列认为下一次相反结果“到期”。A 是怀疑公平性，不是补偿推理；C 只是算错；D 主要是把骗局误当有真实中奖概率的事实前提错误。","hf":true},{"id":"prob-L8-q02","module":"prob","lecture":"L8","topic":"赌徒谬误","q":"A fair coin, tossed independently, has landed heads 12 times in a row. What is the probability of tails on the 13th toss?","options":["Greater than 1/2, because tails is due","1/2","Less than 1/2, because the coin is on a streak","1/2^13"],"answer":1,"explain":"独立试验中过去序列不改变下一次概率，仍为 1/2。A 是赌徒谬误；C 是“热手”式反向错误；D 是整串 13 次的概率，不是第 13 次单次的概率。","hf":true},{"id":"prob-L8-q03","module":"prob","lecture":"L8","topic":"公平 vs 独立","q":"A die lands 6 with probability 0.30 on every roll, and the rolls are independent. Which is true?","options":["It is fair and independent.","It is unfair, so its rolls cannot be independent.","It is unfair but its rolls are independent.","It is fair, because the probability of 6 is the same on every roll."],"answer":2,"explain":"Fairness 看单次分布（0.30 ≠ 1/6，不公平）；independence 看各次之间（题设独立）。B 把两者混为一谈；D 把“每次相同”误当作“公平”。","hf":true},{"id":"prob-L8-q04","module":"prob","lecture":"L8","topic":"公平 vs 独立","q":"For a judgment to count as the gambler\u0027s fallacy, which assumption is essential?","options":["The trials are 50/50.","The outcomes are mutually exclusive.","The trials are (taken to be) independent.","The gambler has lost money."],"answer":2,"explain":"赌徒谬误需要的是独立性，而不是 50/50：二十面骰掷出 2 的概率一直是 1/20，很久没出 2 也不会让下一掷变大。","hf":true},{"id":"prob-L8-q05","module":"prob","lecture":"L8","topic":"赌徒谬误诊断","q":"Sam says: \u0027There have been no parking inspections for three days, so an inspection today is more likely.\u0027 Without further information, what is the right diagnosis?","options":["Definitely the gambler\u0027s fallacy, because inspections are random events.","Definitely good reasoning, because inspections must even out over time.","It depends on whether inspections are independent day to day; if they follow rosters or cycles, past days may carry information.","It is a logical contradiction."],"answer":2,"explain":"若每天随机且独立，这是谬误；若有轮班表、巡查周期或记录机制，过去确实提供信息。教授的方法论：先查独立性与隐含前提，不要直接贴标签。B 用“长期会平衡”辩护也是错的。","hf":true},{"id":"prob-L8-q06","module":"prob","lecture":"L8","topic":"赌徒谬误诊断","q":"Someone was caught transporting an illegal animal and concludes they are now more likely to be stopped in future. Is this the gambler\u0027s fallacy?","options":["No, because the first event may have put them on an enforcement list, so later stops really are dependent on the first.","Yes, because past stops never affect future stops.","Yes, because being stopped is a fair 50/50 event.","No, because the events are mutually exclusive."],"answer":0,"explain":"进入执法名单等机制会让先前事件真实改变后续概率，试验不独立，所以不是赌徒谬误。D 与问题无关：两次被查可以同时为真。","hf":false},{"id":"prob-L8-q07","module":"prob","lecture":"L8","topic":"赌徒谬误诊断","q":"A person sincerely believes the universe actively compensates losers, so after many losses a win becomes more likely. Why might this not be the gambler\u0027s fallacy in the strictest sense?","options":["Because the person is reasoning validly from true premises.","Because cosmic compensation has been scientifically confirmed.","Because the gambler\u0027s fallacy only applies to coins.","Because the person denies that the trials are independent; the error lies in a false factual premise rather than in reasoning while granting independence."],"answer":3,"explain":"严格的赌徒谬误是一边承认独立、一边做补偿判断。相信神秘力量介入的人其实否认了独立性——他的世界观（前提）可能错，但推理形式未必错。A 错在前提并非真实。","hf":false},{"id":"prob-L8-q08","module":"prob","lecture":"L8","topic":"赌徒谬误诊断","q":"A scam email promises a huge refund if you send a fee; a victim thinks \u0027if I keep trying, eventually one will pay out\u0027. According to the lecture, the main error is best described as:","options":["A classic gambler\u0027s fallacy about independent trials.","A false factual premise: treating the scam as if it had a real chance of paying out.","A violation of De Morgan\u0027s laws.","Confusing mutual exclusivity with independence."],"answer":1,"explain":"诈骗邮件的问题首先是把骗局误当成有真实中奖概率——概率/事实前提错误，而不是典型赌徒谬误。教授借此提醒：不要看到错误结论就贴 fallacy 标签。","hf":false},{"id":"prob-L8-q09","module":"prob","lecture":"L8","topic":"长期频率","q":"\u0027In the long run the proportion of heads approaches 1/2, so after 40 heads in a row, tails must become more likely.\u0027 What is wrong?","options":["Nothing; long-run convergence requires short-run compensation.","Long-run proportions approach 1/2 by diluting early imbalances with many later trials, not by making the next trial favour tails.","The long-run proportion of heads actually approaches 1.","After 40 heads, the coin must be biased toward tails."],"answer":1,"explain":"频率趋近 ≠ 短期补偿；dilution of imbalance ≠ reversal on the next trial。已经发生的 40 个正面不会被改写，只会在总样本中被稀释。","hf":false},{"id":"prob-L8-q10","module":"prob","lecture":"L8","topic":"独立性定义","q":"Which condition expresses that A and B are independent?","options":["P(A ∧ B) = 0","P(A|B) = P(A)","P(A ∨ B) = P(A) + P(B)","P(A) = P(B)"],"answer":1,"explain":"独立 ⇔ 知道 B 不改变 A 的概率，即 P(A|B) = P(A)。A 是互斥（非零概率时恰恰不独立）；C 是互斥时的加法规则；D 边际概率相等与独立无关（咖啡/茶 toy model）。","hf":true},{"id":"prob-L8-q11","module":"prob","lecture":"L8","topic":"独立性定义","q":"Suppose learning B does not change the probability of A (all probabilities well defined and positive). What follows about learning A?","options":["Learning A must change the probability of B.","Nothing follows about B.","Learning A does not change the probability of B either, because independence is symmetric.","A must have caused B."],"answer":2,"explain":"独立性是对称的：P(A|B)=P(A) 时 P(B|A)=P(B)。这种对称是概率关系的性质，不意味着两件事互相造成对方（D 错）。","hf":false},{"id":"prob-L8-q12","module":"prob","lecture":"L8","topic":"概率更新 vs 因果","q":"Firecrackers never explode spontaneously; a lit firecracker explodes with probability 1/3. You learn a firecracker exploded. What is P(it was lit | it exploded), and what does this show?","options":["1/3; the explosion has no bearing on the lighting.","1; this shows the explosion caused the earlier lighting.","1/2; we must split evenly between lit and unlit.","1; but this is an update of our credence about an earlier event, not backward causation."],"answer":3,"explain":"P(E|¬L) = 0，所以一旦爆炸，必然被点燃过：P(L|E) = 1。改变的是观察者对过去事件的合理置信度，而不是爆炸穿越时间造成点燃。A 把 P(E|L) 和 P(L|E) 搞反了。","hf":true},{"id":"prob-L8-q13","module":"prob","lecture":"L8","topic":"扑克牌：独立与互斥","q":"One card is drawn at random from a standard 52-card deck. Are \u0027the card is an Ace\u0027 and \u0027the card is a Spade\u0027 independent?","options":["No, because they can both be true (the Ace of Spades).","No, because they are mutually exclusive.","Yes, because P(Ace | Spade) = 1/13 = P(Ace).","Yes, because P(Ace) = P(Spade)."],"answer":2,"explain":"P(Ace) = 4/52 = 1/13；已知是黑桃，13 张中 1 张 A，仍是 1/13，所以独立。A 把“能同时发生”误当作不独立；B 事实错误；D 两者概率并不相等（1/13 vs 1/4），且边际相等也不是独立的标准。","hf":true},{"id":"prob-L8-q14","module":"prob","lecture":"L8","topic":"扑克牌：独立与互斥","q":"One card is drawn from a standard deck. What is the relationship between \u0027the card is a Heart\u0027 and \u0027the card is Red\u0027?","options":["Independent, since P(Red) = 1/2 regardless.","Mutually exclusive.","Not independent: Heart entails Red, so P(Red | Heart) = 1 while P(Red) = 1/2.","Independent, since they are about different features (suit and colour)."],"answer":2,"explain":"知道是红桃会把红色的概率从 1/2 提到 1，所以不独立；Heart 蕴含 Red。D 的直觉对 Ace/Red 成立（2/26 = 1/13），但对 Heart/Red 不成立。","hf":false},{"id":"prob-L8-q15","module":"prob","lecture":"L8","topic":"扑克牌：独立与互斥","q":"For a single card drawn from a standard deck, \u0027Club\u0027 and \u0027Spade\u0027 are:","options":["Mutually exclusive and independent.","Mutually exclusive and not independent.","Neither mutually exclusive nor independent.","Independent but not mutually exclusive."],"answer":1,"explain":"一张牌不能既是梅花又是黑桃（互斥）；知道是梅花会把黑桃的概率从 1/4 降到 0（不独立）。高频误区：互斥通常意味着强烈不独立，而不是独立。","hf":true},{"id":"prob-L10-q01","module":"prob","lecture":"L10","topic":"互斥 vs 独立","q":"On a single roll of a die, A = \u0027rolls a 2\u0027 and B = \u0027rolls a 3\u0027. The roll comes up 5. Which statement is correct?","options":["A and B are not mutually exclusive, because they are both false.","A and B are mutually exclusive; mutual exclusivity only rules out both being true, so both can be false.","A and B are independent, because the roll was 5.","Mutually exclusive propositions must have exactly one true member."],"answer":1,"explain":"互斥只排除“同真”，允许“同假”。D 是“互斥 = 一真一假”的误区（那是互斥且穷尽）；C 错：知道掷出 2 会把掷出 3 的概率降为 0，所以它们不独立。","hf":true},{"id":"prob-L10-q02","module":"prob","lecture":"L10","topic":"OR/AND 规则条件","q":"Before using P(A ∨ B) = P(A) + P(B), what must you check?","options":["That A and B are independent.","That A and B have equal probabilities.","That A and B cannot both be true.","That A and B are jointly exhaustive."],"answer":2,"explain":"OR 的直接加法需要互斥。独立性是 AND 乘法的条件；等概率不是加法条件（彩票一、二等奖概率不同也能相加）；穷尽是补集规则需要的。","hf":true},{"id":"prob-L10-q03","module":"prob","lecture":"L10","topic":"OR/AND 规则条件","q":"Before using P(A ∧ B) = P(A) × P(B), what must you check?","options":["That learning one does not change the probability of the other.","That A and B cannot both be true.","That A and B occur at different times.","That both events are fair."],"answer":0,"explain":"AND 的直接乘法需要独立性。B 是互斥——互斥时合取概率为 0；C 不同时间不自动保证独立；D 公平不是乘法条件。","hf":true},{"id":"prob-L10-q04","module":"prob","lecture":"L10","topic":"OR/AND 规则条件","q":"On a single roll of a fair die, P(2) = 1/6 and P(3) = 1/6. What is P(2 ∧ 3)?","options":["0","1/36","1/3","1/6"],"answer":0,"explain":"同一次投掷不可能同时得到 2 和 3，概率为 0。1/36 是“看到 AND 就乘”的错误——给出两个概率并不授权相乘；1/3 是 P(2 ∨ 3)。","hf":true},{"id":"prob-L10-q05","module":"prob","lecture":"L10","topic":"OR/AND 规则条件","q":"Drawing one card, why is P(King ∨ Heart) NOT equal to 4/52 + 13/52?","options":["Because King and Heart are independent.","Because the events overlap on the King of Hearts, which would be counted twice.","Because the OR rule only applies to dice.","Because Kings and Hearts are not equally likely."],"answer":1,"explain":"OR 不等于自动获得加法通行证：K 与 H 可同真（红桃 K），直接相加会重复计数。它们确实独立（1/13），但独立不是加法条件；等概率也不是。","hf":true},{"id":"prob-L10-q06","module":"prob","lecture":"L10","topic":"逻辑等价与概率","q":"Given P(A ∧ B) = 1/3 and P(A ∧ ¬B) = 1/5, what is P(A)?","options":["8/15","1/15","2/15","Cannot be determined without P(B)"],"answer":0,"explain":"A∧B 与 A∧¬B 互斥（一个要 B，一个要 ¬B），可相加：1/3 + 1/5 = 8/15；且 (A∧B)∨(A∧¬B) ≡ A，所以 P(A) = 8/15。1/15 是错误乘法；D 错在不需要 P(B)。","hf":true},{"id":"prob-L10-q07","module":"prob","lecture":"L10","topic":"逻辑等价与概率","q":"Which statement about (A ∧ B) ∨ (A ∧ ¬B) is correct?","options":["It is a tautology, so its probability is 1.","It is logically equivalent to A, but it is not a tautology.","It is a contradiction, so its probability is 0.","It is logically equivalent to B."],"answer":1,"explain":"A 真时两分支恰有一个真；A 假时两分支都假——真值与 A 完全一致，所以等价于 A。因 A 假时它为假，所以不是永真式。","hf":false},{"id":"prob-L10-q08","module":"prob","lecture":"L10","topic":"OR/AND 规则条件","q":"P(A) = 1/3, P(B) = 1/6, P(C) = 1/9; A and B are independent; A and C are mutually exclusive. What is P[(A ∧ B) ∨ C]?","options":["1/18","1/6","1/9","11/18"],"answer":1,"explain":"先用独立：P(A∧B) = 1/3×1/6 = 1/18。A∧B 为真必须 A 真，而 A 与 C 不能同真，所以 A∧B 与 C 互斥，可加：1/18 + 2/18 = 3/18 = 1/6。11/18 是错把 1/3+1/6+1/9 相加。","hf":true},{"id":"prob-L10-q09","module":"prob","lecture":"L10","topic":"互斥 vs 独立","q":"A and B are independent and each has positive probability. Which must be true?","options":["P(A ∧ B) = 0","A and B are mutually exclusive.","P(A ∨ B) = P(A) + P(B)","P(A ∧ B) = P(A)P(B) \u003e 0, so A and B can occur together."],"answer":3,"explain":"独立且概率为正 → 交集概率为正，可以共同发生（两次投币都正面 1/4）。前三个选项都是互斥的性质，与独立冲突。","hf":true},{"id":"prob-L10-q10","module":"prob","lecture":"L10","topic":"互斥 vs 独立","q":"Why are two mutually exclusive events with positive probabilities never independent?","options":["Because mutually exclusive events always have equal probabilities.","Because learning that one occurred lowers the other\u0027s probability to 0, which changes it.","Because they are always causally connected.","Actually they are always independent, since one cannot influence the other."],"answer":1,"explain":"例如掷骰前 P(3) = 1/6，得知结果是 2 后 P(3) = 0——信息改变了概率，违反独立性。D 把“没有因果影响”误当成“独立”；独立看的是信息/概率变化。","hf":true},{"id":"prob-L10-q11","module":"prob","lecture":"L10","topic":"补集","q":"P(A ∨ B ∨ C) = 5/6 and P(A ∨ B ∨ C ∨ D) = 1. Under what additional condition can we conclude P(D) = 1/6?","options":["D is independent of A, B and C.","D has the same probability as A.","D is mutually exclusive with A, B and C.","No condition is needed; it always follows."],"answer":2,"explain":"减法成立的关键是 D 与已有并集无重叠。若 D 部分落在 A∨B∨C 已覆盖的范围内，并集仍可等于 1，但 P(D) 不一定是 1/6。独立不是这里需要的条件。","hf":false},{"id":"prob-L10-q12","module":"prob","lecture":"L10","topic":"有序 vs 无序","q":"Two fair dice are rolled. What is the probability that one die shows 3 and the other shows 4?","options":["1/36","1/12","1/6","1/18"],"answer":3,"explain":"未指定哪颗是 3，所以包含 (3,4) 和 (4,3) 两个互斥有序结果：2/36 = 1/18。1/36 是“骰子1为3且骰子2为4”的答案。","hf":true},{"id":"prob-L10-q13","module":"prob","lecture":"L10","topic":"放回 vs 不放回","q":"A bag has 3 blue and 2 green balls. You draw a blue ball and do NOT replace it. What is the probability the second ball is blue, and what does this show?","options":["3/5; the draws are independent.","2/5; the draws are mutually exclusive.","1/2; the first draw changes the second\u0027s probability, so the draws are dependent.","1/2; the draws are independent because each ball is equally likely."],"answer":2,"explain":"剩 2 蓝 2 绿，第二次蓝 = 2/4 = 1/2，与 3/5 不同，所以不独立。3/5 是有放回的情形；D 的“等可能”说的是单次结构，不能推出独立。","hf":true},{"id":"prob-L10-q14","module":"prob","lecture":"L10","topic":"不等可能结果","q":"A loaded die has P(1) = 1/5 and each of 2–6 has probability 4/25. What is P(even)?","options":["12/25","1/2","3/5","13/25"],"answer":0,"explain":"P(2∨4∨6) = 4/25 + 4/25 + 4/25 = 12/25（三面互斥，可按实际概率相加）。1/2 是错误地“数面”（3/6）；13/25 是奇数的概率。","hf":true},{"id":"prob-L10-q15","module":"prob","lecture":"L10","topic":"不等可能结果","q":"When is the method \u0027number of favourable outcomes ÷ total number of outcomes\u0027 reliable?","options":["Whenever the outcomes are mutually exclusive.","Only when the basic outcomes are equally likely.","Whenever the trials are independent.","Always, for any finite set of outcomes."],"answer":1,"explain":"简单计数要求等可能；不等可能时（偏骰、面积不等的转盘）要把互斥结果的实际概率逐项相加。互斥是加法的条件，等权是计数法的条件。","hf":false},{"id":"prob-L10-q16","module":"prob","lecture":"L10","topic":"依赖：关联与因果","q":"Toy model: half of people like both coffee and tea, half like neither. So P(C) = P(T) = 1/2. Which is correct?","options":["C and T are independent because their probabilities are equal.","P(C ∧ T) = 1/4.","C and T are dependent: P(C ∧ T) = 1/2, and learning someone likes tea raises P(C) from 1/2 to 1.","The model shows that liking tea causes liking coffee."],"answer":2,"explain":"边际概率相同不保证独立；这里知道喜欢茶就确定喜欢咖啡。B 错用了乘法；D 错：dependence 本身不证明因果，可能是共同偏好等关联。","hf":false},{"id":"prob-L10-q17","module":"prob","lecture":"L10","topic":"依赖：关联与因果","q":"Learning that a lawn is wet raises the probability that the sprinkler was on. What can we conclude?","options":["The events are dependent, but dependence alone does not determine the causal explanation (rain could also wet the lawn).","The wet lawn caused the sprinkler to turn on.","The events are independent, since the sprinkler was on before the lawn got wet.","The events are mutually exclusive."],"answer":0,"explain":"只要一个信息改变另一个的概率，就是 dependent；但依赖可能来自因果、共同原因或其他关联，不能直接读出唯一因果。B 是倒因果误读；C 把时间先后误当独立性标准。","hf":false},{"id":"prob-L10-q18","module":"prob","lecture":"L10","topic":"补集","q":"A flight is on time with probability 0.82. Under what condition is P(not on time) = 0.18?","options":["When \u0027on time\u0027 and \u0027not on time\u0027 are independent.","Only when the flight has been delayed before.","When both outcomes are equally likely.","When \u0027on time\u0027 and \u0027not on time\u0027 are mutually exclusive and together exhaust all possibilities."],"answer":3,"explain":"补集规则 P(¬A) = 1 − P(A) 需要 A 与 ¬A 互斥且穷尽。A 选项错：非零概率的互斥事件不独立。","hf":false},{"id":"prob-L10-q19","module":"prob","lecture":"L10","topic":"逻辑等价与概率","q":"Which inference is valid?","options":["If two propositions are logically equivalent, they have the same probability.","If two propositions have the same probability, they are logically equivalent.","If a proposition is empirically certain (e.g. the sun will rise tomorrow), it is a tautology.","If a proposition has probability 1/2, it is a contradiction."],"answer":0,"explain":"等价 → 每种情况下同真同假 → 概率相同；反过来不成立。C 混淆了经验上的极高可信度与逻辑必然性。","hf":false},{"id":"prob-L10-q20","module":"prob","lecture":"L10","topic":"互斥 vs 独立","q":"A and C are mutually exclusive. Which follows?","options":["B and C are mutually exclusive, for any B.","A ∧ B and C are mutually exclusive, for any B.","A and C are independent.","A ∨ B and C are mutually exclusive, for any B."],"answer":1,"explain":"A∧B 为真必须 A 为真，而 A 不能与 C 同真，所以更强的 A∧B 也不能与 C 同真。但这不说明 B 与 C 互斥（A 错）；A∨B 可以经由 B 与 C 同真（D 错）；非零概率互斥事件不独立（C 错）。","hf":false}],"calc":[{"id":"prob-L2-c01","module":"prob","lecture":"L2","topic":"Monty Hall 变体","q":"Four-door Monty Hall: one car, three goats. You pick Door 1. A host who knows where the car is opens one of the other three doors, always revealing a goat. You then switch to one of the two remaining unopened doors, chosen at random. What is the probability that you win by switching?","steps":[{"label":"初选门正确的概率","prompt":"P(car behind Door 1) = ?","answer":0.25,"tol":0.001,"hint":"4 扇门中随机选 1 扇"},{"label":"汽车在其余门中的概率","prompt":"P(car behind one of the other three doors) = ?","answer":0.75,"tol":0.001,"hint":"补集：1 − 1/4；主持人从不打开汽车门，所以这 3/4 落在两扇剩余的未开门上"},{"label":"换门获胜概率","prompt":"P(switch wins) = ?","answer":0.375,"tol":0.001,"hint":"初选错（3/4）× 在两扇剩余门中选对（1/2）"}],"final":"P(switch wins) = 3/4 × 1/2 = 3/8 = 0.375 (better than staying, 1/4)","work":"P(initial pick correct) = 1/4, so staying wins with probability 1/4.\nIf the initial pick is wrong (probability 3/4), the car is behind one of the other three doors. The informed host opens a goat door, so the car is behind one of the two remaining unopened doors.\nSwitching at random to one of these two wins with probability 1/2.\nIf the initial pick is right, switching always loses.\nP(switch wins) = 3/4 × 1/2 + 1/4 × 0 = 3/8 = 0.375.","explain":"思路与标准版一样：初选概率 1/4 不会因为知情主持人排除了一个山羊门而改变；但这里换门还要在两扇门之间再选一次，所以是 3/4×1/2。3/8 \u003e 1/4，换门仍更好。易错：以为剩三扇门就各 1/3。","table":null},{"id":"prob-L2-c02","module":"prob","lecture":"L2","topic":"随机主持人","q":"Three doors, one car. You pick Door 1. The host does not know where the car is and opens Door 2 or Door 3 at random (probability 1/2 each). He opens Door 3 and it shows a goat. Using a probability tree, find P(car behind Door 2 | host opens Door 3 and shows a goat).","steps":[{"label":"路径：车在1且开3","prompt":"P(car 1 ∧ host opens 3) = ?","answer":0.16667,"tol":0.002,"hint":"1/3 × 1/2"},{"label":"路径：车在2且开3","prompt":"P(car 2 ∧ host opens 3) = ?","answer":0.16667,"tol":0.002,"hint":"1/3 × 1/2，门 3 后是山羊"},{"label":"证据总概率","prompt":"P(host opens 3 and shows goat) = ?","answer":0.33333,"tol":0.002,"hint":"车在 3 且开 3 会露出汽车，要删除；只加相容路径"},{"label":"换门获胜（条件化后）","prompt":"P(car 2 | E) = ?","answer":0.5,"tol":0.002,"hint":"(1/6)/(1/3)"}],"final":"P(switch wins | goat at Door 3) = (1/6)/(1/3) = 1/2","work":"Tree: car behind 1, 2, 3 with probability 1/3 each; host opens 2 or 3 with probability 1/2 each. Each complete path = 1/3 × 1/2 = 1/6.\nE = host opens Door 3 and shows a goat. Compatible paths: (car 1, open 3) = 1/6; (car 2, open 3) = 1/6. The path (car 3, open 3) reveals the car and is eliminated.\nP(E) = 1/6 + 1/6 = 1/3.\nP(car 1 | E) = (1/6)/(1/3) = 1/2;  P(car 2 | E) = (1/6)/(1/3) = 1/2.\nSo staying and switching each win with probability 1/2.","explain":"这是教授黑板上的树（每条完整分支 1/6）。关键：随机主持人可能打开汽车，看到山羊只是碰巧，所以没有标准版的 2/3 优势。易错：忘记删去“开 3 见车”的分支，或删了之后不归一化。","table":null},{"id":"prob-L4-c03","module":"prob","lecture":"L4","topic":"归一化","q":"Random host among the two unchosen doors (you picked Door 1; host picks Door 2 or 3 with probability 1/2 each, without knowing where the car is). You are told only that the host revealed a goat (not which door). Find P(goat revealed), the normalised probability of each remaining branch, and P(switch wins | goat revealed).","steps":[{"label":"露出山羊的总概率","prompt":"P(goat revealed) = ?","answer":0.66667,"tol":0.002,"hint":"6 条分支各 1/6，其中 2 条露出汽车；剩 4 条"},{"label":"每条保留分支归一化后","prompt":"Each remaining branch after normalisation = ?","answer":0.25,"tol":0.002,"hint":"(1/6)/(2/3)"},{"label":"换门获胜","prompt":"P(switch wins | goat revealed) = ?","answer":0.5,"tol":0.002,"hint":"保留的 4 条中换门赢的有 2 条（车在 2 开 3、车在 3 开 2）"}],"final":"P(goat) = 2/3; each branch = 1/4; P(switch wins | goat) = 2 × 1/4 = 1/2","work":"Six complete paths, each 1/3 × 1/2 = 1/6.\nPaths revealing the car: (car 2, open 2) and (car 3, open 3). Eliminate them.\nRemaining: (car 1, open 2), (car 1, open 3), (car 2, open 3), (car 3, open 2); total = 4 × 1/6 = 2/3.\nNormalise: each = (1/6)/(2/3) = 1/4.\nSwitch wins on (car 2, open 3) and (car 3, open 2): 2 × 1/4 = 1/2. Switch loses on the other two: 1/2.","explain":"这是 L4 PPT 上“四条剩余分支各 1/4，两 Good 两 Bad”的例子，结果 50/50。口诀：先列全，后删枝，删完再归一。","table":null},{"id":"prob-L4-c04","module":"prob","lecture":"L4","topic":"Monty Hall 变体","q":"Quiz variant: you pick Door 1. The host, not knowing where the car is, opens one of ALL THREE doors at random (probability 1/3 each), so he might open your door or the car door. You are told he opened a door you did not choose and it showed a goat. Find P(switch wins | this evidence), where \u0027switch\u0027 means moving to the other unopened door.","steps":[{"label":"车在1且主持人开了一扇未选门（必为山羊）","prompt":"P(car 1 ∧ host opens Door 2 or 3) = ?","answer":0.22222,"tol":0.002,"hint":"1/3 × (1/3 + 1/3)"},{"label":"车不在1且主持人开了另一扇未选山羊门","prompt":"P(car not 1 ∧ host opens the unchosen goat door) = ?","answer":0.22222,"tol":0.002,"hint":"车在2开3：1/3×1/3；车在3开2：1/3×1/3"},{"label":"证据总概率","prompt":"P(evidence) = ?","answer":0.44444,"tol":0.002,"hint":"两者相加"},{"label":"换门获胜","prompt":"P(switch wins | evidence) = ?","answer":0.5,"tol":0.002,"hint":"(2/9)/(4/9)"}],"final":"P(switch wins | goat behind an unchosen opened door) = (2/9)/(4/9) = 1/2","work":"Nine complete paths: car location (1/3 each) × host\u0027s door (1/3 each), each 1/9.\nEliminate paths where the host opens Door 1 (your door) or opens the car door.\nRemaining, switch loses: (car 1, open 2), (car 1, open 3): 2/9.\nRemaining, switch wins: (car 2, open 3), (car 3, open 2): 2/9.\nP(evidence) = 4/9.\nP(switch wins | evidence) = (2/9)/(4/9) = 1/2.","explain":"删去所有不符合证据的分支后，留与换的保留概率相等，归一化后 50/50。笔记里未归一化的数值写成 1/3 对 1/3，这里每条分支按 1/9 算成 2/9 对 2/9，比例相同，结论都是 1/2。","table":null},{"id":"prob-L4-c05","module":"prob","lecture":"L4","topic":"HD 赌局","q":"One in ten students gets an HD. The HD bet: toss a fair coin; if heads, roll a fair six-sided die; if it shows 6 you get an HD. (a) What is the probability the bet gives an HD? (b) If the bet is an extra chance used only when you would not otherwise get an HD, what is your total probability of an HD?","steps":[{"label":"赌局本身","prompt":"P(heads ∧ six) = ?","answer":0.08333,"tol":0.001,"hint":"硬币与骰子独立：1/2 × 1/6"},{"label":"原本没拿 HD 的概率","prompt":"P(no HD ordinarily) = ?","answer":0.9,"tol":0.001,"hint":"补集 1 − 1/10"},{"label":"额外机会读法的总概率","prompt":"P(HD) under Reading 2 = ?","answer":0.175,"tol":0.001,"hint":"1/10 + 9/10 × 1/12"}],"final":"(a) 1/12 ≈ 0.0833 \u003c 0.1, so as a replacement reject; (b) 1/10 + 9/10 × 1/12 = 21/120 = 0.175, so as an extra chance accept","work":"(a) Coin and die are independent: P(H ∧ 6) = 1/2 × 1/6 = 1/12 ≈ 0.0833.\nReading 1 (replacement): 1/12 \u003c 1/10, so the bet is worse.\n(b) Reading 2 (extra chance): P(HD) = P(ordinary HD) + P(no ordinary HD) × P(bet wins) = 1/10 + 9/10 × 1/12 = 12/120 + 9/120 = 21/120 = 0.175.","explain":"答案取决于题意：替换 → 8.33% \u003c 10% 拒绝；额外机会 → 17.5% 接受。易错：(b) 写成 1/10 + 1/12，没有乘 9/10（重复算了“原本就拿 HD 又中赌局”的情形）。还要记得 Reading 3：班级 10% 未必是你的个人概率。","table":null},{"id":"prob-L4-c06","module":"prob","lecture":"L4","topic":"HD 赌局","q":"Variant HD bet: one in five students gets an HD. The bet: toss a fair coin; if heads, roll a fair die; if it shows 5 or 6 you get an HD. (a) Should you accept it as a replacement for your ordinary chance? (b) What is your total probability of an HD if the bet is an extra chance used only when you would not otherwise get one?","steps":[{"label":"赌局本身","prompt":"P(heads ∧ (5 or 6)) = ?","answer":0.16667,"tol":0.002,"hint":"1/2 × 2/6；5 与 6 互斥可相加得 2/6"},{"label":"原本没拿 HD","prompt":"P(no HD ordinarily) = ?","answer":0.8,"tol":0.001,"hint":"1 − 1/5"},{"label":"额外机会总概率","prompt":"P(HD) under the extra-chance reading = ?","answer":0.33333,"tol":0.002,"hint":"1/5 + 4/5 × 1/6"}],"final":"(a) 1/6 ≈ 0.167 \u003c 0.2, reject as a replacement; (b) 1/5 + 4/5 × 1/6 = 1/3 ≈ 0.333, accept as an extra chance","work":"P(5 ∨ 6) = 1/6 + 1/6 = 1/3 (mutually exclusive faces).\nCoin and die independent: P(H ∧ (5 ∨ 6)) = 1/2 × 1/3 = 1/6 ≈ 0.1667.\n(a) 1/6 \u003c 1/5, so as a replacement the bet is worse.\n(b) P(HD) = 1/5 + (4/5)(1/6) = 6/30 + 4/30 = 10/30 = 1/3 ≈ 0.3333.","explain":"同一结构的变式：OR（5 或 6）用互斥加法，AND（正面且 5/6）用独立乘法，再用补集 4/5 计算额外机会。","table":null},{"id":"prob-L2-c07","module":"prob","lecture":"L2","topic":"Monty Hall 变体","q":"Ten doors, one car. You pick Door 1. A host who knows where the car is opens exactly ONE of the other nine doors, always revealing a goat. You then switch to one of the eight remaining unopened doors at random. Find P(stay wins) and P(switch wins).","steps":[{"label":"留在原门获胜","prompt":"P(stay wins) = ?","answer":0.1,"tol":0.001,"hint":"初选概率不因知情主持人开门而改变"},{"label":"初选错误","prompt":"P(initial pick wrong) = ?","answer":0.9,"tol":0.001,"hint":"补集"},{"label":"换门获胜","prompt":"P(switch wins) = ?","answer":0.1125,"tol":0.001,"hint":"9/10 × 1/8"}],"final":"P(stay) = 0.1; P(switch) = 9/10 × 1/8 = 9/80 = 0.1125 — switching is still (slightly) better","work":"P(stay wins) = 1/10 = 0.1.\nIf the initial pick is wrong (9/10), the car is behind one of the 8 doors that remain unopened besides Door 1 (the host never opens the car door).\nSwitching at random to one of these 8 wins with probability 1/8.\nP(switch wins) = 9/10 × 1/8 = 9/80 = 0.1125 \u003e 0.1.","explain":"推广 100 门版本的直觉：知情主持人排除错误项不会提升你初选的概率；未选门共有的 9/10 分摊到剩下的 8 扇门上。易错：以为剩 9 扇门每扇都是 1/9。","table":null},{"id":"prob-L8-c08","module":"prob","lecture":"L8","topic":"赌徒谬误","q":"A fair coin is tossed independently. (a) Before tossing, what is the probability of 5 heads in a row? (b) Given that the first 5 tosses were all heads, what is the probability that the 6th toss is heads? (c) Before tossing, what is the probability of 6 heads in a row?","steps":[{"label":"(a) 五连正","prompt":"P(HHHHH) = ?","answer":0.03125,"tol":0.0005,"hint":"(1/2)^5"},{"label":"(b) 已知五连正后第 6 次正面","prompt":"P(H6 | first five heads) = ?","answer":0.5,"tol":0.001,"hint":"独立：过去不改变下一次"},{"label":"(c) 六连正","prompt":"P(HHHHHH) = ?","answer":0.015625,"tol":0.0005,"hint":"(1/2)^6"}],"final":"(a) 1/32 = 0.03125; (b) 1/2; (c) 1/64 = 0.015625","work":"(a) Independent tosses: P(5 heads) = (1/2)^5 = 1/32 = 0.03125.\n(b) Independence: P(H6 | H1...H5) = P(H6) = 1/2.\n(c) P(6 heads) = (1/2)^6 = 1/64 = 0.015625 = P(5 heads) × P(H6 | 5 heads) = 1/32 × 1/2.","explain":"区分“抛之前问整串”与“已知前面后问下一次”。六连正很罕见（1/64），但这是抛之前的概率；一旦前五次已经发生，第六次仍是 1/2。认为“已经五连正，所以第六次反面更可能”就是赌徒谬误。","table":null},{"id":"prob-L8-c09","module":"prob","lecture":"L8","topic":"公平 vs 独立","q":"A biased die lands 6 with probability 0.3 on every roll, and rolls are independent. (a) P(two 6s in a row)? (b) Given that the last four rolls were not 6, what is P(next roll is 6)? (c) P(no 6 in four rolls)? (d) P(at least one 6 in four rolls)?","steps":[{"label":"(a) 连续两个 6","prompt":"P(6 ∧ 6) = ?","answer":0.09,"tol":0.001,"hint":"独立：0.3 × 0.3"},{"label":"(b) 四次没出 6 后下一次","prompt":"P(6 next | no 6 in last four) = ?","answer":0.3,"tol":0.001,"hint":"独立 → 不变"},{"label":"(c) 四次都不是 6","prompt":"P(no 6 in four) = ?","answer":0.2401,"tol":0.001,"hint":"0.7^4"},{"label":"(d) 四次至少一个 6","prompt":"P(at least one 6) = ?","answer":0.7599,"tol":0.001,"hint":"补集：1 − 0.7^4"}],"final":"(a) 0.09; (b) 0.3; (c) 0.2401; (d) 1 − 0.2401 = 0.7599","work":"(a) P(6 ∧ 6) = 0.3 × 0.3 = 0.09 (independent).\n(b) By independence, P(6 | previous rolls) = 0.3.\n(c) P(not 6) = 1 − 0.3 = 0.7; P(no 6 in four) = 0.7^4 = 0.2401.\n(d) \u0027At least one 6\u0027 is the complement of \u0027no 6\u0027: 1 − 0.2401 = 0.7599.","explain":"这枚骰子不公平但独立：赌徒谬误只需要独立性。(d) 用补集比逐项加总简单——“至少一个”的补集是“一个都没有”。易错：(d) 写成 4×0.3 = 1.2（超过 1，说明错用了加法：各次出 6 并不互斥）。","table":null},{"id":"prob-L8-c10","module":"prob","lecture":"L8","topic":"扑克牌：独立与互斥","q":"One card is drawn at random from a standard 52-card deck. Compute P(Ace), P(Ace | Spade), P(Ace ∧ Spade), and P(Red | Heart). Use them to decide whether Ace/Spade are independent and whether Heart/Red are independent.","steps":[{"label":"P(Ace)","prompt":"P(Ace) = ?","answer":0.07692,"tol":0.001,"hint":"4/52"},{"label":"P(Ace | Spade)","prompt":"P(Ace | Spade) = ?","answer":0.07692,"tol":0.001,"hint":"13 张黑桃中 1 张 A"},{"label":"P(Ace ∧ Spade)","prompt":"P(Ace ∧ Spade) = ?","answer":0.01923,"tol":0.0005,"hint":"只有黑桃 A 一张：1/52 = 1/13 × 1/4"},{"label":"P(Red | Heart)","prompt":"P(Red | Heart) = ?","answer":1,"tol":0.001,"hint":"红桃一定是红色"}],"final":"P(Ace) = P(Ace|Spade) = 1/13 → independent; P(Ace∧Spade) = 1/52 = P(Ace)P(Spade); P(Red|Heart) = 1 ≠ P(Red) = 1/2 → not independent","work":"P(Ace) = 4/52 = 1/13 ≈ 0.0769.\nP(Ace | Spade) = 1/13 ≈ 0.0769 = P(Ace), so Ace and Spade are independent.\nCheck: P(Ace ∧ Spade) = 1/52 ≈ 0.0192 = (1/13)(1/4).\nP(Red) = 26/52 = 1/2, but P(Red | Heart) = 13/13 = 1. Learning Heart changes P(Red), so Heart and Red are not independent (Heart entails Red).","explain":"独立的判断标准是 P(A|B) = P(A)，不是“能否同时发生”。Ace 与 Spade 可以同时发生（黑桃 A）却独立；Heart 与 Red 不独立；Club 与 Spade 互斥且不独立。","table":null},{"id":"prob-L10-c11","module":"prob","lecture":"L10","topic":"逻辑等价与补集","q":"Given P(A ∧ B) = 1/4 and P(A ∧ ¬B) = 1/6. Find P[(A ∧ B) ∨ (A ∧ ¬B)], P(¬A), and P[(A ∧ B) ∧ (A ∧ ¬B)]. Justify each rule you use.","steps":[{"label":"两分支析取","prompt":"P[(A∧B) ∨ (A∧¬B)] = P(A) = ?","answer":0.41667,"tol":0.002,"hint":"两分支互斥（B 与 ¬B），可相加：1/4 + 1/6"},{"label":"补集","prompt":"P(¬A) = ?","answer":0.58333,"tol":0.002,"hint":"1 − 5/12"},{"label":"两分支合取","prompt":"P[(A∧B) ∧ (A∧¬B)] = ?","answer":0,"tol":0.001,"hint":"里面含 B ∧ ¬B，是 contradiction"}],"final":"P(A) = 1/4 + 1/6 = 5/12 ≈ 0.4167; P(¬A) = 7/12 ≈ 0.5833; P[(A∧B)∧(A∧¬B)] = 0 (not 1/24)","work":"Main connective of (A∧B) ∨ (A∧¬B) is ∨. The disjuncts are mutually exclusive: the first requires B, the second requires ¬B, and these cannot both be true. So the OR rule applies: 1/4 + 1/6 = 3/12 + 2/12 = 5/12.\n(A∧B) ∨ (A∧¬B) is logically equivalent to A, so P(A) = 5/12.\nComplement: P(¬A) = 1 − 5/12 = 7/12.\n(A∧B) ∧ (A∧¬B) contains B ∧ ¬B, a contradiction, so its probability is 0. Multiplying 1/4 × 1/6 = 1/24 would be wrong: the conjuncts are mutually exclusive, not independent.","explain":"这是 Weisberg Exercise 4（原题 1/3、1/5 → 8/15）的变式。三个规则各有通行证：OR 查互斥，等价式转移概率，NOT 用补集。最后一问是陷阱：看到 AND 先乘就错了。","table":null},{"id":"prob-L10-c12","module":"prob","lecture":"L10","topic":"OR/AND 规则条件","q":"P(A) = 1/4, P(B) = 1/5, P(C) = 1/10. A and B are independent; A and C are mutually exclusive. Find P(A ∧ C), P(A ∧ B), and P[(A ∧ B) ∨ C].","steps":[{"label":"P(A ∧ C)","prompt":"P(A ∧ C) = ?","answer":0,"tol":0.001,"hint":"A 与 C 互斥"},{"label":"P(A ∧ B)","prompt":"P(A ∧ B) = ?","answer":0.05,"tol":0.001,"hint":"独立：1/4 × 1/5"},{"label":"P[(A ∧ B) ∨ C]","prompt":"P[(A ∧ B) ∨ C] = ?","answer":0.15,"tol":0.001,"hint":"A∧B 与 C 互斥（因为 A 与 C 互斥）：1/20 + 1/10"}],"final":"P(A∧C) = 0; P(A∧B) = 1/20 = 0.05; P[(A∧B)∨C] = 1/20 + 2/20 = 3/20 = 0.15","work":"A and C are mutually exclusive, so P(A ∧ C) = 0.\nA and B are independent, so P(A ∧ B) = P(A)P(B) = 1/4 × 1/5 = 1/20.\nA ∧ B can be true only if A is true, and A cannot be true together with C, so A ∧ B and C are mutually exclusive. OR rule: P[(A∧B) ∨ C] = 1/20 + 1/10 = 3/20 = 0.15.","explain":"Weisberg Exercise 5 的变式（原题 1/3、1/6、1/9 → 1/6）。顺序：先用独立求 A∧B，再检查 A∧B 与 C 是否互斥后才能加。注意：这并不说明 B 与 C 互斥。","table":null},{"id":"prob-L10-c13","module":"prob","lecture":"L10","topic":"有序 vs 无序","q":"Two fair dice (die 1 and die 2) are rolled independently. Find: (a) P(die 1 shows 3 and die 2 shows 4); (b) P(one die shows 3 and the other shows 4); (c) P(at least one die shows 6).","steps":[{"label":"(a) 指定身份","prompt":"P(die1 = 3 ∧ die2 = 4) = ?","answer":0.02778,"tol":0.0005,"hint":"1/6 × 1/6"},{"label":"(b) 不指定身份","prompt":"P(one 3, other 4) = ?","answer":0.05556,"tol":0.0005,"hint":"(3,4) 或 (4,3)，两者互斥"},{"label":"(c-1) 两颗都不是 6","prompt":"P(neither die shows 6) = ?","answer":0.69444,"tol":0.001,"hint":"5/6 × 5/6"},{"label":"(c) 至少一颗 6","prompt":"P(at least one 6) = ?","answer":0.30556,"tol":0.001,"hint":"补集 1 − 25/36"}],"final":"(a) 1/36 ≈ 0.0278; (b) 2/36 = 1/18 ≈ 0.0556; (c) 1 − 25/36 = 11/36 ≈ 0.3056","work":"(a) Independent dice: 1/6 × 1/6 = 1/36.\n(b) The event contains two mutually exclusive ordered outcomes, (3,4) and (4,3): 1/36 + 1/36 = 2/36 = 1/18.\n(c) P(no 6 on a die) = 5/6. Independent: P(neither is 6) = 25/36. Complement: P(at least one 6) = 1 − 25/36 = 11/36 ≈ 0.3056.","explain":"题目是否指定“骰子1/骰子2”决定要不要乘 2。(c) 易错：写成 1/6 + 1/6 = 1/3——“骰子1为6”与“骰子2为6”可以同时发生，不互斥，直接相加会重复计算 (6,6)。用补集最安全。","table":null},{"id":"prob-L10-c14","module":"prob","lecture":"L10","topic":"放回 vs 不放回","q":"A bag contains 3 blue and 2 green balls. Two balls are drawn. Find P(both blue) (a) with replacement and (b) without replacement, and (c) P(second blue | first blue) without replacement.","steps":[{"label":"(a) 有放回","prompt":"P(both blue, with replacement) = ?","answer":0.36,"tol":0.001,"hint":"独立：3/5 × 3/5"},{"label":"(c) 无放回条件概率","prompt":"P(2nd blue | 1st blue, without replacement) = ?","answer":0.5,"tol":0.001,"hint":"剩 2 蓝 2 绿"},{"label":"(b) 无放回","prompt":"P(both blue, without replacement) = ?","answer":0.3,"tol":0.001,"hint":"3/5 × 2/4"}],"final":"(a) 9/25 = 0.36; (b) 3/5 × 2/4 = 3/10 = 0.3; (c) 1/2","work":"(a) With replacement (and thorough mixing) the bag is restored, so the draws are independent: (3/5)(3/5) = 9/25 = 0.36.\n(c) Without replacement, after a blue the bag holds 2 blue and 2 green: P(B2 | B1) = 2/4 = 1/2.\n(b) P(B1 ∧ B2) = P(B1) × P(B2 | B1) = 3/5 × 1/2 = 3/10 = 0.3.\nSince P(B2 | B1) = 1/2 ≠ 3/5, the draws without replacement are dependent, so (3/5)² is not correct for (b).","explain":"课堂原例。无放回时第一次改变了袋子组成，所以不独立，不能用 (3/5)²。下一讲会把 2/4 正式写成 P(B₂|B₁)。","table":null},{"id":"prob-L10-c15","module":"prob","lecture":"L10","topic":"放回 vs 不放回","q":"An urn contains 4 red and 6 white balls. Two balls are drawn without replacement. Find P(both red), P(both white), and P(one of each colour).","steps":[{"label":"两红","prompt":"P(both red) = ?","answer":0.13333,"tol":0.002,"hint":"4/10 × 3/9"},{"label":"两白","prompt":"P(both white) = ?","answer":0.33333,"tol":0.002,"hint":"6/10 × 5/9"},{"label":"一红一白","prompt":"P(one of each) = ?","answer":0.53333,"tol":0.002,"hint":"补集：1 − 两红 − 两白；或 (红,白)+(白,红) = 2 × 4/10 × 6/9"}],"final":"P(RR) = 12/90 ≈ 0.1333; P(WW) = 30/90 ≈ 0.3333; P(one of each) = 48/90 ≈ 0.5333","work":"Without replacement, the second draw depends on the first.\nP(RR) = 4/10 × 3/9 = 12/90 ≈ 0.1333.\nP(WW) = 6/10 × 5/9 = 30/90 ≈ 0.3333.\n\u0027Both red\u0027, \u0027both white\u0027 and \u0027one of each\u0027 are mutually exclusive and exhaustive, so P(one of each) = 1 − 12/90 − 30/90 = 48/90 ≈ 0.5333.\nCheck by ordered outcomes: P(RW) + P(WR) = (4/10)(6/9) + (6/10)(4/9) = 24/90 + 24/90 = 48/90.","explain":"综合了无放回（依赖）、补集（互斥且穷尽）和有序结果（“一红一白”包含 RW 与 WR 两种顺序）。易错：只算 4/10×6/9 忘了另一种顺序。","table":null},{"id":"prob-L10-c16","module":"prob","lecture":"L10","topic":"不等可能结果","q":"A loaded die has P(6) = 1/2, and each of the faces 1–5 has probability 1/10. Rolls are independent. Find P(even), P(odd), and P(two even results in two rolls).","steps":[{"label":"偶数","prompt":"P(even) = P(2 ∨ 4 ∨ 6) = ?","answer":0.7,"tol":0.001,"hint":"按实际概率相加：1/10 + 1/10 + 1/2"},{"label":"奇数","prompt":"P(odd) = ?","answer":0.3,"tol":0.001,"hint":"补集，或 1/10 × 3"},{"label":"两次都偶数","prompt":"P(even ∧ even) = ?","answer":0.49,"tol":0.001,"hint":"各次独立：0.7 × 0.7"}],"final":"P(even) = 0.7; P(odd) = 0.3; P(two evens) = 0.49","work":"Check: 5 × 1/10 + 1/2 = 1, so this is a valid distribution.\nThe faces are mutually exclusive, so P(even) = P(2) + P(4) + P(6) = 0.1 + 0.1 + 0.5 = 0.7.\nP(odd) = 1 − 0.7 = 0.3 (= 0.1 + 0.1 + 0.1).\nRolls independent: P(even ∧ even) = 0.7 × 0.7 = 0.49.\nSimple counting (3/6 = 1/2) fails because the faces are not equally likely.","explain":"课堂原例 P(1)=1/5、其余 4/25 → 偶数 12/25、奇数 13/25；这里是变式。互斥允许相加不同权重；“biased”描述单次分布，连续投掷仍可独立，所以第三问可以相乘。","table":null},{"id":"prob-L10-c17","module":"prob","lecture":"L10","topic":"补集","q":"A, B and C are pairwise mutually exclusive with P(A) = 0.2, P(B) = 0.3, P(C) = 0.15. D is mutually exclusive with each of A, B and C, and P(A ∨ B ∨ C ∨ D) = 1. Find P(A ∨ B ∨ C), P(D), and P(¬D).","steps":[{"label":"三者并","prompt":"P(A ∨ B ∨ C) = ?","answer":0.65,"tol":0.001,"hint":"两两互斥，可直接相加"},{"label":"P(D)","prompt":"P(D) = ?","answer":0.35,"tol":0.001,"hint":"D 与已有并集无重叠：1 − 0.65"},{"label":"P(¬D)","prompt":"P(¬D) = ?","answer":0.65,"tol":0.001,"hint":"补集"}],"final":"P(A∨B∨C) = 0.65; P(D) = 0.35; P(¬D) = 0.65","work":"A, B, C pairwise mutually exclusive: P(A ∨ B ∨ C) = 0.2 + 0.3 + 0.15 = 0.65.\nD is mutually exclusive with A ∨ B ∨ C, so 1 = P(A∨B∨C∨D) = 0.65 + P(D), giving P(D) = 0.35.\nP(¬D) = 1 − 0.35 = 0.65.","explain":"对应 L10 Quiz（5/6 → P(D) = 1/6）。减法成立靠的是 D 与已有事件互斥；若 D 有重叠，就无法由差额唯一求出 P(D)。","table":null}],"essay":[]},
{"cards":[{"id":"prob-L12-condprob","module":"prob","lecture":"L12","term":"Conditional probability","zh":"条件概率","def":"The probability of A given B is the proportion of the B-cases in which A is also true: Pr(A|B) = Pr(A \u0026 B) / Pr(B), defined only when Pr(B) \u003e 0.","defZh":"在 B 成立的条件下 A 成立的概率。先把范围缩到 B 成立的情形（新分母），再数其中 A 也成立的份额。竖线右边的条件决定分母。","formula":"Pr(A|B) = Pr(A \u0026 B) / Pr(B), Pr(B) \u003e 0","example":"校园表：1000 人中本地生 550 人，其中住校内 350 人，所以 Pr(校内|本地) = 350/550 = 7/11 ≈ 0.636。","pitfall":"给定 B 不是说 B 导致 A；也不要把 AND（分母是全体）当成 GIVEN（分母是 B）。","hf":true},{"id":"prob-L12-direction","module":"prob","lecture":"L12","term":"Direction of conditioning (Pr(A|B) vs Pr(B|A))","zh":"条件方向不可随意交换","def":"Pr(A|B) and Pr(B|A) share the same numerator Pr(A \u0026 B) but have different denominators (Pr(B) vs Pr(A)), so in general they are not equal.","defZh":"两者分子相同（交集），但分母不同：一个在 B 人群中数，一个在 A 人群中数。所以一般不能假定相等（但也不是永远不等）。","formula":"Pr(A|B) = Pr(A\u0026B)/Pr(B);  Pr(B|A) = Pr(A\u0026B)/Pr(A)","example":"校园表：Pr(校内|本地) = 350/550 ≈ 63.6%，Pr(本地|校内) = 350/450 ≈ 77.8%。","pitfall":"教授提醒 never to assume 两个方向相等；方向差异也不必是因果关系。","hf":true},{"id":"prob-L12-contingency","module":"prob","lecture":"L12","term":"Contingency table","zh":"列联表","def":"A table recording combinations of categories: its cells show joint counts or probabilities (e.g. A \u0026 B), and its margins show row and column totals (e.g. A, B).","defZh":"把两个分类变量交叉排列的表：格子读交集（同时成立），行/列合计（边际）读单个事件的总体比例。","example":"D/S 题：已知 Pr(D)=0.5、Pr(S)=0.3、Pr(D\u0026S)=0.1，暂设 100 人：先填边际 50/50、30/70，再填交集 10，相减得 20、40，最后一格 30。","pitfall":"信息不足时不能凭空补格子，更不能默认两事件独立。","hf":true},{"id":"prob-L12-hypopop","module":"prob","lecture":"L12","term":"Hypothetical population (frequency-table method)","zh":"假想总体 / 频数表法","def":"A method of solving probability problems by imagining a convenient population (100, 1,000, 10,000) and converting each probability into a count; scaling all cells does not change any conditional probability.","defZh":"把概率还原成假想人数表来算。总数可取 100、1000 等方便值；所有格子同比缩放，条件概率不变。出现 1.4 个人这类小数也无妨，因为这只是比例模型。","example":"喜鹊题 100 人：北岸 30 人中 3 人被俯冲，南岸 70 人中 1.4 人被俯冲，总体 4.4/100。","pitfall":"表格只是同一套乘法的可视化，不是另一种碰巧有效的捷径；小数人数不是错误。","hf":false},{"id":"prob-L12-multrule","module":"prob","lecture":"L12","term":"Multiplication rule (joint from conditional)","zh":"由条件概率求交集","def":"Rearranging the definition of conditional probability gives Pr(A \u0026 B) = Pr(A|B) × Pr(B); no independence assumption is needed.","defZh":"把条件概率定义的分母移过去：交集 = 条件概率 × 条件事件的概率。这一步不需要假设独立。","formula":"Pr(N \u0026 S) = Pr(S|N) × Pr(N)","example":"喜鹊：北岸占 30%，北岸居民 10% 被俯冲，Pr(N\u0026S) = 0.1 × 0.3 = 0.03。","pitfall":"0.03 是「既住北岸又被俯冲」占全体的比例，不是总体被俯冲率。","hf":true},{"id":"prob-L12-totalprob","module":"prob","lecture":"L12","term":"Total probability (weighted sum over a partition)","zh":"全概率 / 按分组加权求和","def":"If the groups are mutually exclusive and exhaustive, the overall probability of S is the sum of its joint probabilities with each group: Pr(S) = Pr(S|N)Pr(N) + Pr(S|~N)Pr(~N).","defZh":"先算每组里发生多少（组内条件概率 × 组大小），再把互不重叠、覆盖全体的各组加起来，得到全体里发生多少。","formula":"Pr(S) = Pr(N\u0026S) + Pr(~N\u0026S) = Pr(S|N)Pr(N) + Pr(S|~N)Pr(~N)","example":"喜鹊：0.3×0.1 + 0.7×0.02 = 0.03 + 0.014 = 0.044。","pitfall":"不能把 10% 和 2% 直接平均成 6%：两组大小不同（30% vs 70%），必须加权。","hf":true},{"id":"prob-L12-independence","module":"prob","lecture":"L12","term":"Probabilistic independence","zh":"概率独立","def":"A and B are independent when conditioning on B does not change the probability of A: Pr(A|B) = Pr(A), provided Pr(B) \u003e 0.","defZh":"知道 B 成立后 A 的概率不变，就叫 A 与 B 独立。这是一个精确的数量关系，不是「看起来没关系」。","formula":"Pr(A|B) = Pr(A)  (equivalently Pr(A\u0026B) = Pr(A)Pr(B))","example":"四季等可能，A=春或夏，B=夏或秋：Pr(A|B) = (1/4)/(1/2) = 1/2 = Pr(A)，独立。校园表 7/11 ≠ 0.45，不独立。","pitfall":"独立 ≠ 互斥。季节例中 A、B 在夏季同时成立，却仍然独立。","hf":true},{"id":"prob-L12-indep-vs-me","module":"prob","lecture":"L12","term":"Independent vs mutually exclusive","zh":"独立 vs 互斥","def":"Mutually exclusive events cannot both occur (Pr(A \u0026 B) = 0); if both have positive probability, learning one occurred rules out the other, so they are NOT independent.","defZh":"互斥：不能同时发生。若两事件概率都大于 0 且互斥，知道其一发生就把另一个的概率降为 0，所以一定不独立。","example":"掷一次骰子，A=掷出 1，B=掷出 2：互斥；Pr(A|B)=0 ≠ Pr(A)=1/6，不独立。","pitfall":"常见误解：「互斥 = 毫无关系 = 独立」。恰恰相反，互斥是一种很强的依赖。","hf":true},{"id":"prob-L12-tautology","module":"prob","lecture":"L12","term":"Conditioning on a tautology","zh":"以永真式为条件","def":"A tautology T has probability 1 and A \u0026 T is equivalent to A, so Pr(A|T) = Pr(A); a tautology rules out no possibilities and is independent of every proposition.","defZh":"永真式（如 B ∨ ~B）概率为 1，不排除任何情形，所以给定它不改变任何概率：Pr(A|T) = Pr(A)。教授说永真式与所有命题独立。","formula":"Pr(A|T) = Pr(A \u0026 T)/Pr(T) = Pr(A)/1 = Pr(A)","example":"Pr(HD)=0.2；告诉你「宿舍门要么开着要么没开」，Pr(HD | 该永真式) 仍是 0.2。","pitfall":"概率为 1 不能倒推出是逻辑永真式（模型中必然 ≠ 逻辑形式上必真）。","hf":false},{"id":"prob-L12-contradiction","module":"prob","lecture":"L12","term":"Conditioning on a contradiction","zh":"以矛盾式为条件","def":"A contradiction F has probability 0, so Pr(A|F) = 0/0, which is undefined under the standard ratio definition (not 0 and not 1).","defZh":"矛盾式（如 B \u0026 ~B）概率为 0，条件概率公式给出 0/0，按本课标准定义是 undefined，既不是 0 也不是 1。","formula":"Pr(A|F) = Pr(A \u0026 F)/Pr(F) = 0/0 → undefined","example":"「既掷出 1 又没掷出 1」的结果中偶数占多少？筛完一个结果都不剩，比例无定义。","pitfall":"两端不对称：给定永真式 = 原概率；给定矛盾式 = 未定义。","hf":false},{"id":"prob-L11-markov","module":"prob","lecture":"L11","term":"Markov generator (order k)","zh":"马尔可夫生成器（k 阶）","def":"A text generator that, given the most recent fixed-length sequence of k words, assigns conditional probabilities to the next word; the order k is the length of the conditioning context.","defZh":"只看最近 k 个词，给出下一个词的条件概率 Pr(下一词 | 前 k 词)。阶数 = 用来作条件的前文长度（order 2 看前两个词，不是一次输出两个词）。","formula":"Table size ≈ n^(k+1)  (n = vocabulary size, k = order)","example":"词表 100 个词：order 1 需要 100² = 10,000 个条目；order 2 需要 100³ = 1,000,000 个条目。","pitfall":"加大窗口代价呈指数增长，且长词串大多从未在数据中出现（数据稀疏）；窗口短则处理不了长程依赖。","hf":false},{"id":"prob-L16-bayes","module":"prob","lecture":"L16","term":"Bayes\u0027 Theorem","zh":"贝叶斯定理","def":"A rule for updating the probability of a hypothesis H on evidence E: Pr(H|E) = Pr(E|H)Pr(H) / Pr(E), where Pr(E) = Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H).","defZh":"看到证据 E 后更新假设 H 的概率：比较证据在 H 和 ¬H 下各有多容易出现，同时考虑 H 原本有多常见（base rate）。","formula":"Pr(H|E) = Pr(E|H)Pr(H) / [Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H)]","example":"疲倦/烦躁：Pr(T)=0.4，Pr(I|T)=0.8，Pr(I|¬T)=0.1 → Pr(T|I) = 0.32/0.38 = 16/19 ≈ 0.842。","pitfall":"分母要收齐证据的所有来源（包括 ¬H 产生的证据），别只写 Pr(E|H)Pr(H)。","hf":true},{"id":"prob-L16-inverse","module":"prob","lecture":"L16","term":"Pr(E|H) vs Pr(H|E)","zh":"证据似然 vs 后验（反转条件概率）","def":"Pr(E|H) asks how likely the evidence is if the hypothesis is true; Pr(H|E) asks how likely the hypothesis is once the evidence is observed. They generally differ because H may be rare and other causes may also produce E.","defZh":"Pr(E|H)：如果有这个原因，证据多容易出现；Pr(H|E)：看到证据后，原因成立的概率。两者通常不同，因为原因可能本来很少见，其他原因也能产生同样证据。","example":"吸血鬼：99% 的吸血鬼会在阳光下烧毁，但「没烧毁者是吸血鬼」只有 1/9901；「下雨时地面湿」常见 ≠「地面湿时一定下雨」。","pitfall":"「证据在某原因下常见」不等于「看到证据后该原因很可能」。","hf":true},{"id":"prob-L16-baserate","module":"prob","lecture":"L16","term":"Base rate / prior probability","zh":"基础发生率 / 先验概率","def":"Pr(H) before observing the evidence: how common the hypothesis is to begin with. The same test result yields different posteriors under different base rates.","defZh":"尚未观察证据时 H 原本有多可能。即使检测性能不变，基础发生率不同，阳性后的结论也会大不相同。","example":"同一试剂（真阳性 50%，假阳性 40%）：真药占 75% 时阳性后 15/19 ≈ 78.9%；真药占 10% 时阳性后只有 5/41 ≈ 12.2%。","pitfall":"忽视 base rate（base rate neglect）是最常见错误：只看检测准确率就下结论。","hf":true},{"id":"prob-L16-posterior","module":"prob","lecture":"L16","term":"Posterior probability","zh":"后验概率","def":"The probability of the hypothesis after conditioning on the evidence, Pr(H|E).","defZh":"观察到证据之后、对假设的更新概率 Pr(H|E)。在人数表里就是：在所有出现证据的情形中，目标情形所占比例。","example":"100 个时刻中 38 个烦躁，其中 32 个也疲倦 → 后验 Pr(T|I) = 32/38。","pitfall":"后验的分母是「有证据的情形」(38)，不是全体 (100)；32/100 是交集 Pr(T\u0026I)。","hf":false},{"id":"prob-L16-tpfp","module":"prob","lecture":"L16","term":"True positive rate vs false positive rate","zh":"真阳性率 vs 假阳性率","def":"Pr(P|M) is the chance a test is positive when the condition holds; Pr(P|¬M) is the chance it is positive when the condition does not hold. They concern different groups and need not sum to 1.","defZh":"Pr(P|M)：真有时测出阳性；Pr(P|¬M)：没有时却测出阳性。二者来自不同人群，不必相加为 1；同一条件下的正反结果 Pr(P|M)+Pr(¬P|M) 才等于 1。","example":"旧试剂：Pr(P|M)=50%，Pr(P|¬M)=40%，相加 90% 无特殊意义。若 Pr(P|¬M)=0，则阳性 → 100% 是真药。","pitfall":"补集规则只能在同一条件下用：Pr(¬P|M) = 1 − Pr(P|M)，而不是 1 − Pr(P|¬M)。","hf":true},{"id":"prob-L16-uninformative","module":"prob","lecture":"L16","term":"Uninformative evidence (probabilistic independence of test and hypothesis)","zh":"无鉴别力的证据","def":"If the evidence is equally likely whether or not H is true (Pr(E|H) = Pr(E|¬H)), observing it leaves the probability of H at its base rate; E and H are probabilistically independent.","defZh":"若证据在 H 和 ¬H 下同样容易出现，看到它也不能区分两者，后验 = 先验。这叫概率上独立（不要说成逻辑独立）。","example":"真药假药都各有 50% 阳性 → 阳性后真药概率仍是原来的 75%。罐子题中「先黑后白」在两罐都是 3/16 → 正面仍是 1/2。","pitfall":"证据的力量取决于两种条件下出现率的差距，而不是 Pr(E|H) 本身有多高。","hf":false},{"id":"prob-L16-sleeping","module":"prob","lecture":"L16","term":"Sleeping Beauty problem","zh":"睡美人问题","def":"A fair coin is tossed: heads yields one awakening, tails yields two with the first erased from memory. Halfers say Pr(heads) on waking is 1/2 (no new information); thirders say 1/3 (counting indistinguishable awakenings).","defZh":"正面醒一次、反面醒两次且抹去第一次记忆。二分之一派：醒来没提供硬币信息，正面 1/2；三分之一派：按醒来场合数，正面 1/3、反面 2/3。课堂作为有争议的哲学难题，无唯一标准答案。","example":"争论在于：应该数硬币结果，还是数「我这次醒来」的场合（self-locating evidence）。","pitfall":"三分之一派的 1/3 是正面，2/3 是反面，别对调；硬币本身并未变得不公平。","hf":false},{"id":"prob-L18-ev","module":"prob","lecture":"L18","term":"Expected value (EV)","zh":"期望值","def":"The probability-weighted average of the possible outcomes: EV = Σ Pr(outcome) × value(outcome); it is the average gain or loss per trial over many repetitions.","defZh":"把每个结果的得失乘以它的概率再相加；表示同样条件重复很多次时每次的平均得失。","formula":"EV = Σ p_i × v_i","example":"公平硬币正面得 $10、反面得 $0：EV = 1/2×10 + 1/2×0 = $5。","pitfall":"EV $5 不是说这一次会拿到 $5——单次只能拿到 $10 或 $0。","hf":true},{"id":"prob-L18-net","module":"prob","lecture":"L18","term":"Gross payout vs net outcome","zh":"回款 vs 净结果","def":"The gross payout is what you receive back; the net outcome is the payout minus what you put in. Expected value of an investment or bet should use net outcomes, with the cost subtracted exactly once.","defZh":"回款是最后拿回多少；净结果 = 回款 − 投入。判断投资/赌局要用净结果，成本只扣一次（要么每路先扣，要么最后统一扣）。","example":"教授纠正后的创业题：投 $1M 拿回 $4M → 净赚 $3M；EV = 2/25×3 + 8/25×(−1) + 15/25×(−1) = −$0.68M。","pitfall":"旧答案漏扣了初始投资；也别在每路扣了成本后最后又扣一次。","hf":true},{"id":"prob-L18-fair","module":"prob","lecture":"L18","term":"Fair price / fair bet","zh":"公平价格 / 公平赌局","def":"The price of a bet at which the expected net gain is exactly zero, i.e. the price equals the expected payout.","defZh":"使平均净收益恰好为 0 的票价，即票价 = 期望回款。","formula":"fair price = EV(payout)","example":"正面 $10、反面 $0：公平票价 $5。两硬币题正面奖 $1：公平票价 $0.45。","pitfall":"公平说的是平均，不代表每次都收支相抵：付 $5 后单次要么净赚 $5 要么净亏 $5。","hf":true},{"id":"prob-L18-house","module":"prob","lecture":"L18","term":"House edge","zh":"庄家优势","def":"When the price of a bet exceeds its fair price, the bettor\u0027s expected net gain is negative; the difference favours the house.","defZh":"票价高于公平价格时，玩家期望净收益为负，差额就是庄家优势。","example":"平均回款 $5 的投币游戏卖 $6 一张票：玩家每次平均净亏 $1。","hf":false},{"id":"prob-L18-martingale","module":"prob","lecture":"L18","term":"Martingale strategy","zh":"马丁格尔（输了就加倍）策略","def":"A betting strategy of doubling the stake after every loss, so that the first win recovers all previous losses plus the initial stake; the required stakes grow exponentially.","defZh":"每输一次就把下一注翻倍，指望赢一次补回全部损失再净赚最初一注。所需资金指数增长，而赢了也只净赚 1 个单位。","example":"押 1、2、4、8、16、32 连输 6 次已亏 63；第 7 次要押 64，赢了也只净赚 1。","pitfall":"资金和下注上限有限，「总有一天会赢」不保证你撑得到那天；而且它也不改变每次的公平性。","hf":false},{"id":"prob-L18-gambler","module":"prob","lecture":"L18","term":"Gambler\u0027s fallacy","zh":"赌徒谬误","def":"The mistaken belief that past outcomes of independent trials make a particular future outcome more (or less) likely, e.g. that heads is \u0027due\u0027 after a run of tails.","defZh":"误以为独立试验的过去结果会让某个未来结果「该来了」。公平硬币连出六次反面后，下一次正面仍是 1/2。","example":"连续 8 次正面概率是 (1/2)^8 = 1/256，罕见但可能；真随机序列也会有长连串。","pitfall":"硬币没有记忆；但如果硬币本身不确定（可能有偏），连串结果确实会改变你对硬币类型的判断——那是 Bayes 更新，不是赌徒谬误。","hf":false},{"id":"prob-L18-coinupdate","module":"prob","lecture":"L18","term":"Bayesian updating on an uncertain coin","zh":"不确定硬币的贝叶斯更新","def":"When it is uncertain which coin was picked, observing an outcome raises the probability of the coin that makes that outcome more likely; the coin\u0027s own bias does not change.","defZh":"不知道拿的是哪枚硬币时，看见正面就提高「更常出正面的那枚」的概率；但硬币本身的偏向（如 A 的 75%）不变，变的是我们的判断。","formula":"Pr(A|H) = Pr(H|A)Pr(A) / [Pr(H|A)Pr(A) + Pr(H|B)Pr(B)]","example":"A 正面 75%、B 正面 15%、各 50% 被选：Pr(H)=0.375+0.075=0.45；Pr(A|H)=0.375/0.45=5/6。","pitfall":"75% 和 15% 是百分比，不是 0.75% 与 0.15%；Pr(A|H) 与 Pr(H|A)=0.75 方向不同。","hf":true}],"mcq":[{"id":"prob-L12-q01","module":"prob","lecture":"L12","topic":"读列联表","q":"Of 1,000 students: 350 are domestic and on campus, 100 international and on campus, 200 domestic and off campus, 350 international and off campus. What is Pr(on campus | domestic)?","options":["350/1000","350/450","450/1000","350/550"],"answer":3,"explain":"给定本地生，分母缩到本地生总数 350+200=550，分子是本地且校内 350。350/1000 是交集 Pr(A\u0026B)；350/450 是反方向 Pr(本地|校内)；450/1000 是 Pr(校内)。","hf":true},{"id":"prob-L12-q02","module":"prob","lecture":"L12","topic":"条件方向","q":"Using the same campus table (350 domestic on campus, 100 international on campus, 200 domestic off campus, 350 international off campus), what is Pr(domestic | on campus)?","options":["350/550","550/1000","350/450","200/550"],"answer":2,"explain":"给定校内，分母是校内学生 350+100=450，其中本地 350 → 7/9 ≈ 0.778。350/550 是反方向 Pr(校内|本地)，说明两个方向一般不等。","hf":true},{"id":"prob-L12-q03","module":"prob","lecture":"L12","topic":"AND vs GIVEN","q":"In the campus table, a randomly chosen student is selected from all 1,000. What is the probability that the student is BOTH domestic AND lives on campus?","options":["0.35","0.45","about 0.636","about 0.778"],"answer":0,"explain":"AND 的分母是全体：350/1000 = 0.35。0.45 是 Pr(校内)（教授板书曾误把 Pr(A) 写成 35%，笔记按表更正为 45%）；0.636、0.778 是两个方向的条件概率。","hf":false},{"id":"prob-L12-q04","module":"prob","lecture":"L12","topic":"独立性判断","q":"In the campus table, Pr(on campus) = 0.45 and Pr(on campus | domestic) = 7/11. Which conclusion is correct?","options":["The events are independent, because Pr(on campus \u0026 domestic) \u003e 0.","The events are not independent, because Pr(on campus | domestic) differs from Pr(on campus).","The events are independent, because both describe the same group of students.","The events are not independent, because they are mutually exclusive."],"answer":1,"explain":"独立的标准是 Pr(A|B)=Pr(A)。7/11 ≈ 0.636 ≠ 0.45，所以不独立。交集大于 0 与独立无关；二者也不互斥（有 350 人同时满足）。","hf":true},{"id":"prob-L12-q05","module":"prob","lecture":"L12","topic":"题干翻译","q":"\"10% of North Shore residents get swooped by magpies.\" Letting N = lives on North Shore and S = gets swooped, this sentence gives:","options":["Pr(S \u0026 N) = 0.1","Pr(N | S) = 0.1","Pr(S | N) = 0.1","Pr(S) = 0.1"],"answer":2,"explain":"「北岸居民中 10%」先固定北岸人群，再数其中被俯冲者，所以是 Pr(S|N)。这是本讲最重要的翻译：百分比要应用到它条件中点名的那个群体。","hf":true},{"id":"prob-L12-q06","module":"prob","lecture":"L12","topic":"由条件求交集","q":"30% of residents live on the North Shore, and 10% of North Shore residents get swooped. What is the probability that a randomly chosen resident both lives on the North Shore and gets swooped?","options":["0.03","0.10","0.30","0.044"],"answer":0,"explain":"Pr(N\u0026S) = Pr(S|N)×Pr(N) = 0.1×0.3 = 0.03，不需要独立假设。0.044 是加上南岸后的总体被俯冲率。","hf":true},{"id":"prob-L12-q07","module":"prob","lecture":"L12","topic":"全概率","q":"30% live on the North Shore (10% of them get swooped) and 70% live on the South Shore (2% of them get swooped). What is the overall probability that a random residen
