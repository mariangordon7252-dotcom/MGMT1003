<style>
/* 浅色：蓝白底 + 天蓝主色；深色：柔和深蓝（不用纯黑） */
:root{

  --line:rgba(30,50,90,.09);--line2:rgba(30,50,90,.18);--acc:#4a6cf7;--onacc:#fff;--accbg:#e8edff;
  --shadow:0 1px 3px rgba(30,50,90,.06);
  --ok:#2f9e44;--okbg:#e6f7ea;--okline:#8fd19e;--bad:#e03131;--badbg:#ffecec;--badline:#ffa8a8;
  --warn:#c26a00;--warnbg:#fff3db;
  --prob:#ff7a45;--probbg:#fff0e8;--probtx:#b54a14;
  --logic:#7c5cff;--logicbg:#f0ecff;--logictx:#5137c9;
  --soc:#12b886;--socbg:#e3f9f1;--soctx:#0b7a59;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#151b2b;--card:#1e2638;--card2:#28324a;--tx:#eef2fb;--tx2:#b3bdd1;--tx3:#8591a8;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--acc:#7d9bff;--onacc:#0f1525;--accbg:#2a3763;
  --shadow:none;
  --ok:#69db7c;--okbg:#173823;--okline:#2f9e44;--bad:#ff8787;--badbg:#3d1c22;--badline:#c92a2a;
  --warn:#ffc078;--warnbg:#3d2c12;
  --prob:#ff9466;--probbg:#4a2a1e;--probtx:#ffc4a8;--logic:#a08bff;--logicbg:#2f2861;--logictx:#d6ccff;--soc:#38d9a9;--socbg:#123d33;--soctx:#a6f0d6;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#151b2b;--card:#1e2638;--card2:#28324a;--tx:#eef2fb;--tx2:#b3bdd1;--tx3:#8591a8;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--acc:#7d9bff;--onacc:#0f1525;--accbg:#2a3763;
  --shadow:none;
  --ok:#69db7c;--okbg:#173823;--okline:#2f9e44;--bad:#ff8787;--badbg:#3d1c22;--badline:#c92a2a;
  --warn:#ffc078;--warnbg:#3d2c12;
  --prob:#ff9466;--probbg:#4a2a1e;--probtx:#ffc4a8;--logic:#a08bff;--logicbg:#2f2861;--logictx:#d6ccff;--soc:#38d9a9;--socbg:#123d33;--soctx:#a6f0d6;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}

body.symok.symopen #symBtn{left:min(80vw,320px);opacity:1}

#symPanel h3:first-of-type{margin-top:4px}
h1{font-size:24px;font-weight:600;margin:8px 0 2px}
h2{font-size:18px;font-weight:600;margin:22px 0 10px}
h3{font-size:16px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.sub{color:var(--tx2);font-size:14px}
.mut{color:var(--tx3);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.soft{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}

.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.m-prob{background:var(--probbg);color:var(--probtx)}.m-logic{background:var(--logicbg);color:var(--logictx)}.m-soc{background:var(--socbg);color:var(--soctx)}
.hf{background:var(--warnbg);color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:6px 0 12px}

.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}

.hdr{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}

.q{font-size:16px;line-height:1.65;margin:4px 0 14px;white-space:pre-wrap}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.5}
.opt .bub{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2);margin-top:-2px}
.opt.sel .bub{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.opt.ok{border-color:var(--okline);background:var(--okbg)}.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--badline);background:var(--badbg)}.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default;color:var(--tx)}
.exp{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:14.5px;color:var(--tx2);white-space:pre-wrap}
.good{color:var(--ok)}.wrong{color:var(--bad)}
.exp b.xl{color:var(--tx);font-weight:600}
.prog{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--acc)}
input[type=text],input[type=search],textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--tx2)}
textarea{min-height:120px;resize:vertical;line-height:1.55}
.step{border-left:3px solid var(--line2);padding:4px 0 4px 12px;margin:10px 0}
.step.done{border-color:var(--okline)}
.step.cur{border-color:var(--acc)}
.sol{background:var(--card2);border-radius:10px;padding:8px 11px;margin-top:6px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;color:var(--tx2)}
.sol>b{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:1px}
.trap{background:var(--warnbg);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.trap>b{display:block;font-size:12px;font-weight:600;margin-bottom:1px}
.kp{display:flex;gap:6px;margin:8px 0}
.kp button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:17px}
.msg{font-size:14px;margin-top:6px}
pre.work{white-space:pre-wrap;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--card2);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto}
table.tt{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;text-align:center}
table.tt th,table.tt td{border:1px solid var(--line2);padding:6px 4px}
table.tt th{background:var(--card2);font-weight:600;font-size:14px}
table.tt td.cell{cursor:pointer;font-weight:600;min-width:44px}
table.tt td.cell.e{color:var(--tx3)}
table.tt td.x{background:var(--badbg);color:var(--bad)}
table.tt td.y{background:var(--okbg);color:var(--ok)}
table.tt td.h{color:var(--tx3);font-size:13px}
.ttwrap{overflow-x:auto}
.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center}
.fc .term{font-size:24px;font-weight:600;line-height:1.3}
.kv{margin:10px 0 0}.kv b{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.kv div{white-space:pre-wrap}
.one{font-size:17px;font-weight:600;line-height:1.45;margin:8px 0 2px}
.en{color:var(--tx2);font-size:14px;font-style:italic;margin-bottom:4px}
.ones{color:var(--tx2);font-size:14px;margin-top:3px;font-weight:400}
details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.more>summary{color:var(--tx3);font-size:13px}
.kpq{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kpchip{display:block;width:100%;text-align:left;background:var(--card2);border:0;border-radius:10px;padding:8px 10px;margin-top:6px;color:var(--tx);font:inherit;font-size:14px}
.kpchip b{font-weight:600;margin-right:4px}
.syms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:baseline;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.45;width:max-content;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:86vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--ok);color:var(--onacc)}
.kptick{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:transparent;font-size:15px;font-weight:700;line-height:1}
.kptick.on{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.kpn{font-size:12px;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
details.pass{box-shadow:inset 3px 0 0 var(--ok);padding-left:10px !important}
details.pass summary b{color:var(--ok)}
.kpst{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--card2);font-size:14px}
.kpst.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--okline)}
.ana{background:var(--warnbg);border-radius:10px;padding:9px 12px;margin:10px 0 2px;font-size:14.5px;line-height:1.55}
.ana b{display:block;font-size:12px;color:var(--warn);font-weight:600;margin-bottom:2px}
/* 知识点阅读排版 */
.kc{font-size:15.5px;line-height:1.75}
.kc-one{font-size:17px;font-weight:600;line-height:1.6;background:var(--accbg);border-left:4px solid var(--acc);border-radius:4px 12px 12px 4px;padding:10px 14px;margin:12px 0 4px}
.kc-sec{margin-top:16px}
.kc-sec h4{font-size:12.5px;font-weight:600;color:var(--acc);margin:0 0 6px;letter-spacing:.5px}
.kc-sec p{margin:0;white-space:pre-wrap}
.kc-pts{list-style:none;margin:0;padding:0;counter-reset:kp}
.kc-pts li{counter-increment:kp;position:relative;padding-left:30px;margin:0 0 8px}
.kc-pts li::before{content:counter(kp);position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:12px;font-weight:600;line-height:20px;text-align:center}
.kc .ana,.kc .trap{margin-top:16px}
.wds{display:flex;flex-direction:column;background:var(--card2);border-radius:10px;padding:4px 12px;font-size:14px;line-height:1.5}
.wd{padding:7px 0;border-bottom:1px solid var(--line)}
.wd:last-child{border-bottom:0}
.wd b{font-weight:600;margin-right:8px}
.kv .wd b{display:inline;font-size:14px;color:var(--tx);margin:0 8px 0 0}
.kv .wds{white-space:normal}
details.fold{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}

.fchev{display:inline-flex;color:var(--tx3);transition:transform .2s;transform:rotate(90deg)}

.fbody{padding:0 8px 8px}
.fbody .wd b{display:inline;font-size:14px;color:var(--tx);margin:0 8px 0 0}
.wd i{display:block;font-style:normal;color:var(--tx3);font-size:13px}
.ktitle{font-size:21px;font-weight:600;line-height:1.35;margin-top:8px}
.ktitle small{display:block;font-size:14px;font-weight:400;color:var(--tx3);margin-top:2px}
/* 按 Lecture 专项复习：一次一张，左右滑动 */
#deck{touch-action:pan-y;transition:transform .22s ease}
#deck.inR{animation:deckR .22s ease}
#deck.inL{animation:deckL .22s ease}

.decknav{display:flex;gap:8px;margin-top:4px}

.chip.zhb{font-size:12.5px;padding:3px 10px}

.mgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:10px 0}

.mgrid button.bad{background:var(--bad);border-color:var(--bad);color:var(--card)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px}

.seg button.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tile{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow)}

.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--tx2);padding:28px 10px}
.mtab{display:flex;gap:6px;overflow-x:auto;margin:-2px -16px 10px;padding:2px 16px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}

"logic-L6-connectives":{
"name":"四个联结词",
"one":"四个联结词（connective）：~ 非、& 且、∨ 或、⊃ 如果…那么。",
"pts":["~A：A 假才真。A & B：两边都真才真。","A ∨ B：两边都假才假。A ⊃ B：A 真 B 假才假。","~ 只黏住紧跟它的那一块：~(A ∨ B) 与 ~A ∨ B 不同。","¬ 就是 ~，∧ 就是 &，只是写法不同。"],

"name":"真值表捷径",
"one":"主联结词一边已能定值，另一边不用算：T ∨ X = T，F & X = F。",
"pts":["A ∨ ~A 永真、A & ~A 永假，可直接当 T、F 用。","T & X = X，F ∨ X = X，不能走捷径。","F ⊃ X 永远为 T（前件为假）。","真知道为什么才可以跳过不算。"],

"logic-L6-de-morgan":{
"name":"德摩根律",
"one":"德摩根律（De Morgan）：~ 穿过括号时每项都否定，& 与 ∨ 互换。",
"pts":["~(A ∨ B) ≡ ~A & ~B：两个都不。","~(A & B) ≡ ~A ∨ ~B：至少一个不。","只分配 ~、忘了换联结词是最常见错误。"],

"ana":"“并非（会唱歌或会跳舞）”= 既不会唱也不会跳；“并非（又高又帅）”= 不高或不帅，至少缺一样。",

"pts":["先圈出完整的括号块当作 X。","再找主联结词，看是否是 X 与 ~X 的形式。","不必把 ~(A & B) 拆开算，直接认结构。"],

{"cards":{
"prob-L12-condprob":{
"name":"条件概率",
"one":"Pr(A|B) = Pr(A&B)/Pr(B)：B 的情形里 A 所占比例。",
"pts":["竖线右边是条件（given），它决定分母。","交集（AND）的分母是全体，条件概率的分母是 B 的总数。","只有 Pr(B)>0 时才有定义。","A、B 各自罕见，Pr(A|B) 仍可能很高。"],
"ex":"1000 名学生中本地生 550 人，其中住校内 350 人：Pr(校内|本地) = 350/550 ≈ 0.636。",
"trap":"把交集 350/1000 当成条件概率；或以为「给定 B」就是「B 导致 A」。",
"ana":"问「下雨天你带伞的比例」：先只挑出下雨的那些天当分母，再数其中带伞的天数，晴天一律不算。",
"words":[{"en":"given","zh":"在……条件下","m":"竖线右边的已知条件"},{"en":"domestic / international","zh":"本地生 / 国际生","m":"按学生来源分的两类"},{"en":"on campus / off campus","zh":"住校内 / 住校外","m":"按住宿地点分的两类"},{"en":"BOTH … AND …","zh":"既……又……","m":"两个条件同时成立，即交集"},{"en":"randomly chosen / selected","zh":"随机抽取的","m":"每个个体被抽中机会相同"},{"en":"record","zh":"记录","m":"数据中的一条消息"},{"en":"irritable","zh":"烦躁的","m":"容易发脾气"},{"en":"key press","zh":"按键","m":"按一次键盘"}]},
"prob-L12-direction":{
"name":"条件方向不能互换",
"one":"Pr(A|B) 与 Pr(B|A) 分子相同、分母不同，一般不相等。",
"pts":["Pr(A|B) 分母是 Pr(B)，Pr(B|A) 分母是 Pr(A)。","只有 Pr(A)=Pr(B) 或交集为 0 时两者才相等。","方向不同不需要有因果关系。"],
"ex":"校园表：Pr(校内|本地) = 350/550 ≈ 63.6%；Pr(本地|校内) = 350/450 ≈ 77.8%。",
"trap":"以为分子相同就相等；或以为方向不同必然是因为 A 导致 B。",
"ana":"Pr(高个|篮球运动员) 很高，但 Pr(篮球运动员|高个) 很低：高个子绝大多数并不打篮球。",
"words":[{"en":"numerator","zh":"分子","m":"分数线上面的数"},{"en":"denominator","zh":"分母","m":"分数线下面的数"},{"en":"need not","zh":"不一定","m":"不是必须"},{"en":"cause","zh":"导致","m":"一件事引起另一件事"},{"en":"always","zh":"总是","m":"任何情况下都成立"}]},
"prob-L12-contingency":{
"name":"列联表",
"one":"把两个分类交叉排列的表：格子是交集，行列合计是单个事件的总数。",
"pts":["格子读联合频数，如「A 且 B」的人数。","边际（margin）读单个类别总数，如 A 的人数。","未知格 = 合计 − 已知格；四格之和为全体。","信息不足时不能默认独立去相乘。"],
"ex":"Pr(D)=0.5，Pr(S)=0.3，Pr(D&S)=0.1，设 100 人：交集 10，相减得 20、40，余 30。",
"trap":"信息不足时用 Pr(~D)×Pr(~S)=0.35 去补格子，等于默认了独立。",
"ana":"像按「男/女 × 及格/不及格」交叉的四格成绩表：格子是「女生且及格」人数，行尾、列尾合计是女生总数、及格总数。",
"words":[{"en":"contingency table","zh":"列联表","m":"两个分类交叉的计数表"},{"en":"margins","zh":"边际","m":"表格的行合计和列合计"},{"en":"row / column totals","zh":"行合计 / 列合计","m":"一行或一列各格之和"},{"en":"cell","zh":"格子","m":"表中一行一列交叉的格"},{"en":"category","zh":"类别","m":"分类中的一类"},{"en":"joint count","zh":"联合频数","m":"同时满足两个条件的个数"},{"en":"complete the table","zh":"把表填完整","m":"算出所有空格"},{"en":"attended the review session","zh":"参加了复习课","m":"题中的事件 B"}]},
"prob-L12-hypopop":{
"name":"假想总体（人数表法）",
"one":"设一个方便的假想人数（100、1000），把概率换成人数来数。",
"pts":["每格同比缩放，任何条件概率都不变。","出现 1.4 个人这类小数也没问题，它只是比例模型。","不要四舍五入，否则会引入误差。","人数表和公式是同一套乘法，只是更直观。"],
"ex":"喜鹊题 100 人：北岸 30 人中 3 人被俯冲，南岸 70 人中 1.4 人被俯冲，共 4.4 人，即 4.4%。",
"trap":"以为人数出现小数说明表格无效，或先四舍五入再算。",
"ana":"「2% 的人有副作用」不好想，就想象 1000 人中 20 人有；换成 10 万人是 2000 人，比例不变。",
"words":[{"en":"hypothetical","zh":"假想的","m":"为方便计算而设想的"},{"en":"population","zh":"总体 / 人群","m":"被考虑的全部个体"},{"en":"fractional","zh":"非整数的","m":"带小数的人数"},{"en":"proportional model","zh":"比例模型","m":"只关心比例不关心实数"},{"en":"scaling","zh":"同比缩放","m":"所有数乘同一倍数"},{"en":"round","zh":"四舍五入","m":"把小数取成整数"},{"en":"invalid","zh":"无效的","m":"不能用的"},{"en":"tests positive","zh":"检测呈阳性","m":"检测结果为「有」"}]},
"prob-L12-multrule":{
"name":"乘法规则（求交集）",
"one":"交集 = 条件概率 × 条件的概率：Pr(A&B) = Pr(A|B)Pr(B)。",
"pts":["由条件概率定义移项得到，不需要假设独立。","「北岸居民中 10%」是 Pr(S|N)，不是交集。","结果是全体中「既 A 又 B」的比例。"],
"ex":"北岸占 30%，北岸居民 10% 被俯冲：Pr(N&S) = 0.1 × 0.3 = 0.03。",
"trap":"把 0.03 当成总体被俯冲率；它只是「既住北岸又被俯冲」的比例。",
"ana":"全班 40% 戴眼镜，戴眼镜者中一半是女生，则「戴眼镜的女生」占全班 0.4×0.5 = 20%，不用管两者是否独立。",
"words":[{"en":"resident","zh":"居民","m":"住在某地的人"},{"en":"North / South Shore","zh":"北岸 / 南岸","m":"题中两个居住区"},{"en":"magpie","zh":"喜鹊","m":"春季会俯冲攻击人的鸟"},{"en":"get swooped","zh":"被俯冲攻击","m":"题中的事件 S"},{"en":"joint probability","zh":"交集概率","m":"两事件同时发生的概率"}]},
"prob-L12-totalprob":{
"name":"全概率（分组加权求和）",
"one":"分组互斥且穷尽时，Pr(S) = 各组 Pr(S|组) × Pr(组) 之和。",
"pts":["互斥（mutually exclusive）：组与组不重叠。","穷尽（exhaustive）：所有组合起来覆盖全体。","按组大小加权，不能把各组比率简单平均。","只有两组一样大时，简单平均才恰好正确。"],
"ex":"喜鹊：0.3×0.1 + 0.7×0.02 = 0.03 + 0.014 = 0.044。",
"trap":"把 10% 和 2% 平均成 6%，或直接相加成 12%。",
"ana":"A 线产 80% 零件、次品率 1%，B 线产 20%、次品率 5%：总次品率 1.8%，不是平均的 3%。",
"words":[{"en":"overall","zh":"总体的","m":"在全体中算的"},{"en":"weighted","zh":"加权的","m":"按各组大小给比重"},{"en":"share of the population","zh":"占总体的份额","m":"这一组占全体的比例"},{"en":"expand","zh":"展开","m":"把一项拆成几项之和"},{"en":"route","zh":"途径 / 来源","m":"结果出现的一条路径"},{"en":"add","zh":"相加","m":"把几项加起来"}]},
"prob-L12-independence":{
"name":"概率独立",
"one":"独立：Pr(A|B) = Pr(A)，等价于 Pr(A&B) = Pr(A)Pr(B)。",
"pts":["判断方法：比较 Pr(A|B) 和 Pr(A) 是否相等。","只有题目明确说独立，才能用 Pr(A)Pr(B) 求交集。","交集用「且」（合取），不是「或」（析取）。","不独立只说明相关，不证明因果。"],
"ex":"四季等可能，A=春或夏，B=夏或秋：Pr(A|B)=(1/4)/(1/2)=1/2=Pr(A)，独立。",
"trap":"把「看起来没关系」当独立；或把交集写成并集，算出大于 1 的概率。",
"ana":"同时抛硬币和掷骰子：知道硬币是正面，骰子出 6 的概率仍是 1/6，这条信息毫无影响，所以两者独立。",
"words":[{"en":"independent","zh":"独立的","m":"知道一个不改变另一个的概率"},{"en":"equally likely","zh":"等可能的","m":"各结果概率相同"},{"en":"conjunction","zh":"合取（且）","m":"A 和 B 都成立"},{"en":"disjunction","zh":"析取（或）","m":"A 或 B 至少一个成立"},{"en":"conclusion","zh":"结论","m":"推出来的判断"},{"en":"exceed","zh":"超过","m":"比……大"},{"en":"TOLD that","zh":"已被告知","m":"题目直接给出的条件"},{"en":"under exactly which condition","zh":"恰好在什么条件下","m":"充分且必要的条件"}]},
"prob-L12-indep-vs-me":{
"name":"独立 vs 互斥",
"one":"互斥是不能同时发生；两者概率都大于 0 时，互斥一定不独立。",
"pts":["互斥：Pr(A&B)=0，所以 Pr(A|B)=0。","Pr(A)>0 时 Pr(A|B)=0 ≠ Pr(A)，不独立。","独立的事件可以同时发生，如四季例中的夏季。"],
"ex":"掷一次骰子，A=掷出 1，B=掷出 2：互斥；Pr(A|B)=0 ≠ Pr(A)=1/6，不独立。",
"trap":"以为「互斥 = 毫无关系 = 独立」。互斥其实是一种很强的依赖。",
"ana":"单选题只能选一个：知道你选了 A，就立刻知道你没选 B。互斥恰恰是最强的相互影响，不是独立。",
"words":[{"en":"mutually exclusive","zh":"互斥的","m":"不能同时发生"},{"en":"must be true","zh":"一定成立","m":"任何情况下都对"},{"en":"neither … nor …","zh":"既不……也不……","m":"两者都不是"},{"en":"but not","zh":"但不是","m":"前者成立，后者不成立"}]},
"prob-L12-tautology":{
"name":"以永真式为条件",
"one":"永真式 T 概率为 1、不排除任何情形，所以 Pr(A|T) = Pr(A)。",
"pts":["A&T 与 A 等价，Pr(T)=1，代入得 Pr(A)/1。","永真式与任何命题都独立。","Pr(A&B)=Pr(A|B) 当且仅当 Pr(B)=1 或交集为 0。"],
"ex":"Pr(A)=0.2，T = B∨~B：Pr(A|T) = 0.2。",
"trap":"概率为 1 不能倒推出它是逻辑上的永真式。",
"ana":"天气预报说「明天要么下雨要么不下雨」：它没排除任何情况，你对明天下雨的估计一点都不用改。",
"words":[{"en":"tautology","zh":"永真式","m":"逻辑上一定为真的命题"},{"en":"e.g.","zh":"例如","m":"举例用语"},{"en":"∨","zh":"或","m":"析取符号"},{"en":"assuming","zh":"假设","m":"在……前提下"},{"en":"only when","zh":"只有当……时","m":"其他情况都不行"}]},
"prob-L12-contradiction":{
"name":"以矛盾式为条件",
"one":"矛盾式 F 概率为 0，Pr(A|F) = 0/0，按标准定义无定义。",
"pts":["条件概率要求条件的概率大于 0。","0/0 既不是 0，也不是 1。","与永真式不对称：给定永真式得原概率，给定矛盾式无定义。"],
"ex":"Pr(A)=0.2，F = B&~B：Pr(A&F)=0，Pr(F)=0，Pr(A|F)=0/0，无定义。",
"trap":"把 Pr(A|F) 写成 0 或 1。",
"ana":"问「既是男生又不是男生的同学里，戴眼镜的占几成」：这群人一个都没有，分母为 0，比例根本无从谈起。",
"words":[{"en":"contradiction","zh":"矛盾式","m":"逻辑上一定为假的命题"},{"en":"undefined","zh":"无定义","m":"算式没有意义"},{"en":"standard definition","zh":"标准定义","m":"本课用的比值定义"}]},
"prob-L11-markov":{
"name":"k 阶马尔可夫生成器",
"one":"只看最近 k 个词，给出下一个词的条件概率 Pr(下一词|前 k 词)。",
"pts":["阶数（order）= 作为条件的前文长度，不是一次输出几个词。","完整表大小约 n^(k+1)，n 是词表大小。","窗口每多一个词，表扩大 n 倍，长词串数据也更稀疏。","自动补全比较的是条件概率，不是词的总体频率。"],
"ex":"词表 100 个词：order 1 约 100² = 1 万个条目；order 2 约 100³ = 100 万个。",
"trap":"以为 order 2 是一次输出两个词，或是看全部前文。",
"ana":"order 2 就像只记得最后两个词的接龙玩家：听到「想 吃」就按经验猜「火锅」，更早说过的话一概不管。",
"words":[{"en":"Markov text generator","zh":"马尔可夫文本生成器","m":"按前文概率生成下一词"},{"en":"order-2","zh":"二阶","m":"以前两个词为条件"},{"en":"vocabulary","zh":"词表","m":"所有可用的词"},{"en":"entries","zh":"条目","m":"表中的一项"},{"en":"context","zh":"前文","m":"前面已出现的词"},{"en":"corpus","zh":"语料库","m":"用来统计的文本集合"},{"en":"estimate","zh":"估算","m":"大致算出"},{"en":"suggests","zh":"推荐（续词）","m":"自动补全给出的词"}]},
"prob-L16-bayes":{
"name":"贝叶斯定理",
"one":"Pr(H|E) = Pr(E|H)Pr(H)/Pr(E)，分母含 H 与 ¬H 两条来源。",
"pts":["全概率：Pr(E) = Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H)。","先算两条路径的交集，再用目标那条除以总和。","人数表做法：在有证据的人里数目标的人。"],
"ex":"Pr(T)=0.4，Pr(I|T)=0.8，Pr(I|¬T)=0.1：Pr(T|I) = 0.32/0.38 ≈ 0.842。",
"trap":"分母只写 Pr(E|H)Pr(H)，漏掉 ¬H 产生的证据。",
"ana":"烟雾报警器响了，是真着火吗？要把「平时着火多罕见」「着火时它多会响」「做饭油烟误响多常见」合起来算。",
"words":[{"en":"hypothesis","zh":"假设","m":"要判断真假的 H"},{"en":"evidence","zh":"证据","m":"观察到的 E"},{"en":"pill","zh":"药片","m":"题中被检测的对象"},{"en":"MDMA","zh":"摇头丸成分","m":"药片是否含它即 M"},{"en":"urn","zh":"罐子","m":"装球的容器"},{"en":"with replacement","zh":"放回抽取","m":"抽完放回再抽"},{"en":"fair coin","zh":"公平硬币","m":"正反面各 1/2"},{"en":"landed heads","zh":"正面朝上","m":"抛硬币结果为正面"}]},
"prob-L16-inverse":{
"name":"反转条件概率",
"one":"Pr(E|H)（有原因时证据多常见）≠ Pr(H|E)（见到证据后原因多可能）。",
"pts":["H 本来罕见时，Pr(H|E) 可以很低。","其他原因也常产生 E 时，Pr(H|E) 也会降低。","证据带否定号时，要算 Pr(V|¬I)，否定号跟着证据走。"],
"ex":"1% 的人是吸血鬼，99% 的吸血鬼见阳光会烧毁：不烧毁者是吸血鬼的概率只有 1/9901。",
"trap":"「证据在某原因下常见」不等于「看到证据后该原因很可能」。",
"ana":"Pr(咳嗽|肺癌) 很高，但 Pr(肺癌|咳嗽) 很低：咳嗽的人绝大多数只是感冒，肺癌本身很少见。",
"words":[{"en":"vampire","zh":"吸血鬼","m":"题中的假设 V"},{"en":"burn in sunlight","zh":"见阳光会烧毁","m":"题中的证据 I"},{"en":"symptom","zh":"症状","m":"疾病的表现"},{"en":"disease / condition","zh":"疾病 / 病症","m":"要判断有没有的病"},{"en":"flaw","zh":"漏洞","m":"推理中的错误"},{"en":"almost certainly","zh":"几乎肯定","m":"概率接近 1"},{"en":"detects","zh":"检出","m":"有病时测出阳性"},{"en":"confuses A with B","zh":"把 A 和 B 混淆","m":"把一个当成另一个"}]},
"prob-L16-baserate":{
"name":"基础发生率 / 先验",
"one":"基础发生率（base rate）是看证据前的 Pr(H)，即 H 原本有多常见。",
"pts":["先验（prior）就是 Pr(H)；后验依赖它。","检测性能不变，基础发生率越低，阳性后的后验越低。","病越罕见，假阳性人数越可能超过真阳性。","输入的基础发生率估错，个人的后验也会错。"],
"ex":"同一试剂（真阳性 50%，假阳性 40%）：真药占 75% 时阳性后 78.9%，占 10% 时只有 12.2%。",
"trap":"忽视基础发生率（base rate neglect），只看检测准确率下结论。",
"ana":"误报率 1% 的检测用在万分之一患病的人群：1 万人约 1 个真阳性、约 100 个误报，阳性者多半没病。",
"words":[{"en":"base rate","zh":"基础发生率","m":"看证据前 H 的比例"},{"en":"closest to","zh":"最接近","m":"选数值最近的"},{"en":"affects 1 in 1,000","zh":"每千人中 1 人患","m":"基础发生率 0.1%"},{"en":"algorithm","zh":"算法","m":"计算机的判断程序"},{"en":"group features","zh":"群体特征","m":"一类人的共同特点"},{"en":"misjudge individuals","zh":"误判个人","m":"把群体猜测套到个人"},{"en":"fed in","zh":"输入的","m":"放进计算里的数据"},{"en":"algorithmic bias","zh":"算法偏见","m":"算法输出系统性出错"}]},
"prob-L16-posterior":{
"name":"后验概率",
"one":"后验（posterior）是看到证据后的 Pr(H|E)，分母是有证据的情形。",
"pts":["人数表里：有证据的情形中目标所占比例。","后验 ≠ 交集：32/38 是后验，32/100 是交集。","证据改变的是我们的判断，不改变事物本身。","证据可以累积：每多一个黑球，后验更接近 1。"],
"ex":"100 个时刻中 38 个烦躁，其中 32 个也疲倦：后验 Pr(T|I) = 32/38 = 16/19。",
"trap":"把分母写成全体 100，于是把交集当成了后验。",
"ana":"垃圾邮件过滤器看到「中奖」二字后判断「这是垃圾邮件」的概率，只在含「中奖」的邮件里数，不看全部邮件。",
"words":[{"en":"posterior","zh":"后验","m":"看到证据后的概率"},{"en":"prior","zh":"先验","m":"看到证据前的概率"},{"en":"NEGATIVE","zh":"阴性","m":"检测结果为「没有」"},{"en":"tails","zh":"反面","m":"硬币背面朝上"},{"en":"rises from … to …","zh":"从……升到……","m":"概率变大"},{"en":"remains","zh":"保持不变","m":"仍然是原来的值"}]},
"prob-L16-tpfp":{
"name":"真阳性率 vs 假阳性率",
"one":"真阳性率 Pr(P|M)：有时测出阳性；假阳性率 Pr(P|¬M)：没有也阳性。",
"pts":["两者来自不同人群，不必相加为 1。","同一条件下的正反结果才互补：Pr(P|M)+Pr(¬P|M)=1。","假阳性率为 0 时，阳性就能确定 M。","真阳性率不变，降低假阳性率，阳性证据更强。"],
"ex":"旧试剂真阳性率 50%、假阳性率 40%，相加 90% 无意义；假阳性率为 0 时阳性即确定真药。",
"trap":"跨条件取补集：Pr(¬P|¬M) 应是 1 − 0.4，不是 1 − Pr(P|M)。",
"ana":"烟雾报警器：真着火时响的比例（如 95%）和只是做饭时误响的比例（如 30%）针对两种不同场合，相加没有意义。",
"words":[{"en":"true positive rate","zh":"真阳性率","m":"Pr(P|M)"},{"en":"false positive rate","zh":"假阳性率","m":"Pr(P|¬M)"},{"en":"must sum to 1","zh":"相加必为 1","m":"两者互补"},{"en":"pair","zh":"一对","m":"两个数"},{"en":"holding … fixed","zh":"保持……不变","m":"其他条件不动"},{"en":"stronger evidence","zh":"更强的证据","m":"更能改变后验"},{"en":"raising / lowering","zh":"提高 / 降低","m":"让数变大或变小"}]},
"prob-L16-uninformative":{
"name":"无鉴别力的证据",
"one":"若 Pr(E|H) = Pr(E|¬H)，证据无法区分两者，后验 = 先验。",
"pts":["证据的力量看两种条件下出现率的差距。","此时 E 与 H 概率上独立（不说逻辑独立）。","Pr(E|H) 本身高，证据不一定有力。"],
"ex":"罐子题：先黑后白在 X 罐和 Y 罐都是 3/4×1/4 = 3/16，所以正面仍是 1/2。",
"trap":"以为「阳性率一半」就让结论变成 50%；其实后验仍是先验 75%。",
"ana":"某检测对病人和健康人都是 60% 出阳性，等于抛硬币下诊断：结果出来后，你对是否患病的判断应原样不动。",
"words":[{"en":"equally often","zh":"同样频繁","m":"两种情况下出现率相同"},{"en":"whether or not","zh":"无论是否","m":"两种情况都一样"},{"en":"discriminate","zh":"区分","m":"分辨两个假设"},{"en":"cannot be determined","zh":"无法确定","m":"信息不够算不出"},{"en":"black then white","zh":"先黑后白","m":"按顺序的抽球结果"}]},
"prob-L16-sleeping":{
"name":"睡美人问题",
"one":"正面醒一次、反面醒两次（抹去记忆）：醒来时正面的概率是 1/2 还是 1/3？",
"pts":["二分之一派（halfer）：醒来没带来新信息，正面 1/2。","三分之一派（thirder）：数醒来场合，正面 1/3、反面 2/3。","课堂把它当有争议的难题，没有唯一答案。","硬币本身始终公平。"],
"ex":"抛 100 次：约 50 正 50 反，醒来约 150 次，其中正面只占约 50 次。",
"trap":"把 thirder 的数对调：正面是 1/3，反面是 2/3。",
"ana":"像统计「来店的人」还是「来店的次数」：常客来两次，按人数和按次数算出的比例就不同。",
"words":[{"en":"Sleeping Beauty","zh":"睡美人","m":"课上的思想实验"},{"en":"awakening","zh":"醒来（场合）","m":"每一次醒过来"},{"en":"indistinguishable","zh":"无法区分的","m":"自己分不出是哪一次"},{"en":"competing arguments","zh":"相互竞争的论证","m":"结论不同的几种推理"},{"en":"beyond dispute","zh":"无可争议地","m":"没人能反驳"},{"en":"biased","zh":"有偏的（不公平）","m":"正反面概率不等"},{"en":"assign","zh":"赋予（概率）","m":"给出一个概率值"},{"en":"on waking","zh":"醒来时","m":"刚醒的那一刻"}]},
"prob-L18-ev":{
"name":"期望值",
"one":"期望值（EV）= Σ 概率 × 结果值，是多次重复时每次的平均得失。",
"pts":["每个结果都要乘上自己的概率，再全部相加。","EV 不是单次一定得到的数，也不一定是最可能的结果。","概率为 0 的结果或值为 0 的结果，贡献都是 0。"],
"ex":"公平硬币正面得 $10、反面得 $0：EV = 1/2×10 + 1/2×0 = $5。",
"trap":"以为 EV $5 就是这一次会拿到 $5；单次只能拿到 $10 或 $0。",
"ana":"车险公司对单个客户要么不赔、要么赔一大笔，但卖给上万人后，平均每单赔付才接近期望值。",
"words":[{"en":"expected value","zh":"期望值","m":"按概率加权的平均"},{"en":"repetitions","zh":"重复（多次）","m":"同样条件做很多次"},{"en":"approaches","zh":"趋近","m":"越来越接近"},{"en":"most likely single outcome","zh":"最可能的单次结果","m":"概率最大的那一个"},{"en":"at least half","zh":"至少一半","m":"不少于 50%"},{"en":"six-sided die","zh":"六面骰子","m":"点数 1 到 6"},{"en":"lottery ticket","zh":"彩票","m":"买来抽奖的票"},{"en":"interpretation","zh":"解读","m":"对含义的理解"}]},
"prob-L18-net":{
"name":"回款 vs 净结果",
"one":"净结果 = 回款 − 投入；算投资或赌局的 EV 要用净结果，成本只扣一次。",
"pts":["回款（gross payout）是拿回的钱，净收益要扣投入。","做法一：每种结果先扣成本再加权。","做法二：先算期望回款，最后统一扣一次。","两种做法只选一种，不能扣两次。"],
"ex":"投 $1M，最好情形拿回 $4M，净 +3：EV = 2/25×3 + 23/25×(−1) = −$0.68M。",
"trap":"漏扣投入（得 +0.32）；或每路扣了成本后最后又扣一次。",
"ana":"花 10 元买彩票中了 15 元：回款 15 元，净赚 5 元；没中净亏 10 元。算 EV 用 +5 和 −10。",
"words":[{"en":"invest","zh":"投资","m":"先投入一笔钱"},{"en":"startup","zh":"创业公司","m":"新成立的公司"},{"en":"founder","zh":"创始人","m":"公司的创办者"},{"en":"charismatic / dull","zh":"有魅力的 / 乏味的","m":"创始人的两种类型"},{"en":"gross payout","zh":"回款","m":"最后拿回的钱"},{"en":"net gain","zh":"净收益","m":"回款减去投入"},{"en":"subtracted twice","zh":"被减了两次","m":"成本重复扣除"},{"en":"returns $4M","zh":"拿回 400 万美元","m":"回款金额"}]},
"prob-L18-fair":{
"name":"公平价格",
"one":"公平价格 = 期望回款，此时期望净收益恰好为 0。",
"pts":["公平说的是平均，不保证单次收支相抵。","付 $5 玩 $10/$0 游戏：单次要么 +5 要么 −5。","信念更新后期望回款变了，公平价格也跟着变。"],
"ex":"正面 $10、反面 $0：公平价格 $5。两硬币题正面奖 $1：公平价格 $0.45。",
"trap":"以为付了公平价格，这一次就一定不赚不亏。",
"ana":"掷骰子出 6 奖 60 元、否则 0 元：期望回款 10 元，所以 10 元一次是公平价，玩很多次平均不赚不亏。",
"words":[{"en":"fair price","zh":"公平价格","m":"期望回款那么多的价格"},{"en":"entry price","zh":"入场价（票价）","m":"玩一次要付的钱"},{"en":"fair bet","zh":"公平赌局","m":"期望净收益为 0"},{"en":"break even","zh":"收支相抵","m":"不赚也不亏"},{"en":"guaranteed","zh":"保证","m":"一定会发生"},{"en":"ticket costs $4","zh":"票价 4 美元","m":"玩一次的成本"}]},
"prob-L18-house":{
"name":"庄家优势",
"one":"票价高于公平价格时，玩家期望净收益为负，差额就是庄家优势。",
"pts":["期望净收益 = 期望回款 − 票价。","提高票价不改变各结果的概率，也不改变期望回款。"],
"ex":"平均回款 $5 的投币游戏卖 $6：玩家每次平均净亏 $1。",
"trap":"以为票价变高会改变结果的概率或回款。",
"ana":"假设某彩票平均每张只返还 5 元却卖 10 元：每买一张平均净亏 5 元，这 5 元就是庄家优势。",
"words":[{"en":"house edge","zh":"庄家优势","m":"票价超出公平价的部分"},{"en":"bettor","zh":"下注者","m":"玩赌局的人"},{"en":"set above","zh":"定得高于","m":"价格比……高"},{"en":"stay the same","zh":"保持不变","m":"没有改变"}]},
"prob-L18-martingale":{
"name":"马丁格尔策略",
"one":"马丁格尔（Martingale）：每输一次下注翻倍，赢一次只净赚第一注。",
"pts":["连输 n 次后已亏 2^n − 1，下一注要押 2^n。","所需资金指数增长，会超过本金或下注上限。","它不改变每次输赢的概率，硬币没有记忆。"],
"ex":"押 1、2、4、8、16、32 连输 6 次已亏 63；第 7 注押 64，赢了也只净赚 1。",
"trap":"以为「总会赢一次」就稳赚；有限资金可能撑不到那一次。",
"ana":"像不断加倍借钱去补窟窿：多数时候只赢回 1 元，但连输 10 次就得押 1024 元，一次撑不住就把小赚全赔光。",
"words":[{"en":"stake","zh":"赌注","m":"这一局押的钱"},{"en":"doubles","zh":"翻倍","m":"变成原来两倍"},{"en":"even-money bet","zh":"一赔一的赌注","m":"赢了得到同等金额"},{"en":"betting limit","zh":"下注上限","m":"一次最多能押多少"},{"en":"in a row","zh":"连续","m":"一次接一次"},{"en":"practical danger","zh":"实际风险","m":"现实中会出的问题"},{"en":"overall net gain","zh":"总净收益","m":"所有局加起来的得失"}]},
"prob-L18-gambler":{
"name":"赌徒谬误",
"one":"赌徒谬误：误以为独立试验的过去结果会让某个未来结果「该来了」。",
"pts":["公平硬币连出六次反面，下一次正面仍是 1/2。","连续 8 次正面概率 (1/2)^8 = 1/256，罕见但可能。","真随机序列也会有长连串。","硬币类型不确定时，用结果更新判断是贝叶斯更新，不是谬误。"],
"ex":"伪随机数从种子出发按固定规则生成：同一种子会重现同一序列。",
"trap":"以为连串必须结束，或下一次结果会「补偿」前面的结果。",
"ana":"轮盘连开 5 次红色，下一次开红的概率和平时完全一样；彩票上期开过的号码，下期也不会更难开出。",
"words":[{"en":"gambler's fallacy","zh":"赌徒谬误","m":"以为结果该轮到了"},{"en":"streak","zh":"连串","m":"同一结果连续出现"},{"en":"due","zh":"该来了","m":"以为轮到它出现"},{"en":"random number generator","zh":"随机数生成器","m":"电脑产生随机数的程序"},{"en":"seed","zh":"种子","m":"生成序列的起始值"},{"en":"fixed rule","zh":"固定规则","m":"不变的计算方法"},{"en":"reproduces","zh":"重现","m":"再产生一模一样的"},{"en":"pseudorandom","zh":"伪随机","m":"看似随机实则确定"}]},
"prob-L18-coinupdate":{
"name":"不确定硬币的更新",
"one":"不知道拿的是哪枚硬币时，看到结果就提高更容易产生它的那枚的概率。",
"pts":["Pr(H) = 0.5×0.75 + 0.5×0.15 = 0.45。","变的是我们的判断，硬币本身的偏向不变。","给定硬币时各次独立；硬币未知时，结果带有关于硬币的信息。","下一次正面概率要用后验加权两枚硬币。"],
"ex":"A 正面 75%、B 正面 15%，各 1/2 被选：Pr(A|H) = 0.375/0.45 = 5/6。",
"trap":"把 Pr(H|A)=0.75 当成 Pr(A|H)；或以为看到正面后 A 的正面率变高了。",
"ana":"盒里一枚普通币、一枚双正面币，随手拿一枚抛出正面：是双正面币的概率从 1/2 升到 2/3，币本身没变。",
"words":[{"en":"lands heads","zh":"正面朝上","m":"抛出的结果是正面"},{"en":"flip","zh":"抛（硬币）","m":"抛一次"},{"en":"before flipping","zh":"抛之前","m":"还没看到结果时"},{"en":"heads-chance","zh":"出正面的概率","m":"硬币本身的偏向"},{"en":"same coin","zh":"同一枚硬币","m":"不换硬币再抛"},{"en":"probability tree","zh":"概率树","m":"按步骤分叉画概率"}]}
}}

{
  "cards": {
    "soc-L1-epistemology": {"ana": "认识论像信息的质检员：不问你知道什么，而问“你凭什么这么确定”，比如你凭什么相信群里转发的那条新闻。"},
    "soc-L1-jtb": {"ana": "像考试得满分要三样都齐：答案对（真）、你写了它（信）、有正确解题过程（辩护），缺一样都不算真会。"},
    "soc-L1-factive": {"ana": "你可以“以为”今天是周五，但如果今天其实是周四，你就不可能“知道”今天是周五。"},
    "soc-L1-justification": {"ana": "天气预报说下雨你带伞，这是有依据；扔硬币决定带伞碰巧下雨，就只是运气好，没有辩护。"},
    "soc-L1-necessary": {"ana": "有护照是坐国际航班的必要条件：没护照肯定上不了飞机，但光有护照没机票也不行。"},
    "soc-L1-sufficient": {"ana": "考到 100 分足以保证及格（充分）；但及格不一定要考 100 分，60 分也行。"},
    "soc-L1-gettier": {"ana": "一向很准的钟其实昨晚停了，你看它显示 3 点就相信现在 3 点，而此刻恰好真是 3 点：有理由、真、相信，却只是碰巧，不算知道。"},
    "soc-L1-argument": {"ana": "论证就像给结论搭桥：“地面湿了，而且没人洒水，所以刚下过雨”，前两句是桥墩，结论是桥对岸。"},
    "soc-L1-reconstruction": {"ana": "朋友说“他是医生，肯定很忙”，补出藏起来的那句“医生通常很忙”，这就是重构。"},
    "soc-L1-social-epistemology": {"ana": "你相信地球绕太阳转，靠的不是自己观测，而是老师、课本、科学家这整张信任网，社会认识论就研究这张网靠不靠谱。"},
    "soc-L2-newcomb": {"ana": "好比一个超准的算命先生早已决定好奖金：one-box 想“我的选择透露了他预测了什么”，two-box 想“钱早放好了，我的选择改变不了”。"},
    "soc-L3-ethics-of-belief": {"ana": "像问“没核实就相信并转发谣言，算不算一种不道德？”——关心的是信得负不负责，而不只是信得对不对。"},
    "soc-L3-evidentialism": {"ana": "Clifford 像一位严格的法官：证据不够就定罪是错的，同样，证据不够就相信也是道德上的错。"},
    "soc-L3-shipowner": {"ana": "像厨师明知食材可能变质，却说服自己“应该没事”就上菜：就算没人吃坏肚子，他的做法也已经错了。"},
    "soc-L3-four-replies": {"ana": "就像在群里随口说“那家店用地沟油”：你没做什么，但别人信了、转发了、不去了，“只是想想”也会伤人。"},
    "soc-L3-voluntarism": {"ana": "像决定要不要相信一个新朋友值得信任：证据还不够，但你必须表态，James 认为这时可以合理地选择去相信。"},
    "soc-L3-live": {"ana": "对你来说“读研还是工作”是活的选项；“去当火星国王”就不是，因为你根本不会真考虑。"},
    "soc-L3-forced": {"ana": "朋友问“今晚聚餐去不去？”说“再看看”拖到饭点，实际就等于选了“不去”。"},
    "soc-L3-momentous": {"ana": "午饭吃面还是吃饭不重大；接不接受一份要搬去国外的工作，才是会改变人生的重大选项。"},
    "soc-L3-self-fulfilling": {"ana": "相信自己能在演讲中讲好，于是更敢抬头、声音更稳，结果真讲好了——信念帮自己成了真。"},
    "soc-L3-truth-vs-error": {"ana": "像垃圾邮件过滤器：设得太严，少收垃圾但会误拦重要邮件；设得太松，重要邮件都收到但垃圾也多。"},
    "soc-L3-reductio": {"ana": "像有人宣布“不要相信任何没写在合同里的规则”，可这条规则本身并没写在合同里——它自己先违反了自己。"},
    "soc-L5-testimony": {"ana": "你知道自己的生日，其实是爸妈和出生证明告诉你的——你自己当时并不记得，这就是靠证言知道。"},
    "soc-L5-autonomy": {"ana": "像坚持“什么都要自己算一遍再信”的学生，不轻易接受老师或权威的话，只信自己的推理和证据。"},
    "soc-L5-dependence": {"ana": "飞行员说“前方有气流，请系好安全带”，你看不懂仪表数据，但因为信任飞行员，你有理由相信要系好安全带。"},
    "soc-L5-expert": {"ana": "修车师傅一听发动机声音就知道哪里坏了——这是靠训练和经验得来的能力，不是靠名片上的头衔。"},
    "soc-L5-deference": {"ana": "导航说前方封路要绕行，你虽然觉得直走更近，但承认它掌握实时路况，就该认真听它的，而不是只信直觉。"},
    "soc-L5-chain": {"ana": "像传话游戏：消息可以传过很多人，但第一个人必须真的看到过，否则后面每个人传的都是空中楼阁。"},
    "soc-L5-individualism": {"ana": "像把知识看成每个人各自的存折：每个人只能用自己存进去的证据，不把小组或社会当成“知道者”。"},
    "soc-L5-identify-experts": {"ana": "你不懂法律，就很难判断哪个律师真厉害，只能看执照、胜诉记录和别人推荐，而这些本身也是别人告诉你的。"},
    "soc-L7-attention": {"ana": "注意力像舞台上的追光灯：照到的演员看得一清二楚，没照到的人虽然也在台上，却几乎被忽略。"},
    "soc-L7-endo-exo": {"ana": "你在书店主动找某本书是内源注意；突然有人打翻书架、你忍不住回头，是外源注意。"},
    "soc-L7-selective": {"ana": "在人群里专心找穿红衣服的朋友时，你可能完全没注意到身边路过了一位明星。"},
    "soc-L7-selection-bias": {"ana": "在健身房门口问人“你多久运动一次”，得出“大家都常运动”——因为被问到的本来就是爱运动的人。"},
    "soc-L7-representative": {"ana": "尝一锅汤要先搅匀再舀一勺，这勺才能代表整锅；只舀表面的油，就不代表整锅的味道。"},
    "soc-L7-self-selection": {"ana": "老师问“谁觉得作业太多请举手”，主动举手的多是特别不满的同学，安静的大多数没被统计到。"},
    "soc-L7-survivorship": {"ana": "看到街上的老房子都很结实，就以为“以前的房子质量更好”，却忘了建得差的老房子早就被拆了。"},
    "soc-L7-friendship": {"ana": "班里的“社交达人”出现在几乎每个人的好友列表里，所以你的朋友们平均下来，朋友数总比你多。"},
    "soc-L7-unit": {"ana": "一家餐厅说“平均每桌 3 人”，但按顾客算，多数人是坐在大桌上的——从顾客角度看，平均同桌人数要多得多。"},
    "soc-L7-berkson": {"ana": "能上热门的视频要么内容特别好、要么标题特别吸睛，于是在热门里看起来“标题越夸张内容越差”，其实总体上两者无关。"},
    "soc-L7-censoring": {"ana": "只统计“已经毕业”的学生算平均读书年限，最近入学、还没毕业的学生被排除，就只剩那些读得特别快的人。"},
    "soc-L7-randomization": {"ana": "像抽签决定谁能免费试用健身卡，再比较两组健康，而不是比较主动办卡的人和没办卡的人。"},
    "soc-L9-three-levels": {"ana": "妈妈说“你房间真干净啊”：句法是语序正确，语义是夸房间干净，语用上其实在说“快去收拾”。"},
    "soc-L9-speech-act": {"ana": "裁判说“你出局了”，这句话不是在描述，而是让球员真的出局；观众喊同一句话就没有这个效力。"},
    "soc-L9-focal-point": {"ana": "和朋友在商场走散、手机没电，你们都会想到去正门口等——不是因为那里最好，而是都觉得对方也会去那。"},
    "soc-L9-common-knowledge": {"ana": "班长在全班宣布“明天放假”，大家不只都知道，还都知道别人也知道，这就是共同知识；私下一个个告诉则不是。"},
    "soc-L9-common-ground": {"ana": "像会议纪要：明确说出并记进纪要的内容，之后大家都能引用；只在走廊里暗示的，就没进纪要。"},
    "soc-L9-indirect-speech": {"ana": "想让客人离开却说“哎呀都这么晚了”，对方能听懂，但你并没正式说出“请你走”。"},
    "soc-L9-deniability": {"ana": "你说“这门课的期末好像挺难的”暗示想抄作业，若对方不满，你可以说“我只是聊聊考试而已”。"},
    "soc-L9-relationship": {"ana": "问同事“周末有空一起去看展吗？”被婉拒也不尴尬，因为表面上只是约看展，同事关系照旧。"},
    "soc-L9-strategic-ambiguity": {"ana": "公司公告说“我们正在优化团队结构”，员工读出可能裁员，投资人读出提效，公司却没明确说任何一种。"},
    "soc-L11-bibliotechnic": {"ana": "LLM 像一个读过整座图书馆的超级检索员，能把书里的片段拼成新回答，但这不意味着它真的在思考。"},
    "soc-L11-next-token": {"ana": "像接龙写句子：每次只看前面写了什么，猜最可能的下一个字写上，再接着猜下一个，直到写完。"},
    "soc-L11-redescription": {"ana": "说“音乐只是空气振动，所以没有美”是错的推理：能用低层方式描述它，并不证明高层特性不存在。"},
    "soc-L11-hallucination": {"ana": "像一个不懂装懂、口才极好的同学，被问到不会的题也能说得头头是道，听着很像答案，其实是编的。"},
    "soc-L11-twenty-questions": {"ana": "像一个玩猜谜却没先想好答案的人：只要回答和之前说的不矛盾就行，重来一次可能“想的”是另一个东西。"},
    "soc-L11-testimony": {"ana": "地图不会思考，但你能靠它找到路；关键是它标的信息能不能追溯来源、能不能核对。"}
  }
}

{
  "cards": {
    "soc-L1-epistemology": {"one": "研究知识的哲学：什么是知识、何为辩护与证据、凭什么相信。", "en": "The philosophical study of knowledge: what knowledge is, what justifies belief, and what counts as evidence.", "qs": ["soc-L1-q07", "soc-L1-q01"]},
    "soc-L1-jtb": {"one": "JTB：X 知道 P ⟺ P 真、X 信 P、X 有辩护；三条各自必要、合起来充分。", "en": "X knows P iff P is true, X believes P, and X is justified; individually necessary, jointly sufficient.", "qs": ["soc-L1-q01", "soc-L1-q02", "soc-L1-q03", "soc-L1-e01"]},
    "soc-L1-factive": {"one": "知识是 factive 的：知道 P 蕴含 P 为真，假命题只能被相信不能被知道。", "en": "Knowledge is factive: if X knows P, then P is true; false propositions cannot be known.", "qs": ["soc-L1-q06", "soc-L1-q01"]},
    "soc-L1-justification": {"one": "辩护：主体对 P 有好的理由或证据，使真信念不是瞎猜碰对。", "en": "Having good reasons or evidence for believing P, so a true belief is not a lucky guess.", "qs": ["soc-L1-q01", "soc-L1-q03", "soc-L1-e01"]},
    "soc-L1-necessary": {"one": "A 是 B 的必要条件：没有 A 就没有 B（B → A）。", "en": "A is necessary for B if B cannot obtain without A: B → A.", "qs": ["soc-L1-q04", "soc-L1-q05"]},
    "soc-L1-sufficient": {"one": "A 是 B 的充分条件：A 成立就保证 B（A → B）。", "en": "A is sufficient for B if A's obtaining guarantees B: A → B.", "qs": ["soc-L1-q05", "soc-L1-q04", "soc-L1-q02"]},
    "soc-L1-gettier": {"one": "Gettier 案例：有辩护的真信念仅因运气为真、不算知识，证明 JTB 不充分（非不必要）。", "en": "A justified true belief true only by luck, hence not knowledge; shows JTB is not sufficient.", "qs": ["soc-L1-q02", "soc-L1-q03", "soc-L1-e01"]},
    "soc-L1-argument": {"one": "论证：一组前提被提出作为相信某结论的理由。", "en": "A set of premises offered as reasons to believe a conclusion.", "qs": ["soc-L1-q07"]},
    "soc-L1-reconstruction": {"one": "论证重构：补出论证中未明说的隐含前提，使完整结构可评价。", "en": "Making an argument's implicit premises explicit so its full structure can be assessed.", "qs": ["soc-L3-q03"]},
    "soc-L1-social-epistemology": {"one": "社会认识论：研究知识如何依赖社会环境，尤其如何从他人/来源/机构获得可信前提。", "en": "Study of how knowledge depends on social context, especially obtaining trustworthy premises from others and institutions.", "qs": ["soc-L1-q07", "soc-L5-q01", "soc-L5-e01"]},
    "soc-L2-newcomb": {"one": "Newcomb：one-box 问选择预示什么（证据推理），two-box 问选择能造成什么（因果推理）。", "en": "Pits evidential reasoning (one-box: choice as evidence of prediction) against causal reasoning (two-box: choice cannot change contents).", "qs": ["soc-L2-q01", "soc-L2-q02"]},
    "soc-L3-ethics-of-belief": {"one": "信念伦理学：形成信念是否有道德（不只理性）责任、需多少证据、信念能否选择。", "en": "Asks whether we have moral, not merely rational, duties in forming beliefs and how much evidence belief needs.", "qs": ["soc-L3-q01", "soc-L3-q02", "soc-L3-e01"]},
    "soc-L3-evidentialism": {"one": "Clifford：任何人任何时候证据不足而相信都是道德上错的。", "en": "Clifford: it is morally wrong always, everywhere, for anyone to believe anything on insufficient evidence.", "qs": ["soc-L3-q01", "soc-L3-q03", "soc-L3-q10", "soc-L3-q09", "soc-L3-e01"]},
    "soc-L3-shipowner": {"one": "Clifford 船主案：压下怀疑、真诚相信船安全，仍有罪——真诚和好结果都不能代替证据。", "en": "Clifford's shipowner is guilty for believing without evidence; sincerity or a lucky safe arrival does not excuse him.", "qs": ["soc-L3-q02", "soc-L3-e01"]},
    "soc-L3-four-replies": {"one": "Clifford 驳“只有行动有害”：信念致行动、影响行为、会传播、轻信成坏习惯害集体求真。", "en": "Beliefs cause actions, influence behaviour, are communicated to others, and careless believing harms collective truth-seeking.", "qs": ["soc-L3-q04", "soc-L3-q03", "soc-L3-e01"]},
    "soc-L3-voluntarism": {"one": "James：对 live、forced、momentous 且证据无法决定的选项，可合理选择相信。", "en": "James: for live, forced, momentous options evidence cannot settle, we may legitimately choose what to believe.", "qs": ["soc-L3-q05", "soc-L3-q06", "soc-L3-q04", "soc-L3-e01"]},
    "soc-L3-live": {"one": "活选项：每个选择对当事人都是心理上真正可能接受的。", "en": "An option whose alternatives are each genuine psychological possibilities the person could accept.", "qs": ["soc-L3-q05"]},
    "soc-L3-forced": {"one": "被迫选项：必须选、无法悬置，不选本身就等于选了一边。", "en": "An option one cannot avoid choosing; suspending judgement in effect chooses one side.", "qs": ["soc-L3-q06", "soc-L3-q05"]},
    "soc-L3-momentous": {"one": "重大选项：选择会带来重大、改变人生（常独特或不可逆）的后果。", "en": "An option whose choice has significant, life-changing, often unique or irreversible consequences.", "qs": ["soc-L3-q05"]},
    "soc-L3-self-fulfilling": {"one": "自我实现信念：证据不足时形成，却通过影响行为帮助自身成真（James 反驳 Clifford）。", "en": "A belief adopted without sufficient evidence that helps make itself true by influencing behaviour.", "qs": ["soc-L3-q07", "soc-L3-e01"]},
    "soc-L3-truth-vs-error": {"one": "James：追求真理与避免错误是两个目标，门槛越严错误越少但越易错过真相。", "en": "James: believing truth and shunning error are distinct goals; strict thresholds avoid errors but miss truths.", "qs": ["soc-L3-q08", "soc-L3-e01"]},
    "soc-L3-reductio": {"one": "James 归谬：Clifford 原则须先于证据被接受，本身无充分证据，按自身标准自我削弱。", "en": "James: Clifford's principle must be accepted prior to evidence, so by its own standard believing it is wrong.", "qs": ["soc-L3-q10", "soc-L3-q09", "soc-L3-e01"]},
    "soc-L5-testimony": {"one": "证言：广义指他人告诉我们的一切（口头、书、照片、新闻、记录等），多数知识依赖它。", "en": "Broadly, anything others tell us (speech, books, photos, news, records); most knowledge depends on it.", "qs": ["soc-L5-q01", "soc-L5-q03", "soc-L11-q06"]},
    "soc-L5-autonomy": {"one": "思想自主：启蒙（Kant）理想，用自己的理性和证据形成信念、不盲从权威。", "en": "Enlightenment (Kantian) ideal of forming beliefs by one's own reason and evidence, not deferring to authority.", "qs": ["soc-L5-q06", "soc-L5-e01"]},
    "soc-L5-dependence": {"one": "Hardwig：B 可因承认的专家 A 相信 P 而有辩护，即使 B 没有或看不懂 A 的证据。", "en": "Hardwig: B can be justified in believing P because recognised expert A believes it, without A's evidence.", "qs": ["soc-L5-q02", "soc-L5-q03", "soc-L5-q06", "soc-L5-e01"]},
    "soc-L5-expert": {"one": "专家：在某领域有客观能力（训练、经验、工具），能处理非专家处理不了的证据，非头衔。", "en": "Someone with objective domain competence enabling them to access and interpret evidence non-experts cannot.", "qs": ["soc-L5-q02", "soc-L5-q08", "soc-L5-e01"]},
    "soc-L5-deference": {"one": "理性服从：因专业能力差距而非地位接受专家判断，不等于盲从。", "en": "Accepting an expert's judgement in their domain because of a competence gap, not their status.", "qs": ["soc-L5-q05", "soc-L5-q06", "soc-L5-e01"]},
    "soc-L5-chain": {"one": "证言链：辩护可经多人传递，但链条最终必须落在真实证据上。", "en": "Passing justification through several people; it can travel but must ultimately terminate in genuine evidence.", "qs": ["soc-L5-q04", "soc-L5-q03", "soc-L5-e01"]},
    "soc-L5-individualism": {"one": "认识论个人主义：个人是首要知识主体，各自依自身证据形成信念。", "en": "The view that individuals are the primary subjects of knowledge, each believing on their own evidence.", "qs": ["soc-L5-q07"]},
    "soc-L5-identify-experts": {"one": "识别专家难题：非专家无法直接检验专家，只能靠认证、记录等指标，而这些又依赖证言。", "en": "Non-experts cannot directly test expertise and rely on indicators like certification that themselves depend on testimony.", "qs": ["soc-L5-q08", "soc-L5-e01", "soc-L11-q06"]},
    "soc-L7-attention": {"one": "注意：使部分信息更显著、更被加工，而让其余信息处理不足的心理过程。", "en": "A process making some information more salient and available for processing, leaving the rest underprocessed.", "qs": ["soc-L7-q01", "soc-L7-q02", "soc-L7-e01"]},
    "soc-L7-endo-exo": {"one": "内源注意由自身目标主动定向，外源注意被显著外部刺激抓走。", "en": "Endogenous attention is directed by one's own goals; exogenous attention is captured by salient external stimuli.", "qs": ["soc-L7-q01"]},
    "soc-L7-selective": {"one": "选择性注意：专注目标任务会让显眼但无关的信息“看不见”（大猩猩实验）。", "en": "Focusing on a task improves performance but can make salient, task-irrelevant information effectively invisible.", "qs": ["soc-L7-q02"]},
    "soc-L7-selection-bias": {"one": "选择偏差：进入样本的机制与研究特征系统性相关，使样本系统性偏离总体。", "en": "When the process selecting cases is systematically related to the studied outcome, so the sample misrepresents the population.", "qs": ["soc-L7-e01", "soc-L7-q04", "soc-L7-q05", "soc-L7-q08", "soc-L7-q10", "soc-L7-q03"]},
    "soc-L7-representative": {"one": "代表性样本：入样与被估计特征无系统关联，在相关方面近似总体。", "en": "A sample whose inclusion is not systematically connected to the estimated characteristic, resembling the population.", "qs": ["soc-L7-q04", "soc-L7-e01"]},
    "soc-L7-self-selection": {"one": "自我选择：个体自己决定是否参与，参与者与不参与者系统性不同。", "en": "Selection bias where individuals choose to participate, so participants differ systematically from non-participants.", "qs": ["soc-L7-q08"]},
    "soc-L7-survivorship": {"one": "幸存者偏差：只看通过筛选后可见的案例，忽视被淘汰的案例。", "en": "Drawing conclusions from cases surviving a filtering process while ignoring those the process removed.", "qs": ["soc-L7-q03", "soc-L7-e01"]},
    "soc-L7-friendship": {"one": "友谊悖论：多数人朋友比自己的朋友少，因高连接者出现在更多人的朋友样本中。", "en": "Most people have fewer friends than their friends do, because well-connected people appear in more friend samples.", "qs": ["soc-L7-q07"]},
    "soc-L7-unit": {"one": "分析单位：按不同单位计数/抽样会得出不同但各自为真、回答不同问题的平均数。", "en": "The basic unit counted or sampled; different units give different, individually true averages answering different questions.", "qs": ["soc-L7-q06"]},
    "soc-L7-berkson": {"one": "Berkson 悖论：按两特征综合门槛筛选，会在被选群体内制造总体中没有的（常为负）相关。", "en": "Selecting on a combination of two traits creates a correlation, often negative, absent in the population.", "qs": ["soc-L7-q09"]},
    "soc-L7-censoring": {"one": "右删失：观察期结束前未出现结果的案例被排除，使较晚群体只显示短结果。", "en": "Excluding cases whose outcomes have not occurred by the window's end, so later cohorts show only short outcomes.", "qs": []},
    "soc-L7-randomization": {"one": "随机分配参与机会使组别期望可比，把真实效果与自愿参与者原有差异分开。", "en": "Randomly assigning treatment offers makes groups comparable, separating real effects from pre-existing self-selection differences.", "qs": ["soc-L7-q08", "soc-L7-q10", "soc-L7-e01"]},
    "soc-L9-three-levels": {"one": "句法管结构规则，语义管字面意义，语用管语境中超出字面所传达的内容。", "en": "Syntax: structural rules; semantics: conventional literal meaning; pragmatics: what is conveyed in context beyond literal meaning.", "qs": ["soc-L9-q01", "soc-L9-e01"]},
    "soc-L9-speech-act": {"one": "言语行为：在适当身份/程序/情境下，说话本身完成社会行动、建立规范事实，而非描述世界。", "en": "An utterance that, given proper authority and context, itself performs a social action rather than describing.", "qs": ["soc-L9-q02", "soc-L9-q07"]},
    "soc-L9-focal-point": {"one": "焦点（Schelling 点）：人人预计别人也觉显著的选项，使无沟通协调成为可能，不必最好。", "en": "An option enabling coordination without communication because each expects others to find it salient; need not be best.", "qs": ["soc-L9-q03"]},
    "soc-L9-common-knowledge": {"one": "共同知识：双方都知道 p，且知道对方知道、知道对方知道自己知道……无限递归。", "en": "Both know p, each knows the other knows p, and so on recursively; more than shared knowledge.", "qs": ["soc-L9-q04", "soc-L9-q06", "soc-L9-e01"]},
    "soc-L9-common-ground": {"one": "共同基础：对话者已公开承诺、此后可共同依赖的内容，通常由明确断言加入。", "en": "Propositions participants have publicly committed to and can jointly rely on, typically added by explicit assertion.", "qs": ["soc-L9-q06", "soc-L9-e01", "soc-L9-q03"]},
    "soc-L9-indirect-speech": {"one": "间接言语：用语用机制传达 p 而不断言 p，使 p 被理解却不进入共同基础。", "en": "Conveying p via pragmatic mechanisms without asserting it, so p is understood but not on record in common ground.", "qs": ["soc-L9-e01", "soc-L9-q06", "soc-L9-q05", "soc-L9-q07", "soc-L9-q09"]},
    "soc-L9-deniability": {"one": "可信可否认性：存在足以免责的无辜解释，合作者可接受暗示、敌对者难以惩罚。", "en": "An available innocent interpretation avoiding formal responsibility: cooperative hearers accept, hostile hearers cannot punish.", "qs": ["soc-L9-q05", "soc-L9-q09", "soc-L9-e01"]},
    "soc-L9-relationship": {"one": "关系管理：用间接表达试探关系变化，被拒时仍可维持原关系、降低失败成本。", "en": "Using indirect speech to probe a relationship change while preserving the existing relationship if declined.", "qs": ["soc-L9-q07", "soc-L9-e01"]},
    "soc-L9-strategic-ambiguity": {"one": "战略模糊：故意含糊让不同受众读出不同信息，不入共同基础并保留无害字面解释。", "en": "Deliberate vagueness letting audiences read different messages while keeping an innocuous literal reading off the record.", "qs": ["soc-L9-q08", "soc-L9-q09", "soc-L9-e01"]},
    "soc-L11-bibliotechnic": {"one": "图书馆技术假说：LLM 是压缩、重组、外推人类文本模式的信息检索系统，而非思考主体。", "en": "LLMs are sophisticated information-retrieval systems recombining patterns in human text, not genuinely thinking agents.", "qs": ["soc-L11-q02", "soc-L11-q04", "soc-L11-q03", "soc-L11-e01"]},
    "soc-L11-next-token": {"one": "下一 token 预测：按 Pr(下一 token | 前文) 选 token 追加到前文，循环生成。", "en": "Generating text by estimating Pr(next token | preceding context), appending the chosen token, and repeating.", "qs": ["soc-L11-q05", "soc-L11-q01", "soc-L11-e01"]},
    "soc-L11-redescription": {"one": "重描述谬误：仅因系统可用低层机制描述（“只是统计”）就推出它没有高层能力。", "en": "Inferring a system lacks a high-level capacity merely because its operation can be redescribed in low-level mechanistic terms.", "qs": ["soc-L11-q01", "soc-L11-q02", "soc-L11-e01"]},
    "soc-L11-hallucination": {"one": "幻觉：文本上合理、像答案却缺乏事实支持的生成内容，体现文本合理性≠真。", "en": "Generated content that is textually plausible and answer-like but lacks factual support.", "qs": ["soc-L11-q03", "soc-L11-e01"]},
    "soc-L11-twenty-questions": {"one": "二十问论证（Shanahan）：重采样会走向不同对象，说明模型只保持与前文一致，并无固定目标。", "en": "Resampling a twenty-questions game yields different objects, suggesting consistency with prior text rather than a fixed target.", "qs": ["soc-L11-q04", "soc-L11-e01"]},
    "soc-L11-testimony": {"one": "LLM 是否思考与能否从中获得知识是两个问题；不思考也可传递信息，但须可追溯、可检验。", "en": "Whether LLMs think differs from whether we learn from them; outputs must be traceable to sources and checkable.", "qs": ["soc-L11-q06", "soc-L11-e01"]}
  }
}

{"cards":{
"soc-L1-epistemology":{"name":"认识论","one":"研究知识的哲学：什么算知识、什么让信念有辩护、什么算证据。","pts":["认识论（epistemology）查前提是否可靠","逻辑和概率查推理过程是否正确","本课关心日常事实知识，不重彻底怀疑论"],"ex":"Watergate 听证会问：总统知道什么、何时知道？这是普通的事实性知识问题。","trap":"以为推理有效就够了；前提是否可靠是另一个问题。","ana":"认识论像信息的质检员：不问你知道什么，而问“你凭什么这么确定”，比如你凭什么相信群里转发的新闻。","words":[{"en":"valid argument","zh":"有效论证","m":"前提真则结论必真"},{"en":"validity","zh":"有效性","m":"推理结构是否保真"},{"en":"premise","zh":"前提","m":"论证中用来支持结论的句子"},{"en":"reliable","zh":"可靠的","m":"通常能给出真信息"},{"en":"logical form","zh":"逻辑形式","m":"论证的结构，不看内容"},{"en":"theory of disease","zh":"疾病理论","m":"关于病因的学说"}]},
"soc-L1-jtb":{"name":"知识的 JTB 分析","one":"X 知道 P，当且仅当 P 为真、X 相信 P、X 有辩护。","pts":["真（truth）、信（belief）、辩护（justification）","每条单独都是必要条件","三条合起来被认为是充分条件","Gettier 攻击的是“合起来充分”这一点"],"ex":"初到 Canberra 的人凭“Telstra 是电信公司”猜塔名，猜对也相信，但没证据，缺辩护，不算知识。","trap":"「确定无疑、不可怀疑」不是 JTB 的条件。","ana":"像考试满分要三样齐：答案对（真）、你写了它（信）、有正确过程（辩护），缺一样都不算真会。","words":[{"en":"analysis","zh":"分析","m":"给概念下定义的尝试"},{"en":"condition","zh":"条件","m":"成立所需满足的要求"},{"en":"certain","zh":"确定的","m":"毫无疑问"},{"en":"cannot be doubted","zh":"不可怀疑","m":"连怀疑的可能都没有"},{"en":"iff (if and only if)","zh":"当且仅当","m":"双向条件，互为充要"}]},
"soc-L1-factive":{"name":"知识的事实性","one":"知识是事实性的（factive）：知道 P 就蕴含 P 为真。","pts":["K(P) → P：只有真命题能被知道","假命题可以被相信，但不能被知道","反过来不成立：P 真不代表你知道 P"],"ex":"你不可能“知道”埃菲尔铁塔在 Black Mountain 上，因为这是假的。","trap":"把「P 真就知道 P」当成事实性；那是逆命题。","ana":"你可以“以为”今天是周五，但如果今天其实是周四，你就不可能“知道”今天是周五。","words":[{"en":"factive","zh":"事实性的","m":"蕴含所说内容为真"},{"en":"prove","zh":"证明","m":"给出决定性的论证"},{"en":"good evidence","zh":"好的证据","m":"通常能支持信念的理由"},{"en":"claim","zh":"主张","m":"被提出的说法"}]},
"soc-L1-justification":{"name":"辩护","one":"辩护：主体对 P 有好的理由或证据，使真信念不是瞎猜碰对。","pts":["来源：亲眼所见、可靠证言、地图、推理等","真评价命题本身；有效评价推理；辩护评价人","有辩护的信念仍可能是假的"],"ex":"完全靠猜却猜对：真、也相信，但没有辩护，不算知识。","trap":"把真、有效（validity）、辩护混为一谈。","ana":"天气预报说下雨你带伞，这有依据；扔硬币决定带伞碰巧下雨，只是运气好，没有辩护。","words":[{"en":"justified","zh":"有辩护的","m":"有好理由相信"},{"en":"evidence","zh":"证据","m":"支持信念的理由或材料"},{"en":"lighting","zh":"光线","m":"看东西时的照明情况"}]},
"soc-L1-necessary":{"name":"必要条件","one":"A 是 B 的必要条件：没有 A 就没有 B，即 B → A。","pts":["必要 = 不能缺，但不保证结果","“B 需要 A”“只有 A 才 B”都表示必要","可能既不必要也不充分，也可能两者都是"],"ex":"注册 PHIL1005 是通过它的必要条件：没注册不可能通过，但注册了不保证通过。","trap":"把必要条件当成充分条件：不学习就挂≠学习就过。","ana":"有护照是坐国际航班的必要条件：没护照肯定上不了飞机，但光有护照没机票也不行。","words":[{"en":"required for","zh":"是……所必需的","m":"表示必要条件"},{"en":"enrolment","zh":"注册选课","m":"正式登记修读一门课"},{"en":"neither … nor","zh":"既不……也不","m":"两者都否定"},{"en":"confusing","zh":"混淆","m":"把两样东西弄混"}]},
"soc-L1-sufficient":{"name":"充分条件","one":"A 是 B 的充分条件：只要 A 成立就保证 B，即 A → B。","pts":["充分 = 单独就够","A 是 B 的充分条件 ⟺ B 是 A 的必要条件","Gettier 表明 JTB 对知识不充分"],"ex":"Boss 血量降到 0 就足以判定胜利（充分）；有 Boss 房钥匙只是必要条件。","trap":"从「不 A 则不 B」推出「A 则 B」，是把必要当充分。","ana":"考到 100 分足以保证及格（充分）；但及格不一定要考 100 分，60 分也行。","words":[{"en":"sufficient","zh":"充分的","m":"单独就足够保证"},{"en":"error","zh":"错误","m":"推理中出的错"},{"en":"truth vs validity","zh":"真 vs 有效","m":"命题真假 vs 推理结构"},{"en":"testimony","zh":"证言","m":"别人告诉你的信息"}]},
"soc-L1-gettier":{"name":"盖梯尔案例","one":"有辩护的真信念只是碰巧为真，直觉上不算知识，所以 JTB 不充分。","pts":["真、信、辩护都满足，但为真靠运气","使信念为真的东西不是证据所指向的东西","只证明 JTB 不充分，不证明某条不必要","不证明我们一无所知（不是怀疑论）"],"ex":"Verna 在正常光线下看见一个像 Colin 的陌生人，信 Colin 在悉尼；Colin 恰好在悉尼别处。","trap":"以为 Gettier 说明辩护或真不必要；它只攻击充分性。","ana":"一向很准的钟其实昨晚停了，你看它显示 3 点就信现在 3 点，此刻恰好真是 3 点：碰巧对，不算知道。","words":[{"en":"Gettier case","zh":"盖梯尔案例","m":"有辩护真信念却非知识的反例"},{"en":"intuitively","zh":"直觉上","m":"凭直观判断"},{"en":"lack","zh":"缺乏","m":"没有"},{"en":"by luck","zh":"靠运气","m":"碰巧"},{"en":"track","zh":"追踪、对应","m":"证据真正指向的对象"},{"en":"stranger","zh":"陌生人","m":"不认识的人"},{"en":"most directly","zh":"最直接地","m":"最主要说明的"}]},
"soc-L1-argument":{"name":"论证","one":"论证：一组前提被提出，作为相信某个结论的理由。","pts":["论证不是吵架","一问：前提是否支持结论（逻辑/概率）","二问：前提本身是否可信（认识论）"],"ex":"说 potato cakes 的只有维州（Victoria）或塔州人；Nanette 说了且不是塔州人，所以她来自维州。","trap":"有效论证也可能有假前提、得出假结论。","ana":"论证像给结论搭桥：“地面湿了，而且没人洒水，所以刚下过雨”，前两句是桥墩，结论是对岸。","words":[{"en":"conclusion","zh":"结论","m":"论证要支持的那句话"},{"en":"guarantee","zh":"保证","m":"确保一定成立"},{"en":"illustrate","zh":"说明、例示","m":"用例子展示"},{"en":"lesson","zh":"教训、启示","m":"从例子中学到的道理"}]},
"soc-L1-reconstruction":{"name":"论证重构","one":"论证重构：把没说出口的隐含前提补出来，让结构完整、便于评价。","pts":["补的是对方默认的前提","不能擅自改对方的结论","补完后才能看出该攻击哪个前提"],"ex":"Clifford 论证重构为 P1 不伤害他人的义务、P2 证据不足地信总伤人、C 证据不足地信总是错。","trap":"重构时偷换了对方的结论。","ana":"朋友说“他是医生，肯定很忙”，补出藏起来的那句“医生通常很忙”，这就是重构。","words":[{"en":"reconstruction","zh":"重构","m":"把论证整理成前提和结论"},{"en":"target for objection","zh":"反驳的靶子","m":"最该被质疑的地方"},{"en":"follow from","zh":"从……推出","m":"由前提得出"},{"en":"sound","zh":"可靠的（论证）","m":"有效且前提都真"},{"en":"uncontroversially","zh":"毫无争议地","m":"没人会反对"},{"en":"inert","zh":"惰性的","m":"不起任何作用的"}]},
"soc-L1-social-epistemology":{"name":"社会认识论","one":"研究知识如何依赖社会：我们怎样从他人、来源、机构得到可信前提。","pts":["核心：来源可靠性、信息过载、信任问题","我怎么知道某来源可靠？常会循环","与证言、专家依赖直接相关"],"ex":"我为什么信 Wikipedia？因为它说自己有可靠引用：这是循环信任（circular trust）。","trap":"以为社会认识论只研究逻辑形式；它研究前提从哪来。","ana":"你相信地球绕太阳转，靠的不是自己观测，而是老师、课本、科学家这整张信任网。","words":[{"en":"social epistemology","zh":"社会认识论","m":"研究知识的社会来源"},{"en":"concerned with","zh":"关注","m":"研究的对象是"},{"en":"source","zh":"来源","m":"信息从哪里来"}]},
"soc-L2-newcomb":{"name":"纽康姆悖论","one":"只拿 B 看选择预示什么（证据推理），拿两盒看选择能造成什么（因果推理）。","pts":["证据推理（evidential reasoning）：只拿 B 是 B 有钱的证据","因果推理（causal reasoning）：钱已放好，多拿 A 多赚","预测者（oracle）的可靠性是关键","没有公认唯一答案"],"ex":"透明盒 A 有 $1000；预测你只拿 B 时，B 里才放 $1,000,000，否则为空。","trap":"若预测者只是随机猜，选择不带证据，应拿两盒。","ana":"好比超准的算命先生早已决定好奖金：一派想“我的选择透露了他的预测”，另一派想“钱早放好了，改变不了”。","words":[{"en":"oracle","zh":"预言者","m":"题中能预测你选择的角色"},{"en":"two-boxer","zh":"两盒派","m":"主张两个盒子都拿的人"},{"en":"one-boxer","zh":"一盒派","m":"主张只拿 B 的人"},{"en":"causally bring about","zh":"因果地造成","m":"真的让某事发生"},{"en":"base rate","zh":"基础比率","m":"某类在总体中的比例"},{"en":"at random","zh":"随机地","m":"没有规律、碰运气"},{"en":"carries no evidence","zh":"不带证据","m":"不提供任何信息"}]},
"soc-L3-ethics-of-belief":{"name":"信念伦理学","one":"研究形成信念有没有道德责任：要多少证据才可以相信。","pts":["两个问题要分开：信念真吗？形成得负责吗？","结果正确不代表过程负责","Clifford 说有道德责任，James 反对其绝对版本"],"ex":"选择题蒙对：答案为真你也选了，但认识过程不负责。","trap":"只看信念真假，忽略它是否被负责地形成。","ana":"像问“没核实就相信并转发谣言，算不算不道德？”关心的是信得负不负责，而不只是信得对不对。","words":[{"en":"ethics of belief","zh":"信念伦理学","m":"相信是否有道德对错"},{"en":"principle","zh":"原则","m":"普遍适用的规则"},{"en":"insufficient evidence","zh":"证据不足","m":"证据不够支持结论"},{"en":"capture","zh":"准确表达","m":"抓住要点"},{"en":"unwise","zh":"不明智的","m":"不聪明但不一定不道德"},{"en":"morally wrong","zh":"道德上错误","m":"违反道德义务"}]},
"soc-L3-evidentialism":{"name":"证据主义","one":"Clifford：任何人、任何时候，证据不足而相信任何事，都是道德上错的。","pts":["证据主义（evidentialism）：信念须符合证据","这里的 wrong 是道德意义，不只是不明智","论证：P1 有不伤害他人的义务；P2 证据不足地信总会伤人","P2 太强，是 James 的攻击点"],"ex":"船主案、愤怒暴民、Pizzagate 都是 Clifford 用来支持原则的例子。","trap":"把道德上的错弱化为“不明智”；也没说多少证据才算足够。","ana":"Clifford 像一位严格的法官：证据不够就定罪是错的，同样，证据不够就相信也是道德上的错。","words":[{"en":"always, everywhere, for anyone","zh":"任何时候、任何地方、任何人","m":"原则毫无例外"},{"en":"duty","zh":"义务","m":"道德上必须做的事"},{"en":"harm","zh":"伤害","m":"对他人造成损害"},{"en":"proportioned to evidence","zh":"与证据相称","m":"信多强看证据多强"},{"en":"private / trivial","zh":"私人的 / 琐碎的","m":"只关自己 / 无关紧要"}]},
"soc-L3-shipowner":{"name":"船主案例","one":"船主压下对旧船的怀疑，真诚相信船安全；船沉，他有罪。","pts":["真诚不能代替证据","即使船平安到达，他仍有罪","评价的是信念依据，不是结果"],"ex":"类比酒驾平安到家：好结果不能洗白不负责任的做法。","trap":"以为没人受伤或信念碰巧为真，船主就无罪。","ana":"像厨师明知食材可能变质，却说服自己“应该没事”就上菜：就算没人吃坏肚子，做法也已经错了。","words":[{"en":"shipowner","zh":"船主","m":"拥有船的人"},{"en":"guilty","zh":"有罪的","m":"应受谴责"},{"en":"no right to believe","zh":"无权相信","m":"没资格这样信"},{"en":"turned out true","zh":"结果为真","m":"事后证明是对的"},{"en":"arrived safely","zh":"平安到达","m":"船没沉"}]},
"soc-L3-four-replies":{"name":"Clifford 四个回应","one":"反驳“只有行动才会有错”：信念致行动、影响行为、会传播、成坏习惯。","pts":["信念导致行动","每个信念都影响之后的行为","信念不是私人的，会传给别人","轻信形成坏习惯，破坏集体求真"],"ex":"Pizzagate：无证据说法在网上传播，最终有人持枪闯进披萨店。","trap":"“信念能自由选择”是 James 意志主义的方向，不是 Clifford 的回应。","ana":"在群里随口说“那家店用地沟油”：你没做什么，但别人信了、转发了、不去了，“只是想想”也会伤人。","words":[{"en":"objection","zh":"反对意见","m":"对某观点的质疑"},{"en":"communicated","zh":"被传达","m":"传给别人"},{"en":"careless believing","zh":"轻率地相信","m":"不核实就信"},{"en":"habit","zh":"习惯","m":"反复形成的倾向"},{"en":"collective truth-seeking","zh":"集体求真","m":"社会一起寻找真相"},{"en":"freely chosen","zh":"自由选择的","m":"想信就能信"}]},
"soc-L3-voluntarism":{"name":"意志主义（James）","one":"James：对活的、被迫的、重大的且证据定不了的选项，可以合理选择相信。","pts":["意志主义（voluntarism）出自《信仰的意志》","四个条件：活的、被迫的、重大的、证据无法决定","不是想信什么就信什么：不能信 2+2=5"],"ex":"恋爱中的自信、跳过裂缝、相信自己能读完大学。","trap":"以为 James 允许随意相信；证据能决定的问题他也要看证据。","ana":"像决定要不要相信一个新朋友：证据还不够，但你必须表态，James 认为这时可以合理地选择去相信。","words":[{"en":"genuine option","zh":"真正的选项","m":"活、被迫、重大的选择"},{"en":"risk","zh":"风险","m":"可能出错的代价"},{"en":"willing to take","zh":"愿意承担","m":"主动接受"},{"en":"The Will to Believe","zh":"《信仰的意志》","m":"James 的文章"}]},
"soc-L3-live":{"name":"活的选项","one":"活的选项（live option）：每个选择对当事人都是心理上真可能接受的。","pts":["活不代表正确，只代表你真会考虑","因人而异：对你活的，对别人可能不活"],"ex":"要不要上大学：你能真实想象两种选择。","trap":"把“活的”理解为“重要的”；重要是另一个条件。","ana":"对你来说“读研还是工作”是活的选项；“去当火星国王”就不是，因为你根本不会真考虑。","words":[{"en":"live","zh":"活的","m":"你真可能选它"},{"en":"forced","zh":"被迫的","m":"必须选一个"},{"en":"momentous","zh":"重大的","m":"影响人生"},{"en":"herb bread","zh":"香草面包","m":"Subway 的一种面包"}]},
"soc-L3-forced":{"name":"被迫选项","one":"被迫选项（forced option）：必须选、无法永远悬置，不选也等于选了一边。","pts":["拖延本身就是一种选择","被迫不等于重大：选面包也是被迫的"],"ex":"上不上大学：一直拖着不决定，就等于选了“不去”。","trap":"以为不做决定就能避开选择。","ana":"朋友问“今晚聚餐去不去？”你说“再看看”拖到饭点，实际就等于选了“不去”。","words":[{"en":"putting it off","zh":"拖延","m":"推迟做决定"},{"en":"failing to choose","zh":"没做选择","m":"不表态"},{"en":"effectively amounts to","zh":"实际上等于","m":"效果相同"},{"en":"settles the question","zh":"解决问题","m":"决定了答案"}]},
"soc-L3-momentous":{"name":"重大选项","one":"重大选项（momentous option）：选择会给人生带来重大、常不可逆的影响。","pts":["机会通常独特，错过难再来","口诀：能选（活）、得选（被迫）、很重要（重大）"],"ex":"是否结婚、是否参加北极探险、是否读完大学。","trap":"选面包是活的且被迫的，但不重大。","ana":"午饭吃面还是吃饭不重大；接不接一份要搬去国外的工作，才是会改变人生的重大选项。","words":[{"en":"for most people","zh":"对大多数人而言","m":"一般情况下"},{"en":"irreversible","zh":"不可逆的","m":"做了就无法撤回"}]},
"soc-L3-self-fulfilling":{"name":"自我实现信念","one":"证据不足时形成，却通过影响行为帮自己成真的信念。","pts":["James 反驳 Clifford 最直接的反例","这类信念不但无害，还可能有益","信念可能是成功的必要条件，不是充分条件"],"ex":"相信自己能跳过裂缝，就会全力起跳，更可能跳过去。","trap":"以为相信就一定成功；百米深渊信了也跳不过。","ana":"相信自己能讲好演讲，于是更敢抬头、声音更稳，结果真讲好了：信念帮自己成了真。","words":[{"en":"chasm","zh":"深渊、裂缝","m":"很宽很深的沟"},{"en":"leap","zh":"跳跃","m":"用力跳过去"},{"en":"conclusive evidence","zh":"决定性证据","m":"足以下定论的证据"},{"en":"adopted","zh":"采纳的","m":"接受下来的"},{"en":"irrational","zh":"不理性的","m":"没有道理的"},{"en":"self-fulfilling","zh":"自我实现的","m":"信念帮自己成真"}]},
"soc-L3-truth-vs-error":{"name":"追求真理 vs 避免错误","one":"James：求真与避错是两个目标；门槛越严，错误越少，但越易错过真相。","pts":["严格门槛：假信念少，漏掉的真相多","宽松门槛：真相多，错误也多","怎么权衡不完全由证据决定","Clifford 在“只避免错误”一端"],"ex":"医学检测、机器学习阈值：门槛越严，误报越少，漏报越多。","trap":"以为严格门槛能同时避免错误和漏掉真相。","ana":"像垃圾邮件过滤器：设得太严，少收垃圾但会误拦重要邮件；设得太松，重要邮件都收到但垃圾也多。","words":[{"en":"threshold","zh":"门槛、阈值","m":"多少证据才相信"},{"en":"strict","zh":"严格的","m":"要求很高"},{"en":"false belief","zh":"假信念","m":"内容为假的信念"},{"en":"missing truths","zh":"错过真相","m":"该信的真东西没信"},{"en":"entirely","zh":"完全地","m":"百分之百"}]},
"soc-L3-reductio":{"name":"James 的归谬","one":"Clifford 原则须先于证据被接受，本身无充分证据，按自身标准自我削弱。","pts":["归谬（reductio）：假设 P，推出矛盾，所以非 P","原则规定如何评价证据，所以先于证据","教授批评：James 没回应 P1 不伤害他人的义务","两人某种程度上各说各话"],"ex":"Clifford 在证据不足时相信“不能在证据不足时相信”，自己违反了自己。","trap":"以为教授批评的是归谬无效；他批评的是没回应 P1。","ana":"像有人宣布“不要相信任何没写在合同里的规则”，可这条规则本身并没写在合同里。","words":[{"en":"reductio","zh":"归谬法","m":"由假设推出矛盾来否定它"},{"en":"prior to","zh":"在……之前","m":"先于"},{"en":"weighing evidence","zh":"权衡证据","m":"评价证据的分量"},{"en":"by its own standard","zh":"按它自己的标准","m":"用它自己的要求衡量"},{"en":"overwhelming","zh":"压倒性的","m":"极其充分的"},{"en":"criticism","zh":"批评","m":"指出不足"},{"en":"logically invalid","zh":"逻辑上无效","m":"推理结构有问题"}]},
"soc-L5-testimony":{"name":"证言","one":"证言（testimony）：广义指别人告诉我们的一切，我们大多数知识靠它。","pts":["包括口头、书、照片、新闻、纪录片、社交媒体、历史记录","不只是法庭证词","不可缺少但不稳定：人会说谎、记错、误解"],"ex":"没去过 Brazil 却知道首都；家人讲你小时候的事。","trap":"把证言理解为只有法庭宣誓证词或专家报告。","ana":"你知道自己的生日，其实是爸妈和出生证明告诉你的：你当时并不记得，这就是靠证言知道。","words":[{"en":"broad sense","zh":"广义","m":"范围最宽的意思"},{"en":"sworn statement","zh":"宣誓证词","m":"在法庭发誓后说的话"},{"en":"court of law","zh":"法庭","m":"审案的地方"},{"en":"certified","zh":"经认证的","m":"有正式资格的"},{"en":"documentary","zh":"纪录片","m":"记录真实事件的影片"}]},
"soc-L5-autonomy":{"name":"思想自主","one":"思想自主（intellectual autonomy）：凭自己的理性和证据形成信念。","pts":["启蒙（Kant 式）理想，有平等意义","Hardwig：各领域都彻底自主反而更无知","现实的自主：谨慎决定何时信、信谁"],"ex":"Hardwig 的微积分例：没人应先自己从零发明 calculus 才肯相信它。","trap":"以为自主就是什么都亲自验证。","ana":"像坚持“什么都要自己算一遍再信”的学生：听着独立，但这样能学到的东西反而很少。","words":[{"en":"epistemic autonomy","zh":"认识自主","m":"独立形成信念"},{"en":"reinvent","zh":"重新发明","m":"从头再造一遍"},{"en":"calculus","zh":"微积分","m":"一门数学"},{"en":"from scratch","zh":"从零开始","m":"不借助已有成果"},{"en":"less informed","zh":"知道得更少","m":"信息更少"},{"en":"domain","zh":"领域","m":"某个专业范围"}]},
"soc-L5-dependence":{"name":"认识论依赖","one":"Hardwig：B 可因所认可的专家 A 相信 P 而有辩护，即使没有 A 的证据。","pts":["认识论依赖（epistemic dependence）：信念依赖他人","证言能传递辩护，但不传递底层证据","不意味着专家永远对","不要求自己验证每个专家主张"],"ex":"病理医生 → 医生 → 病人：病人没看切片、看不懂报告，但有辩护相信肿块不是癌。","trap":"以为证言把底层证据也传给了病人。","ana":"飞行员说前方有气流请系好安全带，你看不懂仪表，但因为信任飞行员，你有理由照做。","words":[{"en":"layperson","zh":"外行","m":"非专家的普通人"},{"en":"recognised expert","zh":"被承认的专家","m":"你认可的相关专家"},{"en":"possess","zh":"拥有","m":"手里有"},{"en":"pathologist","zh":"病理医生","m":"看切片做诊断的医生"},{"en":"transmit","zh":"传递","m":"从一人传给另一人"},{"en":"underlying evidence","zh":"底层证据","m":"最原始的数据和观察"},{"en":"diagnosis","zh":"诊断","m":"医生对病情的判断"},{"en":"verify","zh":"核实","m":"自己检查是否属实"}]},
"soc-L5-expert":{"name":"专家","one":"专家：在某领域有客观能力，能处理非专家处理不了的证据；不是头衔。","pts":["能力来自训练、经验、工具","不只靠学位，也有本土知识、实践经验","头衔好听不等于专家"],"ex":"医生、科学家、电工、技工都可以是专家；“量子心态营养教练”头衔不算数。","trap":"以为有正式学位或头衔就是专家。","ana":"修车师傅一听发动机声音就知道哪里坏了：这是训练和经验得来的能力，不是名片上的头衔。","words":[{"en":"expertise","zh":"专业能力","m":"专家具备的知识技能"},{"en":"competence","zh":"能力","m":"能做好某事的本领"},{"en":"always right","zh":"永远正确","m":"从不出错"}]},
"soc-L5-deference":{"name":"理性服从","one":"理性服从（rational deference）：因专业能力差距而非地位接受专家判断。","pts":["承认对方是相关专家后，通常应认真接受其判断","专家判断最终要连到证据","仍可提问、要第二意见，不是盲从（blind obedience）"],"ex":"合格电工说线路有火灾风险，你不能因修理贵就把自己的直觉看得和他一样重。","trap":"把理性服从当成因地位服从，或以为不许提问。","ana":"导航说前方封路要绕行，你虽然觉得直走更近，但它掌握实时路况，就该认真听它的。","words":[{"en":"deference","zh":"服从、遵从","m":"接受他人判断"},{"en":"blind obedience","zh":"盲从","m":"不问理由地服从"},{"en":"social status","zh":"社会地位","m":"身份高低"},{"en":"second opinion","zh":"第二意见","m":"再问另一位专家"},{"en":"judgement","zh":"判断","m":"对事情下的结论"},{"en":"forbid","zh":"禁止","m":"不允许"}]},
"soc-L5-chain":{"name":"证言链","one":"证言链：辩护可经多人逐层传递，但链条最终必须落在真实证据上。","pts":["链可以很长，但不能悬空","源头没证据，整条链的辩护都崩溃","很多人重复 P 不等于 P 有证据"],"ex":"若病理医生没检查样本、随便填结果，医生和病人的辩护都一起崩塌。","trap":"以为链越长、转述的人越多，辩护越强。","ana":"像传话游戏：消息可以传过很多人，但第一个人必须真的看到过，否则后面传的都是空中楼阁。","words":[{"en":"chain of justification","zh":"辩护链","m":"辩护一层层传下去"},{"en":"collapse","zh":"崩溃","m":"整体失效"},{"en":"terminate in","zh":"终止于","m":"最终落在"},{"en":"genuine","zh":"真实的","m":"不是假的"},{"en":"sample","zh":"样本","m":"拿来检验的组织"},{"en":"at random","zh":"随便地","m":"没根据地乱填"},{"en":"authority","zh":"权威","m":"地位带来的影响力"}]},
"soc-L5-individualism":{"name":"认识论个人主义","one":"认识论个人主义（epistemic individualism）：个人是首要知识主体。","pts":["Hardwig 挑战它：知识依赖他人","大型科学合作中可能没人能独立解释全部","“团队知道吗？”是开放问题"],"ex":"天文学大合作：激光、望远镜、统计专家各懂一部分，没有一人能从头讲到尾。","trap":"把这个例子当成在挑战事实性或证据主义。","ana":"像把知识看成每人各自的存折：每人只能用自己存进去的证据，不把小组当成“知道者”。","words":[{"en":"collaboration","zh":"合作","m":"多人一起做研究"},{"en":"astronomy","zh":"天文学","m":"研究天体的科学"},{"en":"from start to finish","zh":"从头到尾","m":"完整地"},{"en":"challenge","zh":"挑战、质疑","m":"对观点构成问题"},{"en":"existence","zh":"存在","m":"有没有"}]},
"soc-L5-identify-experts":{"name":"识别专家的难题","one":"外行无法直接检验专家，只能靠认证、记录等指标，而这些又依赖证言。","pts":["指标：资格认证、过往记录、制度支持（Goldman）","网上好评也是证言，要信它是真人写的","AI 能流畅又自信地出错，使流畅与专业脱钩"],"ex":"生成式 AI 在完全错误时也能用专业词汇、自信语气回答。","trap":"把表达流畅、术语多、语气自信当成专家的标志。","ana":"你不懂法律，就很难判断哪个律师真厉害，只能看执照、胜诉记录和别人推荐，而这些也是别人告诉你的。","words":[{"en":"generative AI","zh":"生成式人工智能","m":"能生成文字图片的 AI"},{"en":"fluent","zh":"流畅的","m":"说得顺、像内行"},{"en":"fluency","zh":"流畅性","m":"表达顺畅"},{"en":"confident","zh":"自信的","m":"语气很肯定"},{"en":"track record","zh":"过往记录","m":"以前做得好不好"},{"en":"certification","zh":"资格认证","m":"正式的资格证明"},{"en":"abolish","zh":"废除","m":"取消"}]},

"soc-L7-attention":{"name":"注意","one":"注意（attention）：让部分信息更显著、被加工，其余信息被处理不足。","pts":["注意必然是选择性的，本身不是坏事","问题在于选择是否系统性偏离真相","偏差（bias）= 系统性偏离真相"],"ex":"听到脚步声就转向声音方向，忽略屏幕另一侧队友的标记。","trap":"以为漏看说明视力差或粗心。","ana":"注意力像舞台上的追光灯：照到的演员看得一清二楚，没照到的人虽然也在台上，却几乎被忽略。","words":[{"en":"lecture theatre","zh":"阶梯教室","m":"大讲堂"},{"en":"salient","zh":"显著的","m":"很突出、引人注意"},{"en":"suppress","zh":"压制","m":"让其不被加工"},{"en":"task-relevant","zh":"与任务相关的","m":"对当前任务有用的"},{"en":"focal attention","zh":"焦点注意","m":"集中在目标上的注意"}]},
"soc-L7-endo-exo":{"name":"内源性 vs 外源性注意","one":"内源注意由自己的目标主动定向；外源注意被显著外部刺激抓走。","pts":["内源（endogenous）：我决定看什么","外源（exogenous）：响、亮、突然的刺激抓走注意","媒体和广告利用外源注意（注意力武器化）"],"ex":"主动读 tutorial 题目是内源；火警响起所有人转向出口是外源。","trap":"以为外源注意更准确；它只是更难抗拒。","ana":"你在书店主动找某本书是内源注意；突然有人打翻书架、你忍不住回头，是外源注意。","words":[{"en":"endogenous","zh":"内源的","m":"由自身目标引导"},{"en":"exogenous","zh":"外源的","m":"由外界刺激引起"},{"en":"fire alarm","zh":"火警警报","m":"着火时响的铃"},{"en":"exits","zh":"出口","m":"离开的门"}]},
"soc-L7-selective":{"name":"选择性注意","one":"专注目标任务会让显眼但无关的信息“看不见”（看不见的大猩猩）。","pts":["专注提高目标表现，压制其他信息","眼睛看着不等于信息被加工","目击者可能真诚、自信却说法冲突"],"ex":"数白衣球员传球次数时，很多人没看到穿大猩猩服的人走过。","trap":"把漏看归因于视力差、撒谎或大猩猩不可见。","ana":"在人群里专心找穿红衣服的朋友时，你可能完全没注意到身边路过了一位明星。","words":[{"en":"gorilla suit","zh":"大猩猩服装","m":"实验里的人穿的衣服"},{"en":"fail to notice","zh":"没注意到","m":"看漏了"},{"en":"eyesight","zh":"视力","m":"眼睛看东西的能力"},{"en":"deliberately","zh":"故意地","m":"有意这样做"},{"en":"basketball passes","zh":"篮球传球","m":"球员之间传球"}]},
"soc-L7-selection-bias":{"name":"选择偏差","one":"选择偏差（selection bias）：入样机制与研究特征系统性相关，样本偏离总体。","pts":["样本再大也修不好系统性筛选","措辞诱导（push polling）是测量问题，不是选择偏差","回答不实（测量误差）也不是选择偏差","有效推理 + 筛选坏的数据 → 仍可能得假结论"],"ex":"Eagles 球迷节目问“最好的 3-0 球队”，96% 选 Eagles。","trap":"把措辞诱导、谎报等坏数据都叫选择偏差。","ana":"在健身房门口问人“你多久运动一次”，得出“大家都常运动”：被问到的本来就是爱运动的人。","words":[{"en":"pollster","zh":"民调员","m":"做民意调查的人"},{"en":"push polling","zh":"诱导式民调","m":"用措辞操纵回答"},{"en":"wording","zh":"措辞","m":"问题怎么写"},{"en":"distorted","zh":"被扭曲的","m":"结果不准"},{"en":"cover up a crime","zh":"掩盖罪行","m":"隐瞒犯罪"},{"en":"over-/under-reporting","zh":"多报/少报","m":"回答高于或低于实际"},{"en":"measurement error","zh":"测量误差","m":"数据本身记录不准"},{"en":"respondent","zh":"受访者","m":"回答调查的人"}]},
"soc-L7-representative":{"name":"代表性样本","one":"代表性样本：入样与被估计的特征无系统关联，样本在相关方面像总体。","pts":["随机性是相对研究问题而言的","同一抽样方法对一个问题无偏，对另一个可能有偏","完全随机抽样仍可能被措辞诱导扭曲"],"ex":"电话簿按姓氏抽样，对投票意向通常无偏；若姓氏反映族群、族群又影响投票，就有偏。","trap":"以为抽样随机，结果就一定可信。","ana":"尝一锅汤要先搅匀再舀一勺，这勺才能代表整锅；只舀表面的油，就不代表整锅的味道。","words":[{"en":"random sample","zh":"随机样本","m":"每人入样机会相同"},{"en":"representative","zh":"有代表性的","m":"能反映总体"},{"en":"population","zh":"总体","m":"想研究的全部对象"},{"en":"voter","zh":"选民","m":"有投票权的人"}]},
"soc-L7-self-selection":{"name":"自我选择","one":"自我选择（self-selection）：自己决定是否参与，参与者与其余人系统性不同。","pts":["参与者常是最有动机或最极端的人","会把“谁参与”的差异误当成项目效果","随机分配可以排除这种差异"],"ex":"健康项目：自愿参加的员工本来更健康，所以看起来参加者更健康。","trap":"把“健康导致参与”误读成“项目导致健康”。","ana":"老师问“谁觉得作业太多请举手”，主动举手的多是特别不满的同学，安静的大多数没被统计到。","words":[{"en":"voluntarily","zh":"自愿地","m":"自己主动"},{"en":"participate","zh":"参加","m":"加入项目"},{"en":"programme","zh":"项目","m":"一套安排好的活动"},{"en":"significant effect","zh":"显著效果","m":"统计上可信的效果"},{"en":"control group","zh":"对照组","m":"不接受项目的那组"},{"en":"causal reversal","zh":"因果倒置","m":"把果当成因"}]},
"soc-L7-survivorship":{"name":"幸存者偏差","one":"幸存者偏差（survivorship bias）：只看通过筛选后可见的案例，忽视被淘汰的。","pts":["缺失不随机时，缺失本身就是信息","核心问题：要通过什么筛选才能进入数据？","例：现任教练、幸存基金、化石偏向硬组织"],"ex":"Wald：返航轰炸机发动机弹孔少，该给发动机加装甲，那里中弹的飞机回不来。","trap":"直接给弹孔最多的部位加装甲。","ana":"看到街上的老房子都很结实，就以为“以前的房子质量更好”，却忘了建得差的老房子早就被拆了。","words":[{"en":"bullet holes","zh":"弹孔","m":"子弹打出的洞"},{"en":"bomber","zh":"轰炸机","m":"投炸弹的飞机"},{"en":"fuselage","zh":"机身","m":"飞机主体"},{"en":"armour","zh":"装甲","m":"加装防护钢板"},{"en":"concentrated","zh":"集中的","m":"聚在某处"},{"en":"engine","zh":"发动机","m":"提供动力的部件"},{"en":"military analyst","zh":"军事分析员","m":"研究军事数据的人"}]},
"soc-L7-friendship":{"name":"友谊悖论","one":"友谊悖论：多数人的朋友比自己朋友多，因为朋友多的人在更多人的朋友名单里。","pts":["随机抽“一个人”≠随机抽“某人的朋友”","沿友谊抽样会过度代表高连接者","右偏分布 + 富者愈富（preferential attachment）"],"ex":"社交达人出现在几乎每个人的好友列表里，拉高了“朋友的朋友数”平均值。","trap":"以为是大家低估自己的朋友，或友谊不对称。","ana":"班里的“社交达人”出现在几乎每个人的好友列表里，所以你的朋友们平均下来，朋友数总比你多。","words":[{"en":"highly connected","zh":"高连接的","m":"朋友特别多的"},{"en":"friend list","zh":"好友列表","m":"某人的朋友名单"},{"en":"over-represent","zh":"过度代表","m":"在样本中占比偏高"},{"en":"symmetric","zh":"对称的","m":"双向相同"},{"en":"underestimate","zh":"低估","m":"估得比实际少"}]},
"soc-L7-unit":{"name":"分析单位","one":"按不同单位计数（班级 vs 学生）会得出不同但各自为真的平均数。","pts":["按班级平均：每班权重相同","按学生体验平均：大班学生多，权重大","两个数都对，回答不同问题"],"ex":"20 个 20 人班 + 4 个 200 人班：按班平均 1200/24 = 50；按学生平均 140。","trap":"以为两个平均数必有一个是错的。","ana":"餐厅说“平均每桌 3 人”，但按顾客算，多数人坐在大桌上，从顾客角度看同桌人数要多得多。","words":[{"en":"average class size","zh":"平均班级人数","m":"按班级算的平均"},{"en":"experienced by students","zh":"学生所经历的","m":"按学生算的平均"},{"en":"unit of analysis","zh":"分析单位","m":"计数的基本对象"}]},
"soc-L7-berkson":{"name":"伯克森悖论","one":"Berkson 悖论：按两项特征综合门槛筛选，会在入选群体内制造总体中没有的负相关。","pts":["被选群体内的相关可能与总体相反","入选靠 A 强或 B 强，于是群体内 A、B 此消彼长","不能由此推出一个导致另一个"],"ex":"Google 工程师中编程比赛成绩与工作表现负相关（Bergstrom & West）。","trap":"以为比赛技能真的损害工作表现。","ana":"能上热门的视频要么内容特别好、要么标题特别吸睛，于是在热门里看起来“标题越夸张内容越差”。","words":[{"en":"negatively correlated","zh":"负相关","m":"一个高另一个往往低"},{"en":"correlation","zh":"相关","m":"两个变量一起变化"},{"en":"hiring","zh":"招聘","m":"公司录用员工"},{"en":"combined abilities","zh":"综合能力","m":"多项能力加起来"},{"en":"contest","zh":"竞赛","m":"比赛"},{"en":"quit","zh":"辞职","m":"离开公司"}]},
"soc-L7-censoring":{"name":"数据删失（右删失）","one":"观察期结束时还没出现结果的案例被排除，较晚群体只剩“结果来得早”的人。","pts":["右删失（right-censoring）让新群体看起来结果更短","被排除的是还没发生结果的人，不是随机的","要问：谁还没机会进入数据？"],"ex":"说唱歌手“平均死亡年龄低”：年轻流派里还活着的人不进死亡年龄样本。","trap":"把删失造成的差异当成群体真实差异。","ana":"只统计“已经毕业”的学生算平均读书年限，还没毕业的被排除，就只剩那些读得特别快的人。","words":[]},
"soc-L7-randomization":{"name":"随机分配","one":"随机分配参与机会，使两组在期望上可比，把项目效果和自愿者原有差异分开。","pts":["只比自愿参加者与不参加者，会混入自我选择","健康项目随机试验（RCT）显示无显著效果","抽屉问题（file drawer problem）：只发表有利结果","抽样随机，公开文献仍可能被结果筛选"],"ex":"自愿参加者更健康，但随机比较无差别：更可能是健康导致参与。","trap":"以为每个研究抽样随机，发表的文献就无偏。","ana":"像抽签决定谁能免费试用健身卡，再比较两组健康，而不是比较主动办卡的人和没办卡的人。","words":[{"en":"randomised comparison","zh":"随机化比较","m":"随机分组后比较"},{"en":"invalid","zh":"无效的","m":"不成立的"},{"en":"publish","zh":"发表","m":"公开刊出研究"},{"en":"hypothesis","zh":"假设","m":"待检验的猜想"},{"en":"literature","zh":"文献","m":"已发表的研究"},{"en":"file drawer problem","zh":"抽屉问题","m":"不利结果锁进抽屉不发表"}]},
"soc-L9-three-levels":{"name":"句法、语义与语用","one":"句法管结构规则，语义管字面意义，语用管语境中超出字面传达的内容。","pts":["句法（syntax）：词怎么组合成句","语义（semantics）：词句的常规字面意义","语用（pragmatics）：在语境中暗示的意思","语用意义不等于撒谎：字面可以为真"],"ex":"问教授字迹怎样，答“他讲课很好”：字面夸讲课，语用上暗示字迹差。","trap":"把“答非所问的暗示”归到语义或逻辑。","ana":"妈妈说“你房间真干净啊”：句法是语序正确，语义是夸房间干净，语用上其实在说“快去收拾”。","words":[{"en":"referee","zh":"推荐人","m":"写推荐信的人"},{"en":"job candidate","zh":"求职者","m":"应聘的人"},{"en":"handwriting","zh":"字迹","m":"手写的字"},{"en":"inference","zh":"推断","m":"从话里推出的意思"}]},
"soc-L9-speech-act":{"name":"言语行为","one":"言语行为（speech act）：在适当身份和情境下，说话本身就完成一种社会行动。","pts":["建立新的规范事实，而不是描述世界","成功依赖制度身份与情境，排练中无效","言语行为不等于间接言语：承诺可以很直接"],"ex":"“我保证六点来接你”“我宣布你们结为夫妻”“我道歉”。","trap":"把描述世界的句子（下雨了）当成言语行为。","ana":"裁判说“你出局了”，这句话不是在描述，而是让球员真的出局；观众喊同一句话就没有这个效力。","words":[{"en":"utterance","zh":"话语","m":"说出的一句话"},{"en":"promise","zh":"承诺","m":"答应做某事"},{"en":"performing a marriage","zh":"主持婚礼","m":"宣布两人结婚"},{"en":"swan","zh":"天鹅","m":"一种鸟"}]},
"soc-L9-focal-point":{"name":"焦点（谢林点）","one":"焦点（focal point）：人人预计别人也觉得显著的选项，使无沟通的协调成为可能。","pts":["不必是客观最好或最公平的","显著性依群体经验而变","多个焦点竞争时协调可能失败"],"ex":"不讨论，选一门大家都会选的 ANU 课：都选 PHIL1005，因为大家此刻都在这门课。","trap":"以为焦点就是客观最好的选项。","ana":"和朋友在商场走散、手机没电，你们都会去正门口等：不是那里最好，而是都觉得对方也会去。","words":[{"en":"salient","zh":"显著的","m":"特别突出"},{"en":"without discussion","zh":"不经商量","m":"互相不沟通"},{"en":"objectively","zh":"客观上","m":"不依个人看法"},{"en":"explicit assertion","zh":"明确断言","m":"直接说出口的主张"}]},
"soc-L9-common-knowledge":{"name":"共同知识","one":"共同知识（common knowledge）：都知道 p，且都知道对方知道，如此无限递归。","pts":["都知道 p（共享知识 shared knowledge）≠共同知识","直接说出口能制造共同知识","共同知识让集体协调行动成为可能"],"ex":"皇帝的新衣：男孩喊出后，大家并非第一次看见，而是人人知道人人都知道。","trap":"以为男孩让旁观者第一次看见了真相。","ana":"班长在全班宣布“明天放假”，大家不只都知道，还都知道别人也知道；私下一个个告诉则不是。","words":[{"en":"onlookers","zh":"旁观者","m":"在旁边看的人"},{"en":"emperor","zh":"皇帝","m":"故事里的国王"},{"en":"naked","zh":"赤裸的","m":"没穿衣服"},{"en":"mutual understanding","zh":"相互理解","m":"双方都明白"},{"en":"proposal","zh":"提议","m":"提出的请求"}]},
"soc-L9-common-ground":{"name":"共同基础","one":"共同基础（common ground）：对话者已公开承诺、之后可共同依赖的内容。","pts":["通常由明确断言加入","双方都确信说话人意指 p ≠ p 已进入共同基础","暗示让 p 留在边缘，失败后可当没发生"],"ex":"委婉邀请被拒，双方都懂意思，但 p 没被公开摆上台面，可以照常相处。","trap":"以为双方都懂了，p 就已在共同基础里。","ana":"像会议纪要：明确说出并记进纪要的内容，之后大家都能引用；只在走廊里暗示的，就没进纪要。","words":[{"en":"publicly placed","zh":"被公开摆上台面","m":"正式说出来"},{"en":"carry on","zh":"继续","m":"照常进行"},{"en":"turned down","zh":"被拒绝","m":"对方说不"},{"en":"fairly sure","zh":"相当确定","m":"很有把握"}]},
"soc-L9-indirect-speech":{"name":"间接言语","one":"间接言语（indirect speech）：传达 p 却不断言 p，p 被理解但不进共同基础。","pts":["核心不是没人懂，而是意图没被公开、可引用地说出","三大功能：可否认性、关系管理、战略模糊","Pinker, Nowak & Lee 的分析"],"ex":"含蓄贿赂、委婉约看电影、隐蔽威胁；重伤者说“没人开枪打我”。","trap":"以为间接言语有效是因为听者听不懂。","ana":"想让客人离开却说“哎呀都这么晚了”，对方能听懂，但你并没正式说出“请你走”。","words":[{"en":"veiled","zh":"含蓄的","m":"遮遮掩掩的"},{"en":"indirect invitation","zh":"委婉邀请","m":"不直说的邀请"},{"en":"function","zh":"功能","m":"起的作用"},{"en":"hint","zh":"暗示","m":"不明说的提示"}]},
"soc-L9-deniability":{"name":"可信的可否认性","one":"可信的可否认性（plausible deniability）：存在足以免责的无辜解释。","pts":["合作的听者可接受暗示，敌对的难以惩罚","诚实警察完全听懂也无妨：懂≠有足够证据行动","来自举证门槛：d_c < d < d_h","暗示固化成习语后就失去可否认性"],"ex":"司机暗示行贿：腐败警察能接（超过 d_c），诚实警察难据此处罚（低于 d_h）。","trap":"以为可否认性靠听者听不懂；那是秘密代码。","ana":"你说“这门课期末好像挺难的”暗示想抄作业，对方不满，你可以说“我只是聊聊考试而已”。","words":[{"en":"bribe","zh":"贿赂","m":"给好处换取违规帮助"},{"en":"police officer","zh":"警察","m":"执法人员"},{"en":"interpretation","zh":"解释、理解","m":"对话语的读法"},{"en":"innocent","zh":"无辜的","m":"没有坏意思的"},{"en":"secret code","zh":"暗号","m":"只有圈内人懂"},{"en":"conventionalised","zh":"约定俗成的","m":"变成固定说法"},{"en":"idiom","zh":"习语","m":"固定的说法"},{"en":"legal","zh":"合法的","m":"法律允许的"}]},
"soc-L9-relationship":{"name":"关系管理","one":"关系管理：用间接表达试探关系变化，被拒时仍可维持原关系。","pts":["降低失败的尴尬成本","Pinker 三种关系：支配、共享、互惠","暗示太隐晦会失败：对方按字面理解"],"ex":"“要不要上来看个电影？”对方有意就领会；无意就真的只看电影，友谊照旧。","trap":"把委婉邀请的功能说成防法律惩罚或制造共同知识。","ana":"问同事“周末有空一起去看展吗？”被婉拒也不尴尬，因为表面上只是约看展，同事关系照旧。","words":[{"en":"romantic proposal","zh":"恋爱示好","m":"表达想交往"},{"en":"declined","zh":"被拒绝","m":"对方不接受"},{"en":"preserved","zh":"被保住","m":"维持原样"},{"en":"existing friendship","zh":"现有友谊","m":"原来的朋友关系"},{"en":"legal punishment","zh":"法律惩罚","m":"被法律处罚"}]},
"soc-L9-strategic-ambiguity":{"name":"战略模糊","one":"战略模糊（strategic ambiguity）：故意含糊，让不同受众读出不同信息。","pts":["隐含内容不进共同基础","字面赞美 + 不断累积的反证 + 重复 → 反讽","模糊有代价：可能被误解"],"ex":"Antony 反复称 Brutus “an honourable man”，同时列举 Caesar 的善举，听众读出谴责。","trap":"以为 Antony 直接断言了 Brutus 不光彩。","ana":"公司公告说“我们正在优化团队结构”，员工读出可能裁员，投资人读出提效，公司却没明确说任何一种。","words":[{"en":"honourable","zh":"正直可敬的","m":"值得尊敬的"},{"en":"condemn","zh":"谴责","m":"严厉批评"},{"en":"ironic","zh":"反讽的","m":"字面与本意相反"},{"en":"mounting contrary evidence","zh":"不断累积的反证","m":"越来越多相反的证据"},{"en":"literal","zh":"字面的","m":"按字面意思"},{"en":"repetition","zh":"重复","m":"一遍遍说"},{"en":"audience","zh":"听众","m":"听话的人"}]},
"soc-L11-bibliotechnic":{"name":"图书馆技术假说","one":"图书馆技术假说（bibliotechnic hypothesis）：LLM 是信息检索系统，不是思考者。","pts":["压缩、检索、重组、外推人类文本模式","能处理新组合，不只是逐字复制","教授倾向此说，但称为暂定答案（tentative）","证据：幻觉、依赖熟悉形式、二十问分支"],"ex":"Borges 巴别图书馆：拥有所有书≠理解它们；Ted Chiang：ChatGPT 是网络的“模糊 JPEG”。","trap":"把教授立场当成定论或“LLM 不能思考”的证明。","ana":"LLM 像读过整座图书馆的超级检索员，能把书里的片段拼成新回答，但这不意味着它真的在思考。","words":[{"en":"stance","zh":"立场","m":"所持的观点"},{"en":"tentative","zh":"暂定的","m":"不是最终结论"},{"en":"settled","zh":"已有定论的","m":"不再有争议"},{"en":"agnosticism","zh":"不可知论","m":"不表态是否"},{"en":"information retrieval","zh":"信息检索","m":"查找调取已有信息"},{"en":"cognition","zh":"认知","m":"思考、理解的过程"},{"en":"statistical","zh":"统计的","m":"基于概率规律的"},{"en":"LLM","zh":"大语言模型","m":"如 ChatGPT"}]},
"soc-L11-next-token":{"name":"下一 token 预测","one":"按 Pr(下一 token | 前文) 选 token，加到前文末尾，循环生成。","pts":["token 不严格等于词","Markov 生成器只看固定长度前文","窗口加长：表约按 n^(k+1) 指数增长，数据稀疏","训练后更新权重≠聊天时把文字放进上下文"],"ex":"手机自动补全 “Do you want anything from the …” → shops。","trap":"以为把 Markov 窗口加长就行；表会爆炸、数据填不满。","ana":"像接龙写句子：每次只看前面写了什么，猜最可能的下一个字写上，再接着猜下一个，直到写完。","words":[{"en":"next-token prediction","zh":"下一 token 预测","m":"猜下一个文字单位"},{"en":"Markov generator","zh":"马尔可夫生成器","m":"只看前 k 个词猜下一个"},{"en":"context window","zh":"上下文窗口","m":"模型能看到的前文长度"},{"en":"exponentially","zh":"指数级地","m":"成倍成倍地增长"},{"en":"entries","zh":"条目","m":"表格里的一项"},{"en":"training data","zh":"训练数据","m":"模型学习用的文本"},{"en":"long-range dependencies","zh":"长程依赖","m":"前后相隔很远的联系"},{"en":"grammatical accuracy","zh":"语法准确度","m":"句子是否合语法"}]},
"soc-L11-redescription":{"name":"重描述谬误","one":"重描述谬误（redescription fallacy）：因可用低层机制描述就否认高层能力。","pts":["“只是统计/线性代数”不足以证明不能思考","需要额外论证说明该机制为何不能承载认知","指出谬误不等于证明 LLM 会思考"],"ex":"Rick and Morty：“爱只是化学反应”并不证明爱不存在。","trap":"把这种推理当成“LLM 不思考”的可靠证明。","ana":"说“音乐只是空气振动，所以没有美”是错的推理：能用低层方式描述，不证明高层特性不存在。","words":[{"en":"linear algebra","zh":"线性代数","m":"矩阵运算的数学"},{"en":"mechanistic description","zh":"机制性描述","m":"讲内部怎么运作"},{"en":"low-level / high-level","zh":"低层 / 高层","m":"零件层面 / 整体能力层面"},{"en":"capacity","zh":"能力","m":"能做到的事"},{"en":"rule out","zh":"排除","m":"证明不可能"},{"en":"fallacy","zh":"谬误","m":"推理错误"}]},
"soc-L11-hallucination":{"name":"幻觉","one":"幻觉（hallucination）：看起来合理、像答案，却缺乏事实支持的生成内容。","pts":["文本合理性（textual plausibility）≠ 真","高文本概率不保证命题为真","会犯错本身不能单独证明不会思考"],"ex":"问“亚洲最高的公共厕所”，模型给出 North Col 一类答案；虚构却格式完美的参考文献。","trap":"以为幻觉是因为缺训练数据或每次聊天都在学新事实。","ana":"像一个不懂装懂、口才极好的同学，被问到不会的题也能说得头头是道，其实是编的。","words":[{"en":"textual plausibility","zh":"文本合理性","m":"读起来像真的"},{"en":"public toilet","zh":"公共厕所","m":"公用卫生间"},{"en":"rare events","zh":"罕见事件","m":"很少发生的事"},{"en":"learn new facts","zh":"学习新事实","m":"记住新信息"}]},
"soc-L11-twenty-questions":{"name":"二十问论证","one":"从同一处重新采样，模型会走向不同对象：它只保持与前文一致，并无固定目标。","pts":["人类玩法：先把答案写在纸上再回答","模型：沿已有回答找仍说得通的对象","对话连贯≠有固定意图","支持图书馆技术假说的论据，不是演绎证明"],"ex":"Shanahan 等：重采样同一局二十问，模型“心里想的”东西每次不同。","trap":"以为这说明模型在故意说谎。","ana":"像一个玩猜谜却没先想好答案的人：只要回答和之前不矛盾就行，重来一次可能“想的”是别的东西。","words":[{"en":"resampling","zh":"重新采样","m":"从同一处再生成一次"},{"en":"fixed target","zh":"固定目标","m":"事先定好的答案"},{"en":"have in mind","zh":"心里想着","m":"脑中有某个对象"},{"en":"consistent with","zh":"与……一致","m":"不矛盾"},{"en":"dialogue so far","zh":"目前为止的对话","m":"已经说过的内容"}]},
"soc-L11-testimony":{"name":"LLM 与证言","one":"LLM 是否思考，与能否从它获得知识是两个问题。","pts":["不思考的系统（如书）也能传递信息","关键：主张能否追溯来源、能否检验","LLM 输出模糊了谁是证言者、谁负责","连回 L5：流畅性会伪装专业能力"],"ex":"课本没有意识，读者仍能从中学到东西。","trap":"以为 LLM 不思考就什么都学不到，或证言要求来源有意识。","ana":"地图不会思考，但你能靠它找到路；关键是它标的信息能不能追溯来源、能不能核对。","words":[{"en":"closing point","zh":"结尾要点","m":"讲座最后的结论"},{"en":"conscious","zh":"有意识的","m":"有主观体验"},{"en":"distinct","zh":"不同的","m":"彼此独立"},{"en":"traced","zh":"被追溯","m":"能查到来源"},{"en":"checked","zh":"被核对","m":"能验证真假"},{"en":"outputs","zh":"输出","m":"模型生成的内容"}]}
