斥事件一定不独立。","pts":["互斥：知道 A 发生，B 的概率立刻变 0，所以不独立","独立且概率为正：P(A∧B)\u003e0，能同时发生","「互不影响」说的是因果，不是独立"],"ex":"掷骰前 P(3)=1/6；得知是 2 后 P(3)=0：互斥，所以不独立。","trap":"以为互斥就「互不相干」，所以独立。","ana":"一门课“得 A”和“得 B”互斥：一旦知道你得了 A，得 B 的概率立刻变成 0——知道一个大大改变另一个，所以不独立。","words":[{"en":"positive probability","zh":"正概率","m":"概率大于 0"},{"en":"causally connected","zh":"有因果联系","m":"一个造成另一个"},{"en":"influence","zh":"影响","m":"使对方发生变化"},{"en":"occur together","zh":"同时发生","m":"一起成立"},{"en":"lower","zh":"降低","m":"使变小"},{"en":"legitimate","zh":"合理的","m":"有正当依据的"}]},"prob-L10-orrule":{"name":"加法规则（互斥时）","one":"看到「或」（OR）先查互斥：互斥直接相加，否则减去重叠。","pts":["互斥时 P(A∨B)=P(A)+P(B)","有重叠时直接加，重叠部分算了两次","加法只要互斥，不要等概率或独立"],"ex":"P(K∨红桃)=(4+13−1)/52=16/52：红桃 K 重叠，只算一次。","trap":"看到「或」就相加，不查是否重叠。","ana":"随机抽一个学生：“大一或大二” = 30% + 25%（一人只有一个年级）；但“大一或女生”不能直接加，大一女生会被算两次。","words":[{"en":"overlap","zh":"重叠","m":"有共同的情况"},{"en":"counted twice","zh":"重复计数","m":"同一情况被算了两次"},{"en":"disjunct","zh":"析取支","m":"“或”两边的每一项"},{"en":"jointly exhaustive","zh":"合起来穷尽","m":"合在一起覆盖所有情况"},{"en":"justify","zh":"说明理由","m":"写出用了哪条规则"},{"en":"loaded die","zh":"灌铅骰子","m":"各面概率不等的骰子"},{"en":"King","zh":"K 牌","m":"每种花色 1 张，共 4 张"},{"en":"variant","zh":"变式","m":"改编过的题"}]},"prob-L10-andrule":{"name":"乘法规则（独立时）","one":"看到「且」（AND）先查独立：独立才相乘，互斥的「且」是 0。","pts":["独立时 P(A∧B)=P(A)×P(B)","不独立时 P(A∧B)=P(A)×P(B|A)","不同时间、都公平，都不是相乘的理由"],"ex":"两次独立投币都正面 = 1/2×1/2=1/4；一次掷骰 P(2∧3)=0，不是 1/36。","trap":"题目给了两个概率就相乘；给了概率不等于能乘。","ana":"明天下雨 0.3、你抛硬币得正面 0.5，两者无关，可乘得 0.15；但“下雨”和“地面湿”相互关联，不能直接相乘。","words":[{"en":"conjunction","zh":"合取","m":"用“且”连起来的命题"},{"en":"occur at different times","zh":"不同时间发生","m":"一先一后发生"},{"en":"contradiction","zh":"矛盾式","m":"不可能为真的命题"},{"en":"biased die","zh":"有偏骰子","m":"各面概率不等"},{"en":"ordinary chance","zh":"原本的机会","m":"不参加赌局时的概率"},{"en":"accept / replace","zh":"接受 / 替换","m":"答应赌局 / 用它取代原机会"},{"en":"in a row","zh":"连续","m":"一次接一次"}]},"prob-L10-complement":{"name":"补集规则","one":"A 与 ¬A 互斥且穷尽（exhaustive），所以 P(¬A)=1−P(A)。","pts":["「至少一个」的补集是「一个都没有」","用差额求 P(D)：D 必须与已有部分互斥","穷尽：合起来覆盖所有情况"],"ex":"偏骰每次出 6 概率 0.3，四次至少一个 6 = 1−0.7⁴ = 1−0.2401 = 0.7599。","trap":"把「至少一个 6」算成 4×0.3=1.2：各次出 6 不互斥。","ana":"预报下雨 30%，不下雨就是 70%；抛两次硬币“至少一次正面” = 1 − 两次都反面(1/4) = 3/4。","words":[{"en":"at least one","zh":"至少一个","m":"一个或更多"},{"en":"neither","zh":"两个都不","m":"一个也没有"},{"en":"on time","zh":"准点","m":"按时到达"},{"en":"exhaust all possibilities","zh":"穷尽所有可能","m":"覆盖全部情况"},{"en":"pairwise","zh":"两两之间","m":"任取两个都满足"},{"en":"additional condition","zh":"额外条件","m":"还需要补充的条件"},{"en":"urn","zh":"罐子","m":"抽球用的容器"},{"en":"one of each colour","zh":"每种颜色各一个","m":"一红一白"}]},"prob-L10-equivalence":{"name":"逻辑等价与概率","one":"逻辑等价（equivalent）→概率相同；概率相同推不出逻辑等价。","pts":["永真式概率 1，矛盾式概率 0","(A∧B)∨(A∧¬B) ≡ A，但不是永真式","经验上极可信 ≠ 逻辑必然"],"ex":"P(A∧B)=1/3，P(A∧¬B)=1/5：两支互斥，P(A)=8/15，P(¬A)=7/15。","trap":"以为概率相同就等价：掷出 1 与掷出 2 都是 1/6，却不等价。","ana":"“不是没带伞”和“带了伞”逻辑等价，概率必然相同；但硬币“正面”“反面”概率都是 1/2，却显然不等价。","words":[{"en":"valid inference","zh":"有效推理","m":"前提真时结论必真"},{"en":"empirically certain","zh":"经验上确定","m":"按经验几乎肯定"},{"en":"contradiction","zh":"矛盾式","m":"任何情况下都为假"},{"en":"proposition","zh":"命题","m":"有真假的一句话"},{"en":"justify","zh":"说明理由","m":"写出用了哪条规则"},{"en":"cannot be determined","zh":"无法确定","m":"条件不够算不出"}]},"prob-L10-ordered":{"name":"有序 vs 无序结果","one":"题目是否指定「哪个对象得哪个结果」，决定要不要算两种顺序。","pts":["指定「骰1是3、骰2是4」：1 种，1/36","「一颗 3、另一颗 4」：2 种，2/36=1/18","「一红一白」要算先红后白 + 先白后红"],"ex":"4 红 6 白无放回抽两个，一红一白 = 4/10×6/9 + 6/10×4/9 = 48/90。","trap":"无序的问法只算一种顺序，结果少了一半。","ana":"两个孩子（男女各 1/2）：“老大男、老二女”只有 1 种，概率 1/4；“一男一女”包括男女和女男，概率 1/2。","words":[{"en":"the other","zh":"另一个","m":"两个中剩下的那个"},{"en":"show","zh":"显示（点数）","m":"骰子朝上的数"},{"en":"independently","zh":"独立地","m":"互不影响"},{"en":"at least one","zh":"至少一个","m":"一个或更多"},{"en":"without replacement","zh":"无放回","m":"抽出后不放回去"},{"en":"urn","zh":"罐子","m":"抽球用的容器"},{"en":"one of each colour","zh":"每种颜色各一个","m":"一红一白"}]},"prob-L10-replacement":{"name":"有放回 vs 无放回","one":"有放回（with replacement）各次独立；无放回会改变组成，不独立。","pts":["有放回：两次都蓝 = (3/5)² = 9/25","无放回：第二次用剩下的 2 蓝 2 绿，蓝 = 2/4","无放回两次都蓝 = 3/5×2/4 = 3/10"],"ex":"3 蓝 2 绿：有放回两蓝 0.36；无放回两蓝 0.30，第二次从 3/5 降到 1/2。","trap":"无放回时仍写 (3/5)²。","ana":"10 张签里 1 张中奖：第一人抽走一张没中、不放回，第二人中奖概率变成 1/9；放回重洗则仍是 1/10。","words":[{"en":"replace","zh":"放回","m":"抽出后放回袋中"},{"en":"draw","zh":"抽取","m":"从袋中拿出一个"},{"en":"dependent","zh":"依赖（不独立）","m":"前一次影响后一次的概率"},{"en":"equally likely","zh":"等可能","m":"每种结果概率相同"},{"en":"mutually exclusive","zh":"互斥","m":"不能同时为真"},{"en":"bag / urn","zh":"袋子 / 罐子","m":"装球的容器"}]},"prob-L10-unequal":{"name":"计数法与不等可能结果","one":"「有利数÷总数」只对等可能（equally likely）成立；否则逐个相加。","pts":["相加只要互斥，不要等概率","等可能是「数个数」的前提","偏骰各次投掷仍可以独立"],"ex":"偏骰 P(1)=1/5，其余各 4/25：P(偶)=3×4/25=12/25，不是 3/6。","trap":"把偏骰六面当成等可能，写 P(偶数)=3/6。","ana":"转盘只分“中奖/不中”两格，但中奖格只占 1/10 面积：只有两种结果，不代表各 1/2。","words":[{"en":"loaded die","zh":"灌铅骰子","m":"各面概率不等的骰子"},{"en":"favourable outcome","zh":"有利结果","m":"符合题目要求的结果"},{"en":"basic outcome","zh":"基本结果","m":"最细的单个结果"},{"en":"even / odd","zh":"偶数 / 奇数","m":"2、4、6 / 1、3、5"},{"en":"face","zh":"面","m":"骰子的一个面"},{"en":"reliable","zh":"可靠的","m":"能给出正确答案"},{"en":"finite","zh":"有限的","m":"数得完的"}]},"prob-L10-dependence":{"name":"依赖：关联与因果","one":"依赖（dependent）：知道一个会改变另一个的概率；依赖不证明因果。","pts":["依赖可来自共同偏好、抽样方式、因果等","两事件概率相等，不保证独立","依赖本身不说明谁是原因"],"ex":"设 100 人：茶咖啡都爱 50，都不爱 50；爱茶的 50 人全爱咖啡：P(C|T)=1≠1/2。","trap":"相关 ≠ 直接因果：洒水器和下雨都能让草坪湿。","ana":"冰淇淋销量高时溺水人数也多：知道一个能帮你预测另一个（依赖），但原因是共同的“天热”，不是冰淇淋导致溺水。","words":[{"en":"toy model","zh":"简化模型","m":"为说明道理编的小例子"},{"en":"entail","zh":"蕴含","m":"一个为真另一个必真"},{"en":"causal explanation","zh":"因果解释","m":"说明是什么造成的"},{"en":"sprinkler / lawn","zh":"洒水器 / 草坪","m":"浇草坪的装置 / 草地"},{"en":"enforcement list","zh":"执法名单","m":"被执法部门重点关注的名单"},{"en":"raise","zh":"提高","m":"使变大"},{"en":"Heart / Red","zh":"红桃 / 红色","m":"红桃一定是红色"}]}}},
{"cards":{"prob-L12-condprob":{"ana":"问「下雨天你带伞的比例」：先只挑出下雨的那些天当分母，再数其中带伞的天数，晴天一律不算。"},"prob-L12-direction":{"ana":"Pr(高个|篮球运动员) 很高，但 Pr(篮球运动员|高个) 很低——高个子绝大多数并不打篮球。"},"prob-L12-contingency":{"ana":"像按「男/女 × 及格/不及格」交叉的四格成绩表：格子是「女生且及格」人数，行尾、列尾合计是女生总数、及格总数。"},"prob-L12-hypopop":{"ana":"「药物让 2% 的人有副作用」不好想，就想象 1000 人中 20 人出副作用；换成 10 万人是 2000 人，比例不变。"},"prob-L12-multrule":{"ana":"全班 40% 戴眼镜，戴眼镜者中一半是女生，则「戴眼镜的女生」占全班 0.4×0.5 = 20%，不用管两者是否独立。"},"prob-L12-totalprob":{"ana":"A 线产 80% 零件、次品率 1%，B 线产 20%、次品率 5%：总次品率 = 0.8×1% + 0.2×5% = 1.8%，不是平均的 3%。"},"prob-L12-independence":{"ana":"同时抛硬币和掷骰子：知道硬币是正面，骰子出 6 的概率仍是 1/6，这条信息毫无影响，所以两者独立。"},"prob-L12-indep-vs-me":{"ana":"单选题只能选一个：知道你选了 A，就立刻知道你没选 B——互斥恰恰是最强的「相互影响」，不是独立。"},"prob-L12-tautology":{"ana":"天气预报说「明天要么下雨要么不下雨」：它没排除任何情况，你对明天下雨的估计一点都不用改。"},"prob-L12-contradiction":{"ana":"问「既是男生又不是男生的同学里，戴眼镜的占几成」：这群人一个都没有，分母为 0，比例根本无从谈起。"},"prob-L11-markov":{"ana":"order 2 就像只记得最后两个词的接龙玩家：听到「想 吃」就按经验猜「火锅」，更早说过的话一概不管。"},"prob-L16-bayes":{"ana":"烟雾报警器响了，是真着火吗？要把「平时着火多罕见」「着火时它多会响」「做饭油烟误响多常见」合起来算。"},"prob-L16-inverse":{"ana":"Pr(咳嗽|肺癌) 很高，但 Pr(肺癌|咳嗽) 很低——咳嗽的人绝大多数只是感冒，肺癌本身很少见。"},"prob-L16-baserate":{"ana":"误报率 1% 的检测用在万分之一患病的人群：1 万人约 1 个真阳性、约 100 个误报，阳性者多半没病。"},"prob-L16-posterior":{"ana":"垃圾邮件过滤器看到「中奖」二字后判断「这是垃圾邮件」的概率，只在含「中奖」的邮件里数，不看全部邮件。"},"prob-L16-tpfp":{"ana":"烟雾报警器：真着火时响的比例（如 95%）和只是做饭时误响的比例（如 30%）针对两种不同场合，相加没有意义。"},"prob-L16-uninformative":{"ana":"某检测对病人和健康人都是 60% 出阳性，等于抛硬币下诊断：结果出来后，你对是否患病的判断应原样不动。"},"prob-L16-sleeping":{"ana":"抛 100 次约 50 正 50 反，但醒来共约 150 次、其中正面只占约 50 次：数硬币得 1/2（halfer），数醒来得 1/3（thirder）。"},"prob-L18-ev":{"ana":"车险公司对单个客户要么不赔、要么赔一大笔，但卖给上万人后，平均每单赔付才接近期望值。"},"prob-L18-net":{"ana":"花 10 元买彩票中了 15 元：回款 15 元，净赚只有 5 元；没中就净亏 10 元——算 EV 要用 +5 和 −10。"},"prob-L18-fair":{"ana":"掷骰子出 6 奖 60 元、否则 0 元：期望回款 10 元，所以 10 元一次是公平价，玩很多次平均不赚不亏。"},"prob-L18-house":{"ana":"假设某彩票平均每张只返还 5 元却卖 10 元：每买一张平均净亏 5 元，这 5 元就是庄家优势。"},"prob-L18-martingale":{"ana":"像不断加倍借钱去补窟窿：多数时候只赢回 1 元，但连输 10 次就得押 1024 元，一次撑不住就把小赚全赔光。"},"prob-L18-gambler":{"ana":"轮盘连开 5 次红色，下一次开红的概率和平时完全一样；彩票上期开过的号码，下期也不会更难开出。"},"prob-L18-coinupdate":{"ana":"盒里一枚普通币、一枚双面都是正面的币，随手拿一枚抛出正面：它是双正面币的概率从 1/2 升到 2/3，但两枚币本身都没变。"}}},
{"cards":{"prob-L12-condprob":{"kind":"读题读表求条件概率","tip":"看到 given→分母是 B 的合计：Pr(A|B)=交集格÷B 合计；除以全体是陷阱。"},"prob-L12-direction":{"kind":"辨条件方向","tip":"看竖线右边给定谁→除谁的合计；分子都是交集格，另一方向是陷阱。"},"prob-L12-contingency":{"kind":"补全四格表再求概率","tip":"看到列联表→先放交集，未知格 = 合计 − 已知格；别拿边际相乘补格。"},"prob-L12-hypopop":{"kind":"设假想人数代替公式","tip":"看到条件概率题→设 1000 人逐层乘出人数；小数照算不取整。"},"prob-L12-multrule":{"kind":"由条件概率求交集","tip":"看到「X 中 10%」→是 Pr(S|X)：交集 = 10%×Pr(X)，别把 10% 当交集。"},"prob-L12-totalprob":{"kind":"分组加权求总概率","tip":"看到「总体中…的比例」→Σ 组占比×组内比率；直接平均或相加都错。"},"prob-L12-independence":{"kind":"判断或利用独立性","tip":"看到「是否独立」→算 Pr(A|B) 比 Pr(A)；相等才独立，才能用乘积。"},"prob-L12-indep-vs-me":{"kind":"区分独立与互斥","tip":"互斥看交集是否为 0，独立看交集是否等于乘积；都 \u003e0 时互斥必不独立。"},"prob-L12-tautology":{"kind":"以永真式为条件求值","tip":"看到「给定永真式」→原值照抄 Pr(A|T)=Pr(A)。"},"prob-L12-contradiction":{"kind":"以矛盾式为条件求值","tip":"看到「给定矛盾式」→0/0 无定义；别选 0 或 1。"},"prob-L11-markov":{"kind":"解读 k 阶马尔可夫","tip":"看到「k 阶」→只看前 k 个词定下一词；表约 n^(k+1) 项，100³=10⁶。"},"prob-L16-bayes":{"kind":"贝叶斯求后验","tip":"两路各算「先验×出现率」，后验 = H 那路 ÷ 两路之和；漏 ¬H 路就错。"},"prob-L16-inverse":{"kind":"识别条件颠倒谬误","tip":"竖线右边放已观察到的证据，求 Pr(H|E)；题给的 Pr(E|H) 不是答案。"},"prob-L16-baserate":{"kind":"低基础率下判断后验","tip":"看到「基础率很低」→设 1000 人：假阳性远多于真阳性，阳性后验仍很小。"},"prob-L16-posterior":{"kind":"算后验（分母取证据）","tip":"分母只取出现证据的总数（全部阳性），不是全体；除以全体得交集。"},"prob-L16-tpfp":{"kind":"区分真阳性率与假阳性率","tip":"看到「同组补集」→和为 1：Pr(¬P|M)=1−Pr(P|M)；真假阳性率不相加。"},"prob-L16-uninformative":{"kind":"无鉴别力证据求后验","tip":"看到「两种假设下证据概率相等」→后验 = 先验，不用再算。"},"prob-L16-sleeping":{"kind":"睡美人两派数值","tip":"睡美人→halfer 正面 1/2；thirder 正面 1/3、反面 2/3；结论「有争议」。"},"prob-L18-ev":{"kind":"算期望值并解释含义","tip":"看到期望值→Σ 概率×结果；是多次平均，不是单次必得，也不是最可能。"},"prob-L18-net":{"kind":"算期望净收益","tip":"看到「投资 EV」→期望回款 − 成本，成本只扣一次；忘扣成本是最常见错项。"},"prob-L18-fair":{"kind":"求公平价格","tip":"看到公平价格→等于期望回款（½×10=$5）；付此价单次仍是赢或输。"},"prob-L18-house":{"kind":"判断庄家优势","tip":"看到「票价高于公平价」→玩家期望为负；概率和回款都不变。"},"prob-L18-martingale":{"kind":"马丁格尔净赚与风险","tip":"看到加倍下注→赢那次只净赚首注（已输 63、再押 64）；风险是资金撑不住。"},"prob-L18-gambler":{"kind":"识破赌徒谬误","tip":"看到「连续 n 次后下一次」→独立仍 1/2；连续 n 次同面 = (1/2)^n。"},"prob-L18-coinupdate":{"kind":"两枚硬币求后验与预测","tip":"先算各硬币「先验×正面率」，后验 = 该路 ÷ 总和；预测下次按后验加权。"}}},
{"cards":{"prob-L12-condprob":{"one":"Pr(A|B) = Pr(A\u0026B)/Pr(B)：在 B 的情形里 A 占的比例，要求 Pr(B)\u003e0","en":"The proportion of B-cases in which A also holds: Pr(A|B) = Pr(A\u0026B)/Pr(B), defined only if Pr(B)\u003e0.","qs":["prob-L12-q09","prob-L11-q20","prob-L11-c09","prob-L16-q24","prob-L18-q54","prob-L12-q01","prob-L12-c01","prob-L12-q03"]},"prob-L12-direction":{"one":"Pr(A|B) 与 Pr(B|A) 分子同为 Pr(A\u0026B)、分母不同，一般不相等","en":"Pr(A|B) and Pr(B|A) share numerator Pr(A\u0026B) but have different denominators, so generally differ.","qs":["prob-L12-q18","prob-L12-q02","prob-L12-c02"]},"prob-L12-contingency":{"one":"列联表：格子是交集（联合频数/概率），边际是单个事件的合计","en":"A cross-classification table: cells give joint counts/probabilities (A \u0026 B); margins give row/column totals (A, B).","qs":["prob-L12-q19","prob-L12-q10","prob-L12-c03","prob-L12-q03","prob-L12-q01","prob-L12-c01"]},"prob-L12-hypopop":{"one":"设一个方便的假想总体，把概率换成人数来算；同比缩放不改变条件概率","en":"Solve by imagining a convenient population and converting probabilities to counts; scaling leaves conditional probabilities unchanged.","qs":["prob-L12-q17","prob-L16-c16"]},"prob-L12-multrule":{"one":"交集 = 条件概率 × 条件事件概率：Pr(A\u0026B) = Pr(A|B)Pr(B)，无需独立","en":"Pr(A \u0026 B) = Pr(A|B) × Pr(B), from rearranging conditional probability; no independence assumption needed.","qs":["prob-L12-q05","prob-L12-q06","prob-L12-c04","prob-L12-c05"]},"prob-L12-totalprob":{"one":"分组互斥且穷尽时，Pr(S) = 各组 Pr(S|组)×Pr(组) 之和（加权，不能简单平均）","en":"For mutually exclusive, exhaustive groups, Pr(S) = Pr(S|N)Pr(N) + Pr(S|~N)Pr(~N): a weighted sum.","qs":["prob-L12-q07","prob-L12-q08","prob-L12-c04","prob-L12-c05","prob-L18-q55","prob-L16-q33"]},"prob-L12-independence":{"one":"A 与 B 独立：Pr(A|B) = Pr(A)（Pr(B)\u003e0），等价于 Pr(A\u0026B) = Pr(A)Pr(B)","en":"A and B are independent iff conditioning on B leaves A\u0027s probability unchanged: Pr(A|B) = Pr(A), Pr(B)\u003e0.","qs":["prob-L12-q04","prob-L12-q12","prob-L12-c06","prob-L12-c07","prob-L12-c08","prob-L12-q11","prob-L12-c02"]},"prob-L12-indep-vs-me":{"one":"互斥（Pr(A\u0026B)=0）且两者概率都 \u003e0 时，一定不独立；独立 ≠ 互斥","en":"Mutually exclusive events with positive probabilities are NOT independent: one occurring rules out the other.","qs":["prob-L12-q13","prob-L12-q11"]},"prob-L12-tautology":{"one":"永真式 T 概率为 1、不排除任何情形，故 Pr(A|T) = Pr(A)，与所有命题独立","en":"A tautology T has probability 1 and rules out nothing, so Pr(A|T) = Pr(A); it is independent of everything.","qs":["prob-L12-q14","prob-L12-q16"]},"prob-L12-contradiction":{"one":"矛盾式 F 概率为 0，Pr(A|F) = 0/0，按标准定义无定义（不是 0 也不是 1）","en":"A contradiction F has probability 0, so Pr(A|F) = 0/0 is undefined under the ratio definition.","qs":["prob-L12-q15"]},"prob-L11-markov":{"one":"k 阶马尔可夫生成器：按最近 k 个词给下一词的条件概率，表规模约 n^(k+1)","en":"A text generator assigning conditional probabilities to the next word given the last k words; k is the order.","qs":["prob-L11-q21","prob-L11-q22","prob-L11-q23"]},"prob-L16-bayes":{"one":"Pr(H|E) = Pr(E|H)Pr(H)/Pr(E)，分母 Pr(E) 要加上 H 与 ¬H 两条来源","en":"Pr(H|E) = Pr(E|H)Pr(H)/Pr(E), where Pr(E) = Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H).","qs":["prob-L16-q25","prob-L16-q27","prob-L16-q33","prob-L16-c10","prob-L16-c12","prob-L16-c14","prob-L16-q35","prob-L16-c17","prob-L16-c13","prob-L16-c11","prob-L16-q26","prob-L16-c15","prob-L16-c19"]},"prob-L16-inverse":{"one":"Pr(E|H)（有原因时证据多常见）≠ Pr(H|E)（见证据后原因多可能），因 H 可能罕见且有其他原因","en":"Pr(E|H) is evidence likelihood given H; Pr(H|E) is H\u0027s probability given E; they generally differ.","qs":["prob-L16-q39","prob-L16-q32","prob-L16-q26","prob-L16-c11","prob-L16-q34"]},"prob-L16-baserate":{"one":"base rate 是看证据前的 Pr(H)；同一检测结果在不同 base rate 下后验不同","en":"The prior Pr(H) before evidence; the same test result gives different posteriors under different base rates.","qs":["prob-L16-q30","prob-L16-q41","prob-L16-q34","prob-L16-c15","prob-L16-c16"]},"prob-L16-posterior":{"one":"后验 = 看到证据后的 Pr(H|E)，分母是有证据的情形而非全体","en":"The probability of the hypothesis after conditioning on the evidence: Pr(H|E).","qs":["prob-L16-c19","prob-L16-c17","prob-L18-q57"]},"prob-L16-tpfp":{"one":"真阳性率 Pr(P|M) 与假阳性率 Pr(P|¬M) 来自不同人群，不必相加为 1","en":"Pr(P|M) is positive rate when the condition holds, Pr(P|¬M) when it doesn\u0027t; they need not sum to 1.","qs":["prob-L16-q31","prob-L16-q29","prob-L16-q40","prob-L16-c13"]},"prob-L16-uninformative":{"one":"若 Pr(E|H) = Pr(E|¬H)，证据无鉴别力，后验 = 先验（E 与 H 概率上独立）","en":"If Pr(E|H) = Pr(E|¬H), observing E leaves Pr(H) at its base rate; E and H are probabilistically independent.","qs":["prob-L16-q28","prob-L16-q36","prob-L16-c18"]},"prob-L16-sleeping":{"one":"睡美人：正面醒一次、反面醒两次；halfer 说正面 1/2，thirder 说正面 1/3，有争议","en":"Heads: one awakening; tails: two, memory erased. Halfers: Pr(heads)=1/2; thirders: 1/3 (counting awakenings).","qs":["prob-L16-q37","prob-L16-q38"]},"prob-L18-ev":{"one":"期望值 EV = Σ 概率 × 结果值，是多次重复时每次的平均得失","en":"The probability-weighted average of outcomes, EV = Σ Pr(outcome) × value; the long-run average per trial.","qs":["prob-L18-q59","prob-L18-c24","prob-L18-c20","prob-L18-q43","prob-L18-q44","prob-L18-c23"]},"prob-L18-net":{"one":"净结果 = 回款 − 投入；算投资/赌局 EV 用净结果，成本只扣一次","en":"Net outcome = gross payout minus stake; EV of a bet uses net outcomes, subtracting the cost exactly once.","qs":["prob-L18-q42","prob-L18-q47","prob-L18-q45","prob-L18-c21","prob-L18-q43","prob-L18-q44","prob-L18-c20"]},"prob-L18-fair":{"one":"公平价格 = 期望回款，使期望净收益恰为 0（不是每次都收支相抵）","en":"The price at which expected net gain is exactly zero, i.e. price equals expected payout.","qs":["prob-L18-q46","prob-L18-q48","prob-L18-c22","prob-L18-c23","prob-L18-c24","prob-L18-c28"]},"prob-L18-house":{"one":"票价高于公平价格时，玩家期望净收益为负，差额即庄家优势","en":"When a bet\u0027s price exceeds its fair price, the bettor\u0027s expected net gain is negative, favouring the house.","qs":["prob-L18-q49"]},"prob-L18-martingale":{"one":"马丁格尔：每输一次下注翻倍，赢一次只净赚首注，所需资金指数增长","en":"Doubling the stake after each loss so the first win recovers all losses plus the initial stake; stakes grow exponentially.","qs":["prob-L18-q50","prob-L18-q51","prob-L18-c25"]},"prob-L18-gambler":{"one":"赌徒谬误：误以为独立试验的过去结果会让某个未来结果「该来了」","en":"The mistaken belief that past outcomes of independent trials make a particular future outcome more or less likely.","qs":["prob-L18-q52","prob-L18-q53"]},"prob-L18-coinupdate":{"one":"不确定是哪枚硬币时，看到结果就提高更易产生它的那枚的概率；硬币本身偏向不变","en":"Observing an outcome raises the probability of the coin more likely to produce it; the coin\u0027s bias is unchanged.","qs":["prob-L18-q55","prob-L18-q56","prob-L18-q57","prob-L18-c26","prob-L18-c27","prob-L18-c28"]}}},
{"cards":{"prob-L12-condprob":{"q":"200 人中 80 人戴眼镜，其中 20 人是左撇子。Pr(左撇子|戴眼镜) = ？A 20/200　B 20/80　C 80/200　D 20/100","a":"B：20/80 = 0.25","why":"条件是戴眼镜，分母只取戴眼镜的 80 人：20/80 = 0.25。"},"prob-L12-direction":{"q":"500 人中 100 人喝咖啡，50 人失眠，20 人两者都有。求 Pr(失眠|咖啡) 和 Pr(咖啡|失眠)。","a":"0.2 和 0.4","why":"分子都是 20，分母分别是 100 和 50：20/100、20/50。"},"prob-L12-contingency":{"q":"Pr(A)=0.6，Pr(B)=0.5，Pr(A\u0026B)=0.4。设 100 人填列联表（contingency table），求 Pr(~A\u0026~B)。","a":"0.3","why":"A\u0026~B=20，~A\u0026B=10，余 100−40−20−10=30。"},"prob-L12-hypopop":{"q":"设 100 人：A 区 20 人中 3% 中奖，B 区 80 人中 1% 中奖。中奖者共几人？要不要先把小数取整？","a":"1.4 人（1.4%），不取整","why":"20×3% + 80×1% = 0.6 + 0.8 = 1.4；小数人数只是比例，不用取整。"},"prob-L12-multrule":{"q":"25% 的学生选哲学，选哲学者中 40% 也选数学。Pr(哲学\u0026数学) = ？A 0.4　B 0.1　C 0.25　D 0.65","a":"B：0.1","why":"Pr(数学\u0026哲学) = Pr(数学|哲学)×Pr(哲学) = 0.4×0.25 = 0.1。"},"prob-L12-totalprob":{"q":"A 线产 60% 的零件、次品率 5%；B 线产 40%、次品率 10%。随机一件是次品的概率？","a":"0.07","why":"0.6×0.05 + 0.4×0.1 = 0.03 + 0.04 = 0.07。"},"prob-L12-independence":{"q":"Pr(A)=0.3，Pr(B)=0.5，Pr(A\u0026B)=0.15。A 与 B 独立（independent）吗？","a":"独立","why":"Pr(A|B) = 0.15/0.5 = 0.3 = Pr(A)。"},"prob-L12-indep-vs-me":{"q":"掷一次骰子，A=掷出偶数，B=掷出 3。哪项正确？A 独立且互斥　B 互斥但不独立　C 独立但不互斥　D 都不是","a":"B：互斥但不独立","why":"交集为 0 故互斥；Pr(A|B)=0 ≠ Pr(A)=1/2，故不独立。"},"prob-L12-tautology":{"q":"Pr(A)=0.7，T 是永真式（tautology）C∨~C。求 Pr(A|T) 和 Pr(T|A)。","a":"0.7 和 1","why":"Pr(A|T) = 0.7/1 = 0.7；A 中 T 总为真，Pr(T|A) = 0.7/0.7 = 1。"},"prob-L12-contradiction":{"q":"Pr(A)=0.5，F 是矛盾式（contradiction）C\u0026~C。Pr(A|F) = ？A 0　B 0.5　C 1　D 无定义（undefined）","a":"D：无定义","why":"Pr(F)=0，Pr(A|F) = 0/0，标准定义下无定义。"},"prob-L11-markov":{"q":"词表有 10 个词，用 n^(k+1) 估算，order 3 的完整马尔可夫表约有多少个条目？","a":"10,000","why":"n^(k+1) = 10^(3+1) = 10,000。"},"prob-L16-bayes":{"q":"Pr(H)=0.2，Pr(E|H)=0.9，Pr(E|¬H)=0.3。求 Pr(H|E)。","a":"3/7 ≈ 0.429","why":"Pr(H|E) = 0.18 ÷ (0.18 + 0.8×0.3) = 0.18/0.42 = 3/7。"},"prob-L16-inverse":{"q":"「90% 的小偷手上有泥；他手上有泥，所以他很可能是小偷。」主要错误？A 混淆 Pr(泥|小偷) 与 Pr(小偷|泥)　B 默认互斥　C 没有错误","a":"A","why":"Pr(泥|小偷) 高不代表 Pr(小偷|泥) 高：小偷罕见，别人也常手上有泥。"},"prob-L16-baserate":{"q":"某病基础发生率（base rate）10%，检测真阳性率 90%、假阳性率 10%。阳性者患病的概率？","a":"50%","why":"1000 人：真阳性 100×0.9 = 90，假阳性 900×0.1 = 90，90/180 = 50%。"},"prob-L16-posterior":{"q":"200 封邮件中 50 封含「中奖」，其中 40 封是垃圾邮件。Pr(垃圾|含中奖) = ？A 40/200　B 40/50　C 50/200　D 10/50","a":"B：40/50 = 0.8","why":"后验只在含「中奖」的 50 封里数：40/50 = 0.8。"},"prob-L16-tpfp":{"q":"检测 Pr(P|M)=0.7，Pr(P|¬M)=0.2。Pr(¬P|¬M) = ？A 0.3　B 0.8　C 0.1　D 无法确定","a":"B：0.8","why":"同一条件下才互补：Pr(¬P|¬M) = 1 − 0.2 = 0.8。"},"prob-L16-uninformative":{"q":"先验 Pr(H)=0.3，Pr(E|H) = Pr(E|¬H) = 0.6。观察到 E 后，Pr(H|E) = ？","a":"0.3（不变）","why":"0.18 ÷ (0.18 + 0.42) = 0.3：两种条件下出现率相同，后验 = 先验。"},"prob-L16-sleeping":{"q":"按三分之一派（thirder），睡美人醒来时应给「硬币是正面」多少概率？A 1/2　B 1/3　C 2/3　D 1","a":"B：1/3","why":"按醒来场合数：正面醒 1 次、反面醒 2 次，正面占 1/3。"},"prob-L18-ev":{"q":"掷公平骰子：出 6 得 $18，出 5 得 $6，其余得 $0。期望值（expected value）是多少？","a":"$4","why":"EV = 1/6×18 + 1/6×6 = 3 + 1 = $4。"},"prob-L18-net":{"q":"花 $2 买一张票：1/4 概率拿回 $6，否则拿回 $0。期望净收益（expected net gain）是多少？","a":"−$0.5","why":"1/4×(6−2) + 3/4×(0−2) = 1 − 1.5 = −$0.5，成本只扣一次。"},"prob-L18-fair":{"q":"转盘 1/5 概率奖 $20，2/5 概率奖 $5，其余奖 $0。公平价格（fair price）是多少？","a":"$6","why":"公平价格 = 期望回款 = 1/5×20 + 2/5×5 = 4 + 2 = $6。"},"prob-L18-house":{"q":"某游戏期望回款 $3，票价 $3.5。玩家每次期望净收益是多少？庄家优势（house edge）多大？","a":"−$0.5；庄家优势 $0.5","why":"期望净收益 = 期望回款 − 票价 = 3 − 3.5 = −$0.5。"},"prob-L18-martingale":{"q":"马丁格尔策略首注 $5，一赔一的公平赌局连输 4 次。已亏多少？第 5 注押多少？若赢，总净收益？","a":"亏 $75，押 $80，净赚 $5","why":"5+10+20+40 = 75；下一注 80；赢后 80 − 75 = +$5。"},"prob-L18-gambler":{"q":"轮盘只有红黑，各 1/2，已连开 5 次红。下一次开黑的概率？A 大于 1/2　B 等于 1/2　C 小于 1/2　D 1","a":"B：1/2","why":"各次独立，过去的红色不会让黑色「该来了」。"},"prob-L18-coinupdate":{"q":"硬币 A 正面率 0.8，B 正面率 0.4，各 1/2 被选。抛一次得正面，Pr(A|H) = ？","a":"2/3","why":"Pr(A|H) = 0.4 ÷ (0.4 + 0.2) = 2/3。"}}},
{"cards":{"prob-L12-condprob":{"name":"条件概率","one":"Pr(A|B)：只看 B 发生的那些人，其中 A 占多少。","pts":["竖线右边是条件（given），它就是分母","Pr(A|B)=Pr(A\u0026B)÷Pr(B)，要求 Pr(B)\u003e0","交集除以全体；条件概率只除以 B 的人数"],"ex":"1000 名学生：本地 550 人，其中住校内 350 → Pr(校内|本地)=350÷550≈0.636。","trap":"把交集 350/1000 当条件概率；或把「给定 B」读成「B 导致 A」。","ana":"问「下雨天你带伞的比例」：先只挑出下雨的那些天当分母，再数其中带伞的天数，晴天一律不算。","words":[{"en":"given","zh":"在……条件下","m":"竖线右边的已知条件"},{"en":"domestic / international","zh":"本地生 / 国际生","m":"按学生来源分的两类"},{"en":"on campus / off campus","zh":"住校内 / 住校外","m":"按住宿地点分的两类"},{"en":"BOTH … AND …","zh":"既……又……","m":"两个条件同时成立，即交集"},{"en":"randomly chosen / selected","zh":"随机抽取的","m":"每个个体被抽中机会相同"},{"en":"record","zh":"记录","m":"数据中的一条消息"},{"en":"irritable","zh":"烦躁的","m":"容易发脾气"},{"en":"key press","zh":"按键","m":"按一次键盘"}]},"prob-L12-direction":{"name":"条件方向不能互换","one":"Pr(A|B) 和 Pr(B|A) 分子相同、分母不同，一般不相等。","pts":["Pr(A|B) 只数 B 的人；Pr(B|A) 只数 A 的人","只在 Pr(A)=Pr(B) 或交集为 0 时才相等","方向不同与因果无关"],"ex":"本地 550 人中校内 350 → 0.636；校内 450 人中本地 350 → 0.778。","trap":"把「病人中阳性的比例」当成「阳性者中病人的比例」。","ana":"Pr(高个|篮球运动员) 很高，但 Pr(篮球运动员|高个) 很低：高个子绝大多数并不打篮球。","words":[{"en":"numerator","zh":"分子","m":"分数线上面的数"},{"en":"denominator","zh":"分母","m":"分数线下面的数"},{"en":"need not","zh":"不一定","m":"不是必须"},{"en":"cause","zh":"导致","m":"一件事引起另一件事"},{"en":"always","zh":"总是","m":"任何情况下都成立"}]},"prob-L12-contingency":{"name":"列联表","one":"列联表（contingency table）：格子是交集人数，行列合计是单类人数。","pts":["未知格 = 合计 − 已知格；四格加起来是全体","行/列合计 = 单个类别的总人数","信息不够时不能默认独立去相乘"],"ex":"设 100 人：D 50、S 30、D\u0026S 10 → 只 D 40，只 S 20，其余 30。","trap":"用 Pr(¬D)×Pr(¬S)=0.35 填格，等于偷偷假设了独立。","ana":"像按「男/女 × 及格/不及格」交叉的四格成绩表：格子是「女生且及格」人数，行尾、列尾合计是女生总数、及格总数。","words":[{"en":"contingency table","zh":"列联表","m":"两个分类交叉的计数表"},{"en":"margins","zh":"边际","m":"表格的行合计和列合计"},{"en":"row / column totals","zh":"行合计 / 列合计","m":"一行或一列各格之和"},{"en":"cell","zh":"格子","m":"表中一行一列交叉的格"},{"en":"category","zh":"类别","m":"分类中的一类"},{"en":"joint count","zh":"联合频数","m":"同时满足两个条件的个数"},{"en":"complete the table","zh":"把表填完整","m":"算出所有空格"},{"en":"attended the review session","zh":"参加了复习课","m":"题中的事件 B"}]},"prob-L12-hypopop":{"name":"人数表法（假想总体）","one":"人数表（hypothetical population）：设 1000 人，把概率换成人数算。","pts":["先按先验分组，再算每组里出现证据的人数","答案 = 目标组的证据人数 ÷ 证据总人数","出现 1.4 人这种小数照算，不要四舍五入"],"ex":"设 100 人：北岸 30→被俯冲 3；南岸 70→1.4；共 4.4；Pr(N|S)=3÷4.4≈0.68。","trap":"最后除以 100 而不是除以证据总人数；或以为小数人数说明表错。","ana":"「2% 的人有副作用」不好想，就想象 1000 人中 20 人有；换成 10 万人是 2000 人，比例不变。","words":[{"en":"hypothetical","zh":"假想的","m":"为方便计算而设想的"},{"en":"population","zh":"总体 / 人群","m":"被考虑的全部个体"},{"en":"fractional","zh":"非整数的","m":"带小数的人数"},{"en":"proportional model","zh":"比例模型","m":"只关心比例不关心实数"},{"en":"scaling","zh":"同比缩放","m":"所有数乘同一倍数"},{"en":"round","zh":"四舍五入","m":"把小数取成整数"},{"en":"invalid","zh":"无效的","m":"不能用的"},{"en":"tests positive","zh":"检测呈阳性","m":"检测结果为「有」"}]},"prob-L12-multrule":{"name":"乘法规则（求交集）","one":"交集 = 条件概率 × 条件的概率：Pr(A\u0026B)=Pr(A|B)×Pr(B)。","pts":["由条件概率定义移项得到，不需要独立","「北岸居民中 10%」是 Pr(S|N)，不是交集","人数表里就是「组人数 × 组内比例」"],"ex":"设 100 人：北岸 30 人，其中 10% 被俯冲 → 3 人，Pr(N\u0026S)=0.03。","trap":"把 0.03 当成全体被俯冲率；它只是北岸那部分。","ana":"全班 40% 戴眼镜，戴眼镜者中一半是女生，则「戴眼镜的女生」占全班 0.4×0.5 = 20%，不用管两者是否独立。","words":[{"en":"resident","zh":"居民","m":"住在某地的人"},{"en":"North / South Shore","zh":"北岸 / 南岸","m":"题中两个居住区"},{"en":"magpie","zh":"喜鹊","m":"春季会俯冲攻击人的鸟"},{"en":"get swooped","zh":"被俯冲攻击","m":"题中的事件 S"},{"en":"joint probability","zh":"交集概率","m":"两事件同时发生的概率"}]},"prob-L12-totalprob":{"name":"全概率（分组相加）","one":"全概率（total probability）：各组里出现该情况的人数相加。","pts":["互斥：组与组不重叠；穷尽：合起来是全体","按组的大小加权，不能把各组比率直接平均","公式：Pr(S)=Σ Pr(S|组)×Pr(组)"],"ex":"设 100 人：北岸 30×10%=3，南岸 70×2%=1.4，共 4.4 → Pr(S)=0.044。","trap":"把 10% 和 2% 平均成 6%，或直接相加成 12%。","ana":"A 线产 80% 零件、次品率 1%，B 线产 20%、次品率 5%：总次品率 1.8%，不是平均的 3%。","words":[{"en":"overall","zh":"总体的","m":"在全体中算的"},{"en":"weighted","zh":"加权的","m":"按各组大小给比重"},{"en":"share of the population","zh":"占总体的份额","m":"这一组占全体的比例"},{"en":"expand","zh":"展开","m":"把一项拆成几项之和"},{"en":"route","zh":"途径 / 来源","m":"结果出现的一条路径"},{"en":"add","zh":"相加","m":"把几项加起来"}]},"prob-L12-independence":{"name":"概率独立","one":"独立（independent）：知道 B 不改变 A，Pr(A|B)=Pr(A)。","pts":["判断：算出 Pr(A|B)，和 Pr(A) 比较","等价：Pr(A\u0026B)=Pr(A)Pr(B)；题明说独立才能这样乘","不独立只说明相关，不证明因果"],"ex":"设 100 人：B 50 人里 A 15 人，15÷50=0.3=Pr(A)，独立。","trap":"凭感觉「没关系」就当独立；或把交集写成并集，算出大于 1。","ana":"同时抛硬币和掷骰子：知道硬币是正面，骰子出 6 的概率仍是 1/6，这条信息毫无影响，所以两者独立。","words":[{"en":"independent","zh":"独立的","m":"知道一个不改变另一个的概率"},{"en":"equally likely","zh":"等可能的","m":"各结果概率相同"},{"en":"conjunction","zh":"合取（且）","m":"A 和 B 都成立"},{"en":"disjunction","zh":"析取（或）","m":"A 或 B 至少一个成立"},{"en":"conclusion","zh":"结论","m":"推出来的判断"},{"en":"exceed","zh":"超过","m":"比……大"},{"en":"TOLD that","zh":"已被告知","m":"题目直接给出的条件"},{"en":"under exactly which condition","zh":"恰好在什么条件下","m":"充分且必要的条件"}]},"prob-L12-indep-vs-me":{"name":"独立 vs 互斥","one":"互斥（mutually exclusive）：不能同时发生；概率都 \u003e0 时一定不独立。","pts":["互斥：Pr(A\u0026B)=0，所以 Pr(A|B)=0","Pr(A)\u003e0 时 0≠Pr(A)，所以不独立","独立的事件可以同时发生，如四季例的夏天"],"ex":"掷骰子，A=掷出 1，B=掷出 2：互斥；Pr(A|B)=0≠Pr(A)=1/6，不独立。","trap":"以为「互斥 = 毫无关系 = 独立」；互斥其实是很强的依赖。","ana":"单选题只能选一个：知道你选了 A，就立刻知道你没选 B。互斥恰恰是最强的相互影响，不是独立。","words":[{"en":"mutually exclusive","zh":"互斥的","m":"不能同时发生"},{"en":"must be true","zh":"一定成立","m":"任何情况下都对"},{"en":"neither … nor …","zh":"既不……也不……","m":"两者都不是"},{"en":"but not","zh":"但不是","m":"前者成立，后者不成立"}]},"prob-L12-tautology":{"name":"以永真式为条件","one":"永真式（tautology）T 一定成立，不排除任何人，所以 Pr(A|T)=Pr(A)。","pts":["A\u0026T 就是 A，Pr(T)=1，得 Pr(A)÷1","永真式与任何命题都独立","Pr(A\u0026B)=Pr(A|B) 仅当 Pr(B)=1 或交集为 0"],"ex":"Pr(A)=0.2，T=B∨¬B：100 人全满足 T，其中 20 人是 A → Pr(A|T)=0.2。","trap":"概率为 1 不能倒推它在逻辑上是永真式。","ana":"天气预报说「明天要么下雨要么不下雨」：它没排除任何情况，你对明天下雨的估计一点都不用改。","words":[{"en":"tautology","zh":"永真式","m":"逻辑上一定为真的命题"},{"en":"e.g.","zh":"例如","m":"举例用语"},{"en":"∨","zh":"或","m":"析取符号"},{"en":"assuming","zh":"假设","m":"在……前提下"},{"en":"only when","zh":"只有当……时","m":"其他情况都不行"}]},"prob-L12-contradiction":{"name":"以矛盾式为条件","one":"矛盾式（contradiction）F 不可能成立，Pr(F)=0，Pr(A|F)=0/0 无定义。","pts":["条件概率要求条件的概率大于 0","0/0 既不是 0，也不是 1","对比：给定永真式得原概率；给定矛盾式无定义"],"ex":"Pr(A)=0.2，F=B\u0026¬B：100 人里满足 F 的 0 人，没法算比例，无定义。","trap":"把 Pr(A|F) 写成 0 或 1。","ana":"问「既是男生又不是男生的同学里，戴眼镜的占几成」：这群人一个都没有，分母为 0，比例根本无从谈起。","words":[{"en":"contradiction","zh":"矛盾式","m":"逻辑上一定为假的命题"},{"en":"undefined","zh":"无定义","m":"算式没有意义"},{"en":"standard definition","zh":"标准定义","m":"本课用的比值定义"}]},"prob-L11-markov":{"name":"k 阶马尔可夫生成器","one":"k 阶马尔可夫（Markov）：只看最近 k 个词，给下一个词定概率。","pts":["阶数 = 条件里前文的词数，不是一次输出几个词","完整表约 n^(k+1) 条，每多看一词扩大 n 倍","自动补全比的是 Pr(下一词|前文)，不是总频率"],"ex":"词表 100 个词：1 阶约 100²=1 万条；2 阶约 100³=100 万条。","trap":"以为 2 阶是一次输出两个词，或是看全部前文。","ana":"order 2 就像只记得最后两个词的接龙玩家：听到「想 吃」就按经验猜「火锅」，更早说过的话一概不管。","words":[{"en":"Markov text generator","zh":"马尔可夫文本生成器","m":"按前文概率生成下一词"},{"en":"order-2","zh":"二阶","m":"以前两个词为条件"},{"en":"vocabulary","zh":"词表","m":"所有可用的词"},{"en":"entries","zh":"条目","m":"表中的一项"},{"en":"context","zh":"前文","m":"前面已出现的词"},{"en":"corpus","zh":"语料库","m":"用来统计的文本集合"},{"en":"estimate","zh":"估算","m":"大致算出"},{"en":"suggests","zh":"推荐（续词）","m":"自动补全给出的词"}]},"prob-L16-bayes":{"name":"贝叶斯定理（人数表法）","one":"贝叶斯（Bayes）：Pr(H|E) = H 组中有 E 的人数 ÷ 有 E 的总人数。","pts":["竖线右边是已知证据，左边是要问的","设 1000 人按先验分 H、¬H 两组，各乘证据出现率","两组相加是有证据的总数，就是分母"],"ex":"100 个时刻：疲倦 40 里烦躁 32，不疲倦 60 里烦躁 6 → Pr(疲倦|烦躁)=32÷38≈0.84。","trap":"分母只算 H 组的 32，漏掉 ¬H 组产生证据的 6。","ana":"烟雾报警器响了，是真着火吗？要把「平时着火多罕见」「着火时它多会响」「做饭油烟误响多常见」合起来算。","words":[{"en":"hypothesis","zh":"假设","m":"要判断真假的 H"},{"en":"evidence","zh":"证据","m":"观察到的 E"},{"en":"pill","zh":"药片","m":"题中被检测的对象"},{"en":"MDMA","zh":"摇头丸成分","m":"药片是否含它即 M"},{"en":"urn","zh":"罐子","m":"装球的容器"},{"en":"with replacement","zh":"放回抽取","m":"抽完放回再抽"},{"en":"fair coin","zh":"公平硬币","m":"正反面各 1/2"},{"en":"landed heads","zh":"正面朝上","m":"抛硬币结果为正面"}]},"prob-L16-inverse":{"name":"反转条件概率","one":"Pr(E|H) 是 H 组里有 E 的比例；Pr(H|E) 是有 E 者中 H 的占比。","pts":["H 很少见时，Pr(H|E) 可以很低","¬H 组也常出现 E 时，Pr(H|E) 也会低","证据是否定的（如不烧），就求 Pr(V|¬I)"],"ex":"1 万人：吸血鬼 100 里不烧 1 个，人类 9900 全不烧 → Pr(吸血鬼|不烧)=1÷9901。","trap":"「H 组里常见 E」不等于「有 E 的人多半是 H」。","ana":"Pr(咳嗽|肺癌) 很高，但 Pr(肺癌|咳嗽) 很低：咳嗽的人绝大多数只是感冒，肺癌本身很少见。","words":[{"en":"vampire","zh":"吸血鬼","m":"题中的假设 V"},{"en":"burn in sunlight","zh":"见阳光会烧毁","m":"题中的证据 I"},{"en":"symptom","zh":"症状","m":"疾病的表现"},{"en":"disease / condition","zh":"疾病 / 病症","m":"要判断有没有的病"},{"en":"flaw","zh":"漏洞","m":"推理中的错误"},{"en":"almost certainly","zh":"几乎肯定","m":"概率接近 1"},{"en":"detects","zh":"检出","m":"有病时测出阳性"},{"en":"confuses A with B","zh":"把 A 和 B 混淆","m":"把一个当成另一个"}]},"prob-L16-baserate":{"name":"基础发生率 / 先验","one":"基础发生率（base rate）= 看证据前 H 有多常见，即先验 Pr(H)。","pts":["人数表第一行就是它：先按先验分组","检测不变，先验越低，阳性后越不可信","H 很少见时，假阳性人数常超过真阳性"],"ex":"1000 人、患病 10%：真阳性 100×0.9=90，假阳性 900×0.1=90 → 90÷180=50%。","trap":"忽视基础发生率，只看检测准确率。","ana":"误报率 1% 的检测用在万分之一患病的人群：1 万人约 1 个真阳性、约 100 个误报，阳性者多半没病。","words":[{"en":"base rate","zh":"基础发生率","m":"看证据前 H 的比例"},{"en":"closest to","zh":"最接近","m":"选数值最近的"},{"en":"affects 1 in 1,000","zh":"每千人中 1 人患","m":"基础发生率 0.1%"},{"en":"algorithm","zh":"算法","m":"计算机的判断程序"},{"en":"group features","zh":"群体特征","m":"一类人的共同特点"},{"en":"misjudge individuals","zh":"误判个人","m":"把群体猜测套到个人"},{"en":"fed in","zh":"输入的","m":"放进计算里的数据"},{"en":"algorithmic bias","zh":"算法偏见","m":"算法输出系统性出错"}]},"prob-L16-posterior":{"name":"后验概率","one":"后验（posterior）Pr(H|E)：有证据的人里 H 所占比例。","pts":["分母是有证据的总人数，不是全体","后验 ≠ 交集：32/38 是后验，32/100 是交集","证据可累积：每多一个黑球，X 罐后验更接近 1"],"ex":"100 个时刻中 38 个烦躁，其中 32 个疲倦 → Pr(疲倦|烦躁)=32÷38=16/19。","trap":"分母写成全体 100，就把交集当成了后验。","ana":"垃圾邮件过滤器看到「中奖」二字后判断「这是垃圾邮件」的概率，只在含「中奖」的邮件里数，不看全部邮件。","words":[{"en":"posterior","zh":"后验","m":"看到证据后的概率"},{"en":"prior","zh":"先验","m":"看到证据前的概率"},{"en":"NEGATIVE","zh":"阴性","m":"检测结果为「没有」"},{"en":"tails","zh":"反面","m":"硬币背面朝上"},{"en":"rises from … to …","zh":"从……升到……","m":"概率变大"},{"en":"remains","zh":"保持不变","m":"仍然是原来的值"}]},"prob-L16-tpfp":{"name":"真阳性率 vs 假阳性率","one":"真阳性率（true positive rate）：真药组阳性比例；假阳性率：假药组的。","pts":["两者来自不同组，相加不必为 1","同一组里阳性+阴性=1：Pr(¬P|M)=1−Pr(P|M)","假阳性率越低，阳性证据越强；为 0 时阳性全是真药"],"ex":"1000 片：真 750×0.5=375 阳性，假 250×0.4=100 阳性；50%+40% 无意义。","trap":"假药组阴性率是 1−0.4=0.6，不是 1−0.5。","ana":"烟雾报警器：真着火时响的比例（如 95%）和只是做饭时误响的比例（如 30%）针对两种不同场合，相加没有意义。","words":[{"en":"true positive rate","zh":"真阳性率","m":"Pr(P|M)"},{"en":"false positive rate","zh":"假阳性率","m":"Pr(P|¬M)"},{"en":"must sum to 1","zh":"相加必为 1","m":"两者互补"},{"en":"pair","zh":"一对","m":"两个数"},{"en":"holding … fixed","zh":"保持……不变","m":"其他条件不动"},{"en":"stronger evidence","zh":"更强的证据","m":"更能改变后验"},{"en":"raising / lowering","zh":"提高 / 降低","m":"让数变大或变小"}]},"prob-L16-uninformative":{"name":"无鉴别力的证据","one":"无鉴别力（uninformative）：Pr(E|H)=Pr(E|¬H) 时，后验 = 先验。","pts":["两组出现证据的比例一样，比例关系不变","证据强弱看两组出现率的差距","Pr(E|H) 本身高，证据也不一定有用"],"ex":"设 100 人：H 30 人出 E 18 个，¬H 70 人出 E 42 个 → 18÷60=0.3，等于先验。","trap":"两组阳性率都 50% 时，以为后验变 50%；其实仍是先验。","ana":"某检测对病人和健康人都是 60% 出阳性，等于抛硬币下诊断：结果出来后，你对是否患病的判断应原样不动。","words":[{"en":"equally often","zh":"同样频繁","m":"两种情况下出现率相同"},{"en":"whether or not","zh":"无论是否","m":"两种情况都一样"},{"en":"discriminate","zh":"区分","m":"分辨两个假设"},{"en":"cannot be determined","zh":"无法确定","m":"信息不够算不出"},{"en":"black then white","zh":"先黑后白","m":"按顺序的抽球结果"}]},"prob-L16-sleeping":{"name":"睡美人问题","one":"正面醒一次、反面醒两次且失忆：正面算 1/2 还是 1/3 有争议。","pts":["二分之一派（halfer）：数硬币结果，正面 1/2","三分之一派：数醒来次数，正面 1/3、反面 2/3","硬币始终公平；课上当作有争议的难题"],"ex":"抛 100 次：正面醒 50 次，反面醒 100 次；按醒来数，正面 50÷150=1/3。","trap":"把三分之一派的数对调；应是正面 1/3、反面 2/3。","ana":"像统计「来店的人」还是「来店的次数」：常客来两次，按人数和按次数算出的比例就不同。","words":[{"en":"Sleeping Beauty","zh":"睡美人","m":"课上的思想实验"},{"en":"awakening","zh":"醒来（场合）","m":"每一次醒过来"},{"en":"indistinguishable","zh":"无法区分的","m":"自己分不出是哪一次"},{"en":"competing arguments","zh":"相互竞争的论证","m":"结论不同的几种推理"},{"en":"beyond dispute","zh":"无可争议地","m":"没人能反驳"},{"en":"biased","zh":"有偏的（不公平）","m":"正反面概率不等"},{"en":"assign","zh":"赋予（概率）","m":"给出一个概率值"},{"en":"on waking","zh":"醒来时","m":"刚醒的那一刻"}]},"prob-L18-ev":{"name":"期望值","one":"期望值（EV）= 每个结果 × 它的概率，全部相加；是多次重复的平均。","pts":["逐项列「结果 × 概率」，再相加","EV 不是单次一定得到的数，也不一定最可能","概率或结果为 0 的项贡献为 0"],"ex":"公平硬币正面 $10、反面 $0：10×1/2+0×1/2=$5，玩很多次平均每次 $5。","trap":"以为 EV $5 就是这次会拿 $5；单次只会拿 $10 或 $0。","ana":"车险公司对单个客户要么不赔、要么赔一大笔，但卖给上万人后，平均每单赔付才接近期望值。","words":[{"en":"expected value","zh":"期望值","m":"按概率加权的平均"},{"en":"repetitions","zh":"重复（多次）","m":"同样条件做很多次"},{"en":"approaches","zh":"趋近","m":"越来越接近"},{"en":"most likely single outcome","zh":"最可能的单次结果","m":"概率最大的那一个"},{"en":"at least half","zh":"至少一半","m":"不少于 50%"},{"en":"six-sided die","zh":"六面骰子","m":"点数 1 到 6"},{"en":"lottery ticket","zh":"彩票","m":"买来抽奖的票"},{"en":"interpretation","zh":"解读","m":"对含义的理解"}]},"prob-L18-net":{"name":"回款 vs 净结果","one":"净结果 = 回款（gross payout）− 投入；投资 EV 用净结果，成本只扣一次。","pts":["做法一：每项先扣成本，再乘概率相加","做法二：先算期望回款，最后统一扣一次","两种做法选一种，不能扣两次"],"ex":"投 $1M，最好拿回 $4M（净 +3）：2/25×3+23/25×(−1)=−$0.68M。","trap":"忘扣投入得 +0.32；或每项扣过后最后又扣一次。","ana":"花 10 元买彩票中了 15 元：回款 15 元，净赚 5 元；没中净亏 10 元。算 EV 用 +5 和 −10。","words":[{"en":"invest","zh":"投资","m":"先投入一笔钱"},{"en":"startup","zh":"创业公司","m":"新成立的公司"},{"en":"founder","zh":"创始人","m":"公司的创办者"},{"en":"charismatic / dull","zh":"有魅力的 / 乏味的","m":"创始人的两种类型"},{"en":"gross payout","zh":"回款","m":"最后拿回的钱"},{"en":"net gain","zh":"净收益","m":"回款减去投入"},{"en":"subtracted twice","zh":"被减了两次","m":"成本重复扣除"},{"en":"returns $4M","zh":"拿回 400 万美元","m":"回款金额"}]},"prob-L18-fair":{"name":"公平价格","one":"公平价格（fair price）= 期望回款，付这个价期望净收益为 0。","pts":["公平只说平均为 0，单次不会正好持平","付 $5 玩 $10/$0 游戏：单次要么 +5 要么 −5","信念更新后期望回款变了，公平价格也变"],"ex":"转盘 1/5 奖 $20、2/5 奖 $5、其余 $0：公平价 = 4+2 = $6。","trap":"以为付了公平价格，这一次就不赚不亏。","ana":"掷骰子出 6 奖 60 元、否则 0 元：期望回款 10 元，所以 10 元一次是公平价，玩很多次平均不赚不亏。","words":[{"en":"fair price","zh":"公平价格","m":"期望回款那么多的价格"},{"en":"entry price","zh":"入场价（票价）","m":"玩一次要付的钱"},{"en":"fair bet","zh":"公平赌局","m":"期望净收益为 0"},{"en":"break even","zh":"收支相抵","m":"不赚也不亏"},{"en":"guaranteed","zh":"保证","m":"一定会发生"},{"en":"ticket costs $4","zh":"票价 4 美元","m":"玩一次的成本"}]},"prob-L18-house":{"name":"庄家优势","one":"庄家优势（house edge）= 票价 − 公平价格；玩家期望净收益为负。","pts":["期望净收益 = 期望回款 − 票价","涨票价不改变结果的概率，也不改变期望回款"],"ex":"期望回款 $5 的硬币游戏卖 $6：玩家每次平均亏 $1。","trap":"以为票价变了，概率或回款也会跟着变。","ana":"假设某彩票平均每张只返还 5 元却卖 10 元：每买一张平均净亏 5 元，这 5 元就是庄家优势。","words":[{"en":"house edge","zh":"庄家优势","m":"票价超出公平价的部分"},{"en":"bettor","zh":"下注者","m":"玩赌局的人"},{"en":"set above","zh":"定得高于","m":"价格比……高"},{"en":"stay the same","zh":"保持不变","m":"没有改变"}]},"prob-L18-martingale":{"name":"马丁格尔策略","one":"马丁格尔（Martingale）：输了就加倍下注，赢一次只净赚首注。","pts":["首注 1，连输 n 次已亏 2^n−1，下一注要 2^n","所需资金指数增长，会撞上本金或下注上限","不改变每次输赢的概率，硬币没有记忆"],"ex":"押 1、2、4、8、16、32 连输，共亏 63；第 7 注押 64，赢了只净赚 1。","trap":"以为「总会赢一次」就稳赚；钱可能先用完。","ana":"像不断加倍借钱去补窟窿：多数时候只赢回 1 元，但连输 10 次就得押 1024 元，一次撑不住就把小赚全赔光。","words":[{"en":"stake","zh":"赌注","m":"这一局押的钱"},{"en":"doubles","zh":"翻倍","m":"变成原来两倍"},{"en":"even-money bet","zh":"一赔一的赌注","m":"赢了得到同等金额"},{"en":"betting limit","zh":"下注上限","m":"一次最多能押多少"},{"en":"in a row","zh":"连续","m":"一次接一次"},{"en":"practical danger","zh":"实际风险","m":"现实中会出的问题"},{"en":"overall net gain","zh":"总净收益","m":"所有局加起来的得失"}]},"prob-L18-gambler":{"name":"赌徒谬误","one":"赌徒谬误（gambler\u0027s fallacy）：以为独立试验的过去结果让某结果「该来了」。","pts":["公平硬币连 6 次反面后，下次正面仍是 1/2","连 8 次正面概率 1/256，罕见但真随机也会有","伪随机数：同一种子重现同一序列"],"ex":"公平硬币连出 6 次反面：下一次正面仍是 1/2，不会变大。","trap":"以为连串必须结束，或下一次会「补偿」前面。","ana":"轮盘连开 5 次红色，下一次开红的概率和平时完全一样；彩票上期开过的号码，下期也不会更难开出。","words":[{"en":"gambler\u0027s fallacy","zh":"赌徒谬误","m":"以为结果该轮到了"},{"en":"streak","zh":"连串","m":"同一结果连续出现"},{"en":"due","zh":"该来了","m":"以为轮到它出现"},{"en":"random number generator","zh":"随机数生成器","m":"电脑产生随机数的程序"},{"en":"seed","zh":"种子","m":"生成序列的起始值"},{"en":"fixed rule","zh":"固定规则","m":"不变的计算方法"},{"en":"reproduces","zh":"重现","m":"再产生一模一样的"},{"en":"pseudorandom","zh":"伪随机","m":"看似随机实则确定"}]},"prob-L18-coinupdate":{"name":"不确定硬币的更新","one":"不知哪枚硬币：用人数表数「出正面的次数里，各硬币占多少」。","pts":["设 100 次选币，按先验分组，再算各组出正面次数","Pr(A|H) = A 的正面次数 ÷ 全部正面次数","下次正面概率 = 用新比例加权两枚硬币；硬币本身不变"],"ex":"设 100 次：A 50 次→正 37.5，B 50 次→正 7.5，共 45；Pr(A|H)=37.5÷45=5/6。","trap":"把 Pr(H|A)=0.75 当成 Pr(A|H)；或以为见过正面后 A 更易出正面。","ana":"盒里一枚普通币、一枚双正面币，随手拿一枚抛出正面：是双正面币的概率从 1/2 升到 2/3，币本身没变。","words":[{"en":"lands heads","zh":"正面朝上","m":"抛出的结果是正面"},{"en":"flip","zh":"抛（硬币）","m":"抛一次"},{"en":"before flipping","zh":"抛之前","m":"还没看到结果时"},{"en":"heads-chance","zh":"出正面的概率","m":"硬币本身的偏向"},{"en":"same coin","zh":"同一枚硬币","m":"不换硬币再抛"},{"en":"probability tree","zh":"概率树","m":"按步骤分叉画概率"}]}}},
{"cards":{"soc-L1-epistemology":{"ana":"认识论像信息质检员，问“你凭什么这么确定”；社会认识论再问：你信的老师、课本、新闻又凭什么可靠。"},"soc-L1-jtb":{"ana":"像考试满分要三样齐：答案对（真）、你写了它（信）、有正确过程（辩护），缺一样都不算真会。"},"soc-L1-gettier":{"ana":"一向很准的钟其实昨晚停了，你看它显示 3 点就相信现在 3 点，而此刻恰好真是 3 点：有理由、真、相信，却只是碰巧，不算知道。"},"soc-L3-evidentialism":{"ana":"像没核实就转发谣言：就算后来证实是真的，当初轻信仍不负责。"},"soc-L3-shipowner":{"ana":"像厨师明知食材可能变质，却说服自己“应该没事”就上菜：就算没人吃坏肚子，他的做法也已经错了。"},"soc-L3-four-replies":{"ana":"就像在群里随口说“那家店用地沟油”：你没做什么，但别人信了、转发了、不去了，“只是想想”也会伤人。"},"soc-L3-voluntarism":{"ana":"像决定要不要相信一个新朋友值得信任：证据还不够，但你必须表态，James 认为这时可以合理地选择去相信。"},"soc-L3-live":{"ana":"“读研还是工作”是活的，“当火星国王”不是；聚餐拖到饭点等于没去；接不接出国工作才算重大。"},"soc-L3-self-fulfilling":{"ana":"相信自己能在演讲中讲好，于是更敢抬头、声音更稳，结果真讲好了——信念帮自己成了真。"},"soc-L3-truth-vs-error":{"ana":"像垃圾邮件过滤器：设得太严，少收垃圾但会误拦重要邮件；设得太松，重要邮件都收到但垃圾也多。"},"soc-L3-reductio":{"ana":"像有人宣布“不要相信任何没写在合同里的规则”，可这条规则本身并没写在合同里——它自己先违反了自己。"},"soc-L5-testimony":{"ana":"你知道自己的生日，其实是爸妈和出生证明告诉你的——你自己当时并不记得，这就是靠证言知道。"},"soc-L5-autonomy":{"ana":"像坚持“定理都要自己证一遍才信”的学生，学到的反而少；把知识看成每人各自的存折，就是个人主义。"},"soc-L5-dependence":{"ana":"飞行员说“前方有气流，请系好安全带”，你看不懂仪表数据，但因为信任飞行员，你有理由相信要系好安全带。"},"soc-L5-deference":{"ana":"导航说前方封路要绕行，你虽然觉得直走更近，但承认它掌握实时路况，就该认真听它的，而不是只信直觉。"},"soc-L5-chain":{"ana":"像传话游戏：消息可以传过很多人，但第一个人必须真的看到过，否则后面每个人传的都是空中楼阁。"},"soc-L5-identify-experts":{"ana":"你不懂法律，很难判断哪个律师真厉害，只能看执照、胜诉记录和推荐，而这些也是别人告诉你的。"},"soc-L7-endo-exo":{"ana":"你在书店主动找某本书是内源注意；突然有人打翻书架、你忍不住回头，是外源注意。"},"soc-L7-selective":{"ana":"注意力像舞台追光灯：照到的演员一清二楚，没照到的人虽也在台上，却几乎被忽略。"},"soc-L7-selection-bias":{"ana":"在健身房门口问“多久运动一次”是选择偏差；尝汤要先搅匀再舀，这一勺才代表整锅。"},"soc-L7-survivorship":{"ana":"看到街上的老房子都很结实，就以为“以前的房子质量更好”，却忘了建得差的老房子早就被拆了。"},"soc-L7-friendship":{"ana":"班里的“社交达人”出现在几乎每个人的好友列表里，所以你的朋友们平均下来，朋友数总比你多。"},"soc-L7-unit":{"ana":"一家餐厅说“平均每桌 3 人”，但按顾客算，多数人是坐在大桌上的——从顾客角度看，平均同桌人数要多得多。"},"soc-L7-berkson":{"ana":"能上热门的视频要么内容特别好、要么标题特别吸睛，于是在热门里看起来“标题越夸张内容越差”，其实总体上两者无关。"},"soc-L7-censoring":{"ana":"只统计“已经毕业”的学生算平均读书年限，最近入学、还没毕业的学生被排除，就只剩那些读得特别快的人。"},"soc-L7-randomization":{"ana":"像抽签决定谁能免费试用健身卡，再比较两组健康，而不是比较主动办卡和没办卡的人。"},"soc-L9-three-levels":{"ana":"妈妈说“你房间真干净啊”：句法是语序正确，语义是夸房间干净，语用上其实在说“快去收拾”。"},"soc-L9-speech-act":{"ana":"裁判说“你出局了”，这句话不是在描述，而是让球员真的出局；观众喊同一句话就没有这个效力。"},"soc-L9-focal-point":{"ana":"和朋友在商场走散、手机没电，你们都会想到去正门口等——不是因为那里最好，而是都觉得对方也会去那。"},"soc-L9-common-knowledge":{"ana":"班长在全班宣布“明天放假”，大家不只都知道，还都知道别人也知道，这就是共同知识；私下一个个告诉则不是。"},"soc-L9-common-ground":{"ana":"像会议纪要：明确说出并记进纪要的内容，之后大家都能引用；只在走廊里暗示的，就没进纪要。"},"soc-L9-indirect-speech":{"ana":"想让客人离开却说“哎呀都这么晚了”，对方能听懂，但你并没正式说出“请你走”。"},"soc-L9-deniability":{"ana":"说“这门课期末挺难吧”暗示想抄作业，被拒可说只是闲聊；约同事看展被婉拒，同事关系照旧。"},"soc-L11-bibliotechnic":{"ana":"LLM 像一个读过整座图书馆的超级检索员，能把书里的片段拼成新回答，但这不意味着它真的在思考。"},"soc-L11-next-token":{"ana":"像接龙写句子：每次只看前面写了什么，猜最可能的下一个字写上，再接着猜下一个，直到写完。"},"soc-L11-redescription":{"ana":"说“音乐只是空气振动，所以没有美”是错的推理：能用低层方式描述它，并不证明高层特性不存在。"},"soc-L11-hallucination":{"ana":"像一个不懂装懂、口才极好的同学，被问到不会的题也能说得头头是道，听着很像答案，其实是编的。"},"soc-L11-twenty-questions":{"ana":"像一个玩猜谜却没先想好答案的人：只要回答和之前说的不矛盾就行，重来一次可能“想的”是另一个东西。"},"soc-L11-testimony":{"ana":"地图不会思考，但你能靠它找到路；关键是它标的信息能不能追溯来源、能不能核对。"}}},
{"cards":{"soc-L1-epistemology":{"kind":"有效但结论假的教训","tip":"看到“论证有效却结论假”→逻辑查结构，前提归认识论。"},"soc-L1-jtb":{"kind":"选非JTB条件/事实性","tip":"选项里的“确定/能证明”不是条件；事实性只认“知道P→P真”。"},"soc-L1-gettier":{"kind":"Gettier说明了什么","tip":"看到“碰巧为真”→选 JTB 不充分；错因是运气，不是信念假。"},"soc-L3-evidentialism":{"kind":"选原则/船主/弱前提","tip":"选“证据不足就信是道德错”原句；攻击论证选 P2。"},"soc-L3-shipowner":{"kind":"船平安到港怎么判","tip":"看到“船平安/没人受伤”→仍有罪，他无权凭当时证据相信。"},"soc-L3-four-replies":{"kind":"选哪项不是四个回应","tip":"四条：致行动、影响行为、会传播、成坏习惯；“可自由选择”排除。"},"soc-L3-voluntarism":{"kind":"James会怎么说/论文","tip":"先查四条件全满足→可凭意志信；证据能定（2+2）→不行。"},"soc-L3-live":{"kind":"给例子判三种属性","tip":"逐项问：会真考虑吗→活；能不选吗→被迫；改变人生吗→重大。"},"soc-L3-self-fulfilling":{"kind":"跳深渊例说明什么","tip":"看到“信了才做得到”→自我实现，说明证据不足的信念可无害。"},"soc-L3-truth-vs-error":{"kind":"门槛严格会怎样","tip":"门槛严→错少但漏真相；“两样都得到”直接排除。"},"soc-L3-reductio":{"kind":"归谬内容/教授批评","tip":"问论证类型→归谬；问教授批评→James 没回应 P1。"},"soc-L5-testimony":{"kind":"哪些算证言","tip":"看到“来源算不算证言”→选范围最宽的，书、照片、新闻都算。"},"soc-L5-autonomy":{"kind":"微积分例/大合作例","tip":"重造微积分→彻底自主更无知；无人能讲全→挑战个人主义。"},"soc-L5-dependence":{"kind":"Hardwig/证言传什么","tip":"外行信认可的专家→有辩护但无底层证据；“已拥有证据”排除。"},"soc-L5-deference":{"kind":"理性服从vs盲从","tip":"看到“问为什么/找第二位医生”→不违背理性服从，盲从才不许问。"},"soc-L5-chain":{"kind":"病理师乱填后果","tip":"先找源头：源头没真实证据→整条链塌，人多、权威都救不了。"},"soc-L5-identify-experts":{"kind":"谁算专家/AI为何更难","tip":"谁算专家→看客观能力不看头衔；AI 题选“流畅自信却会错”。"},"soc-L7-endo-exo":{"kind":"给情景判哪种注意","tip":"自己要看的→内源；被声响、闪光抓过去→外源。"},"soc-L7-selective":{"kind":"大猩猩实验的解释","tip":"大猩猩题→选“专注任务压制无关信息，哪怕很显眼”。"},"soc-L7-selection-bias":{"kind":"判断是哪种数据问题","tip":"入样与特征相关→选择偏差；样本随机但问法诱导→措辞诱导。"},"soc-L7-survivorship":{"kind":"Wald弹孔该装哪","tip":"看到“只研究还在的/成功的”→幸存者偏差；弹孔少处才加装甲。"},"soc-L7-friendship":{"kind":"朋友为何比我朋友多","tip":"看到“朋友比我朋友多”→朋友多的人在更多名单里，被过度代表。"},"soc-L7-unit":{"kind":"计算两种平均班额","tip":"按班=总人数/班数；按学生=Σ班额²/总人数，必更大（50 vs 140）。"},"soc-L7-berkson":{"kind":"入选群体内负相关","tip":"看到“录取/入选群体内两项能力负相关”→伯克森悖论。"},"soc-L7-censoring":{"kind":"短定义/给情景判断","tip":"看到“只统计已发生的+近期更短”→右删失，差异是假象。"},"soc-L7-randomization":{"kind":"自愿者更好/只发阳性","tip":"自愿者好但 RCT 无效→自我选择；只发表支持假设的→抽屉问题。"},"soc-L9-three-levels":{"kind":"推断属于哪个层面","tip":"看到“听者推出字面没说的”→语用，不是语义或逻辑。"},"soc-L9-speech-act":{"kind":"哪句是言语行为","tip":"说出来就完成行动（I promise…）→言语行为；“下雨了”不是。"},"soc-L9-focal-point":{"kind":"无沟通协调选什么","tip":"无沟通协调题→选“人人预计别人也觉得显眼”；不是最好/共同基础。"},"soc-L9-common-knowledge":{"kind":"男孩喊出后改变什么","tip":"各自都知道但不确定别人知道→共享知识；当众喊出→共同知识。"},"soc-L9-common-ground":{"kind":"都懂了为何能装没事","tip":"都懂但没明说→不在共同基础；只有断言才算公开承诺。"},"soc-L9-indirect-speech":{"kind":"论文：为何间接说","tip":"听懂了但没明说→间接言语；听者全懂也照样有效。"},"soc-L9-deniability":{"kind":"判断间接言语的功能","tip":"怕被罚→可否认性；怕伤交情→关系管理；多受众各读各的→战略模糊。"},"soc-L11-bibliotechnic":{"kind":"教授对LLM的立场","tip":"教授立场题→“暂时倾向：LLM 是检索系统”；不是定论。"},"soc-L11-next-token":{"kind":"为何不能加长窗口","tip":"为何不能加长窗口→表约 n^(k+1) 指数爆炸，长序列数据里没有。"},"soc-L11-redescription":{"kind":"“只是预测”推理错在哪","tip":"看到“只是线性代数/下一token所以不思考”就选重描述谬误。"},"soc-L11-hallucination":{"kind":"厕所例说明什么","tip":"看到“答案自信具体却查无出处”→幻觉：文本合理≠事实真。"},"soc-L11-twenty-questions":{"kind":"重采样换答案说明啥","tip":"重采样换答案→“只保持和前文一致，无固定目标”；不是说谎。"},"soc-L11-testimony":{"kind":"LLM与证言收尾观点","tip":"看到“不思考所以学不到”→两回事；可溯源可核查就能传信息。"}}},
{"cards":{"soc-L1-epistemology":{"one":"认识论研究知识、辩护、证据；社会认识论研究前提如何从他人、来源、机构得来。","en":"Epistemology studies knowledge, justification and evidence; social epistemology studies how we get trustworthy premises from others and institutions.","qs":["soc-L1-q07"]},"soc-L1-jtb":{"one":"X 知道 P，当且仅当 P 为真、X 相信 P、X 有辩护；三条各自必要、合起来充分。","en":"Knowledge = justified true belief (individually necessary, jointly sufficient); knowledge is factive; justification rules out lucky guesses.","qs":["soc-L1-q01","soc-L1-e01","soc-L1-q06"]},"soc-L1-gettier":{"one":"Gettier 案例：有辩护的真信念仅因运气为真、不算知识，证明 JTB 不充分（非不必要）。","en":"A justified true belief true only by luck, hence not knowledge; shows JTB is not sufficient.","qs":["soc-L1-q03","soc-L1-q02","soc-L1-e01"]},"soc-L3-evidentialism":{"one":"信念伦理学问：形成信念有无道德责任？Clifford：证据不足而信，永远道德上错。","en":"Ethics of belief: are there moral duties in forming beliefs? Clifford: it is always morally wrong to believe on insufficient evidence.","qs":["soc-L3-q01","soc-L3-q03","soc-L3-e01","soc-L3-q02"]},"soc-L3-shipowner":{"one":"Clifford 船主案：压下怀疑、真诚相信船安全，仍有罪——真诚和好结果都不能代替证据。","en":"Clifford\u0027s shipowner is guilty for believing without evidence; sincerity or a lucky safe arrival does not excuse him.","qs":["soc-L3-q02"]},"soc-L3-four-replies":{"one":"Clifford 驳“只有行动有害”：信念致行动、影响行为、会传播、轻信成坏习惯害集体求真。","en":"Beliefs cause actions, influence behaviour, are communicated to others, and careless believing harms collective truth-seeking.","qs":["soc-L3-q04"]},"soc-L3-voluntarism":{"one":"James：对 live、forced、momentous 且证据无法决定的选项，可合理选择相信。","en":"James: for live, forced, momentous options evidence cannot settle, we may legitimately choose what to believe.","qs":["soc-L3-e01"]},"soc-L3-live":{"one":"James：只有同时是活的、被迫的、重大的选项，才可以先于证据去信。","en":"James: live (each alternative really possible for you), forced (cannot avoid choosing), momentous (life-changing, often irreversible).","qs":["soc-L3-q06","soc-L3-q05"]},"soc-L3-self-fulfilling":{"one":"自我实现信念：证据不足时形成，却通过影响行为帮助自身成真（James 反驳 Clifford）。","en":"A belief adopted without sufficient evidence that helps make itself true by influencing behaviour.","qs":["soc-L3-q07"]},"soc-L3-truth-vs-error":{"one":"James：追求真理与避免错误是两个目标，门槛越严错误越少但越易错过真相。","en":"James: believing truth and shunning error are distinct goals; strict thresholds avoid errors but miss truths.","qs":["soc-L3-q08"]},"soc-L3-reductio":{"one":"James 归谬：Clifford 原则须先于证据被接受，本身无充分证据，按自身标准自我削弱。","en":"James: Clifford\u0027s principle must be accepted prior to evidence, so by its own standard believing it is wrong.","qs":["soc-L3-q10","soc-L3-q09","soc-L3-e01"]},"soc-L5-testimony":{"one":"证言：广义指他人告诉我们的一切（口头、书、照片、新闻、记录等），多数知识依赖它。","en":"Broadly, anything others tell us (speech, books, photos, news, records); most knowledge depends on it.","qs":["soc-L5-q01","soc-L13-q01"]},"soc-L5-autonomy":{"one":"思想自主：凭自己的理性和证据去信；个人主义：个人是首要知识主体。Hardwig 挑战两者。","en":"Autonomy: believe by your own reason and evidence; individualism: individuals are the primary knowers. Hardwig challenges both.","qs":["soc-L5-q06","soc-L5-e01","soc-L5-q07"]},"soc-L5-dependence":{"one":"Hardwig：B 可因承认的专家 A 相信 P 而有辩护，即使 B 没有或看不懂 A 的证据。","en":"Hardwig: B can be justified in believing P because recognised expert A believes it, without A\u0027s evidence.","qs":["soc-L5-q02","soc-L5-q03","soc-L5-e01"]},"soc-L5-deference":{"one":"理性服从：因专业能力差距而非地位接受专家判断，不等于盲从。","en":"Accepting an expert\u0027s judgement in their domain because of a competence gap, not their status.","qs":["soc-L5-q05"]},"soc-L5-chain":{"one":"证言链：辩护可经多人传递，但链条最终必须落在真实证据上。","en":"Passing justification through several people; it can travel but must ultimately terminate in genuine evidence.","qs":["soc-L5-q04","soc-L5-q03"]},"soc-L5-identify-experts":{"one":"专家看客观能力而非头衔；外行无法直接检验，只能靠本身依赖证言的指标。","en":"Experts have objective domain competence; non-experts can only identify them through indicators that themselves depend on testimony.","qs":["soc-L5-q08"]},"soc-L7-endo-exo":{"one":"内源注意由自身目标主动定向，外源注意被显著外部刺激抓走。","en":"Endogenous attention is directed by one\u0027s own goals; exogenous attention is captured by salient external stimuli.","qs":["soc-L7-q01","soc-L19-q04","soc-L19-q05"]},"soc-L7-selective":{"one":"注意让部分信息被加工、其余被压下；专注任务时，连显眼的无关信息也会“看不见”。","en":"Attention makes some information salient and processed; focusing on a task can make salient but irrelevant information effectively invisible.","qs":["soc-L7-q02"]},"soc-L7-selection-bias":{"one":"看入样机制：与研究特征系统相关是选择偏差（selection bias）；无关才有代表性。","en":"If the selection process is systematically related to what is studied, the sample is biased; if not, it is representative.","qs":["soc-L7-e01","soc-L7-q05","soc-L7-q04"]},"soc-L7-survivorship":{"one":"幸存者偏差：只看通过筛选后可见的案例，忽视被淘汰的案例。","en":"Drawing conclusions from cases surviving a filtering process while ignoring those the process removed.","qs":["soc-L7-q03","soc-L7-e01"]},"soc-L7-friendship":{"one":"友谊悖论：多数人朋友比自己的朋友少，因高连接者出现在更多人的朋友样本中。","en":"Most people have fewer friends than their friends do, because well-connected people appear in more friend samples.","qs":["soc-L7-q07"]},"soc-L7-unit":{"one":"分析单位：按不同单位计数/抽样会得出不同但各自为真、回答不同问题的平均数。","en":"The basic unit counted or sampled; different units give different, individually true averages answering different questions.","qs":["soc-L7-q06"]},"soc-L7-berkson":{"one":"Berkson 悖论：按两特征综合门槛筛选，会在被选群体内制造总体中没有的（常为负）相关。","en":"Selecting on a combination of two traits creates a correlation, often negative, absent in the population.","qs":["soc-L7-q09"]},"soc-L7-censoring":{"one":"右删失：观察期结束前未出现结果的案例被排除，使较晚群体只显示短结果。","en":"Excluding cases whose outcomes have not occurred by the window\u0027s end, so later cohorts show only short outcomes.","qs":[]},"soc-L7-randomization":{"one":"自愿参加者本就与别人不同；随机分配参与机会，才能把项目效果与这种差异分开。","en":"Volunteers differ systematically from non-volunteers (self-selection); randomly assigning the offer separates real effects from those differences.","qs":["soc-L7-q10","soc-L7-q08"]},"soc-L9-three-levels":{"one":"句法管结构规则，语义管字面意义，语用管语境中超出字面所传达的内容。","en":"Syntax: structural rules; semantics: conventional literal meaning; pragmatics: what is conveyed in context beyond literal meaning.","qs":["soc-L9-q01"]},"soc-L9-speech-act":{"one":"言语行为：在适当身份/程序/情境下，说话本身完成社会行动、建立规范事实，而非描述世界。","en":"An utterance that, given proper authority and context, itself performs a social action rather than describing.","qs":["soc-L9-q02"]},"soc-L9-focal-point":{"one":"焦点（Schelling 点）：人人预计别人也觉显著的选项，使无沟通协调成为可能，不必最好。","en":"An option enabling coordination without communication because each expects others to find it salient; need not be best.","qs":["soc-L9-q03"]},"soc-L9-common-knowledge":{"one":"共同知识：双方都知道 p，且知道对方知道、知道对方知道自己知道……无限递归。","en":"Both know p, each knows the other knows p, and so on recursively; more than shared knowledge.","qs":["soc-L9-q04"]},"soc-L9-common-ground":{"one":"共同基础：对话者已公开承诺、此后可共同依赖的内容，通常由明确断言加入。","en":"Propositions participants have publicly committed to and can jointly rely on, typically added by explicit assertion.","qs":["soc-L9-q06","soc-L9-e01"]},"soc-L9-indirect-speech":{"one":"间接言语：用语用机制传达 p 而不断言 p，使 p 被理解却不进入共同基础。","en":"Conveying p via pragmatic mechanisms without asserting it, so p is understood but not on record in common ground.","qs":["soc-L9-e01","soc-L9-q06"]},"soc-L9-deniability":{"one":"间接言语保留无辜的字面解释：可免罚（可否认性）、保关系（关系管理）、分受众（战略模糊）。","en":"Indirect speech keeps an innocent literal reading: to avoid punishment (deniability), to save the relationship (relationship management), or to send different messages to different audiences (strategic ambiguity).","qs":["soc-L9-q05","soc-L9-q09","soc-L9-q07","soc-L9-q08"]},"soc-L11-bibliotechnic":{"one":"图书馆技术假说：LLM 是压缩、重组、外推人类文本模式的信息检索系统，而非思考主体。","en":"LLMs are sophisticated information-retrieval systems recombining patterns in human text, not genuinely thinking agents.","qs":["soc-L11-q02","soc-L11-e01"]},"soc-L11-next-token":{"one":"下一 token 预测：按 Pr(下一 token | 前文) 选 token 追加到前文，循环生成。","en":"Generating text by estimating Pr(next token | preceding context), appending the chosen token, and repeating.","qs":["soc-L11-q05"]},"soc-L11-redescription":{"one":"重描述谬误：仅因系统可用低层机制描述（“只是统计”）就推出它没有高层能力。","en":"Inferring a system lacks a high-level capacity merely because its operation can be redescribed in low-level mechanistic terms.","qs":["soc-L11-q01"]},"soc-L11-hallucination":{"one":"幻觉：文本上合理、像答案却缺乏事实支持的生成内容，体现文本合理性≠真。","en":"Generated content that is textually plausible and answer-like but lacks factual support.","qs":["soc-L11-q03"]},"soc-L11-twenty-questions":{"one":"二十问论证（Shanahan）：重采样会走向不同对象，说明模型只保持与前文一致，并无固定目标。","en":"Resampling a twenty-questions game yields different objects, suggesting consistency with prior text rather than a fixed target.","qs":["soc-L11-q04"]},"soc-L11-testimony":{"one":"LLM 是否思考与能否从中获得知识是两个问题；不思考也可传递信息，但须可追溯、可检验。","en":"Whether LLMs think differs from whether we learn from them; outputs must be traceable to sources and checkable.","qs":["soc-L11-q06","soc-L11-e01"]}}},
{"cards":{"soc-L1-epistemology":{"q":"一个完全有效的论证从错误的疾病理论出发，得出假结论。它说明？A. 有效保证结论为真 B. 逻辑查结构，前提可不可靠是认识论问题 C. 前提假的论证不可能有效","a":"B","why":"有效只保证“前提真则结论真”；前提是否可靠要由认识论来查。"},"soc-L1-jtb":{"q":"按 JTB 分析，以下哪项不是“X 知道 P”的条件？A. X 相信 P B. X 对 P 有辩护 C. X 确定 P 不可怀疑 D. P 为真","a":"C. 确定不可怀疑","why":"JTB 只有真、信、辩护三条；确定不是条件。事实性只说“知道→真”。"},"soc-L1-gettier":{"q":"小张看一向很准的天气 App 显示 25℃（其实已卡住不更新），而当时恰好真是 25℃。她的信念属于？A. 知识 B. 盖梯尔案例 C. 无辩护的猜测","a":"B. 盖梯尔案例","why":"有辩护的真信念，但为真靠运气：使它为真的不是她依据的证据。"},"soc-L3-evidentialism":{"q":"假如 Clifford 的船主的船平安到达，Clifford 会怎么说？A. 信念为真，所以有辩护 B. 没人受伤，没做错 C. 仍有罪，他无权凭那些证据相信","a":"C. 仍有罪","why":"Clifford 评的是信念是否基于充分证据，结果真假、有无伤害都不改变判断。"},"soc-L3-shipowner":{"q":"船主压下怀疑、真诚相信旧船安全，船沉了。他辩解“我是真心相信的”。Clifford 怎么回应？","a":"真诚不能免责，他无权这样信","why":"评价看信念的依据：他压下怀疑、证据不足，真诚代替不了证据。"},"soc-L3-four-replies":{"q":"有人说“信什么是我自己的事，只有行动会伤人”。Clifford 会用哪点反驳？A. 信念会传给别人 B. 信念能自由选择 C. 信念会自我实现","a":"A. 信念会传给别人","why":"信念不是私人的，是 Clifford 四个回应之一；B、C 都是 James 的方向。"},"soc-L3-voluntarism":{"q":"按 James 的意志主义（voluntarism），你可以因为喜欢就选择相信 2+2=5 吗？","a":"不可以","why":"只适用于活的、被迫的、重大的且证据定不了的选项；证据能定就看证据。"},"soc-L3-live":{"q":"对多数人，在 Subway 选白面包还是香草面包属于？A. 既不活也不被迫 B. 活、被迫且重大 C. 重大但不活 D. 活且被迫，但不重大","a":"D","why":"两种面包都会真考虑、也非选不可，但影响很小，不重大。"},"soc-L3-self-fulfilling":{"q":"小美相信对方可能喜欢自己，于是更主动交流，关系真的建立了。James 用这类例子反驳 Clifford 的什么？","a":"证据不足而信总是有害","why":"自我实现信念靠改变行为帮自己成真，证据不足却无害甚至有益。"},"soc-L3-truth-vs-error":{"q":"法院把定罪的证据门槛设得极高。按 James，这会带来什么？A. 冤案少、漏判多 B. 冤案多、漏判少 C. 两者都少","a":"A. 冤案少、漏判多","why":"门槛越严，错误越少，但错过的真相越多；求真与避错是两个目标。"},"soc-L3-reductio":{"q":"James 说：Clifford 原则 P 必须先于证据被接受，本身没有充分证据，所以违反了自己。这是哪种论证？A. 归谬 B. 盖梯尔反例 C. 自我实现信念","a":"A. 归谬（reductio）","why":"先假设 P，推出 Clifford 违反 P 的矛盾，从而否定 P 的普遍性。"},"soc-L5-testimony":{"q":"你从纪录片里得知深海鱼会发光。按本课的广义定义，这个知识来源是？A. 证言（testimony） B. 第一手证据 C. 不算知识来源","a":"A. 证言","why":"证言广义指别人告诉我们的一切，书、照片、纪录片都算。"},"soc-L5-autonomy":{"q":"大型天文合作发表一个结果，没有任何单个成员能从头到尾解释。这主要挑战？A. 知识的事实性 B. 专家的存在 C. 认识论个人主义 D. Clifford 证据主义","a":"C. 认识论个人主义","why":"个人主义说个人是首要知识主体；这里知识分散在团队里，无人独有。"},"soc-L5-dependence":{"q":"你看不懂工程报告，但因你认可的结构工程师说桥安全而相信。Hardwig 认为你？A. 没有辩护 B. 有辩护，但无底层证据 C. 已拥有工程证据","a":"B. 有辩护，但无底层证据","why":"认识论依赖：证言能传递辩护，但不传递专家掌握的底层证据。"},"soc-L5-deference":{"q":"医生说你需要手术，你问“为什么”，还想再找一位医生看。这违背理性服从（rational deference）吗？","a":"不违背","why":"理性服从因专业能力接受判断，仍可提问、要第二意见，不是盲从。"},"soc-L5-chain":{"q":"十个人层层转述“某草药能治感冒”，但从没有人做过试验。这条证言链能给最后一个人辩护吗？","a":"不能，链条没落在证据上","why":"证言链可以很长，但必须终止于真实证据；多人重复不等于有证据。"},"soc-L5-identify-experts":{"q":"按课程，生成式 AI 为何让识别真专家更难？A. AI 让过往记录完全可靠 B. AI 流畅自信却会错，削弱流畅与专业的联系 C. AI 废除了资格认证","a":"B","why":"外行常凭流畅、术语判断专业；AI 错时也流畅，这条线索就失灵了。"},"soc-L7-endo-exo":{"q":"在嘈杂食堂里你主动听朋友讲话，是哪种注意？突然有人摔碎盘子你回头，又是哪种？","a":"前者内源，后者外源","why":"内源注意由自己的目标定向；外源注意被响、亮、突然的外部刺激抓走。"},"soc-L7-selective":{"q":"数传球的观众很多没注意到大猩猩走过。最好的解释？A. 视力差 B. 专注任务增强相关信息、压制其他信息，哪怕很显眼 C. 观众故意撒谎 D. 大猩猩其实看不见","a":"B","why":"选择性注意：专注目标任务时，显眼但无关的信息也会被压下。"},"soc-L7-selection-bias":{"q":"对完全随机的选民样本问：“若知道 X 掩盖过罪行，你还支持她吗？”结果主要被什么扭曲？A. 措辞诱导 B. 幸存者偏差 C. 选择偏差","a":"A. 措辞诱导（push polling）","why":"样本随机、有代表性；失真来自问法操纵答案，不是入样机制。"},"soc-L7-survivorship":{"q":"只研究还在营业的成功公司，总结出“辍学创业更易成功”。这犯了？A. 幸存者偏差 B. 伯克森悖论 C. 诱导式民调","a":"A. 幸存者偏差（survivorship bias）","why":"同样辍学创业却倒闭的公司被筛掉、看不见，成功率被高估。"},"soc-L7-friendship":{"q":"随机抽一个用户，和随机抽“某人关注的账号”，哪种更可能抽到粉丝很多的账号？","a":"后者，热门账号出现在更多名单里","why":"沿关系抽样会过度代表高连接者，这正是友谊悖论的机制。"},"soc-L7-unit":{"q":"一所学校有 10 个 10 人班和 2 个 100 人班。按班级算的平均班级人数，和按学生体验算的平均各是多少？","a":"25 和 70","why":"按班：300/12=25；按学生加权：(100×10+200×100)/300=70。"},"soc-L7-berkson":{"q":"某奖学金看成绩或特长，综合够线就录取。获奖者中成绩越好特长越弱，这说明？A. 成绩损害特长 B. 伯克森悖论 C. 自我选择","a":"B. 伯克森悖论（Berkson\u0027s paradox）","why":"按综合门槛筛选，会在入选者内制造总体中并不存在的负相关。"},"soc-L7-censoring":{"q":"研究 2020 年截止，只统计已离婚夫妇的婚姻时长，发现近年结婚的婚姻更短。最该警惕？A. 右删失 B. 措辞诱导 C. 友谊悖论","a":"A. 右删失（right-censoring）","why":"近年结婚、还没离婚的人被排除，只剩离得早的，婚姻显得更短。"},"soc-L7-randomization":{"q":"健康项目中自愿参加者更健康，但随机比较无显著效果。最好的解释？A. 对照组有幸存者偏差 B. 随机试验无效 C. 更健康的员工更愿意参加 D. 项目使人更健康","a":"C. 自我选择","why":"随机比较显示项目无效；差异来自谁选择参加，不是项目效果。"},"soc-L9-three-levels":{"q":"朋友问“我新发型怎么样？”你答“你今天的鞋真好看”。对方推出你不喜欢发型，这属于？A. 句法 B. 语义 C. 语用","a":"C. 语用（pragmatics）","why":"字面在夸鞋，听者靠语境和合作预期推出言外之意，这是语用。"},"soc-L9-speech-act":{"q":"婚礼彩排时，牧师说“我宣布你们结为夫妻”。这对新人此时真的结婚了吗？","a":"没有，言语行为需适当情境","why":"言语行为要在适当身份、程序和情境下说出才完成社会行动，彩排无效。"},"soc-L9-focal-point":{"q":"两人约好在悉尼见面却忘了定地点，游客多半会去 Opera House。它为什么成了焦点（focal point）？","a":"双方都预计对方也觉得它显著","why":"焦点不是客观最好的选项，而是人人预计别人也会注意到的显著选项。"},"soc-L9-common-knowledge":{"q":"全班每人私下都知道考试取消了，但没人确定别人也知道。这是？A. 共同知识 B. 共享知识（shared knowledge） C. 共同基础","a":"B. 共享知识","why":"共同知识还要“都知道对方知道”并无限递归；各自私下知道不够。"},"soc-L9-common-ground":{"q":"同事暗示想借钱，你听懂了但没接话。之后能把“他提过借钱”当作双方已公开承认的事来引用吗？","a":"不能，p 没进共同基础","why":"双方都懂不等于 p 已被公开承诺；明确断言的内容才进共同基础。"},"soc-L9-indirect-speech":{"q":"老板对员工说：“这份报告周一前能完成就太好了。”员工听出这是要求。这是？A. 言语行为 B. 间接言语 C. 共同知识","a":"B. 间接言语（indirect speech）","why":"传达了“周一前完成”的要求，却没有直接断言或下命令。"},"soc-L9-deniability":{"q":"“要不要上来看个电影？”作为委婉求爱，主要起什么作用？A. 可信的可否认性，防法律惩罚 B. 关系管理：被拒仍能保住友谊 C. 制造共同知识","a":"B. 关系管理","why":"这里的风险是社交尴尬而非惩罚；被拒双方仍可当作只是看电影。"},"soc-L11-bibliotechnic":{"q":"图书馆技术假说（bibliotechnic hypothesis）把 LLM 看作什么？A. 有意识的思考者 B. 信息检索系统 C. 只会逐字复制的数据库","a":"B. 信息检索系统","why":"它压缩、检索、重组并外推文本模式，不只是复制；教授暂定倾向此说。"},"soc-L11-next-token":{"q":"一个 order 2 的 Markov 生成器，词表有 100 个词，完整的概率表大约有多少条目？","a":"100³ = 1,000,000","why":"条目约 n^(k+1)，k=2 时为 100³；窗口每加一个词，表就放大 100 倍。"},"soc-L11-redescription":{"q":"“人脑只是神经元在放电，所以人不会真正思考。”这个推理犯了什么错？","a":"重描述谬误（redescription fallacy）","why":"能用低层机制描述，不足以否认高层能力，还需要额外论证。"},"soc-L11-hallucination":{"q":"LLM 自信地给出某小镇“官方人口”的精确数字，却查无出处。按课程这属于？A. 幻觉 B. 重描述谬误 C. 右删失","a":"A. 幻觉（hallucination）","why":"回答看似合理具体，却没有事实支持；文本合理性不等于真。"},"soc-L11-twenty-questions":{"q":"让模型玩二十问，从同一步重新生成后，它“心里想的”东西变了。教授据此推断什么？","a":"它只求与前文一致，无固定目标","why":"重采样走向不同对象，说明连贯来自贴合前文，而非事先定好的答案。"},"soc-L11-testimony":{"q":"词典没有意识。有人据此说“所以从词典里学不到知识”。按 L11 的结尾观点，错在哪？","a":"是否思考与能否传递知识是两回事","why":"不思考的系统也能传递信息，关键在主张能否追溯来源、能否核对。"}}},
{"cards":{"soc-L1-epistemology":{"name":"认识论与社会认识论","one":"认识论查前提靠不靠谱；社会认识论查前提从谁那来。","pts":["逻辑、概率查推理；认识论（epistemology）查前提","推理有效但前提假，结论照样可能假","社会认识论问：来源可靠吗、该信谁、信息太多怎么办"],"ex":"完全有效的论证从错的疾病理论出发，得出假结论。","trap":"以为推理有效就够了；前提可不可靠是认识论的事。","ana":"认识论像信息质检员，问“你凭什么这么确定”；社会认识论再问：你信的老师、课本、新闻又凭什么可靠。","words":[{"en":"valid argument","zh":"有效论证","m":"前提真则结论必真"},{"en":"validity","zh":"有效性","m":"推理结构是否保真"},{"en":"premise","zh":"前提","m":"论证中用来支持结论的句子"},{"en":"reliable","zh":"可靠的","m":"通常能给出真信息"},{"en":"logical form","zh":"逻辑形式","m":"论证的结构，不看内容"},{"en":"theory of disease","zh":"疾病理论","m":"关于病因的学说"},{"en":"social epistemology","zh":"社会认识论","m":"研究知识的社会来源"},{"en":"concerned with","zh":"关注","m":"研究的对象是"},{"en":"source","zh":"来源","m":"信息从哪里来"}]},"soc-L1-jtb":{"name":"JTB：真、信、辩护","one":"X 知道 P = P 为真 + X 相信 P + X 有辩护，缺一不可。","pts":["事实性（factive）：知道 P→P 真；假的只能信不能知","反过来不成立：P 真不代表你知道 P","辩护 = 有好理由，不是瞎猜碰对；有辩护仍可能假"],"ex":"凭“Telstra 是电信公司”猜对塔名：真、也信，但没辩护。","trap":"把“确定无疑、能证明”当第四个条件；JTB 只有三条。","ana":"像考试满分要三样齐：答案对（真）、你写了它（信）、有正确过程（辩护），缺一样都不算真会。","words":[{"en":"analysis","zh":"分析","m":"给概念下定义的尝试"},{"en":"condition","zh":"条件","m":"成立所需满足的要求"},{"en":"certain","zh":"确定的","m":"毫无疑问"},{"en":"cannot be doubted","zh":"不可怀疑","m":"连怀疑的可能都没有"},{"en":"iff (if and only if)","zh":"当且仅当","m":"双向条件，互为充要"},{"en":"factive","zh":"事实性的","m":"蕴含所说内容为真"},{"en":"prove","zh":"证明","m":"给出决定性的论证"},{"en":"good evidence","zh":"好的证据","m":"通常能支持信念的理由"},{"en":"claim","zh":"主张","m":"被提出的说法"},{"en":"justified","zh":"有辩护的","m":"有好理由相信"},{"en":"evidence","zh":"证据","m":"支持信念的理由或材料"},{"en":"lighting","zh":"光线","m":"看东西时的照明情况"}]},"soc-L1-gettier":{"name":"盖梯尔案例","one":"有辩护的真信念只是碰巧为真，不算知道：JTB 不充分。","pts":["真、信、辩护三条都满足，但为真靠运气","让它为真的东西，不是你证据指向的东西","只说明 JTB 不充分，不说明哪条不必要"],"ex":"一向准的钟昨晚停在 3 点，你看它信现在 3 点，恰好真是 3 点。","trap":"以为 Gettier 说明辩护或真不必要；它只攻击充分性。","ana":"一向很准的钟其实昨晚停了，你看它显示 3 点就信现在 3 点，此刻恰好真是 3 点：碰巧对，不算知道。","words":[{"en":"Gettier case","zh":"盖梯尔案例","m":"有辩护真信念却非知识的反例"},{"en":"intuitively","zh":"直觉上","m":"凭直观判断"},{"en":"lack","zh":"缺乏","m":"没有"},{"en":"by luck","zh":"靠运气","m":"碰巧"},{"en":"track","zh":"追踪、对应","m":"证据真正指向的对象"},{"en":"stranger","zh":"陌生人","m":"不认识的人"},{"en":"most directly","zh":"最直接地","m":"最主要说明的"}]},"soc-L3-evidentialism":{"name":"证据主义与信念伦理学","one":"Clifford：证据不足就信，任何时候都是道德上错。","pts":["证据主义（evidentialism）：信念要和证据成比例","错的是形成过程：后来为真、没人受伤都不洗白","P1 有不伤人义务，P2 证据不足的信念总伤人；P2 最弱"],"ex":"船主压下疑虑信旧船安全；船平安到达，Clifford 仍判他有罪。","trap":"以为信念后来为真或没人受伤就没错；只看证据够不够。","ana":"像没核实就转发谣言：就算后来证实是真的，当初轻信仍不负责。","words":[{"en":"always, everywhere, for anyone","zh":"任何时候、任何地方、任何人","m":"原则毫无例外"},{"en":"duty","zh":"义务","m":"道德上必须做的事"},{"en":"harm","zh":"伤害","m":"对他人造成损害"},{"en":"proportioned to evidence","zh":"与证据相称","m":"信多强看证据多强"},{"en":"private / trivial","zh":"私人的 / 琐碎的","m":"只关自己 / 无关紧要"},{"en":"ethics of belief","zh":"信念伦理学","m":"相信是否有道德对错"},{"en":"principle","zh":"原则","m":"普遍适用的规则"},{"en":"insufficient evidence","zh":"证据不足","m":"证据不够支持结论"},{"en":"capture","zh":"准确表达","m":"抓住要点"},{"en":"unwise","zh":"不明智的","m":"不聪明但不一定不道德"},{"en":"morally wrong","zh":"道德上错误","m":"违反道德义务"}]},"soc-L3-shipowner":{"name":"船主案例","one":"船主压下怀疑真诚信船安全，Clifford 判他有罪：无权这样信。","pts":["真诚不能代替证据","船平安到达也有罪：评的是依据，不是结果","同类：愤怒暴民碰巧指控对了，也错"],"ex":"酒驾平安到家：结果好，做法仍错。","trap":"以为没人受伤或信念碰巧为真，船主就无罪。","ana":"像厨师明知食材可能变质，却说服自己“应该没事”就上菜：就算没人吃坏肚子，做法也已经错了。","words":[{"en":"shipowner","zh":"船主","m":"拥有船的人"},{"en":"guilty","zh":"有罪的","m":"应受谴责"},{"en":"no right to believe","zh":"无权相信","m":"没资格这样信"},{"en":"turned out true","zh":"结果为真","m":"事后证明是对的"},{"en":"arrived safely","zh":"平安到达","m":"船没沉"}]},"soc-L3-four-replies":{"name":"Clifford 四个回应","one":"反驳“只有行动会错、信念是私事”：Clifford 给四条理由。","pts":["信念导致行动；每个信念都影响行为","信念不是私人的，会传给别人、被别人依赖","轻信养成坏习惯，败坏集体求真"],"ex":"Pizzagate：无证据的说法网上传播，有人持枪闯进披萨店。","trap":"“信念能自由选择”是 James 的方向，不是 Clifford 的回应。","ana":"在群里随口说“那家店用地沟油”：你没做什么，但别人信了、转发了、不去了，“只是想想”也会伤人。","words":[{"en":"objection","zh":"反对意见","m":"对某观点的质疑"},{"en":"communicated","zh":"被传达","m":"传给别人"},{"en":"careless believing","zh":"轻率地相信","m":"不核实就信"},{"en":"habit","zh":"习惯","m":"反复形成的倾向"},{"en":"collective truth-seeking","zh":"集体求真","m":"社会一起寻找真相"},{"en":"freely chosen","zh":"自由选择的","m":"想信就能信"}]},"soc-L3-voluntarism":{"name":"意志主义（James）","one":"James：选项活的、被迫、重大且证据定不了时，可以选择去信。","pts":["意志主义（voluntarism）出自《信仰的意志》","四个条件缺一不可；证据能定的仍要看证据","不是想信啥信啥：不能信 2+2=5"],"ex":"相信恋人喜欢自己、相信自己能跳过裂缝、能读完大学。","trap":"以为 James 允许随意相信；证据能决定的，他也要看证据。","ana":"像决定要不要相信一个新朋友：证据还不够，但你必须表态，James 认为这时可以合理地选择去相信。","words":[{"en":"genuine option","zh":"真正的选项","m":"活、被迫、重大的选择"},{"en":"risk","zh":"风险","m":"可能出错的代价"},{"en":"willing to take","zh":"愿意承担","m":"主动接受"},{"en":"The Will to Believe","zh":"《信仰的意志》","m":"James 的文章"}]},"soc-L3-live":{"name":"活的、被迫、重大选项","one":"活的=真会考虑；被迫=躲不掉；重大=改变人生。三者独立。","pts":["活的（live）：当事人心理上真会考虑，因人而异","被迫：拖着不选也等于选了一边，躲不掉","重大：影响人生，机会独特、常不可逆"],"ex":"Subway 选白面包还是香草：活、被迫，但不重大；上不上大学拖着=选不去。","trap":"把“活的”当成“重要的”；或以为不做决定就能躲开被迫选项。","ana":"“读研还是工作”是活的，“当火星国王”不是；聚餐拖到饭点等于没去；接不接出国工作才算重大。","words":[{"en":"live","zh":"活的","m":"你真可能选它"},{"en":"forced","zh":"被迫的","m":"必须选一个"},{"en":"momentous","zh":"重大的","m":"影响人生"},{"en":"herb bread","zh":"香草面包","m":"Subway 的一种面包"},{"en":"putting it off","zh":"拖延","m":"推迟做决定"},{"en":"failing to choose","zh":"没做选择","m":"不表态"},{"en":"effectively amounts to","zh":"实际上等于","m":"效果相同"},{"en":"settles the question","zh":"解决问题","m":"决定了答案"},{"en":"for most people","zh":"对大多数人而言","m":"一般情况下"},{"en":"irreversible","zh":"不可逆的","m":"做了就无法撤回"}]},"soc-L3-self-fulfilling":{"name":"自我实现信念","one":"证据不足时先信，信念改变行为，反过来帮自己成真。","pts":["自我实现信念（self-fulfilling belief）：James 反 Clifford 的反例","这类信念不但无害，还可能有益","信念是成功的必要条件，不是充分条件"],"ex":"相信自己能跳过裂缝，就会全力起跳，更可能跳过去。","trap":"以为相信就一定成功；百米深渊信了也跳不过。","ana":"相信自己能讲好演讲，于是更敢抬头、声音更稳，结果真讲好了：信念帮自己成了真。","words":[{"en":"chasm","zh":"深渊、裂缝","m":"很宽很深的沟"},{"en":"leap","zh":"跳跃","m":"用力跳过去"},{"en":"conclusive evidence","zh":"决定性证据","m":"足以下定论的证据"},{"en":"adopted","zh":"采纳的","m":"接受下来的"},{"en":"irrational","zh":"不理性的","m":"没有道理的"},{"en":"self-fulfilling","zh":"自我实现的","m":"信念帮自己成真"}]},"soc-L3-truth-vs-error":{"name":"追求真理 vs 避免错误","one":"求真和避错是两个目标：门槛越严，错越少，但漏掉的真相越多。","pts":["严门槛：假信念少、漏真相多；松门槛相反","怎么权衡不由证据决定，是态度选择","Clifford 站在“只避错”一端"],"ex":"法院定罪门槛极高：冤案少，但漏判多。","trap":"以为严门槛能同时少犯错又不漏真相。","ana":"像垃圾邮件过滤器：设得太严，少收垃圾但会误拦重要邮件；设得太松，重要邮件都收到但垃圾也多。","words":[{"en":"threshold","zh":"门槛、阈值","m":"多少证据才相信"},{"en":"strict","zh":"严格的","m":"要求很高"},{"en":"false belief","zh":"假信念","m":"内容为假的信念"},{"en":"missing truths","zh":"错过真相","m":"该信的真东西没信"},{"en":"entirely","zh":"完全地","m":"百分之百"}]},"soc-L3-reductio":{"name":"James 的归谬","one":"James：Clifford 原则本身没充分证据却要先接受，自打自脸。","pts":["归谬（reductio）：假设 P，推出矛盾，所以非 P","原则规定怎么评证据，所以必须先于证据接受","教授批评：James 没回应 P1（不伤害他人的义务）"],"ex":"Clifford 在证据不足时相信“不能在证据不足时相信”。","trap":"以为教授批评的是归谬无效；他批评的是没回应 P1。","ana":"像有人宣布“不要相信任何没写在合同里的规则”，可这条规则本身并没写在合同里。","words":[{"en":"reductio","zh":"归谬法","m":"由假设推出矛盾来否定它"},{"en":"prior to","zh":"在……之前","m":"先于"},{"en":"weighing evidence","zh":"权衡证据","m":"评价证据的分量"},{"en":"by its own standard","zh":"按它自己的标准","m":"用它自己的要求衡量"},{"en":"overwhelming","zh":"压倒性的","m":"极其充分的"},{"en":"criticism","zh":"批评","m":"指出不足"},{"en":"logically invalid","zh":"逻辑上无效","m":"推理结构有问题"}]},"soc-L5-testimony":{"name":"证言","one":"证言（testimony）= 别人告诉你的一切；大多数知识靠它。","pts":["包括口头、书、照片、新闻、纪录片、社交媒体","不只是法庭证词","不可缺少但不稳定：人会说谎、记错、误解"],"ex":"没去过巴西却知道首都；从纪录片得知深海鱼会发光。","trap":"把证言理解成只有法庭宣誓证词或专家报告。","ana":"你知道自己的生日，其实是爸妈和出生证明告诉你的：你当时并不记得，这就是靠证言知道。","words":[{"en":"broad sense","zh":"广义","m":"范围最宽的意思"},{"en":"sworn statement","zh":"宣誓证词","m":"在法庭发誓后说的话"},{"en":"court of law","zh":"法庭","m":"审案的地方"},{"en":"certified","zh":"经认证的","m":"有正式资格的"},{"en":"documentary","zh":"纪录片","m":"记录真实事件的影片"}]},"soc-L5-autonomy":{"name":"思想自主与认识论个人主义","one":"思想自主=只凭自己理性和证据信；个人主义=个人是知识主体。","pts":["思想自主（intellectual autonomy）：康德启蒙理想","微积分例：事事自己重造，反而更无知、更不可靠","大合作例：没人能独自讲全→挑战认识论个人主义"],"ex":"天文大合作发一个结果，没任何单个成员能从头到尾解释。","trap":"以为自主就是事事亲验；或把大合作例当成在挑战事实性。","ana":"像坚持“定理都要自己证一遍才信”的学生，学到的反而少；把知识看成每人各自的存折，就是个人主义。","words":[{"en":"epistemic autonomy","zh":"认识自主","m":"独立形成信念"},{"en":"reinvent","zh":"重新发明","m":"从头再造一遍"},{"en":"calculus","zh":"微积分","m":"一门数学"},{"en":"from scratch","zh":"从零开始","m":"不借助已有成果"},{"en":"less informed","zh":"知道得更少","m":"信息更少"},{"en":"domain","zh":"领域","m":"某个专业范围"},{"en":"collaboration","zh":"合作","m":"多人一起做研究"},{"en":"astronomy","zh":"天文学","m":"研究天体的科学"},{"en":"from start to finish","zh":"从头到尾","m":"完整地"},{"en":"challenge","zh":"挑战、质疑","m":"对观点构成问题"},{"en":"existence","zh":"存在","m":"有没有"}]},"soc-L5-dependence":{"name":"认识论依赖","one":"外行可因认可的专家相信 P 而有辩护，哪怕没有专家的证据。","pts":["认识论依赖（epistemic dependence）：辩护靠别人","证言传的是辩护，不传底层证据","不等于专家永远对，也不要求自己验证"],"ex":"病理师→医生→病人：病人没看切片，仍有辩护信肿块不是癌。","trap":"以为证言把底层证据也传给了病人。","ana":"飞行员说前方有气流请系好安全带，你看不懂仪表，但因为信任飞行员，你有理由照做。","words":[{"en":"layperson","zh":"外行","m":"非专家的普通人"},{"en":"recognised expert","zh":"被承认的专家","m":"你认可的相关专家"},{"en":"possess","zh":"拥有","m":"手里有"},{"en":"pathologist","zh":"病理医生","m":"看切片做诊断的医生"},{"en":"transmit","zh":"传递","m":"从一人传给另一人"},{"en":"underlying evidence","zh":"底层证据","m":"最原始的数据和观察"},{"en":"diagnosis","zh":"诊断","m":"医生对病情的判断"},{"en":"verify","zh":"核实","m":"自己检查是否属实"}]},"soc-L5-deference":{"name":"理性服从","one":"理性服从（rational deference）：因对方更懂而接受判断，不是因地位。","pts":["认定对方是相关专家后，通常就该接受其判断","仍可提问、要第二意见；盲从才是不许问","专家判断最终也要连到证据"],"ex":"合格电工说线路有火灾风险，不能因修理贵就把自己直觉看得一样重。","trap":"把理性服从当成因地位服从，或以为不许提问。","ana":"导航说前方封路要绕行，你虽然觉得直走更近，但它掌握实时路况，就该认真听它的。","words":[{"en":"deference","zh":"服从、遵从","m":"接受他人判断"},{"en":"blind obedience","zh":"盲从","m":"不问理由地服从"},{"en":"social status","zh":"社会地位","m":"身份高低"},{"en":"second opinion","zh":"第二意见","m":"再问另一位专家"},{"en":"judgement","zh":"判断","m":"对事情下的结论"},{"en":"forbid","zh":"禁止","m":"不允许"}]},"soc-L5-chain":{"name":"证言链","one":"辩护可以经多人逐层传，但链条源头必须有真实证据。","pts":["链可以很长，但不能悬空","源头没证据，整条链的辩护一起崩","很多人重复 P ≠ P 有证据"],"ex":"十个人层层转述“草药治感冒”，没人做过试验：最后一人没辩护。","trap":"以为转述的人越多、链越长，辩护越强。","ana":"像传话游戏：消息可以传过很多人，但第一个人必须真的看到过，否则后面传的都是空中楼阁。","words":[{"en":"chain of justification","zh":"辩护链","m":"辩护一层层传下去"},{"en":"collapse","zh":"崩溃","m":"整体失效"},{"en":"terminate in","zh":"终止于","m":"最终落在"},{"en":"genuine","zh":"真实的","m":"不是假的"},{"en":"sample","zh":"样本","m":"拿来检验的组织"},{"en":"at random","zh":"随便地","m":"没根据地乱填"},{"en":"authority","zh":"权威","m":"地位带来的影响力"}]},"soc-L5-identify-experts":{"name":"专家与识别专家的难题","one":"专家=客观能力而非头衔；外行只能靠指标认专家，指标也是证言。","pts":["专家（expert）：能看懂外行看不懂的证据，靠训练、经验、工具","指标：资格认证、过往记录、制度支持；网上好评也是证言","AI 流畅自信却会错，流畅不再等于专业"],"ex":"“量子心态营养教练”不算专家；AI 全错时也满口术语、语气自信。","trap":"把头衔、术语多、语气自信、表达流畅当成专家标志。","ana":"你不懂法律，很难判断哪个律师真厉害，只能看执照、胜诉记录和推荐，而这些也是别人告诉你的。","words":[{"en":"generative AI","zh":"生成式人工智能","m":"能生成文字图片的 AI"},{"en":"fluent","zh":"流畅的","m":"说得顺、像内行"},{"en":"fluency","zh":"流畅性","m":"表达顺畅"},{"en":"confident","zh":"自信的","m":"语气很肯定"},{"en":"track record","zh":"过往记录","m":"以前做得好不好"},{"en":"certification","zh":"资格认证","m":"正式的资格证明"},{"en":"abolish","zh":"废除","m":"取消"},{"en":"expertise","zh":"专业能力","m":"专家具备的知识技能"},{"en":"competence","zh":"能力","m":"能做好某事的本领"},{"en":"always right","zh":"永远正确","m":"从不出错"}]},"soc-L7-endo-exo":{"name":"内源性 vs 外源性注意","one":"内源注意=自己定目标去看；外源注意=被外界刺激抓走。","pts":["内源（endogenous）：我决定看什么，主动","外源：响、亮、突然的东西把注意抢走，被动","广告、媒体利用外源注意（注意力武器化）"],"ex":"食堂里主动听朋友讲话是内源；有人摔碎盘子你回头是外源。","trap":"以为外源注意更准确；它只是更难抗拒。","ana":"你在书店主动找某本书是内源注意；突然有人打翻书架、你忍不住回头，是外源注意。","words":[{"en":"endogenous","zh":"内源的","m":"由自身目标引导"},{"en":"exogenous","zh":"外源的","m":"由外界刺激引起"},{"en":"fire alarm","zh":"火警警报","m":"着火时响的铃"},{"en":"exits","zh":"出口","m":"离开的门"},{"en":"shift of attention","zh":"注意转移","m":"注意力换到别处"},{"en":"notification","zh":"通知","m":"手机弹出的提醒"},{"en":"stimulus","zh":"刺激","m":"引起反应的外界事物"},{"en":"serial search","zh":"串行搜索","m":"一处一处地找"}]},"soc-L7-selective":{"name":"注意与选择性注意","one":"注意只加工部分信息，其余被压下；专心时显眼的东西也看不见。","pts":["注意（attention）必然有选择，本身不是坏事","眼睛看着≠信息被加工；漏看不是视力差或撒谎","偏差=系统性偏离真相，不是政治偏见"],"ex":"数白衣球员传球次数，很多人没看到穿大猩猩服的人走过。","trap":"把漏看归因于视力差、粗心、撒谎，或以为大猩猩真看不见。","ana":"注意力像舞台追光灯：照到的演员一清二楚，没照到的人虽也在台上，却几乎被忽略。","words":[{"en":"gorilla suit","zh":"大猩猩服装","m":"实验里的人穿的衣服"},{"en":"fail to notice","zh":"没注意到","m":"看漏了"},{"en":"eyesight","zh":"视力","m":"眼睛看东西的能力"},{"en":"deliberately","zh":"故意地","m":"有意这样做"},{"en":"basketball passes","zh":"篮球传球","m":"球员之间传球"},{"en":"lecture theatre","zh":"阶梯教室","m":"大讲堂"},{"en":"salient","zh":"显著的","m":"很突出、引人注意"},{"en":"suppress","zh":"压制","m":"让其不被加工"},{"en":"task-relevant","zh":"与任务相关的","m":"对当前任务有用的"},{"en":"focal attention","zh":"焦点注意","m":"集中在目标上的注意"}]},"soc-L7-selection-bias":{"name":"选择偏差与代表性样本","one":"先问样本怎么进来的：入样和研究特征挂钩就是选择偏差。","pts":["选择偏差（selection bias）：样本再大也修不好","代表性看问题：同一抽法对此题无偏，对彼题有偏","问法诱导、谎报是测量误差，不是选择偏差"],"ex":"球迷节目问“最好的 3-0 球队”，96% 选 Eagles：入样偏向球迷。","trap":"以为抽样随机结果就可信；或把措辞诱导、谎报也叫选择偏差。","ana":"在健身房门口问“多久运动一次”是选择偏差；尝汤要先搅匀再舀，这一勺才代表整锅。","words":[{"en":"pollster","zh":"民调员","m":"做民意调查的人"},{"en":"push polling","zh":"诱导式民调","m":"用措辞操纵回答"},{"en":"wording","zh":"措辞","m":"问题怎么写"},{"en":"distorted","zh":"被扭曲的","m":"结果不准"},{"en":"cover up a crime","zh":"掩盖罪行","m":"隐瞒犯罪"},{"en":"over-/under-reporting","zh":"多报/少报","m":"回答高于或低于实际"},{"en":"measurement error","zh":"测量误差","m":"数据本身记录不准"},{"en":"respondent","zh":"受访者","m":"回答调查的人"},{"en":"random sample","zh":"随机样本","m":"每人入样机会相同"},{"en":"representative","zh":"有代表性的","m":"能反映总体"},{"en":"population","zh":"总体","m":"想研究的全部对象"},{"en":"voter","zh":"选民","m":"有投票权的人"}]},"soc-L7-survivorship":{"name":"幸存者偏差","one":"只看通过筛选留下来的案例，忘了被淘汰的，就是幸存者偏差。","pts":["幸存者偏差（survivorship bias）：缺失不随机，缺失本身是信息","先问：要通过什么筛选才能进数据？","例：现任教练、还在的基金、化石只剩硬组织"],"ex":"Wald：返航轰炸机发动机弹孔少，该给发动机加装甲，中弹的没回来。","trap":"直接给弹孔最多的部位加装甲。","ana":"看到街上的老房子都很结实，就以为“以前的房子质量更好”，却忘了建得差的老房子早就被拆了。","words":[{"en":"bullet holes","zh":"弹孔","m":"子弹打出的洞"},{"en":"bomber","zh":"轰炸机","m":"投炸弹的飞机"},{"en":"fuselage","zh":"机身","m":"飞机主体"},{"en":"armour","zh":"装甲","m":"加装防护钢板"},{"en":"concentrated","zh":"集中的","m":"聚在某处"},{"en":"engine","zh":"发动机","m":"提供动力的部件"},{"en":"military analyst","zh":"军事分析员","m":"研究军事数据的人"}]},"soc-L7-friendship":{"name":"友谊悖论","one":"多数人的朋友比自己朋友多：朋友多的人出现在更多人的名单里。","pts":["友谊悖论（friendship paradox）：随机抽人≠随机抽“某人的朋友”","沿朋友关系抽样，会过度代表高连接者","不是大家低估自己，也不是友谊不对称"],"ex":"随机抽“某人关注的账号”比随机抽用户更容易抽到大 V。","trap":"以为是大家低估自己的朋友数，或友谊不对称。","ana":"班里的“社交达人”出现在几乎每个人的好友列表里，所以你的朋友们平均下来，朋友数总比你多。","words":[{"en":"highly connected","zh":"高连接的","m":"朋友特别多的"},{"en":"friend list","zh":"好友列表","m":"某人的朋友名单"},{"en":"over-represent","zh":"过度代表","m":"在样本中占比偏高"},{"en":"symmetric","zh":"对称的","m":"双向相同"},{"en":"underestimate","zh":"低估","m":"估得比实际少"}]},"soc-L7-unit":{"name":"分析单位","one":"按班算还是按学生算，平均数不同，但都对，答的问题不同。","pts":["分析单位（unit of analysis）：按什么计数","按班平均 = 总人数 ÷ 班数，每班权重相同","按学生平均 = Σ班额² ÷ 总人数，大班权重大，必更大"],"ex":"20 个 20 人班 + 4 个 200 人班：按班 1200/24=50；按学生 168000/1200=140。","trap":"以为两个平均数必有一个是错的。","ana":"餐厅说“平均每桌 3 人”，但按顾客算，多数人坐在大桌上，从顾客角度看同桌人数要多得多。","words":[{"en":"average class size","zh":"平均班级人数","m":"按班级算的平均"},{"en":"experienced by students","zh":"学生所经历的","m":"按学生算的平均"},{"en":"unit of analysis","zh":"分析单位","m":"计数的基本对象"}]},"soc-L7-berkson":{"name":"伯克森悖论","one":"按两项特征综合门槛筛选，入选群体里会冒出总体没有的负相关。","pts":["伯克森悖论（Berkson\u0027s paradox）：入选靠 A 强或 B 强，群体内此消彼长","被选群体内的相关可能和总体相反","不能由此推出一个导致另一个"],"ex":"奖学金看成绩或特长，够线就录：获奖者中成绩越好特长越弱。","trap":"以为入选群体里的负相关是真的因果（A 损害 B）。","ana":"能上热门的视频要么内容特别好、要么标题特别吸睛，于是在热门里看起来“标题越夸张内容越差”。","words":[{"en":"negatively correlated","zh":"负相关","m":"一个高另一个往往低"},{"en":"correlation","zh":"相关","m":"两个变量一起变化"},{"en":"hiring","zh":"招聘","m":"公司录用员工"},{"en":"combined abilities","zh":"综合能力","m":"多项能力加起来"},{"en":"contest","zh":"竞赛","m":"比赛"},{"en":"quit","zh":"辞职","m":"离开公司"}]},"soc-L7-censoring":{"name":"数据删失（右删失）","one":"观察期截止时还没出结果的被排除，晚来的只剩结果来得早的。","pts":["右删失（right-censoring）：新群体看起来结果更短","被排除的是还没发生结果的人，不随机","要问：谁还没机会进入数据？"],"ex":"2020 截止只统计已离婚夫妇，近年结婚的看起来婚姻更短。","trap":"把删失造成的差异当成群体真实差异。","ana":"只统计“已经毕业”的学生算平均读书年限，还没毕业的被排除，就只剩那些读得特别快的人。","words":[]},"soc-L7-randomization":{"name":"自我选择与随机分配","one":"自愿参加的人本来就不一样；随机分配才能把项目效果分出来。","pts":["自我选择（self-selection）：参与者常最有动机或最极端","只比自愿者和不参加者，会把“谁参加”误当项目效果","抽屉问题：只发阳性结果，文献有偏"],"ex":"自愿参加健康项目的员工更健康，随机比较却无差别。","trap":"把“健康导致参与”读成“项目导致健康”。","ana":"像抽签决定谁能免费试用健身卡，再比较两组健康，而不是比较主动办卡和没办卡的人。","words":[{"en":"randomised comparison","zh":"随机化比较","m":"随机分组后比较"},{"en":"invalid","zh":"无效的","m":"不成立的"},{"en":"publish","zh":"发表","m":"公开刊出研究"},{"en":"hypothesis","zh":"假设","m":"待检验的猜想"},{"en":"literature","zh":"文献","m":"已发表的研究"},{"en":"file drawer problem","zh":"抽屉问题","m":"不利结果锁进抽屉不发表"},{"en":"voluntarily","zh":"自愿地","m":"自己主动"},{"en":"participate","zh":"参加","m":"加入项目"},{"en":"programme","zh":"项目","m":"一套安排好的活动"},{"en":"significant effect","zh":"显著效果","m":"统计上可信的效果"},{"en":"control group","zh":"对照组","m":"不接受项目的那组"},{"en":"causal reversal","zh":"因果倒置","m":"把果当成因"}]},"soc-L9-three-levels":{"name":"句法、语义与语用","one":"句法管结构，语义管字面意思，语用管语境里暗示的意思。","pts":["句法（syntax）：词怎么组合成句","语义：常规字面意义；语用：超出字面的推断","语用意义不是撒谎：字面可以为真"],"ex":"问字迹答“他讲课很好”：字面夸讲课，语用上暗示字迹差。","trap":"把“答非所问的暗示”归到语义或逻辑。","ana":"妈妈说“你房间真干净啊”：句法是语序正确，语义是夸房间干净，语用上其实在说“快去收拾”。","words":[{"en":"referee","zh":"推荐人","m":"写推荐信的人"},{"en":"job candidate","zh":"求职者","m":"应聘的人"},{"en":"handwriting","zh":"字迹","m":"手写的字"},{"en":"inference","zh":"推断","m":"从话里推出的意思"}]},"soc-L9-speech-act":{"name":"言语行为","one":"有身份、情境对，说出来本身就完成一个行动，不是描述世界。","pts":["言语行为（speech act）：制造新的规范事实","成功靠身份和情境：彩排时宣布结婚无效","言语行为≠间接言语：承诺可以很直接"],"ex":"“我保证六点来接你”“我宣布你们结为夫妻”“我道歉”。","trap":"把描述世界的句子（下雨了）当成言语行为。","ana":"裁判说“你出局了”，这句话不是在描述，而是让球员真的出局；观众喊同一句话就没有这个效力。","words":[{"en":"utterance","zh":"话语","m":"说出的一句话"},{"en":"promise","zh":"承诺","m":"答应做某事"},{"en":"performing a marriage","zh":"主持婚礼","m":"宣布两人结婚"},{"en":"swan","zh":"天鹅","m":"一种鸟"}]},"soc-L9-focal-point":{"name":"焦点（谢林点）","one":"不沟通也能对上的选项：人人料到别人也觉得它显眼。","pts":["焦点（focal point）不必是客观最好或最公平的","显眼与否看群体经验","多个焦点竞争时协调可能失败"],"ex":"悉尼见面没定地点，游客多半去 Opera House：都料到对方会去。","trap":"以为焦点就是客观最好的选项。","ana":"和朋友在商场走散、手机没电，你们都会去正门口等：不是那里最好，而是都觉得对方也会去。","words":[{"en":"salient","zh":"显著的","m":"特别突出"},{"en":"without discussion","zh":"不经商量","m":"互相不沟通"},{"en":"objectively","zh":"客观上","m":"不依个人看法"},{"en":"explicit assertion","zh":"明确断言","m":"直接说出口的主张"}]},"soc-L9-common-knowledge":{"name":"共同知识","one":"都知道 p，还都知道对方知道，如此一层层下去，就是共同知识。","pts":["共同知识（common knowledge）≠共享知识：各自知道但不确定别人知道","当众说出口能制造共同知识","共同知识让集体协调成为可能"],"ex":"皇帝的新衣：男孩喊出后，大家不是第一次看见，而是人人知道人人知道。","trap":"以为男孩让旁观者第一次看见了真相。","ana":"班长在全班宣布“明天放假”，大家不只都知道，还都知道别人也知道；私下一个个告诉则不是。","words":[{"en":"onlookers","zh":"旁观者","m":"在旁边看的人"},{"en":"emperor","zh":"皇帝","m":"故事里的国王"},{"en":"naked","zh":"赤裸的","m":"没穿衣服"},{"en":"mutual understanding","zh":"相互理解","m":"双方都明白"},{"en":"proposal","zh":"提议","m":"提出的请求"}]},"soc-L9-common-ground":{"name":"共同基础","one":"共同基础（common ground）：双方公开承认、以后可以共同引用的内容。","pts":["通常靠明确说出来（断言）加入","双方都听懂 p ≠ p 进了共同基础","没进共同基础的暗示，失败后可当没发生"],"ex":"同事暗示借钱你没接话：之后不能把“他提过借钱”当公开事实引用。","trap":"以为双方都懂了，p 就已在共同基础里。","ana":"像会议纪要：明确说出并记进纪要的内容，之后大家都能引用；只在走廊里暗示的，就没进纪要。","words":[{"en":"publicly placed","zh":"被公开摆上台面","m":"正式说出来"},{"en":"carry on","zh":"继续","m":"照常进行"},{"en":"turned down","zh":"被拒绝","m":"对方说不"},{"en":"fairly sure","zh":"相当确定","m":"很有把握"}]},"soc-L9-indirect-speech":{"name":"间接言语","one":"间接言语（indirect speech）：让人懂 p 却不明说 p，p 不进共同基础。","pts":["核心不是没人懂，而是没公开、可引用地说出","三大功能：可否认性、关系管理、战略模糊","不同于言语行为：言语行为说出就完成行动"],"ex":"老板说“报告周一前完成就太好了”：员工听出是要求。","trap":"以为间接言语有效是因为听者听不懂。","ana":"想让客人离开却说“哎呀都这么晚了”，对方能听懂，但你并没正式说出“请你走”。","words":[{"en":"veiled","zh":"含蓄的","m":"遮遮掩掩的"},{"en":"indirect invitation","zh":"委婉邀请","m":"不直说的邀请"},{"en":"function","zh":"功能","m":"起的作用"},{"en":"hint","zh":"暗示","m":"不明说的提示"}]},"soc-L9-deniability":{"name":"可否认性、关系管理、战略模糊","one":"间接说的三个用处：免罚、保关系、让不同人读出不同意思。","pts":["可否认性（plausible deniability）：留无辜解释，敌对听者难惩罚","关系管理：试探关系变化，被拒仍保原关系","战略模糊：故意含糊，不同受众各读各的"],"ex":"司机暗示行贿→可否认；“上来看电影吗”→关系管理；Antony 悼词→战略模糊。","trap":"以为可否认性靠听者听不懂（那是秘密代码）。","ana":"说“这门课期末挺难吧”暗示想抄作业，被拒可说只是闲聊；约同事看展被婉拒，同事关系照旧。","words":[{"en":"bribe","zh":"贿赂","m":"给好处换取违规帮助"},{"en":"police officer","zh":"警察","m":"执法人员"},{"en":"interpretation","zh":"解释、理解","m":"对话语的读法"},{"en":"innocent","zh":"无辜的","m":"没有坏意思的"},{"en":"secret code","zh":"暗号","m":"只有圈内人懂"},{"en":"conventionalised","zh":"约定俗成的","m":"变成固定说法"},{"en":"idiom","zh":"习语","m":"固定的说法"},{"en":"legal","zh":"合法的","m":"法律允许的"},{"en":"romantic proposal","zh":"恋爱示好","m":"表达想交往"},{"en":"declined","zh":"被拒绝","m":"对方不接受"},{"en":"preserved","zh":"被保住","m":"维持原样"},{"en":"existing friendship","zh":"现有友谊","m":"原来的朋友关系"},{"en":"legal punishment","zh":"法律惩罚","m":"被法律处罚"},{"en":"honourable","zh":"正直可敬的","m":"值得尊敬的"},{"en":"condemn","zh":"谴责","m":"严厉批评"},{"en":"ironic","zh":"反讽的","m":"字面与本意相反"},{"en":"mounting contrary evidence","zh":"不断累积的反证","m":"越来越多相反的证据"},{"en":"literal","zh":"字面的","m":"按字面意思"},{"en":"repetition","zh":"重复","m":"一遍遍说"},{"en":"audience","zh":"听众","m":"听话的人"}]},"soc-L11-bibliotechnic":{"name":"图书馆技术假说","one":"图书馆技术假说（bibliotechnic hypothesis）：LLM 是检索系统，不是思考者。","pts":["压缩、检索、重组、外推人类文本，能处理新组合","教授倾向此说，但只是暂定答案","证据：幻觉、依赖熟悉形式、二十问"],"ex":"Borges 巴别图书馆：拥有所有书≠理解它们。","trap":"把教授立场当成定论或“LLM 不能思考”的证明。","ana":"LLM 像读过整座图书馆的超级检索员，能把书里的片段拼成新回答，但这不意味着它真的在思考。","words":[{"en":"stance","zh":"立场","m":"所持的观点"},{"en":"tentative","zh":"暂定的","m":"不是最终结论"},{"en":"settled","zh":"已有定论的","m":"不再有争议"},{"en":"agnosticism","zh":"不可知论","m":"不表态是否"},{"en":"information retrieval","zh":"信息检索","m":"查找调取已有信息"},{"en":"cognition","zh":"认知","m":"思考、理解的过程"},{"en":"statistical","zh":"统计的","m":"基于概率规律的"},{"en":"LLM","zh":"大语言模型","m":"如 ChatGPT"}]},"soc-L11-next-token":{"name":"下一 token 预测","one":"按 Pr(下一 token | 前文) 选一个 token，接到末尾，再重复。","pts":["下一 token 预测（next-token prediction）：token 不严格等于词","Markov 只看固定长度前文；窗口加长，表约 n^(k+1) 爆炸","训练时更新权重≠聊天时把文字放进上下文"],"ex":"词表 100、order 2：表约 100³=100 万条；每加一词放大 100 倍。","trap":"以为把 Markov 窗口加长就行；表会爆炸、数据填不满。","ana":"像接龙写句子：每次只看前面写了什么，猜最可能的下一个字写上，再接着猜下一个，直到写完。","words":[{"en":"next-token prediction","zh":"下一 token 预测","m":"猜下一个文字单位"},{"en":"Markov generator","zh":"马尔可夫生成器","m":"只看前 k 个词猜下一个"},{"en":"context window","zh":"上下文窗口","m":"模型能看到的前文长度"},{"en":"exponentially","zh":"指数级地","m":"成倍成倍地增长"},{"en":"entries","zh":"条目","m":"表格里的一项"},{"en":"training data","zh":"训练数据","m":"模型学习用的文本"},{"en":"long-range dependencies","zh":"长程依赖","m":"前后相隔很远的联系"},{"en":"grammatical accuracy","zh":"语法准确度","m":"句子是否合语法"}]},"soc-L11-redescription":{"name":"
