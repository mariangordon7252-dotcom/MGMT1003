{
  "cards": {
    "soc-L13-epistemic-injustice": {"ana": "就像小组讨论时，你因为口音被默认“说不清楚”，或者你遇到的事根本没有词可以讲：受伤的是你“作为懂事、能说明白的人”的身份。"},
    "soc-L13-credibility-excess": {"ana": "班长和普通同学说法冲突，老师因为“班长一向靠谱”直接全信班长，天平一边加重，另一边的同学就自动被看轻了。"},
    "soc-L13-credibility-economy": {"ana": "可信度像发工资：有人天生被多发，有人总被克扣，而且多发少发看的是“你是谁”，不是你说得对不对。"},
    "soc-L13-willful-hermeneutical-ignorance": {"ana": "员工早就有“隐形加班”这个说法，老板却坚称“没这回事，都是自愿的”，拒绝用这个词看问题，于是一直看不见它。"},
    "soc-L13-testimonial-quieting": {"ana": "开会时保洁阿姨说“那台设备在漏水”，大家像没听见一样继续讨论，连“信不信”都没考虑，好像她根本没开口。"},
    "soc-L13-testimonial-smothering": {"ana": "新员工发现流程有漏洞，但知道组里一提意见就被嘲笑“你懂什么”，于是在群里打了一段话又删掉了。"},
    "soc-L14-testimonial-injustice": {"ana": "外卖小哥报警说看见有人撬车，警察因为“送外卖的能看清什么”而不当回事：话说出口了，却因身份被打折扣。"},
    "soc-L14-hermeneutical-injustice": {"ana": "“产后抑郁”这个说法普及之前，很多妈妈只觉得自己“矫情、不够爱孩子”，连自己都说不清发生了什么，社会也听不懂。"},
    "soc-L14-credibility-deficit": {"ana": "像给人打分，本该得 90 却只给了 60。至于为什么少给（偏见、权力、或其他原因），要另外判断。"},
    "soc-L14-identity-prejudice": {"ana": "听到“我是 00 后”，面试官就先在心里给这个人的话打了折，内容还没听，标签已经替你做了判断。"},
    "soc-L14-prejudicial-stereotype": {"ana": "像一副摘不掉的有色眼镜：认定“胖的人都懒”，看到对方每天健身也说“肯定只是装样子”，证据怎么都改不了看法。"},
    "soc-L14-wronged-as-knower": {"ana": "像医生因你是学生就不听你描述症状：误诊是认识上的损失，被当成“说了也白说的人”是对你人格的轻视。"},
    "soc-L14-sincerity-competence": {"ana": "天气预报 App 不会故意骗你（真诚），但可能算不准（能力）；不信它的准确度不等于说它撒谎。"},
    "soc-L14-reasonable-doubt": {"ana": "陌生号码说“你中奖了”你先怀疑是合理的；但对方给出官网查询记录后你还坚持“肯定是骗子”，就不再是合理怀疑了。"},
    "soc-L14-collective-hermeneutical-resources": {"ana": "像大家共用的一本“词典”：查得到“内卷”“PUA”这些词，零散的感受才能拼成别人一听就懂的经历。"},
    "soc-L14-conceptual-engineering": {"ana": "像整理文件夹：把几个文件夹合成一个，能看出共同点；拆成几个子文件夹，能保留区别。怎么分，会影响人们怎么看自己。"},
    "soc-L15-manufactured-doubt": {"ana": "外卖店差评如潮，老板只要让人觉得“评价众说纷纭、还说不准”，大家就继续点。他不必证明好吃，只需要让你拿不定主意。"},
    "soc-L15-epistemic-environment": {"ana": "就像你吃的东西取决于食堂摆了什么：信息“菜单”上放什么、放多少，决定了你最后形成什么看法。"},
    "soc-L15-selective-promotion": {"ana": "像只给朋友圈发自拍里最好看的那一张：每张都是真的，但挑出来展示的那部分让整体印象变了。"},
    "soc-L15-false-balance": {"ana": "辩论节目让“地球是圆的”和“地球是平的”各派一人、各说五分钟，观众会以为这是个五五开的问题。"},
    "soc-L15-implicature": {"ana": "零食包装写“0 蔗糖”，字面没错，却让人以为“不含糖、很健康”，其实可能加了别的糖。"},
    "soc-L15-credence": {"ana": "像手机电量条：不是只有“满格”或“没电”，你对一件事的把握也可以是 70%、30% 这样的刻度。"},
    "soc-L15-principal-principle": {"ana": "抽奖箱里 10 个球 1 个红球，没偷看时你对“抽中红球”的把握就该是 0.1；已经看到手里是白球，就不能再说 0.1。"},
    "soc-L15-status-quo-bias": {"ana": "牙疼了总说“还没确定是蛀牙，再等等”，于是一直不去看医生，“等等”本身就让事情默认维持原样。"},
    "soc-L15-action-under-uncertainty": {"ana": "不确定楼下快递柜还有没有你的包裹，但顺路看一眼几乎没成本，那就去看；行动不需要先百分百确定。"},
    "soc-L17-informational-advertising": {"ana": "像商品详情页的参数表：“5000mAh 电池、重 180 克、售价 1999 元”，告诉你东西本身是什么。"},
    "soc-L17-associative-advertising": {"ana": "可乐广告总配着朋友聚会、欢呼碰杯，久而久之你一想到“开心聚会”就想到可乐，虽然广告没说可乐本身怎样。"},
    "soc-L17-demand-engineering": {"ana": "先告诉你“手机屏幕上的细菌比马桶还多”，你原本毫不在意，接着推出“屏幕消毒湿巾”：先卖焦虑，再卖解药。"},
    "soc-L17-branding": {"ana": "提到某个果字标的品牌就想到“简洁高级”，不管它卖的是手机还是耳机，这个印象跟着品牌走，而不是跟着某件产品。"},
    "soc-L17-targeting": {"ana": "你刚在群里说要考研，短视频就推“考研人都在用的背单词 App”，暗示“像你这样的人都需要它”。"},
    "soc-L17-shared-attention": {"ana": "地铁里铺满“夏天不晒黑才精致”的广告，你自己不在乎，但觉得同事们都看到了、会这样看你，于是也去买了防晒衣。"},
    "soc-L17-absolute-relative-norm": {"ana": "绝对标准像考试 60 分及格，人人都能过；相对标准像“前 10% 才拿奖学金”，大家都进步了，门槛也跟着往上涨。"},
    "soc-L17-context-free-information": {"ana": "刷到某明星今天早餐吃了什么，能聊两句，但不会改变你今天做什么；而“明天全校停水”会让你马上去接水。"},
    "soc-L19-attention-economy": {"ana": "信息像不停涌进来的快递，真正不够用的是你家门口的空间：东西越多，你越要挑着收、挑着拆。"},
    "soc-L19-serial-attention": {"ana": "像只有一个窗口的银行柜台：看似同时办好几件事，其实是轮流处理，每次换人都要重新报信息、浪费时间。"},
    "soc-L19-endogenous-exogenous": {"ana": "自己决定“做完这题去看消息”是内源性；正写作业时窗外突然一声巨响把你吸引过去，是外源性。"},
    "soc-L19-epistemic-bubble": {"ana": "像只加了同专业同学的朋友圈：别的专业的看法你只是“没刷到”，并不讨厌他们，有人转给你你也会认真看。"},
    "soc-L19-echo-chamber": {"ana": "像某个粉丝群：群主早就说“黑子说的全是造谣”，所以外人拿出证据，大家反而更确信“又有人来抹黑了”。"},
    "soc-L19-pagerank": {"ana": "像选餐厅看“被多少本地人推荐”：不用亲自尝菜，被越多人推荐的店越可能好吃，但也会有商家花钱刷推荐。"},
    "soc-L19-filtering": {"ana": "像图书馆员根据“和你口味相近的读者借过什么”给你推书：书太多必须有人帮你挑，但你也会一直看到同类的书。"},
    "soc-L19-feedback-loop": {"ana": "像点外卖越点越辣：平台发现重口味的人互动最多，就主推更辣的菜，你每点一次，它就再往上加一级辣度推给你。"},
    "soc-L19-social-epistemic-reboot": {"ana": "笛卡尔式重启像把手机恢复出厂设置、所有联系人重新筛一遍，根本忙不过来；纽拉特之船像逐个删掉最可疑的联系人，其余照常用。"}
  }
}

{
  "cards": {
    "soc-L13-epistemic-injustice": {"one": "认识不正义：人作为知识主体受到的不公（Fricker 分证言/诠释两类）。", "en": "A wrong done to someone specifically in their capacity as a knower (Fricker: testimonial or hermeneutical).", "qs": ["soc-L14-q09", "soc-L14-e01", "soc-L13-q02", "soc-L14-q01", "soc-L14-q02"]},
    "soc-L13-credibility-excess": {"one": "可信度过高：给的信任超过应得；Medina 认为它会造成他人可信度不足。", "en": "Giving a speaker more credibility than deserved; Medina: one party's excess can produce another's deficit.", "qs": ["soc-L13-q03"]},
    "soc-L13-credibility-economy": {"one": "可信度经济（Fricker）：可信度在群体间分配不均，有人系统性被多信或少信。", "en": "Fricker: credibility is distributed unevenly, so some groups systematically get more or less than deserved.", "qs": ["soc-L13-q03"]},
    "soc-L13-willful-hermeneutical-ignorance": {"one": "蓄意诠释无知（Pohlhaus）：边缘群体已有概念，优势群体却拒绝承认。", "en": "Pohlhaus: dominant knowers refuse to acknowledge concepts developed by marginalised groups, ignoring parts of social reality.", "qs": ["soc-L13-q06"]},
    "soc-L13-testimonial-quieting": {"one": "证言消音（Dotson）：听众因身份偏见根本不把说话者当知识来源，直接无视。", "en": "Dotson: owing to identity prejudice, the audience fails to recognise the speaker as a knower and ignores her testimony.", "qs": ["soc-L13-q05", "soc-L13-q04"]},
    "soc-L13-testimonial-smothering": {"one": "证言自我压抑（Dotson）：说话者预料听众不会恰当接纳，自己不说或少说。", "en": "Dotson: a speaker withholds or truncates her testimony anticipating the audience will not give it proper uptake.", "qs": ["soc-L13-q04", "soc-L13-q05"]},
    "soc-L14-testimonial-injustice": {"one": "证言不正义：听者因身份偏见给说话者可信度不足，伤害其知识提供者地位。", "en": "A speaker receives a credibility deficit owing to the hearer's identity prejudice, wronging her as a giver of knowledge.", "qs": ["soc-L14-q02", "soc-L13-q02", "soc-L14-q07", "soc-L14-q10", "soc-L13-q07", "soc-L14-q01", "soc-L14-e01", "soc-L14-e02"]},
    "soc-L14-hermeneutical-injustice": {"one": "诠释不正义：共同诠释资源中的结构性偏见使某些重要社会经历无法被理解。", "en": "Having a significant area of one's social experience obscured from collective understanding by structural prejudice in shared hermeneutical resources.", "qs": ["soc-L14-q01", "soc-L14-q08", "soc-L14-q11", "soc-L13-q06", "soc-L14-e01"]},
    "soc-L14-credibility-deficit": {"one": "可信度不足：得到的信任低于应得；本身不等于证言不正义。", "en": "Receiving less credibility than one's testimony deserves given one's evidence, sincerity and competence.", "qs": ["soc-L14-q07", "soc-L14-q02", "soc-L13-q05", "soc-L14-e02", "soc-L14-e01"]},
    "soc-L14-identity-prejudice": {"one": "身份偏见：因对方所属社会群体的负面刻板印象而扭曲对其可信度的判断。", "en": "Prejudice against people as members of a social type, usually via negative stereotype, distorting credibility judgements.", "qs": ["soc-L14-q02", "soc-L14-q07", "soc-L13-q02", "soc-L14-q10", "soc-L14-e01", "soc-L14-e02"]},
    "soc-L14-prejudicial-stereotype": {"one": "偏见刻板印象三要素：群体关联负面特征、抵抗反证、不当情感投入。", "en": "A widely held group–negative-attribute association resistant to counter-evidence, owing to ethically bad affective investment.", "qs": ["soc-L14-q04", "soc-L14-q10", "soc-L13-q02", "soc-L13-q07", "soc-L14-e02"]},
    "soc-L14-wronged-as-knower": {"one": "作为知识主体受害：被当作不完整的知识提供者，兼有认识伤害与道德伤害。", "en": "Being treated as less than a full giver of knowledge: both an epistemic harm and a moral harm.", "qs": ["soc-L14-q09", "soc-L14-e01"]},
    "soc-L14-sincerity-competence": {"one": "真诚＝说自己相信的话；能力＝有能力判断对；两者分开评估。", "en": "Sincerity: asserting what one believes; competence: being positioned to get it right; separate dimensions of trustworthiness.", "qs": ["soc-L14-q05", "soc-L14-q06", "soc-L14-e02"]},
    "soc-L14-reasonable-doubt": {"one": "合理怀疑：基于听者当时证据并随新证据更新；偏见则抵抗反证。", "en": "Doubt based on evidence available at the time and revised with new evidence, unlike prejudice resisting counter-evidence.", "qs": ["soc-L14-q03", "soc-L14-q06", "soc-L14-e02", "soc-L14-q02"]},
    "soc-L14-collective-hermeneutical-resources": {"one": "共同诠释资源：社群共享的词语、概念和解释框架，使经历可理解可交流。", "en": "The shared stock of concepts, words and interpretive frameworks a community uses to understand and communicate experience.", "qs": ["soc-L14-q01", "soc-L14-q11", "soc-L14-q08", "soc-L14-e01"]},
    "soc-L14-conceptual-engineering": {"one": "概念工程：评估修改概念，合并突出共同处境，细分保留差异，影响自我理解。", "en": "Assessing and revising concepts: lumping highlights shared situations, splitting preserves differences; both affect self-understanding.", "qs": ["soc-L14-q11"]},
    "soc-L15-manufactured-doubt": {"one": "制造怀疑：选择性放大少数异议，让公众高估不确定性以拖延行动、维持现状。", "en": "Selectively amplifying minor dissent so the public overestimates uncertainty, delaying belief change and action to preserve the status quo.", "qs": ["soc-L15-q01", "soc-L15-q05", "soc-L15-q10", "soc-L15-e01"]},
    "soc-L15-epistemic-environment": {"one": "认识环境：我们获取信息的环境，信息到达的方式与比例影响我们信什么。", "en": "The informational surroundings through which we form beliefs; how information reaches us shapes what we believe.", "qs": ["soc-L15-q03", "soc-L15-q02", "soc-L15-e01"]},
    "soc-L15-selective-promotion": {"one": "选择性推广：只资助/宣传有利的少数研究，使可见证据显得比实际更分裂。", "en": "Funding or publicising only favourable minority studies so visible evidence looks more divided than the whole body.", "qs": ["soc-L15-q03", "soc-L15-q01", "soc-L15-e01"]},
    "soc-L15-false-balance": {"one": "虚假平衡：把双方呈现为势均力敌，而证据分量严重偏向一方。", "en": "Presenting two sides as equally weighty when the weight of evidence and expert opinion overwhelmingly favours one.", "qs": ["soc-L15-q02", "soc-L15-e01"]},
    "soc-L15-implicature": {"one": "误导性言外之意：字面为真，却暗示出未被证明的结论。", "en": "What a message suggests beyond its literal content; literally true yet leading to an unsupported conclusion.", "qs": ["soc-L15-q04", "soc-L15-e01"]},
    "soc-L15-credence": {"one": "信念度：用 0–1 表示对命题的把握，区别于全信/全不信的二元信念。", "en": "Degree of belief in a proposition from 0 (certainly false) to 1 (certainly true).", "qs": ["soc-L15-q06", "soc-L15-q08", "soc-L15-q07", "soc-L15-e01"]},
    "soc-L15-principal-principle": {"one": "主原则：知道客观机会且无额外相关信息时，信心应等于该机会。", "en": "Knowing an outcome's objective chance and lacking inadmissible information, one's credence should equal that chance.", "qs": ["soc-L15-q07", "soc-L15-q06"]},
    "soc-L15-status-quo-bias": {"one": "维持现状偏向：把“尚不确定”当作“不必改变”，结果偏向现状、利于受益于拖延者。", "en": "Treating 'not yet certain' as reason not to change favours current practice, benefiting whoever gains from delay.", "qs": ["soc-L15-q10", "soc-L15-q01", "soc-L15-e01"]},
    "soc-L15-action-under-uncertainty": {"one": "不确定下决策：依据结果概率与后果好坏行动，不必先确定结论为真。", "en": "Choosing actions by weighing outcome probabilities against their costs and benefits, without first being certain.", "qs": ["soc-L15-q09", "soc-L15-q05", "soc-L15-e01"]},
    "soc-L17-informational-advertising": {"one": "信息型广告：直接告知产品的特点、材料、价格或购买方式。", "en": "Advertising that tells consumers facts about a product: features, materials, price or where to buy.", "qs": ["soc-L17-q01", "soc-L17-q07", "soc-L17-e01"]},
    "soc-L17-associative-advertising": {"one": "联想型广告：反复把产品与感觉/身份同框，建立联想而不提供产品信息。", "en": "Advertising that repeatedly pairs a product with a feeling, lifestyle or identity, without product information.", "qs": ["soc-L17-q02", "soc-L17-e01"]},
    "soc-L17-demand-engineering": {"one": "制造需求（Tim Wu）：先让未被在意的状态显得是问题，再把产品当解决办法。", "en": "Tim Wu: first make an unnoticed condition seem a problem, then present the product as its solution.", "qs": ["soc-L17-q03", "soc-L17-e01"]},
    "soc-L17-branding": {"one": "品牌塑造：把形象特质贴在整个公司/品牌上，而非单一产品。", "en": "Attaching an image or trait to a whole company or brand rather than a single product.", "qs": ["soc-L17-q08", "soc-L17-q07", "soc-L17-e01"]},
    "soc-L17-targeting": {"one": "定向投放：按受众兴趣或身份投放，传达“像你这样的人想要它”。", "en": "Directing ads at an audience by interests or identity, suggesting people like them want the product.", "qs": ["soc-L17-q07", "soc-L17-e01"]},
    "soc-L17-shared-attention": {"one": "共同关注：大家都看到同一讯息而产生相互预期，即使私下不信也会改变行为。", "en": "Public messages create mutual expectations that others saw and accept them, changing behaviour even of private doubters.", "qs": ["soc-L17-q04", "soc-L17-q10", "soc-L17-q03", "soc-L17-e01"]},
    "soc-L17-absolute-relative-norm": {"one": "绝对标准是人人达到的门槛；相对标准要比别人强，别人提升目标就升高。", "en": "Absolute norm: a threshold everyone should meet; relative norm: being better than others, so the target keeps rising.", "qs": ["soc-L17-q05", "soc-L17-q06", "soc-L17-e01"]},
    "soc-L17-context-free-information": {"one": "脱离情境的信息（Postman）：可作谈资，但与接收者能做的决定或行动几乎无关。", "en": "Postman: information interesting to discuss but with little relevance to any decision or action available to the recipient.", "qs": ["soc-L17-q09"]},
    "soc-L19-attention-economy": {"one": "注意力经济（Simon）：信息消耗接收者注意力，信息丰富时注意力稀缺需高效分配。", "en": "Simon: information consumes recipients' attention, so a wealth of information makes attention the scarce resource to allocate.", "qs": ["soc-L19-q01", "soc-L19-q02", "soc-L19-q05", "soc-L19-e02"]},
    "soc-L19-serial-attention": {"one": "串行注意（Simon）：人一次只注意一件事，多任务只是有切换成本的快速切换。", "en": "Simon: humans attend to one thing at a time; multitasking is fast switching with switching costs.", "qs": ["soc-L19-q03", "soc-L19-q06", "soc-L19-q13", "soc-L19-e02"]},
    "soc-L19-endogenous-exogenous": {"one": "内源性注意由自己意志主动转移；外源性注意被外界刺激抓走。", "en": "Endogenous attention shifts are directed from within by will; exogenous shifts are captured by outside stimuli.", "qs": ["soc-L19-q04", "soc-L19-q05"]},
    "soc-L19-epistemic-bubble": {"one": "认识泡泡（Nguyen）：相关声音因遗漏被排除，但未被主动贬低。", "en": "Nguyen: an information network from which relevant voices are excluded by omission, not actively distrusted.", "qs": ["soc-L19-q07", "soc-L19-q09", "soc-L19-q08", "soc-L19-q11", "soc-L19-e01", "soc-L19-e02"]},
    "soc-L19-echo-chamber": {"one": "回音室（Nguyen）：外部相关声音被主动贬低，成员预先不信外部来源。", "en": "Nguyen: a social epistemic structure where relevant outside voices are actively discredited, so members distrust them in advance.", "qs": ["soc-L19-q08", "soc-L19-q09", "soc-L19-q12", "soc-L19-q07", "soc-L19-e01"]},
    "soc-L19-pagerank": {"one": "PageRank：被越多网页链接排名越高，以流行度代理信息性，无需理解内容。", "en": "Google ranks highly pages many others link to, using popularity as a proxy for informativeness without understanding content.", "qs": ["soc-L19-q10", "soc-L19-e02"]},
    "soc-L19-filtering": {"one": "算法过滤：假设你喜欢相似者所喜欢的来替你筛内容；注意力有限故必要。", "en": "Automatically selecting content on the assumption you like what similar people like; necessary given limited attention.", "qs": ["soc-L19-q11", "soc-L19-e02", "soc-L19-e01"]},
    "soc-L19-feedback-loop": {"one": "推荐反馈循环：最活跃用户主导推荐，极端内容被放大；在线环境主动塑造用户。", "en": "Most engaged users drive recommendations, so extreme content is promoted; the online environment actively shapes users.", "qs": ["soc-L19-q15", "soc-L19-e02", "soc-L19-e01"]},
    "soc-L19-social-epistemic-reboot": {"one": "Nguyen 主张笛卡尔式重启信任；老师因注意力有限反对，主张纽拉特之船逐步修补。", "en": "Nguyen's Cartesian reboot of trust fails given limited attention; instead, like Neurath's boat, gradually replace the weakest beliefs.", "qs": ["soc-L19-q13", "soc-L19-q14", "soc-L19-e02"]}
  }
}

{"cards":{
"soc-L13-epistemic-injustice":{
 "name":"认识不正义",
 "one":"人作为知识主体（knower）受到的不公，Fricker 分证言、诠释两类。",
 "pts":["证言不正义（testimonial injustice）：说了因偏见不被信","诠释不正义（hermeneutical injustice）：缺概念说不清","关键在偏见或结构性不公造成伤害，不是凡不被信都算"],
 "ex":"McKinnon 综述：同一说法出自白人男性比出自黑人女性更易被信，尽管两人同样可信。",
 "trap":"以为凡是没被相信就是认识不正义；还要看原因是否是偏见或结构性不公。",
 "ana":"就像小组讨论时，你因为口音被默认“说不清楚”，或者你遇到的事根本没有词可以讲：受伤的是你“作为懂事、能说明白的人”的身份。",
 "words":[{"en":"in one's capacity as a knower","zh":"以知识主体的身份","m":"作为能提供知识的人"},{"en":"paradigm case","zh":"典型案例","m":"最标准、最有代表性的例子"},{"en":"dismiss","zh":"不予理会","m":"把说法当作不值一提"},{"en":"intuition","zh":"直觉","m":"不靠推理的感觉判断"},{"en":"dualism (Lackey)","zh":"二元论","m":"证言知识需说者和听者两方条件"},{"en":"assert","zh":"断言","m":"郑重声称某事为真"},{"en":"reliable","zh":"可靠的","m":"说的话通常是真的"},{"en":"independently verify through perception","zh":"亲自感知核实","m":"不靠对方，自己看、听去查证"}]
},
"soc-L13-credibility-excess":{
 "name":"可信度过高",
 "one":"给说话者的信任高于其应得程度（credibility excess）。",
 "pts":["Fricker 只讨论可信度不足（credibility deficit）","Medina 批评：一方过高会造成另一方不足","原因：可信度是相互比较、相互影响的"],
 "ex":"《杀死一只知更鸟》：Mayella 可信度过高，部分造成了 Tom Robinson 的可信度不足。",

 "ana":"班长和普通同学说法冲突，老师因为“班长一向靠谱”直接全信班长，天平一边加重，另一边的同学就自动被看轻了。",

},
"soc-L13-credibility-economy":{
 "name":"可信度经济",
 "one":"Fricker：可信度像经济资源一样分配不均，有的群体系统性被多信或少信。",
 "pts":["多给少给看的是“你是谁”，不是说得对不对","多给即可信度过高，少给即可信度不足","诠释不正义中，概念和知识的分配同样不均"],
 "ex":"实习生和主管指出同一个账目错误，主管立刻被信，实习生被当作不懂事。",
 "trap":"",

},
"soc-L13-willful-hermeneutical-ignorance":{
 "name":"蓄意的诠释无知",
 "one":"Pohlhaus：边缘群体已有概念，优势群体却拒绝承认，继续忽视相关现实。",
 "pts":["与诠释不正义不同：不是概念缺失，而是概念被拒绝","说明 Fricker“概念出现并传播就能克服”的看法不完整","优势群体是主动不用这个概念，不是不知道"],

 "ana":"员工早就有“隐形加班”这个说法，老板却坚称“没这回事，都是自愿的”，拒绝用这个词看问题，于是一直看不见它。",

},
"soc-L13-testimonial-quieting":{

 "one":"Dotson：听众因身份偏见根本不把说话者当知识来源，直接无视其证言。",
 "pts":["比可信度不足更严重：连信不信都不判断","效果是好像她根本没开口","问题出在听众一方；自我压抑则是说话者自己不说"],

},

"soc-L14-testimonial-injustice":{
 "name":"证言不正义",
 "one":"听者因身份偏见给说话者可信度不足，伤害其作为知识提供者的地位。",
 "pts":["两要素缺一不可：可信度不足，且原因是身份偏见","真话没被信还不够，必须查清少信的原因","身份偏见是必要条件，但不是充分条件"],

"soc-L14-hermeneutical-injustice":{

 "one":"共同诠释资源中的结构性身份偏见，使某些重要社会经历无法被理解。",
 "pts":["问题是缺概念、说不清，而不是说了被人不信","缺口要与群体被边缘化的结构性偏见有关","通常不需要任何个人的恶意","个人偶然没学过某个术语不算"],

},

 "pts":["本身不等于证言不正义","还要查原因：身份偏见、权力差异，还是合理证据","事后被证实为真，不能证明当初少信不当"],

},

 "pts":["针对的是“哪类人”，不是这句话的内容","是证言不正义中“原因”那一要素","上下级的权力差异本身不是身份偏见"],

"soc-L14-prejudicial-stereotype":{

 "one":"三要素：把群体与负面特征相连、抵抗反证、不当的情感投入。",
 "pts":["抵抗反证是偏见与合理怀疑的分界线","不是基于准确统计；偏见恰恰对证据不敏感","严格框架里：它是证言不正义的必要而非充分条件"],

    "prob-L12-q12": { "q": "四个季节可能性相同；A = 生于春或夏，B = 生于夏或秋。最初的一次计算得出 Pr(A | B) = (3/4)/(1/2) = 1.5。错在哪里？", "o": ["分母应该是 Pr(A)，而不是 Pr(B)。", "分子用了析取（disjunction）（春或夏或秋），而不是合取（conjunction）（A 且 B），后者只有夏季。", "季节并非等可能，所以 1/4 是错的。", "没有错：条件概率可以超过 1。"] },
    "prob-L12-q13": { "q": "A 与 B 互斥，且各自概率都大于 0。下列哪项必然为真？", "o": ["A 与 B 独立。", "Pr(A | B) = Pr(A)。", "A 与 B 不独立。", "Pr(A | B) = 1。"] },
    "prob-L12-q14": { "q": "Pr(A) = 0.2，T 是一个永真式（tautology）（如 B ∨ ~B）。Pr(A | T) 是多少？", "o": ["0.2", "1", "0", "无定义（Undefined）"] },
    "prob-L12-q15": { "q": "Pr(A) = 0.2，F 是一个矛盾式（contradiction）（如 B & ~B）。按本课程使用的标准定义，Pr(A | F) 是：", "o": ["0", "1", "0.2", "无定义（Undefined）"] },
    "prob-L12-q16": { "q": "假设 Pr(B) > 0，恰好在什么条件下 Pr(A & B) = Pr(A | B)？", "o": ["仅当 Pr(B) = 1 时。", "当 Pr(B) = 1 或 Pr(A & B) = 0 时。", "只要 A 与 B 独立。", "永远不会。"] },
    "prob-L12-q17": { "q": "为喜鹊例子构建一个 100 人的假想总体（hypothetical population）表时，得到 1.4 名被俯冲的南岸居民。对此正确的态度是什么？", "o": ["该表无效，因为人数不能是小数；必须改用公式。", "没问题：该表是比例模型，放大到 1,000 人（14 人被俯冲）得到的概率相同。", "继续计算前应把 1.4 四舍五入为 1。", "这说明南岸的概率给错了。"] },
    "prob-L12-q18": { "q": "关于 Pr(A | B) 与 Pr(B | A)，哪种说法正确？", "o": ["二者总是相等，因为分子相同。", "Pr(A | B) 总是大于 Pr(B | A)。", "只有当 A 导致 B 时二者才可能不同。", "二者分子都是 Pr(A & B)，但分母一般不同，所以不必相等。"] },
    "prob-L12-q19": { "q": "在一张 2×2 的计数列联表（contingency table）中，行合计和列合计（即边际（margins））告诉你什么？", "o": ["条件概率，如 Pr(A | B)", "联合计数，如 A & B 情形的数量", "每个单一类别的总数，例如 A 情形的数量", "两个变量是否独立"] },
    "prob-L11-q20": { "q": "在 1,000 条消息记录中，A 出现在 10 条中，B 出现在 10 条中，有 8 条同时包含两者。哪项正确？", "o": ["Pr(A | B) = 0.008，因为 A 和 B 都很罕见。", "Pr(A | B) = 0.01，与 Pr(A) 相同。", "不知道 A 是否导致 B，就无法计算 Pr(A | B)。", "Pr(A | B) = 0.8，尽管 Pr(A) 和 Pr(B) 各自只有 0.01。"] },
    "prob-L11-q21": { "q": "一个 2 阶（order-2）马尔可夫（Markov）文本生成器：", "o": ["在前两个词的条件下为下一个词分配概率", "每次输出两个词", "只使用语料库中最常见的两个词", "以全部前文为条件，每次两个词"] },
    "prob-L11-q22": { "q": "词表有 100 个词时，按讲座中 n^(k+1) 的估算，一张完整的 2 阶马尔可夫表（所有两词前文 × 所有下一个词）大约有多少个条目？", "o": ["200", "10,000", "1,000,000", "100,000,000"] },
    "prob-L11-q23": { "q": "手机在 'Do you want anything from the ...' 之后建议 'shops' 时，它追踪的量最恰当的描述是：", "o": ["Pr('shops')，即这个词总体上有多常见", "Pr(preceding words | 'shops')", "Pr('shops' & preceding words) 除以词表大小", "Pr('shops' | preceding words)"] },
    "prob-L16-q24": { "q": "T 表示“疲倦（tired）”，I 表示“烦躁（irritable）”。Pr(T | I) 问的是什么？", "o": ["在你疲倦的条件下，你烦躁的概率。", "在你烦躁的条件下，你疲倦的概率。", "你既疲倦又烦躁的概率。", "你既不疲倦也不烦躁的概率。"] },
    "prob-L16-q25": { "q": "你 40% 的时间感到疲倦。疲倦时，80% 的时间会烦躁；不疲倦时，10% 的时间会烦躁。已知你烦躁，你疲倦的概率是多少？", "o": ["40%", "32%", "16/19（约 84.2%）", "80%"] },
    "prob-L16-q26": { "q": "每 100 人中有 1 个吸血鬼。99% 的吸血鬼在阳光下会烧起来；人类则从不会。你随机遇到一个人，他在阳光下没有烧起来。他是吸血鬼的概率是多少？", "o": ["1/9901（约 0.0101%）", "1/100", "1/10000", "99/100"] },
    "prob-L16-q27": { "q": "75% 的药丸含 MDMA。一种检测对含 MDMA 的药丸有 50% 呈阳性，对不含的有 40% 呈阳性。一颗药丸检测呈阳性。它含 MDMA 的可能性有多大？", "o": ["50%", "75%", "100%", "15/19（约 78.9%）"] },
    "prob-L16-q28": { "q": "无论药丸是否含 MDMA，一种检测呈阳性的频率都相同。75% 的药丸含 MDMA。一颗药丸检测呈阳性。它含 MDMA 的概率是多少？", "o": ["100%", "50%", "75%", "无法确定。"] },
    "prob-L16-q29": { "q": "假设一种检测的真阳性率（true positive rate）为 50%，但假阳性率（false positive rate）为 0%。一颗药丸检测呈阳性。它含 MDMA 的概率是多少（基础比率（base rate）75%）？", "o": ["50%", "75%", "100%", "87.5%"] },
    "prob-L16-q30": { "q": "同一种检测（真阳性 50%，假阳性 40%）用在只有 10% 药丸含 MDMA 的地方。一颗药丸检测呈阳性。它含 MDMA 的概率最接近：", "o": ["50%", "12.2%", "78.9%", "10%"] },
    "prob-L16-q31": { "q": "哪一对概率之和必然为 1？", "o": ["Pr(P | M) 与 Pr(P | ¬M)", "Pr(P | M) 与 Pr(¬P | M)", "Pr(M | P) 与 Pr(P | M)", "Pr(P | M) 与 Pr(M)"] },
    "prob-L16-q32": { "q": "在吸血鬼问题中（V = 吸血鬼，I = 在阳光下烧起来），你遇到的人没有烧起来。你应该计算哪个量？", "o": ["Pr(V | I)", "Pr(¬I | V)", "Pr(V | ¬I)", "Pr(V & I)"] },
    "prob-L16-q33": { "q": "在贝叶斯定理（Bayes' theorem）中，为什么分母 Pr(E) 展开为 Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H)？", "o": ["因为 E 与 H 总是独立。", "因为 Pr(E|H) + Pr(E|¬H) = 1。", "因为基础比率必须计算两次。", "因为 H 与 ¬H 互斥且穷尽（mutually exclusive and exhaustive），E 只能通过这两条路径之一产生，两条路径都必须计入。"] },
    "prob-L16-q34": { "q": "某种病每 1,000 人中有 1 人患病。患病时检测有 99% 能检出，未患病时有 5% 给出假阳性。某人检测呈阳性。他患病的概率最接近：", "o": ["99%", "95%", "约 2%", "5%"] },
    "prob-L16-q35": { "q": "掷一枚公平硬币：正面选罐子 X（3 黑 1 白），反面选罐子 Y（1 黑 3 白）。有放回地抽两个球，两个都是黑球。硬币是正面的概率是多少？", "o": ["1/2", "3/4", "9/10", "1/10"] },
    "prob-L16-q36": { "q": "同样的罐子（X：3 黑 1 白；Y：1 黑 3 白；由公平硬币选择）。有放回地抽取，先抽到黑球，再抽到白球。正面（罐子 X）的概率是多少？", "o": ["3/4", "1/2", "9/10", "1/4"] },
    "prob-L16-q37": { "q": "哪种说法最能反映讲座对睡美人问题（Sleeping Beauty problem）的处理？", "o": ["存在相互竞争的论证：一种数公平硬币的结果（正面 = 1/2），另一种数无法区分的醒来场合（正面 = 1/3）。", "讲座无可争议地证明了醒来后正面的概率是 1/2。", "讲座无可争议地证明了醒来后正面的概率是 1/3。", "因为反面时睡美人醒来两次，硬币变得有偏。"] },
    "prob-L16-q38": { "q": "按照睡美人问题中的三分之一派（thirder）观点，睡美人醒来时应给反面分配的概率是：", "o": ["1/3", "1/2", "2/3", "1"] },
    "prob-L16-q39": { "q": "“几乎所有患疾病 H 的人都有症状 E，所以有症状 E 的人几乎肯定患有 H。”主要缺陷是什么？", "o": ["它混淆了 Pr(E | H) 与 Pr(H | E)，忽视了 H 有多罕见，以及 E 在没有 H 时出现得有多频繁。", "它假定 E 与 H 互斥。", "在需要联合概率的地方使用了条件概率。", "如果 Pr(E | H) 高于 90%，就没有缺陷。"] },
    "prob-L16-q40": { "q": "保持基础比率和真阳性率 Pr(P | M) 不变，哪种改变会让阳性结果成为支持 M 的更强证据？", "o": ["提高假阳性率 Pr(P | ¬M)", "降低假阳性率 Pr(P | ¬M)", "使 Pr(P | M) + Pr(P | ¬M) 等于 1", "使 Pr(P | ¬M) 等于 Pr(P | M)"] },
    "prob-L16-q41": { "q": "讲座提到，以群体特征作为证据的算法可能误判个人。用贝叶斯的术语来说，主要风险是：", "o": ["如果输入的基础比率或条件概率有误，赋予个人的后验概率（posterior probability）就可能是错的。", "贝叶斯定理不适用于算法。", "算法总是忽略证据。", "后验概率总是等于基础比率。"] },
    "prob-L18-q42": { "q": "在纠正后的创业例子中，你投资 $1 million，如果点子好且创始人有魅力，你会拿回 $4 million。在这一结果下你的净收益（net gain）是多少？", "o": ["亏损 $1 million", "赚 $3 million", "赚 $4 million", "赚 $5 million"] },
    "prob-L18-q43": { "q": "纠正后的创业模型，投资 $1M：好点子 + 有魅力的创始人（概率 2/25）回款 $4M；好点子 + 乏味的创始人（8/25）回款 $0；坏点子（15/25）回款 $0。期望净值（expected NET value）是多少？", "o": ["+$0.32 million", "−$0.68 million", "−$1 million", "+$0.24 million"] },
    "prob-L18-q44": { "q": "同一纠正后模型，但投资 $5M：有魅力（2/25）回款 $20M；乏味的创始人（8/25）回款 $4M；坏点子（15/25）回款 $0。期望净值是多少？", "o": ["+$2.88 million", "−$2.12 million", "−$5 million", "−$0.68 million"] },
    "prob-L18-q45": { "q": "一个公平硬币游戏：正面付 $10，反面付 $0，玩一次需 $6。玩家的期望净收益是多少？", "o": ["赚 $5", "赚 $4", "亏 $1", "亏 $6"] },
    "prob-L18-q46": { "q": "对于正面付 $10、反面付 $0 的游戏（公平硬币），多少入场价能使这个赌局成为公平赌局（fair bet）？", "o": ["$0", "$2.50", "$5", "$10"] },
    "prob-L18-q47": { "q": "一名学生把一张 $5 门票的期望净收益算成 1/2 × (10 − 5) + 1/2 × (0 − 5) − 5 = −5。哪里出错了？", "o": ["没错，这是正确的。", "成本被扣了两次：每个结果里扣一次，最后又扣一次。", "成本应该加上，而不是减去。", "概率应该相乘，而不是相加。"] },
    "prob-L18-q48": { "q": "你支付公平价格（fair price）$5 玩一次 $10/$0 的硬币游戏。哪种说法正确？", "o": ["这一次你保证不赔不赚。", "你平均会赚 $5。", "只有恰好玩两次时这个赌局才公平。", "你的期望净收益是 $0，但这一次你实际上要么赚 $5，要么亏 $5。"] },
    "prob-L18-q49": { "q": "如果一个赌局的价格定得高于其公平价格，而回款不变，那么：", "o": ["下注者的期望净收益为负，庄家获得优势（house edge）", "下注者的期望净收益仍为零", "各结果的概率发生改变", "下注者的期望回款增加"] },
    "prob-L18-q50": { "q": "在马丁格尔策略（Martingale strategy）中，玩家每输一次就把赌注加倍。主要的现实危险是什么？", "o": ["硬币记得之前的输局，变得不那么公平。", "所需赌注可能超出玩家的资金或下注上限。", "加倍会让下一次投掷更可能输。", "该策略保证每一轮都有大额利润。"] },
    "prob-L18-q51": { "q": "在公平硬币的等额赔付（even-money）赌局中使用马丁格尔策略，初始赌注 $1，你连输六次（赌注 1、2、4、8、16、32）。如果你接着押下所需金额并赢了，你的总净收益是多少？", "o": ["$64", "$63", "$1", "$127"] },
    "prob-L18-q52": { "q": "一枚公平硬币连续六次反面。如果各次投掷独立，下一次正面的概率是多少？", "o": ["小于 1/2，因为反面正在连胜", "恰好 1/2", "大于 1/2，因为正面“该来了”", "恰好 1，因为连串必然会结束"] },
    "prob-L18-q53": { "q": "一枚公平硬币连续八次正面的概率是多少？", "o": ["1/8", "1/16", "1/256", "1/512"] },
    "prob-L18-q54": { "q": "一个键盘预测游戏根据某人之前的按键来估计 Pr(F | FFF)。这个表达式问的是什么？", "o": ["已知最近三次按键都是 F 时，下一次按 F 的可能性", "最近三次按键都是 F 的可能性", "此人按了多少次 F", "在一次 F 之后接着三次 F 的可能性"] },
    "prob-L18-q55": { "q": "你拿到硬币 A 或硬币 B 的可能性相同。A 出正面的概率为 0.75；B 为 0.15。投掷前，出正面的总体概率是多少？", "o": ["0.15", "0.30", "0.45", "0.90"] },
    "prob-L18-q56": { "q": "同样的双硬币情形（A：正面 0.75，B：正面 0.15，各以概率 1/2 被选中），你投掷一次看到正面。你拿的是硬币 A 的概率是多少？", "o": ["1/6", "1/2", "3/4", "5/6"] },
    "prob-L18-q57": { "q": "在双硬币情形中看到正面后，哪种说法正确？", "o": ["硬币 A 出正面的几率升到了 0.75 以上。", "硬币 B 现在出正面的概率为 0。", "什么都没变，因为硬币投掷是独立的。", "我们认为手中是硬币 A 的概率从 1/2 升到 5/6，但硬币 A 本身出正面的几率仍是 0.75。"] },
    "prob-L18-q58": { "q": "有些计算机“随机数”生成器从一个种子（seed）出发并应用固定规则。由此可得什么？", "o": ["从同一种子出发会重现同一序列。", "该序列原则上真正不可预测。", "每个数取决于前一个数被重复的概率。", "输出不可能包含连串。"] },
    "prob-L18-q59": { "q": "一个游戏的期望值（expected value）是 $5。哪种解释正确？", "o": ["每次玩你都会恰好得到 $5。", "$5 是最可能的单次结果。", "重复很多次后，每次的平均结果趋近 $5。", "至少一半的游戏会付 $5 或更多。"] }
  },
  "calc": {
    "prob-L12-c01": { "q": "1,000 名学生中，350 名是本地生且住校内，100 名是国际生且住校内，200 名是本地生且住校外，350 名是国际生且住校外。设 A = 住校内，B = 本地生。求 Pr(B)、Pr(A & B) 和 Pr(A | B)。", "s": ["Pr(B) = ?", "Pr(A & B) = ?", "Pr(A | B) = ?"] },
    "prob-L12-c02": { "q": "使用同一张校园表（A = 住校内，B = 本地生；A&B 350，A&~B 100，~A&B 200，~A&~B 350），求 Pr(A)、Pr(B | A) 和 Pr(A | ~B)。A 与 B 是否独立（independent）？", "s": ["Pr(A) = ?", "Pr(B | A) = ?", "Pr(A | ~B) = ?"] },
    "prob-L12-c03": { "q": "Pr(D) = 0.5，Pr(S) = 0.3，Pr(D & S) = 0.1。补全列联表（contingency table），并求 Pr(~D & S)、Pr(D & ~S)、Pr(~D & ~S) 和 Pr(D | ~S)。", "s": ["Pr(~D & S) = ?", "Pr(D & ~S) = ?", "Pr(~D & ~S) = ?", "Pr(D | ~S) = ?"] },
    "prob-L12-c04": { "q": "30% 的居民住在北岸（N），70% 住在南岸（~N）。北岸居民中 10% 被喜鹊俯冲（S），南岸居民中 2% 被俯冲。求 Pr(N & S)、Pr(~N & S)、Pr(S) 和 Pr(N | S)。", "s": ["Pr(N & S) = ?", "Pr(~N & S) = ?", "Pr(S) = ?", "Pr(N | S) = ?"] },
    "prob-L12-c05": { "q": "40% 的居民住在北岸（N）。北岸居民中 15%、南岸居民中 5% 被俯冲（S）。求 Pr(N & S)、Pr(~N & S)、Pr(S) 和 Pr(N | S)。", "s": ["Pr(N & S) = ?", "Pr(~N & S) = ?", "Pr(S) = ?", "Pr(N | S) = ?"] },
    "prob-L12-c06": { "q": "200 名学生中，60 人参加了复习课且及格（A = 及格，B = 参加），40 人参加但不及格，20 人未参加但及格，80 人未参加且不及格。求 Pr(A)、Pr(A | B) 和 Pr(A | ~B)。A 与 B 是否独立？", "s": ["Pr(A) = ?", "Pr(A | B) = ?", "Pr(A | ~B) = ?"] },

"prob-L8-c09":{"s":[
"乘法规则：每次投掷独立，所以两次都出 6 直接相乘。\nP(6 ∧ 6) = 0.3 × 0.3 = 0.09\n骰子不公平，但独立性仍允许相乘。",
"独立的定义：P(A | B) = P(A)，前四次没出 6 不影响下一次。\nP(6 next | no 6 in last four) = 0.3\n不会因为“很久没出 6”就变得更可能。",
"补集 + 乘法规则：每次不出 6 的概率 = 1 − 0.3 = 0.7，四次独立，相乘。\nP(no 6 in four) = 0.7^4 = 0.7 × 0.7 × 0.7 × 0.7 = 0.2401\n四次都没出 6 的概率约 24%。",
"补集规则：“至少一个 6”的补集是“一个 6 都没有”。\nP(at least one 6) = 1 − 0.2401 = 0.7599\n四次里至少出一次 6 的概率约 76%。"],
"trap":"(d) 写成 4 × 0.3 = 1.2：各次出 6 不互斥，不能直接相加，概率也不可能超过 1。"},
"prob-L8-c10":{"s":[
"等可能原则：52 张牌等可能，A 有 4 张。\nP(Ace) = 4/52 = 1/13 ≈ 0.07692\n随机抽一张是 A 的概率。",
"条件概率（缩小样本空间）：已知是黑桃，只看 13 张黑桃，其中 1 张是 A。\nP(Ace | Spade) = 1/13 ≈ 0.07692\n与 P(Ace) 相等，所以 Ace 与 Spade 独立。",
"等可能原则，或独立时的乘法规则：同时是 A 和黑桃的只有黑桃 A 一张。\nP(Ace ∧ Spade) = 1/52 = 1/13 × 1/4 ≈ 0.01923\n等于 P(Ace) × P(Spade)，再次验证独立。",
"条件概率：已知是红桃，红桃一定是红色。\nP(Red | Heart) = 13/13 = 1\n而 P(Red) = 26/52 = 1/2，1 ≠ 1/2，所以 Heart 与 Red 不独立。"],
"trap":"以为能同时发生（如黑桃 A）就不独立；判断独立要看 P(A | B) 是否等于 P(A)。"},
"prob-L10-c11":{"s":[
"加法规则：A∧B 与 A∧¬B 互斥（B 和 ¬B 不能同时成立）；且这个析取在逻辑上等价于 A，等价式概率相同。\nP(A) = 1/4 + 1/6 = 3/12 + 2/12 = 5/12 ≈ 0.41667\nA 发生的总概率。",
"补集规则：A 与 ¬A 互斥且穷尽。\nP(¬A) = 1 − 5/12 = 7/12 ≈ 0.58333\nA 不发生的概率。",
"矛盾式的概率为 0：(A∧B) ∧ (A∧¬B) 里同时包含 B 和 ¬B，不可能为真。\nP[(A∧B) ∧ (A∧¬B)] = 0\n不能用乘法 1/4 × 1/6 = 1/24，因为两者不独立（它们互斥）。"],
"trap":"看到 AND 就直接相乘得 1/24，没发现这个合取是矛盾式，概率必为 0。"},
"prob-L10-c12":{"s":[
"互斥的定义：A 与 C 不能同时发生。\nP(A ∧ C) = 0\n互斥事件的合取概率为 0，不要相乘。",
"乘法规则：A 与 B 独立，所以 P(A ∧ B) = P(A) × P(B)。\nP(A ∧ B) = 1/4 × 1/5 = 1/20 = 0.05\nA 和 B 同时发生的概率。",
"加法规则：A∧B 发生时 A 一定发生，而 A 与 C 互斥，所以 A∧B 与 C 也互斥，可以直接相加。\nP[(A∧B) ∨ C] = 1/20 + 1/10 = 1/20 + 2/20 = 3/20 = 0.15\n两者至少一个发生的概率。"],
"trap":"把独立当成互斥（或反过来），例如把 P(A ∧ C) 算成 1/4 × 1/10，或不检查互斥就直接相加。"},
"prob-L10-c13":{"s":[
"乘法规则：两颗骰子独立，且指定了哪颗是 3、哪颗是 4（有序）。\nP(die1 = 3 ∧ die2 = 4) = 1/6 × 1/6 = 1/36 ≈ 0.02778\n36 种等可能结果中只有 (3,4) 一种。",
"加法规则：“一颗 3、另一颗 4”包含 (3,4) 和 (4,3) 两种结果，二者互斥。\nP = 1/36 + 1/36 = 2/36 = 1/18 ≈ 0.05556\n无序问法要把两种顺序都算上。",
"补集 + 乘法规则：每颗不出 6 的概率 5/6，两颗独立，相乘。\nP(neither 6) = 5/6 × 5/6 = 25/36 ≈ 0.69444\n两颗都不是 6 的概率。",
"补集规则：“至少一个 6”的补集是“都不是 6”。\nP(at least one 6) = 1 − 25/36 = 11/36 ≈ 0.30556\n不能用 1/6 + 1/6，因为两颗都为 6 的 (6,6) 会被重复计算。"],
"trap":"(b) 忘了乘 2 只算 (3,4)，或 (c) 直接写 1/6 + 1/6 = 1/3 重复计算了 (6,6)。"},
"prob-L10-c14":{"s":[
"乘法规则：有放回时第一次抽完放回，袋子不变，两次独立。\nP(both blue) = 3/5 × 3/5 = 9/25 = 0.36\n每次抽到蓝球都是 3/5。",
"条件概率（袋子组成改变）：无放回且第一次是蓝球，袋中剩 2 蓝 2 绿，共 4 个。\nP(2nd blue | 1st blue) = 2/4 = 1/2 = 0.5\n第一次的结果改变了第二次的概率，所以不独立。",
"一般乘法规则：P(B₁ ∧ B₂) = P(B₁) × P(B₂ | B₁)。\nP(both blue) = 3/5 × 2/4 = 6/20 = 3/10 = 0.3\n比有放回的 0.36 小，因为第一次拿走了一个蓝球。"],
"trap":"无放回时仍用 (3/5)² = 0.36，忽略了第一次抽取改变了袋子组成。"},
"prob-L10-c15":{"s":[
"一般乘法规则：无放回，P(R₁ ∧ R₂) = P(R₁) × P(R₂ | R₁)；第一次红后剩 3 红 9 球。\nP(both red) = 4/10 × 3/9 = 12/90 ≈ 0.13333\n两次都抽到红球的概率。",
"一般乘法规则：第一次白后剩 5 白 9 球。\nP(both white) = 6/10 × 5/9 = 30/90 ≈ 0.33333\n两次都抽到白球的概率。",
"补集规则：两红、两白、一红一白三种情况互斥且穷尽。\nP(one of each) = 1 − 12/90 − 30/90 = 48/90 ≈ 0.53333\n验证：(红,白)+(白,红) = 4/10×6/9 + 6/10×4/9 = 24/90 + 24/90 = 48/90。"],
"trap":"“一红一白”只算 4/10 × 6/9 = 24/90，漏掉了先白后红的另一种顺序。"},
"prob-L10-c16":{"s":[
"加法规则：2、4、6 三个面互斥，按各自的实际概率相加（结果不等可能，不能数个数）。\nP(even) = 1/10 + 1/10 + 1/2 = 0.1 + 0.1 + 0.5 = 0.7\n掷出偶数的概率。",
"补集规则：奇数与偶数互斥且穷尽。\nP(odd) = 1 − 0.7 = 0.3（也可 1/10 × 3 = 0.3 验证）\n掷出奇数的概率。",
"乘法规则：骰子虽然不公平，但各次投掷独立，所以相乘。\nP(even ∧ even) = 0.7 × 0.7 = 0.49\n连续两次都是偶数的概率。"],
"trap":"把六个面当作等可能，写 P(even) = 3/6 = 1/2；不公平的骰子要按实际权重相加。"},
"prob-L10-c17":{"s":[
"加法规则：A、B、C 两两互斥，并集概率等于各自相加。\nP(A ∨ B ∨ C) = 0.2 + 0.3 + 0.15 = 0.65\n三者至少一个发生的概率。",
"加法规则反推：D 与 A、B、C 都互斥，所以 P(A∨B∨C∨D) = P(A∨B∨C) + P(D) = 1。\nP(D) = 1 − 0.65 = 0.35\n剩下的概率全部属于 D。",
"补集规则：D 与 ¬D 互斥且穷尽。\nP(¬D) = 1 − 0.35 = 0.65\n恰好等于 P(A∨B∨C)，因为 ¬D 就是 A、B、C 之一发生。"],
"trap":"不检查 D 与 A、B、C 是否互斥就做减法；若有重叠，P(D) 无法由 1 − 0.65 唯一得出。"}
}}

{"calc":{
"prob-L12-c01":{"s":[
"规则：边际概率 = 该类别总人数 ÷ 全体。B（本地生）是表中一整列，要把这一列的两格加起来。\n代入：Pr(B) = (350 + 200)/1000 = 550/1000 = 0.55\n含义：1000 个学生里有 550 个是本地生，占 55%。",
"规则：AND（交集）概率 = 同时满足两个条件的那一格 ÷ 全体。分母仍是 1000，因为没有给定任何条件。\n代入：Pr(A & B) = 350/1000 = 0.35\n含义：随机抽一个学生，他既是本地生又住校内的概率是 35%。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)。给定 B 就是只在本地生里看，分母缩小为 550。\n代入：Pr(A | B) = 0.35/0.55 = 350/550 = 7/11 ≈ 0.6364\n含义：在 550 个本地生中，有 350 个住校内，约 63.6%。"],
"trap":"把 Pr(A | B) 的分母仍写成全体 1000，于是错把交集 0.35 当成了条件概率。"},
"prob-L12-c02":{"s":[
"规则：边际概率 = 整行合计 ÷ 全体。A（住校内）是表中一整行。\n代入：Pr(A) = (350 + 100)/1000 = 450/1000 = 0.45\n含义：全体学生中 45% 住校内。",
"规则：条件概率定义 Pr(B | A) = Pr(A & B)/Pr(A)。现在给定的是 A，所以分母换成住校内的 450 人。\n代入：Pr(B | A) = 350/450 = 7/9 ≈ 0.7778\n含义：住校内的 450 人中有 350 个本地生，约 77.8%。注意它和 Pr(A | B) = 0.636 不一样。",
"规则：条件概率定义 Pr(A | ~B) = Pr(A & ~B)/Pr(~B)。给定 ~B，只看国际生那一列，共 100 + 350 = 450 人。\n代入：Pr(A | ~B) = 100/450 = 2/9 ≈ 0.2222\n含义：国际生中只有约 22.2% 住校内。和本地生的 63.6% 差很多，所以 A 与 B 不独立（Pr(A | B) ≠ Pr(A) = 0.45）。"],
"trap":"把 Pr(B | A) 和 Pr(A | B) 当成同一个数：分子都是 350，但分母一个是 450、一个是 550。"},
"prob-L12-c03":{"s":[
"规则：一行（或一列）的合计 = 该行各格之和，所以未知格 = 合计 − 已知格。S 这一行由 D&S 和 ~D&S 组成。\n代入：Pr(~D & S) = Pr(S) − Pr(D & S) = 0.3 − 0.1 = 0.2\n含义：100 人表中，30 个 S 里有 10 个是 D，剩下 20 个是 ~D。",
"规则：同理用 D 这一列：D 的合计由 D&S 和 D&~S 组成。\n代入：Pr(D & ~S) = Pr(D) − Pr(D & S) = 0.5 − 0.1 = 0.4\n含义：50 个 D 里有 10 个是 S，其余 40 个是 ~S。",
"规则：四格之和必须等于 1，所以最后一格 = 1 − 其他三格。也可用 Pr(~S) − Pr(D & ~S) = 0.7 − 0.4 检查。\n代入：Pr(~D & ~S) = 1 − 0.1 − 0.2 − 0.4 = 0.3\n含义：100 人中有 30 人既不是 D 也不是 S。",
"规则：条件概率定义 Pr(D | ~S) = Pr(D & ~S)/Pr(~S)，其中 Pr(~S) = 1 − 0.3 = 0.7（补集规则）。\n代入：Pr(D | ~S) = 0.4/0.7 = 4/7 ≈ 0.5714\n含义：70 个 ~S 的人中有 40 个是 D，约 57.1%。"],
"trap":"题目没说 D 与 S 独立，却直接用 Pr(~D)×Pr(~S) = 0.5×0.7 = 0.35 去算交集。"},
"prob-L12-c04":{"s":[
"规则：乘法规则 Pr(N & S) = Pr(S | N)×Pr(N)。题目给的 10% 是北岸居民中的比例，即 Pr(S | N)，要乘上北岸人口占比才得到全体中的交集。\n代入：Pr(N & S) = 0.1 × 0.3 = 0.03\n含义：100 个居民中，30 个住北岸，其中 3 个被俯冲。",
"规则：同样用乘法规则，这次在南岸这一组：Pr(~N & S) = Pr(S | ~N)×Pr(~N)。\n代入：Pr(~N & S) = 0.02 × 0.7 = 0.014\n含义：100 个居民中，70 个住南岸，其中 1.4 个被俯冲。",
"规则：全概率规则。N 和 ~N 互斥且穷尽，被俯冲的人要么来自北岸要么来自南岸，所以两个交集相加。\n代入：Pr(S) = Pr(N & S) + Pr(~N & S) = 0.03 + 0.014 = 0.044\n含义：全体居民中 4.4% 被俯冲。",
"规则：条件概率定义（也就是 Bayes 定理）Pr(N | S) = Pr(N & S)/Pr(S)。给定 S，只在被俯冲的人里看。\n代入：Pr(N | S) = 0.03/0.044 = 15/22 ≈ 0.6818\n含义：4.4 个被俯冲的人中有 3 个来自北岸，约 68.2%。"],
"trap":"把 10% 和 2% 直接平均成 6% 当作 Pr(S)，忽略了北岸和南岸人口大小不同（30% 对 70%）。"},
"prob-L12-c05":{"s":[
"规则：乘法规则 Pr(N & S) = Pr(S | N)×Pr(N)。15% 是北岸内部的比例，要乘北岸占比 40%。\n代入：Pr(N & S) = 0.15 × 0.4 = 0.06\n含义：100 人中，40 个北岸居民里有 6 个被俯冲。",
"规则：乘法规则用于南岸：Pr(~N) = 1 − 0.4 = 0.6（补集规则），Pr(~N & S) = Pr(S | ~N)×Pr(~N)。\n代入：Pr(~N & S) = 0.05 × 0.6 = 0.03\n含义：60 个南岸居民里有 3 个被俯冲。",
"规则：全概率规则，把两个互斥分组的交集相加。\n代入：Pr(S) = 0.06 + 0.03 = 0.09\n含义：100 人中共有 9 人被俯冲。",
"规则：条件概率定义 / Bayes 定理 Pr(N | S) = Pr(N & S)/Pr(S)。\n代入：Pr(N | S) = 0.06/0.09 = 2/3 ≈ 0.6667\n含义：9 个被俯冲的人中 6 个来自北岸，占三分之二。"],
"trap":"忘了 Pr(~N) 要用 1 − 0.4 = 0.6，或者把 15% 与 5% 简单平均成 10% 当作 Pr(S)。"},
"prob-L12-c06":{"s":[
"规则：边际概率 = 行合计 ÷ 全体。及格（A）的人包括参加和未参加两部分。\n代入：Pr(A) = (60 + 20)/200 = 80/200 = 0.4\n含义：200 个学生中 40% 及格。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)。给定 B，只看参加复习的 60 + 40 = 100 人。\n代入：Pr(A | B) = 60/100 = 0.6（或 0.3/0.5）\n含义：参加复习的人中 60% 及格。",
"规则：条件概率定义 Pr(A | ~B) = Pr(A & ~B)/Pr(~B)。给定 ~B，只看未参加的 20 + 80 = 100 人。\n代入：Pr(A | ~B) = 20/100 = 0.2\n含义：未参加的人中只有 20% 及格。由于 Pr(A | B) = 0.6 ≠ Pr(A) = 0.4，A 与 B 不独立。"],
"trap":"看到 A 与 B 不独立就断定「参加复习导致及格」——不独立只说明相关，不证明因果。"},
"prob-L12-c07":{"s":[
"规则：四季等可能，每季概率 1/4；AND 要找两个事件同时为真的季节。A = 冬、春、夏，B = 夏、秋，重叠只有夏季。\n代入：Pr(A & B) = Pr(夏) = 1/4 = 0.25\n含义：只有夏天出生的人同时满足 A 和 B。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)，其中 Pr(B) = Pr(夏) + Pr(秋) = 1/2。\n代入：Pr(A | B) = (1/4)/(1/2) = 1/2 = 0.5\n含义：已知生在夏或秋，那么属于 A 的只有夏这一半。",
"规则：A 包含三个互斥的季节，用加法规则把它们相加。\n代入：Pr(A) = 1/4 + 1/4 + 1/4 = 3/4 = 0.75\n含义：不知道任何信息时 A 的概率是 75%；而 Pr(A | B) = 0.5 ≠ 0.75，所以 A 与 B 不独立。"],
"trap":"分子把交集错写成并集（如「春或夏或秋」），得出大于 1 的概率；交集只能是两个事件都包含的季节。"},
"prob-L12-c08":{"s":[
"规则：独立事件的乘法规则 Pr(A & B) = Pr(A)×Pr(B)。只有题目明确说独立时才能这样乘。\n代入：Pr(A & B) = 0.4 × 0.5 = 0.2\n含义：100 次中约 20 次 A 和 B 同时发生。",
"规则：A 这一行的合计 = Pr(A & B) + Pr(A & ~B)，所以用合计减交集。\n代入：Pr(A & ~B) = Pr(A) − Pr(A & B) = 0.4 − 0.2 = 0.2\n含义：40 次 A 中有 20 次 B 不发生。",
"规则：~B 这一列的合计 Pr(~B) = 1 − 0.5 = 0.5（补集规则），再减去 Pr(A & ~B)。\n代入：Pr(~A & ~B) = 0.5 − 0.2 = 0.3（也等于 0.6 × 0.5，因为 A、B 独立时其补集也独立）\n含义：100 次中约 30 次 A 和 B 都不发生。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)。\n代入：Pr(A | B) = 0.2/0.5 = 0.4\n含义：结果正好等于 Pr(A) = 0.4，验证了独立：知道 B 发生不改变 A 的概率。"],
"trap":"把这里「已知独立才能相乘」的做法搬到没说独立的题目上（如 c03），默认独立去乘。"},
"prob-L11-c09":{"s":[
"规则：边际概率 = 出现次数 ÷ 总记录数。\n代入：Pr(A) = 10/1000 = 0.01\n含义：随便拿一条记录，含有词 A 的概率只有 1%，A 很罕见。",
"规则：AND 概率 = 同时含 A 和 B 的记录数 ÷ 全体，分母仍是 1000。\n代入：Pr(A & B) = 8/1000 = 0.008\n含义：1000 条记录中只有 8 条两个词都有。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)，其中 Pr(B) = 10/1000 = 0.01。给定 B，只看含 B 的 10 条记录。\n代入：Pr(A | B) = 0.008/0.01 = 0.8\n含义：含 B 的 10 条记录里有 8 条也含 A——A 虽然总体罕见，但只要出现 B，A 就很常见。"],
"trap":"以为 A 总体只有 1%，所以给定 B 后 A 的概率也应该很小；条件概率可以和总体频率差得很远。"},
"prob-L16-c10":{"s":[
"规则：乘法规则 Pr(T & I) = Pr(I | T)×Pr(T)。80% 是「疲倦时」烦躁的比例，即 Pr(I | T)，要乘上疲倦的比例。\n代入：Pr(T & I) = 0.8 × 0.4 = 0.32\n含义：100 个时刻中 40 个疲倦，其中 32 个烦躁。",
"规则：乘法规则用于不疲倦这一组，Pr(¬T) = 1 − 0.4 = 0.6。\n代入：Pr(¬T & I) = Pr(I | ¬T)×Pr(¬T) = 0.1 × 0.6 = 0.06\n含义：60 个不疲倦时刻中有 6 个烦躁。",

"logic-L1-q02":"选 A：批判性思维＝可靠的前提＋好的推理。\nB 错：结论真、信得坚定，都不是检查标准。\nC 错：诉诸权威不是公式的一部分。\nD 错：背谬误名称不等于检查前提是否可靠。",
"logic-L1-q03":"选 B：只有维州或塔州人这么说，再加「不是塔州人」，才推出维州。\nA 错：方向反了，不排除别州的人也这么说。\nC 错：她住没住过 Tasmania 与推理无关。\nD 错：多数人怎么叫，推不出她来自哪里。",
"logic-L1-q04":"选 A：「不学就不过」说明学习是必要条件，结论却当成充分条件。\nB 错：方向反了，题目是把必要当充分。\nC 错：只有一个前提，谈不上互相矛盾。\nD 错：题目里没有「或」。",
"logic-L1-q05":"选 C：逻辑只保证：前提若真，结论必真。\nA 错：前提来自错误理论，结论可能为假。\nB 错：逻辑不检查前提有没有正当理由。\nD 错：健全还要求前提事实上为真，这里前提假。",
"logic-L4-q01":"选 B：这正是有效的定义：不存在前提全真而结论假的情况。\nA 错：混淆了有效与事实上为真。\nC 错：「很可能真」是概率支持，不是有效。\nD 错：相关性不在定义中；矛盾前提无关也有效。",
"logic-L4-q02":"选 D：P1、P2 矛盾不能同真，没有反例 → 有效；前提不能全真 → 不健全。\nA 错：话题无关不影响有效性。\nB 错：它没有反例，是有效的。\nC 错：矛盾前提不可能全真，不可能健全。",
"logic-L4-q03":"选 B：矛盾前提不可能全真，没有反例，所以有效但永远不健全。\nA 错：没有反例，就不可能无效。\nC 错：健全要求前提都真，矛盾前提做不到。\nD 错：结论是什么都有效，与结论无关。",
"logic-L4-q04":"选 B：前提不能同时为真，就不存在前提全真而结论假的情况。\nA 错：有假前提不保证有效，Klein 例子就无效。\nC 错：结论可以是任意命题，如「Cleo 是猫」。\nD 错：前提互相矛盾，不是互相蕴涵。",
"logic-L4-q05":"选 C：结论 C ∨ ~C 不可能为假，没有反例 → 有效；P2 假 → 不健全。\nA 错：话题无关不影响有效性。\nB 错：假前提只影响健全，不影响有效。\nD 错：P2 为假，所以不健全。",
"logic-L4-q06":"选 D：假设前提都真，Cleo 必会飞 → 有效；P1 事实上为假 → 不健全。\nA 错：P1「所有猫都会飞」为假，不健全。\nB 错：没有反例，它是有效的。\nC 错：健全要求有效，「无效但健全」不可能。",
"logic-L4-q07":"选 C：可以设想喝咖啡、吃酸奶却没有猫，这就是反例 → 无效。\nA 错：句句都真不保证有效。\nB 错：无效论证不可能健全。\nD 错：题目设定前提都为真。",
"logic-L4-q08":"选 B：健全＝有效＋所有前提事实上为真。\nA 错：结论真不代表有效、前提真。\nC 错：缺了有效；Klein 例子前提都真却无效。\nD 错：有无隐含前提与健全的定义无关。",
"logic-L4-q09":"选 A：前提若全真，结论必真；现在结论假 → 至少一个前提为假。\nB 错：太强了，不必所有前提都假。\nC 错：题目已说它有效，结论假不改变这点。\nD 错：可以推出至少一个前提为假。",
"logic-L4-q10":"选 B：有效＋前提全真＋结论假，正是有效定义排除的情况。\nA 错：可能。前提有假时，有效论证结论可真可假。\nC 错：可能，Klein 例子前提、结论都真却无效。\nD 错：可能，如「猫是狗；狗是哺乳动物 ∴ 猫是哺乳动物」。",
"logic-L4-q11":"选 D：P2、P3 只谈猫，没说 Cleo 是猫，要补这个隐含前提才有效。\nA 错：缺「Cleo 是猫」，按原样无效。\nB 错：按原样它无效，谈不上有效。\nC 错：「Cleo 活跃」P1 已经说了。",
"logic-L4-q12":"选 A：补完后结构有效，但「Taylor Swift 是弦理论权威」为假 → 不健全。\nB 错：诉诸权威不自动是谬误，看权威是否相关。\nC 错：补上的一个前提为假，不健全。\nD 错：补上的前提正好连起结论，已经有效。",
"logic-L4-q13":"选 B：反例要前提全真、结论假：街湿、条件句成立、但没下雨。\nA 错：结论「下雨了」为真，不是反例。\nC 错：街是干的，前提「街湿」为假。\nD 错：下雨街却干，条件句前提为假。",
"logic-L4-q14":"选 B：晨星就是金星，A 与 C 可以同真，所以互斥不传递。\nA 错：互斥没有传递性。\nC 错：概率是否相同与互斥无关。\nD 错：也推不出一定相容，只是信息不足。",
"logic-L4-q15":"选 A：蕴涵可以传递：A 真则 B 真，B 真则 C 真，所以 A 蕴涵 C。\nB 错：方向反了，C 不一定蕴涵 A。\nC 错：A 真时 C 必真，二者可同真，不互斥。\nD 错：蕴涵可以接力，能推出 A 蕴涵 C。",
"logic-L4-q16":"选 B：论证有效 ⇔ 前提合取 P1 & P2 & P3 蕴涵结论。\nA 错：太强；Potato cakes 例子单个前提推不出结论。\nC 错：方向反了。\nD 错：前提互斥与有效的定义无关。",
"logic-L6-q01":"选 B：3 个原子命题 A、B、C → 2ⁿ 行。\n算：2³ = 8\nA 错：6 是 2×3，算法错。\nC 错：9 是 3²，底数和指数弄反了。\nD 错：16 是 4 个原子命题的行数。",
"logic-L6-q02":"选 A：只有 A、B 两个原子命题，行数与联结词个数无关。\n算：2² = 4\nB 错：8 行需要 3 个原子命题。\nC 错：16 行需要 4 个原子命题。\nD 错：32 行需要 5 个原子命题。",
"logic-L6-q03":"选 C：最外层的 ∨ 把 (A & B) 和 ~B 两大块连起来，是主联结词。\nA 错：& 只连 A 和 B，在括号里。\nB 错：~ 只作用于 B。\nD 错：每个复合命题都有主联结词。",
"logic-L6-q04":"选 C：最外层把 ~(A ∨ B) 和 C 连起来的是 &。\nA 错：~ 只管括号 (A ∨ B)，不在最外层。\nB 错：∨ 在括号里。\nD 错：式子里没有 ⊃。",
"logic-L6-q05":"选 C：目标列有 T 有 F，是偶然命题。\n算：TT→T，TF→T，FT→F，FF→T\nA 错：FT 行为 F，不是每行都真。\nB 错：有三行为 T，不是逻辑假。\nD 错：真值表总能判定。",
"logic-L6-q06":"选 C：8 行中 4 行 T、4 行 F，是偶然命题。\n算：FFT 行：F ∨ ~F = T；TTF 行：F ∨ ~T = F\nA 错：TTF 行为 F。\nB 错：FFT 行为 T。\nD 错：真值表能判定，不需更多信息。",
"logic-L6-q07":"选 D：左块要 C 假，右块要 C 真，& 要两块同真 → 每行都假。\nA 错：没有任何一行为真。\nB 错：真值表总能判定。\nC 错：没有为真的行，不是偶然。",
"logic-L6-q08":"选 A：主联结词是中间的 ∨，左边 A ∨ ~A 永真，T ∨ X = T。\nB 错：左边永真，整体不可能为假。\nC 错：每行都真，不是偶然。\nD 错：用捷径就能判定，不必画满 8 行。",
"logic-L6-q09":"选 D：主联结词是 &，左边 A & ~A 永假，F & X = F。\nA 错：每行都假。\nB 错：用捷径就能判定。\nC 错：没有为真的行，不是偶然。",
"logic-L6-q10":"选 C：F ∨ X = X，整体等于 B：B 真则真，B 假则假 → 偶然。\nA 错：B=F 时整体为假。\nB 错：B=T 时整体为真；F ∨ X 不是捷径。\nD 错：真值表总能判定。",
"logic-L6-q11":"选 C：T ∨ X = T：析取一边为真，整体就为真。\nA 错：T & X = X，取决于 X。\nB 错：F ∨ X = X，取决于 X。\nD 错：前件假时条件句为真，F ⊃ X = T。",
"logic-L6-q12":"选 D：A ⊃ B 只在前件真、后件假时为假。\nA 错：前件假，条件句为真。\nB 错：前件、后件都真，条件句为真。\nC 错：前件假，条件句为真。",
"logic-L6-q13":"选 D：前件为假时实质条件句为真，没出现前件真后件假。\nA 错：只有前件真、后件假才为假。\nB 错：按真值表可以直接判定。\nC 错：命题总有真值，T 或 F。",
"logic-L6-q14":"选 C：~A ∨ B 与 A ⊃ B 每行同值。\n算：两列都是 T F T T（顺序 TT, TF, FT, FF）\nA 错：A ∨ ~B 列是 T T F T，等于 B ⊃ A。\nB 错：~A & B 只在 FT 行为真。\nD 错：B ⊃ A 是反方向，列为 T T F T。",
"logic-L6-q15":"选 A：A ⊃ B 只排除「A 真 B 假」，就是 ~(A & ~B)。\n算：~(A & ~B) 列为 T F T T，与 A ⊃ B 相同\nB 错：~(A ∨ ~B) ≡ ~A & B，只在 FT 行真。\nC 错：~A & ~B 只在 FF 行真。\nD 错：A & ~B 正是 A ⊃ B 的否定。",
"logic-L6-q16":"选 D：德摩根律：每项都否定，∨ 变 &。\nA 错：只否定没换联结词，它等于 ~(A & B)。\nB 错：A & B 没有否定，意思相反。\nC 错：只否定了 A，也没换联结词。",
"logic-L6-q17":"选 C：德摩根律：~(A & B) ≡ ~A ∨ ~B。\nA 错：没把 & 换成 ∨；TF 行它为 F。\nB 错：只否定了 A，B 没否定。\nD 错：~(A ∨ B) 等于 ~A & ~B，是「两者都不」。",
"logic-L6-q18":"选 B：德摩根律加双重否定：~(A ∨ ~B) ≡ ~A & ~~B ≡ ~A & B。\nA 错：没把 ∨ 换成 &。\nC 错：~~B 应化简为 B，不是 ~B。\nD 错：A 应被否定、B 不应被否定，正好反了。",
"logic-L6-q19":"选 D：没有括号时 ~ 只管 A；前者否定整个析取。\n算：A=F, B=T：~(A ∨ B) = F，~A ∨ B = T\nA 错：FT 行两者真值不同。\nB 错：两者都是偶然命题，不是逻辑假。\nC 错：德摩根律给的是 ~A & ~B，不是 ~A ∨ B。",
"logic-L6-q20":"选 A：本课的 ∨ 是包容性或，T ∨ T = T。\nB 错：那是排他的或，本课不用。\nC 错：命题总有真值。\nD 错：本课 ∨ 一律包容，不看说话者意图。",
"logic-L6-q21":"选 A：逻辑等价要求每一行真值都相同。\nB 错：只有一行相同远远不够。\nC 错：现实中同真不代表每种情况都同值。\nD 错：单向蕴涵不够：A & B 蕴涵 A 但不等价。",
"logic-L6-q22":"选 A：它只在前提全真、结论假时为假，有效论证没有这种行 → 永真。\nB 错：有效时它每行都真，不是永假。\nC 错：没有为假的行，不是偶然。\nD 错：只凭「有效」就能判定。",
"logic-L6-q23":"选 A：X ⊃ Y ≡ ~X ∨ Y，它等价于 (P1 & P2 & P3) ⊃ C，所以永真。\nB 错：这正是反例情况，有效时它永假。\nC 错：前提不全真且结论真时它为假。\nD 错：结论真不保证前提真，不必永真。",
"logic-L6-q24":"选 A：前提全真只有 A=F, B=T 一行，此行 B 为真 → 无反例 → 有效。\nB 错：A=T 时 ~A 为假，前提不全真。\nC 错：A=F, B=F 时 A ∨ B 为假，不是反例。\nD 错：真值表可以检验有效性。",
"logic-L6-q25":"选 D：A=F, B=T 时 A ⊃ B 真、B 真，结论 A 假 → 反例 → 无效。\nA 错：存在反例行 FT。\nB 错：它无效，谈不上有效但不健全。\nC 错：A=T, B=F 时 A ⊃ B 为假，不是反例。",
"logic-L6-q26":"选 A：前提全真只有 A=F, B=F 一行，此行 ~A 为真 → 有效。\nB 错：A=T, B=F 时 A ⊃ B 为假，不是反例。\nC 错：此行前提全真，但结论 ~A 也为真。\nD 错：A=F, B=T 时 ~B 为假，不是反例。",
"logic-L6-q27":"选 B：⊃ 只有 T/F 两种值；条件概率 P(B|A) 是 0 到 1 之间的数。\nA 错：一个是真值，一个是概率，不是一回事。\nC 错：A 假时 A ⊃ B 为真，P(B|A) 却不必为 1。\nD 错：⊃ 不表达因果关系。",
"logic-L6-q28":"选 B：两块都为假，所以整体为假。\n算：A & B = F & T = F；~B = F；F ∨ F = F\nA 错：两块都为 F，析取为假。\nC 错：命题在一行里只有 T 或 F。\nD 错：式子里没有 C。",
"logic-L6-q29":"选 A：but 在逻辑里就是 &，「Bob 不在家」是 ~B。\nB 错：~(A & B) 只是「不都在家」，范围更宽。\nC 错：A ∨ ~B 是析取，不是「而且」。\nD 错：把 Alice 和 Bob 弄反了。",
"logic-L6-q30":"选 B：S ⊃ E 只在 S 真、E 假时为假：提交了却没收到邮件。\nA 错：没提交，前件假，条件句为真。\nC 错：没提交，前件假，条件句为真。\nD 错：前件、后件都真，条件句为真。",
"logic-L6-q31":"选 B：句子说逻辑真理，论证说有效；A ∨ ~A 永真，A, ~A ∴ C 前提矛盾而有效。\nA 错：论证不能说是逻辑真理。\nC 错：句子不能说是有效。\nD 错：论证不能说是偶然。",
"logic-L8-q01":"选 A：令 X＝(A & B)，原式是 X ∨ ~X，每行都真。\nB 错：每行都真，不是永假。\nC 错：没有为假的行，不是偶然。\nD 错：认出 X ∨ ~X 结构即可，不必画表。",
"logic-L8-q02":"选 A：令 X＝(A ∨ B)，原式是 X & ~X，每行都假。\nB 错：没有为真的行。\nC 错：每行都假，不是偶然。\nD 错：认出 X & ~X 结构即可判定。",
"logic-L8-q03":"选 C：~(V & D) 只禁止两样同时做，V、D 都真才违规。\nA 错：只吸电子烟不带狗，V & D 为假，不违规。\nB 错：只带狗不吸电子烟，也不违规。\nD 错：两样都不做，当然不违规。",
"logic-L8-q04":"选 B：~(V ∨ D) ≡ ~V & ~D，两样都禁止；D 为真 → 违规。\nA 错：那是 ~(V & D) 的读法，这条更严。\nC 错：德摩根律没换联结词，写错了。\nD 错：代入 D=T 就能直接判定。",
"logic-L8-q05":"选 D：不能两者都（not both）＝~(A & B) ≡ ~A ∨ ~B。\nA 错：~A & ~B 是两者都不（neither）。\nB 错：~A & B 是「非 A 而 B」。\nC 错：~(A ∨ B) 也是两者都不。",
"logic-L8-q06":"选 C：两者都不（neither）：A 假且 B 假＝~A & ~B。\nA 错：~(A & B) 是不能两者都。\nB 错：~A ∨ ~B 也是不能两者都。\nD 错：~(A ∨ ~B) ≡ ~A & B，B 为真。",
"logic-L8-q07":"选 D：~ 穿过括号要每项否定且 & 变 ∨，应为 ~V ∨ ~D。\nA 错：~V & ~D 等于 ~(V ∨ D)，比原规则更严。\nB 错：~(V ∨ D) 是两者都不，不等价。\nC 错：否定号不能直接丢掉。",
"logic-L10-q01":"选 A：一个要 B 真，一个要 B 假，没有一行同为 T → 互斥。\nB 错：同为 F 的行不影响互斥。\nC 错：A=T, B=T 行两者真值不同。\nD 错：两者都是偶然命题，各有为真的行。",
"logic-L10-q02":"选 D：A、B 恰好一个为真时，两式都为真 → 不互斥。\n算：A=T, B=F：A ∨ B = T，~A ∨ ~B = T\nA 错：A ∨ B 的否定是 ~A & ~B，不是它。\nB 错：两者都是偶然命题，不是逻辑真理。\nC 错：TF、FT 两行它们真值相同。",
"logic-L10-q03":"选 D：互斥只排除同时为真，可以同时为假。\nA 错：那是恰好一个真，互斥不要求必有一真。\nB 错：互斥与概率是否相等无关。\nC 错：互斥与独立是两回事。",
"logic-L10-q04":"选 C：A 真时恰有一支成立，A 假时两支都假，所以与 A 每行同值。\nA 错：A 假时它为假，不是逻辑真理。\nB 错：A 真时它为真，不是逻辑假。\nD 错：A=T, B=F 时它为真，B 却为假。",
"logic-L10-q05":"选 B：两支互斥可相加，且 (A & B) ∨ (A & ~B) ≡ A。\n算：P(A) = 1/3 + 1/5 = 5/15 + 3/15 = 8/15\nA 错：1/15 是错误地相乘。\nC 错：2/15 是相减 5/15 − 3/15。\nD 错：7/15 是 P(~A)。",
"logic-L10-q06":"选 D：A & ~B 正是 A ⊃ B 唯一为假的情况，二者互为否定，不会同真。\nA 错：A=F 时 A ⊃ B 与 ~A 都为真。\nB 错：A、B、C 全真时两者都为真。\nC 错：A=T, B=F 时两者都为真。"
},

"s":["用：行数＝2ⁿ，n 为不同原子命题个数\n算：A、B、C 共 3 个，2³ = 8\n意思：需要 8 行才能列全真假组合",

"用：~ 作用于整个括号 (B ∨ A)\n算：A & C = F；~(B ∨ A) = ~T = F；F ∨ F = F\n意思：这一行整式为假，填 0",
"用：有 T 有 F → 偶然（contingent）\n算：FFT 行为 T，TTF 行为 F（全表 4 T 4 F）\n意思：它是偶然命题，填 3"],
"trap":"把 ~(B ∨ A) 算成 ~B ∨ A，只否定了 B。"},
"logic-L6-c02":{"explain":"主联结词是中间的 &，整式为真要两块同真。左块要求 C 假，右块要求 C 真，不可能同时满足，所以不用画满 8 行就能判为逻辑假。",
"s":["用：行数＝2ⁿ，同一字母出现多次只算一个\n算：A、B、C 共 3 个，2³ = 8\n意思：需要 8 行",
"用：& 要两块都为真\n算：~A & ~C 要 C = F；B & C 要 C = T，矛盾\n意思：没有一行为真，填 0",
"用：每行都 F → 逻辑假（logical falsehood）\n算：8 行全 F，暗含 C & ~C\n意思：它是逻辑假，填 2"],
"trap":"变量多就以为是偶然，没发现两块对 C 的要求冲突。"},
"logic-L6-c03":{"explain":"⊃ 只在前件真、后件假时为假。A ⊃ B 只在 TF 行假，B ⊃ A 只在 FT 行假，两者不会在同一行都假，所以析取每行都真。",
"s":["用：行数＝2ⁿ\n算：A、B 共 2 个，2² = 4\n意思：需要 4 行",
"用：⊃ 只在前件真、后件假时为假\n算：A ⊃ B = F；B ⊃ A = F ⊃ T = T；F ∨ T = T\n意思：这一行整式为真，填 1",
"用：每行都 T → 逻辑真理（logical truth）\n算：TF 行靠 B ⊃ A，FT 行靠 A ⊃ B，其余两边都真\n意思：4 行全真，填 1"],
"trap":"把 B ⊃ A 的前件当成 A，在 TF 行误判为假。"},
"logic-L6-c04":{"explain":"判有效只看前提全真的行：先数行，再找 A ⊃ B 与 B 同真的行，最后看这些行里结论 A 是否为假。有一行就是反例，论证无效。",
"s":["用：行数＝2ⁿ\n算：A、B 共 2 个，2² = 4\n意思：需要 4 行",
"用：只看前提 A ⊃ B 与 B 都为 T 的行\n算：TT 行是，TF 行 B=F 否，FT 行是，FF 行 B=F 否\n意思：前提全真的有 2 行：TT 和 FT",
"用：反例＝前提全真且结论为假的行\n算：TT 行 A = T；FT 行 A = F\n意思：FT 行是反例，填 1",
"用：有反例 → 无效\n算：A = F, B = T 时前提全真、结论假\n意思：论证无效，填 0"],
"trap":"和有效的 A ⊃ B, A ∴ B 混淆；B 真推不出 A 真。"},
"logic-L6-c05":{"explain":"只看前提全真的行：~A 要求 A 假，A ∨ B 再要求 B 真，只剩 FT 一行。这一行结论 B 为真，没有反例，论证有效。",
"s":["用：行数＝2ⁿ\n算：A、B 共 2 个，2² = 4\n意思：需要 4 行",
"用：只看前提 A ∨ B 与 ~A 都为 T 的行\n算：~A 要 A = F；A ∨ B 再要 B = T\n意思：只有 1 行（A=F, B=T）前提全真",
"用：反例＝前提全真且结论为假的行\n算：FT 行结论 B = T\n意思：没有反例，填 0",
"用：无反例 → 有效\n算：唯一前提全真的行，结论为真\n意思：论证有效，填 1"],
"trap":"看到 TF 行结论假就判无效；但该行 ~A 为假，不算反例。"},
"logic-L6-c06":{"explain":"判等价就是逐行比较两式。先在 A=T, B=F 这行分别算出两式的值，发现不同；再数全表有几行不同。有一行不同就不等价。",
"s":["用：先算括号内，再整体否定\n算：A & B = T & F = F，~(A & B) = T\n意思：这一行 ~(A & B) 为真，填 1",
"用：先分别否定，再做合取\n算：~A = F，~B = T，F & T = F\n意思：这一行 ~A & ~B 为假，填 0",
"用：逐行比较两条目标列\n算：F T T T 对 F F F T，TF、FT 两行不同\n意思：有 2 行不同，填 2",
"用：等价要求每一行都相同\n算：已有 2 行不同\n意思：不等价，填 0；正确的是 ~A ∨ ~B"],
"trap":"用德摩根律只分配 ~，忘了把 & 换成 ∨。"},
"logic-L6-c07":{"explain":"逐行比较两式。先在唯一可能出问题的 A=T, B=F 行算出两式都为假，再看其余三行都为真。两列完全相同，所以等价。",
"s":["用：⊃ 只在前件真、后件假时为假\n算：T ⊃ F = F\n意思：这一行 A ⊃ B 为假，填 0",
"用：由内向外：先 ~B，再 A & ~B，再整体否定\n算：~B = T，A & ~B = T，~(A & ~B) = F\n意思：这一行也为假，填 0",
"用：逐行比较两条目标列\n算：两列都是 T F T T\n意思：没有不同的行，填 0",
"用：每行都相同 → 逻辑等价\n算：也可推：~(A & ~B) ≡ ~A ∨ B ≡ A ⊃ B\n意思：两者等价，填 1"],
"trap":"漏掉内层 ~B 或外层 ~，把 TF 行算成 T。"},
"logic-L10-c08":{"explain":"互斥要看有没有一行两式同为 T。先算 A=T, B=F 行，再把两条目标列并排逐行对照，数出同为 T 的行；有一行就不互斥。",
"s":["用：∨ 至少一边为真就为真\n算：T ∨ F = T\n意思：这一行 A ∨ B 为真，填 1",
"用：并排两条目标列，找同为 T 的行\n算：A ∨ B 为 T T T F；~A ∨ ~B 为 F T T T\n意思：TF、FT 两行同真，填 2",
"用：互斥＝没有一行同时为真\n算：有 2 行同真\n意思：不互斥，填 0"],
"trap":"误以为 ~A ∨ ~B 是 A ∨ B 的否定；其否定是 ~A & ~B。"},
"logic-L4-c09":{"explain":"先数原子命题 A、C 定行数；再找前提 A 与 ~A 同真的行，一行都没有，所以不可能有反例，论证有效。前提不能全真，所以不健全。",
"s":["用：行数＝2ⁿ，~A 不是新的原子命题\n算：A、C 共 2 个，2² = 4\n意思：需要 4 行",
"用：只看前提 A 与 ~A 都为 T 的行\n算：A = T 时 ~A = F；A = F 时 ~A = T\n意思：没有前提全真的行，填 0",
"用：有效＝没有前提全真且结论假的行\n算：前提全真的行有 0 行，反例也是 0 行\n意思：不管结论 C 是什么都有效，填 1",
"用：健全＝有效＋前提事实上全真\n算：A 与 ~A 不可能同时为真\n意思：永远不可能健全，填 0"],
"trap":"觉得结论与前提无关就判无效；矛盾前提使论证有效。"},
"logic-L8-c10":{"explain":"先数行，再在 A=T, B=F 行算出 A & B 和整式的值；最后认出整式是 X ∨ ~X（X＝A & B），所以每行都真。",
"s":["用：行数＝2ⁿ\n算：A、B 共 2 个，2² = 4\n意思：需要 4 行",
"用：& 要两边都真才真\n算：T & F = F\n意思：这一行 A & B 为假，填 0",
"用：主联结词是中间的 ∨\n算：~(A & B) = ~F = T；F ∨ T = T\n意思：这一行整式为真，填 1",
"用：令 X＝(A & B)，整式是 X ∨ ~X\n算：X 真左边真，X 假右边真，4 行全 T\n意思：逻辑真理，填 1"],
"trap":"没认出 X ∨ ~X，把 ~(A & B) 拆成 ~A & ~B 去算。"},
"logic-L4-c11":{"explain":"8 行表里先删掉有前提为假的行，剩下前提全真的 4 行；再看这些行里 A ⊃ C 是否为假。反例要 A 真 C 假，这些行都不满足。",
"s":["用：行数＝2ⁿ\n算：A、B、C 共 3 个，2³ = 8\n意思：需要 8 行",
"用：⊃ 只在前件真、后件假时为假\n算：A ⊃ B 在 TFT、TFF 假；B ⊃ C 在 TTF、FTF 假\n意思：剩 TTT、FTT、FFT、FFF 共 4 行，填 4",
"用：A ⊃ C 只在 A = T、C = F 时为假\n算：TTT 行 C = T；其余三行 A = F，都为 T\n意思：没有反例，填 0",
"用：无反例 → 有效\n算：TTF、TFF 能让结论假，但都有前提为假\n意思：论证有效，填 1；蕴涵可以接力"],
"trap":"漏数 FFT、FFF 行；A 为假时条件句为真。"}
}},
{"mcq":{
"prob-L2-q01":"选 C：知情主持人受约束、必开未选的山羊门，未选两门共有的 2/3 集中到剩下那扇。\nA 错：“剩两扇就各 1/2”，忽略了主持人的信息。\nB 错：开门是信息更新，不会因果地移动汽车。\nD 错：初选门仍是 1/3，并没有降到 1/6。",
"prob-L2-q02":"选 D：随机主持人见山羊后，删去露车分支再归一化，留/换各 1/2。\n算：(1/6)/(1/6 + 1/6) = 1/2\nA 错：1/3 是初选门的原始概率。\nB 错：2/3 是标准主持人版本的答案。\nC 错：1/6 是没归一化的单条路径概率。",
"prob-L2-q03":"选 A：车在2开2、车在3开3这两条路径会露出汽车。\n算：1/3 × 1/2 + 1/3 × 1/2 = 1/3\nB 错：0 是标准主持人（必避开汽车）的情况。\nC 错：1/6 只算了一条路径。\nD 错：1/2 是开某一扇门的概率，不是露车概率。",
"prob-L2-q04":"选 C：随机主持人碰巧开出山羊，条件化后留/换各 1/2。\nA 错：100 门版换门赢 99/100，优势更大。\nB 错：只是把标准规则说出来，仍是 2/3。\nD 错：奖品换成什么与概率结构无关。",
"prob-L2-q05":"选 D：只有初选就蒙对（1/100）时换门才输。\n算：1 − 1/100 = 99/100\nA 错：“剩两扇就各 1/2”的误解。\nB 错：1/100 是不换门赢的概率。\nC 错：98/100 是被打开门的比例，不是换门赢面。",
"prob-L2-q06":"选 D：证据取决于产生机制；见山羊在两种机制下概率不同（1 与 2/3）。\nA 错：只看结果，忽略了产生机制。\nB 错：反了，知情且受约束的选择才带额外信息。\nC 错：随机主持人下山羊并非必然出现。",
"prob-L2-q07":"选 A：先划掉不相容分支（条件化），再把剩余分支归一化使其和为 1。\nB 错：沿用原概率，剩余总和就不是 1。\nC 错：没有删去不相容的分支。\nD 错：只在原概率恰好相等时才碰巧对。",
"prob-L2-q08":"选 D：同一事件的不同路径互斥，概率相加。\n算：1/6 + 1/6 = 1/3\nA 错：1/36 把合并路径当成沿路径相乘。\nB 错：1/6 只算了一条路径。\nC 错：1/2 是“剩两种所以各半”的直觉，没有依据。",
"prob-L2-q09":"选 B：只出现低编号在小产量下容易得多，所以支持约 1000 辆。\nA 错：大产量在逻辑上仍然可能。\nC 错：两个假设都相容，仍要比较证据出现的难易。\nD 错：方向反了，产量大时全是低编号更不可能。",
"prob-L2-q10":"选 C：条件概率定义 P(H|E) = P(H∧E)/P(E)。\n算：(1/6)/(1/3) = 1/2\nA 错：乱用乘法，条件概率不是 P(H) × P(E)。\nB 错：分子分母颠倒，得到 2 > 1，必错。\nD 错：忘了除以 P(E)。",
"prob-L2-q11":"选 C：证据推理：预测者极可靠，只拿 B 是 B 里有钱的强证据。\nA 错：钱已放好，选择不能因果地改变它。\nB 错：优势论证其实支持拿两盒。\nD 错：题设预测者极可靠；若真随机就该拿两盒。",
"prob-L2-q12":"选 A：拿两盒是因果推理：钱已放好，任何固定状态下多拿 A 都多 $1000。\nB 错：改了题设，预测者其实极可靠。\nC 错：反了，拿两盒是 B 为空的证据。\nD 错：预测者可靠时，拿两盒通常只得 $1000。",
"prob-L2-q13":"选 B：两题都说明：一件事的信息意义取决于产生它的机制。\nA 错：重点不是门或盒子的数量。\nC 错：纽康姆悖论没有公认唯一答案。\nD 错：纽康姆恰恰展示证据与因果的冲突。",
"prob-L2-q14":"选 D：(i) 抛前问两次都正面；(ii) 已知第一次正面，问第二次。\n算：(i) 1/2 × 1/2 = 1/4；(ii) P(H2|H1) = 1/2\nA 错：(ii) 把条件概率当成联合概率。\nB 错：(i)(ii) 两个答案颠倒了。\nC 错：(i) 两次都正面要相乘，得 1/4。",
"prob-L4-q01":"选 A：保留 4 条总和 2/3，归一化后每条 1/4，换门赢 2 条。\n算：2 × (1/6)/(2/3) = 2 × 1/4 = 1/2\nB 错：1/3 是没归一化的 2 × 1/6。\nC 错：2/3 是标准主持人版本的答案。\nD 错：1/4 只算了一条分支。",
"prob-L4-q02":"选 D：删去开你的门和露车的分支后，留与换的保留概率相等（2/9 对 2/9）。\n算：(2/9)/(4/9) = 1/2\nA 错：2/3 只属于受约束的标准主持人。\nB 错：1/3 是没条件化的初选概率。\nC 错：3/4 没有任何分支依据。",
"prob-L4-q03":"选 A：标准主持人受两条约束，开哪扇门由车位决定，所以带信息。\nB 错：各版本都是三扇门。\nC 错：题目中没有主持人说谎。\nD 错：初选的原始概率在各版本都是 1/3。",
"prob-L4-q04":"选 D：正面且 6：硬币与骰子独立，相乘得 1/12 < 1/10，替换不划算。\n算：1/2 × 1/6 = 1/12 ≈ 8.33%\nA 错：“且”不能用加法。\nB 错：8.33% 比 10% 小，有差别。\nC 错：17.5% 是“额外机会”读法的答案。",
"prob-L4-q05":"选 D：原本的 1/10 保留，额外机会只在没拿 HD 的 9/10 里起作用。\n算：1/10 + 9/10 × 1/12 = 21/120 = 17.5%\nA 错：没乘 9/10，重复算了两种途径都中的情形。\nB 错：只算了赌局本身。\nC 错：两种途径是“或”，不能相乘。",
"prob-L4-q06":"选 D：乘法规则的条件是独立：硬币结果不改变骰子的概率。\nA 错：互斥事件的合取概率是 0，不能相乘。\nB 错：公平不是相乘的条件。\nC 错：“看到且就乘”是误区，要先查独立。",
"prob-L4-q07":"选 C：班级 10% 是群体频率，不一定等于她凭全部证据得到的个人概率。\nA 错：群体频率不总等于个人概率。\nB 错：没有涉及一串结果，不是赌徒谬误。\nD 错：太极端，可以用认识论概率表达。",
"prob-L4-q08":"选 A：表达的是凭有限信息的信念度，即认识论概率。\nB 错：频率理解描述群体中的比例。\nC 错：客观机会指硬币、骰子那样的随机机制。\nD 错：逻辑必然的概率是 1，不是 10%。",
"prob-L4-q09":"选 A：描述一个群体（这个班）中具有某属性的比例，是频率说法。\nB 错：基于证据的信心，是认识论说法。\nC 错：基于对你的了解，是认识论说法。\nD 错：依据预报的信念度，是认识论说法。",
"prob-L4-q10":"选 D：完备划分只要求穷尽、互斥、和为 1，不要求等概率。\nA 错：覆盖所有情况（穷尽）是要求。\nB 错：不能同时发生（互斥）是要求。\nC 错：概率和为 1 是要求。",
"prob-L4-q11":"选 B：概率高不一定决定选择，还要看奖励大小、努力成本和风险态度。\nA 错：最可能的选项不一定最理性。\nC 错：独立性与要不要选它无关。\nD 错：概率的解释方式不决定选择。",
"prob-L8-q01":"选 B：赌徒谬误：承认试验独立，却因最近没出现就认为它更可能（或反之）。\nA 错：怀疑硬币有偏，不是补偿推理。\nC 错：只是算错，不是这种谬误。\nD 错：诈骗问题错在事实前提。",
"prob-L8-q02":"选 B：独立试验中过去序列不改变下一次，反面仍是 1/2。\nA 错：“反面该来了”就是赌徒谬误。\nC 错：“正在连胜”是反方向的同类错误。\nD 错：1/2^13 是整串 13 次的概率。",
"prob-L8-q03":"选 C：0.30 ≠ 1/6，所以不公平；题设各次独立。\nA 错：0.30 ≠ 1/6，不公平。\nB 错：混淆公平与独立，不公平也能独立。\nD 错：“每次相同”不等于各面等概率。",
"prob-L8-q04":"选 C：赌徒谬误的前提是把试验当作独立。\nA 错：不需要 50/50，1/20 的骰子也可以。\nB 错：互斥与这种谬误无关。\nD 错：输没输钱不影响判断。",
"prob-L8-q05":"选 C：先查每天是否独立；若有轮班表或周期，过去确实提供信息。\nA 错：没查独立性就直接贴标签。\nB 错：“长期会平衡”本身是错误理由。\nD 错：这句话没有逻辑矛盾。",
"prob-L8-q06":"选 A：被抓可能进了执法名单，后续被查依赖于第一次，试验不独立。\nB 错：过去事件可能真的改变未来概率。\nC 错：被查不是 50/50 事件，也与诊断无关。\nD 错：两次被查可以同时为真，不互斥。",
"prob-L8-q07":"选 D：他否认了独立，错在事实前提，而不是承认独立后做补偿推理。\nA 错：他的前提并不真实。\nB 错：宇宙补偿没有被科学证实。\nC 错：赌徒谬误不只适用于硬币。",
"prob-L8-q08":"选 B：错在事实前提：把骗局当成有真实的中奖概率。\nA 错：主要错误不是对独立试验做补偿推理。\nC 错：与德摩根律无关。\nD 错：与混淆互斥和独立无关。",
"prob-L8-q09":"选 B：长期比例趋近 1/2 靠后续试验稀释早期偏差，不靠下一次偏向反面。\nA 错：长期趋近不需要短期补偿。\nC 错：公平硬币的长期比例趋近 1/2。\nD 错：独立的公平硬币不会因过去而偏向反面。",
"prob-L8-q10":"选 B：独立的定义：知道 B 不改变 A 的概率，P(A|B) = P(A)。\nA 错：P(A∧B) = 0 说的是互斥。\nC 错：这是互斥时的加法规则。\nD 错：两者概率相等与是否独立无关。",
"prob-L8-q11":"选 C：独立具有对称性：P(A|B) = P(A) 时，P(B|A) = P(B)。\nA 错：反了，独立是对称的。\nB 错：能推出 B 也独立于 A。\nD 错：独立是概率关系，与因果无关。",
"prob-L8-q12":"选 D：爆竹不会自燃，爆炸必然被点过；这是对过去事件信念度的更新。\n算：P(E|¬L) = 0，所以 P(L|E) = 1\nA 错：1/3 是 P(E|L)，与 P(L|E) 搞反了。\nB 错：数值对，但爆炸并没有造成点燃。\nC 错：没有理由各分一半。",
"prob-L8-q13":"选 C：已知是黑桃，A 的概率仍是 1/13，与 P(Ace) 相同，所以独立。\n算：P(Ace) = 4/52 = 1/13；P(Ace|Spade) = 1/13\nA 错：能同时发生不等于不独立。\nB 错：黑桃 A 存在，两者不互斥。\nD 错：两者概率是 1/13 与 1/4，并不相等。",
"prob-L8-q14":"选 C：红桃蕴含红色，知道是红桃使红色概率从 1/2 变成 1，所以不独立。\nA 错：P(Red|Heart) = 1 ≠ 1/2。\nB 错：红桃都是红色，可以同时为真。\nD 错：花色决定颜色，不能凭“特征不同”判断。",
"prob-L8-q15":"选 B：一张牌不能既梅花又黑桃（互斥）；知道是梅花，黑桃概率从 1/4 变 0（不独立）。\nA 错：正概率的互斥事件不可能独立。\nC 错：它们是互斥的。\nD 错：它们互斥，而且不独立。",
"prob-L10-q01":"选 B：互斥只排除同时为真，允许同时为假。\nA 错：同时为假不违反互斥。\nC 错：知道是 2 会让 3 的概率变 0，所以不独立。\nD 错：恰有一真是“互斥且穷尽”。",
"prob-L10-q02":"选 C：加法规则的条件是互斥：A、B 不能同时为真。\nA 错：独立是乘法规则的条件。\nB 错：等概率不是加法的条件。\nD 错：穷尽是补集规则需要的。",
"prob-L10-q03":"选 A：乘法规则的条件是独立：知道一个不改变另一个的概率。\nB 错：那是互斥，互斥时合取概率为 0。\nC 错：不同时间发生不保证独立。\nD 错：公平不是相乘的条件。",
"prob-L10-q04":"选 A：同一次掷骰不能既是 2 又是 3，两者互斥，合取概率为 0。\nB 错：1/36 是没查独立就相乘。\nC 错：1/3 是 P(2∨3)。\nD 错：1/6 是单个结果的概率。",
"prob-L10-q05":"选 B：King 与 Heart 在红桃 K 上重叠，直接相加会把它算两次。\nA 错：它们确实独立，但独立不是加法的条件。\nC 错：加法规则适用于任何互斥事件。\nD 错：等概率不是加法的条件。",
"prob-L10-q06":"选 A：A∧B 与 A∧¬B 互斥，且二者的析取等价于 A，可直接相加。\n算：1/3 + 1/5 = 8/15\nB 错：1/15 是错误地相乘。\nC 错：2/15 是相减，没有依据。\nD 错：不需要 P(B)。",
"prob-L10-q07":"选 B：它的真值在每种情况下都与 A 相同，但 A 假时它也假，所以不是永真式。\nA 错：A 为假时它为假，不是永真式。\nC 错：A 为真时它为真，不是矛盾式。\nD 错：真值跟随 A，不跟随 B。",
"prob-L10-q08":"选 B：先用独立求 A∧B；A 与 C 互斥，所以 A∧B 与 C 也互斥，可相加。\n算：1/3 × 1/6 + 1/9 = 1/18 + 2/18 = 1/6\nA 错：1/18 只是 P(A∧B)。\nC 错：1/9 只是 P(C)。\nD 错：11/18 是把三个概率直接相加。",
"prob-L10-q09":"选 D：独立且概率为正，P(A∧B) = P(A)P(B) > 0，可以同时发生。\nA 错：P(A∧B) = 0 是互斥的性质。\nB 错：正概率的独立事件不可能互斥。\nC 错：这是互斥时才成立的加法。",
"prob-L10-q10":"选 B：知道一个发生，另一个概率降为 0，概率改变了，所以不独立。\nA 错：互斥事件不必等概率。\nC 错：互斥是逻辑关系，不需要因果联系。\nD 错：把“没有因果影响”误当成独立。",
"prob-L10-q11":"选 C：D 与 A、B、C 都互斥，才能用差额求 P(D)。\n算：P(D) = 1 − 5/6 = 1/6\nA 错：独立不是这里需要的条件。\nB 错：等概率与差额计算无关。\nD 错：D 若与已有并集重叠，P(D) 不唯一。",
"prob-L10-q12":"选 D：没指定哪颗是 3，(3,4) 与 (4,3) 两种互斥结果都要算。\n算：1/36 + 1/36 = 2/36 = 1/18\nA 错：1/36 是指定骰子1为3、骰子2为4。\nB 错：1/12 = 3/36，多算了结果。\nC 错：1/6 只是某一颗出 3 的概率。",
"prob-L10-q13":"选 C：无放回后剩 2 蓝 2 绿，第二次蓝 = 1/2 ≠ 3/5，所以不独立。\n算：2/4 = 1/2\nA 错：3/5 是有放回的情形。\nB 错：两次可以都是蓝，并不互斥。\nD 错：单次等可能推不出各次独立。",
"prob-L10-q14":"选 A：2、4、6 三面互斥，按实际概率相加。\n算：4/25 + 4/25 + 4/25 = 12/25\nB 错：1/2 是把各面当等可能去数。\nC 错：把每个偶数面都当作 1/5。\nD 错：13/25 是奇数的概率。",
"prob-L10-q15":"选 B：“有利数 ÷ 总数”只在基本结果等可能时可靠。\nA 错：互斥是加法的条件，不是计数法的条件。\nC 错：独立与计数法无关。\nD 错：偏骰结果有限，但不等可能。",
"prob-L10-q16":"选 C：知道喜欢茶，喜欢咖啡的概率从 1/2 升到 1，所以依赖。\n算：P(C∧T) = 1/2 ≠ 1/2 × 1/2 = 1/4\nA 错：概率相等不保证独立。\nB 错：没查独立就相乘。\nD 错：依赖本身不证明因果。",
"prob-L10-q17":"选 A：概率改变说明依赖，但依赖本身不能确定因果解释。\nB 错：倒因果，湿草坪不会让洒水器打开。\nC 错：时间先后不是独立的标准。\nD 错：两者可以同时为真，不互斥。",
"prob-L10-q18":"选 D：补集规则要求“准点”与“不准点”互斥且穷尽。\n算：1 − 0.82 = 0.18\nA 错：正概率的互斥事件不独立。\nB 错：过去是否延误与补集规则无关。\nC 错：两者并不等可能（0.82 对 0.18）。",
"prob-L10-q19":"选 A：逻辑等价的两句在每种情况下同真同假，所以概率相同。\nB 错：反过来不成立，概率相同不等于等价。\nC 错：经验上极可信不等于逻辑必然。\nD 错：矛盾式的概率是 0，不是 1/2。",
"prob-L10-q20":"选 B：A∧B 为真时 A 必真，而 A 不能与 C 同真，所以 A∧B 与 C 互斥。\nA 错：B 可能与 C 同真，推不出。\nC 错：正概率的互斥事件不独立。\nD 错：A∨B 可以经由 B 与 C 同真。"

"calc":{
"prob-L2-c01":{"explain":"先求初选对的概率 1/4，再用补集得初选错 3/4；换门要初选错且在两扇剩余门中选对，所以相乘。",
"s":["用：等可能原则（4 扇门随机选 1 扇）\n算：P(车在门1) = 1/4 = 0.25\n意思：不换门赢的概率是 1/4",
"用：补集规则（门1与其余三扇互斥且穷尽）\n算：1 − 1/4 = 3/4 = 0.75\n意思：主持人只开山羊门，这 3/4 落在两扇未开门上",
"用：乘法规则（初选错 且 两扇中选对）\n算：3/4 × 1/2 = 3/8 = 0.375\n意思：0.375 > 0.25，换门仍更好"],
"trap":"以为开门后剩三扇各 1/3；初选的 1/4 不会改变。"},
"prob-L2-c02":{"explain":"画概率树：先算两条符合证据的路径，相加得证据概率 P(E)，再用条件概率求换门赢的概率。",
"s":["用：乘法规则（沿路径相乘，主持人随机开门）\n算：1/3 × 1/2 = 1/6 ≈ 0.16667\n意思：门3后是山羊，这条保留",
"用：乘法规则（车在2的概率 × 开3的概率）\n算：1/3 × 1/2 = 1/6 ≈ 0.16667\n意思：门3后也是山羊，这条也保留",
"用：条件化 + 加法规则（删去车在3开3，其余互斥相加）\n算：1/6 + 1/6 = 1/3 ≈ 0.33333\n意思：符合证据的总概率是 1/3",
"用：条件概率 P(H|E) = P(H∧E)/P(E)\n算：(1/6)/(1/3) = 1/2 = 0.5\n意思：换不换各一半，没有 2/3 优势"],
"trap":"照搬标准版 2/3，或删枝后忘了除以 P(E)。"},
"prob-L4-c03":{"explain":"列出 6 条各 1/6 的分支，删去 2 条露车分支得 P(见羊)；再归一化，数换门赢的分支。",
"s":["用：概率树 + 条件化（删去车在2开2、车在3开3）\n算：4 × 1/6 = 2/3 ≈ 0.66667\n意思：看到山羊的总概率是 2/3",
"用：归一化（原概率 ÷ 保留分支总概率）\n算：(1/6)/(2/3) = 1/4 = 0.25\n意思：4 条保留分支加起来正好是 1",
"用：加法规则（换门赢的 2 条分支互斥）\n算：1/4 + 1/4 = 1/2 = 0.5\n意思：两条赢、两条输，50/50"],
"trap":"删枝后不归一化，把 1/6 + 1/6 = 1/3 当答案。"},
"prob-L4-c04":{"explain":"每条分支 1/9。分别求换门输、换门赢且符合证据的概率，相加得 P(证据)，再相除。",
"s":["用：乘法 + 加法规则（车在1时开2或开3都见羊）\n算：1/3 × (1/3 + 1/3) = 2/9 ≈ 0.22222\n意思：这些是换门会输的保留分支",
"用：乘法规则（车在2须开3，车在3须开2）\n算：1/3 × 1/3 + 1/3 × 1/3 = 2/9 ≈ 0.22222\n意思：这些是换门会赢的保留分支",
"用：加法规则（两组互斥；开你的门、露车的都删去）\n算：2/9 + 2/9 = 4/9 ≈ 0.44444\n意思：证据发生的总概率",
"用：条件概率（换门赢且证据 ÷ 证据）\n算：(2/9)/(4/9) = 1/2 = 0.5\n意思：归一化后留与换各一半"],
"trap":"把开你的门或露车的分支算进证据，或把每条当成 1/6。"},
"prob-L4-c05":{"explain":"先用独立求赌局本身 1/12；再用补集求原本没拿 HD 的 9/10；额外机会 = 原本拿到，或没拿到且中赌局。",
"s":["用：乘法规则（硬币与骰子独立）\n算：1/2 × 1/6 = 1/12 ≈ 0.08333\n意思：作替换，1/12 < 1/10，应拒绝",
"用：补集规则（拿 HD 与不拿互斥且穷尽）\n算：1 − 1/10 = 9/10 = 0.9\n意思：赌局只在这 9/10 里起作用",

"prob-L4-c06":{"explain":"与 HD 赌局同结构：5 或 6 用互斥相加，正面且（5 或 6）用独立相乘，再用补集 4/5 求额外机会。",
"s":["用：加法规则（5、6 互斥）+ 乘法规则（独立）\n算：1/2 × 2/6 = 1/6 ≈ 0.16667\n意思：作替换，1/6 < 1/5，应拒绝",

"用：加法 + 乘法规则（原本拿到，或没拿到且中）\n算：1/5 + 4/5 × 1/6 = 1/3 ≈ 0.33333\n意思：作额外机会，1/3 > 1/5，应接受"],

"prob-L2-c07":{"explain":"不换门的概率保持 1/10；用补集得初选错 9/10；换门要初选错且在 8 扇剩余门中选对，所以相乘。",
"s":["用：等可能原则（知情主持人开门不带门1的新信息）\n算：1/10 = 0.1\n意思：不换门赢的概率仍是 1/10",

"prob-L8-c08":{"explain":"(a)(c) 是抛之前问整串结果，各次独立相乘；(b) 是已知前五次后问下一次，独立所以仍是 1/2。",
"s":["用：乘法规则（各次独立）\n算：(1/2)^5 = 1/32 = 0.03125\n意思：抛之前看，五连正很罕见",

"prob-L8-c09":{"explain":"骰子不公平但独立：(a)(c) 用独立相乘，(b) 独立所以不变，(d) “至少一个”用补集最简单。",

"prob-L8-c10":{"explain":"用等可能计数求各概率，再比较 P(A|B) 与 P(A)：相等就独立，不等就不独立。",
"s":["用：等可能原则（52 张中 4 张 A）\n算：4/52 = 1/13 ≈ 0.07692\n意思：随机抽到 A 的概率",

"prob-L10-c11":{"explain":"三问各用一条规则：析取先查互斥再相加（且它等价于 A）；补集求 ¬A；最后的合取含 B∧¬B，是矛盾式。",

"prob-L10-c12":{"explain":"互斥给出 P(A∧C) = 0；独立给出 P(A∧B)；再推出 A∧B 与 C 互斥，才能相加。",

"s":["用：乘法规则（两颗独立，顺序已指定）\n算：1/6 × 1/6 = 1/36 ≈ 0.02778\n意思：只有 (3,4) 一种结果",

{"mcq":{
"prob-L12-q01":"选 D：给定本地生，分母缩到本地生 550 人，其中住校内 350 人。\n算：350/(350+200) = 350/550 ≈ 0.636\nA 错：350/1000 是交集，分母用了全体。\nB 错：350/450 是反方向 Pr(本地|校内)。\nC 错：450/1000 是 Pr(校内)，没有用条件。",
"prob-L12-q02":"选 C：给定校内，分母是校内 450 人，其中本地生 350 人。\n算：350/(350+100) = 7/9 ≈ 0.778\nA 错：350/550 是反方向 Pr(校内|本地)。\nB 错：550/1000 是 Pr(本地)，没有用条件。\nD 错：200/550 是 Pr(校外|本地)。",
"prob-L12-q03":"选 A：「既……又……」是交集，分母是全体 1000 人。\n算：350/1000 = 0.35\nB 错：0.45 是 Pr(校内)。\nC 错：0.636 是条件概率 Pr(校内|本地)。\nD 错：0.778 是条件概率 Pr(本地|校内)。",
"prob-L12-q04":"选 B：独立要求 Pr(A|B)=Pr(A)，而 7/11 ≈ 0.636 ≠ 0.45。\nA 错：交集大于 0 与是否独立无关。\nC 错：两者描述同一批人不等于独立。\nD 错：有 350 人同时满足，不互斥。",
"prob-L12-q05":"选 C：「北岸居民中 10%」先固定北岸人群，再数被俯冲的，是 Pr(S|N)。\nA 错：交集的分母是全体居民，不是北岸。\nB 错：条件方向反了，那是被俯冲者中北岸的比例。\nD 错：Pr(S) 是全体被俯冲率，不是北岸内的比例。",
"prob-L12-q06":"选 A：用乘法规则求交集，不需要假设独立。\n算：Pr(N&S) = Pr(S|N)×Pr(N) = 0.1×0.3 = 0.03\nB 错：0.10 是 Pr(S|N)，没乘北岸占比。\nC 错：0.30 是 Pr(N)。\nD 错：0.044 是加上南岸后的总体被俯冲率。",
"prob-L12-q07":"选 C：用全概率，两岸分别算交集再相加。\n算：0.3×0.1 + 0.7×0.02 = 0.03 + 0.014 = 0.044\nA 错：把 10% 和 2% 简单平均，没按人口加权。\nB 错：把 10% 和 2% 直接相加。\nD 错：只算了北岸那一部分。",
"prob-L12-q08":"选 D：两组人口不同（30% 与 70%），各组比率要按组大小加权。\nA 错：加权后的条件概率可以相加，如全概率。\nB 错：问题与独立无关，在于没加权。\nC 错：2% 是南岸内的条件概率，不是交集。",
"prob-L12-q09":"选 A：条件概率 = 交集 ÷ 条件的概率。\n算：Pr(D|S) = 0.1/0.3 = 1/3\nB 错：0.2 = 0.1/0.5 是 Pr(S|D)。\nC 错：0.1 是交集 Pr(D&S)。\nD 错：0.5 是 Pr(D)，只有独立时才相等。",
"prob-L12-q10":"选 C：设 100 人填列联表，用合计减已知格。\n算：~D&S = 30−10 = 20；D&~S = 50−10 = 40；~D&~S = 100−10−20−40 = 30\nA 错：0.5×0.7 是默认了独立。\nB 错：0.7 是 Pr(~S)，是边际不是格子。\nD 错：0.2 是 Pr(~D&S)。",
"prob-L12-q11":"选 B：Pr(A|B) = 1/2 = Pr(A)，所以独立；夏季两者同时成立，所以不互斥。\n算：Pr(A&B)=Pr(夏)=1/4，Pr(A|B)=(1/4)/(1/2)=1/2\nA 错：夏季同时满足 A 和 B，不互斥。\nC 错：Pr(A|B)=Pr(A)，其实是独立的。\nD 错：不互斥，而且是独立的。",
"prob-L12-q12":"选 B：分子应是交集（且），春或夏 与 夏或秋 的交集只有夏，是 1/4。\n算：(1/4)/(1/2) = 1/2\nA 错：求 Pr(A|B) 分母就该是 Pr(B)。\nC 错：题目已说四季等可能。\nD 错：概率不能超过 1，大于 1 说明算错了。",
"prob-L12-q13":"选 C：互斥则 Pr(A|B)=0，而 Pr(A)>0，两者不等，所以不独立。\nA 错：概率都大于 0 的互斥事件一定不独立。\nB 错：Pr(A|B)=0，不等于 Pr(A)。\nD 错：B 发生就排除了 A，Pr(A|B)=0。",
"prob-L12-q14":"选 A：永真式概率为 1，A&T 与 A 等价，给定它不改变概率。\n算：Pr(A|T) = Pr(A&T)/Pr(T) = 0.2/1 = 0.2\nB 错：1 是 Pr(T)，不是 Pr(A|T)。\nC 错：永真式不排除任何情形。\nD 错：Pr(T)=1>0，有定义。",
"prob-L12-q15":"选 D：矛盾式概率为 0，公式得 0/0，按标准定义无定义。\n算：Pr(A&F)/Pr(F) = 0/0\nA 错：0/0 不等于 0。\nB 错：0/0 不等于 1。\nC 错：给定永真式才保留原概率 0.2。",
"prob-L12-q16":"选 B：设 x=Pr(A&B)、q=Pr(B)，x = x/q 当且仅当 x=0 或 q=1。\n算：x(q−1)=0 ⇒ x=0 或 q=1\nA 错：漏了交集为 0 的情形。\nC 错：独立时 Pr(A|B)=Pr(A)，不等于交集。\nD 错：Pr(B)=1 时就相等。",
"prob-L12-q17":"选 B：人数表只是比例模型，小数人数不影响结果。\n算：改用 1000 人：30 + 14 = 44，仍是 4.4%\nA 错：表格和公式是同一套乘法，表格有效。\nC 错：四舍五入会引入误差。\nD 错：小数人数不说明数据有错。",
"prob-L12-q18":"选 D：两者分子同为 Pr(A&B)，分母分别是 Pr(B) 和 Pr(A)，一般不等。\nA 错：分子相同但分母不同。\nB 错：哪个大取决于 Pr(A) 与 Pr(B) 的大小。\nC 错：方向差异不需要因果关系。",
"prob-L12-q19":"选 C：边际（行列合计）给出单个类别的总数，如 A 的人数。\nA 错：条件概率要用格子除以边际。\nB 错：联合频数在格子里，不在边际。\nD 错：独立要进一步比较才能判断。",
"prob-L11-q20":"选 D：在含 B 的 10 条记录中有 8 条含 A，条件概率很高。\n算：Pr(A|B) = 8/10 = 0.8\nA 错：0.008 是交集 Pr(A&B)。\nB 错：给定 B 后比例变了，不等于 Pr(A)。\nC 错：条件概率只看比例，不需要因果。",
"prob-L11-q21":"选 A：二阶就是以前两个词为条件，给出下一词的条件概率。\nB 错：阶数是条件长度，不是一次输出几个词。\nC 错：不是只用最常见的两个词。\nD 错：只看最近两个词，不看全部前文。",
"prob-L11-q22":"选 C：表大小约 n^(k+1)，n=100，k=2。\n算：100^3 = 1,000,000\nA 错：200 是 100×2，不是指数。\nB 错：10,000 = 100^2 是一阶的大小。\nD 错：100^4 是三阶的大小。",
"prob-L11-q23":"选 D：自动补全看的是给定前文时这个词的条件概率。\nA 错：那是词的总体频率，没有用前文。\nB 错：条件方向反了。\nC 错：交集除以词表大小没有意义。",
"prob-L16-q24":"选 B：竖线右边 I 是已知条件：在烦躁的时刻里问疲倦的概率。\nA 错：那是反方向 Pr(I|T)。\nC 错：那是交集 Pr(T&I)。\nD 错：那是 Pr(¬T&¬I)。",
"prob-L16-q25":"选 C：用贝叶斯，在所有烦躁时刻里数疲倦的。\n算：0.4×0.8 = 0.32；0.6×0.1 = 0.06；0.32/0.38 = 16/19\nA 错：40% 是先验 Pr(T)。\nB 错：32% 是交集 Pr(T&I)。\nD 错：80% 是 Pr(I|T)，方向反了。",
"prob-L16-q26":"选 A：证据是「不烧毁」，在所有不烧毁的人里数吸血鬼。\n算：1 万人：吸血鬼 100×1% = 1；人类 9900；1/9901\nB 错：1/100 是先验，没用证据更新。\nC 错：1/10000 是交集 Pr(V&¬I)。\nD 错：99/100 是 Pr(I|V)，方向和否定号都错。",
"prob-L16-q27":"选 D：用贝叶斯，在所有阳性药片里数真药。\n算：750×0.5 = 375；250×0.4 = 100；375/475 = 15/19\nA 错：50% 是真阳性率 Pr(P|M)。\nB 错：75% 是先验，忽略了证据。\nC 错：假阳性率 40% 不为 0，不能确定。",
"prob-L16-q28":"选 C：Pr(P|M)=Pr(P|¬M)，证据无鉴别力，后验 = 先验。\nA 错：证据不能区分真药与假药。\nB 错：误以为「阳性率一半」结论就变一半。\nD 错：后验可以算出，就是 75%。",
"prob-L16-q29":"选 C：假阳性率为 0，阳性只可能来自真药。\n算：0.375/(0.375 + 0) = 1\nA 错：50% 是真阳性率，不是后验。\nB 错：75% 是先验，没用证据。\nD 错：没有算式能得出 87.5%。",
"prob-L16-q30":"选 B：基础发生率降到 10%，后验随之大降。\n算：0.1×0.5 = 0.05；0.9×0.4 = 0.36；0.05/0.41 ≈ 12.2%\nA 错：50% 是真阳性率。\nC 错：78.9% 是基础发生率 75% 时的结果。\nD 错：10% 是先验，没用证据。",
"prob-L16-q31":"选 B：同一条件 M 下，阳性与阴性互补，相加为 1。\nA 错：两者来自不同人群，不必相加为 1。\nC 错：方向不同的两个条件概率无此关系。\nD 错：似然与先验无此关系。",
"prob-L16-q32":"选 C：证据是 ¬I（不烧毁），要求的是 Pr(V|¬I)。\nA 错：证据漏了否定号。\nB 错：方向反了，那是似然。\nD 错：那是交集，且证据错了。",
"prob-L16-q33":"选 D：H 与 ¬H 互斥且穷尽，证据只能来自这两条途径，都要算进分母。\nA 错：E 与 H 一般不独立。\nB 错：两者来自不同人群，不必相加为 1。\nC 错：两项各乘 Pr(H)、Pr(¬H)，不是算两次。",
"prob-L16-q34":"选 C：病很罕见，假阳性人数远多于真阳性。\n算：10 万人：真阳性 99；假阳性 99,900×5% = 4,995；99/5,094 ≈ 1.9%\nA 错：99% 是 Pr(+|D)，方向反了。\nB 错：95% 是健康人阴性率，与后验无关。\nD 错：5% 是假阳性率，不是后验。",
"prob-L16-q35":"选 C：两罐先验相等，比较两黑在各罐的似然。\n算：(3/4)² = 9/16；(1/4)² = 1/16；9/(9+1) = 9/10\nA 错：1/2 是先验，没用证据。\nB 错：3/4 是只抽一个黑球时的后验。\nD 错：1/10 是 Pr(Y|两黑)。",
"prob-L16-q36":"选 B：先黑后白在两罐的似然相同，证据无鉴别力，后验 = 先验。\n算：X：3/4×1/4 = 3/16；Y：1/4×3/4 = 3/16\nA 错：只看了黑球，忽略了白球。\nC 错：9/10 是抽到两黑时的后验。\nD 错：两罐似然相等，不会偏向 Y。",
"prob-L16-q37":"选 A：课上把它当有争议的难题：数硬币得 1/2，数醒来场合得 1/3。\nB 错：课上没有证明 1/2 无可争议。\nC 错：课上没有证明 1/3 无可争议。\nD 错：硬币始终公平，醒几次不影响硬币。",
"prob-L16-q38":"选 C：三分之一派：一个正面醒来场合对两个反面醒来场合，反面 2/3。\nA 错：1/3 是正面的概率，对调了。\nB 错：1/2 是二分之一派的答案。\nD 错：正面仍有可能，反面不是必然。",
"prob-L16-q39":"选 A：把 Pr(E|H) 当成 Pr(H|E)，忽略了 H 的基础发生率和 Pr(E|¬H)。\nB 错：论证没有假设互斥。\nC 错：问题在条件方向，不是该用交集。\nD 错：Pr(E|H) 再高，H 罕见时后验仍可很低。",
"prob-L16-q40":"选 B：证据力量看两种条件下阳性率的差距，降低假阳性率差距变大。\nA 错：提高假阳性率会削弱证据。\nC 错：两者相加为 1 没有特殊意义。\nD 错：两者相等时证据毫无信息。",
"prob-L16-q41":"选 A：公式本身没错，但输入的基础发生率或条件概率估错，个人后验就会错。\nB 错：贝叶斯定理同样适用于算法。\nC 错：问题不是忽略证据，而是输入有误。\nD 错：后验一般不等于先验。",
"prob-L18-q42":"选 B：净收益 = 回款 − 投入。\n算：4 − 1 = 3（百万美元）\nA 错：亏 1M 是回款为 0 的情形。\nC 错：4M 是回款，没扣投入。\nD 错：把投入加上了，应减去。",
"prob-L18-q43":"选 B：用净结果 +3、−1、−1 按概率加权。\n算：2/25×3 + 8/25×(−1) + 15/25×(−1) = (6−23)/25 = −0.68\nA 错：+0.32 是只算回款，漏扣投入。\nC 错：−1 只是亏损情形的结果，不是期望。\nD 错：+0.24 只算了盈利路径，漏了亏损。",
"prob-L18-q44":"选 B：用净结果 +15、−1、−5 按概率加权。\n算：2/25×15 + 8/25×(−1) + 15/25×(−5) = (30−8−75)/25 = −2.12\nA 错：+2.88 是期望回款，没扣 5M 投入。\nC 错：−5 只是坏主意情形的结果。\nD 错：−0.68 是投 1M 时的答案。",
"prob-L18-q45":"选 C：期望净收益 = 期望回款 − 票价。\n算：1/2×10 + 1/2×0 − 6 = 5 − 6 = −1\nA 错：5 是期望回款，没扣票价。\nB 错：4 是正面时的净收益，不是期望。\nD 错：−6 是反面时的净收益，不是期望。",
"prob-L18-q46":"选 C：公平价格 = 期望回款，使期望净收益为 0。\n算：1/2×10 + 1/2×0 = 5\nA 错：价格 0 时玩家期望净赚 5。\nB 错：2.50 少乘或多除了一次 1/2。\nD 错：10 是正面回款，不是平均。",
"prob-L18-q47":"选 B：每路已经扣了 5，最后又扣一次，成本被扣了两次。\n算：正确是 1/2×5 + 1/2×(−5) = 0\nA 错：公平价格下期望净收益应为 0，不是 −5。\nC 错：成本应减去，只是只能减一次。\nD 错：期望就是概率乘结果再相加。",
"prob-L18-q48":"选 D：公平只说期望净收益为 0，单次结果是 +5 或 −5。\nA 错：单次不保证收支相抵。\nB 错：付公平价格时平均净收益是 0。\nC 错：公平与玩几次无关。",
"prob-L18-q49":"选 A：回款不变、票价变高，期望净收益为负，差额是庄家优势。\nB 错：只有票价等于公平价格时才为 0。\nC 错：票价不改变结果的概率。\nD 错：期望回款不变。",
"prob-L18-q50":"选 B：所需赌注指数增长，可能超过本金或下注上限。\nA 错：硬币没有记忆，不会变得不公平。\nC 错：加倍不改变下一次的概率。\nD 错：赢了每轮也只净赚第一注。",
"prob-L18-q51":"选 C：第 7 注押 64 赢回 64，减去之前亏的 63。\n算：1+2+4+8+16+32 = 63；64 − 63 = 1\nA 错：64 是这一注赢的钱，没扣之前的亏损。\nB 错：63 是之前的总亏损。\nD 错：127 是累计投入的总额。",
"prob-L18-q52":"选 B：各次独立，过去结果不改变下一次的概率。\nA 错：硬币没有记忆，连串不影响下一次。\nC 错：「正面该来了」就是赌徒谬误。\nD 错：连串不一定要结束。",
"prob-L18-q53":"选 C：独立事件连乘。\n算：(1/2)^8 = 1/256\nA 错：1/8 是把 8 次当成了分母。\nB 错：1/16 是连续 4 次。\nD 错：1/512 是连续 9 次。",
"prob-L18-q54":"选 A：竖线右边是已知线索：已经看到 FFF 后，下一键是 F 的概率。\nB 错：那是 Pr(FFF)，没有条件。\nC 错：条件概率是比例，不是次数。\nD 错：条件方向反了。",
"prob-L18-q55":"选 C：用全概率，两条路径相加。\n算：0.5×0.75 + 0.5×0.15 = 0.375 + 0.075 = 0.45\nA 错：0.15 只是硬币 B 的正面率。\nB 错：0.30 不是两条路径之和，路径没算对。\nD 错：0.90 直接相加，漏乘了 1/2。",
"prob-L18-q56":"选 D：在所有正面中，来自 A 的比例。\n算：Pr(A|H) = 0.375/0.45 = 5/6\nA 错：1/6 是 Pr(B|H)。\nB 错：1/2 是先验，没用证据。\nC 错：3/4 是 Pr(H|A)，方向反了。",
"prob-L18-q57":"选 D：证据改变的是我们对拿哪枚硬币的判断，硬币 A 的正面率仍是 0.75。\nA 错：硬币本身的偏向不会改变。\nB 错：B 仍有 15% 正面率。\nC 错：硬币未知时，结果带有关于硬币的信息。",
"prob-L18-q58":"选 A：伪随机数由种子按固定规则算出，同一种子重现同一序列。\nB 错：规则固定，原则上可预测。\nC 错：生成靠固定规则，不靠重复概率。\nD 错：伪随机序列也可以有连串。",
"prob-L18-q59":"选 C：期望值是按概率加权的平均，表示重复多次时每次的平均。\nA 错：单次结果不一定等于期望值。\nB 错：期望值不一定是最可能的结果。\nD 错：期望值不说明结果的分布比例。"
},"calc":{
"prob-L12-c01":{"explain":"先读表求边际 Pr(B) 和交集 Pr(A&B)，分母都是全体；再用条件概率定义相除，分母缩到本地生 550 人。","s":["用：边际 = 一整列合计 ÷ 全体（本地生是一列）\n算：Pr(B) = (350+200)/1000 = 0.55\n意思：55% 的学生是本地生。","用：交集 = 同时满足的那一格 ÷ 全体\n算：Pr(A&B) = 350/1000 = 0.35\n意思：35% 的学生既是本地生又住校内。","用：条件概率 Pr(A|B) = Pr(A&B)/Pr(B)\n算：0.35/0.55 = 350/550 = 7/11 ≈ 0.6364\n意思：本地生中约 63.6% 住校内。"],"trap":"Pr(A|B) 的分母仍用 1000，把交集 0.35 当成条件概率。"},
"prob-L12-c02":{"explain":"先求边际 Pr(A)，再分别在校内人群和国际生人群中求条件概率；最后比较 Pr(A|B) 与 Pr(A) 判断是否独立。","s":["用：边际 = 一整行合计 ÷ 全体（校内是一行）\n算：Pr(A) = (350+100)/1000 = 0.45\n意思：45% 的学生住校内。","用：条件概率，给定 A，分母换成校内 450 人\n算：Pr(B|A) = 350/450 = 7/9 ≈ 0.7778\n意思：校内学生中约 77.8% 是本地生。","用：条件概率，给定 ~B，只看国际生 450 人\n算：Pr(A|~B) = 100/450 = 2/9 ≈ 0.2222\n意思：Pr(A|B)=0.636 ≠ Pr(A)=0.45，不独立。"],"trap":"以为 Pr(B|A) 和 Pr(A|B) 一样：分子同为 350，分母不同。"},
"prob-L12-c03":{"explain":"已知两个边际和一个交集，用「合计 − 已知格」把列联表补完，再在 ~S 人群中求条件概率。题目没说独立，不能相乘。","s":["用：S 行合计 = D&S + ~D&S，未知格 = 合计 − 已知格\n算：Pr(~D&S) = 0.3 − 0.1 = 0.2\n意思：100 人中 30 个 S，其中 20 个不是 D。","用：D 列合计 = D&S + D&~S\n算：Pr(D&~S) = 0.5 − 0.1 = 0.4\n意思：50 个 D 中有 40 个不是 S。","用：四格之和为 1\n算：Pr(~D&~S) = 1 − 0.1 − 0.2 − 0.4 = 0.3\n意思：30 人既不是 D 也不是 S。","用：条件概率，Pr(~S) = 1 − 0.3 = 0.7\n算：Pr(D|~S) = 0.4/0.7 = 4/7 ≈ 0.5714\n意思：70 个 ~S 中有 40 个是 D。"],"trap":"没说独立却用 0.5×0.7 = 0.35 去算 Pr(~D&~S)。"},
"prob-L12-c04":{"explain":"先用乘法规则求两岸各自的交集，再用全概率相加得 Pr(S)，最后在被俯冲者中求北岸比例。","s":["用：乘法规则 Pr(N&S) = Pr(S|N)Pr(N)\n算：0.1 × 0.3 = 0.03\n意思：100 人中 30 个北岸，3 个被俯冲。","用：乘法规则用于南岸 Pr(S|~N)Pr(~N)\n算：0.02 × 0.7 = 0.014\n意思：70 个南岸居民中 1.4 个被俯冲。","用：全概率，北岸与南岸互斥且穷尽\n算：Pr(S) = 0.03 + 0.014 = 0.044\n意思：全体中 4.4% 被俯冲。","用：条件概率 Pr(N|S) = Pr(N&S)/Pr(S)\n算：0.03/0.044 = 15/22 ≈ 0.6818\n意思：被俯冲者中约 68.2% 住北岸。"],"trap":"把 10% 和 2% 平均成 6% 当 Pr(S)，忽略两岸人口不同。"},
"prob-L12-c05":{"explain":"与喜鹊原题同法：乘法规则求两组交集，全概率相加得 Pr(S)，再除出 Pr(N|S)。注意 Pr(~N) = 0.6。","s":["用：乘法规则 Pr(N&S) = Pr(S|N)Pr(N)\n算：0.15 × 0.4 = 0.06\n意思：40 个北岸居民中 6 个被俯冲。","用：补集 Pr(~N) = 0.6，再用乘法规则\n算：0.05 × 0.6 = 0.03\n意思：60 个南岸居民中 3 个被俯冲。","用：全概率，两组交集相加\n算：Pr(S) = 0.06 + 0.03 = 0.09\n意思：100 人中共 9 人被俯冲。","用：条件概率 Pr(N|S) = Pr(N&S)/Pr(S)\n算：0.06/0.09 = 2/3 ≈ 0.6667\n意思：9 个被俯冲者中 6 个来自北岸。"],"trap":"忘了 Pr(~N) = 0.6，或把 15% 与 5% 平均成 10%。"},
"prob-L12-c06":{"explain":"先求及格的总比例，再分别在参加者和未参加者中求及格比例；比较 Pr(A|B) 与 Pr(A) 判断独立。","s":["用：边际 = 及格的两格之和 ÷ 全体\n算：Pr(A) = (60+20)/200 = 0.4\n意思：40% 的学生及格。","用：条件概率，只看参加者 60+40 = 100 人\n算：Pr(A|B) = 60/100 = 0.6\n意思：参加复习的人中 60% 及格。","用：条件概率，只看未参加者 20+80 = 100 人\n算：Pr(A|~B) = 20/100 = 0.2\n意思：0.6 ≠ 0.4，不独立；但不证明因果。"],"trap":"不独立就断定「参加复习导致及格」：相关不等于因果。"},
"prob-L12-c07":{"explain":"四季各 1/4。先找两事件重叠的季节求交集，再求 Pr(A|B)，最后与 Pr(A) 比较判断独立。","s":["用：交集 = 两事件都包含的季节（只有夏）\n算：Pr(A&B) = Pr(夏) = 1/4 = 0.25\n意思：只有夏天出生的人同时满足 A 和 B。","用：条件概率，Pr(B) = 夏 + 秋 = 1/2\n算：Pr(A|B) = (1/4)/(1/2) = 0.5\n意思：生在夏或秋的人中，一半属于 A。","用：A 含三个互斥季节，概率相加\n算：Pr(A) = 3 × 1/4 = 0.75\n意思：0.5 ≠ 0.75，不独立。"],"trap":"把交集写成并集「春或夏或秋」，算出大于 1 的概率。"},
"prob-L12-c08":{"explain":"题目明确说独立，才能用 Pr(A)Pr(B) 求交集；再用合计减格子补表，最后验证 Pr(A|B) = Pr(A)。","s":["用：已知独立，Pr(A&B) = Pr(A)Pr(B)\n算：0.4 × 0.5 = 0.2\n意思：100 次中约 20 次 A、B 同时发生。","用：A 行合计 = A&B + A&~B\n算：Pr(A&~B) = 0.4 − 0.2 = 0.2\n意思：40 次 A 中有 20 次 B 不发生。","用：~B 列合计 Pr(~B) = 0.5，减去 A&~B\n算：Pr(~A&~B) = 0.5 − 0.2 = 0.3\n意思：约 30 次 A、B 都不发生。","用：条件概率 Pr(A|B) = Pr(A&B)/Pr(B)\n算：0.2/0.5 = 0.4\n意思：等于 Pr(A)，验证了独立。"],"trap":"把「已知独立才能相乘」用到没说独立的题上。"},
"prob-L11-c09":{"explain":"先算 A 的总体比例和交集，分母都是 1000；再在含 B 的记录中求 A 的比例，看出罕见的词在特定前文下可以很常见。","s":["用：边际 = 出现次数 ÷ 总记录数\n算：Pr(A) = 10/1000 = 0.01\n意思：A 很罕见，只占 1%。","用：交集 = 同时含 A 和 B 的记录 ÷ 全体\n算：Pr(A&B) = 8/1000 = 0.008\n意思：1000 条中 8 条两个词都有。","用：条件概率，Pr(B) = 10/1000 = 0.01\n算：Pr(A|B) = 0.008/0.01 = 0.8\n意思：含 B 的 10 条中有 8 条含 A。"],"trap":"以为 A 总体只有 1%，给定 B 后也应该很小。"},
"prob-L16-c10":{"explain":"贝叶斯标准四步：乘法规则求两条路径的交集，全概率相加得 Pr(I)，再用疲倦那条路径除以总和。","s":["用：乘法规则 Pr(T&I) = Pr(I|T)Pr(T)\n算：0.8 × 0.4 = 0.32\n意思：100 个时刻中 40 个疲倦，32 个烦躁。","用：乘法规则，Pr(¬T) = 0.6\n算：Pr(¬T&I) = 0.1 × 0.6 = 0.06\n意思：60 个不疲倦时刻中 6 个烦躁。","用：全概率，烦躁的两条来源相加\n算：Pr(I) = 0.32 + 0.06 = 0.38\n意思：共 38 个烦躁时刻。","用：贝叶斯 Pr(T|I) = Pr(T&I)/Pr(I)\n算：0.32/0.38 = 16/19 ≈ 0.8421\n意思：烦躁时约 84.2% 是因为疲倦。"],"trap":"把交集 0.32 或 Pr(I|T)=0.8 当成后验。"},
"prob-L16-c11":{"explain":"证据是「不烧毁」，先用补集把烧毁率换成不烧毁率，再按贝叶斯四步：两条交集、相加、相除。","s":["用：补集 Pr(¬I|V) = 1 − 0.99 = 0.01，再乘 Pr(V)\n算：Pr(V&¬I) = 0.01 × 0.01 = 0.0001\n意思：1 万人中 100 个吸血鬼，1 个不烧毁。","用：人类从不烧毁，Pr(¬I|¬V) = 1\n算：Pr(¬V&¬I) = 1 × 0.99 = 0.99\n意思：9900 个人类全都不烧毁。","用：全概率，两组不烧毁的相加\n算：Pr(¬I) = 0.0001 + 0.99 = 0.9901\n意思：共 9901 人不烧毁。","用：贝叶斯 Pr(V|¬I) = Pr(V&¬I)/Pr(¬I)\n算：0.0001/0.9901 = 1/9901 ≈ 0.000101\n意思：比先验 1% 小了约 100 倍。"],"trap":"证据是不烧毁，却仍代入 Pr(I|V) = 0.99。"},
"prob-L16-c12":{"explain":"贝叶斯四步：真药、假药两条路径的阳性交集，相加得 Pr(P)，再求阳性中真药的比例。","s":["用：乘法规则 Pr(M&P) = Pr(P|M)Pr(M)\n算：0.5 × 0.75 = 0.375\n意思：1000 片中 750 片真药，375 片阳性。","用：乘法规则，Pr(¬M) = 0.25，假阳性率 0.4\n算：Pr(¬M&P) = 0.4 × 0.25 = 0.1\n意思：250 片假药中 100 片也阳性。","用：全概率，两条来源相加\n算：Pr(P) = 0.375 + 0.1 = 0.475\n意思：共 475 片阳性。","用：贝叶斯 Pr(M|P) = Pr(M&P)/Pr(P)\n算：0.375/0.475 = 15/19 ≈ 0.7895\n意思：只从 75% 升到约 79%，证据弱。"],"trap":"以为阳性就几乎肯定是真药，或把 0.5 当后验。"},
"prob-L16-c13":{"explain":"证据是阴性，先在各自条件下用补集求阴性率，再按贝叶斯四步求阴性中假药的比例。","s":["用：同一条件下补集 Pr(¬P|M) = 1 − 0.5 = 0.5\n算：Pr(M&¬P) = 0.5 × 0.75 = 0.375\n意思：750 片真药中 375 片阴性。","用：同一条件下补集 Pr(¬P|¬M) = 1 − 0.4 = 0.6\n算：Pr(¬M&¬P) = 0.6 × 0.25 = 0.15\n意思：250 片假药中 150 片阴性。","用：全概率，两组阴性相加\n算：Pr(¬P) = 0.375 + 0.15 = 0.525\n意思：共 525 片阴性。","用：贝叶斯 Pr(¬M|¬P) = Pr(¬M&¬P)/Pr(¬P)\n算：0.15/0.525 = 2/7 ≈ 0.2857\n意思：只从 25% 升到约 28.6%，仍是弱证据。"],"trap":"跨条件取补集：Pr(¬P|¬M) 写成 1 − Pr(P|M)。"},
"prob-L16-c14":{"explain":"同样的贝叶斯四步，只是假阳性率降到 5%。比较结果可见：证据强弱取决于真阳性率与假阳性率的差距。","s":["用：乘法规则 Pr(M&P) = Pr(P|M)Pr(M)\n算：0.9 × 0.75 = 0.675\n意思：750 片真药中 675 片阳性。","用：乘法规则，假阳性率 0.05\n算：Pr(¬M&P) = 0.05 × 0.25 = 0.0125\n意思：250 片假药中只有 12.5 片误报。","用：全概率，两条来源相加\n算：Pr(P) = 0.675 + 0.0125 = 0.6875\n意思：约 687.5 片阳性。","用：贝叶斯 Pr(M|P) = Pr(M&P)/Pr(P)\n算：0.675/0.6875 = 54/55 ≈ 0.9818\n意思：后验升到约 98.2%，是强证据。"],"trap":"以为后验只看真阳性率 0.9；假阳性率同样关键。"},
"prob-L16-c15":{"explain":"试剂不变，只把基础发生率降到 10%。照贝叶斯四步算，看基础发生率如何把后验拉低。","s":["用：乘法规则 Pr(M&P) = Pr(P|M)Pr(M)\n算：0.5 × 0.1 = 0.05\n意思：1000 颗中 100 颗真药，50 颗阳性。","用：乘法规则，Pr(¬M) = 0.9\n算：Pr(¬M&P) = 0.4 × 0.9 = 0.36\n意思：900 颗假药中 360 颗也阳性。","用：全概率，两条来源相加\n算：Pr(P) = 0.05 + 0.36 = 0.41\n意思：共 410 颗阳性。","用：贝叶斯 Pr(M|P) = Pr(M&P)/Pr(P)\n算：0.05/0.41 = 5/41 ≈ 0.122\n意思：阳性中只有约 12.2% 是真药。"],"trap":"把 0.5 当答案，或分母写成 0.5 + 0.4 没乘基础发生率。"},
"prob-L16-c16":{"explain":"用 10,000 人的人数表：按基础发生率分出病人和健康人，各乘阳性率，相加得阳性总数，再求阳性者中病人比例。","s":["用：人数表 + 乘法规则\n算：10,000 × 1% = 100；100 × 0.9 = 90\n意思：有 90 个真阳性。","用：健康人乘假阳性率\n算：9,900 × 0.09 = 891\n意思：891 个假阳性，远多于真阳性。","用：全概率（人数相加）\n算：90 + 891 = 981\n意思：共 981 人阳性。","用：贝叶斯，在阳性者里数病人\n算：Pr(D|+) = 90/981 ≈ 0.0917\n意思：阳性者中只有约 9.2% 真有病。"],"trap":"把 Pr(+|D) = 90% 当成 Pr(D|+)。"},
"prob-L16-c17":{"explain":"先求两黑在各罐的似然（已知罐子时放回抽取独立），再按硬币先验加权得 Pr(BB)，最后求 X 的后验。","s":["用：已知罐 X，放回抽取独立，相乘\n算：Pr(BB|X) = (3/4)² = 9/16 = 0.5625\n意思：X 罐连抽两黑略过一半。","用：已知罐 Y，同样相乘\n算：Pr(BB|Y) = (1/4)² = 1/16 = 0.0625\n意思：Y 罐连抽两黑很少见。","用：全概率，按先验 1/2 加权\n算：0.5×9/16 + 0.5×1/16 = 0.3125\n意思：32 次中约 10 次出现两黑。","用：贝叶斯 Pr(X|BB) = Pr(X&BB)/Pr(BB)\n算：0.28125/0.3125 = 0.9\n意思：先验相等、似然比 9:1，后验 9/10。"],"trap":"不知道罐子时用 1/2×1/2 算 Pr(BB)，误以为总体上也独立。"},
"prob-L16-c18":{"explain":"分别求「先黑后白」在两罐的似然，发现相等，所以证据无鉴别力，后验等于先验。","s":["用：已知罐 X，按顺序相乘\n算：Pr(BW|X) = 3/4 × 1/4 = 3/16 = 0.1875\n意思：X 罐先黑后白的机会是 3/16。","用：已知罐 Y，按顺序相乘\n算：Pr(BW|Y) = 1/4 × 3/4 = 3/16 = 0.1875\n意思：和 X 罐完全一样。","用：贝叶斯，两罐似然相等\n算：(0.5×3/16)/(0.5×3/16 + 0.5×3/16) = 0.5\n意思：证据无鉴别力，后验 = 先验。"],"trap":"只看到抽了黑球就偏向 X，忽略了还抽到一个白球。"},
"prob-L16-c19":{"explain":"三次放回抽取，已知罐子时独立相乘求两个似然；先验相等，后验比就等于似然比。","s":["用：已知罐 X，三次独立连乘\n算：Pr(BBB|X) = (3/4)³ = 27/64 ≈ 0.4219\n意思：X 罐连抽三黑约 42%。","用：已知罐 Y，三次独立连乘\n算：Pr(BBB|Y) = (1/4)³ = 1/64 ≈ 0.0156\n意思：Y 罐连抽三黑约 1.6%。","用：贝叶斯，先验相等，后验比 = 似然比 27:1\n算：Pr(X|BBB) = 27/(27+1) = 27/28 ≈ 0.9643\n意思：三个黑球后几乎确定是 X 罐。"],"trap":"把似然 (3/4)³ ≈ 0.422 当成后验 Pr(X|BBB)。"},
"prob-L18-c20":{"explain":"先读出三种情形的概率，再把回款换成净结果（扣投入 1），最后按概率加权得期望净值。","s":["用：直接读概率表\n算：Pr(好主意&有魅力) = 2/25 = 0.08\n意思：25 个项目中约 2 个是最好情形。","用：直接读概率表\n算：Pr(好主意&乏味) = 8/25 = 0.32\n意思：三格之和 2/25+8/25+15/25 = 1。","用：净结果 = 回款 − 投入\n算：4 − 1 = 3\n意思：最好情形净赚 3M，其余两种都是 −1。","用：期望值，净结果按概率加权\n算：(2×3 − 8 − 15)/25 = −0.68\n意思：平均每次亏 0.68M，是坏投资。"],"trap":"只算回款 2/25×4 = 0.32，忘了扣 1M 投入。"},
"prob-L18-c21":{"explain":"先算期望回款，再求各情形的净结果，最后用净结果加权求期望净值，并用「期望回款 − 5」核对。","s":["用：期望值（回款版），先不扣成本\n算：2/25×20 + 8/25×4 = 1.6 + 1.28 = 2.88\n意思：平均每次拿回 2.88M。","用：净结果 = 回款 − 投入\n算：20 − 5 = 15\n意思：最好情形净赚 15M。","用：净结果 = 回款 − 投入\n算：0 − 5 = −5\n意思：坏主意时投入全亏，且最常见。","用：期望值，净结果加权（成本只扣一次）\n算：(2×15 − 8 − 15×5)/25 = −2.12\n意思：核对 2.88 − 5 = −2.12，平均亏 2.12M。"],"trap":"每路扣了成本，最后又减一次 5。"},
"prob-L18-c22":{"explain":"先算期望回款，它就是公平价格；再用期望回款减票价得期望净收益。","s":["用：期望值，回款乘概率相加\n算：(1/2)(10) + (1/2)(0) = 5\n意思：长期平均每局拿回 $5。","用：公平价格 = 期望回款\n算：(1/2)(10−5) + (1/2)(0−5) = 0，所以是 5\n意思：付 $5 玩，长期不赚不亏。","用：期望净收益 = 期望回款 − 票价\n算：5 − 6 = −1\n意思：每局平均亏 $1，即庄家优势。"],"trap":"以为赢了能拿 $10 就值 $6，忽略一半时间回款为 0。"},
"prob-L18-c23":{"explain":"先求赢 $3 的概率，再算期望回款即公平价格，最后减去票价得期望净收益。","s":["用：互斥结果概率相加\n算：Pr(4 或 5) = 1/6 + 1/6 = 2/6 ≈ 0.3333\n意思：六次里约两次赢 $3。","用：期望值，各回款乘概率相加\n算：1/6×12 + 2/6×3 + 3/6×0 = 3\n意思：平均每次拿回 $3。","用：公平价格 = 期望回款\n算：公平价格 = $3\n意思：付 $3 玩，期望净收益为 0。","用：期望净收益 = 期望回款 − 票价\n算：3 − 4 = −1\n意思：平均每次亏 $1。"],"trap":"Pr(4 或 5) 只算 1/6，或把 12 和 3 直接平均。"},
"prob-L18-c24":{"explain":"各奖项乘概率相加得期望回款，即公平价格；再减去票价 $2 得每张的期望净收益。","s":["用：期望值，不中奖部分贡献 0\n算：500/1000 + 20/100 = 0.5 + 0.2 = 0.7\n意思：平均每张拿回 $0.70。","用：公平价格 = 期望回款\n算：公平价格 = $0.70\n意思：只有卖 $0.70 才公平。","用：期望净收益 = 期望回款 − 票价\n算：0.7 − 2 = −1.3\n意思：每张平均亏 $1.30。"],"trap":"只看 $500 大奖，忽略它只有 1/1000 的概率。"},
"prob-L18-c25":{"explain":"按马丁格尔规则算连输 6 次的累计亏损和下一注，再算第 7 注赢后的净结果，最后算连输 6 次的概率。","s":["用：每输一次翻倍，亏损累加\n算：1+2+4+8+16+32 = 63\n意思：连输 6 次后已亏 $63。","用：下一注 = 上一注 × 2\n算：2 × 32 = 64\n意思：第 7 注要押 $64。","用：净结果 = 赢得的钱 − 之前的亏损\n算：64 − 63 = 1\n意思：终于赢了也只净赚 $1。","用：独立事件相乘\n算：(1/2)^6 = 1/64 ≈ 0.015625\n意思：罕见但会发生；下一次输赢仍是 1/2。"],"trap":"以为连输后下一次更可能赢（赌徒谬误）。"},
"prob-L18-c26":{"explain":"画概率树：先选硬币再抛，求两条正面路径的交集，相加得 Pr(H)，再求正面中来自 A 的比例。","s":["用：乘法规则，先选 A 再出正面\n算：Pr(A&H) = 0.5 × 0.75 = 0.375\n意思：100 次中约 37.5 次是 A 且正面。","用：乘法规则，走 B 的路径\n算：Pr(B&H) = 0.5 × 0.15 = 0.075\n意思：100 次中约 7.5 次是 B 且正面。","用：全概率，两条路径相加\n算：Pr(H) = 0.375 + 0.075 = 0.45\n意思：100 次中约 45 次正面。","用：贝叶斯 Pr(A|H) = Pr(A&H)/Pr(H)\n算：0.375/0.45 = 5/6 ≈ 0.8333\n意思：看到正面后 A 更可信。"],"trap":"把 Pr(H|A) = 0.75 当成 Pr(A|H)。"},
"prob-L18-c27":{"explain":"证据换成反面：先在各硬币条件下用补集求反面率，再按贝叶斯四步求反面中来自 A 的比例。","s":["用：同一条件下补集 Pr(T|A) = 0.25，再乘 0.5\n算：Pr(A&T) = 0.5 × 0.25 = 0.125\n意思：100 次中约 12.5 次是 A 且反面。","用：同一条件下补集 Pr(T|B) = 0.85\n算：Pr(B&T) = 0.5 × 0.85 = 0.425\n意思：100 次中约 42.5 次是 B 且反面。","用：全概率，两条反面路径相加\n算：Pr(T) = 0.125 + 0.425 = 0.55\n意思：也等于 1 − 0.45。","用：贝叶斯 Pr(A|T) = Pr(A&T)/Pr(T)\n算：0.125/0.55 = 5/22 ≈ 0.2273\n意思：看到反面后 A 从 1/2 降到约 22.7%。"],"trap":"用 Pr(A|T) = 1 − Pr(A|H)，补集只能在同一条件下用。"},
"prob-L18-c28":{"explain":"先用全概率求首次正面概率，即公平价格；看到正面后用后验重新加权两枚硬币，得到第二次的正面概率和新公平价格。","s":["用：公平价格 = 期望回款 = Pr(H) × $1\n算：0.5×0.75 + 0.5×0.15 = 0.45\n意思：抛之前公平价格是 $0.45。","用：同一条件 H 下补集，A、B 二选一\n算：Pr(B|H) = 1 − 5/6 = 1/6 ≈ 0.1667\n意思：看到正面后 B 只剩约 16.7%。","用：全概率，权重换成后验\n算：5/6×0.75 + 1/6×0.15 = 0.65\n意思：下次正面概率从 0.45 升到 0.65。","用：公平价格 = 更新后的期望回款\n算：0.65 × $1 = $0.65\n意思：第二次的同一赌注值 $0.65。"],"trap":"以为各次独立所以仍是 0.45，或直接用 0.75。"}
}}
