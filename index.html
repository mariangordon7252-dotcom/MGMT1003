重描述谬误","one":"因为能用低层机制描述，就否认高层能力，这是重描述谬误。","pts":["重描述谬误（redescription fallacy）：Millière \u0026 Buckner 提出","“只是统计/线性代数”不足以证明不能思考","指出谬误≠证明 LLM 会思考"],"ex":"“人脑只是神经元放电，所以人不会思考”；“爱只是化学反应”。","trap":"把“只是预测下一 token”当成 LLM 不思考的可靠证明。","ana":"说“音乐只是空气振动，所以没有美”是错的推理：能用低层方式描述，不证明高层特性不存在。","words":[{"en":"linear algebra","zh":"线性代数","m":"矩阵运算的数学"},{"en":"mechanistic description","zh":"机制性描述","m":"讲内部怎么运作"},{"en":"low-level / high-level","zh":"低层 / 高层","m":"零件层面 / 整体能力层面"},{"en":"capacity","zh":"能力","m":"能做到的事"},{"en":"rule out","zh":"排除","m":"证明不可能"},{"en":"fallacy","zh":"谬误","m":"推理错误"}]},"soc-L11-hallucination":{"name":"幻觉","one":"幻觉（hallucination）：看着像答案、说得通，却没有事实支持。","pts":["文本合理≠真；文本概率高不保证命题真","格式完美、数字精确的引用也可能是编的","会犯错本身不能单独证明不会思考"],"ex":"问“亚洲最高公共厕所”，模型答 North Col；查无出处的“官方人口”。","trap":"把回答具体、格式完美当成真的。","ana":"像一个不懂装懂、口才极好的同学，被问到不会的题也能说得头头是道，其实是编的。","words":[{"en":"textual plausibility","zh":"文本合理性","m":"读起来像真的"},{"en":"public toilet","zh":"公共厕所","m":"公用卫生间"},{"en":"rare events","zh":"罕见事件","m":"很少发生的事"},{"en":"learn new facts","zh":"学习新事实","m":"记住新信息"}]},"soc-L11-twenty-questions":{"name":"二十问论证","one":"从同一处重新生成会换对象：模型只和前文一致，没有固定目标。","pts":["二十问（twenty questions）：人先把答案写纸上再答","模型：沿已有回答找仍说得通的对象","对话连贯≠有固定意图；支持图书馆假说，但非演绎证明"],"ex":"Shanahan 等重采样同一局二十问，模型“心里想的”每次不同。","trap":"以为这说明模型在故意说谎。","ana":"像一个玩猜谜却没先想好答案的人：只要回答和之前不矛盾就行，重来一次可能“想的”是别的东西。","words":[{"en":"resampling","zh":"重新采样","m":"从同一处再生成一次"},{"en":"fixed target","zh":"固定目标","m":"事先定好的答案"},{"en":"have in mind","zh":"心里想着","m":"脑中有某个对象"},{"en":"consistent with","zh":"与……一致","m":"不矛盾"},{"en":"dialogue so far","zh":"目前为止的对话","m":"已经说过的内容"}]},"soc-L11-testimony":{"name":"LLM 与证言","one":"LLM 会不会思考，和能不能从它学到东西，是两个问题。","pts":["不思考的东西（书、词典、地图）也能传信息","关键：主张能否追溯来源、能否检验","LLM 模糊了谁是证言者（testifier）、谁负责"],"ex":"词典没有意识，你照样能从里面学到知识。","trap":"以为 LLM 不思考就什么都学不到，或证言要求来源有意识。","ana":"地图不会思考，但你能靠它找到路；关键是它标的信息能不能追溯来源、能不能核对。","words":[{"en":"closing point","zh":"结尾要点","m":"讲座最后的结论"},{"en":"conscious","zh":"有意识的","m":"有主观体验"},{"en":"distinct","zh":"不同的","m":"彼此独立"},{"en":"traced","zh":"被追溯","m":"能查到来源"},{"en":"checked","zh":"被核对","m":"能验证真假"},{"en":"outputs","zh":"输出","m":"模型生成的内容"}]}}},
{"cards":{"soc-L13-epistemic-injustice":{"ana":"就像小组讨论时，你因为口音被默认“说不清楚”，或者你遇到的事根本没有词可以讲：受伤的是你“作为懂事、能说明白的人”的身份。"},"soc-L13-credibility-excess":{"ana":"班长和普通同学说法冲突，老师因为“班长一向靠谱”直接全信班长，天平一边加重，另一边的同学就自动被看轻了。"},"soc-L13-willful-hermeneutical-ignorance":{"ana":"员工早就有“隐形加班”这个说法，老板却坚称“没这回事，都是自愿的”，拒绝用这个词看问题，于是一直看不见它。"},"soc-L13-testimonial-quieting":{"ana":"消音：开会时保洁阿姨提醒设备漏水，大家像没听见。压抑：新员工知道一提意见就被嘲笑，打好的话又删掉。"},"soc-L14-testimonial-injustice":{"ana":"外卖小哥报警说看见有人撬车，警察因为“送外卖的能看清什么”而不当回事：话说出口了，却因身份被打折扣。"},"soc-L14-hermeneutical-injustice":{"ana":"“产后抑郁”这个说法普及之前，很多妈妈只觉得自己“矫情、不够爱孩子”，连自己都说不清发生了什么，社会也听不懂。"},"soc-L14-credibility-deficit":{"ana":"像给人打分，本该得 90 却只给了 60。至于为什么少给（偏见、权力、或其他原因），要另外判断。"},"soc-L14-identity-prejudice":{"ana":"像一副摘不掉的有色眼镜：认定“胖的人都懒”，看到对方每天健身也说“肯定只是装样子”，证据怎么都改不了看法。"},"soc-L14-wronged-as-knower":{"ana":"像医生因你是学生就不听你描述症状：误诊是认识上的损失，被当成“说了也白说的人”是对你人格的轻视。"},"soc-L14-sincerity-competence":{"ana":"天气预报 App 不会故意骗你（真诚），但可能算不准（能力）；不信它的准确度不等于说它撒谎。"},"soc-L14-reasonable-doubt":{"ana":"陌生号码说“你中奖了”你先怀疑是合理的；但对方给出官网查询记录后你还坚持“肯定是骗子”，就不再是合理怀疑了。"},"soc-L14-conceptual-engineering":{"ana":"像共用的词典和文件夹：查得到“PUA”这个词，零散感受才说得清；文件夹怎么合、怎么拆，会影响人怎么看自己。"},"soc-L15-manufactured-doubt":{"ana":"外卖店差评如潮，老板只要让人觉得“评价众说纷纭、还说不准”，大家就继续点。他不必证明好吃，只需让你拿不定主意。"},"soc-L15-selective-promotion":{"ana":"像只给朋友圈发自拍里最好看的那一张：每张都是真的，但挑出来展示的那部分让整体印象变了。"},"soc-L15-false-balance":{"ana":"辩论节目让“地球是圆的”和“地球是平的”各派一人、各说五分钟，观众会以为这是个五五开的问题。"},"soc-L15-implicature":{"ana":"零食包装写“0 蔗糖”，字面没错，却让人以为“不含糖、很健康”，其实可能加了别的糖。"},"soc-L15-credence":{"ana":"抽奖箱里 10 个球 1 个红球，没偷看时你对“抽中红球”的把握就该是 0.1；已经看到手里是白球，就不能再说 0.1。"},"soc-L15-action-under-uncertainty":{"ana":"牙疼总说“还没确定是蛀牙，再等等”，于是一直不看医生；其实去看一眼成本很低，行动不必先百分百确定。"},"soc-L17-informational-advertising":{"ana":"信息型像商品参数表：“重 180 克、售价 1999 元”；联想型像可乐广告总配聚会碰杯，一想到开心就想到可乐。"},"soc-L17-demand-engineering":{"ana":"先告诉你“手机屏幕上的细菌比马桶还多”，你原本毫不在意，接着推出“屏幕消毒湿巾”：先卖焦虑，再卖解药。"},"soc-L17-branding":{"ana":"果字标让人想到“简洁高级”，不管是手机还是耳机（品牌）；你说要考研，就被推“考研人都在用”的 App（定向）。"},"soc-L17-shared-attention":{"ana":"地铁里铺满“夏天不晒黑才精致”的广告，你自己不在乎，但觉得同事们都看到了、会这样看你，于是也去买了防晒衣。"},"soc-L17-absolute-relative-norm":{"ana":"绝对标准像考试 60 分及格，人人都能过；相对标准像“前 10% 才拿奖学金”，大家都进步了，门槛也跟着往上涨。"},"soc-L17-context-free-information":{"ana":"刷到某明星今天早餐吃了什么，能聊两句，但不会改变你今天做什么；而“明天全校停水”会让你马上去接水。"},"soc-L19-attention-economy":{"ana":"信息像不停涌来的快递，门口空间有限；你只有一双手，看似同时拆几个，其实是轮流拆，每次换手都耽误时间。"},"soc-L19-epistemic-bubble":{"ana":"泡泡像只加同专业同学的朋友圈，别人转来你会认真看；回音室像粉丝群，群主早说“黑子全是造谣”，外人拿证据反更坚信。"},"soc-L19-pagerank":{"ana":"像选餐厅看“被多少本地人推荐”：不用亲自尝菜，被越多人推荐的店越可能好吃，但也会有商家花钱刷推荐。"},"soc-L19-filtering":{"ana":"像图书馆员按“口味相近的读者借过什么”帮你挑书，书太多必须挑；外卖平台发现重口味的人互动最多，就越推越辣。"},"soc-L19-social-epistemic-reboot":{"ana":"笛卡尔式重启像把手机恢复出厂设置、所有联系人重新筛一遍，根本忙不过来；纽拉特之船像逐个删掉最可疑的联系人，其余照常用。"}}},
{"cards":{"soc-L13-epistemic-injustice":{"kind":"分辨证言还是诠释不正义","tip":"看卡在哪：说了不被信→证言；没词说清→诠释。"},"soc-L13-credibility-excess":{"kind":"Medina 的批评","tip":"看到「一方过高造成另一方不足」→选 Medina。"},"soc-L13-willful-hermeneutical-ignorance":{"kind":"给情景判断概念","tip":"看到「概念已存在却被优势群体否认」→蓄意诠释无知。"},"soc-L13-testimonial-quieting":{"kind":"情景判断消音或压抑","tip":"看谁沉默：说了被当没说→消音；预料不被接纳自己不说→压抑。"},"soc-L14-testimonial-injustice":{"kind":"情景判断＋条件辨析","tip":"须有身份偏见致可信度不足；刻板印象必要非充分，真假不影响。"},"soc-L14-hermeneutical-injustice":{"kind":"情景判断＋反例排除","tip":"看到「还没有这个词、经历说不清」→诠释；个人没学过术语不算。"},"soc-L14-credibility-deficit":{"kind":"还需检查什么条件","tip":"少信只是可信度不足；要算证言不正义还得查身份偏见，不看职级。"},"soc-L14-identity-prejudice":{"kind":"要素/必要条件辨析","tip":"问「非特征」→选准确统计；问条件→必要非充分；看少信是否因刻板印象。"},"soc-L14-wronged-as-knower":{"kind":"解释“作为知识主体”","tip":"选「被当作不完整的知识提供者，认识＋道德伤害」；错误信念、钱财是干扰。"},"soc-L14-sincerity-competence":{"kind":"给情景判断真诚/能力","tip":"真心相信却说错→真诚但缺能力，不是不真诚。"},"soc-L14-reasonable-doubt":{"kind":"情景判断＋短文","tip":"看怀疑是否依据当时证据并随证据更新；事后为真不说明当初不正义。"},"soc-L14-conceptual-engineering":{"kind":"新概念作用/合并细分","tip":"新概念作用→「连成可识别、可交流的伤害模式」；合并显共性，细分保差异。"},"soc-L15-manufactured-doubt":{"kind":"目标/手法＋短文","tip":"目标只需让证据显得没定论以拖延；细节分歧被说成主结论存疑也选它。"},"soc-L15-selective-promotion":{"kind":"看到资助如何回应","tip":"看到企业资助→加强审查方法和研究怎么被挑选，不判假也不忽略。"},"soc-L15-false-balance":{"kind":"给情景判断问题","tip":"看到正反双方「同等时间」而证据一边倒→虚假平衡。"},"soc-L15-implicature":{"kind":"给情景判断误导类型","tip":"看到「字面为真却让人推出没证明的结论」→言外之意，不是撒谎。"},"soc-L15-credence":{"kind":"解释数值＋计算","tip":"知道客观机会且无别的信息→信念度＝机会，别选 0.5；互斥穷尽→和为 1。"},"soc-L15-action-under-uncertainty":{"kind":"情景判断理性/现状","tip":"低概率＋低成本→可行动；「要更确定才改」→维持现状偏向。"},"soc-L17-informational-advertising":{"kind":"给广告判类型","tip":"列重量、材料、价格→信息型；画面全是感觉、生活方式→联想型。"},"soc-L17-demand-engineering":{"kind":"给广告判类型","tip":"看到先把没人在意的状态说成问题再卖解药→制造需求。"},"soc-L17-branding":{"kind":"给广告判类型","tip":"形象贴在整家公司所有型号→品牌塑造；「像你这样的人都爱它」→定向投放。"},"soc-L17-shared-attention":{"kind":"解释公开广播为何有效","tip":"关键是「预期别人也看到并接受」；私下不信也调整行为，不是逻辑证明。"},"soc-L17-absolute-relative-norm":{"kind":"判断绝对或相对标准","tip":"看到「人人都有后再推更贵的当成功标志」→相对标准；固定门槛→绝对。"},"soc-L17-context-free-information":{"kind":"老师对Postman的看法","tip":"选「相关与否看接收者处境而非媒介」；「纸媒有用、电子无用」是陷阱。"},"soc-L19-attention-economy":{"kind":"Simon 原意＋老师补充","tip":"成本在接收方；原意自分配、现代被竞买；多任务＝切换，有些任务不冲突。"},"soc-L19-epistemic-bubble":{"kind":"定义辨析＋为何难逃","tip":"外部声音只是没看到→泡泡；看到但被预先抹黑→回音室。"},"soc-L19-pagerank":{"kind":"机制理解","tip":"看到「被越多页面链接排越高、不懂内容」→选它；人工审核、按时间是干扰。"},"soc-L19-filtering":{"kind":"老师观点/为何趋极端","tip":"过滤：必要但会滤掉相关声音；趋极端：活跃用户主导＋创作者迎合的循环。"},"soc-L19-social-epistemic-reboot":{"kind":"老师反对理由/比喻","tip":"反对重启：注意力有限、起点错全盘偏；纽拉特之船＝逐块修补，非笛卡尔。"}}},
{"cards":{"soc-L13-epistemic-injustice":{"one":"认识不正义：人作为知识主体受到的不公（Fricker 分证言/诠释两类）。","en":"A wrong done to someone specifically in their capacity as a knower (Fricker: testimonial or hermeneutical).","qs":["soc-L14-q01","soc-L14-q02","soc-L14-e01"]},"soc-L13-credibility-excess":{"one":"可信度按身份分配不均：多给是过高，少给是不足；Medina 认为过高会造成不足。","en":"Fricker: credibility is unevenly distributed by identity; Medina: one party\u0027s credibility excess helps produce another\u0027s deficit.","qs":["soc-L13-q03"]},"soc-L13-willful-hermeneutical-ignorance":{"one":"蓄意诠释无知（Pohlhaus）：边缘群体已有概念，优势群体却拒绝承认。","en":"Pohlhaus: dominant knowers refuse to acknowledge concepts developed by marginalised groups, ignoring parts of social reality.","qs":["soc-L13-q06"]},"soc-L13-testimonial-quieting":{"one":"Dotson 两种证言压迫：消音是说了被当没说；自我压抑是预料不被接纳而自己不说。","en":"Dotson: quieting = the audience ignores the speaker as a knower; smothering = the speaker silences herself anticipating no proper uptake.","qs":["soc-L13-q05","soc-L13-q04"]},"soc-L14-testimonial-injustice":{"one":"证言不正义：听者因身份偏见给说话者可信度不足，伤害其知识提供者地位。","en":"A speaker receives a credibility deficit owing to the hearer\u0027s identity prejudice, wronging her as a giver of knowledge.","qs":["soc-L14-q02","soc-L13-q02","soc-L14-q10","soc-L13-q07","soc-L14-e01","soc-L14-e02"]},"soc-L14-hermeneutical-injustice":{"one":"诠释不正义：共同诠释资源中的结构性偏见使某些重要社会经历无法被理解。","en":"Having a significant area of one\u0027s social experience obscured from collective understanding by structural prejudice in shared hermeneutical resources.","qs":["soc-L14-q01","soc-L14-q08","soc-L14-e01"]},"soc-L14-credibility-deficit":{"one":"可信度不足：得到的信任低于应得；本身不等于证言不正义。","en":"Receiving less credibility than one\u0027s testimony deserves given one\u0027s evidence, sincerity and competence.","qs":["soc-L14-q07","soc-L14-q03","soc-L14-e02"]},"soc-L14-identity-prejudice":{"one":"因对方群体的负面刻板印象（stereotype）扭曲可信度判断，是证言不正义的原因。","en":"Prejudice against a social type, via a negative stereotype that resists counter-evidence, distorting credibility judgements.","qs":["soc-L13-q02","soc-L14-q07","soc-L14-q04","soc-L14-q10","soc-L13-q07"]},"soc-L14-wronged-as-knower":{"one":"作为知识主体受害：被当作不完整的知识提供者，兼有认识伤害与道德伤害。","en":"Being treated as less than a full giver of knowledge: both an epistemic harm and a moral harm.","qs":["soc-L14-q09"]},"soc-L14-sincerity-competence":{"one":"真诚＝说自己相信的话；能力＝有能力判断对；两者分开评估。","en":"Sincerity: asserting what one believes; competence: being positioned to get it right; separate dimensions of trustworthiness.","qs":["soc-L14-q05"]},"soc-L14-reasonable-doubt":{"one":"合理怀疑：基于听者当时证据并随新证据更新；偏见则抵抗反证。","en":"Doubt based on evidence available at the time and revised with new evidence, unlike prejudice resisting counter-evidence.","qs":["soc-L14-q06","soc-L14-q03","soc-L14-e02"]},"soc-L14-conceptual-engineering":{"one":"社群共享的词语和概念让经历可理解、可交流；概念工程就是评估和修改这些概念。","en":"Shared concepts make experience intelligible and communicable; conceptual engineering revises them by lumping or splitting.","qs":["soc-L14-q11"]},"soc-L15-manufactured-doubt":{"one":"利益方选择性放大少数异议，改变到达公众的信息比例，让证据显得未定论，以拖延行动。","en":"Interested parties distort which evidence reaches the public, making a settled conclusion look unsettled to delay action.","qs":["soc-L15-q01","soc-L15-q05","soc-L15-e01"]},"soc-L15-selective-promotion":{"one":"选择性推广：只资助/宣传有利的少数研究，使可见证据显得比实际更分裂。","en":"Funding or publicising only favourable minority studies so visible evidence looks more divided than the whole body.","qs":["soc-L15-q03","soc-L15-e01"]},"soc-L15-false-balance":{"one":"虚假平衡：把双方呈现为势均力敌，而证据分量严重偏向一方。","en":"Presenting two sides as equally weighty when the weight of evidence and expert opinion overwhelmingly favours one.","qs":["soc-L15-q02","soc-L15-e01"]},"soc-L15-implicature":{"one":"误导性言外之意：字面为真，却暗示出未被证明的结论。","en":"What a message suggests beyond its literal content; literally true yet leading to an unsupported conclusion.","qs":["soc-L15-q04"]},"soc-L15-credence":{"one":"信念度用 0–1 表示你的把握；主原则：知道客观机会且无其他相关信息时，信念度等于机会。","en":"Credence is degree of belief from 0 to 1; knowing an objective chance and nothing inadmissible, credence should equal that chance.","qs":["soc-L15-q06","soc-L15-q08","soc-L15-q07"]},"soc-L15-action-under-uncertainty":{"one":"行动看概率和后果，不必先确定；把“尚不确定”当“不必改变”，会偏向现状。","en":"Act on probabilities and costs, not certainty; demanding certainty before change favours the status quo.","qs":["soc-L15-q09","soc-L15-q05","soc-L15-q10"]},"soc-L17-informational-advertising":{"one":"信息型广告告诉你产品事实；联想型广告把产品与感觉或生活方式反复同框，不给产品信息。","en":"Informational ads state product facts; associative ads pair the product with a feeling or lifestyle without product information.","qs":["soc-L17-q01","soc-L17-q02","soc-L17-e01"]},"soc-L17-demand-engineering":{"one":"制造需求（Tim Wu）：先让未被在意的状态显得是问题，再把产品当解决办法。","en":"Tim Wu: first make an unnoticed condition seem a problem, then present the product as its solution.","qs":["soc-L17-q03","soc-L17-e01"]},"soc-L17-branding":{"one":"品牌塑造把形象贴在整家公司上；定向投放按受众兴趣或身份投放，说“像你这样的人想要它”。","en":"Branding attaches a trait to the whole company; targeting aims ads at an audience: \u0027people like you want this\u0027.","qs":["soc-L17-q08","soc-L17-q07"]},"soc-L17-shared-attention":{"one":"共同关注：大家都看到同一讯息而产生相互预期，即使私下不信也会改变行为。","en":"Public messages create mutual expectations that others saw and accept them, changing behaviour even of private doubters.","qs":["soc-L17-q04","soc-L17-q10","soc-L17-e01"]},"soc-L17-absolute-relative-norm":{"one":"绝对标准是人人达到的门槛；相对标准要比别人强，别人提升目标就升高。","en":"Absolute norm: a threshold everyone should meet; relative norm: being better than others, so the target keeps rising.","qs":["soc-L17-q05","soc-L17-q06"]},"soc-L17-context-free-information":{"one":"脱离情境的信息（Postman）：可作谈资，但与接收者能做的决定或行动几乎无关。","en":"Postman: information interesting to discuss but with little relevance to any decision or action available to the recipient.","qs":["soc-L17-q09"]},"soc-L19-attention-economy":{"one":"Simon：信息消耗接收者的注意力，信息越多注意越稀缺；而且人一次只能注意一件事。","en":"Simon: information consumes recipients\u0027 scarce, serial attention, so most of its cost falls on the recipient.","qs":["soc-L19-q01","soc-L19-q02","soc-L19-q05","soc-L19-e02","soc-L19-q03","soc-L19-q06"]},"soc-L19-epistemic-bubble":{"one":"Nguyen：泡泡是相关声音因遗漏没出现；回音室是外部声音被主动抹黑，成员预先不信。","en":"Nguyen: bubbles omit outside voices; echo chambers actively discredit them, making echo chambers self-reinforcing and harder to escape.","qs":["soc-L19-q07","soc-L19-q09","soc-L19-e01","soc-L19-q08","soc-L19-q12"]},"soc-L19-pagerank":{"one":"PageRank：被越多网页链接排名越高，以流行度代理信息性，无需理解内容。","en":"Google ranks highly pages many others link to, using popularity as a proxy for informativeness without understanding content.","qs":["soc-L19-q10"]},"soc-L19-filtering":{"one":"算法按“像你的人喜欢什么”替你筛内容，必要但有风险；最活跃用户主导推荐会放大极端内容。","en":"Filtering is necessary but can omit relevant voices; engagement-driven feedback loops amplify extreme content.","qs":["soc-L19-q11","soc-L19-e02","soc-L19-q15"]},"soc-L19-social-epistemic-reboot":{"one":"Nguyen 主张笛卡尔式重启信任；老师因注意力有限反对，主张纽拉特之船逐步修补。","en":"Nguyen\u0027s Cartesian reboot of trust fails given limited attention; instead, like Neurath\u0027s boat, gradually replace the weakest beliefs.","qs":["soc-L19-q13","soc-L19-q14"]}}},
{"cards":{"soc-L13-epistemic-injustice":{"q":"哪项最符合认识不正义（epistemic injustice）？A. 证据不足暂不相信 B. 因身份偏见不被当作知识主体 C. 没学过某个化学术语","a":"B","why":"它伤害的是人作为知识主体的身份，且源于偏见或结构性不公。"},"soc-L13-credibility-excess":{"q":"Medina 对 Fricker 证言不正义理论的主要批评是？A. 可信度不足从不算不正义 B. 一方可信度过高会造成另一方不足 C. 证言不正义要求听众有意伤害","a":"B","why":"可信度是比较、互动的：天平一边加重，另一边就被看轻。"},"soc-L13-willful-hermeneutical-ignorance":{"q":"员工已用“职场霸凌”说清自己的遭遇，管理层却坚称“根本没有霸凌这回事”。属于？A. 诠释不正义 B. 蓄意的诠释无知 C. 证言自我压抑","a":"B. 蓄意的诠释无知","why":"概念已经存在，是优势一方拒绝承认，而不是概念缺失。"},"soc-L13-testimonial-quieting":{"q":"一名残障员工知道主管常嘲笑残障人士的投诉，于是没报告自己受到的不公。Dotson 称为？A. 证言消音 B. 证言自我压抑 C. 可信度过高","a":"B. 证言自我压抑","why":"他自己没说出口，因为预料不会被恰当接纳；说了被无视才是消音。"},"soc-L14-testimonial-injustice":{"q":"警察因目击者是口音很重的移民，就认定她“说不清楚”，不采纳她准确的证词。这是？A. 证言不正义 B. 诠释不正义 C. 合理怀疑","a":"A. 证言不正义","why":"既有可信度不足，原因又是身份偏见，两个要素都具备。"},"soc-L14-hermeneutical-injustice":{"q":"“跟踪骚扰（stalking）”成为公认概念前，受害者只能说“他总出现在我附近”，旁人也当小事。最符合？A. 证言不正义 B. 诠释不正义 C. 证言消音","a":"B. 诠释不正义","why":"卡在共同诠释资源缺概念、经历说不清，而不是说了不被信。"},"soc-L14-credibility-deficit":{"q":"学徒报告设备异响，师傅只因自己资历深就不予理会。要认定为证言不正义（testimonial injustice），还需查明什么？","a":"少信是否由身份偏见造成","why":"可信度不足本身不等于证言不正义，必须是身份偏见所致。"},"soc-L14-identity-prejudice":{"q":"切尔诺贝利片段中，技术员报告屋顶有石墨，上级坚称反应堆不可能爆炸。要算严格意义的证言不正义，还需查？A. 报告后来是否被证实 B. 上级是否更资深 C. 少信是否由身份偏见造成","a":"C","why":"身份偏见是严格框架的必要条件；职位高低或事后被证实都不够。"},"soc-L14-wronged-as-knower":{"q":"工人如实报告脚手架松动，工头因他学历低不予理会，后来出了事故。按本讲，工人受到哪两种伤害？","a":"认识伤害和道德伤害","why":"真相丢失是认识伤害；被当作不完整的知识提供者是道德伤害。"},"soc-L14-sincerity-competence":{"q":"一位老人真心告诉你某种草药能治感冒，但他毫无医学知识。按真诚（sincerity）与能力（competence）的区分，应如何评价？","a":"真诚但缺乏能力","why":"真诚看是否说真心话，能力看能否判断对，两者要分开评估。"},"soc-L14-reasonable-doubt":{"q":"陌生人在街上说“你家着火了”，你先打电话核实，邻居确认后马上回家。你起初的怀疑属于？A. 证言不正义 B. 合理怀疑 C. 证言消音","a":"B. 合理怀疑","why":"怀疑基于当时证据，且新证据一出现就更新。"},"soc-L14-conceptual-engineering":{"q":"按课程，引入“性骚扰”这类共享概念为何重要？A. 用这个词的投诉一定被相信 B. 伤害从命名后才开始 C. 让人把零散经历连成可理解、可交流、可挑战的伤害模式","a":"C","why":"共同诠释资源让经历可理解、可交流，但不保证指控成立。"},"soc-L15-manufactured-doubt":{"q":"研究者都认同某效应真实，只对大小和时间给估计范围。宣传称“科学家连它存在都不确定”。这是？A. 准确报告了不确定 B. 证明研究者捏造数据 C. 把细节的不确定夸大成主结论存疑","a":"C","why":"效应存在是共识，不确定只在细节；说成主结论存疑就是制造怀疑。"},"soc-L15-selective-promotion":{"q":"50 项研究中 45 项发现某甜味剂有害，厂家只资助宣传另外 5 项。这是？A. 虚假平衡 B. 选择性推广 C. 误导性言外之意","a":"B. 选择性推广","why":"每项研究可能都是真的，被扭曲的是公众看到的证据比例。"},"soc-L15-false-balance":{"q":"新闻讨论疫苗是否导致自闭症，请一位医学专家和一位反疫苗人士各讲五分钟。主要的认识问题是？","a":"虚假平衡：暗示证据五五开","why":"证据分量压倒性偏向一方，平分时间却暗示势均力敌。"},"soc-L15-implicature":{"q":"饮料瓶上写“采用天然原料”，字面属实，顾客却以为它很健康。这属于？A. 撒谎 B. 误导性言外之意（misleading implicature）C. 虚假平衡","a":"B. 误导性言外之意","why":"字面为真，却让人自然推出一个它并未证明的结论。"},"soc-L15-credence":{"q":"A、B、C 互斥且穷尽，恰有一个发生。你对 A 的信念度是 0.5，对 B 是 0.3，对 C 应是？A. 0.3 B. 0.2 C. 0.5 D. 任意值","a":"B. 0.2","why":"互斥穷尽的结果信念度之和为 1：1−0.5−0.3=0.2。"},"soc-L15-action-under-uncertainty":{"q":"行业团体总强调小问题未解决，坚持“更确定”才改规定。为何偏向现状？A. 不确定证明现状安全 B. 把“尚不确定”当“不必改变”，拖延利于现状获益者 C. 迫使监管立即采纳所有提案","a":"B","why":"要求更多确定性本身就在拖延改变，现状默认继续，受益者获利。"},"soc-L17-informational-advertising":{"q":"啤酒广告反复展示下班后放松的工人，几乎不提啤酒本身。这最能体现？A. 提供详细产品信息 B. 在产品与感觉/生活方式间建立联想 C. 靠独特成分做产品区分","a":"B","why":"没有产品信息，只把啤酒和放松感反复同框，是联想型广告。"},"soc-L17-demand-engineering":{"q":"广告先说“你家的空气可能比室外还脏，你却察觉不到”，再推销空气净化器。这种策略叫？","a":"制造需求（demand engineering）","why":"先让原本没被在意的状态显得是问题，再把产品当作解决办法。"},"soc-L17-branding":{"q":"网络广告说：“和你兴趣相似的人都爱这款露营炉。”这最能体现？A. 品牌塑造 B. 信息型广告 C. 制造需求 D. 定向投放","a":"D. 定向投放","why":"按受众兴趣投放，传达“像你这样的人想要它”，对象是人不是公司。"},"soc-L17-shared-attention":{"q":"全城地铁都贴着“过年送礼就送 X”。小王自己不信，却怕亲戚觉得他寒酸而买了 X。主要机制是？","a":"共同关注带来的相互预期","why":"关键是他以为别人都看到并接受了这个标准，不是他自己相信。"},"soc-L17-absolute-relative-norm":{"q":"从前有部手机就够了；人人都有手机后，广告让最新款旗舰机成了“体面”的标志。这体现了？A. 绝对标准 B. 相对标准","a":"B. 相对标准（relative norm）","why":"目标是比别人强，别人都达到后门槛就跟着升高。"},"soc-L17-context-free-information":{"q":"按 Postman，哪条对你最可能是脱离情境的信息？A. 明天校园停水 B. 外国某明星离婚 C. 你常走的路今晚封闭","a":"B","why":"它能当谈资，但与你能做的决定或行动几乎无关。"},"soc-L19-attention-economy":{"q":"老师如何对比 Simon 原意与现代的注意力经济？A. Simon 指广告买注意，现代指组织备忘录 B. Simon 指高效分配自己的稀缺注意，现代指注意是广告商竞买的商品 C. 没区别","a":"B","why":"Simon 原意是自己分配注意（多内源），现代是注意被当商品卖给广告商（多外源）。"},"soc-L19-epistemic-bubble":{"q":"论坛成员常读对方帖子，只为互相说明对方恶意、不可信。按 Nguyen 这是？A. 认识泡泡，因为接触了对方 B. 都不是，因为看到了反对意见 C. 回音室，因为外部声音被主动抹黑","a":"C. 回音室","why":"看到了对方但被预先抹黑，就是回音室；泡泡是根本没看到。"},"soc-L19-pagerank":{"q":"早期谷歌怎样判断一个烘焙网页该排在前面？A. 请专家逐页审核 B. 看有多少其他烘焙网页链接到它 C. 看发布时间","a":"B","why":"PageRank 用被链接的流行度代理信息性，不需要理解内容。"},"soc-L19-filtering":{"q":"按课上对 YouTube 推荐的批评，用户为何被引向越来越极端的政治内容？A. 极端内容更准确 B. 最活跃用户影响最大，创作者迎合，极端内容在反馈循环中被放大 C. 算法随机选视频","a":"B","why":"推荐由最活跃用户主导，创作者迎合他们，循环中不断放大极端内容。"},"soc-L19-social-epistemic-reboot":{"q":"老师不赞成 Nguyen 的社会认识重启（social epistemic reboot），主张像纽拉特之船（Neurath\u0027s boat）那样做。具体怎么做？","a":"逐步换掉最不可靠的信任，靠其余部分撑着","why":"注意力有限无法从零重查，只能借现有可靠部分逐步修正。"}}},
{"cards":{"soc-L13-epistemic-injustice":{"name":"认识不正义","one":"认识不正义（epistemic injustice）：人作为知者受到不公。","pts":["证言型：说了因偏见不被信。","诠释型：缺概念，说不清、没人懂。","要有偏见或结构性不公，不是凡不被信都算。"],"ex":"同一句话，出自白人男性比出自黑人女性更容易被信。","trap":"以为凡是没被相信就是认识不正义；要看原因是不是偏见。","ana":"就像小组讨论时，你因为口音被默认“说不清楚”，或者你遇到的事根本没有词可以讲：受伤的是你“作为能说清事情的人”的身份。","words":[{"en":"in one\u0027s capacity as a knower","zh":"以知识主体的身份","m":"作为能提供知识的人"},{"en":"paradigm case","zh":"典型案例","m":"最标准、最有代表性的例子"},{"en":"dismiss","zh":"不予理会","m":"把说法当作不值一提"},{"en":"intuition","zh":"直觉","m":"不靠推理的感觉判断"},{"en":"dualism (Lackey)","zh":"二元论","m":"证言知识需说者和听者两方条件"},{"en":"assert","zh":"断言","m":"郑重声称某事为真"},{"en":"reliable","zh":"可靠的","m":"说的话通常是真的"},{"en":"independently verify through perception","zh":"亲自感知核实","m":"不靠对方，自己看、听去查证"}]},"soc-L13-credibility-excess":{"name":"可信度经济与可信度过高","one":"可信度过高（credibility excess）：因身份被多信；Medina 说它会让别人被少信。","pts":["Fricker 只关注可信度不足。","Medina：可信度是比较、互动的，一方多信另一方就少信。","多信少信看「你是谁」，不看说得对不对。"],"ex":"《杀死一只知更鸟》：Mayella 被过度相信，Tom Robinson 因此被少信。","trap":"把可信度当成可单独分给每个人的好处，忽略比较性。","ana":"班长和普通同学说法冲突，老师因为“班长一向靠谱”直接全信班长，天平一边加重，另一边的同学就自动被看轻了。","words":[{"en":"comparative","zh":"比较性的","m":"要和别人比较才有意义"},{"en":"interactive","zh":"互动的","m":"一方变化会影响另一方"},{"en":"account","zh":"理论、说明","m":"对某现象的一套解释"},{"en":"genuine","zh":"真正的","m":"名副其实的"},{"en":"credibility","zh":"可信度","m":"别人愿意相信你的程度"},{"en":"deficit","zh":"不足","m":"少于应得的量"},{"en":"intend to harm","zh":"有意伤害","m":"故意想让对方受损"}]},"soc-L13-willful-hermeneutical-ignorance":{"name":"蓄意的诠释无知","one":"蓄意诠释无知（willful hermeneutical ignorance）：概念已有，优势群体却拒绝承认。","pts":["与诠释不正义不同：不是没概念，是概念被拒绝。","优势群体是主动不用，不是不知道。","说明「概念出现就能解决」的看法不完整。"],"ex":"员工已用「职场霸凌」说清遭遇，管理层却坚称根本没有霸凌。","trap":"以为概念一出现诠释不正义就结束；拒绝承认同样造成伤害。","ana":"员工早就有“隐形加班”这个说法，老板却坚称“没这回事，都是自愿的”，拒绝用这个词看问题，于是一直看不见它。","words":[{"en":"willful","zh":"蓄意的","m":"故意的、有意为之"},{"en":"marginalised","zh":"边缘化的","m":"被排挤到社会边缘的"},{"en":"dominant group","zh":"优势群体","m":"社会中占主导地位的群体"},{"en":"actively deny","zh":"主动否认","m":"刻意说它不存在"},{"en":"pick out anything real","zh":"指向真实的东西","m":"概念对应现实中的现象"},{"en":"evidence-responsive","zh":"对证据敏感的","m":"会随证据改变看法"}]},"soc-L13-testimonial-quieting":{"name":"证言消音与自我压抑","one":"消音＝说了被当没说；自我压抑＝怕不被接纳而自己不说。","pts":["消音（quieting）：听众因偏见直接无视，连信不信都不判断。","自我压抑（smothering）：预料不被接纳，自己不说或少说。","看谁沉默：听众无视是消音，说话者没开口是压抑。"],"ex":"残障员工知道主管嘲笑残障投诉，于是不报告自己的遭遇：自我压抑。","trap":"以为自己选择沉默就不算不正义；原因是不公的听众环境。","ana":"消音：开会时保洁阿姨提醒设备漏水，大家像没听见。压抑：新员工知道一提意见就被嘲笑，打好的话又删掉。","words":[{"en":"quieting","zh":"消音","m":"让人的话等于没说"},{"en":"jury","zh":"陪审团","m":"法庭上判断事实的一组公民"},{"en":"defendant","zh":"被告","m":"在法庭上被起诉的人"},{"en":"testify","zh":"作证","m":"在法庭上陈述所知事实"},{"en":"worthless","zh":"毫无价值的","m":"一点用都没有"},{"en":"hermeneutical marginalisation","zh":"诠释边缘化","m":"群体被排除在概念形成之外"},{"en":"smothering","zh":"自我压抑","m":"把要说的话闷住不说"},{"en":"hostile","zh":"敌视的","m":"抱有敌意的"},{"en":"harassment","zh":"骚扰","m":"反复的、不受欢迎的冒犯"},{"en":"report","zh":"陈述、报告","m":"把发生的事告诉别人"},{"en":"testimonial","zh":"证言的","m":"与说话作证有关的"}]},"soc-L14-testimonial-injustice":{"name":"证言不正义","one":"证言不正义（testimonial injustice）：因身份偏见被少信。","pts":["两要素缺一不可：可信度不足＋原因是身份偏见。","真话没被信还不够，要查少信的原因。","身份偏见是必要条件，不是充分条件。"],"ex":"警察因目击者是口音重的移民，就不采纳她准确的证词。","trap":"只看「说了真话却没人信」就判证言不正义。","ana":"外卖小哥报警说看见有人撬车，警察因为“送外卖的能看清什么”而不当回事：话说出口了，却因身份被打折扣。","words":[{"en":"necessary condition","zh":"必要条件","m":"没有它就一定不成立"},{"en":"sufficient condition","zh":"充分条件","m":"有了它就一定成立"},{"en":"in the strict sense","zh":"严格意义上","m":"按最严格的定义"},{"en":"vicious cycle","zh":"恶性循环","m":"坏结果又加重原因"},{"en":"emotional","zh":"情绪化的","m":"凭情绪而非理性"},{"en":"discount","zh":"低估、打折扣","m":"不把话当回事"},{"en":"superiors","zh":"上级","m":"职位比你高的人"},{"en":"confirmed","zh":"被证实","m":"后来证明是真的"}]},"soc-L14-hermeneutical-injustice":{"name":"诠释不正义","one":"诠释不正义（hermeneutical injustice）：缺共享概念，重要经历说不清。","pts":["问题是缺概念，不是说了没人信。","缺口要和群体被边缘化的结构性偏见有关。","通常不需要个人恶意；个人没学过某术语不算。"],"ex":"「性骚扰」一词出现前，职场骚扰只被叫作「无害的调情」。","trap":"把个人知识不足（如没学过化学术语）当成诠释不正义。","ana":"“产后抑郁”这个说法普及之前，很多妈妈只觉得自己“矫情、不够爱孩子”，连自己都说不清发生了什么，社会也听不懂。","words":[{"en":"structural","zh":"结构性的","m":"来自社会整体安排"},{"en":"obscure","zh":"遮蔽","m":"让人看不清、理解不了"},{"en":"collective understanding","zh":"集体理解","m":"社会大家共同的认识"},{"en":"harmless flirting","zh":"无害的调情","m":"被当作没关系的暧昧举动"},{"en":"technical term","zh":"专业术语","m":"某学科里的专门用词"},{"en":"legal testimony","zh":"法庭证言","m":"在法律程序中作的证词"}]},"soc-L14-credibility-deficit":{"name":"可信度不足","one":"可信度不足（credibility deficit）：给的信任低于对方凭证据、能力应得的。","pts":["本身不等于证言不正义。","还要查原因：身份偏见、权力差，还是合理证据。","事后证实为真，不能证明当初少信不当。"],"ex":"学徒报告设备异响，师傅只因自己资历深不理会：还需查是否身份偏见。","trap":"看到权力差或少信就判证言不正义，没查身份偏见。","ana":"像给人打分，本该得 90 却只给了 60。至于为什么少给（偏见、权力、或其他原因），要另外判断。","words":[{"en":"technician","zh":"技术员","m":"负责操作设备的技术人员"},{"en":"graphite","zh":"石墨","m":"反应堆内部的材料"},{"en":"reactor","zh":"反应堆","m":"核电站发电的核心装置"},{"en":"senior","zh":"资历更高的","m":"职位或年资更高"},{"en":"eventually","zh":"最终","m":"到最后"},{"en":"upset","zh":"难过的","m":"心里不好受"}]},"soc-L14-identity-prejudice":{"name":"身份偏见与偏见刻板印象","one":"身份偏见（identity prejudice）：因群体负面刻板印象扭曲可信度判断。","pts":["三要素：群体关联负面特征、抵抗反证、不当情感投入。","「准确统计」不是要素；抵抗反证才是偏见的标志。","严格 Fricker 框架：负面刻板印象是必要非充分条件。"],"ex":"《天才雷普利》：Marge 有证据的指控被「女人的直觉」打发，源于女性情绪化的刻板印象。","trap":"以为有点统计依据就不是偏见，或上级不信下级就一定是证言不正义。","ana":"像一副摘不掉的有色眼镜：认定“胖的人都懒”，看到对方每天健身也说“肯定只是装样子”，证据怎么都改不了看法。","words":[{"en":"prejudice","zh":"偏见","m":"不看证据的预先负面判断"},{"en":"social type","zh":"社会群体类别","m":"如性别、种族"},{"en":"gender","zh":"性别","m":"男性、女性等社会身份"},{"en":"test data","zh":"测试数据","m":"实验检测得到的结果"},{"en":"design flaw","zh":"设计缺陷","m":"设计上的错误"},{"en":"negative attribute","zh":"负面特征","m":"如不诚实、不理性"},{"en":"resistant to counter-evidence","zh":"抵抗反证","m":"有相反证据也不改看法"},{"en":"ethically bad affective investment","zh":"不当的情感投入","m":"情感上执着于贬低对方"},{"en":"accurate statistics","zh":"准确的统计","m":"真实可靠的数据"},{"en":"feature","zh":"特征","m":"某事物具有的性质"}]},"soc-L14-wronged-as-knower":{"name":"作为知识主体受伤害","one":"被当作不完整的知识提供者（wronged as a knower），既是认识伤害也是道德伤害。","pts":["认识伤害：真相丢失。","道德伤害：人被贬低、不被尊重。","对比 Clifford：他管证据不足却信；这里是该信却因偏见不信。"],"ex":"工人如实报告脚手架松动，工头因他学历低不理：真相丢失，人也被贬低。","trap":"以为伤害只是形成了错误信念，或损失了钱财。","ana":"像医生因你是学生就不听你描述症状：误诊是认识上的损失，被当成“说了也白说的人”是对你人格的轻视。","words":[{"en":"giver of knowledge","zh":"知识提供者","m":"告诉别人自己所知的人"},{"en":"wrong (v.)","zh":"亏待、伤害","m":"不公正地对待某人"},{"en":"property","zh":"财产","m":"拥有的东西"},{"en":"logical error","zh":"逻辑错误","m":"推理过程出错"}]},"soc-L14-sincerity-competence":{"name":"真诚与能力","one":"真诚（sincerity）＝说真心话；能力（competence）＝能判断对。","pts":["两者独立，分开评估。","可以真诚却没能力：说错不等于撒谎。","因能力不足合理少信，不一定是不正义。"],"ex":"老人真心说某草药能治感冒，但毫无医学知识：真诚但缺能力。","trap":"把「说错了」当成「不真诚」。","ana":"天气预报 App 不会故意骗你（真诚），但可能算不准（能力）；不信它的准确度不等于说它撒谎。","words":[{"en":"insincere","zh":"不真诚的","m":"说的不是自己真心相信的"},{"en":"directions","zh":"指路","m":"告诉别人怎么走"},{"en":"barely","zh":"几乎不","m":"只知道一点点"},{"en":"assess","zh":"评估","m":"判断好坏、高低"},{"en":"interest (motive)","zh":"利益动机","m":"说法对自己有好处"}]},"soc-L14-reasonable-doubt":{"name":"合理怀疑","one":"合理怀疑（reasonable doubt）：按当时证据怀疑，有新证据就更新。","pts":["看听者当时的证据，不用事后真相倒推。","对方说的是真话，不等于听者当时就该信。","偏见抵抗反证；合理怀疑随证据更新。"],"ex":"陌生人说你家着火，你先打电话核实，邻居确认就马上回家：合理怀疑。","trap":"以为报告最后为真，就证明当初的怀疑是证言不正义。","ana":"陌生号码说“你中奖了”你先怀疑是合理的；但对方给出官网查询记录后你还坚持“肯定是骗子”，就不再是合理怀疑了。","words":[{"en":"initially","zh":"起初","m":"一开始的时候"},{"en":"grounds","zh":"依据","m":"支持判断的理由"},{"en":"frustrate","zh":"使受挫","m":"让人失望、不满"},{"en":"reasonableness","zh":"合理性","m":"是否有道理"},{"en":"available at the time","zh":"当时可得的","m":"那时候能拿到的"},{"en":"hindsight","zh":"事后之见","m":"知道结果后回头看"}]},"soc-L14-conceptual-engineering":{"name":"诠释资源与概念工程","one":"概念工程（conceptual engineering）：评估、修改社群共享的概念。","pts":["新概念把零散经历连成可识别、可交流、可挑战的模式。","合并显共性，细分保差异；增删都影响自我理解。","有了词不保证指控成立，伤害也不是命名后才开始。"],"ex":"Asperger\u0027s 并入自闭症谱系（合并）后，一些人失去熟悉的自我描述。","trap":"以为命名后伤害才开始，或用了这个词指控就一定成立。","ana":"像共用的词典和文件夹：查得到“PUA”这个词，零散感受才说得清；文件夹怎么合、怎么拆，会影响人怎么看自己。","words":[{"en":"guarantee","zh":"保证","m":"一定会发生"},{"en":"complaint","zh":"投诉、指控","m":"正式说出受到的不当对待"},{"en":"instance","zh":"实例","m":"某类事物中的一个"},{"en":"disagreement","zh":"分歧","m":"意见不一致"},{"en":"hermeneutical","zh":"诠释的","m":"与理解、解释意义有关"},{"en":"make sense of","zh":"理解","m":"弄明白是怎么回事"},{"en":"recognisable pattern","zh":"可识别的模式","m":"一眼能认出的共同规律"},{"en":"communicate","zh":"交流","m":"把意思传达给别人"},{"en":"challenge","zh":"挑战、抗争","m":"对不公提出质疑"}]},"soc-L15-manufactured-doubt":{"name":"制造怀疑与认识环境","one":"制造怀疑（manufactured doubt）：放大少数异议，让证据显得没定论，以拖延行动。","pts":["不必说谎、不必证明相反结论，让人觉得「说不准」就够。","手法：选择性推广、虚假平衡、误导性暗示。","把细节（多大、何时）的不确定说成主结论存疑。"],"ex":"烟草业备忘录：让公众「保持怀疑」，就是对抗不利证据的办法。","trap":"以为制造怀疑者必须撒谎，或以为自己看到的就是全部证据。","ana":"外卖店差评如潮，老板只要让人觉得“评价众说纷纭、还说不准”，大家就继续点。他不必证明好吃，只需让你拿不定主意。","words":[{"en":"merchant of doubt","zh":"贩卖怀疑的人","m":"靠制造怀疑获利的一方"},{"en":"scientific consensus","zh":"科学共识","m":"科学界的一致结论"},{"en":"unsettled","zh":"未定论的","m":"还没有结论"},{"en":"delay","zh":"推迟","m":"往后拖"},{"en":"range of estimates","zh":"估计范围","m":"给出一个区间而非单个数"},{"en":"fabricate data","zh":"捏造数据","m":"编造不存在的数据"},{"en":"dissent","zh":"异议","m":"不同意主流的意见"},{"en":"epistemic","zh":"认识的","m":"与知识、信念有关的"},{"en":"fund","zh":"资助","m":"出钱支持"},{"en":"scrutinise","zh":"仔细审查","m":"认真检查有没有问题"},{"en":"methods","zh":"研究方法","m":"研究是怎么做的"},{"en":"wider evidence","zh":"更广泛的证据","m":"其他所有相关研究"},{"en":"airtime","zh":"播出时间","m":"在节目里说话的时长"}]},"soc-L15-selective-promotion":{"name":"选择性推广","one":"选择性推广（selective promotion）：只资助、宣传对自己有利的少数研究。","pts":["每项研究可能都是真的，被扭曲的是证据比例。","受资助不等于结论假。","利益关系是仔细审查的理由，不是自动推翻的证据。"],"ex":"50项研究45项说甜味剂有害，厂家只宣传另外5项。","trap":"发现研究受企业资助就断定结论假，或完全忽视资助。","ana":"像只给朋友圈发自拍里最好看的那一张：每张都是真的，但挑出来展示的那部分让整体印象变了。","words":[{"en":"selective","zh":"选择性的","m":"只挑一部分"},{"en":"promote","zh":"推广、宣传","m":"让更多人看到"},{"en":"favour","zh":"有利于","m":"对某方有好处"},{"en":"study","zh":"研究","m":"一项科学调查"}]},"soc-L15-false-balance":{"name":"虚假平衡","one":"虚假平衡（false balance）：证据一边倒，却把双方摆成势均力敌。","pts":["看证据分量：数量、质量、可重复性。","各请一人、时间相等，就暗示证据五五开。","不需要认定少数一方在撒谎。"],"ex":"讨论疫苗与自闭症，请医学专家和反疫苗人士各讲五分钟。","trap":"以为听到正反两种声音，就说明证据旗鼓相当。","ana":"辩论节目让“地球是圆的”和“地球是平的”各派一人、各说五分钟，观众会以为这是个五五开的问题。","words":[{"en":"sceptic","zh":"怀疑论者","m":"不接受主流结论的人"},{"en":"equal airtime","zh":"相等的播出时间","m":"两边说话时间一样长"},{"en":"evenly split","zh":"平分","m":"两边各占一半"},{"en":"overwhelmingly","zh":"压倒性地","m":"绝大部分都"},{"en":"irrational","zh":"不理性的","m":"不讲道理的"}]},"soc-L15-implicature":{"name":"误导性言外之意","one":"误导性言外之意（misleading implicature）：字面为真，却让人推出它没证明的结论。","pts":["不是撒谎：字面内容可以完全准确。","误导来自读者自然会做的推断。"],"ex":"塑料包装上的回收标识只表示塑料类型，顾客却以为它容易回收。","trap":"以为只有说假话才算误导。","ana":"零食包装写“0 蔗糖”，字面没错，却让人以为“不含糖、很健康”，其实可能加了别的糖。","words":[{"en":"implicature","zh":"言外之意","m":"话里暗示而没直说的意思"},{"en":"literally","zh":"字面上","m":"只按文字本身的意思"},{"en":"outright lie","zh":"彻头彻尾的谎言","m":"直接说假话"},{"en":"recyclable","zh":"可回收的","m":"能再加工利用"},{"en":"illustrate","zh":"说明、例示","m":"用例子展示"}]},"soc-L15-credence":{"name":"信念度与主原则","one":"信念度（credence）：0–1 之间的数，表示你有多大把握。","pts":["主原则：知道客观机会、无其他信息 → 信念度＝机会。","互斥且穷尽的结果，信念度加起来＝1。","0.8＝很有把握但可能错；「两种可能」≠各 0.5。"],"ex":"A、B、C 互斥穷尽，信 A 0.5、B 0.3 → C＝1−0.5−0.3＝0.2。","trap":"用「要么下要么不下」推出 0.5，或把信念度当客观机会。","ana":"抽奖箱里 10 个球 1 个红球，没偷看时你对“抽中红球”的把握就该是 0.1；已经看到手里是白球，就不能再说 0.1。","words":[{"en":"credence","zh":"信念度","m":"对命题的把握程度"},{"en":"proposition","zh":"命题","m":"可真可假的一句话"},{"en":"mutually exclusive","zh":"互斥","m":"不可能同时发生"},{"en":"exhaustive","zh":"穷尽的","m":"所有可能情况都包括在内"},{"en":"outcome","zh":"结果","m":"可能出现的情况"},{"en":"fairly confident","zh":"相当有把握","m":"很可能对，但不确定"},{"en":"certain","zh":"确定的","m":"百分之百肯定"},{"en":"objective chance","zh":"客观机会","m":"世界本身的发生概率"},{"en":"relevant information","zh":"相关信息","m":"会影响判断的信息"},{"en":"inadmissible","zh":"不可采纳的","m":"如已知结果这类额外信息"},{"en":"whatever you believe","zh":"不管你信什么","m":"与个人看法无关"}]},"soc-L15-action-under-uncertainty":{"name":"不确定下决策与现状偏向","one":"行动看概率和后果，不必先确定；「不确定」不等于「不用改」。","pts":["概率低但成本低也可理性行动；行动≠断言它会发生。","维持现状偏向（status quo bias）：要求更确定才改，就能拖住行动。","不确定不证明现状安全；拖延利于靠现状获益的一方。"],"ex":"30% 下雨但带伞几乎没成本 → 带伞理性。行业团体要求「更确定才改规定」→ 拖延。","trap":"以为概率低于一半就不该行动，或以为还不确定就等于现状没问题。","ana":"牙疼总说“还没确定是蛀牙，再等等”，于是一直不看医生；其实去看一眼成本很低，行动不必先百分百确定。","words":[{"en":"decision theory","zh":"决策理论","m":"按概率和后果选行动的理论"},{"en":"rational","zh":"理性的","m":"有充分理由的"},{"en":"commit you to asserting","zh":"使你必须断言","m":"等于你承认它为真"},{"en":"estimate","zh":"估计值","m":"推算出的大概数"},{"en":"timing","zh":"时间点","m":"什么时候发生"},{"en":"exaggerated","zh":"夸大的","m":"说得比实际严重"},{"en":"genuine uncertainty","zh":"真实的不确定","m":"确实还不清楚的部分"},{"en":"status quo","zh":"现状","m":"目前的做法"},{"en":"industry group","zh":"行业团体","m":"代表某行业利益的组织"},{"en":"unresolved","zh":"未解决的","m":"还没有答案"},{"en":"regulation","zh":"监管规定","m":"政府的管理规则"},{"en":"interested parties","zh":"利益相关方","m":"结果关系到其利益的人"},{"en":"proposal","zh":"提案","m":"提出的改革方案"}]},"soc-L17-informational-advertising":{"name":"信息型与联想型广告","one":"信息型广告讲产品事实；联想型广告只把产品和感觉同框。","pts":["信息型（informational）：列特点、材料、价格、购买方式。","联想型（associative）：像条件反射，见产品就想起那种感觉。","信息型不保证真实；联想型不需要假信息也能影响行为。"],"ex":"犁广告列重量、材料（信息型）；啤酒广告只拍下班放松的工人（联想型）。","trap":"以为信息型内容一定真实，或以为广告必须给产品信息才能影响人。","ana":"信息型像商品参数表：“重 180 克、售价 1999 元”；联想型像可乐广告总配聚会碰杯，一想到开心就想到可乐。","words":[{"en":"advertisement","zh":"广告","m":"推销产品的宣传"},{"en":"plough","zh":"犁","m":"翻地用的农具"},{"en":"materials","zh":"材料","m":"东西用什么做的"},{"en":"construction","zh":"构造","m":"东西怎么组装的"},{"en":"strategy","zh":"策略","m":"做事的方法、套路"},{"en":"association","zh":"联想","m":"看到一样就想到另一样"},{"en":"lifestyle","zh":"生活方式","m":"过日子的方式和品味"},{"en":"shift","zh":"轮班","m":"一段工作时间"},{"en":"product differentiation","zh":"产品区分","m":"强调和别家不同的卖点"},{"en":"ingredient","zh":"成分","m":"做产品用的原料"}]},"soc-L17-demand-engineering":{"name":"制造需求","one":"制造需求（demand engineering）：先把没人在意的状态说成问题，再卖解药。","pts":["先卖问题，再卖答案。","常靠相互预期：我不在意，但怕别人在意。"],"ex":"「你家空气可能比室外还脏，你却察觉不到」，接着卖空气净化器。","trap":"以为它只是在满足人们早已有的需要。","ana":"先告诉你“手机屏幕上的细菌比马桶还多”，你原本毫不在意，接着推出“屏幕消毒湿巾”：先卖焦虑，再卖解药。","words":[{"en":"demand","zh":"需求","m":"想买某物的愿望"},{"en":"engineering","zh":"设计制造","m":"有意地打造出来"},{"en":"body odour","zh":"体味","m":"身体散发的气味"},{"en":"deodorant","zh":"除臭剂","m":"去除体味的产品"},{"en":"previously unnoticed","zh":"以前没被注意的","m":"原来没人在意的"},{"en":"condition","zh":"状态","m":"身体或生活的某种情况"}]},"soc-L17-branding":{"name":"品牌塑造与定向投放","one":"品牌塑造：形象贴在公司上；定向投放：按受众是谁投放。","pts":["品牌塑造（branding）：对象是公司，形象跟着所有型号走。","定向投放（targeting）：对象是受众，「像你这样的人都爱它」。","品牌形象不证明产品性能；两者可与制造需求叠加。"],"ex":"卡车厂宣传「耐用可靠」，看任何型号都想到它（品牌）；「兴趣像你的人都爱这款炉」（定向）。","trap":"把单款产品的广告当品牌塑造，或把「像你的人都爱它」当品牌塑造。","ana":"果字标让人想到“简洁高级”，不管是手机还是耳机（品牌）；你说要考研，就被推“考研人都在用”的 App（定向）。","words":[{"en":"brand","zh":"品牌","m":"公司的名号和标志"},{"en":"durable","zh":"耐用的","m":"用很久也不坏"},{"en":"trait","zh":"特质","m":"某种特点、形象"},{"en":"model","zh":"型号","m":"同一品牌的不同款"},{"en":"target","zh":"瞄准","m":"针对特定人群"},{"en":"audience","zh":"受众","m":"看到广告的人"},{"en":"interests","zh":"兴趣","m":"喜欢关注的东西"},{"en":"camping stove","zh":"露营炉","m":"野外做饭的小炉子"}]},"soc-L17-shared-attention":{"name":"共同关注","one":"共同关注（shared attention）：大家都看到同一讯息，私下不信也会照着做。","pts":["关键是「我以为别人会怎么看我」，不是人人真信。","公开反复展示能把讯息变成社会规范。","重复不能在逻辑上证明讯息为真。"],"ex":"全城地铁贴「过年送礼就送 X」，小王不信，却怕亲戚觉得他寒酸而买。","trap":"写成「所有人真的都相信了」。","ana":"地铁里铺满“夏天不晒黑才精致”的广告，你自己不在乎，但觉得同事们都看到了、会这样看你，于是也去买了防晒衣。","words":[{"en":"broadcast","zh":"公开播放","m":"向大量人群传播"},{"en":"privately doubt","zh":"私下怀疑","m":"心里不太信"},{"en":"mutual expectations","zh":"相互预期","m":"我预计别人怎么想"},{"en":"common knowledge","zh":"共同知识","m":"大家都知道且知道别人知道"},{"en":"recruitment poster","zh":"募兵海报","m":"号召参军的宣传画"},{"en":"enlist","zh":"参军","m":"报名入伍"},{"en":"motives","zh":"动机","m":"做事的原因"},{"en":"trenches","zh":"战壕","m":"一战前线的壕沟"}]},"soc-L17-absolute-relative-norm":{"name":"绝对标准与相对标准","one":"绝对标准：人人该达的固定门槛；相对标准：要比别人强。","pts":["绝对标准（absolute norm）：如「没有体味」。","相对标准：人人有车后，更贵的车成新标准。","Galbraith：欲望由生产制造，扩大生产不只是满足旧需要。"],"ex":"从前有车就显得成功；人人有车后，广告推更贵的车当新成功标志。","trap":"把「别人都有后门槛跟着升」当成绝对标准。","ana":"绝对标准像考试 60 分及格，人人都能过；相对标准像“前 10% 才拿奖学金”，大家都进步了，门槛也跟着往上涨。","words":[{"en":"created wants","zh":"被制造的欲望","m":"由广告和生产造出的想要"},{"en":"pre-existing needs","zh":"原有的需要","m":"本来就有的需要"},{"en":"justify","zh":"证明合理","m":"给出正当理由"},{"en":"maximise","zh":"最大化","m":"尽量多"},{"en":"mark of success","zh":"成功的标志","m":"显示成功的东西"},{"en":"fixed","zh":"固定不变的","m":"不会被改变"}]},"soc-L17-context-free-information":{"name":"脱离情境的信息","one":"脱离情境的信息（context-free information）：能当谈资，但和你能做的决定无关。","pts":["Postman 提出；相关与否看接收者处境，不只看媒介。","纸媒也登无关信息，网络论坛也能给有用本地信息。"],"ex":"外国某明星离婚（无关）vs 你常走的路今晚封闭（有关）。","trap":"以为课程结论是「纸媒有用、电子媒介无用」。","ana":"刷到某明星今天早餐吃了什么，能聊两句，但不会改变你今天做什么；而“明天全校停水”会让你马上去接水。","words":[{"en":"action-relevant","zh":"与行动相关的","m":"会影响你做什么"},{"en":"medium","zh":"媒介","m":"传递信息的方式，如报纸"},{"en":"print media","zh":"纸质媒体","m":"报纸、杂志"},{"en":"electronic media","zh":"电子媒介","m":"电视、网络等"},{"en":"online forum","zh":"网络论坛","m":"网上讨论区"},{"en":"recipient","zh":"接收者","m":"收到信息的人"}]},"soc-L19-attention-economy":{"name":"注意力经济与串行注意","one":"注意力经济（attention economy）：信息越多，注意越稀缺；人一次只能注意一件事。","pts":["信息的主要成本由接收者承担。","Simon 原意：自己分配注意；现代：广告商竞买注意。","串行注意：多任务只是快速切换，有代价；训练能降耗。"],"ex":"找 Where\u0027s Wally 只能一处处串行搜索；开车发短信仍不安全。","trap":"颠倒 Simon 原意与现代用法；以为多任务真能同时进行。","ana":"信息像不停涌来的快递，门口空间有限；你只有一双手，看似同时拆几个，其实是轮流拆，每次换手都耽误时间。","words":[{"en":"a wealth of information creates a poverty of attention","zh":"信息丰富造成注意力匮乏","m":"信息越多，注意越不够用"},{"en":"recipient","zh":"接收者","m":"收到信息的人"},{"en":"borne by","zh":"由……承担","m":"成本落在谁身上"},{"en":"transmitter","zh":"传输者","m":"负责发送信息的一方"},{"en":"commodity","zh":"商品","m":"可以买卖的东西"},{"en":"bid for","zh":"竞价购买","m":"出价争夺"},{"en":"allocate","zh":"分配","m":"决定用在哪里"},{"en":"memo","zh":"备忘录","m":"组织内部的书面通知"},{"en":"serial","zh":"串行的","m":"一个接一个，不能同时"},{"en":"multitasking","zh":"多任务","m":"同时做几件事"},{"en":"switching cost","zh":"切换成本","m":"换任务时损失的时间精力"},{"en":"caveat","zh":"保留意见","m":"补充的限制或提醒"},{"en":"single limited resource","zh":"单一有限资源","m":"只有一份、会用完的东西"},{"en":"demand (v.)","zh":"需要","m":"要求投入"},{"en":"texting","zh":"发短信","m":"用手机打字发消息"},{"en":"podcast","zh":"播客","m":"可收听的网络音频节目"}]},"soc-L19-epistemic-bubble":{"name":"认识泡泡与回音室","one":"泡泡：外部声音没看到；回音室：看到了但被预先抹黑。","pts":["泡泡（epistemic bubble）：因遗漏没看到，并未被贬低。","回音室（echo chamber）：外部声音被主动抹黑，成员预先不信。","泡泡易逃；回音室里反证被当敌意或确证，难逃。"],"ex":"论坛成员常读对方帖子，只为证明对方恶意、不可信：回音室。","trap":"以为接触过对方观点就不是回音室；泡泡是没看到，不是不信。","ana":"泡泡像只加同专业同学的朋友圈，别人转来你会认真看；回音室像粉丝群，群主早说“黑子全是造谣”，外人拿证据反更坚信。","words":[{"en":"bubble","zh":"泡泡","m":"与外界隔开的小圈子"},{"en":"exclude","zh":"排除","m":"不让进入"},{"en":"relevant voices","zh":"相关的声音","m":"本该听到的意见"},{"en":"network","zh":"网络","m":"互相连接的信息来源"},{"en":"political views","zh":"政治观点","m":"对政治问题的立场"},{"en":"conspiracy theory","zh":"阴谋论","m":"认为有人秘密操纵的说法"},{"en":"deliberately","zh":"故意地","m":"有意为之"},{"en":"discredit","zh":"抹黑","m":"让人觉得某来源不可信"},{"en":"malicious","zh":"恶意的","m":"存心害人的"},{"en":"self-reinforcing","zh":"自我强化的","m":"越运作越牢固"},{"en":"confirmation","zh":"确证","m":"支持原有看法的证据"},{"en":"sermon","zh":"布道","m":"宗教领袖的讲道"},{"en":"cult","zh":"邪教","m":"控制成员的极端团体"},{"en":"hostility","zh":"敌意","m":"想对你不利的态度"},{"en":"in advance","zh":"预先","m":"事情发生之前"}]},"soc-L19-pagerank":{"name":"PageRank 算法","one":"PageRank：被越多网页链接，排名越高；不用理解内容。","pts":["用流行度代理信息性，取代人工分类目录。","规则一旦被知道，就会被刻意操纵（gaming）。"],"ex":"谷歌不懂马，但被大量马网站链接的网站很可能是可靠的马网站。","trap":"以为它靠人工专家检查每个网页是否可靠。","ana":"像选餐厅看“被多少本地人推荐”：不用亲自尝菜，被越多人推荐的店越可能好吃，但也会有商家花钱刷推荐。","words":[{"en":"rank","zh":"排名","m":"排先后顺序"},{"en":"link to","zh":"链接到","m":"网页上指向另一网页"},{"en":"proxy","zh":"代理指标","m":"代替难测量东西的指标"},{"en":"informativeness","zh":"信息性","m":"内容有多有用、可靠"},{"en":"popularity","zh":"流行度","m":"受欢迎、被引用的程度"}]},"soc-L19-filtering":{"name":"算法过滤与推荐反馈循环","one":"算法按「像你的人喜欢什么」替你筛内容：必要，但有风险。","pts":["注意力有限，过滤是必要的；风险是滤掉相关声音成泡泡。","反馈循环（feedback loop）：活跃用户主导，创作者迎合，极端放大。","从政治内容出发会走向极端，户外生存视频不会。"],"ex":"老师的 Bluesky 不过滤会满是德语帖；YouTube 看政治视频会被推更极端的。","trap":"以为过滤全坏或全好；以为算法随机推荐，或任何话题都走极端。","ana":"像图书馆员按“口味相近的读者借过什么”帮你挑书，书太多必须挑；外卖平台发现重口味的人互动最多，就越推越辣。","words":[{"en":"filter","zh":"过滤","m":"挑出一部分、挡掉其余"},{"en":"algorithm","zh":"算法","m":"电脑按规则自动处理"},{"en":"irrelevant","zh":"不相关的","m":"和你无关的"},{"en":"unwanted","zh":"不想要的","m":"你不愿看到的"},{"en":"epistemically bad","zh":"认识上有害的","m":"对形成正确信念不利"},{"en":"feedback loop","zh":"反馈循环","m":"结果又反过来加强原因"},{"en":"engaged users","zh":"活跃用户","m":"互动最多的用户"},{"en":"recommendation","zh":"推荐","m":"平台推给你的内容"},{"en":"creators","zh":"创作者","m":"制作视频的人"},{"en":"play to","zh":"迎合","m":"按某些人的口味来做"},{"en":"extreme","zh":"极端的","m":"非常偏激的"},{"en":"outdoor survival","zh":"户外生存","m":"野外求生类题材"}]},"soc-L19-social-epistemic-reboot":{"name":"认识重启与纽拉特之船","one":"Nguyen 主张清空信任从头重评；老师主张像纽拉特之船逐块修补。","pts":["重启（social epistemic reboot）：抛掉「谁可信」的全部信念，从零重建。","老师反对：注意力有限会被淹没，起点错后面全坏。","纽拉特之船：换掉最不牢的木板，靠其余部分撑着。"],"ex":"从零重选信息源，第一步进了 Natural News 阴谋论网站，之后全被带偏。","trap":"把纽拉特之船当成笛卡尔式从一个确定基础重建。","ana":"社会认识重启像把手机恢复出厂设置、所有联系人重新筛一遍，根本忙不过来；纽拉特之船像逐个删掉最可疑的联系人，其余照常用。","words":[{"en":"reboot","zh":"重启","m":"全部清空重新开始"},{"en":"from scratch / afresh","zh":"从零开始","m":"什么都不保留重来"},{"en":"overwhelm","zh":"淹没、压垮","m":"多到处理不过来"},{"en":"corrupt","zh":"败坏","m":"让后面全部出错"},{"en":"metaphor","zh":"比喻","m":"用一件事说明另一件事"},{"en":"sailors","zh":"水手","m":"在船上工作的人"},{"en":"foundation","zh":"基础","m":"一切建立在其上的起点"},{"en":"trustworthy","zh":"值得信任的","m":"可以相信的"}]}}}];
const ZH = [{
  "mcq": {
    "logic-L1-q01": { "q": "在 PHIL1005 中，“论证”（argument）的最佳定义是：", "o": ["两个人之间的激烈争吵", "一组作为相信某个结论之理由而提出的前提（premises）", "关于同一话题的任意一串真陈述", "由专家证言支持的结论"] },
    "logic-L1-q02": { "q": "按照课程中的公式，批判性思维（Critical Thinking）= ？", "o": ["可靠的前提 + 良好的推理", "真的结论 + 自信的信念", "有效的论证 + 诉诸权威", "良好的推理 + 背熟的谬误名称"] },
    "logic-L1-q03": { "q": "“Nanette 说 ‘potato cakes’。Nanette 不是 Tasmania 人。所以 Nanette 来自 Victoria。”重构这个论证需要补上哪个未明说的前提（unstated premise）？", "o": ["所有 Victoria 人都说 ‘potato cakes’。", "只有 Victoria 或 Tasmania 的人才说 ‘potato cakes’。", "Nanette 曾经在 Tasmania 住过。", "大多数澳大利亚人说 ‘potato scallops’。"] },
    "logic-L1-q04": { "q": "“如果你不学习，你就通不过 PHIL1005。所以如果你学习，你就会通过。”错误在哪里？", "o": ["把必要条件（necessary condition）当成了充分条件（sufficient condition）", "把充分条件当成了必要条件", "使用了相互矛盾的前提", "把“或”理解为排他性的"] },
    "logic-L1-q05": { "q": "某人从一个古老而错误的疾病理论出发，每一步推理都完全有效（valid）。仅凭逻辑本身能保证什么？", "o": ["结论为真", "前提是有根据的", "只能保证：如果前提为真，结论就必然为真", "该论证是可靠的（sound）"] },

    "logic-L4-q02": { "q": "P1. 天空是蓝色的。P2. 天空不是蓝色的。所以，Cleo 是一只猫。这个论证是：", "o": ["无效的，因为前提与结论无关", "无效且不可靠", "有效且可靠（sound）", "有效（valid）但不可靠"] },
    "logic-L4-q03": { "q": "对于一个前提相互矛盾的论证，下列哪一项总是成立？", "o": ["它是无效的", "它是有效的，但永远不可能是可靠的", "只要结论为真，它就是可靠的", "它是否有效取决于它的结论"] },
    "logic-L4-q04": { "q": "为什么前提相互矛盾的论证算作有效（valid）？", "o": ["因为任何含有假前提的论证都是有效的", "因为这些前提不可能同时全部为真，所以不存在前提全真而结论为假的情况", "因为结论必须是逻辑真（logical truth）", "因为这些前提彼此逻辑蕴涵"] },
    "logic-L4-q05": { "q": "P1. 天空是蓝色的。P2. 汉堡会吃人。所以，Cleo 是一只猫或者 Cleo 不是一只猫。这个论证是：", "o": ["无效的，因为前提与 Cleo 毫无关系", "无效的，因为 P2 为假", "有效的，因为结论不可能为假；但不可靠", "可靠的，因为结论必然为真"] },
    "logic-L4-q06": { "q": "P1. 所有的猫都会飞。P2. Cleo 是一只猫。所以，Cleo 会飞。这个论证是：", "o": ["有效且可靠", "无效且不可靠", "无效但可靠", "有效但不可靠"] },

    "prob-L12-q17": { "q": "为喜鹊例子构建一个 100 人的假想总体（hypothetical population）表时，得到 1.4 名被俯冲的南岸居民。对此正确的态度是什么？", "o": ["该表无效，因为人数不能是小数；必须改用公式。", "没问题：该表是比例模型，放大到 1,000 人（14 人被俯冲）得到的概率相同。", "继续计算前应把 1.4 四舍五入为 1。", "这说明南岸的概率给错了。"] },
    "prob-L12-q18": { "q": "关于 Pr(A | B) 与 Pr(B | A)，哪种说法正确？", "o": ["二者总是相等，因为分子相同。", "Pr(A | B) 总是大于 Pr(B | A)。", "只有当 A 导致 B 时二者才可能不同。", "二者分子都是 Pr(A & B)，但分母一般不同，所以不必相等。"] },
    "prob-L12-q19": { "q": "在一张 2×2 的计数列联表（contingency table）中，行合计和列合计（即边际（margins））告诉你什么？", "o": ["条件概率，如 Pr(A | B)", "联合计数，如 A & B 情形的数量", "每个单一类别的总数，例如 A 情形的数量", "两个变量是否独立"] },
    "prob-L11-q20": { "q": "在 1,000 条消息记录中，A 出现在 10 条中，B 出现在 10 条中，有 8 条同时包含两者。哪项正确？", "o": ["Pr(A | B) = 0.008，因为 A 和 B 都很罕见。", "Pr(A | B) = 0.01，与 Pr(A) 相同。", "不知道 A 是否导致 B，就无法计算 Pr(A | B)。", "Pr(A | B) = 0.8，尽管 Pr(A) 和 Pr(B) 各自只有 0.01。"] },
    "prob-L11-q21": { "q": "一个 2 阶（order-2）马尔可夫（Markov）文本生成器：", "o": ["在前两个词的条件下为下一个词分配概率", "每次输出两个词", "只使用语料库中最常见的两个词", "以全部前文为条件，每次两个词"] },
    "prob-L11-q22": { "q": "词表有 100 个词时，按讲座中 n^(k+1) 的估算，一张完整的 2 阶马尔可夫表（所有两词前文 × 所有下一个词）大约有多少个条目？", "o": ["200", "10,000", "1,000,000", "100,000,000"] },
    "prob-L11-q23": { "q": "手机在 'Do you want anything from the ...' 之后建议 'shops' 时，它追踪的量最恰当的描述是：", "o": ["Pr('shops')，即这个词总体上有多常见", "Pr(preceding words | 'shops')", "Pr('shops' & preceding words) 除以词表大小", "Pr('shops' | preceding words)"] },
    "prob-L16-q24": { "q": "T 表示“疲倦（tired）”，I 表示“烦躁（irritable）”。Pr(T | I) 问的是什么？", "o": ["在你疲倦的条件下，你烦躁的概率。", "在你烦躁的条件下，你疲倦的概率。", "你既疲倦又烦躁的概率。", "你既不疲倦也不烦躁的概率。"] },
    "prob-L16-q25": { "q": "你 40% 的时间感到疲倦。疲倦时，80% 的时间会烦躁；不疲倦时，10% 的时间会烦躁。已知你烦躁，你疲倦的概率是多少？", "o": ["40%", "32%", "16/19（约 84.2%）", "80%"] },
    "prob-L16-q26": { "q": "每 100 人中有 1 个吸血鬼。99% 的吸血鬼在阳光下会烧起来；人类则从不会。你随机遇到一个人，他在阳光下没有烧起来。他是吸血鬼的概率是多少？", "o": ["1/9901（约 0.0101%）", "1/100", "1/10000", "99/100"] },
    "prob-L16-q27": { "q": "75% 的药丸含 MDMA。一种检测对含 MDMA 的药丸有 50% 呈阳性，对不含的有 40% 呈阳性。一颗药丸检测呈阳性。它含 MDMA 的可能性有多大？", "o": ["50%", "75%", "100%", "15/19（约 78.9%）"] },
    "prob-L16-q28": { "q": "无论药丸是否含 MDMA，一种检测呈阳性的频率都相同。75% 的药丸含 MDMA。一颗药丸检测呈阳性。它含 MDMA 的概率是多少？", "o": ["100%", "50%", "75%", "无法确定。"] },
    "prob-L16-q29": { "q": "假设一种检测的真阳性率（true positive rate）为 50%，但假阳性率（false positive rate）为 0%。一颗药丸检测呈阳性。它含 MDMA 的概率是多少（基础比率（base rate）75%）？", "o": ["50%", "75%", "100%", "87.5%"] },
    "prob-L16-q30": { "q": "同一种检测（真阳性 50%，假阳性 40%）用在只有 10% 药丸含 MDMA 的地方。一颗药丸检测呈阳性。它含 MDMA 的概率最接近：", "o": ["50%", "12.2%", "78.9%", "10%"] },
    "prob-L16-q31": { "q": "哪一对概率之和必然为 1？", "o": ["Pr(P | M) 与 Pr(P | ¬M)", "Pr(P | M) 与 Pr(¬P | M)", "Pr(M | P) 与 Pr(P | M)", "Pr(P | M) 与 Pr(M)"] },
    "prob-L16-q32": { "q": "在吸血鬼问题中（V = 吸血鬼，I = 在阳光下烧起来），你遇到的人没有烧起来。你应该计算哪个量？", "o": ["Pr(V | I)", "Pr(¬I | V)", "Pr(V | ¬I)", "Pr(V & I)"] },
    "prob-L16-q33": { "q": "在贝叶斯定理（Bayes' theorem）中，为什么分母 Pr(E) 展开为 Pr(E|H)Pr(H) + Pr(E|¬H)Pr(¬H)？", "o": ["因为 E 与 H 总是独立。", "因为 Pr(E|H) + Pr(E|¬H) = 1。", "因为基础比率必须计算两次。", "因为 H 与 ¬H 互斥且穷尽（mutually exclusive and exhaustive），E 只能通过这两条路径之一产生，两条路径都必须计入。"] },
    "prob-L16-q34": { "q": "某种病每 1,000 人中有 1 人患病。患病时检测有 99% 能检出，未患病时有 5% 给出假阳性。某人检测呈阳性。他患病的概率最接近：", "o": ["99%", "95%", "约 2%", "5%"] },
    "prob-L16-q35": { "q": "掷一枚公平硬币：正面选罐子 X（3 黑 1 白），反面选罐子 Y（1 黑 3 白）。有放回地抽两个球，两个都是黑球。硬币是正面的概率是多少？", "o": ["1/2", "3/4", "9/10", "1/10"] },
    "prob-L16-q36": { "q": "同样的罐子（X：3 黑 1 白；Y：1 黑 3 白；由公平硬币选择）。有放回地抽取，先抽到黑球，再抽到白球。正面（罐子 X）的概率是多少？", "o": ["3/4", "1/2", "9/10", "1/4"] },
    "prob-L16-q37": { "q": "哪种说法最能反映讲座对睡美人问题（Sleeping Beauty problem）的处理？", "o": ["存在相互竞争的论证：一种数公平硬币的结果（正面 = 1/2），另一种数无法区分的醒来场合（正面 = 1/3）。", "讲座无可争议地证明了醒来后正面的概率是 1/2。", "讲座无可争议地证明了醒来后正面的概率是 1/3。", "因为反面时睡美人醒来两次，硬币变得有偏。"] },
    "prob-L16-q38": { "q": "按照睡美人问题中的三分之一派（thirder）观点，睡美人醒来时应给反面分配的概率是：", "o": ["1/3", "1/2", "2/3", "1"] },
    "prob-L16-q39": { "q": "“几乎所有患疾病 H 的人都有症状 E，所以有症状 E 的人几乎肯定患有 H。”主要缺陷是什么？", "o": ["它混淆了 Pr(E | H) 与 Pr(H | E)，忽视了 H 有多罕见，以及 E 在没有 H 时出现得有多频繁。", "它假定 E 与 H 互斥。", "在需要联合概率的地方使用了条件概率。", "如果 Pr(E | H) 高于 90%，就没有缺陷。"] },
    "prob-L16-q40": { "q": "保持基础比率和真阳性率 Pr(P | M) 不变，哪种改变会让阳性结果成为支持 M 的更强证据？", "o": ["提高假阳性率 Pr(P | ¬M)", "降低假阳性率 Pr(P | ¬M)", "使 Pr(P | M) + Pr(P | ¬M) 等于 1", "使 Pr(P | ¬M) 等于 Pr(P | M)"] },
    "prob-L16-q41": { "q": "讲座提到，以群体特征作为证据的算法可能误判个人。用贝叶斯的术语来说，主要风险是：", "o": ["如果输入的基础比率或条件概率有误，赋予个人的后验概率（posterior probability）就可能是错的。", "贝叶斯定理不适用于算法。", "算法总是忽略证据。", "后验概率总是等于基础比率。"] },
    "prob-L18-q42": { "q": "在纠正后的创业例子中，你投资 $1 million，如果点子好且创始人有魅力，你会拿回 $4 million。在这一结果下你的净收益（net gain）是多少？", "o": ["亏损 $1 million", "赚 $3 million", "赚 $4 million", "赚 $5 million"] },
    "prob-L18-q43": { "q": "纠正后的创业模型，投资 $1M：好点子 + 有魅力的创始人（概率 2/25）回款 $4M；好点子 + 乏味的创始人（8/25）回款 $0；坏点子（15/25）回款 $0。期望净值（expected NET value）是多少？", "o": ["+$0.32 million", "−$0.68 million", "−$1 million", "+$0.24 million"] },
    "prob-L18-q44": { "q": "同一纠正后模型，但投资 $5M：有魅力（2/25）回款 $20M；乏味的创始人（8/25）回款 $4M；坏点子（15/25）回款 $0。期望净值是多少？", "o": ["+$2.88 million", "−$2.12 million", "−$5 million", "−$0.68 million"] },
    "prob-L18-q45": { "q": "一个公平硬币游戏：正面付 $10，反面付 $0，玩一次需 $6。玩家的期望净收益是多少？", "o": ["赚 $5", "赚 $4", "亏 $1", "亏 $6"] },
    "prob-L18-q46": { "q": "对于正面付 $10、反面付 $0 的游戏（公平硬币），多少入场价能使这个赌局成为公平赌局（fair bet）？", "o": ["$0", "$2.50", "$5", "$10"] },
    "prob-L18-q47": { "q": "一名学生把一张 $5 门票的期望净收益算成 1/2 × (10 − 5) + 1/2 × (0 − 5) − 5 = −5。哪里出错了？", "o": ["没错，这是正确的。", "成本被扣了两次：每个结果里扣一次，最后又扣一次。", "成本应该加上，而不是减去。", "概率应该相乘，而不是相加。"] },
    "prob-L18-q48": { "q": "你支付公平价格（fair price）$5 玩一次 $10/$0 的硬币游戏。哪种说法正确？", "o": ["这一次你保证不赔不赚。", "你平均会赚 $5。", "只有恰好玩两次时这个赌局才公平。", "你的期望净收益是 $0，但这一次你实际上要么赚 $5，要么亏 $5。"] },
    "prob-L18-q49": { "q": "如果一个赌局的价格定得高于其公平价格，而回款不变，那么：", "o": ["下注者的期望净收益为负，庄家获得优势（house edge）", "下注者的期望净收益仍为零", "各结果的概率发生改变", "下注者的期望回款增加"] },
    "prob-L18-q50": { "q": "在马丁格尔策略（Martingale strategy）中，玩家每输一次就把赌注加倍。主要的现实危险是什么？", "o": ["硬币记得之前的输局，变得不那么公平。", "所需赌注可能超出玩家的资金或下注上限。", "加倍会让下一次投掷更可能输。", "该策略保证每一轮都有大额利润。"] },
    "prob-L18-q51": { "q": "在公平硬币的等额赔付（even-money）赌局中使用马丁格尔策略，初始赌注 $1，你连输六次（赌注 1、2、4、8、16、32）。如果你接着押下所需金额并赢了，你的总净收益是多少？", "o": ["$64", "$63", "$1", "$127"] },
    "prob-L18-q52": { "q": "一枚公平硬币连续六次反面。如果各次投掷独立，下一次正面的概率是多少？", "o": ["小于 1/2，因为反面正在连胜", "恰好 1/2", "大于 1/2，因为正面“该来了”", "恰好 1，因为连串必然会结束"] },
    "prob-L18-q53": { "q": "一枚公平硬币连续八次正面的概率是多少？", "o": ["1/8", "1/16", "1/256", "1/512"] },
    "prob-L18-q54": { "q": "一个键盘预测游戏根据某人之前的按键来估计 Pr(F | FFF)。这个表达式问的是什么？", "o": ["已知最近三次按键都是 F 时，下一次按 F 的可能性", "最近三次按键都是 F 的可能性", "此人按了多少次 F", "在一次 F 之后接着三次 F 的可能性"] },
    "prob-L18-q55": { "q": "你拿到硬币 A 或硬币 B 的可能性相同。A 出正面的概率为 0.75；B 为 0.15。投掷前，出正面的总体概率是多少？", "o": ["0.15", "0.30", "0.45", "0.90"] },
    "prob-L18-q56": { "q": "同样的双硬币情形（A：正面 0.75，B：正面 0.15，各以概率 1/2 被选中），你投掷一次看到正面。你拿的是硬币 A 的概率是多少？", "o": ["1/6", "1/2", "3/4", "5/6"] },
    "prob-L18-q57": { "q": "在双硬币情形中看到正面后，哪种说法正确？", "o": ["硬币 A 出正面的几率升到了 0.75 以上。", "硬币 B 现在出正面的概率为 0。", "什么都没变，因为硬币投掷是独立的。", "我们认为手中是硬币 A 的概率从 1/2 升到 5/6，但硬币 A 本身出正面的几率仍是 0.75。"] },
    "prob-L18-q58": { "q": "有些计算机“随机数”生成器从一个种子（seed）出发并应用固定规则。由此可得什么？", "o": ["从同一种子出发会重现同一序列。", "该序列原则上真正不可预测。", "每个数取决于前一个数被重复的概率。", "输出不可能包含连串。"] },
    "prob-L18-q59": { "q": "一个游戏的期望值（expected value）是 $5。哪种解释正确？", "o": ["每次玩你都会恰好得到 $5。", "$5 是最可能的单次结果。", "重复很多次后，每次的平均结果趋近 $5。", "至少一半的游戏会付 $5 或更多。"] }
  },
  "calc": {

    "prob-L12-c02": { "q": "使用同一张校园表（A = 住校内，B = 本地生；A&B 350，A&~B 100，~A&B 200，~A&~B 350），求 Pr(A)、Pr(B | A) 和 Pr(A | ~B)。A 与 B 是否独立（independent）？", "s": ["Pr(A) = ?", "Pr(B | A) = ?", "Pr(A | ~B) = ?"] },
    "prob-L12-c03": { "q": "Pr(D) = 0.5，Pr(S) = 0.3，Pr(D & S) = 0.1。补全列联表（contingency table），并求 Pr(~D & S)、Pr(D & ~S)、Pr(~D & ~S) 和 Pr(D | ~S)。", "s": ["Pr(~D & S) = ?", "Pr(D & ~S) = ?", "Pr(~D & ~S) = ?", "Pr(D | ~S) = ?"] },
    "prob-L12-c04": { "q": "30% 的居民住在北岸（N），70% 住在南岸（~N）。北岸居民中 10% 被喜鹊俯冲（S），南岸居民中 2% 被俯冲。求 Pr(N & S)、Pr(~N & S)、Pr(S) 和 Pr(N | S)。", "s": ["Pr(N & S) = ?", "Pr(~N & S) = ?", "Pr(S) = ?", "Pr(N | S) = ?"] },
    "prob-L12-c05": { "q": "40% 的居民住在北岸（N）。北岸居民中 15%、南岸居民中 5% 被俯冲（S）。求 Pr(N & S)、Pr(~N & S)、Pr(S) 和 Pr(N | S)。", "s": ["Pr(N & S) = ?", "Pr(~N & S) = ?", "Pr(S) = ?", "Pr(N | S) = ?"] },
    "prob-L12-c06": { "q": "200 名学生中，60 人参加了复习课且及格（A = 及格，B = 参加），40 人参加但不及格，20 人未参加但及格，80 人未参加且不及格。求 Pr(A)、Pr(A | B) 和 Pr(A | ~B)。A 与 B 是否独立？", "s": ["Pr(A) = ?", "Pr(A | B) = ?", "Pr(A | ~B) = ?"] },
    "prob-L12-c07": { "q": "四个季节作为出生季节等可能。设 A = 出生在冬季、春季或夏季，B = 出生在夏季或秋季。求 Pr(A & B)、Pr(A | B) 和 Pr(A)。A 与 B 是否独立？", "s": ["Pr(A & B) = ?", "Pr(A | B) = ?", "Pr(A) = ?"] },
    "prob-L12-c08": { "q": "Pr(A) = 0.4，Pr(B) = 0.5，并且题目明确告诉你 A 与 B 独立。求 Pr(A & B)、Pr(A & ~B)、Pr(~A & ~B) 和 Pr(A | B)。", "s": ["Pr(A & B) = ?", "Pr(A & ~B) = ?", "Pr(~A & ~B) = ?", "Pr(A | B) = ?"] },
    "prob-L11-c09": { "q": "在 1,000 条消息记录中，词 A 出现在 10 条记录中，词 B 出现在 10 条记录中，有 8 条同时包含两者。求 Pr(A)、Pr(A & B) 和 Pr(A | B)。", "s": ["Pr(A) = ?", "Pr(A & B) = ?", "Pr(A | B) = ?"] },
    "prob-L16-c10": { "q": "你 40% 的时间感到疲倦（T）。疲倦时，80% 的时间会烦躁（I）；不疲倦时，10% 的时间会烦躁。求 Pr(T & I)、Pr(¬T & I)、Pr(I) 和 Pr(T | I)。", "s": ["Pr(T & I) = ?", "Pr(¬T & I) = ?", "Pr(I) = ?", "Pr(T | I) = ?"] },

"prob-L8-c10":{"s":[
"等可能原则：52 张牌等可能，A 有 4 张。\nP(Ace) = 4/52 = 1/13 ≈ 0.07692\n随机抽一张是 A 的概率。",
"条件概率（缩小样本空间）：已知是黑桃，只看 13 张黑桃，其中 1 张是 A。\nP(Ace | Spade) = 1/13 ≈ 0.07692\n与 P(Ace) 相等，所以 Ace 与 Spade 独立。",
"等可能原则，或独立时的乘法规则：同时是 A 和黑桃的只有黑桃 A 一张。\nP(Ace ∧ Spade) = 1/52 = 1/13 × 1/4 ≈ 0.01923\n等于 P(Ace) × P(Spade)，再次验证独立。",
"条件概率：已知是红桃，红桃一定是红色。\nP(Red | Heart) = 13/13 = 1\n而 P(Red) = 26/52 = 1/2，1 ≠ 1/2，所以 Heart 与 Red 不独立。"],
"trap":"以为能同时发生（如黑桃 A）就不独立；判断独立要看 P(A | B) 是否等于 P(A)。"},
"prob-L10-c11":{"s":[
"加法规则：A∧B 与 A∧¬B 互斥（B 和 ¬B 不能同时成立）；且这个析取在逻辑上等价于 A，等价式概率相同。\nP(A) = 1/4 + 1/6 = 3/12 + 2/12 = 5/12 ≈ 0.41667\nA 发生的总概率。",
"补集规则：A 与 ¬A 互斥且穷尽。\nP(¬A) = 1 − 5/12 = 7/12 ≈ 0.58333\nA 不发生的概率。",
"矛盾式的概率为 0：(A∧B) ∧ (A∧¬B) 里同时包含 B 和 ¬B，不可能为真。\nP[(A∧B) ∧ (A∧¬B)] = 0\n不能用乘法 1/4 × 1/6 = 1/24，因为两者不独立（它们互斥）。"],
"trap":"看到 AND 就直接相乘得 1/24，没发现这个合取是矛盾式，概率必为 0。"},
"prob-L10-c12":{"s":[
"互斥的定义：A 与 C 不能同时发生。\nP(A ∧ C) = 0\n互斥事件的合取概率为 0，不要相乘。",
"乘法规则：A 与 B 独立，所以 P(A ∧ B) = P(A) × P(B)。\nP(A ∧ B) = 1/4 × 1/5 = 1/20 = 0.05\nA 和 B 同时发生的概率。",
"加法规则：A∧B 发生时 A 一定发生，而 A 与 C 互斥，所以 A∧B 与 C 也互斥，可以直接相加。\nP[(A∧B) ∨ C] = 1/20 + 1/10 = 1/20 + 2/20 = 3/20 = 0.15\n两者至少一个发生的概率。"],
"trap":"把独立当成互斥（或反过来），例如把 P(A ∧ C) 算成 1/4 × 1/10，或不检查互斥就直接相加。"},
"prob-L10-c13":{"s":[
"乘法规则：两颗骰子独立，且指定了哪颗是 3、哪颗是 4（有序）。\nP(die1 = 3 ∧ die2 = 4) = 1/6 × 1/6 = 1/36 ≈ 0.02778\n36 种等可能结果中只有 (3,4) 一种。",
"加法规则：“一颗 3、另一颗 4”包含 (3,4) 和 (4,3) 两种结果，二者互斥。\nP = 1/36 + 1/36 = 2/36 = 1/18 ≈ 0.05556\n无序问法要把两种顺序都算上。",
"补集 + 乘法规则：每颗不出 6 的概率 5/6，两颗独立，相乘。\nP(neither 6) = 5/6 × 5/6 = 25/36 ≈ 0.69444\n两颗都不是 6 的概率。",
"补集规则：“至少一个 6”的补集是“都不是 6”。\nP(at least one 6) = 1 − 25/36 = 11/36 ≈ 0.30556\n不能用 1/6 + 1/6，因为两颗都为 6 的 (6,6) 会被重复计算。"],
"trap":"(b) 忘了乘 2 只算 (3,4)，或 (c) 直接写 1/6 + 1/6 = 1/3 重复计算了 (6,6)。"},
"prob-L10-c14":{"s":[
"乘法规则：有放回时第一次抽完放回，袋子不变，两次独立。\nP(both blue) = 3/5 × 3/5 = 9/25 = 0.36\n每次抽到蓝球都是 3/5。",
"条件概率（袋子组成改变）：无放回且第一次是蓝球，袋中剩 2 蓝 2 绿，共 4 个。\nP(2nd blue | 1st blue) = 2/4 = 1/2 = 0.5\n第一次的结果改变了第二次的概率，所以不独立。",
"一般乘法规则：P(B₁ ∧ B₂) = P(B₁) × P(B₂ | B₁)。\nP(both blue) = 3/5 × 2/4 = 6/20 = 3/10 = 0.3\n比有放回的 0.36 小，因为第一次拿走了一个蓝球。"],
"trap":"无放回时仍用 (3/5)² = 0.36，忽略了第一次抽取改变了袋子组成。"},
"prob-L10-c15":{"s":[
"一般乘法规则：无放回，P(R₁ ∧ R₂) = P(R₁) × P(R₂ | R₁)；第一次红后剩 3 红 9 球。\nP(both red) = 4/10 × 3/9 = 12/90 ≈ 0.13333\n两次都抽到红球的概率。",
"一般乘法规则：第一次白后剩 5 白 9 球。\nP(both white) = 6/10 × 5/9 = 30/90 ≈ 0.33333\n两次都抽到白球的概率。",
"补集规则：两红、两白、一红一白三种情况互斥且穷尽。\nP(one of each) = 1 − 12/90 − 30/90 = 48/90 ≈ 0.53333\n验证：(红,白)+(白,红) = 4/10×6/9 + 6/10×4/9 = 24/90 + 24/90 = 48/90。"],
"trap":"“一红一白”只算 4/10 × 6/9 = 24/90，漏掉了先白后红的另一种顺序。"},
"prob-L10-c16":{"s":[
"加法规则：2、4、6 三个面互斥，按各自的实际概率相加（结果不等可能，不能数个数）。\nP(even) = 1/10 + 1/10 + 1/2 = 0.1 + 0.1 + 0.5 = 0.7\n掷出偶数的概率。",
"补集规则：奇数与偶数互斥且穷尽。\nP(odd) = 1 − 0.7 = 0.3（也可 1/10 × 3 = 0.3 验证）\n掷出奇数的概率。",
"乘法规则：骰子虽然不公平，但各次投掷独立，所以相乘。\nP(even ∧ even) = 0.7 × 0.7 = 0.49\n连续两次都是偶数的概率。"],
"trap":"把六个面当作等可能，写 P(even) = 3/6 = 1/2；不公平的骰子要按实际权重相加。"},
"prob-L10-c17":{"s":[
"加法规则：A、B、C 两两互斥，并集概率等于各自相加。\nP(A ∨ B ∨ C) = 0.2 + 0.3 + 0.15 = 0.65\n三者至少一个发生的概率。",
"加法规则反推：D 与 A、B、C 都互斥，所以 P(A∨B∨C∨D) = P(A∨B∨C) + P(D) = 1。\nP(D) = 1 − 0.65 = 0.35\n剩下的概率全部属于 D。",
"补集规则：D 与 ¬D 互斥且穷尽。\nP(¬D) = 1 − 0.35 = 0.65\n恰好等于 P(A∨B∨C)，因为 ¬D 就是 A、B、C 之一发生。"],
"trap":"不检查 D 与 A、B、C 是否互斥就做减法；若有重叠，P(D) 无法由 1 − 0.65 唯一得出。"}
}}

{"calc":{
"prob-L12-c01":{"s":[
"规则：边际概率 = 该类别总人数 ÷ 全体。B（本地生）是表中一整列，要把这一列的两格加起来。\n代入：Pr(B) = (350 + 200)/1000 = 550/1000 = 0.55\n含义：1000 个学生里有 550 个是本地生，占 55%。",
"规则：AND（交集）概率 = 同时满足两个条件的那一格 ÷ 全体。分母仍是 1000，因为没有给定任何条件。\n代入：Pr(A & B) = 350/1000 = 0.35\n含义：随机抽一个学生，他既是本地生又住校内的概率是 35%。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)。给定 B 就是只在本地生里看，分母缩小为 550。\n代入：Pr(A | B) = 0.35/0.55 = 350/550 = 7/11 ≈ 0.6364\n含义：在 550 个本地生中，有 350 个住校内，约 63.6%。"],
"trap":"把 Pr(A | B) 的分母仍写成全体 1000，于是错把交集 0.35 当成了条件概率。"},
"prob-L12-c02":{"s":[
"规则：边际概率 = 整行合计 ÷ 全体。A（住校内）是表中一整行。\n代入：Pr(A) = (350 + 100)/1000 = 450/1000 = 0.45\n含义：全体学生中 45% 住校内。",
"规则：条件概率定义 Pr(B | A) = Pr(A & B)/Pr(A)。现在给定的是 A，所以分母换成住校内的 450 人。\n代入：Pr(B | A) = 350/450 = 7/9 ≈ 0.7778\n含义：住校内的 450 人中有 350 个本地生，约 77.8%。注意它和 Pr(A | B) = 0.636 不一样。",
"规则：条件概率定义 Pr(A | ~B) = Pr(A & ~B)/Pr(~B)。给定 ~B，只看国际生那一列，共 100 + 350 = 450 人。\n代入：Pr(A | ~B) = 100/450 = 2/9 ≈ 0.2222\n含义：国际生中只有约 22.2% 住校内。和本地生的 63.6% 差很多，所以 A 与 B 不独立（Pr(A | B) ≠ Pr(A) = 0.45）。"],
"trap":"把 Pr(B | A) 和 Pr(A | B) 当成同一个数：分子都是 350，但分母一个是 450、一个是 550。"},
"prob-L12-c03":{"s":[
"规则：一行（或一列）的合计 = 该行各格之和，所以未知格 = 合计 − 已知格。S 这一行由 D&S 和 ~D&S 组成。\n代入：Pr(~D & S) = Pr(S) − Pr(D & S) = 0.3 − 0.1 = 0.2\n含义：100 人表中，30 个 S 里有 10 个是 D，剩下 20 个是 ~D。",
"规则：同理用 D 这一列：D 的合计由 D&S 和 D&~S 组成。\n代入：Pr(D & ~S) = Pr(D) − Pr(D & S) = 0.5 − 0.1 = 0.4\n含义：50 个 D 里有 10 个是 S，其余 40 个是 ~S。",
"规则：四格之和必须等于 1，所以最后一格 = 1 − 其他三格。也可用 Pr(~S) − Pr(D & ~S) = 0.7 − 0.4 检查。\n代入：Pr(~D & ~S) = 1 − 0.1 − 0.2 − 0.4 = 0.3\n含义：100 人中有 30 人既不是 D 也不是 S。",
"规则：条件概率定义 Pr(D | ~S) = Pr(D & ~S)/Pr(~S)，其中 Pr(~S) = 1 − 0.3 = 0.7（补集规则）。\n代入：Pr(D | ~S) = 0.4/0.7 = 4/7 ≈ 0.5714\n含义：70 个 ~S 的人中有 40 个是 D，约 57.1%。"],
"trap":"题目没说 D 与 S 独立，却直接用 Pr(~D)×Pr(~S) = 0.5×0.7 = 0.35 去算交集。"},
"prob-L12-c04":{"s":[
"规则：乘法规则 Pr(N & S) = Pr(S | N)×Pr(N)。题目给的 10% 是北岸居民中的比例，即 Pr(S | N)，要乘上北岸人口占比才得到全体中的交集。\n代入：Pr(N & S) = 0.1 × 0.3 = 0.03\n含义：100 个居民中，30 个住北岸，其中 3 个被俯冲。",
"规则：同样用乘法规则，这次在南岸这一组：Pr(~N & S) = Pr(S | ~N)×Pr(~N)。\n代入：Pr(~N & S) = 0.02 × 0.7 = 0.014\n含义：100 个居民中，70 个住南岸，其中 1.4 个被俯冲。",
"规则：全概率规则。N 和 ~N 互斥且穷尽，被俯冲的人要么来自北岸要么来自南岸，所以两个交集相加。\n代入：Pr(S) = Pr(N & S) + Pr(~N & S) = 0.03 + 0.014 = 0.044\n含义：全体居民中 4.4% 被俯冲。",
"规则：条件概率定义（也就是 Bayes 定理）Pr(N | S) = Pr(N & S)/Pr(S)。给定 S，只在被俯冲的人里看。\n代入：Pr(N | S) = 0.03/0.044 = 15/22 ≈ 0.6818\n含义：4.4 个被俯冲的人中有 3 个来自北岸，约 68.2%。"],
"trap":"把 10% 和 2% 直接平均成 6% 当作 Pr(S)，忽略了北岸和南岸人口大小不同（30% 对 70%）。"},
"prob-L12-c05":{"s":[
"规则：乘法规则 Pr(N & S) = Pr(S | N)×Pr(N)。15% 是北岸内部的比例，要乘北岸占比 40%。\n代入：Pr(N & S) = 0.15 × 0.4 = 0.06\n含义：100 人中，40 个北岸居民里有 6 个被俯冲。",
"规则：乘法规则用于南岸：Pr(~N) = 1 − 0.4 = 0.6（补集规则），Pr(~N & S) = Pr(S | ~N)×Pr(~N)。\n代入：Pr(~N & S) = 0.05 × 0.6 = 0.03\n含义：60 个南岸居民里有 3 个被俯冲。",
"规则：全概率规则，把两个互斥分组的交集相加。\n代入：Pr(S) = 0.06 + 0.03 = 0.09\n含义：100 人中共有 9 人被俯冲。",
"规则：条件概率定义 / Bayes 定理 Pr(N | S) = Pr(N & S)/Pr(S)。\n代入：Pr(N | S) = 0.06/0.09 = 2/3 ≈ 0.6667\n含义：9 个被俯冲的人中 6 个来自北岸，占三分之二。"],
"trap":"忘了 Pr(~N) 要用 1 − 0.4 = 0.6，或者把 15% 与 5% 简单平均成 10% 当作 Pr(S)。"},
"prob-L12-c06":{"s":[
"规则：边际概率 = 行合计 ÷ 全体。及格（A）的人包括参加和未参加两部分。\n代入：Pr(A) = (60 + 20)/200 = 80/200 = 0.4\n含义：200 个学生中 40% 及格。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)。给定 B，只看参加复习的 60 + 40 = 100 人。\n代入：Pr(A | B) = 60/100 = 0.6（或 0.3/0.5）\n含义：参加复习的人中 60% 及格。",
"规则：条件概率定义 Pr(A | ~B) = Pr(A & ~B)/Pr(~B)。给定 ~B，只看未参加的 20 + 80 = 100 人。\n代入：Pr(A | ~B) = 20/100 = 0.2\n含义：未参加的人中只有 20% 及格。由于 Pr(A | B) = 0.6 ≠ Pr(A) = 0.4，A 与 B 不独立。"],
"trap":"看到 A 与 B 不独立就断定「参加复习导致及格」——不独立只说明相关，不证明因果。"},
"prob-L12-c07":{"s":[
"规则：四季等可能，每季概率 1/4；AND 要找两个事件同时为真的季节。A = 冬、春、夏，B = 夏、秋，重叠只有夏季。\n代入：Pr(A & B) = Pr(夏) = 1/4 = 0.25\n含义：只有夏天出生的人同时满足 A 和 B。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)，其中 Pr(B) = Pr(夏) + Pr(秋) = 1/2。\n代入：Pr(A | B) = (1/4)/(1/2) = 1/2 = 0.5\n含义：已知生在夏或秋，那么属于 A 的只有夏这一半。",
"规则：A 包含三个互斥的季节，用加法规则把它们相加。\n代入：Pr(A) = 1/4 + 1/4 + 1/4 = 3/4 = 0.75\n含义：不知道任何信息时 A 的概率是 75%；而 Pr(A | B) = 0.5 ≠ 0.75，所以 A 与 B 不独立。"],
"trap":"分子把交集错写成并集（如「春或夏或秋」），得出大于 1 的概率；交集只能是两个事件都包含的季节。"},
"prob-L12-c08":{"s":[
"规则：独立事件的乘法规则 Pr(A & B) = Pr(A)×Pr(B)。只有题目明确说独立时才能这样乘。\n代入：Pr(A & B) = 0.4 × 0.5 = 0.2\n含义：100 次中约 20 次 A 和 B 同时发生。",
"规则：A 这一行的合计 = Pr(A & B) + Pr(A & ~B)，所以用合计减交集。\n代入：Pr(A & ~B) = Pr(A) − Pr(A & B) = 0.4 − 0.2 = 0.2\n含义：40 次 A 中有 20 次 B 不发生。",
"规则：~B 这一列的合计 Pr(~B) = 1 − 0.5 = 0.5（补集规则），再减去 Pr(A & ~B)。\n代入：Pr(~A & ~B) = 0.5 − 0.2 = 0.3（也等于 0.6 × 0.5，因为 A、B 独立时其补集也独立）\n含义：100 次中约 30 次 A 和 B 都不发生。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)。\n代入：Pr(A | B) = 0.2/0.5 = 0.4\n含义：结果正好等于 Pr(A) = 0.4，验证了独立：知道 B 发生不改变 A 的概率。"],
"trap":"把这里「已知独立才能相乘」的做法搬到没说独立的题目上（如 c03），默认独立去乘。"},
"prob-L11-c09":{"s":[
"规则：边际概率 = 出现次数 ÷ 总记录数。\n代入：Pr(A) = 10/1000 = 0.01\n含义：随便拿一条记录，含有词 A 的概率只有 1%，A 很罕见。",
"规则：AND 概率 = 同时含 A 和 B 的记录数 ÷ 全体，分母仍是 1000。\n代入：Pr(A & B) = 8/1000 = 0.008\n含义：1000 条记录中只有 8 条两个词都有。",
"规则：条件概率定义 Pr(A | B) = Pr(A & B)/Pr(B)，其中 Pr(B) = 10/1000 = 0.01。给定 B，只看含 B 的 10 条记录。\n代入：Pr(A | B) = 0.008/0.01 = 0.8\n含义：含 B 的 10 条记录里有 8 条也含 A——A 虽然总体罕见，但只要出现 B，A 就很常见。"],
"trap":"以为 A 总体只有 1%，所以给定 B 后 A 的概率也应该很小；条件概率可以和总体频率差得很远。"},
"prob-L16-c10":{"s":[
"规则：乘法规则 Pr(T & I) = Pr(I | T)×Pr(T)。80% 是「疲倦时」烦躁的比例，即 Pr(I | T)，要乘上疲倦的比例。\n代入：Pr(T & I) = 0.8 × 0.4 = 0.32\n含义：100 个时刻中 40 个疲倦，其中 32 个烦躁。",
"规则：乘法规则用于不疲倦这一组，Pr(¬T) = 1 − 0.4 = 0.6。\n代入：Pr(¬T & I) = Pr(I | ¬T)×Pr(¬T) = 0.1 × 0.6 = 0.06\n含义：60 个不疲倦时刻中有 6 个烦躁。",
"规则：全概率规则：烦躁要么发生在疲倦时，要么发生在不疲倦时，两部分互斥，相加。\n代入：Pr(I) = 0.32 + 0.06 = 0.38\n含义：100 个时刻中共有 38 个烦躁时刻。",
"规则：Bayes 定理 Pr(T | I) = Pr(I | T)Pr(T)/Pr(I)。给定 I，只在 38 个烦躁时刻里数疲倦的。\n代入：Pr(T | I) = 0.32/0.38 = 16/19 ≈ 0.8421\n含义：看到自己烦躁时，有约 84.2% 的把握是因为疲倦（先验只有 40%）。"],
"trap":"把交集 0.32 或似然 Pr(I | T) = 0.8 直接当作后验 Pr(T | I)。"},
"prob-L16-c11":{"s":[
"规则：乘法规则，但证据是 ¬I（不烧毁），所以要先用补集规则求 Pr(¬I | V) = 1 − 0.99 = 0.01。\n代入：Pr(V & ¬I) = Pr(¬I | V)×Pr(V) = 0.01 × 0.01 = 0.0001\n含义：1 万人中有 100 个吸血鬼，其中只有 1 个不烧毁。",
"规则：乘法规则用于人类：人类从不烧毁，Pr(I | ¬V) = 0，所以 Pr(¬I | ¬V) = 1；Pr(¬V) = 0.99。\n代入：Pr(¬V & ¬I) = 1 × 0.99 = 0.99\n含义：1 万人中 9900 个人类全都不烧毁。",
"规则：全概率规则，把吸血鬼和人类两组中不烧毁的部分相加。\n代入：Pr(¬I) = 0.0001 + 0.99 = 0.9901\n含义：1 万人中共有 9901 人不烧毁。",
"规则：Bayes 定理 Pr(V | ¬I) = Pr(V & ¬I)/Pr(¬I)。给定 ¬I，只在 9901 个不烧毁的人里看。\n代入：Pr(V | ¬I) = 0.0001/0.9901 = 1/9901 ≈ 0.000101\n含义：不烧毁的人里吸血鬼只有 1/9901，比先验 1% 小了约 100 倍。"],
"trap":"证据是「不烧毁」却仍代入 Pr(I | V) = 0.99，没有先换成 Pr(¬I | V) = 0.01。"},
"prob-L16-c12":{"s":[

"prob-L16-c13":{"s":[

"规则：全概率规则，两组的阴性相加（也可检查 1 − Pr(P) = 1 − 0.475）。\n代入：Pr(¬P) = 0.375 + 0.15 = 0.525\n含义：1000 片中共 525 片阴性。",

"prob-L16-c14":{"s":[

"trap":"以为后验只取决于真阳性率 0.9；其实证据强弱看 Pr(P | M) 与 Pr(P | ¬M) 的差距，假阳性率同样关键。"}

"prob-L16-c15":{"s":[

"prob-L16-c16":{"s":[

"prob-L16-c17":{"s":[
"已知是罐 X 且放回抽取，两次抽取独立，可以直接相乘。\nPr(BB | X) = 3/4 × 3/4 = 9/16 = 0.5625\n如果真是 X 罐，连抽两黑的机会略过一半。",

"prob-L16-c18":{"s":[

"已知罐 Y，同样相乘。\nPr(BW | Y) = 1/4 × 3/4 = 3/16 = 0.1875\nY 罐里这个结果的机会也是 3/16，和 X 完全一样。",
"Bayes 定理：Pr(X | BW) = Pr(BW | X)Pr(X)/[Pr(BW | X)Pr(X) + Pr(BW | Y)Pr(Y)]。\n= (0.5 × 3/16)/(0.5 × 3/16 + 0.5 × 3/16) = 1/2 = 0.5\n似然比为 1，证据不区分两个假设，后验等于先验。"],

"prob-L16-c19":{"s":[
"已知罐 X，三次放回抽取独立，连乘三次。\nPr(BBB | X) = (3/4)³ = 27/64 ≈ 0.4219\nX 罐里连抽三黑约 42%。",

"prob-L18-c20":{"s":[

"logic-L4-q01":"选 B：这正是有效的定义：不存在前提全真而结论假的情况。\nA 错：混淆了有效与事实上为真。\nC 错：「很可能真」是概率支持，不是有效。\nD 错：相关性不在定义中；矛盾前提无关也有效。",
"logic-L4-q02":"选 D：P1、P2 矛盾不能同真，没有反例 → 有效；前提不能全真 → 不健全。\nA 错：话题无关不影响有效性。\nB 错：它没有反例，是有效的。\nC 错：矛盾前提不可能全真，不可能健全。",
"logic-L4-q03":"选 B：矛盾前提不可能全真，没有反例，所以有效但永远不健全。\nA 错：没有反例，就不可能无效。\nC 错：健全要求前提都真，矛盾前提做不到。\nD 错：结论是什么都有效，与结论无关。",
"logic-L4-q04":"选 B：前提不能同时为真，就不存在前提全真而结论假的情况。\nA 错：有假前提不保证有效，Klein 例子就无效。\nC 错：结论可以是任意命题，如「Cleo 是猫」。\nD 错：前提互相矛盾，不是互相蕴涵。",
"logic-L4-q05":"选 C：结论 C ∨ ~C 不可能为假，没有反例 → 有效；P2 假 → 不健全。\nA 错：话题无关不影响有效性。\nB 错：假前提只影响健全，不影响有效。\nD 错：P2 为假，所以不健全。",
"logic-L4-q06":"选 D：假设前提都真，Cleo 必会飞 → 有效；P1 事实上为假 → 不健全。\nA 错：P1「所有猫都会飞」为假，不健全。\nB 错：没有反例，它是有效的。\nC 错：健全要求有效，「无效但健全」不可能。",
"logic-L4-q07":"选 C：可以设想喝咖啡、吃酸奶却没有猫，这就是反例 → 无效。\nA 错：句句都真不保证有效。\nB 错：无效论证不可能健全。\nD 错：题目设定前提都为真。",
"logic-L4-q08":"选 B：健全＝有效＋所有前提事实上为真。\nA 错：结论真不代表有效、前提真。\nC 错：缺了有效；Klein 例子前提都真却无效。\nD 错：有无隐含前提与健全的定义无关。",
"logic-L4-q09":"选 A：前提若全真，结论必真；现在结论假 → 至少一个前提为假。\nB 错：太强了，不必所有前提都假。\nC 错：题目已说它有效，结论假不改变这点。\nD 错：可以推出至少一个前提为假。",
"logic-L4-q10":"选 B：有效＋前提全真＋结论假，正是有效定义排除的情况。\nA 错：可能。前提有假时，有效论证结论可真可假。\nC 错：可能，Klein 例子前提、结论都真却无效。\nD 错：可能，如「猫是狗；狗是哺乳动物 ∴ 猫是哺乳动物」。",
"logic-L4-q11":"选 D：P2、P3 只谈猫，没说 Cleo 是猫，要补这个隐含前提才有效。\nA 错：缺「Cleo 是猫」，按原样无效。\nB 错：按原样它无效，谈不上有效。\nC 错：「Cleo 活跃」P1 已经说了。",
"logic-L4-q12":"选 A：补完后结构有效，但「Taylor Swift 是弦理论权威」为假 → 不健全。\nB 错：诉诸权威不自动是谬误，看权威是否相关。\nC 错：补上的一个前提为假，不健全。\nD 错：补上的前提正好连起结论，已经有效。",
"logic-L4-q13":"选 B：反例要前提全真、结论假：街湿、条件句成立、但没下雨。\nA 错：结论「下雨了」为真，不是反例。\nC 错：街是干的，前提「街湿」为假。\nD 错：下雨街却干，条件句前提为假。",
"logic-L4-q14":"选 B：晨星就是金星，A 与 C 可以同真，所以互斥不传递。\nA 错：互斥没有传递性。\nC 错：概率是否相同与互斥无关。\nD 错：也推不出一定相容，只是信息不足。",
"logic-L4-q15":"选 A：蕴涵可以传递：A 真则 B 真，B 真则 C 真，所以 A 蕴涵 C。\nB 错：方向反了，C 不一定蕴涵 A。\nC 错：A 真时 C 必真，二者可同真，不互斥。\nD 错：蕴涵可以接力，能推出 A 蕴涵 C。",
"logic-L4-q16":"选 B：论证有效 ⇔ 前提合取 P1 & P2 & P3 蕴涵结论。\nA 错：太强；Potato cakes 例子单个前提推不出结论。\nC 错：方向反了。\nD 错：前提互斥与有效的定义无关。",
"logic-L6-q01":"选 B：3 个原子命题 A、B、C → 2ⁿ 行。\n算：2³ = 8\nA 错：6 是 2×3，算法错。\nC 错：9 是 3²，底数和指数弄反了。\nD 错：16 是 4 个原子命题的行数。",
"logic-L6-q02":"选 A：只有 A、B 两个原子命题，行数与联结词个数无关。\n算：2² = 4\nB 错：8 行需要 3 个原子命题。\nC 错：16 行需要 4 个原子命题。\nD 错：32 行需要 5 个原子命题。",
"logic-L6-q03":"选 C：最外层的 ∨ 把 (A & B) 和 ~B 两大块连起来，是主联结词。\nA 错：& 只连 A 和 B，在括号里。\nB 错：~ 只作用于 B。\nD 错：每个复合命题都有主联结词。",
"logic-L6-q04":"选 C：最外层把 ~(A ∨ B) 和 C 连起来的是 &。\nA 错：~ 只管括号 (A ∨ B)，不在最外层。\nB 错：∨ 在括号里。\nD 错：式子里没有 ⊃。",
"logic-L6-q05":"选 C：目标列有 T 有 F，是偶然命题。\n算：TT→T，TF→T，FT→F，FF→T\nA 错：FT 行为 F，不是每行都真。\nB 错：有三行为 T，不是逻辑假。\nD 错：真值表总能判定。",
"logic-L6-q06":"选 C：8 行中 4 行 T、4 行 F，是偶然命题。\n算：FFT 行：F ∨ ~F = T；TTF 行：F ∨ ~T = F\nA 错：TTF 行为 F。\nB 错：FFT 行为 T。\nD 错：真值表能判定，不需更多信息。",
"logic-L6-q07":"选 D：左块要 C 假，右块要 C 真，& 要两块同真 → 每行都假。\nA 错：没有任何一行为真。\nB 错：真值表总能判定。\nC 错：没有为真的行，不是偶然。",
"logic-L6-q08":"选 A：主联结词是中间的 ∨，左边 A ∨ ~A 永真，T ∨ X = T。\nB 错：左边永真，整体不可能为假。\nC 错：每行都真，不是偶然。\nD 错：用捷径就能判定，不必画满 8 行。",
"logic-L6-q09":"选 D：主联结词是 &，左边 A & ~A 永假，F & X = F。\nA 错：每行都假。\nB 错：用捷径就能判定。\nC 错：没有为真的行，不是偶然。",
"logic-L6-q10":"选 C：F ∨ X = X，整体等于 B：B 真则真，B 假则假 → 偶然。\nA 错：B=F 时整体为假。\nB 错：B=T 时整体为真；F ∨ X 不是捷径。\nD 错：真值表总能判定。",
"logic-L6-q11":"选 C：T ∨ X = T：析取一边为真，整体就为真。\nA 错：T & X = X，取决于 X。\nB 错：F ∨ X = X，取决于 X。\nD 错：前件假时条件句为真，F ⊃ X = T。",
"logic-L6-q12":"选 D：A ⊃ B 只在前件真、后件假时为假。\nA 错：前件假，条件句为真。\nB 错：前件、后件都真，条件句为真。\nC 错：前件假，条件句为真。",
"logic-L6-q13":"选 D：前件为假时实质条件句为真，没出现前件真后件假。\nA 错：只有前件真、后件假才为假。\nB 错：按真值表可以直接判定。\nC 错：命题总有真值，T 或 F。",
"logic-L6-q14":"选 C：~A ∨ B 与 A ⊃ B 每行同值。\n算：两列都是 T F T T（顺序 TT, TF, FT, FF）\nA 错：A ∨ ~B 列是 T T F T，等于 B ⊃ A。\nB 错：~A & B 只在 FT 行为真。\nD 错：B ⊃ A 是反方向，列为 T T F T。",
"logic-L6-q15":"选 A：A ⊃ B 只排除「A 真 B 假」，就是 ~(A & ~B)。\n算：~(A & ~B) 列为 T F T T，与 A ⊃ B 相同\nB 错：~(A ∨ ~B) ≡ ~A & B，只在 FT 行真。\nC 错：~A & ~B 只在 FF 行真。\nD 错：A & ~B 正是 A ⊃ B 的否定。",
"logic-L6-q16":"选 D：德摩根律：每项都否定，∨ 变 &。\nA 错：只否定没换联结词，它等于 ~(A & B)。\nB 错：A & B 没有否定，意思相反。\nC 错：只否定了 A，也没换联结词。",
"logic-L6-q17":"选 C：德摩根律：~(A & B) ≡ ~A ∨ ~B。\nA 错：没把 & 换成 ∨；TF 行它为 F。\nB 错：只否定了 A，B 没否定。\nD 错：~(A ∨ B) 等于 ~A & ~B，是「两者都不」。",
"logic-L6-q18":"选 B：德摩根律加双重否定：~(A ∨ ~B) ≡ ~A & ~~B ≡ ~A & B。\nA 错：没把 ∨ 换成 &。\nC 错：~~B 应化简为 B，不是 ~B。\nD 错：A 应被否定、B 不应被否定，正好反了。",
"logic-L6-q19":"选 D：没有括号时 ~ 只管 A；前者否定整个析取。\n算：A=F, B=T：~(A ∨ B) = F，~A ∨ B = T\nA 错：FT 行两者真值不同。\nB 错：两者都是偶然命题，不是逻辑假。\nC 错：德摩根律给的是 ~A & ~B，不是 ~A ∨ B。",
"logic-L6-q20":"选 A：本课的 ∨ 是包容性或，T ∨ T = T。\nB 错：那是排他的或，本课不用。\nC 错：命题总有真值。\nD 错：本课 ∨ 一律包容，不看说话者意图。",
"logic-L6-q21":"选 A：逻辑等价要求每一行真值都相同。\nB 错：只有一行相同远远不够。\nC 错：现实中同真不代表每种情况都同值。\nD 错：单向蕴涵不够：A & B 蕴涵 A 但不等价。",
"logic-L6-q22":"选 A：它只在前提全真、结论假时为假，有效论证没有这种行 → 永真。\nB 错：有效时它每行都真，不是永假。\nC 错：没有为假的行，不是偶然。\nD 错：只凭「有效」就能判定。",
"logic-L6-q23":"选 A：X ⊃ Y ≡ ~X ∨ Y，它等价于 (P1 & P2 & P3) ⊃ C，所以永真。\nB 错：这正是反例情况，有效时它永假。\nC 错：前提不全真且结论真时它为假。\nD 错：结论真不保证前提真，不必永真。",
"logic-L6-q24":"选 A：前提全真只有 A=F, B=T 一行，此行 B 为真 → 无反例 → 有效。\nB 错：A=T 时 ~A 为假，前提不全真。\nC 错：A=F, B=F 时 A ∨ B 为假，不是反例。\nD 错：真值表可以检验有效性。",
"logic-L6-q25":"选 D：A=F, B=T 时 A ⊃ B 真、B 真，结论 A 假 → 反例 → 无效。\nA 错：存在反例行 FT。\nB 错：它无效，谈不上有效但不健全。\nC 错：A=T, B=F 时 A ⊃ B 为假，不是反例。",
"logic-L6-q26":"选 A：前提全真只有 A=F, B=F 一行，此行 ~A 为真 → 有效。\nB 错：A=T, B=F 时 A ⊃ B 为假，不是反例。\nC 错：此行前提全真，但结论 ~A 也为真。\nD 错：A=F, B=T 时 ~B 为假，不是反例。",
"logic-L6-q27":"选 B：⊃ 只有 T/F 两种值；条件概率 P(B|A) 是 0 到 1 之间的数。\nA 错：一个是真值，一个是概率，不是一回事。\nC 错：A 假时 A ⊃ B 为真，P(B|A) 却不必为 1。\nD 错：⊃ 不表达因果关系。",
"logic-L6-q28":"选 B：两块都为假，所以整体为假。\n算：A & B = F & T = F；~B = F；F ∨ F = F\nA 错：两块都为 F，析取为假。\nC 错：命题在一行里只有 T 或 F。\nD 错：式子里没有 C。",
"logic-L6-q29":"选 A：but 在逻辑里就是 &，「Bob 不在家」是 ~B。\nB 错：~(A & B) 只是「不都在家」，范围更宽。\nC 错：A ∨ ~B 是析取，不是「而且」。\nD 错：把 Alice 和 Bob 弄反了。",
"logic-L6-q30":"选 B：S ⊃ E 只在 S 真、E 假时为假：提交了却没收到邮件。\nA 错：没提交，前件假，条件句为真。\nC 错：没提交，前件假，条件句为真。\nD 错：前件、后件都真，条件句为真。",
"logic-L6-q31":"选 B：句子说逻辑真理，论证说有效；A ∨ ~A 永真，A, ~A ∴ C 前提矛盾而有效。\nA 错：论证不能说是逻辑真理。\nC 错：句子不能说是有效。\nD 错：论证不能说是偶然。",
"logic-L8-q01":"选 A：令 X＝(A & B)，原式是 X ∨ ~X，每行都真。\nB 错：每行都真，不是永假。\nC 错：没有为假的行，不是偶然。\nD 错：认出 X ∨ ~X 结构即可，不必画表。",
"logic-L8-q02":"选 A：令 X＝(A ∨ B)，原式是 X & ~X，每行都假。\nB 错：没有为真的行。\nC 错：每行都假，不是偶然。\nD 错：认出 X & ~X 结构即可判定。",
"logic-L8-q03":"选 C：~(V & D) 只禁止两样同时做，V、D 都真才违规。\nA 错：只吸电子烟不带狗，V & D 为假，不违规。\nB 错：只带狗不吸电子烟，也不违规。\nD 错：两样都不做，当然不违规。",
"logic-L8-q04":"选 B：~(V ∨ D) ≡ ~V & ~D，两样都禁止；D 为真 → 违规。\nA 错：那是 ~(V & D) 的读法，这条更严。\nC 错：德摩根律没换联结词，写错了。\nD 错：代入 D=T 就能直接判定。",
"logic-L8-q05":"选 D：不能两者都（not both）＝~(A & B) ≡ ~A ∨ ~B。\nA 错：~A & ~B 是两者都不（neither）。\nB 错：~A & B 是「非 A 而 B」。\nC 错：~(A ∨ B) 也是两者都不。",
"logic-L8-q06":"选 C：两者都不（neither）：A 假且 B 假＝~A & ~B。\nA 错：~(A & B) 是不能两者都。\nB 错：~A ∨ ~B 也是不能两者都。\nD 错：~(A ∨ ~B) ≡ ~A & B，B 为真。",
"logic-L8-q07":"选 D：~ 穿过括号要每项否定且 & 变 ∨，应为 ~V ∨ ~D。\nA 错：~V & ~D 等于 ~(V ∨ D)，比原规则更严。\nB 错：~(V ∨ D) 是两者都不，不等价。\nC 错：否定号不能直接丢掉。",
"logic-L10-q01":"选 A：一个要 B 真，一个要 B 假，没有一行同为 T → 互斥。\nB 错：同为 F 的行不影响互斥。\nC 错：A=T, B=T 行两者真值不同。\nD 错：两者都是偶然命题，各有为真的行。",
"logic-L10-q02":"选 D：A、B 恰好一个为真时，两式都为真 → 不互斥。\n算：A=T, B=F：A ∨ B = T，~A ∨ ~B = T\nA 错：A ∨ B 的否定是 ~A & ~B，不是它。\nB 错：两者都是偶然命题，不是逻辑真理。\nC 错：TF、FT 两行它们真值相同。",
"logic-L10-q03":"选 D：互斥只排除同时为真，可以同时为假。\nA 错：那是恰好一个真，互斥不要求必有一真。\nB 错：互斥与概率是否相等无关。\nC 错：互斥与独立是两回事。",
"logic-L10-q04":"选 C：A 真时恰有一支成立，A 假时两支都假，所以与 A 每行同值。\nA 错：A 假时它为假，不是逻辑真理。\nB 错：A 真时它为真，不是逻辑假。\nD 错：A=T, B=F 时它为真，B 却为假。",
"logic-L10-q05":"选 B：两支互斥可相加，且 (A & B) ∨ (A & ~B) ≡ A。\n算：P(A) = 1/3 + 1/5 = 5/15 + 3/15 = 8/15\nA 错：1/15 是错误地相乘。\nC 错：2/15 是相减 5/15 − 3/15。\nD 错：7/15 是 P(~A)。",
"logic-L10-q06":"选 D：A & ~B 正是 A ⊃ B 唯一为假的情况，二者互为否定，不会同真。\nA 错：A=F 时 A ⊃ B 与 ~A 都为真。\nB 错：A、B、C 全真时两者都为真。\nC 错：A=T, B=F 时两者都为真。"

"logic-L6-c06":{"explain":"判等价就是逐行比较两式。先在 A=T, B=F 这行分别算出两式的值，发现不同；再数全表有几行不同。有一行不同就不等价。",

"logic-L6-c07":{"explain":"逐行比较两式。先在唯一可能出问题的 A=T, B=F 行算出两式都为假，再看其余三行都为真。两列完全相同，所以等价。",

"logic-L10-c08":{"explain":"互斥要看有没有一行两式同为 T。先算 A=T, B=F 行，再把两条目标列并排逐行对照，数出同为 T 的行；有一行就不互斥。",

"logic-L4-c09":{"explain":"先数原子命题 A、C 定行数；再找前提 A 与 ~A 同真的行，一行都没有，所以不可能有反例，论证有效。前提不能全真，所以不健全。",

"logic-L8-c10":{"explain":"先数行，再在 A=T, B=F 行算出 A & B 和整式的值；最后认出整式是 X ∨ ~X（X＝A & B），所以每行都真。",

"logic-L4-c11":{"explain":"8 行表里先删掉有前提为假的行，剩下前提全真的 4 行；再看这些行里 A ⊃ C 是否为假。反例要 A 真 C 假，这些行都不满足。",
