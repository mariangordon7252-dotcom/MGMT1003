 LLM 会思考，只是要求双方提供更充分理由。","hf":true},{"id":"soc-L11-hallucination","module":"soc","lecture":"L11","term":"Hallucination (LLM)","zh":"幻觉","def":"A hallucination is generated content that is textually plausible and answer-like but lacks factual support; it reflects the gap between textual plausibility and truth.","defZh":"看起来合理、像答案，但缺乏事实支持的生成内容；体现 textual plausibility 与 truth 的差别。","example":"教授问“亚洲最高公共厕所”，得到 North Col 一类答案（混淆排泄物报道与“存在公共厕所”）；虚构却格式完美的参考文献。","pitfall":"高文本概率 ≠ 命题为真；但“会犯错”本身不能单独证明“不会思考”。","hf":false},{"id":"soc-L11-twenty-questions","module":"soc","lecture":"L11","term":"Twenty questions argument (Shanahan et al.)","zh":"二十问论证","def":"When an LLM\u0027s twenty-questions dialogue is resampled from the same point, it may converge on different objects, suggesting it produces answers consistent with prior text rather than holding a fixed object in mind from the start.","defZh":"从同一位置重新采样，模型可能走向不同对象，说明它是让回答与前文一致，而非一开始就“心里想好”一个固定对象。","example":"人类玩法：先把“杯子”写在纸上再回答；模型：沿已有回答找仍说得通的对象。","pitfall":"对话连贯 ≠ 存在固定意图/目标；这是支持 bibliotechnic 的一项论据，不是完整演绎证明。","hf":false},{"id":"soc-L11-testimony","module":"soc","lecture":"L11","term":"LLMs and testimony (thinking vs being a source of knowledge)","zh":"LLM 与证言（思考 vs 知识来源）","def":"Whether an LLM thinks and whether we can gain knowledge from its outputs are distinct questions: a non-thinking system, like a book or reference tool, may still transmit information, but its claims must be traceable to sources and checkable.","defZh":"LLM 是否思考，与我们能否从它获得知识是两个不同问题：不思考的系统（如书本）也可能传递信息，但要看其主张能否追溯来源、能否验证。","example":"课本无意识，读者仍能学到东西；自动摘要的难题：来源可追溯吗？重组是否改变原意？","pitfall":"回接 L5：LLM 输出模糊了单个证言者与责任归属；AI 的流畅性伪装 expertise。人类语言也常程式化（战略计划、ELIZA）。","hf":false}],"mcq":[{"id":"soc-L1-q01","module":"soc","lecture":"L1","topic":"JTB 三条件","q":"According to the traditional JTB analysis, which of the following is NOT one of the conditions for X knowing that P?","options":["X believes that P","X is justified in believing that P","X is certain that P cannot be doubted","P is true"],"answer":2,"explain":"JTB 的三条是 truth、belief、justification。确定无疑/不可怀疑不是 JTB 条件；本课程也不以彻底怀疑论为重点。","hf":true},{"id":"soc-L1-q02","module":"soc","lecture":"L1","topic":"Gettier 证明了什么","q":"What does the Gettier (Verna–Colin) case most directly show?","options":["That we cannot know anything about other people\u0027s locations","That knowledge does not require truth","That justified true belief is not sufficient for knowledge","That justification is not necessary for knowledge"],"answer":2,"explain":"Gettier 只攻击 JTB 的充分性：J、T、B 都满足却不是知识。它没有说明 justification 或 truth 不必要，也没有证明怀疑论。","hf":true},{"id":"soc-L1-q03","module":"soc","lecture":"L1","topic":"Gettier 案例结构","q":"Verna sees a man who looks exactly like Colin in Sydney and comes to believe Colin is in Sydney. The man is a stranger, but Colin happens to be elsewhere in Sydney. Why does Verna intuitively lack knowledge?","options":["Her belief is false","Her belief is true only by luck: what makes it true is not what her evidence tracks","Her evidence is poor because she saw the man in bad lighting","She does not really believe it"],"answer":1,"explain":"她的证据指向陌生人，而使信念为真的是真正的 Colin 恰好也在悉尼——错误路线到达正确终点。她在正常光线下看清楚，证据在正常情况下是好的；信念为真且被相信。","hf":true},{"id":"soc-L1-q04","module":"soc","lecture":"L1","topic":"必要 vs 充分条件","q":"\u0027Enrolling in PHIL1005 is required for passing PHIL1005.\u0027 Which statement correctly describes enrolment?","options":["It is neither necessary nor sufficient for passing","It is a sufficient but not necessary condition for passing","It is both necessary and sufficient for passing","It is a necessary but not sufficient condition for passing"],"answer":3,"explain":"没有注册就不可能通过（Pass → Enrol），故为必要条件；但注册并不保证通过，故不充分。","hf":true},{"id":"soc-L1-q05","module":"soc","lecture":"L1","topic":"必要 vs 充分条件","q":"A student reasons: \u0027If I don\u0027t study, I won\u0027t pass. So if I study, I will pass.\u0027 What error does this involve?","options":["Confusing truth with validity","Treating a sufficient condition as a necessary condition","Relying on testimony rather than evidence","Treating a necessary condition as a sufficient condition"],"answer":3,"explain":"前提说学习是通过的必要条件（Pass → Study），结论却把它当成充分条件（Study → Pass）。这是教授课堂上的例子。","hf":true},{"id":"soc-L1-q06","module":"soc","lecture":"L1","topic":"知识的事实性","q":"Which claim best expresses the idea that knowledge is \u0027factive\u0027?","options":["If P is true, then you know P","If you know P, then P is true","If you know P, you must be able to prove P","If you believe P with good evidence, then P is true"],"answer":1,"explain":"Factive：K(P) → P。有好证据的信念仍可能为假（D 错）；P 为真不意味着你知道（A 是逆命题）；知识不要求能证明（C 错）。","hf":false},{"id":"soc-L1-q07","module":"soc","lecture":"L1","topic":"评价论证的两个维度","q":"A perfectly valid argument starts from a false theory of disease and reaches a false conclusion. Which lesson does this illustrate?","options":["Logic checks the reasoning structure, but whether the premises are reliable is a separate, epistemological question","Social epistemology is concerned only with logical form","Arguments with false premises cannot be valid","Validity guarantees true conclusions"],"answer":0,"explain":"批判性思维 = 可靠前提 + 好推理。逻辑只保证“若前提真则结论真”，不告诉你前提是否真；前提可靠性属认识论/社会认识论。有效论证可以有假前提。","hf":false},{"id":"soc-L2-q01","module":"soc","lecture":"L2","topic":"Newcomb：证据 vs 因果","q":"In Newcomb\u0027s problem, the two-boxer argues: \u0027The money is already placed; whatever is in box B, taking box A as well gives me $1,000 more.\u0027 This reasoning focuses on:","options":["The base rate of one-boxers in the population","What my choice is evidence for","What my choice can causally bring about","The reliability of testimony"],"answer":2,"explain":"Two-box = causal reasoning：当前选择不能改变已放好的钱。One-box = evidential reasoning：选择只拿 B 是 B 中有一百万的强证据。","hf":false},{"id":"soc-L2-q02","module":"soc","lecture":"L2","topic":"Newcomb：预测者可靠性","q":"In Newcomb\u0027s problem, if the \u0027oracle\u0027 were known to predict completely at random, what should you do?","options":["It makes no difference which you choose","Take only box B, since the choice is still evidence of the prediction","Take both boxes, since your choice now carries no evidence about what is in B","Refuse both boxes"],"answer":2,"explain":"教授指出 oracle 的可靠性至关重要：随机预测时你的选择与盒中内容无相关，证据推理失去依据，拿两个盒子显然更好（类比 Monty Hall 中主持人是否知情）。","hf":false},{"id":"soc-L3-q01","module":"soc","lecture":"L3","topic":"Clifford 原则","q":"Which statement best captures Clifford\u0027s principle in \u0027The Ethics of Belief\u0027?","options":["It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence","Beliefs should be chosen according to which risks one is willing to take","One may believe anything provided it harms no one","It is unwise, but not morally wrong, to believe on insufficient evidence"],"answer":0,"explain":"Clifford 的 wrong 是道德意义上的，且是普遍原则（always/everywhere/anyone/anything）。C 是 Clifford 要反驳的 objection；D 把道德上的 wrong 弱化成“不明智”，不符合原文。","hf":true},{"id":"soc-L3-q02","module":"soc","lecture":"L3","topic":"船主案例","q":"Suppose Clifford\u0027s shipowner\u0027s ship had arrived safely. What would Clifford say?","options":["The shipowner was guilty only of the action of sending the ship, not of his belief","The shipowner was still guilty, because he had no right to believe on the evidence before him","The shipowner was justified, because his belief turned out true","The shipowner did nothing wrong, since no one was harmed"],"answer":1,"explain":"Clifford：评价重点是信念形成的依据而非结果。好结果不能洗白不负责任的信念形成（酒驾平安到家的类比）。","hf":true},{"id":"soc-L3-q03","module":"soc","lecture":"L3","topic":"Clifford 的论证结构","q":"In the professor\u0027s reconstruction of Clifford\u0027s argument — P1: We have a duty to avoid harming others; P2: Believing on insufficient evidence always harms others; C: It is always wrong to believe on insufficient evidence — which premise is the most obvious target for objection?","options":["C, because it does not follow from P1 and P2","P1, because no one accepts a duty to avoid harm","None; the argument is uncontroversially sound","P2, because some beliefs seem private, trivial or inert"],"answer":3,"explain":"P2 极强：可能存在完全私人、微不足道、不影响行动的信念——这是 James 攻击的位置。教授还指出 James 从未真正回应 P1。","hf":true},{"id":"soc-L3-q04","module":"soc","lecture":"L3","topic":"Clifford 的回应","q":"Which of the following is NOT one of Clifford\u0027s replies to the objection that only actions, not beliefs, can be wrong?","options":["Beliefs are not private; they are communicated to others","Careless believing creates a harmful habit that damages collective truth-seeking","Beliefs cause actions","Beliefs are always freely chosen, so we are responsible for them"],"answer":3,"explain":"四个回应：信念导致行动；每个信念影响行为；信念不是私人的；轻信形成坏习惯。“信念可自由选择”是 James voluntarism 的方向，不是 Clifford 的回应。","hf":false},{"id":"soc-L3-q05","module":"soc","lecture":"L3","topic":"live/forced/momentous","q":"Choosing between white and herb bread at Subway is, for most people:","options":["Neither live nor forced","Live, forced and momentous","Momentous but not live","Live and forced, but not momentous"],"answer":3,"explain":"两种面包你都可能选（live），而且必须选一种（forced），但通常不会改变人生（not momentous）。这是课堂原例。","hf":true},{"id":"soc-L3-q06","module":"soc","lecture":"L3","topic":"forced option","q":"Someone says: \u0027I won\u0027t decide whether to go to university; I\u0027ll just keep putting it off.\u0027 According to James, why is this option still forced?","options":["Because failing to choose effectively amounts to choosing not to go","Because the option is not live","Because the evidence settles the question","Because the decision is trivial"],"answer":0,"explain":"Forced：不能永远悬置，不选择本身可能就是一种选择（时间流逝等同于选“不去”）。","hf":true},{"id":"soc-L3-q07","module":"soc","lecture":"L3","topic":"自我实现信念","q":"James\u0027s example of the person who must leap across a chasm is meant to show that:","options":["We should never act without conclusive evidence","Some beliefs adopted without sufficient prior evidence can help make themselves true, and so are not harmful","Confidence is always irrational","Belief is sufficient for success"],"answer":1,"explain":"Self-fulfilling belief：相信能跳过去会让人全力起跳，参与制造结果——作为 Clifford 原则的反例。但信念只可能是必要条件而非充分条件（跳不过百米深渊），故 D 错。","hf":true},{"id":"soc-L3-q08","module":"soc","lecture":"L3","topic":"追求真理 vs 避免错误","q":"According to James, a person who adopts an extremely strict evidential threshold for belief will tend to:","options":["Hold fewer false beliefs but risk missing truths","Hold more false beliefs but discover more truths","Gain more truths and fewer errors","Avoid both errors and missed truths entirely"],"answer":0,"explain":"Believe truth 与 shun error 是两个不同目标：门槛越严，错误越少，但错过真相的风险越高（类似医学检测阈值）。Clifford 处在“只避免错误”一端。","hf":true},{"id":"soc-L3-q09","module":"soc","lecture":"L3","topic":"James 的归谬 / 教授评价","q":"What is the professor\u0027s main criticism of James\u0027s response to Clifford?","options":["James agrees with Clifford that belief must be proportioned to evidence in all cases","James\u0027s reductio is logically invalid","James allows people to believe that 2 + 2 = 5","James never really addresses Clifford\u0027s first premise, the duty to avoid harming others"],"answer":3,"explain":"教授：两人某种程度上各说各话。James 关注个人认识风险与收益，成功表明 Clifford 的绝对原则太严，但没回答“当我的认识冒险会伤害他人时怎么办”（反疫苗例子）。James 不允许信 2+2=5。","hf":true},{"id":"soc-L3-q10","module":"soc","lecture":"L3","topic":"James 的归谬","q":"James\u0027s reductio against Clifford claims that Clifford\u0027s principle P (\u0027never believe on insufficient evidence\u0027):","options":["Is a self-fulfilling belief","Only applies to religious belief","Is supported by overwhelming evidence","Must be accepted prior to weighing evidence, so by its own standard believing P is wrong"],"answer":3,"explain":"P 规定如何评价证据，因而必须先于证据被接受，本身不建立在 P 要求的充分证据上——Clifford 在证据不足时相信“不能在证据不足时相信”，自我削弱。","hf":false},{"id":"soc-L5-q01","module":"soc","lecture":"L5","topic":"证言的范围","q":"In the broad sense used in this course, which of the following counts as testimony?","options":["Books, photographs, news reports and documentaries, as well as spoken reports","Only face-to-face spoken reports","Only sworn statements in a court of law","Only reports from certified experts"],"answer":0,"explain":"Testimony is things that people tell you, in a broad sense：包括书籍、照片、新闻、广播、纪录片、社交媒体、历史记录，以及家人讲述你的童年。","hf":false},{"id":"soc-L5-q02","module":"soc","lecture":"L5","topic":"Hardwig 中心主张","q":"Which claim is central to Hardwig\u0027s account of epistemic dependence?","options":["Experts are always right within their domains","We should verify every expert claim for ourselves before believing it","A layperson can be justified in believing P because a recognised expert believes P, even without possessing the expert\u0027s evidence","Testimony can never provide justification"],"answer":2,"explain":"Hardwig：A 是 P 的专家、A 相信 P、B 承认 A 是相关专家 → B 可以有理由相信 P。这不意味着专家总是对的（A），也不要求亲自验证（B）。","hf":true},{"id":"soc-L5-q03","module":"soc","lecture":"L5","topic":"辩护 vs 证据的传递","q":"In the pathologist → doctor → patient chain, what does testimony transmit to the patient?","options":["Neither evidence nor justification","The underlying microscope evidence itself","Justification for believing the diagnosis, without the underlying evidence","Certainty that the diagnosis is correct"],"answer":2,"explain":"本讲最重要的区分：testimony 可以传递 justification，但不把底层 evidence（切片、实验数据、解释能力）一路复制给病人。","hf":true},{"id":"soc-L5-q04","module":"soc","lecture":"L5","topic":"证言链必须落地","q":"It turns out the pathologist never examined the sample and filled in the report at random. On Hardwig\u0027s view, what follows?","options":["The whole chain of justification collapses, because it does not terminate in genuine evidence","Only the doctor loses justification; the patient remains justified","The doctor\u0027s authority makes the diagnosis true","The patient is still justified, because the chain of testimony is long"],"answer":0,"explain":"证言链可以很长，但不能悬空：必须最终连接到真实证据。许多人重复 P 并不构成 P 的证据。","hf":true},{"id":"soc-L5-q05","module":"soc","lecture":"L5","topic":"理性服从 vs 盲从","q":"Which best distinguishes rational deference from blind obedience?","options":["Rational deference relies on someone because of their social status","There is no difference; both involve accepting what one is told","Rational deference forbids asking questions or seeking second opinions","Rational deference relies on someone because of their relevant competence, and the expert\u0027s judgement must ultimately connect to evidence"],"answer":3,"explain":"盲从：因地位服从、不要求证据链。理性服从：因相关专业能力而依赖，专家判断最终连接到证据；非专家仍可提问、寻求第二意见。","hf":false},{"id":"soc-L5-q06","module":"soc","lecture":"L5","topic":"思想自主的限度","q":"Hardwig\u0027s calculus example (no one should reinvent calculus from scratch before believing it) supports which claim?","options":["Intellectual autonomy should be pursued in every domain","Complete epistemic autonomy across all domains would leave a person less informed and less reliable","Mathematics is not a source of knowledge","Textbooks are not testimony"],"answer":1,"explain":"拒绝所有专家依赖会使信念更粗糙、更不可靠；理性有时要求依赖专家。更现实的自主是谨慎决定何时、信谁。","hf":true},{"id":"soc-L5-q07","module":"soc","lecture":"L5","topic":"认识论个人主义 / 集体知识","q":"A large astronomy collaboration publishes a result that no single member can fully explain from start to finish. This example mainly challenges:","options":["The factivity of knowledge","The existence of experts","Epistemic individualism","Clifford\u0027s evidentialism"],"answer":2,"explain":"Epistemic individualism 把个人视为首要知识主体；分布式科学合作提出“是团队/社群知道结论吗”的开放问题。","hf":false},{"id":"soc-L5-q08","module":"soc","lecture":"L5","topic":"识别专家 / AI","q":"Why, according to the lecture, does generative AI make it harder to identify genuine experts?","options":["Because AI can be fluent and confident even when wrong, weakening the link between fluency and expertise","Because AI makes track records perfectly reliable","Because AI always refuses to answer technical questions","Because AI has abolished professional certification"],"answer":0,"explain":"过去人们把专业词汇、自信、流畅当作专家信号；AI 可以在完全错误时依然流畅自信。而且认证、记录、网上好评等指标本身又依赖证言。","hf":false},{"id":"soc-L7-q01","module":"soc","lecture":"L7","topic":"内源 vs 外源注意","q":"A fire alarm goes off and everyone in the lecture theatre turns towards the exits. This is an example of:","options":["Selection bias","Endogenous attention","Exogenous attention","Survivorship bias"],"answer":2,"explain":"外源注意由显著外部刺激捕获；内源注意由主体主动定向（如主动读题）。","hf":false},{"id":"soc-L7-q02","module":"soc","lecture":"L7","topic":"选择性注意","q":"Many viewers counting basketball passes fail to notice a person in a gorilla suit walking through the scene. The best explanation is that:","options":["The viewers have poor eyesight","Focal attention boosts task-relevant information while suppressing other information, even salient information","The viewers were deliberately lying","The gorilla was not actually visible"],"answer":1,"explain":"选择性注意系统性压制非目标信息；漏看并不说明视力差或粗心。眼睛看着 ≠ 信息被加工。","hf":false},{"id":"soc-L7-q03","module":"soc","lecture":"L7","topic":"幸存者偏差（Wald）","q":"Military analysts see bullet holes concentrated on the wings and fuselage of returning bombers, with few on the engines. What did Abraham Wald recommend?","options":["Add no armour, since the data are biased","Armour randomly selected areas","Armour the wings and fuselage, where most holes are","Armour the engines, because planes hit there likely did not return"],"answer":3,"explain":"返航飞机上的弹孔只代表“中弹后仍能返航”的部位；弹孔少的区域可能是一旦中弹就回不来——缺失的飞机才是关键信息。","hf":true},{"id":"soc-L7-q04","module":"soc","lecture":"L7","topic":"选择偏差的界定","q":"A pollster asks a perfectly random sample of voters: \u0027Would you still support Candidate X if you knew she had covered up a crime?\u0027 The result is distorted mainly by:","options":["Push polling: the wording of the question manipulates the answer","Survivorship bias","Selection bias","The friendship paradox"],"answer":0,"explain":"抽样本身随机，问题在于措辞诱导（push polling），属测量设计/诚意问题，不应与 selection bias 混淆。","hf":true},{"id":"soc-L7-q05","module":"soc","lecture":"L7","topic":"坏数据 vs 抽样偏差","q":"In surveys, heterosexual men report more lifetime opposite-sex partners on average than heterosexual women, although the averages should match. The professor\u0027s main explanation points to:","options":["Selection bias in who is sampled","Berkson\u0027s paradox","Over- and under-reporting by respondents (measurement error)","Survivorship bias"],"answer":2,"explain":"这里的问题是回答不准确（overreporting/underreporting），而不是谁被抽入样本。坏数据不等于抽样偏差。","hf":false},{"id":"soc-L7-q06","module":"soc","lecture":"L7","topic":"分析单位（班级规模）","q":"A school has 20 classes of 20 students and 4 classes of 200 students. What are the average class size and the average class size experienced by students?","options":["110 and 140","50 and 140","140 and 50","50 and 50"],"answer":1,"explain":"按班级：(20×20 + 4×200)/24 = 1200/24 = 50。按学生体验：(400×20 + 800×200)/1200 = 168000/1200 = 140。抽样单位不同，两数都为真但回答不同问题。","hf":false},{"id":"soc-L7-q07","module":"soc","lecture":"L7","topic":"友谊悖论","q":"Why do most people find that their friends have more friends than they do?","options":["Because highly connected people appear in many more people\u0027s friend lists, so sampling via friendships over-represents them","Because friendship is not symmetric","Because most people underestimate their own friendships","Because of survivorship bias in friendships"],"answer":0,"explain":"沿友谊边抽样时，高连接节点获得更多“抽样票”；加上右偏分布与 preferential attachment（rich get richer）。","hf":false},{"id":"soc-L7-q08","module":"soc","lecture":"L7","topic":"随机对照 / 选择偏差","q":"In the workplace wellness study discussed by Bergstrom and West, employees who voluntarily joined the programme were healthier than those who did not, but the randomised comparison showed no significant effect. The best explanation is:","options":["Survivorship bias among the control group","The randomised trial was invalid","Healthier employees were more likely to choose to participate","The programme made participants healthier"],"answer":2,"explain":"Causal reversal：观察性比较看似“项目→健康”，随机设计揭示更可能是“健康→参与”（自我选择）。","hf":false},{"id":"soc-L7-q09","module":"soc","lecture":"L7","topic":"Berkson 悖论","q":"Among Google engineers, performance in programming contests was negatively correlated with job performance. Bergstrom and West suggest this may be because:","options":["Contest winners are more likely to quit","Strong selection at hiring on combined abilities can create a negative correlation within the hired group","Contest skill harms job performance","Job performance was measured with push-polling"],"answer":1,"explain":"Berkson\u0027s paradox：对多项能力的综合门槛筛选，会在被选群体内制造总体中不存在的负相关。","hf":false},{"id":"soc-L7-q10","module":"soc","lecture":"L7","topic":"文件抽屉问题","q":"Researchers run many studies but publish only those that support their hypothesis. Even if each study used random sampling, the published literature suffers from:","options":["The friendship paradox","The file drawer problem","Exogenous attention","No bias, since sampling was random"],"answer":1,"explain":"File drawer problem：发表机制选择了哪些结果可见，公开证据库系统性偏向有利/显著结果。","hf":false},{"id":"soc-L9-q01","module":"soc","lecture":"L9","topic":"句法/语义/语用","q":"Asked about a job candidate\u0027s handwriting, a referee replies, \u0027He gives great lectures.\u0027 The inference that the handwriting is poor belongs to:","options":["Logic","Pragmatics","Syntax","Semantics"],"answer":1,"explain":"字面语义只是赞扬讲课；在合作预期下，听者把答非所问理解为“没有正面可说”，这是语用推断。","hf":true},{"id":"soc-L9-q02","module":"soc","lecture":"L9","topic":"言语行为","q":"Which utterance is most clearly a speech act in the lecture\u0027s sense?","options":["\u0027I promise to pick you up at six.\u0027","\u0027The professor\u0027s lectures are long.\u0027","\u0027It is raining outside.\u0027","\u0027Some swans are black.\u0027"],"answer":0,"explain":"承诺本身建立承诺与相应责任，是用话语完成社会行动；其他选项只是描述世界。注意 speech act 不等于 indirect speech——承诺可以完全直接。","hf":false},{"id":"soc-L9-q03","module":"soc","lecture":"L9","topic":"焦点 / 谢林点","q":"Students asked to pick, without discussion, the ANU course most others will pick tend to choose PHIL1005. This is because PHIL1005 is:","options":["Common ground established by explicit assertion","Objectively the best course","A focal point: everyone expects everyone else to find it salient","A speech act"],"answer":2,"explain":"Focal point 不必是最好或最公平的，而是大家预计别人也会注意到的突出选项——所有人此刻都在这门课且知道别人也在。","hf":false},{"id":"soc-L9-q04","module":"soc","lecture":"L9","topic":"共同知识","q":"In \u0027The Emperor\u0027s New Clothes\u0027, when the boy shouts that the emperor is naked, what mainly changes?","options":["The emperor becomes naked","The fact leaves the common ground","The onlookers see for the first time that the emperor is naked","The fact becomes common knowledge: everyone now knows that everyone knows"],"answer":3,"explain":"旁观者早已看见；改变的是高阶知识结构（递归的互相知道），使挑战皇帝成为可协调的共同行动——直接语言制造 common knowledge。","hf":true},{"id":"soc-L9-q05","module":"soc","lecture":"L9","topic":"可否认性","q":"A driver hints at a bribe to a police officer. Why might plausible deniability remain even if an honest officer fully understands the hint?","options":["Because understanding the intention is not the same as having sufficient evidence to act, and an innocent interpretation remains available","Because the honest officer cannot understand indirect speech","Because bribery is legal when indirect","Because hints are secret codes outsiders cannot decode"],"answer":0,"explain":"可否认性来自举证门槛、行动成本和仍存在的无辜解释，不必来自听者困惑（d_c \u003c d \u003c d_h）。秘密代码（如 Friend of Dorothy）才依赖局外人不懂。","hf":true},{"id":"soc-L9-q06","module":"soc","lecture":"L9","topic":"理解 vs 共同基础","q":"After an indirect invitation is turned down, both people are fairly sure what was meant. Why can they still carry on as if nothing happened?","options":["Because indirect speech always fails","Because both parties have common knowledge of the proposal","Because mutual understanding of p is not the same as p being publicly placed in the common ground","Because the proposition was never understood by either party"],"answer":2,"explain":"全讲最重要的区分：双方都确信说话者意指 p ≠ p 已被明确加入 common ground。这只是 shared knowledge，不是 common knowledge（Harry \u0026 Sally）。","hf":true},{"id":"soc-L9-q07","module":"soc","lecture":"L9","topic":"间接言语三功能","q":"\u0027Would you like to come up and watch a movie?\u0027 used as a veiled romantic proposal mainly serves which function of indirect speech?","options":["Performing a marriage","Relationship management: if declined, the existing friendship can be preserved","Plausible deniability against legal punishment","Creating common knowledge of the proposal"],"answer":1,"explain":"委婉邀请：对方有兴趣时协调到同一结果；无兴趣时可以真的只看电影、维持原关系，降低失败成本。","hf":false},{"id":"soc-L9-q08","module":"soc","lecture":"L9","topic":"战略模糊 / 反语","q":"Mark Antony repeatedly calls Brutus \u0027an honourable man\u0027 while listing Caesar\u0027s kindnesses. Audiences conclude Antony is condemning Brutus because:","options":["The literal content of the sentence condemns Brutus","Common knowledge prevents any other interpretation","Repetition against mounting contrary evidence turns literal praise into an ironic signal","Antony explicitly asserts that Brutus is dishonourable"],"answer":2,"explain":"字面赞美 + 与证据的持续冲突 + 策略性重复 → 语用谴责。Antony 从未直接断言，保留了表面解释。","hf":false},{"id":"soc-L9-q09","module":"soc","lecture":"L9","topic":"常规化","q":"When might an indirect expression lose its deniability?","options":["When it becomes conventionalised into a fixed idiom with only one recognised meaning","When the hearer is uncertain what it means","When it is literally true","When multiple audiences hear it"],"answer":0,"explain":"暗示过度常规化就变成固定习语，功能上近似直接表达，失去可否认空间。","hf":false},{"id":"soc-L11-q01","module":"soc","lecture":"L11","topic":"重描述谬误","q":"\u0027An LLM is just doing next-token prediction with linear algebra, so it cannot think.\u0027 According to the lecture (citing Millière and Buckner), this reasoning:","options":["Commits the Gettier fallacy","Commits the redescription fallacy: a low-level mechanistic description does not by itself rule out a high-level capacity","Is a sound proof that LLMs do not think","Is an instance of survivorship bias"],"answer":1,"explain":"像“爱只是化学反应所以不真实”（Rick and Morty）一样，需要额外论证说明该机制为何不能承载认知。但指出谬误并不证明 LLM 会思考。","hf":true},{"id":"soc-L11-q02","module":"soc","lecture":"L11","topic":"教授的立场","q":"Which best describes the professor\u0027s stance on whether LLMs think?","options":["A settled technical fact that LLMs think like humans","Complete agnosticism with no reasons offered","A proof that LLMs cannot think because they are statistical","A tentative preference for the bibliotechnic hypothesis: LLMs as sophisticated information retrieval rather than genuine cognition"],"answer":3,"explain":"教授倾向 bibliotechnic hypothesis，但称其为 tentative answer，并以幻觉、熟悉形式依赖、二十问分支作为证据；同时警告重描述谬误。","hf":true},{"id":"soc-L11-q03","module":"soc","lecture":"L11","topic":"幻觉","q":"The professor\u0027s \u0027highest public toilet in Asia\u0027 example is used to illustrate:","options":["That LLMs have no training data about mountains","That LLMs learn new facts after every chat","That conditional probability is always low for rare events","That high textual plausibility does not guarantee truth"],"answer":3,"explain":"Hallucination：文字上合理、像答案，但缺乏事实支持；关键区分 textual plausibility vs truth。","hf":false},{"id":"soc-L11-q04","module":"soc","lecture":"L11","topic":"二十问论证","q":"In the twenty-questions example (Shanahan et al.), resampling the model from the same point leads it to different objects. The professor takes this to suggest that:","options":["The model produces answers consistent with the dialogue so far rather than holding a fixed target","The model is lying deliberately","The model has a fixed object in mind from the start","The game is too hard for humans"],"answer":0,"explain":"对话连贯 ≠ 一开始就有固定对象。人类先把“杯子”写在纸上再答；模型可能是沿已有回答找仍说得通的对象。这是支持性论据，不是演绎证明。","hf":false},{"id":"soc-L11-q05","module":"soc","lecture":"L11","topic":"Markov 生成器的局限","q":"Why can\u0027t we simply build a better text generator by making a Markov generator\u0027s context window much longer?","options":["Because Markov generators cannot use conditional probability","Because the table grows exponentially (about n^(k+1) entries) and most long word sequences never appear in training data","Because longer windows reduce grammatical accuracy","Because longer windows remove long-range dependencies"],"answer":1,"explain":"窗口每增加一个词，表放大约 n 倍（100 词表：order 1 → 10,000 条，order 2 → 1,000,000 条），且数据稀疏无法填满；神经网络用参数压缩并泛化来应对。","hf":false},{"id":"soc-L11-q06","module":"soc","lecture":"L11","topic":"思考 vs 证言","q":"Which statement best reflects the lecture\u0027s closing point about LLMs and testimony?","options":["Testimony requires that the source be conscious","LLM outputs are always reliable testimony","If LLMs do not think, nothing can be learned from them","Whether LLMs think and whether we can gain knowledge from their outputs are distinct questions; even a non-thinking system may transmit information if its claims can be traced and checked"],"answer":3,"explain":"书本不必思考也能传递知识；关键在于来源能否追溯、重组是否改变原意、结论能否检验。这连接 L5 的证言与专家依赖。","hf":false}],"calc":[],"essay":[{"id":"soc-L1-e01","module":"soc","lecture":"L1","prompt":"Explain the justified true belief (JTB) analysis of knowledge and how a Gettier case challenges it. What exactly does the Gettier case show, and what does it not show?","points":["准确陈述 JTB：X knows P iff P is true, X believes P, X is justified in believing P；三条各自必要、合起来充分","用 Verna–Colin 案例：J、T、B 都满足，但信念仅凭运气为真（证据指向替身，使其为真的是真 Colin 恰好在悉尼）","结论：JTB is not sufficient for knowledge——攻击的是充分性主张","指出它没有证明的：不证明我们一无所知，不证明 truth/belief/justification 不必要；只表明还缺一个排除幸运的条件","可点出分析哲学方法：提出定义 → 用反例测试 → 修改"],"model":"On the traditional analysis, X knows that P if and only if P is true, X believes that P, and X is justified in believing that P; these conditions are claimed to be individually necessary and jointly sufficient. A Gettier case challenges the sufficiency claim. Verna, in normal lighting, clearly sees a man who looks exactly like Colin on a Sydney street and so believes that Colin is in Sydney. The man is a stranger, but Colin happens to be elsewhere in Sydney. Verna\u0027s belief is true, she holds it, and her visual evidence would normally be good, yet intuitively she does not know, because what makes her belief true is not what her evidence tracks: she reached the right answer by luck. The case therefore shows that justified true belief is not sufficient for knowledge. It does not show that we know nothing, nor that truth, belief or justification are unnecessary; it shows only that JTB lacks a further condition that rules out lucky success."},{"id":"soc-L3-e01","module":"soc","lecture":"L3","prompt":"Clifford claims that \u0027it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence.\u0027 Explain his argument and assess whether William James provides a successful reply.","points":["Clifford 的论证：P1 有义务避免伤害他人；P2 证据不足的信念总会伤害他人；C 因此总是错误；用船主案例说明真诚与好结果都不能免责","Clifford 对“只有行动有害”的回应：信念导致行动、影响行为、不私人、形成坏习惯（Pizzagate）","James：限于 live、forced、momentous 选项；self-fulfilling beliefs（裂缝、关系、完成大学）作为反例；believe truth vs shun error","可提 James 的 reductio：Clifford 原则本身不建立在充分证据上","评价：James 成功表明绝对原则过严，但没有回应 P1（伤害他人的义务）——两人各说各话；风险转移给他人时（反疫苗）Clifford 仍有力"],"model":"Clifford argues that we have a duty to avoid harming others and that believing on insufficient evidence always harms others, so it is always wrong to do so. His shipowner sincerely believes his old ship is safe after suppressing his doubts; Clifford holds him guilty because he had no right to believe on that evidence, and would still be guilty had the ship arrived safely. Against the objection that only actions harm, Clifford replies that beliefs cause actions, are communicated to others and build careless habits that damage collective inquiry. James replies that for live, forced and momentous options, believing ahead of the evidence can be legitimate, and some beliefs are self-fulfilling: confidence helps the climber leap the chasm. He also stresses that seeking truth and avoiding error are distinct goals, so an extreme threshold may cost us truths. James thus shows that Clifford\u0027s absolute rule is too strict, but he mainly discusses personal risks and never really answers Clifford\u0027s first premise. Where my epistemic risk is transferred to others, as with anti-vaccine beliefs, Clifford\u0027s concern remains compelling."},{"id":"soc-L5-e01","module":"soc","lecture":"L5","prompt":"Can a person be justified in believing something on the basis of expert testimony alone, without possessing the relevant evidence? Discuss with reference to Hardwig and the ideal of intellectual autonomy.","points":["说明启蒙的 intellectual autonomy 理想：用自己的理性与证据，反对盲从权威","Hardwig 的 epistemic dependence：A 是专家且相信 P，B 承认 A 为相关专家 → B 可被辩护；testimony 传递 justification 但不传递底层 evidence（病理学家→医生→病人）","理由：我们相信的远超能亲自调查的；彻底自主会使信念更贫乏（calculus 例）；理性有时要求 deference","限制：rational deference ≠ blind obedience；证言链必须终止于真实证据；多人重复 ≠ 证据","剩余难题：如何识别真专家（认证、记录、制度本身依赖证言；AI 流畅性），集体知识"],"model":"The Enlightenment ideal of intellectual autonomy asks us to rely on our own reason and evidence rather than on authority. Hardwig argues that this ideal, applied across every domain, is self-defeating. We believe far more than we could ever investigate, and experts have training, tools and judgement that we lack. If A is an expert about P, believes P, and B reasonably recognises A as the relevant expert, then B can be justified in believing P without possessing A\u0027s evidence. A patient may justifiably believe a lump is benign although the slides were examined by a pathologist and reported by a doctor: justification travels along the testimonial chain even though the underlying evidence does not. This is rational deference, not blind obedience, because it rests on competence and the chain must ultimately terminate in genuine evidence; if the pathologist invented the result, the whole chain collapses. So testimony can justify, but the hard question remains how non-experts identify genuine experts, since certification and track records themselves depend on further testimony."},{"id":"soc-L7-e01","module":"soc","lecture":"L7","prompt":"Explain what selection bias is and why a perfectly valid inference can still lead to a false conclusion when the data are selected badly. Illustrate with survivorship bias.","points":["定义：进入样本的机制与所研究的特征/结果系统性相关，样本系统性偏离总体","主线：前提不会自己出现；注意与抽样在推理开始前就决定什么成为证据；好逻辑救不了坏选择的前提","幸存者偏差：只看通过筛选的案例；Wald 轰炸机——应加固弹孔少的部位","区分：样本大不能修复系统性偏差；坏测量、push polling、file drawer 是不同问题","可加：随机化（wellness RCT）是削弱选择偏差的主要工具"],"model":"Selection bias occurs when the process that determines which cases enter a sample is systematically related to the characteristic being studied, so the sample no longer represents the population. This matters because premises do not appear on their own: before any reasoning begins, attention and sampling have already decided which information becomes evidence. A valid inference only guarantees that true premises yield a true conclusion, so if the premises are a distorted subset of reality, perfect logic will produce a confidently wrong conclusion. Survivorship bias is a clear case. Analysts studying returning bombers saw bullet holes clustered on the wings and fuselage and proposed armouring there. Abraham Wald pointed out that the sample contained only planes that survived; areas with few holes, such as the engines, were probably where hits were fatal, so those areas needed armour. The missing cases were the crucial evidence. Notably, a larger sample of returning planes would not fix this, because the bias is systematic rather than random; only attending to the selection mechanism, or randomising, can."},{"id":"soc-L9-e01","module":"soc","lecture":"L9","prompt":"Why do people use indirect speech even when the hearer is likely to understand exactly what is meant? Explain using the distinction between shared understanding and common ground.","points":["区分 semantics 与 pragmatics：间接言语利用语用推断传达 p 却不断言 p","关键区分：双方都理解 p ≠ p 进入 common ground / common knowledge（皇帝的新衣、Harry \u0026 Sally）","Plausible deniability：贿赂警察，identification problem；理解 ≠ 足以惩罚的证据（d_c \u003c d \u003c d_h）","Relationship management：委婉邀请被拒后维持友谊","Strategic ambiguity：多重受众（Mark Antony）；代价：误解、常规化后失去可否认性"],"model":"Indirect speech conveys a proposition p through pragmatic inference without explicitly asserting it. Its value does not depend on the hearer failing to understand. The crucial point is that mutual understanding of p is not the same as p being placed in the common ground. An explicit statement creates common knowledge: everyone knows that everyone knows, as when the boy declares that the emperor is naked. A hint leaves p as shared but unacknowledged knowledge. This yields three benefits. First, plausible deniability: a driver hinting at a bribe may be accepted by a corrupt officer, while an honest officer, though understanding, lacks enough evidence to punish because an innocent reading remains. Second, relationship management: if a veiled invitation to watch a movie is declined, both can preserve the friendship as if nothing happened. Third, strategic ambiguity lets different audiences read different messages, as with Mark Antony\u0027s ironic praise of Brutus. Indirectness has costs, however: hints can be misunderstood, and once conventionalised they lose their deniability."},{"id":"soc-L11-e01","module":"soc","lecture":"L11","prompt":"Do large language models think? Assess the professor\u0027s case for the bibliotechnic hypothesis and explain whether it matters for treating LLM outputs as a source of knowledge.","points":["机制：next-token prediction，Pr(next token | context)，神经网络压缩并泛化文本模式","警告 redescription fallacy：“只是统计”不足以推出不能思考（Rick and Morty 爱情例）","教授的证据：幻觉（textual plausibility ≠ truth）、熟悉形式依赖（9/5x+32 vs 7/4x+30）、二十问分支（连贯 ≠ 固定目标）","立场是 tentative，证据是解释性/经验性的，非演绎证明","思考与证言是不同问题：不思考的系统（如书本）也可能传递知识，但需可追溯来源与可检验；联系 Hardwig 与 AI 流畅性问题"],"model":"LLMs generate text by repeatedly estimating the probability of the next token given the preceding context, using neural networks that compress and generalise patterns in human writing. The professor tentatively favours the bibliotechnic hypothesis: these systems are sophisticated information retrieval rather than genuine thinkers. He warns, however, against the redescription fallacy: saying the system is \u0027just statistics\u0027 no more shows that it cannot think than saying love is \u0027just chemistry\u0027 shows that love is unreal. His case therefore rests on behaviour. Hallucinations, such as a confident answer about the highest public toilet in Asia, fit a system pursuing textual plausibility rather than truth; weaker performance on unfamiliar equation forms suggests fragile generalisation; and resampled twenty-questions games reaching different objects suggest consistency without a fixed target. This is a reasonable but not conclusive case. Importantly, whether LLMs think is distinct from whether we can learn from them: books do not think, yet transmit knowledge. What matters is whether an output\u0027s claims can be traced to sources and checked, especially since fluency no longer signals expertise."}]},
{"cards":[{"id":"soc-L13-epistemic-injustice","module":"soc","lecture":"L13","term":"Epistemic Injustice","zh":"认识不正义","def":"A wrong done to someone specifically in their capacity as a knower, e.g. when prejudice leads others to give their testimony too little credibility or leaves them without shared concepts to make sense of their experience.","defZh":"一个人作为知识主体（提供知识、理解并表达经历的人）所受到的不公对待。Fricker 把它分为证言不正义和诠释不正义两类。","example":"McKinnon（2016）综述：同一说法出自白人男性比出自黑人女性更容易被相信，即使两人同样可信。","pitfall":"不是“任何不被相信”都算；关键是偏见/结构性不公导致的对知识主体的伤害。","hf":true},{"id":"soc-L13-credibility-excess","module":"soc","lecture":"L13","term":"Credibility economy and credibility excess","zh":"可信度过高","def":"Credibility economy (Fricker): credibility is distributed unevenly across speakers, so some social groups systematically get more and others less than they deserve. Credibility excess: giving a speaker more credibility than they deserve; Medina argues that one party\u0027s excess can help produce another\u0027s deficit, because credibility is comparative and interactive.","defZh":"给某说话者的信任高于其应得程度。Fricker 只讨论可信度不足；Medina 批评说，一方的过高可信度会造成另一方的不足。","example":"《杀死一只知更鸟》：白人女孩 Mayella 享有过高可信度，这部分造成了黑人 Tom Robinson 的可信度不足。","pitfall":"Medina 的要点：可信度不是可以独立分配的“好处”，而是互相比较的。","hf":false},{"id":"soc-L13-willful-hermeneutical-ignorance","module":"soc","lecture":"L13","term":"Willful Hermeneutical Ignorance","zh":"蓄意的诠释无知（Pohlhaus）","def":"When dominantly situated knowers refuse to acknowledge epistemic tools (concepts) developed from the experiences of marginalised groups, which lets them misunderstand or ignore whole areas of the social world.","defZh":"边缘群体已经有了概念，但优势群体拒绝承认/接纳这个概念，从而继续忽视相关现实。","example":"许多人主动否认“强奸文化（rape culture）”这一概念的存在，于是看不到它如何运作。","pitfall":"与诠释不正义的区别：不是“概念缺失”，而是“概念已存在却被拒绝”。说明 Fricker“命名即克服”的看法不完整。","hf":false},{"id":"soc-L13-testimonial-quieting","module":"soc","lecture":"L13","term":"Testimonial quieting vs testimonial smothering (Dotson)","zh":"证言被消音（Dotson）","def":"Testimonial quieting: an audience, owing to identity prejudice, fails to recognise a speaker as a knower at all, so her testimony is ignored as if she had not spoken. Testimonial smothering: a speaker withholds or truncates her own testimony because she anticipates the audience will not give it proper uptake.","defZh":"听众因身份偏见根本不把说话者当作知识来源，连可信度判断都不做，直接无视。","example":"陪审团因深层种族刻板印象，把 Tom Robinson 的证言当作毫无价值，好像他从未作证。","pitfall":"比可信度不足更严重：可信度不足至少还“判断”了一下，消音则完全不判断。","hf":false},{"id":"soc-L14-testimonial-injustice","module":"soc","lecture":"L14","term":"Testimonial Injustice","zh":"证言不正义","def":"Testimonial injustice occurs when a speaker receives a credibility deficit owing to identity prejudice on the hearer\u0027s part, so that she is wronged in her capacity as a giver of knowledge.","defZh":"听者因对说话者身份（性别、种族等）的偏见，给予其低于应得的可信度，从而伤害了她作为知识提供者的地位。","example":"《天才雷普利》中 Marge 有戒指等证据，却被说成“女人的直觉”；《杀死一只知更鸟》中 Tom Robinson 因种族偏见不被相信。","pitfall":"两个要素缺一不可：(1) 可信度不足；(2) 原因是身份偏见。仅仅“真话没被相信”不够。","hf":true},{"id":"soc-L14-hermeneutical-injustice","module":"soc","lecture":"L14","term":"Hermeneutical Injustice","zh":"诠释不正义","def":"The injustice of having some significant area of one\u0027s social experience obscured from collective understanding owing to structural identity prejudice in the collective hermeneutical resource.","defZh":"由于共同的诠释资源（概念、词语）中存在结构性身份偏见/缺口，某些人重要的社会经历无法被大家（包括自己）理解和表达。","example":"“性骚扰（sexual harassment）”一词出现之前，职场中的不当行为只能被称为“无害的调情”（课堂用《广告狂人》片段）。","pitfall":"个人偶然不懂某个术语不算；要求缺口与群体被边缘化的结构性偏见有关。通常不需要某个人的恶意。","hf":true},{"id":"soc-L14-credibility-deficit","module":"soc","lecture":"L14","term":"Credibility Deficit","zh":"可信度不足","def":"Receiving less credibility from a hearer than one\u0027s testimony actually deserves given one\u0027s evidence, sincerity and competence.","defZh":"听者给的信任低于说话者应得的程度。","example":"《切尔诺贝利》片段：技术员报告异常读数和屋顶上的石墨，上级坚持“反应堆不可能爆炸”而否定他。","pitfall":"可信度不足本身不等于证言不正义；还要问原因是否是身份偏见（切尔诺贝利主要体现权力差异，要严格认定还需检查身份偏见）。","hf":true},{"id":"soc-L14-identity-prejudice","module":"soc","lecture":"L14","term":"Identity prejudice and prejudicial identity stereotypes","zh":"身份偏见","def":"Identity prejudice: a prejudice against people as members of a social type (e.g. gender or race), typically based on a negative stereotype, that distorts the hearer\u0027s credibility judgement about them. Prejudicial identity stereotype: a widely held association between a social group and a negative attribute that is resistant to counter-evidence, typically because of an ethically bad affective investment.","defZh":"因对方属于某个社会身份群体，而带着负面刻板印象预先低估其可信度。","example":"两位工程师给出同一组数据，女工程师却因“女人不懂技术”被怀疑。","hf":true},{"id":"soc-L14-wronged-as-knower","module":"soc","lecture":"L14","term":"Wronged in One\u0027s Capacity as a Knower","zh":"作为知识主体受到伤害","def":"The distinctive harm of epistemic injustice: one is treated as less than a full giver of knowledge, which is both an epistemic harm (knowledge is lost) and a moral harm (the speaker is disrespected).","defZh":"不只是“这次判断错了”，而是因身份被贬低了理解事情、提供知识的能力；既有认识层面伤害（真相丢失），也有道德伤害（人被贬低）。","example":"技术员的警告被忽视：听者错过了真相，技术员也被当作“不值得听”的人。","pitfall":"与 Clifford 对照：Clifford 关心证据不足时就相信的错误；本讲关心本应相信时因偏见拒绝相信的错误。","hf":false},{"id":"soc-L14-sincerity-competence","module":"soc","lecture":"L14","term":"Sincerity vs Competence","zh":"真诚与能力","def":"Two separate dimensions of a speaker\u0027s trustworthiness: sincerity is whether they assert what they actually believe; competence is whether they are in a position to get the matter right.","defZh":"诚实＝是否真心说自己相信的话；能力＝是否有本事把这件事判断对。两者要分开评估。","example":"真心帮忙的朋友也可能把路指错：诚实但不熟悉这座城市。","pitfall":"因“能力不足”而合理地少信某人，不等于说他不诚实，也不一定是不正义。","hf":false},{"id":"soc-L14-reasonable-doubt","module":"soc","lecture":"L14","term":"Reasonable (Evidence-Responsive) Doubt","zh":"合理怀疑（对证据敏感的怀疑）","def":"Doubt about testimony that is based on relevant evidence available to the hearer at the time and that is revised when new relevant evidence arrives, as opposed to prejudiced disbelief that resists counter-evidence.","defZh":"有相关依据的怀疑，并且遇到新证据愿意更新；偏见性拒绝则因身份而无视支持对方的证据。","example":"《终结者》：Kyle Reese 说自己来自未来，警察以当时证据不信是合理的；观众知道结局不代表警察当时应相信。二手车卖家有利益动机可以多查，但独立检测出现后应重新评估。","pitfall":"判断怀疑是否合理要看听者当时可得的证据，不能用事后真相倒推；“说的是真话”不意味着听者当时就应该相信。","hf":true},{"id":"soc-L14-conceptual-engineering","module":"soc","lecture":"L14","term":"Collective hermeneutical resources and conceptual engineering","zh":"概念工程（合并与细分）","def":"Collective hermeneutical resources: the shared stock of concepts, words and interpretive frameworks a community uses to make sense of social experiences and communicate them. Conceptual engineering: assessing and revising these concepts; lumping categories together highlights a shared situation, while splitting them preserves important differences, and either change can affect how people understand themselves.","defZh":"检查和改进理解工具。合并突出共同处境，细分保留差异；增加、合并或取消概念都会影响当事人的自我理解。","example":"Asperger\u0027s 被并入更宽的 autism spectrum disorder 后，一些人失去了熟悉的自我描述标签；gay / lesbian 等身份词汇帮助人们找到共同经历。","pitfall":"概念出现不等于相关的人或经历才开始存在；有了词也不代表指控自动成立。","hf":false},{"id":"soc-L15-manufactured-doubt","module":"soc","lecture":"L15","term":"Manufactured doubt and the epistemic environment","zh":"制造怀疑／被制造的争议","def":"Manufactured doubt: a strategy of selectively amplifying a small amount of dissent or uncertainty so that the public overestimates how unsettled the evidence is, typically to delay belief change and action and preserve the status quo. Epistemic environment: the informational surroundings (news, advertising, research, testimony) through which we form beliefs; how information reaches us shapes what we believe.","defZh":"有选择地放大少数异议，让公众高估证据的不确定性，从而拖延判断和行动、维持现状。不需要证明相反结论，也不一定要说谎。","example":"《Merchants of Doubt》：烟草行业备忘录把公众“保持怀疑”当作对抗不利证据的办法；气候变化议题中资金决定哪些声音更显眼。","pitfall":"少数研究者可能是真诚的；问题在于外界如何挑选和放大这些结果。","hf":true},{"id":"soc-L15-selective-promotion","module":"soc","lecture":"L15","term":"Selective Promotion (Selective Doubt)","zh":"选择性推广／选择性制造怀疑","def":"Funding or publicising only the minority of studies that favour one\u0027s interests, so that the visible evidence looks more divided than the total body of evidence actually is.","defZh":"只资助/宣传少数有利于自己的研究，改变公众看到的证据比例。","example":"一百份试卷九十份答“否”，宣传者只把十份答“是”的贴到公告栏。","pitfall":"受资助不等于结论必假；利益关系是检查证据如何被挑选的理由，而不是自动推翻的证据。","hf":true},{"id":"soc-L15-false-balance","module":"soc","lecture":"L15","term":"False Balance","zh":"虚假平衡","def":"Presenting two sides of an issue as equally weighty (e.g. one speaker each) when the weight of evidence and expert opinion overwhelmingly supports one side.","defZh":"把双方当作势均力敌来呈现（如节目各请一位嘉宾），而实际证据分量严重偏向一方。","example":"29 人说下雨，1 人说没下；新闻只采访正反各一人，观众以为全班各执一词。","pitfall":"要看证据分量（weight of evidence）：研究数量、质量、能否重复，而不是数节目里各有几个发言人。","hf":true},{"id":"soc-L15-implicature","module":"soc","lecture":"L15","term":"Misleading Implicature","zh":"误导性的言外之意","def":"What a message suggests beyond its literal content; a message can be literally true yet lead people to an unsupported conclusion.","defZh":"字面上不说假话，却让人自然想到它并未证明的结论。","example":"塑料包装上的回收标识只写材料类别，却让消费者以为它很容易被回收。","hf":false},{"id":"soc-L15-credence","module":"soc","lecture":"L15","term":"Credence and the Principal Principle","zh":"信心程度／信念度","def":"Credence: a degree of belief in a proposition represented by a number from 0 to 1, where 0 means certainty that it is false and 1 certainty that it is true. Principal Principle: if you know the objective chance of an outcome and have no other relevant (inadmissible) information, your credence in that outcome should equal that chance.","defZh":"用 0 到 1 表示对一个命题有多大把握。与“全信/全不信”的二元信念（belief）相对。","example":"掷公平硬币前，对“正面”与“反面”各给 0.5；对“朋友已到车站”有 0.8 的信心。","pitfall":"0.5 不是“没想法”，而是精确的“一半信心”；互斥且穷尽的结果，信心之和应为 1。","hf":true},{"id":"soc-L15-action-under-uncertainty","module":"soc","lecture":"L15","term":"Decision under uncertainty and status quo bias","zh":"不确定下的决策","def":"Decision under uncertainty: choosing an action by weighing how likely outcomes are against how good or bad they would be (decision theory), without first needing certainty that a conclusion is true. Status quo bias of doubt: treating \u0027not yet certain\u0027 as a reason not to change, which favours current practice, so whoever benefits from delay gains from amplified doubt.","defZh":"行动依据结果的概率和后果的好坏（成本/收益），不必先确定结论百分之百为真。","example":"明天只有三成下雨机会，但带伞几乎没成本，仍可决定带伞。","pitfall":"“采取行动”与“断言结论必然为真”是两回事；有不确定性≠什么都不知道（科学会给出区间，如气候预测）。","hf":true},{"id":"soc-L17-informational-advertising","module":"soc","lecture":"L17","term":"Informational vs associative advertising","zh":"信息型广告","def":"Informational advertising: advertising that tells consumers facts about a product, such as its features, materials, price or where to buy it. Associative advertising: advertising that repeatedly pairs a product with a feeling, lifestyle or identity so that consumers come to associate them, without giving information about the product itself.","defZh":"直接介绍产品的材料、功能、购买方式等信息。","example":"旧犁广告列出材质和重量；放射性饮用水广告说明“写得具体”不保证“说得对”。","pitfall":"信息型广告的信息也可能不准确。","hf":false},{"id":"soc-L17-demand-engineering","module":"soc","lecture":"L17","term":"Demand Engineering","zh":"制造需求","def":"An advertising strategy (discussed by Tim Wu) that first makes a previously unnoticed condition seem like a problem and then presents the product as its solution.","defZh":"先“卖问题”再“卖答案”：让原本没被在意的状态显得需要解决，再推出产品。","example":"体味/口气广告：先说“别人可能闻得到”，再卖除臭剂、漱口水。","pitfall":"它常借助相互预期起作用：我不觉得是问题，但担心别人会这样评价我。","hf":true},{"id":"soc-L17-branding","module":"soc","lecture":"L17","term":"Branding vs targeting","zh":"品牌塑造","def":"Branding: attaching an image or trait to a whole company or brand, rather than a single product, so that consumers associate that trait with everything bearing the brand. Targeting: directing advertising at a particular audience based on their interests or identity, typically with the message that people like them want this product.","defZh":"给整家公司/品牌贴上一个印象标签，而不只是某件产品。","example":"卡车公司反复强调“耐用可靠”，买家见到车标就想到这两个词；香烟广告把“烘烤（toasted）”这个各家都有的工序讲成独特卖点（产品区分）。","pitfall":"品牌形象不是产品真实性能的证明；品牌也可成为身份信号（signalling），且依地区和历史而异（如 Subaru）。","hf":false},{"id":"soc-L17-shared-attention","module":"soc","lecture":"L17","term":"Shared Attention / Common Knowledge in Advertising","zh":"共同关注与共同知识（相互预期）","def":"When many people repeatedly see the same public message, each comes to expect that others have seen and may accept it; these mutual expectations can change behaviour even in people who privately doubt the message.","defZh":"大家都看到同一讯息时，每个人都以为别人也看见并可能接受了；即使自己不信，只要相信别人会用这个标准评价我，就会改变行为。","example":"一战募兵海报贴满街道，暗示“像我们这样的人都会出一份力”；宿舍人人刷到“出门要清新”的广告。","pitfall":"不要写成“所有人真的都相信”；关键是“我以为别人会怎么想”。","hf":true},{"id":"soc-L17-absolute-relative-norm","module":"soc","lecture":"L17","term":"Absolute vs Relative Norm","zh":"绝对标准与相对标准","def":"An absolute norm sets a threshold everyone should meet; a relative norm requires being better than others, so the target rises whenever others improve.","defZh":"绝对标准：人人都要达标（如没体味）。相对标准：要比别人强，别人升级你的目标也升高。","example":"从前有车就显得富裕；大家都有车后，更贵的车成为新标准。Galbraith：如果生产不断制造新欲望，就不能说扩大生产只是满足原有需要。","hf":false},{"id":"soc-L17-context-free-information","module":"soc","lecture":"L17","term":"Context-free Information (Postman)","zh":"脱离生活情境的信息","def":"Information that may be interesting to talk about but has little relevance to any decision or action available to the recipient.","defZh":"可以当谈资，却与你眼下能做的决定关系很小的信息。","example":"外地一场与你无关的事故 vs 本地电车停运（会改变今天路线）。","pitfall":"老师提醒：媒介本身不决定相关性——纸媒也会登无关信息，网络论坛也能提供有用的本地信息。“消息灵通的人”形象让持续看媒体本身成为需求。","hf":false},{"id":"soc-L19-attention-economy","module":"soc","lecture":"L19","term":"Attention economy and serial attention (Herbert Simon)","zh":"注意力经济（西蒙）","def":"Attention economy: in an information-rich world attention is the scarce resource, because information consumes the attention of its recipients (\u0027a wealth of information creates a poverty of attention\u0027), so it must be allocated efficiently. Serial attention: humans can attend to only one thing at a time, so multitasking is really fast switching with switching costs.","defZh":"信息丰富时，稀缺的是注意力，因为信息消耗的是接收者的注意力；因此要像分配稀缺资源一样高效分配注意力。信息成本主要由接收者承担，而不只是生产和传输成本。","example":"大学组织架构：如果所有人都直接给校长发邮件，她会被淹没，所以每层要汇总、过滤后再上传；ANU 的外国接触申报表若人人都填会压垮委员会。","pitfall":"Simon 原意：组织/个人内部分配注意力（多为内源性）。现代用法：注意力是被广告商购买的商品（多为外源性）。","hf":true},{"id":"soc-L19-epistemic-bubble","module":"soc","lecture":"L19","term":"Epistemic bubbles vs echo chambers (C. Thi Nguyen)","zh":"认识泡泡","def":"Epistemic bubble: an information network from which relevant voices have been excluded by omission, e.g. through filtering, without those voices being actively distrusted. Echo chamber: a social epistemic structure in which other relevant voices have been actively discredited, so members distrust outside sources in advance.","defZh":"相关的声音因“遗漏”而被排除（如过滤造成没看到），但并没有被主动贬低。","example":"左倾学者的 Facebook 推送全是工党、绿党内容，很少看到 One Nation 的新闻。","pitfall":"相对容易逃出：接触被遗漏的信息即可（如去买一份 Telegraph）。在某种意义上整个互联网体验都是泡泡，且过滤本身是必要的；问题在于漏掉了“相关”的声音。","hf":true},{"id":"soc-L19-pagerank","module":"soc","lecture":"L19","term":"PageRank","zh":"PageRank 算法","def":"Google\u0027s ranking algorithm, which ranks highly the web pages that many other pages link to, thereby using popularity as a proxy for informativeness without needing to understand the content.","defZh":"被越多网站链接的网页排名越高——用“流行度”作为“信息性/可靠性”的代理，不需要理解内容本身。","example":"谷歌不懂马，但在“马网站圈”中被大量链接的网站很可能是可靠的马网站。取代了早期 Yahoo 等人工分类目录。","pitfall":"这是一个不错的初步指标，但一旦人们知道规则，就会出现刻意操纵（gaming）的产业。","hf":true},{"id":"soc-L19-filtering","module":"soc","lecture":"L19","term":"Algorithmic filtering and recommendation feedback loops","zh":"算法过滤","def":"Algorithmic filtering: automatically selecting what a user sees from an overwhelming mass of content, typically on the assumption that you will like what people like you like; some filtering is necessary given limited attention. Recommendation feedback loop: because the most engaged users have the largest influence on recommendations, creators play to them and extreme content gets promoted, so the online environment actively shapes its users.","defZh":"从海量内容中替你挑选，核心假设是“你会喜欢和你相似的人喜欢的东西”。在注意力有限的情况下，过滤是必要的，不是因为懒。","example":"老师的 Bluesky 网络图：不过滤会看到德语帖子和色情内容；Instagram 把老师归入“中年、爱运动、有闲钱”而推送健身、户外装备广告。","pitfall":"“像你的人”存在循环性：算法自造类别，甚至用代理变量重建出近似种族的类别。过滤不坏，但会制造认识泡泡。","hf":false},{"id":"soc-L19-social-epistemic-reboot","module":"soc","lecture":"L19","term":"Social Epistemic Reboot vs Neurath\u0027s Boat","zh":"社会认识重启 vs 纽拉特之船","def":"Nguyen suggests escaping echo chambers by a Descartes-style reboot of all one\u0027s beliefs about which sources are trustworthy; the lecturer argues this fails because of limited attention, and instead endorses Neurath\u0027s boat: gradually replacing the least seaworthy beliefs while relying on the rest.","defZh":"Nguyen 提议像笛卡尔那样，抛掉对“谁可信”的全部信念重新建立。老师认为不可行：注意力有限，从零开始会被淹没，而且起点选错（如进了 Natural News）后面全坏。替代方案是纽拉特之船：在海上逐块替换最不牢靠的木板，用其余部分支撑。","example":"我们用过滤器“不是因为方便或懒，而是因为不得不用”。","pitfall":"老师的担忧：渐进修补可能只是强化原有信念，但这是唯一可行的程序。","hf":false}],"mcq":[{"id":"soc-L13-q01","module":"soc","lecture":"L13","topic":"Lackey 的证言条件","q":"According to McKinnon\u0027s summary of Jennifer Lackey\u0027s \u0027dualism\u0027, which of the following is NOT one of the conditions for a hearer to gain knowledge from a speaker\u0027s testimony?","options":["What the speaker asserts is true.","The speaker\u0027s testimony is reliable, so that when she asserts p, p is likely true.","The hearer has some reason to think the speaker is reliable.","The hearer independently verifies the claim through her own perception."],"answer":3,"explain":"Lackey 的三个条件：内容为真、说话者可靠、听者有理由认为说话者可靠。如果听者必须亲自验证，那就不是“从证言获得知识”了，所以 D 不是条件。","hf":false},{"id":"soc-L13-q02","module":"soc","lecture":"L13","topic":"Marge 案例","q":"In The Talented Mr. Ripley, Marge\u0027s claim that Tom killed Dickie is dismissed with the remark that there is \u0027female intuition, and then there are facts\u0027. Why is this a paradigm case of testimonial injustice?","options":["Because Marge\u0027s claim turned out to be false.","Because Marge had no evidence at all for her claim.","Because her evidence-backed claim was given less credibility owing to a gender stereotype that women are emotional rather than rational.","Because Marge refused to tell anyone what she knew."],"answer":2,"explain":"Marge 有证据（Tom 戴着 Dickie 承诺永不摘下的戒指），说的也是真的，但大家因“女人情绪化、靠直觉”的身份偏见低估她。A、B 与事实相反；D 描述的是自我压抑，不是此案。","hf":true},{"id":"soc-L13-q03","module":"soc","lecture":"L13","topic":"Medina 对 Fricker 的批评","q":"What is José Medina\u0027s main criticism of Fricker\u0027s account of testimonial injustice?","options":["Credibility deficits are never really unjust.","Credibility excess for one party can help produce a credibility deficit for another, because credibility is comparative and interactive.","Hermeneutical injustice is not a genuine kind of injustice.","Testimonial injustice requires that the hearer intends to harm the speaker."],"answer":1,"explain":"Fricker 只关注可信度不足；Medina 指出 Mayella 享有的过高可信度部分造成了 Tom Robinson 的不足，可信度是相互比较的、互动的，不能只当成独立分配的好处。","hf":false},{"id":"soc-L13-q04","module":"soc","lecture":"L13","topic":"证言自我压抑","q":"A woman knows that her colleagues are hostile to reports of harassment, so she decides not to tell them about her own experience. Which concept from Dotson best fits this case?","options":["Testimonial quieting","Testimonial smothering","Credibility excess","Willful hermeneutical ignorance"],"answer":1,"explain":"说话者因预料听众不会恰当接纳（敌意、嘲笑）而自己压下证言，这是 testimonial smothering。Quieting 是听众根本不把她当知识来源；她这里根本没说。","hf":false},{"id":"soc-L13-q05","module":"soc","lecture":"L13","topic":"证言被消音","q":"Because of deep racist stereotypes, a jury treats a Black defendant\u0027s testimony as worthless, as if he had not testified at all. Dotson calls this:","options":["credibility excess","testimonial smothering","testimonial quieting","hermeneutical marginalisation"],"answer":2,"explain":"Testimonial quieting：听众因身份偏见不把说话者视为知识主体，连可信度判断都不做。这比单纯的可信度不足更严重。Smothering 是说话者自己不说。","hf":false},{"id":"soc-L13-q06","module":"soc","lecture":"L13","topic":"蓄意的诠释无知","q":"A marginalised group has already developed and named a concept (e.g. \u0027rape culture\u0027) that captures their experience, but many members of the dominant group actively deny that the concept picks out anything real. This is best described as:","options":["willful hermeneutical ignorance","hermeneutical injustice in Fricker\u0027s original sense, which ends once the concept exists","testimonial smothering","reasonable, evidence-responsive doubt"],"answer":0,"explain":"Pohlhaus 的 willful hermeneutical ignorance：概念已存在，优势群体却拒绝承认。Fricker 原本认为概念一旦出现并传播开，诠释不正义就被克服——B 正是这种看法的局限。","hf":false},{"id":"soc-L13-q07","module":"soc","lecture":"L13","topic":"情绪的恶性循环","q":"McKinnon describes a \u0027vicious cycle\u0027 of testimonial injustice in Marge\u0027s case. What is it?","options":["The more evidence Marge finds, the less evidence she needs.","Marge\u0027s anger at being disbelieved is taken as further evidence that she is emotional, which justifies discounting her even more.","Marge gives Tom a credibility excess, which leads to her own deficit.","Marge stops speaking, so nobody can know what she knows."],"answer":1,"explain":"被不公正地不相信使人愤怒；这种愤怒又被当作“她情绪化、不理性”的证据，进一步降低她的可信度，形成循环。","hf":false},{"id":"soc-L14-q01","module":"soc","lecture":"L14","topic":"辨别两种认识不正义","q":"Before the term \u0027sexual harassment\u0027 existed, women struggled to make sense of, and communicate, repeated unwanted workplace behaviour, which was routinely described as \u0027harmless flirting\u0027. Which concept best fits this situation?","options":["Testimonial injustice","Credibility excess","Hermeneutical injustice","Reasonable doubt"],"answer":2,"explain":"问题在于共同的诠释资源有缺口，使女性重要的社会经历无法进入集体理解，这是 Fricker 关于诠释不正义的核心例子。证言不正义是说出来后因身份偏见不被相信。","hf":true},{"id":"soc-L14-q02","module":"soc","lecture":"L14","topic":"辨别两种认识不正义","q":"A female engineer presents clear test data showing a design flaw, but her manager dismisses it because \u0027women don\u0027t really understand engineering\u0027. What is this?","options":["Testimonial injustice: a credibility deficit caused by identity prejudice.","Hermeneutical injustice: she lacks the concepts to describe the flaw.","Reasonable doubt: the manager is responding to the evidence available.","Testimonial smothering: she chose not to speak."],"answer":0,"explain":"她已经说清楚并有证据，被低估的原因是性别刻板印象——典型证言不正义。B 不对，她不缺概念；C 不对，经理无视了证据；D 不对，她说了。","hf":true},{"id":"soc-L14-q03","module":"soc","lecture":"L14","topic":"合理怀疑 vs 不正义","q":"A report later turns out to be true, but a listener initially doubted it on the basis of reasonable evidence available at the time. What follows according to the lecture?","options":["The report\u0027s truth proves the listener committed testimonial injustice.","Any doubt that frustrates the speaker is unjust.","Respecting the speaker required accepting the report without checking.","The initial doubt need not be testimonial injustice; what matters is the grounds of the doubt and whether it responds to evidence."],"answer":3,"explain":"判断怀疑是否合理要看听者当时可得的证据以及是否源自身份偏见，不能用事后真相倒推（《终结者》的例子）。","hf":true},{"id":"soc-L14-q04","module":"soc","lecture":"L14","topic":"带偏见的刻板印象","q":"Which of the following is NOT one of the features of a prejudicial identity stereotype discussed in the lecture?","options":["It associates a social group with a negative attribute.","It is resistant to counter-evidence.","It is grounded in accurate statistics about the group.","It involves an ethically bad affective investment."],"answer":2,"explain":"三要素：负面关联、抵抗反证、不当的情感投入。“基于准确统计”不是其特征，偏见恰恰是对证据不敏感。","hf":true},{"id":"soc-L14-q05","module":"soc","lecture":"L14","topic":"真诚与能力","q":"A friend honestly gives you directions in a city he barely knows, and the directions are wrong. Using the lecture\u0027s distinction, how should we assess him?","options":["He was insincere, since his directions were wrong.","He was sincere but lacked competence on this matter.","He was competent, since he believed what he said.","Sincerity and competence are the same thing, so he lacked both."],"answer":1,"explain":"真诚＝说自己真心相信的话；能力＝有能力把事情判断对。两者独立：可以诚实但不胜任。","hf":false},{"id":"soc-L14-q06","module":"soc","lecture":"L14","topic":"终结者案例","q":"In The Terminator, Kyle Reese tells the police he is from the future and a robot is hunting Sarah Connor. The audience knows he is telling the truth. Why can the police\u0027s disbelief still be reasonable?","options":["Because reasonableness depends on the evidence available to the police at the time, not on what the audience later knows.","Because people who seem strange are never credible.","Because true testimony never deserves belief.","Because Kyle Reese was insincere."],"answer":0,"explain":"怀疑是否合理要相对于听者当时的证据。B 是错误推论（笔记特别提醒不能推出外表奇怪的人不可信）；D 与剧情不符——他是真诚的。","hf":false},{"id":"soc-L14-q07","module":"soc","lecture":"L14","topic":"可信度不足≠证言不正义","q":"In the Chernobyl clip, a technician\u0027s report of graphite on the roof is dismissed by his superiors, who insist the reactor cannot have exploded. Before calling this testimonial injustice in Fricker\u0027s strict sense, what further condition must be checked?","options":["Whether the technician\u0027s report was eventually confirmed.","Whether the superiors were more senior than the technician.","Whether the technician felt upset.","Whether the credibility deficit was caused by identity prejudice."],"answer":3,"explain":"该片段明显有可信度不足和权力差异，但严格的证言不正义还要求原因是身份偏见。A 事后为真不够；B 仅是权力差异；C 当事人难过不是标准。","hf":true},{"id":"soc-L14-q08","module":"soc","lecture":"L14","topic":"诠释不正义的边界","q":"A student cannot describe a chemical reaction because she has not yet learned the technical term. Why is this NOT, by itself, hermeneutical injustice?","options":["Because hermeneutical injustice only concerns legal testimony.","Because the gap is not due to structural identity prejudice that obscures a marginalised group\u0027s significant social experience.","Because she is lying about not knowing the term.","Because hermeneutical injustice requires a credibility excess."],"answer":1,"explain":"个人的知识不足不是诠释不正义；必须是与社会边缘化相关的结构性身份偏见造成共同理解中的缺口。","hf":false},{"id":"soc-L14-q09","module":"soc","lecture":"L14","topic":"作为知识主体受害","q":"What does it mean to say that testimonial injustice wrongs someone \u0027in their capacity as a knower\u0027?","options":["The person is harmed only because a false belief is formed.","The person is wronged only if they lose money or property.","The person is unfairly treated as less than a full giver of knowledge, which is both an epistemic and a moral harm.","The person has made a logical error in their reasoning."],"answer":2,"explain":"伤害不只是“丢失了一条信息”，还在于说话者被贬低为不值得听的人：既是认识伤害，也是道德伤害。","hf":false},{"id":"soc-L14-q10","module":"soc","lecture":"L14","topic":"必要 vs 充分条件","q":"In the lecture\u0027s strict Fricker-style framework, a negative identity stereotype held by the hearer is best described as which kind of condition for testimonial injustice?","options":["Sufficient but not necessary","Necessary but not sufficient","Neither necessary nor sufficient","Both necessary and sufficient"],"answer":1,"explain":"没有身份偏见就不是 Fricker 式证言不正义（必要）；但仅有偏见还不够，还要它实际不当地压低了说话者的可信度（不充分）。","hf":false},{"id":"soc-L14-q11","module":"soc","lecture":"L14","topic":"命名的作用","q":"Why is the introduction of a shared concept like \u0027sexual harassment\u0027 important, according to the lecture?","options":["It guarantees that any complaint using the term will be believed.","It shows that the harm only began once the term was introduced.","It makes every workplace disagreement an instance of the same wrong.","It lets people connect separate experiences into a recognisable pattern of harm that can be understood, communicated and challenged."],"answer":3,"explain":"命名帮助自我理解、交流经历、发现共同模式并提出要求。它不保证每个指控成立（A），伤害也并非此时才开始（B）。","hf":false},{"id":"soc-L15-q01","module":"soc","lecture":"L15","topic":"制造怀疑的目标","q":"According to the lecture, what does a \u0027merchant of doubt\u0027 typically need to achieve in order to succeed?","options":["Prove that the opposite of the scientific consensus is true.","Make the evidence seem unsettled enough that the public delays belief change and action.","Get every scientist to change their findings.","Remove all uncertainty from the science."],"answer":1,"explain":"制造怀疑不需要证明相反结论；只要让人觉得“还说不准”，延后行动、维持现状（烟草备忘录把“怀疑”当作产品）。","hf":true},{"id":"soc-L15-q02","module":"soc","lecture":"L15","topic":"虚假平衡","q":"A TV programme invites one climate scientist and one climate sceptic to \u0027debate\u0027 whether humans cause global warming, giving each equal time. What is the main epistemic problem?","options":["Debates are always irrational.","The sceptic must be lying.","Equal airtime suggests the evidence is evenly split when the weight of evidence overwhelmingly favours one side.","Scientists should never appear on television."],"answer":2,"explain":"虚假平衡：听见正反两种声音不代表证据数量与质量相当。少数研究者可能真诚（B 错），问题在于呈现方式扭曲了证据分布。","hf":true},{"id":"soc-L15-q03","module":"soc","lecture":"L15","topic":"资助与来源审查","q":"You learn that a study favouring a soft-drink brand was funded by the soft-drink company. What is the appropriate response according to the lecture?","options":["Treat the funding as a reason to scrutinise the methods and how this study was selected and promoted, while still assessing it against the wider evidence.","Conclude that the study\u0027s result must be false.","Ignore the funding, since only data matter.","Accept the study, since companies know their own products best."],"answer":0,"explain":"利益关系是检查证据选择方式的理由，不是自动推翻结论的证据（B 错）；但也不能忽视（C 错）。","hf":false},{"id":"soc-L15-q04","module":"soc","lecture":"L15","topic":"言外之意","q":"A plastic package carries a recycling symbol that literally indicates only the type of plastic, yet many shoppers conclude the package is easily recyclable. This illustrates:","options":["an outright lie","a credibility deficit","false balance","a misleading implicature from a literally true message"],"answer":3,"explain":"字面信息为真，但暗示了未被证明的结论——这是课堂用来说明 implicature 的例子。","hf":false},{"id":"soc-L15-q05","module":"soc","lecture":"L15","topic":"细节不确定 vs 结论存疑","q":"Researchers agree that an effect is real but give a range of estimates for its size and timing. A campaign announces, \u0027Scientists aren\u0027t even sure it exists.\u0027 What has the campaign done?","options":["Accurately reported the uncertainty in the research.","Shown that numerical ranges are useless.","Turned genuine uncertainty about details into exaggerated doubt about the main conclusion.","Proved that the researchers fabricated data."],"answer":2,"explain":"“多大、何时”与“是否存在”是不同问题。科学给出区间是在认真量化不确定性，不等于什么都不知道。","hf":true},{"id":"soc-L15-q06","module":"soc","lecture":"L15","topic":"信心程度","q":"Your credence that \u0027my friend has arrived at the station\u0027 is 0.8. What does this mean?","options":["You are fairly confident the proposition is true but allow that it may be false.","You are certain the proposition is true.","The objective chance of arrival is exactly 80%, whatever you believe.","You believe the proposition is 80% true."],"answer":0,"explain":"Credence 是 0–1 的把握程度；1 才是确信为真。C 混淆了个人信心与客观机会；D 混淆了“命题部分为真”——命题本身只有真或假。","hf":true},{"id":"soc-L15-q07","module":"soc","lecture":"L15","topic":"主原则","q":"You know the objective chance of rain tomorrow is 0.3, and you have no other relevant information. According to the Principal Principle, what should your credence that it will rain be?","options":["1, because rain is possible","0.5, because it either rains or it doesn\u0027t","0, because rain is less likely than not","0.3"],"answer":3,"explain":"知道客观机会且没有额外的相关信息时，信心应等于该机会。B 是常见错误：“两种可能就各一半”。","hf":false},{"id":"soc-L15-q08","module":"soc","lecture":"L15","topic":"互斥且穷尽","q":"Exactly one of three mutually exclusive and exhaustive outcomes A, B, C will occur. Your credence in A is 0.5 and in B is 0.3. What should your credence in C be?","options":["0.3","0.2","0.5","It can be any value"],"answer":1,"explain":"互斥且穷尽的结果，信心之和应为 1：1 − 0.5 − 0.3 = 0.2。","hf":false},{"id":"soc-L15-q09","module":"soc","lecture":"L15","topic":"不确定下行动","q":"There is a 30% chance of rain and carrying an umbrella costs almost nothing. Which claim best fits the lecture\u0027s view of action under uncertainty?","options":["It can be rational to bring the umbrella, since decisions depend on both probabilities and the costs of outcomes.","You should not act until you are certain it will rain.","Bringing the umbrella commits you to asserting that it will rain.","With only 30% chance, bringing the umbrella is irrational."],"answer":0,"explain":"决策理论同时考虑可能性和后果；行动不等于断言结论为真（C 错），也不需要先确定（B 错）。","hf":true},{"id":"soc-L15-q10","module":"soc","lecture":"L15","topic":"维持现状偏向","q":"An industry group keeps highlighting small unresolved questions and insists on \u0027more certainty\u0027 before any regulation changes. Why does this tend to favour the status quo?","options":["Because uncertainty proves the current practice is safe.","Because it forces regulators to adopt every proposal immediately.","Because treating \u0027not yet certain\u0027 as \u0027no need to change\u0027 delays action, which benefits whoever gains from the current practice.","Because it prevents interested parties from influencing debate."],"answer":2,"explain":"当“先等等”对某方有利时，让公众迟迟不作判断就已有实际效果；承担风险的一方得不到保护。","hf":false},{"id":"soc-L17-q01","module":"soc","lecture":"L17","topic":"信息型广告","q":"An old advertisement for a plough lists its weight, materials and construction. Which type of advertising is this?","options":["Informational advertising","Associative advertising","Demand engineering","Targeting"],"answer":0,"explain":"直接介绍产品特点，属于信息型广告。注意信息型广告的信息也可能不准确（放射性饮用水广告）。","hf":false},{"id":"soc-L17-q02","module":"soc","lecture":"L17","topic":"联想型广告","q":"A beer advertisement repeatedly shows workers relaxing after a shift but says almost nothing about the beer. Which method does this best illustrate?","options":["Giving detailed product information","Proving the beer is healthier than other drinks","Creating an association between the product and a feeling or lifestyle","Product differentiation through a unique ingredient"],"answer":2,"explain":"反复同框建立联想，类似巴甫洛夫的狗听到铃声就想到食物。","hf":false},{"id":"soc-L17-q03","module":"soc","lecture":"L17","topic":"制造需求","q":"An ad says, \u0027Other people may notice your body odour even if you don\u0027t,\u0027 and then sells deodorant. What is its main move?","options":["It lists the chemical ingredients of the deodorant.","It first makes a previously unnoticed condition seem like a problem, then offers the product as the solution.","It proves that everyone already wanted deodorant.","It targets campers with camping gear."],"answer":1,"explain":"Demand engineering：先卖问题，再卖答案。它还借助相互预期——担心别人会怎么评价我。","hf":true},{"id":"soc-L17-q04","module":"soc","lecture":"L17","topic":"共同关注/共同知识","q":"Why can a message broadcast publicly to a huge audience shape behaviour even among people who privately doubt it?","options":["Because repetition logically proves the message is true.","Because private beliefs never affect behaviour.","Because a public broadcast gives each viewer detailed information about other people\u0027s motives.","Because each viewer expects that others have seen the message and may accept the norm, and adjusts to those expectations."],"answer":3,"explain":"共同关注产生相互预期：我未必同意，只要相信别人会用这个标准评价我，就会改变行为（如一战海报、体味广告）。重复不能在逻辑上证明为真（A 错）。","hf":true},{"id":"soc-L17-q05","module":"soc","lecture":"L17","topic":"相对标准","q":"Once almost everyone owns a car, advertising promotes a more expensive car as the new mark of success. This best illustrates:","options":["an absolute norm","a relative norm","informational advertising","context-free information"],"answer":1,"explain":"相对标准要求“比别人更好”，别人升级后目标也随之上升；绝对标准只要求达到同一门槛。","hf":false},{"id":"soc-L17-q06","module":"soc","lecture":"L17","topic":"Galbraith","q":"What is Galbraith\u0027s point about created wants, as discussed in the lecture?","options":["If production and advertising create the very wants they satisfy, we cannot justify more production simply as meeting pre-existing needs.","Advertising only ever provides useful information.","Consumers\u0027 wants are fixed and cannot be changed by advertising.","Production should be maximised because every want is genuine."],"answer":0,"explain":"Galbraith 质疑：如果欲望本身由生产和广告制造，就不能说扩大生产是在满足原有需要。","hf":false},{"id":"soc-L17-q07","module":"soc","lecture":"L17","topic":"品牌塑造 vs 定向投放","q":"An online ad says, \u0027People with interests like yours love this camping stove.\u0027 Which strategy does this best illustrate?","options":["Branding","Informational advertising","Demand engineering","Targeting"],"answer":3,"explain":"定向投放把产品和“你是哪类人”连起来。品牌塑造是给整家公司贴特质标签（如“耐用可靠”）。","hf":false},{"id":"soc-L17-q08","module":"soc","lecture":"L17","topic":"品牌塑造","q":"A truck maker repeatedly advertises itself as \u0027durable and reliable\u0027 so that buyers associate these traits with every model it sells. Which strategy is this?","options":["Targeting","Branding","Context-free information","Demand engineering"],"answer":1,"explain":"把印象标签贴在整个品牌/公司上，而不是某一件产品上。","hf":false},{"id":"soc-L17-q09","module":"soc","lecture":"L17","topic":"Postman 与媒介","q":"Which statement best matches the lecturer\u0027s view in the discussion of Postman and \u0027context-free information\u0027?","options":["Print media is always relevant; electronic media is always irrelevant.","Whether information is action-relevant depends on the recipient\u0027s situation, not simply on the medium: newspapers can carry irrelevant stories and online forums can offer useful local information.","Information from television must be false.","Context-free information is information whose words have no meaning."],"answer":1,"explain":"老师特别提醒不要把“纸媒有用、电子媒介无用”当结论；相关性取决于读者能否据此行动。","hf":false},{"id":"soc-L17-q10","module":"soc","lecture":"L17","topic":"宣传与反复曝光","q":"A wartime recruitment poster is displayed everywhere, implying that \u0027people like us all do our part\u0027. What makes its repeated public display especially effective?","options":["It makes people expect that others have seen it and accept the norm, not just reminds each person individually.","It provides precise information about conditions in the trenches.","It logically proves that enlisting is the right choice.","It works only on people who already wanted to enlist."],"answer":0,"explain":"反复公开出现同时抓住注意力和预期：你会觉得“大家都看见了”，于是变成社会规范。","hf":false},{"id":"soc-L19-q01","module":"soc","lecture":"L19","topic":"Simon 注意力经济","q":"According to Herbert Simon, what is it that information consumes, such that \u0027a wealth of information creates a poverty of attention\u0027?","options":["Money","Storage space","The attention of its recipients","The credibility of its producers"],"answer":2,"explain":"Simon：信息消耗的是接收者的注意力，所以信息越多，注意力越稀缺，需要高效分配。","hf":true},{"id":"soc-L19-q02","module":"soc","lecture":"L19","topic":"信息成本由谁承担","q":"Simon claims that in an information-rich world, most of the cost of information is borne by whom?","options":["The recipient, in terms of scarce attention needed to process it","The producer, in terms of the cost of creating it","The transmitter, in terms of the cost of sending it","No one, since information is now free"],"answer":0,"explain":"制造信息很便宜，瓶颈在处理。老师的例子：ANU 的外国接触申报表如果人人都认真填，审核委员会会被压垮。","hf":true},{"id":"soc-L19-q03","module":"soc","lecture":"L19","topic":"串行注意","q":"What does Simon mean by saying human attention is \u0027serial\u0027?","options":["Humans can attend fully to many things at once.","Attention improves steadily with practice until it becomes unlimited.","Attention works in a series of years, declining with age.","Humans can attend to only one thing at a time, so \u0027multitasking\u0027 is really fast switching with switching costs."],"answer":3,"explain":"像单核 CPU 一样：看似同时运行多个程序，实际上快速切换。Where\u0027s Wally 和 change blindness 演示都需要逐处串行搜索。","hf":false},{"id":"soc-L19-q04","module":"soc","lecture":"L19","topic":"内源性 vs 外源性注意","q":"You are reading when a notification sound draws you
