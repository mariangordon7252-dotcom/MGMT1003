{"mcq":{
"soc-L1-q01":"选 C：JTB 只有真、信、辩护三条，“确定无疑、不可怀疑”不在其中。\nA 错：相信 P 是三条之一。\nB 错：有辩护是三条之一。\nD 错：P 为真是三条之一。",
"soc-L1-q02":"选 C：Verna 案中真、信、辩护都满足却不是知识，说明 JTB 不充分。\nA 错：它不是怀疑论，不说我们一无所知。\nB 错：知识仍要求真（事实性）。\nD 错：它攻击充分性，不说辩护不必要。",
"soc-L1-q03":"选 B：信念只是碰巧为真，使它为真的不是她证据所指的那个人。\nA 错：Colin 真在悉尼，信念是真的。\nC 错：题设是正常光线、看得清楚。\nD 错：她确实相信 Colin 在悉尼。",
"soc-L1-q04":"选 D：没注册就不可能通过（必要），但注册不保证通过（不充分）。\nA 错：它是必要条件。\nB 错：把必要和充分弄反了。\nC 错：注册了也可能挂科，不充分。",
"soc-L1-q05":"选 D：前提说学习是通过的必要条件，结论却当它是充分条件。\nA 错：这里不涉及真与有效的区分。\nB 错：方向反了，是必要被当充分。\nC 错：推理里没有涉及证言。",
"soc-L1-q06":"选 B：事实性：知道 P 蕴含 P 为真，K(P) → P。\nA 错：这是逆命题，P 真不等于你知道。\nC 错：知识不要求能证明 P。\nD 错：有好证据的信念仍可能为假。",
"soc-L1-q07":"选 A：逻辑只查推理结构；前提是否可靠是另一个认识论问题。\nB 错：社会认识论关心前提来源，不只逻辑形式。\nC 错：前提假的论证也可以有效。\nD 错：有效只保证前提真则结论真。",
"soc-L2-q01":"选 C：两盒派问的是选择能因果地造成什么：钱已放好，改变不了。\nA 错：题中不涉及人群里的比例。\nB 错：“选择是什么的证据”是一盒派思路。\nD 错：与证言可靠性无关。",
"soc-L2-q02":"选 C：预测者随机时，选择不带证据，多拿 A 总是多 $1000。\nA 错：拿两盒总多 $1000，有差别。\nB 错：随机预测下选择已不是证据。\nD 错：两盒都不拿什么也得不到。",
"soc-L3-q01":"选 A：Clifford 原则：任何时候、任何地方、任何人，证据不足而信都是错的。\nB 错：按风险选择信念是 James 的思路。\nC 错：这是 Clifford 要反驳的反对意见。\nD 错：Clifford 说的是道德上错，不只是不明智。",
"soc-L3-q02":"选 B：Clifford 评价信念的依据，不看结果；船平安到达他仍有罪。\nA 错：Clifford 认为信念本身就有罪。\nC 错：碰巧为真不等于有权相信。\nD 错：没人受伤也洗白不了不负责的信念。",
"soc-L3-q03":"选 D：P2 太强：有些信念似乎私人、琐碎、不影响行动，是 James 的攻击点。\nA 错：P1、P2 若真，C 确实推得出。\nB 错：几乎人人接受不伤害他人的义务。\nC 错：P2 很有争议，论证不是无争议可靠。",
"soc-L3-q04":"选 D：“信念可自由选择”偏向 James 意志主义，不是 Clifford 的回应。\nA 错：信念会传播，是 Clifford 的回应。\nB 错：轻信成坏习惯，是 Clifford 的回应。\nC 错：信念导致行动，是 Clifford 的回应。",
"soc-L3-q05":"选 D：两种面包你都会考虑（活）、必须选一种（被迫），但不改变人生（不重大）。\nA 错：它是活的，也是被迫的。\nB 错：选面包不是重大选项。\nC 错：它不重大，而且是活的。",
"soc-L3-q06":"选 A：被迫选项无法悬置：一直拖着不选，实际就等于选了“不去”。\nB 错：上大学对他是活的选项，且活与被迫无关。\nC 错：证据并没有决定这个问题。\nD 错：上不上大学并不琐碎。",
"soc-L3-q07":"选 B：自我实现信念：证据不足时相信能跳过，会帮自己成真，所以无害。\nA 错：这正是反对“无决定性证据不行动”。\nC 错：例子说明自信有时是合理的。\nD 错：信念只可能是必要条件，不是充分条件。",
"soc-L3-q08":"选 A：门槛越严，假信念越少，但越可能错过真相。\nB 错：那是宽松门槛的结果。\nC 错：严门槛不会让真相变多。\nD 错：任何门槛都无法同时避免两种错误。",
"soc-L3-q09":"选 D：教授批评 James 没回应 Clifford 的 P1：不伤害他人的义务。\nA 错：James 不同意信念总要与证据相称。\nB 错：教授没说归谬在逻辑上无效。\nC 错：James 不允许信 2+2=5。",
"soc-L3-q10":"选 D：原则须先于权衡证据被接受，本身无充分证据，按自身标准相信它是错的。\nA 错：自我实现信念是另一个论证。\nB 错：原则针对任何信念，不只宗教。\nC 错：归谬说的恰恰是它没有充分证据。",
"soc-L5-q01":"选 A：本课的证言是广义的：书、照片、新闻、纪录片和口头报告都算。\nB 错：不限于面对面口头讲述。\nC 错：不限于法庭宣誓证词。\nD 错：不限于经认证的专家。",
"soc-L5-q02":"选 C：Hardwig：外行可因承认的专家相信 P 而有辩护，即使没有专家的证据。\nA 错：依赖专家不等于专家永远正确。\nB 错：Hardwig 认为不必亲自验证一切。\nD 错：他的核心正是证言能提供辩护。",
"soc-L5-q03":"选 C：证言把相信诊断的辩护传给病人，但不传底层证据。\nA 错：辩护确实被传递了。\nB 错：病人没拿到显微镜证据。\nD 错：证言不带来确定无疑。",
"soc-L5-q04":"选 A：证言链必须落在真实证据上；源头是乱填的，整条链的辩护崩溃。\nB 错：病人的辩护来自同一条链，也崩溃。\nC 错：权威不能让诊断变真。\nD 错：链长不能弥补源头没证据。",
"soc-L5-q05":"选 D：理性服从因相关专业能力而依赖，专家判断最终要连到证据。\nA 错：因地位服从是盲从。\nB 错：两者在依据上不同。\nC 错：理性服从仍可提问、要第二意见。",
"soc-L5-q06":"选 B：各领域都彻底自主，会让人知道得更少、更不可靠。\nA 错：例子正是反对处处追求自主。\nC 错：例子没否认数学是知识来源。\nD 错：课本属于广义证言。",
"soc-L5-q07":"选 C：没人能独立解释全部，挑战了“个人是首要知识主体”的认识论个人主义。\nA 错：与知识的事实性无关。\nB 错：合作里恰恰有很多专家。\nD 错：与 Clifford 的证据主义无关。",
"soc-L5-q08":"选 A：AI 错了也能流畅自信，切断了“流畅 = 专业”的联系。\nB 错：AI 没让过往记录变得完全可靠。\nC 错：AI 并不总是拒绝技术问题。\nD 错：AI 没有废除资格认证。",
"soc-L7-q01":"选 C：火警是显著的外部刺激，抓走所有人的注意，是外源注意。\nA 错：选择偏差是关于样本的，不是注意。\nB 错：内源注意是主动按目标定向。\nD 错：幸存者偏差关于被筛掉的数据。",
"soc-L7-q02":"选 B：选择性注意：专注任务时，显眼的无关信息也会被压制。\nA 错：漏看不说明视力差。\nC 错：观众没有撒谎，是真没看见。\nD 错：大猩猩清楚可见。",
"soc-L7-q03":"选 D：发动机弹孔少，是因为那里中弹的飞机回不来，应加固发动机。\nA 错：数据有偏，但可以纠正后使用。\nB 错：随机加固浪费了缺失数据里的信息。\nC 错：那些部位中弹后仍能返航。",
"soc-L7-q04":"选 A：样本完全随机，问题在问题措辞诱导回答（诱导式民调）。\nB 错：没有案例被筛选淘汰。\nC 错：抽样随机，不是选择偏差。\nD 错：与友谊网络抽样无关。",
"soc-L7-q05":"选 C：问题出在受访者多报或少报（测量误差），不是谁被抽到。\nA 错：抽样本身不是主要问题。\nB 错：没有按综合门槛筛选样本。\nD 错：没有被淘汰而看不见的案例。",
"soc-L7-q06":"选 B：按班级平均 50，按学生体验平均 140，两者都对。\n算：(20×20+4×200)/24 = 50；(400×20+800×200)/1200 = 140\nA 错：110 是 20 与 200 的简单平均。\nC 错：两个数位置反了。\nD 错：忽略了大班学生更多。",
"soc-L7-q07":"选 A：高连接的人出现在很多人的好友列表里，沿友谊抽样过度代表他们。\nB 错：友谊通常是对称的。\nC 错：不是低估自己的问题。\nD 错：没有被淘汰的案例。",
"soc-L7-q08":"选 C：自我选择：本来更健康的员工更愿意参加，不是项目让人健康。\nA 错：随机对照组没有幸存者偏差问题。\nB 错：正是随机试验揭示了真相。\nD 错：随机比较显示无显著效果。",
"soc-L7-q09":"选 B：伯克森悖论：招聘按综合能力筛选，在录用者中制造负相关。\nA 错：材料没说获奖者更易辞职。\nC 错：负相关来自筛选，不是因果。\nD 错：与诱导式民调无关。",
"soc-L7-q10":"选 B：抽屉问题：只发表有利结果，公开文献被结果筛选。\nA 错：与友谊网络抽样无关。\nC 错：外源注意是心理过程。\nD 错：抽样随机不能防止发表筛选。",
"soc-L9-q01":"选 B：字面只夸讲课，“字迹差”是语境中推出的暗示，属语用。\nA 错：这不是逻辑推出的结论。\nC 错：句法只管句子结构。\nD 错：语义只给出字面意思。",
"soc-L9-q02":"选 A：说“我保证”本身就建立了承诺和责任，是言语行为。\nB 错：只是描述讲课很长。\nC 错：只是描述在下雨。\nD 错：只是描述天鹅的颜色。",
"soc-L9-q03":"选 C：PHIL1005 是焦点：每人都预计别人也觉得它显著。\nA 错：大家没有商量，没有明确断言。\nB 错：焦点不必是客观最好的。\nD 错：选课不是用话语完成社会行动。",
"soc-L9-q04":"选 D：男孩喊出后，事实成为共同知识：人人知道人人都知道。\nA 错：皇帝本来就没穿衣服。\nB 错：事实是进入，而不是离开共同基础。\nC 错：旁观者早已看见。",
"soc-L9-q05":"选 A：懂意图不等于有足够证据行动，无辜解释仍然存在。\nB 错：诚实警察可以完全听懂。\nC 错：间接行贿仍然违法。\nD 错：靠局外人不懂的是暗号，不是暗示。",
"soc-L9-q06":"选 C：双方都懂 p 不等于 p 被公开放进共同基础，所以能照常相处。\nA 错：间接言语并非总失败，这次就被听懂了。\nB 错：这只是共享知识，不是共同知识。\nD 错：题设说双方都懂了。",
"soc-L9-q07":"选 B：关系管理：被拒就真的只看电影，原有友谊得以保住。\nA 错：这不是主持婚礼的言语行为。\nC 错：表白不涉及法律惩罚。\nD 错：间接表达恰恰避免制造共同知识。",
"soc-L9-q08":"选 C：字面赞美在不断累积的反证下反复出现，变成反讽信号。\nA 错：字面内容是在赞美 Brutus。\nB 错：不是共同知识排除了其他解释。\nD 错：Antony 从未直接断言。",
"soc-L9-q09":"选 A：暗示约定俗成为只有一种意思的习语后，就等于直说，失去可否认性。\nB 错：听者不确定反而保住可否认性。\nC 错：字面为真正是无辜解释的来源。\nD 错：多重受众是战略模糊的用武之地。",
"soc-L11-q01":"选 B：重描述谬误：低层机制描述本身不能排除高层能力。\nA 错：盖梯尔是知识论反例，与此无关。\nC 错：缺少额外论证，不是可靠证明。\nD 错：与幸存者偏差无关。",
"soc-L11-q02":"选 D：教授暂定地倾向图书馆技术假说：LLM 是信息检索而非真正认知。\nA 错：教授没说这是定论，也不认为它像人思考。\nB 错：他给出了幻觉、二十问等理由。\nC 错：那会犯重描述谬误。",
"soc-L11-q03":"选 D：厕所例说明幻觉：文本合理性高不保证内容为真。\nA 错：问题不在于缺山的训练数据。\nB 错：LLM 训练后不会每次聊天学新事实。\nC 错：例子不是讲条件概率。",
"soc-L11-q04":"选 A：重采样走向不同对象，说明模型只让回答与前文一致，没有固定目标。\nB 错：没有证据说它故意说谎。\nC 错：恰好相反，没有事先定好的对象。\nD 错：例子与人类难度无关。",
"soc-L11-q05":"选 B：窗口每加长一步，表约按 n^(k+1) 指数增长，长序列在训练数据中几乎没出现。\nA 错：Markov 生成器就是用条件概率。\nC 错：问题不是语法变差。\nD 错：加长窗口是为了捕捉长程依赖。",
"soc-L11-q06":"选 D：是否思考与能否获得知识是两回事；可追溯、可检验的系统也能传递信息。\nA 错：书没有意识也能传递知识。\nB 错：LLM 输出会出现幻觉，不总可靠。\nC 错：不思考的书也能让人学到东西。"
}}
,
{"mcq":{
"soc-L13-q01":"选 D：Lackey 的条件只有三条，听者亲自核实不在其中。\nA 错：内容为真是条件之一。\nB 错：说话者的证言可靠是条件之一。\nC 错：听者有理由认为说话者可靠是条件之一。",
"soc-L13-q02":"选 C：她的说法有证据，却因“女人情绪化”的身份偏见被低估。\nA 错：她说的其实是真的。\nB 错：她有证据（Dickie 的戒指）。\nD 错：不说出来是自我压抑，不是此案。",
"soc-L13-q03":"选 B：Medina 指出一方可信度过高会造成另一方不足，可信度是相互比较的。\nA 错：Medina 并不否认可信度不足的不正义。\nC 错：他没有否定诠释不正义。\nD 错：证言不正义不要求听者有意伤害。",
"soc-L13-q04":"选 B：她预料同事会敌视，于是自己不说，是证言自我压抑。\nA 错：消音是说了却被完全无视。\nC 错：这里没有人被过度相信。\nD 错：不涉及优势群体拒绝承认概念。",
"soc-L13-q05":"选 C：陪审团因偏见把证言当作没说过，是证言消音。\nA 错：被告得到的信任过低，不是过高。\nB 错：自我压抑是说话者自己不说，他作证了。\nD 错：问题不在缺少概念，而在不把他当知识来源。",
"soc-L13-q06":"选 A：概念已存在，优势群体却拒绝承认，是蓄意的诠释无知。\nB 错：Fricker 认为概念出现就克服，此案概念已有仍受害。\nC 错：说话者没有自己压下证言。\nD 错：主动否认真实现象不是对证据敏感。",
"soc-L13-q07":"选 B：她因不被信而愤怒，愤怒又被当作情绪化的证据，再被低估。\nA 错：恶性循环与证据需求变少无关。\nC 错：是她得到可信度不足，不是她给别人过高。\nD 错：她一直在说，不是自我压抑。",
"soc-L14-q01":"选 C：缺少“性骚扰”这个共同概念，经历说不清，是诠释不正义。\nA 错：证言不正义是说出后因偏见不被信。\nB 错：这里没有谁被过度相信。\nD 错：不涉及听者基于证据的怀疑。",
"soc-L14-q02":"选 A：她有清楚证据，却因性别偏见被低估，是证言不正义。\nB 错：她能说清缺陷，不缺概念。\nC 错：经理无视证据，不是对证据作出回应。\nD 错：她说出来了，没有自我压抑。",
"soc-L14-q03":"选 D：怀疑是否不正义要看当时的依据和是否对证据敏感，不看事后真相。\nA 错：用事后真相倒推当初的怀疑。\nB 错：让说话者不满不等于不正义。\nC 错：尊重说话者不要求不加检查就接受。",
"soc-L14-q04":"选 C：带偏见的刻板印象不基于准确统计，它恰恰抵抗反证。\nA 错：把群体与负面特征相连是要素之一。\nB 错：抵抗反证是要素之一。\nD 错：不当的情感投入是要素之一。",
"soc-L14-q05":"选 B：他真心相信自己的指路，但不熟悉这座城市：真诚但缺能力。\nA 错：说错不等于不真诚。\nC 错：相信自己的话是真诚，不是能力。\nD 错：真诚和能力是两个独立的维度。",
"soc-L14-q06":"选 A：怀疑是否合理看警察当时的证据，不看观众事后知道什么。\nB 错：不能推出“奇怪的人永远不可信”。\nC 错：真话当然可以值得相信。\nD 错：Kyle Reese 是真诚的。",
"soc-L14-q07":"选 D：严格的证言不正义还要求可信度不足由身份偏见造成。\nA 错：事后被证实，不能说明少信的原因。\nB 错：资历差异只是权力差异，不是身份偏见。\nC 错：当事人难过不是判断标准。",
"soc-L14-q08":"选 B：她没学过术语是个人知识不足，不是结构性身份偏见造成的缺口。\nA 错：诠释不正义不限于法庭证言。\nC 错：题目没有说她撒谎。\nD 错：诠释不正义与可信度过高无关。",
"soc-L14-q09":"选 C：她被当作不完整的知识提供者，兼有认识伤害和道德伤害。\nA 错：伤害不只是形成了错误信念。\nB 错：伤害不在于损失钱财。\nD 错：这与说话者的推理错误无关。",
"soc-L14-q10":"选 B：没有身份偏见就不算（必要），但只有偏见还不够（不充分）。\nA 错：把必要和充分弄反了。\nC 错：严格框架里它是必要的。\nD 错：还要偏见实际压低了可信度。",
"soc-L14-q11":"选 D：共同概念让零散经历连成可识别的伤害模式，可被理解、交流和挑战。\nA 错：有了词不保证每个指控都被相信。\nB 错：伤害在命名之前就存在。\nC 错：不是每次职场分歧都属于同一种不当行为。",
"soc-L15-q01":"选 B：制造怀疑只需让证据显得未定论，使公众推迟判断和行动。\nA 错：不需要证明相反结论为真。\nC 错：不需要让科学家改变结论。\nD 错：它是放大不确定，不是消除不确定。",
"soc-L15-q02":"选 C：各给同等时间暗示证据五五开，而证据分量压倒性地偏向一方，是虚假平衡。\nA 错：辩论本身不一定不理性。\nB 错：怀疑论者可能是真诚的。\nD 错：问题在呈现方式，不在科学家上电视。",
"soc-L15-q03":"选 A：资助是仔细审查方法和挑选方式的理由，仍要放到整体证据中评估。\nB 错：受资助不等于结论必假。\nC 错：利益关系不能忽视。\nD 错：公司有利益动机，更需要审查。",
"soc-L15-q04":"选 D：标识字面为真，却暗示“容易回收”，是误导性言外之意。\nA 错：字面内容是真的，不是谎言。\nB 错：不涉及谁的话被少信。\nC 错：没有把双方呈现为势均力敌。",
"soc-L15-q05":"选 C：把细节（大小、时间）的不确定夸大成对主结论是否存在的怀疑。\nA 错：研究者都同意效应存在，报道不准确。\nB 错：给出区间正是在认真量化不确定。\nD 错：没有任何迹象表明捏造数据。",
"soc-L15-q06":"选 A：信念度 0.8 表示相当有把握，但承认可能为假。\nB 错：只有信念度为 1 才是确定为真。\nC 错：混淆了个人信念度和客观机会。\nD 错：命题只有真假，不会“80% 为真”。",
"soc-L15-q07":"选 D：按主原则，知道客观机会且无其他相关信息，信念度等于机会 0.3。\nA 错：“可能下雨”不等于确定下雨。\nB 错：两种可能不等于各占 0.5。\nC 错：可能性低于一半不等于确定不下。",
"soc-L15-q08":"选 B：互斥且穷尽的结果，信念度之和为 1。\n算：1 − 0.5 − 0.3 = 0.2\nA 错：0.3 会使总和超过 1。\nC 错：0.5 会使总和为 1.3。\nD 错：总和必须为 1，C 只能是 0.2。",
"soc-L15-q09":"选 A：决策同时看概率和后果成本，带伞成本极低，带伞可以是理性的。\nB 错：行动不需要先确定结论为真。\nC 错：行动不等于断言会下雨。\nD 错：只看概率、忽略了成本。",
"soc-L15-q10":"选 C：把“尚不确定”当作“不必改变”会拖延行动，利于从现状中获益的一方。\nA 错：不确定不能证明现行做法安全。\nB 错：它是拖延改变，不是逼人立即采纳。\nD 错：利益相关方正是借此影响讨论。",
"soc-L17-q01":"选 A：列出重量、材料和构造，是直接介绍产品的信息型广告。\nB 错：联想型广告不提供产品信息。\nC 错：没有先制造一个“问题”。\nD 错：没有针对特定受众。",
"soc-L17-q02":"选 C：反复把啤酒与下班放松同框，是建立联想的联想型广告。\nA 错：广告几乎不提供产品信息。\nB 错：广告没有证明任何健康功效。\nD 错：没有强调独特成分来区分产品。",
"soc-L17-q03":"选 B：先让没被在意的体味显得是问题，再卖除臭剂，是制造需求。\nA 错：广告没有列成分。\nC 错：它是制造需要，不是证明人们早就想要。\nD 错：这是定向投放，与本例无关。",
"soc-L17-q04":"选 D：每个人预期别人都看到并可能接受，于是按这种相互预期调整行为。\nA 错：重复不能在逻辑上证明讯息为真。\nB 错：私下信念当然会影响行为。\nC 错：公开播放不会告诉你别人的具体动机。",
"soc-L17-q05":"选 B：人人有车后标准升到更贵的车，目标随别人提高，是相对标准。\nA 错：绝对标准是人人达到同一门槛。\nC 错：广告推的是成功标志，不是产品信息。\nD 错：这与信息是否和行动相关无关。",
"soc-L17-q06":"选 A：欲望若由生产和广告制造，就不能说扩大生产是满足原有需要。\nB 错：Galbraith 认为广告会制造欲望。\nC 错：他恰恰认为欲望会被广告改变。\nD 错：他质疑“每个欲望都真实”的说法。",
"soc-L17-q07":"选 D：“和你兴趣相似的人都爱它”，按受众身份投放，是定向投放。\nA 错：品牌塑造是给整家公司贴标签。\nB 错：广告没给出产品信息。\nC 错：没有先制造一个问题。",
"soc-L17-q08":"选 B：把“耐用可靠”贴在整家公司上、覆盖所有车型，是品牌塑造。\nA 错：没有针对特定兴趣或身份的受众。\nC 错：这是广告策略，不是信息相关性问题。\nD 错：没有先制造一个问题。",
"soc-L17-q09":"选 B：信息是否与行动相关取决于接收者处境，不只取决于媒介。\nA 错：老师明确反对“纸媒有用、电子媒介无用”。\nC 错：电视信息不一定是假的。\nD 错：脱离情境指与行动无关，不是文字无意义。",
"soc-L17-q10":"选 A：公开反复展示让人预期别人都看到并接受，形成社会规范。\nB 错：海报没提供战壕的具体信息。\nC 错：广告不能在逻辑上证明该参军。\nD 错：它也影响原本不想参军的人。",
"soc-L19-q01":"选 C：Simon 认为信息消耗接收者的注意力，信息越多注意力越稀缺。\nA 错：消耗的不是钱。\nB 错：消耗的不是存储空间。\nD 错：不涉及生产者的可信度。",
"soc-L19-q02":"选 A：信息丰富时，主要成本是接收者处理信息所需的稀缺注意力。\nB 错：制造信息如今很便宜。\nC 错：传输成本也不是瓶颈。\nD 错：接收者的注意力就是成本。",
"soc-L19-q03":"选 D：串行注意指一次只能注意一件事，多任务只是有切换成本的快速切换。\nA 错：这正与串行相反。\nB 错：练习不会让注意力无限。\nC 错：“串行”不是指按年份衰退。",
"soc-L19-q04":"选 B：通知声从外部抓走你的注意，是外源性注意转移。\nA 错：内源性是自己主动决定转移。\nC 错：认识泡泡与注意转移无关。\nD 错：串行搜索是一处处地找。",
"soc-L19-q05":"选 C：Simon 原意是分配自己的注意力（多为内源性），现代指广告商竞买注意力（多为外源性）。\nA 错：把两种用法颠倒了。\nB 错：两者有明显区别。\nD 错：区别不在钱和时间。",
"soc-L19-q06":"选 A：注意力不全像钱：有些任务几乎不冲突，训练也能减少所需注意力。\nB 错：训练后注意力也不是无限的。\nC 错：处理信息仍需要注意力。\nD 错：老师明确说开车时不应发短信。",
"soc-L19-q07":"选 B：认识泡泡是相关声音因遗漏被排除。\nA 错：主动贬低外部声音是回音室。\nC 错：政治观点相同不等于泡泡。\nD 错：泡泡不是关于媒体的阴谋论。",
"soc-L19-q08":"选 D：他们读对方的帖子，只为说明对方恶意、不可信，是主动贬低，属回音室。\nA 错：接触过对方不能排除回音室。\nB 错：接触对方观点不等于两者都不是。\nC 错：串行注意与此无关。",

/* ---------- 掌握度 ---------- */
function mastery(m){
  let sum = 0, cnt = 0, seen = 0;
  MCQ.filter(q => q.module === m).forEach(q => { cnt++; const r = S.mcq[q.id]; if (r) { seen++; sum += r.last ? 1 : 0; } });
  CALC.filter(q => q.module === m).forEach(q => { cnt++; const r = S.calc[q.id]; if (r) { seen++; sum += r.clean ? 1 : .5; } });
  CARDS.filter(c => c.module === m).forEach(c => { cnt++; const r = S.cards[c.id]; if (r) { seen++; sum += Math.min(r.box, 4) / 4; } });
  return {v: cnt ? sum / cnt : 0, seen, cnt};
}
function estScore(){ return MOD_ORDER.reduce((a, m) => a + MODS[m].w / 100 * mastery(m).v * 75, 0); }

}

/* ---------- 知识点通过：对应的选择题 + 计算题最近一次全对就自动通过，也可手动打勾 ---------- */
const kpItems = c => { const x = kpSplit(c); return [...x.mcq, ...x.calc]; };
const itemOk = id => byId[id].steps ? !!(S.calc[id] && S.calc[id].clean) : !!(S.mcq[id] && S.mcq[id].last);

function kpAuto(c){ const p = kpProg(c); return p.n > 0 && p.ok === p.n; }

function kpWatch(id, fn){
  const before = (Q2C[id] || []).filter(cid => !kpPass(byId[cid]));

  const now = before.filter(cid => kpPass(byId[cid]));
  if (!now.length) return;
  kpNew.push(...now); clearTimeout(kpNewT);
  kpNewT = setTimeout(() => { const ns = [...new Set(kpNew)]; kpNew = [];
    toast(ns.length === 1 ? `✓ 知识点通过：${byId[ns[0]].term}` : `✓ ${ns.length} 个知识点通过`, 'ok'); }, 150);
}

  if (ok) delete S.wrong[id]; else S.wrong[id] = 'mcq';
  save();
}); }
function recCalc(id, clean){ kpWatch(id, () => {

  save(); });
}
const BOX_DAYS = [0, 1, 2, 4, 7, 12];
function rateCard(id, r){
  const c = S.cards[id] || {box:0, due:0};
  if (r === 0) { c.box = 0; c.due = Date.now() + 10 * 60e3; }
  else if (r === 1) { c.box = Math.max(1, c.box); c.due = Date.now() + 864e5; }
  else { c.box = Math.min(5, c.box + 1); c.due = Date.now() + BOX_DAYS[c.box] * 864e5; }
  S.cards[id] = c; save();
}

/* ---------- 选题 ---------- */
function pool(arr, o){
  let p = arr.filter(x => (!o.mod || x.module === o.mod) && (!o.hf || x.hf));
  if (o.lec && o.lec.length) { const q = p.filter(x => o.lec.includes(x.lecture)); if (q.length) p = q; }
  return p;
}
function pickMcq(o){
  let p = pool(MCQ, o);
  if (o.unseen) { const u = p.filter(q => !S.mcq[q.id]); if (u.length) p = u; }
  const unseen = shuffle(p.filter(q => !S.mcq[q.id]));
  const wrong = shuffle(p.filter(q => S.mcq[q.id] && !S.mcq[q.id].last));
  const rest = shuffle(p.filter(q => S.mcq[q.id] && S.mcq[q.id].last)).sort((a, b) => S.mcq[a.id].t - S.mcq[b.id].t);
  return [...unseen, ...wrong, ...rest].slice(0, o.n || 15).map(q => q.id);
}
function pickCalc(o){
  const p = pool(CALC, o);
  const a = shuffle(p.filter(q => !S.calc[q.id])), b = shuffle(p.filter(q => S.calc[q.id] && !S.calc[q.id].clean)), c = shuffle(p.filter(q => S.calc[q.id] && S.calc[q.id].clean));
  return [...a, ...b, ...c].slice(0, o.n || 3).map(q => q.id);
}
function pickCards(o){
  const p = pool(CARDS, o), now = Date.now();
  const due = shuffle(p.filter(c => S.cards[c.id] && S.cards[c.id].due <= now));
  const fresh = shuffle(p.filter(c => !S.cards[c.id]));
  const later = p.filter(c => S.cards[c.id] && S.cards[c.id].due > now).sort((a, b) => S.cards[a.id].box - S.cards[b.id].box);
  return [...due, ...fresh, ...later].slice(0, o.n || 15).map(c => c.id);
}

function go(name, p){ stack.push({name, p: p || {}}); render(true); }
function back(){ if (stack.length > 1) stack.pop(); sess = cur().sess || null; render(true); }
function tab(name){ stack = [{name}]; sess = null; render(true); }

function render(top){
  const r = cur();
  document.body.classList.toggle('sess', SESS.has(r.name));
  document.body.classList.toggle('symok', PRACTICE.has(r.name));
  if (!PRACTICE.has(r.name)) document.body.classList.remove('symopen');
  $('#view').innerHTML = (SCR[r.name] || SCR.home)(r.p || {});
  const root = stack[0].name;
  $('#tabs').innerHTML = [['home','首页',IC.home],['practice','练习',IC.pen],['cardsHome','定义卡',IC.cards],['kb','知识库',IC.book],['me','我的',IC.user]]
    .map(([n, l, i]) => `<button class="${root === n ? 'on' : ''}" data-act="tab" data-n="${n}">${i}<span>${l}</span></button>`).join('');
  if (top) window.scrollTo(0, 0);
  tickTimers();
}

/* ---------- 计划任务 ---------- */
function todayIdx(){
  const t = ymd(today0());
  const i = PLAN.findIndex(d => ymd(d.date) === t);
  if (i >= 0) return i;
  return today0() < PLAN[0].date ? 0 : PLAN.length - 1;
}
function taskLabel(t){
  const mn = t.mod ? MODS[t.mod].name : '';
  const lec = t.lec ? ' ' + t.lec.join('/') : '';
  switch (t.k) {
    case 'mcq': return `${mn}选择题 ${t.n} 道${lec}`;
    case 'calc': return `${mn}计算题 ${t.n} 道${lec}`;
    case 'cards': return t.hf ? `高频定义卡 ${t.n} 张` : `${mn}定义卡 ${t.n} 张${lec}`;
    case 'tt': return `真值表练习 ${t.n} 个`;
    case 'essay': return '短文练习 1 篇（10 分钟）';
    case 'mock': return '全真模拟考（2 小时）';
    case 'wrong': return `错题重做（当前 ${wrongIds('mcq').length + wrongIds('calc').length} 道）`;
    case 'tips': return '读一遍考场须知';
  }
}
function startTask(di, ti){
  const t = PLAN[di].tasks[ti], key = di + '-' + ti;
  switch (t.k) {
    case 'mcq': return startQuiz(pickMcq(t), {task:key, title: MODS[t.mod].name + '选择题'});
    case 'calc': return startCalc(pickCalc(t), {task:key});
    case 'cards': return startCards(pickCards(t), {task:key});
    case 'tt': return startTT(t.n, {task:key});
    case 'essay': { const e = shuffle(ESSAY.filter(x => !S.essay[x.id]))[0] || shuffle(ESSAY)[0]; if (!e) return toast('还没有短文题'); S.tasks[key] = 1; save(); return go('essayOne', {id: e.id}); }
    case 'mock': return go('mockHome');
    case 'wrong': return go('wrong', {task:key});
    case 'tips': S.tasks[key] = 1; save(); return go('tips');
  }
}
function finishTask(){ if (sess && sess.task) { S.tasks[sess.task] = 1; save(); } }

let toastT = null;
function toast(m, kind){
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.className = 'on' + (kind ? ' ' + kind : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = kind || '', 2400);
}

function initCalc(){ Object.assign(sess, {step:0, vals:[], hadWrong:false, msg:'', hint:false, showTable:false, finished:false}); }
function evalExpr(str){
  let s = String(str).trim().replace(/[×xX]/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/，/g, ',').replace(/。/g, '.').replace(/\s+/g, '');
  if (!s) return NaN;
  let percent = false;
  if (/%$/.test(s)) { percent = true; s = s.slice(0, -1); }
  if (!/^[0-9+\-*/().]+$/.test(s)) return NaN;
  try { let v = Function('"use strict";return (' + s + ')')(); if (percent) v /= 100; return typeof v === 'number' && isFinite(v) ? v : NaN; }
  catch (e) { return NaN; }
}
const r4 = v => Math.round(v * 10000) / 10000;
const expFmt = t => fmt(t).replace(/^(选 [A-E]：)/, '<b class="good">$1</b>').replace(/(^|<br>)([A-E] 错：)/g, '$1<b class="xl">$2</b>');
const trapBlock = q => q.trap ? `<div class="trap"><b>⚠️ 易错点</b>${fmt(q.trap)}</div>` : '';

/* ----- 真值表 ----- */
const SYM = {and:'&', or:'∨', imp:'⊃'};
function rndF(vars, d){
  if (d <= 0 || (d < 3 && Math.random() < .3)) return {v: vars[ri(vars.length)]};
  if (Math.random() < .22) return {op:'neg', a: rndF(vars, d - 1)};
  return {op: ['and','or','imp'][ri(3)], a: rndF(vars, d - 1), b: rndF(vars, d - 1)};
}
function fstr(f, top){
  if (f.v) return f.v;
  if (f.op === 'neg') return '~' + fstr(f.a, false);
  const s = fstr(f.a, false) + ' ' + SYM[f.op] + ' ' + fstr(f.b, false);
  return top ? s : '(' + s + ')';
}
function fev(f, e){

function deckMove(dir){

  const byMod = m => { const ids = M.mc.filter(id => byId[id].module === m); return ids.filter(id => M.mcAns[id] === byId[id].answer).length + '/' + ids.length; };
  const wr = Object.values(G.defs).reduce((a, b) => a + b, 0) + Object.values(G.calcs).reduce((a, b) => a + b, 0) + (G.essay || 0);
  const scoreBtns = (kind, id, max, val) => `<div class="chips">${Array.from({length: max + 1}, (_, k) => `<button class="chip ${val === k ? 'on' : ''}" data-act="mockGrade" data-kind="${kind}" data-id="${id || ''}" data-v="${k}">${k}</button>`).join('')}</div>`;
  const used = M.end ? hms(M.end - M.start).replace('超时 ', '') : '';
  return hdr('模拟考成绩') + `<div class="card" style="text-align:center"><div style="font-size:36px;font-weight:600">${mcOk + wr} / 75</div><div class="sub">选择题 ${mcOk}/${M.mc.length} · 笔试 ${wr}/25（自评）${used ? ' · 用时 ' + used : ''}</div>
  <div class="row" style="justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap">${['logic','prob','soc'].map(m => `<span>${pill(m)} ${byMod(m)}</span>`).join('')}</div></div>
  <h2>选择题</h2><div class="mgrid">${M.mc.map((id, i) => `<button class="${M.mcAns[id] === byId[id].answer ? 'ok' : 'bad'}" data-act="mockSee" data-i="${i}">${i + 1}</button>`).join('')}</div>
  ${M.see != null ? (() => { const id = M.mc[M.see], q = byId[id]; return `<div class="card"><b>第 ${M.see + 1} 题</b><div class="q">${fmt(q.q)}</div>${q.options.map((o, k) => `<div class="opt ${k === q.answer ? 'ok' : k === M.mcAns[id] ? 'bad' : 'dim'}"><span class="bub">${'ABCDE'[k]}</span><span>${fmt(o)}</span></div>`).join('')}<div class="exp">${expFmt(q.explain)}</div></div>`; })() : '<p class="mut">点圆圈看题目和解析。错题已加入错题本。</p>'}
  <h2>短定义（给自己打分）</h2>` + M.defs.map(id => { const c = byId[id]; return `<div class="card"><b>${esc(c.term)}</b><div class="kv"><b>你写的</b><div>${fmt(M.defAns[id] || '（空）')}</div></div><div class="kv"><b>标准定义</b><div>${fmt(c.def)}</div></div>${scoreBtns('defs', id, MOCK_PLAN.defPts, G.defs[id])}</div>`; }).join('') +
  `<h2>计算题</h2>` + M.calcs.map(id => { const q = byId[id], last = q.steps[q.steps.length - 1], v = evalExpr(M.calcAns[id] || ''), ok = !isNaN(v) && Math.abs(v - last.answer) <= (last.tol || .001);
    return `<div class="card"><div style="white-space:pre-wrap">${fmt(q.q)}</div><div class="kv"><b>你的答案</b><div class="${ok ? 'good' : 'wrong'}">${esc(M.calcAns[id] || '（空）')} ${ok ? '✓ 最终答案正确' : '✗ 正确答案 ' + r4(last.answer)}</div></div>
    <div class="kv"><b>标准过程</b><pre class="work">${esc(q.work)}</pre></div>${solBlock(q) ? `<details class="more"><summary>看分步解析 ▾</summary>${solBlock(q)}</details>` : ''}<div class="mut">过程分自己判断：答案对且过程完整给满分</div>${scoreBtns('calcs', id, MOCK_PLAN.calcPts, G.calcs[id])}</div>`; }).join('') +
  (M.essay ? (() => { const e = byId[M.essay]; return `<h2>短文</h2><div class="card"><b>${fmt(e.prompt)}</b><div class="kv"><b>你写的</b><div>${fmt(M.essayAns || '（空）')}</div></div><div class="kv"><b>评分要点</b><div>${e.points.map(p => '· ' + esc(p)).join('<br>')}</div></div><div class="kv"><b>范文</b><div>${fmt(e.model)}</div></div>${scoreBtns('essay', '', MOCK_PLAN.essayPts, G.essay)}</div>`; })() : '') +
  `<button class="btn pri block" data-act="mockDone">保存成绩，结束模拟考</button>`;
}

/* ----- 我的 ----- */
SCR.me = () => {
  const tot = Object.values(S.mcq).reduce((a, r) => a + r.n, 0), cor = Object.values(S.mcq).reduce((a, r) => a + r.c, 0);
  const acc = m => { const rs = MCQ.filter(q => q.module === m && S.mcq[q.id]).map(q => S.mcq[q.id]); const n = rs.reduce((a, r) => a + r.n, 0); return n ? pct(rs.reduce((a, r) => a + r.c, 0) / n) + ` · ${rs.length}/${MCQ.filter(q => q.module === m).length} 题` : '还没做'; };
  return `<h1>我的</h1>
  ${storageOK ? '' : '<div class="banner">这个 App 里无法保存进度，关掉后记录会丢失。请定期用下面的"复制备份"保存。</div>'}
  <div class="grid" style="margin:12px 0"><div class="stat"><b>${tot}</b><span>累计答题</span></div><div class="stat"><b>${tot ? pct(cor / tot) : '-'}</b><span>总正确率</span></div><div class="stat"><b>${S.mocks.length}</b><span>模拟考次数</span></div></div>
  <div class="card">${MOD_ORDER.map(m => `<div class="row" style="padding:5px 0">${pill(m)}<span class="sp"></span><span class="sub">${acc(m)}</span></div>`).join('')}</div>
  <button class="tile" data-act="go" data-n="tips"><span class="ic">${IC.alert}</span><span class="sp"><b>考场须知</b><span class="mut">涂卡规则、带什么、题型分值</span></span><span class="chev">${IC.chev}</span></button>
  <button class="tile" data-act="go" data-n="plan"><span class="ic">${IC.dots}</span><span class="sp"><b>12 天复习计划</b><span class="mut">10/25 – 11/5</span></span><span class="chev">${IC.chev}</span></button>
  <h2>外观</h2>
  <div class="seg">${[['', '跟随系统'], ['light', '浅色'], ['dark', '深色']].map(([v, t]) => `<button class="${(document.documentElement.dataset.theme || '') === v ? 'on' : ''}" data-act="theme" data-v="${v}">${t}</button>`).join('')}</div>
  <h2>备份进度</h2>
  <div class="card"><p class="sub">进度保存在这个 App 里。换手机、删 App 之前，先复制备份码存到备忘录；之后粘贴回来导入。</p>
  <div class="btns"><button class="btn" data-act="exportData">复制备份码</button><button class="btn" data-act="importData">导入备份码</button></div>
  <textarea id="bk" placeholder="备份码会出现在这里，或者把备份码粘贴到这里再点导入" style="margin-top:10px;min-height:80px;font-size:12px"></textarea></div>
  <button class="btn block" style="color:var(--bad)" data-act="reset">清空所有进度</button>
  <p class="mut" style="text-align:center;margin-top:16px">题目根据你的 L1–L19 笔记整理，每题标了出处，有疑问回笔记核对。</p>`;
};
const TIPS = [
  ['范围', '综合性考试：逻辑、概率、社会认识论，Week 11 以前（L1–L19）全部都考。'],
  ['分值', '逻辑约 30%，概率约 50%（重点），社会认识论约 20%。'],
  ['题型', '50 分选择题（答题卡）+ 25 分笔试：短定义、写过程的计算题、一篇一段话的短文。笔试每题多于 1 分。'],
  ['涂卡', '涂错只能完全擦干净再涂新答案。打叉、在卡上写字或其他任何改法都会判错，期末不会帮忙更正。'],
  ['文具', '用普通铅笔加好橡皮；喜欢用笔的话，可擦笔 Pilot Frixion 可以擦干净。'],
  ['计算器', '可以带非编程计算器。'],
  ['笔记', '不能带笔记。试卷上有足够的草稿空间。'],
  ['时间', '2 小时。建议：选择题约 60 分钟，笔试约 45 分钟，留 15 分钟检查涂卡和计算（这是建议，不是官方要求）。']
];
SCR.tips = () => hdr('考场须知') + `<p class="sub">整理自教授的期末公告。看过一条就打勾。</p><div class="card">` +
  TIPS.map(([k, v], i) => `<label class="check"><input type="checkbox" data-act="tipChk" data-i="${i}" ${S.tips[i] ? 'checked' : ''}><span><b>${k}</b> · ${esc(v)}</span></label>`).join('') + '</div>' +
  `<div class="card"><h3>考前一晚检查</h3><p style="margin:0">铅笔 2 支 · 橡皮 · 计算器（非编程）· 学生证 · 确认考场和时间</p></div>`;

/* ---------- 事件 ---------- */
const ACT = {
  tab: d => tab(d.n),
  back: () => back(),
  go: d => go(d.n),
  tick: d => { S.tasks[d.k] = !S.tasks[d.k]; if (!S.tasks[d.k]) delete S.tasks[d.k]; save(); render(); },
  task: d => startTask(+d.d, +d.i),
  qopt: d => { const o = S.qopt; if (d.f === 'n') o.n = +d.v; else if (d.f === 'unseen' || d.f === 'hf') o[d.f] = !o[d.f]; else { o[d.f] = d.v; if (d.f === 'mod') o.lec = ''; } save(); render(); },
  startQuiz: () => { const o = S.qopt; startQuiz(pickMcq({mod:o.mod, lec:o.lec ? [o.lec] : null, n:o.n, unseen:o.unseen, hf:o.hf}), {title:(o.mod ? MODS[o.mod].name : '综合') + (o.lec ? ' ' + o.lec : '') + ' 选择题'}); },
  pick: d => { const s = sess, id = s.list[s.i], k = +d.k; s.ans[id] = k; recMcq(id, k === byId[id].answer); render(); },
  nextQ: () => { sess.i++; render(true); },
  redoWrongHere: () => { const s = sess; const w = s.list.filter(id => s.ans[id] !== byId[id].answer); stack.pop(); startQuiz(shuffle(w), {title:'重做错题'}); },
  redoWrong: d => startQuiz(shuffle(wrongIds('mcq')), {title:'重做错题', task: d.task || undefined}),
  redoCalc: d => startCalc(shuffle(wrongIds('calc')), {task: d.task || undefined}),
  calcRand: d => startCalc(pickCalc({mod:d.m, n: d.m === 'prob' ? 3 : 2})),
  calcOne: d => startCalc([d.id]),
  key: d => { const el = $('#calcIn'); if (!el) return; const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    if (d.k === '⌫') { if (a === b && a > 0) { el.value = el.value.slice(0, a - 1) + el.value.slice(b); el.setSelectionRange(a - 1, a - 1); } else { el.value = el.value.slice(0, a) + el.value.slice(b); el.setSelectionRange(a, a); } }
    else { el.value = el.value.slice(0, a) + d.k + el.value.slice(b); el.setSelectionRange(a + 1, a + 1); } },
  calcCheck: () => { const s = sess, q = byId[s.list[s.i]], st = q.steps[s.step], el = $('#calcIn'), raw = el ? el.value : '';
    const v = evalExpr(raw), tol = st.tol || .001;
    if (!raw.trim()) { s.msg = '先输入答案'; s.msgOk = false; return render(); }
    if (isNaN(v)) { s.msg = '看不懂这个输入，只能用数字和 + − × / ( ) %'; s.msgOk = false; return render(); }
    let ok = Math.abs(v - st.answer) <= tol;
    if (!ok && v > 1 && st.answer <= 1 && Math.abs(v / 100 - st.answer) <= tol) ok = true;
    if (ok) { s.vals[s.step] = raw.trim() + (String(r4(v)) !== raw.trim() ? ' = ' + r4(v) : ''); s.step++; s.msg = ''; s.hint = false; if (s.step >= q.steps.length) { s.finished = true; recCalc(q.id, !s.hadWrong); } }
    else { s.hadWrong = true; s.msg = '不对，再想想（可以点提示）'; s.msgOk = false; }
    render(); setTimeout(() => { const e = $('#calcIn'); if (e && ok) e.focus(); }, 30); },
  calcHint: () => { sess.hint = true; render(); },
  calcReveal: () => { const s = sess, q = byId[s.list[s.i]], st = q.steps[s.step]; s.hadWrong = true; s.vals[s.step] = r4(st.answer) + '（看了答案）'; s.step++; s.msg = ''; s.hint = false; if (s.step >= q.steps.length) { s.finished = true; recCalc(q.id, false); } render(); },
  calcTable: () => { sess.showTable = true; render(); },
  calcNext: () => { sess.i++; if (sess.i < sess.list.length) initCalc(); render(true); },
  startTT: () => startTT(5),
  ttCell: d => { const s = sess; if (s.checked) return; const i = +d.i, u = s.user[i]; s.user[i] = u == null ? true : u ? false : undefined; render(); },
  ttCls: d => { sess.cls = d.v; render(); },
  ttHint: () => { sess.hint = !sess.hint; render(); },
  ttCheck: () => { const s = sess; if (s.rows.some((e, i) => s.user[i] == null)) return toast('先把最右一列都填上 T 或 F'); if (!s.cls) return toast('再选一下这个命题的类型');
    s.checked = true; const ans = s.rows.map(e => fev(s.f, e)); const ok = s.rows.every((e, i) => s.user[i] === ans[i]) && s.cls === classify(s.f, s.vars);
    S.tt.n++; if (ok) S.tt.ok++; save(); render(); },
  ttNext: () => { const s = sess; s.count++; if (s.count >= s.n) { finishTask(); back(); } else { newTT(); render(true); } },
  cardsGo: d => startCards(pickCards({mod: d.m || null, hf: !!d.hf, n: 20})),
  flip: () => { const t = $('#cardTry'); sess.tryText = t ? t.value.trim() : ''; sess.flip = true; render(); },
  rate: d => { const s = sess, id = s.list[s.i], r = +d.r; rateCard(id, r); s.stat[r]++; if (r === 0 && !s.again[id]) { s.again[id] = 1; s.list.push(id); } s.i++; s.flip = false; s.tryText = ''; render(true); },
  kbMod: d => { kb.mod = d.m; kb.q = ''; render(); },
  essayOne: d => go('essayOne', {id: d.id}),
  kpOpen: d => go('kp', {id: d.id}),
  zhToggle: () => { zhOn = !zhOn; try { localStorage.setItem('phil1005-zh', zhOn ? '1' : '0'); } catch (e) {} render(); },
  symToggle: () => { const p = $('#symPanel'); if (!p.innerHTML) p.innerHTML = symPanel(); document.body.classList.toggle('symopen'); },
  kpQuiz: d => { const c = byId[d.id], xs = kpSplit(c).mcq; startQuiz(d.rest ? xs.filter(id => !itemOk(id)) : xs, {title: c.term}); },
  kpTick: d => { const c = byId[d.id];
    if (kpAuto(c) && !S.kpDone[c.id]) return toast('对应的题已全部答对，已自动通过');
    if (S.kpDone[c.id]) delete S.kpDone[c.id]; else { S.kpDone[c.id] = Date.now(); toast(`✓ 已标记掌握：${c.term}`, 'ok'); }
    save(); render(); },
  kbFilter: d => { kb.f = d.v; render(); },
  deckGo: d => go('deck', {l: d.l, i: 0}),
  deckStep: d => deckMove(+d.d),
  deckTodo: d => { const p = cur().p; p.todo = !!d.v; p.i = 0; render(true); },
  essayShow: () => { cur().p.show = true; render(); },
  essayTimer: () => { essayT = essayT ? null : Date.now(); render(); },
  essayChk: (d, el) => { const c = S.essayChk[d.id] || (S.essayChk[d.id] = {}); c[d.i] = el.checked; save(); render(); },
  tipChk: (d, el) => { S.tips[d.i] = el.checked; save(); },
  mockStart: () => { if (S.mock) return go('mock'); if (!MCQ.length) return toast('题库为空'); mockStart(); },
  mockGo: () => go('mock'),
  mockAbort: () => { if (confirm('放弃这次模拟考？已答内容不会保存成绩。')) { S.mock = null; save(); render(); } },
  mockSec: d => { S.mock.sec = d.s; save(); render(true); },
  mockPick: d => { const M = S.mock, id = M.mc[M.i], k = +d.k; if (M.mcAns[id] === k) delete M.mcAns[id]; else M.mcAns[id] = k; save(); render(); },
  mockMove: d => { const M = S.mock, n = M.i + +d.d; if (n >= M.mc.length) { M.sec = 'wr'; } else M.i = Math.max(0, n); save(); render(true); },
  mockJump: d => { S.mock.i = +d.i; save(); render(true); },
  mockSubmit: () => { const M = S.mock, left = M.mc.length - Object.keys(M.mcAns).length;
    if (!confirm(left ? `还有 ${left} 道选择题没答，确定交卷？` : '确定交卷？')) return;
    M.phase = 'review'; M.end = Date.now();
    M.mc.forEach(id => recMcq(id, M.mcAns[id] === byId[id].answer));
    M.calcs.forEach(id => { const q = byId[id], last = q.steps[q.steps.length - 1], v = evalExpr(M.calcAns[id] || ''); if (!isNaN(v) && Math.abs(v - last.answer) <= (last.tol || .001)) M.grade.calcs[id] = MOCK_PLAN.calcPts; });
    save(); render(true); },
  mockSee: d => { S.mock.see = +d.i; render(); },
  mockGrade: d => { const G = S.mock.grade, v = +d.v; if (d.kind === 'essay') G.essay = v; else G[d.kind][d.id] = v; save(); render(); },
  mockDone: () => { const M = S.mock, G = M.grade;
    const mc = M.mc.filter(id => M.mcAns[id] === byId[id].answer).length;
    const wr = Object.values(G.defs).reduce((a, b) => a + b, 0) + Object.values(G.calcs).reduce((a, b) => a + b, 0) + (G.essay || 0);
    const dt = new Date(M.start);
    S.mocks.push({date: md(dt) + ' ' + String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0'), mc, wr, total: mc + wr});
    const key = PLAN.findIndex(d => d.tasks.some(t => t.k === 'mock'));
    if (key >= 0) S.tasks[key + '-' + PLAN[key].tasks.findIndex(t => t.k === 'mock')] = 1;
    S.mock = null; save(); stack = [{name:'practice'}, {name:'mockHome', p:{}}]; render(true); },
  exportData: () => { const t = $('#bk'); t.value = JSON.stringify(S); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('已复制，粘贴到备忘录保存'), () => { document.execCommand('copy'); toast('已复制（如果没复制上，请手动全选框里的文字复制）'); }); } catch (e) { document.execCommand('copy'); toast('请手动全选框里的文字复制'); } },
  importData: () => { const t = $('#bk'); try { const o = JSON.parse(t.value.trim()); if (!o || typeof o !== 'object' || !o.mcq) throw 0; if (!confirm('导入会覆盖当前进度，继续？')) return; S = Object.assign(blank(), o); save(); toast('导入完成'); render(); } catch (e) { toast('备份码格式不对'); } },
  theme: d => { const h = document.documentElement; if (d.v) h.dataset.theme = d.v; else delete h.dataset.theme;
    try { d.v ? localStorage.setItem('phil1005-theme', d.v) : localStorage.removeItem('phil1005-theme'); } catch (e) {} render(); },
  reset: () => { if (confirm('清空所有做题记录、定义卡进度和模拟考成绩？') && confirm('真的清空？无法恢复。')) { S = blank(); save(); render(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
  const f = ACT[el.dataset.act];
  if (f) { if (el.tagName === 'SUMMARY') return; e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-act]')) ACT[el.dataset.act](el.dataset, el);
});
document.addEventListener('pointerdown', e => { if (e.target.closest('.kp button')) e.preventDefault(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'calcIn') { e.preventDefault(); ACT.calcCheck(); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.id) kb.open[d.dataset.id] = d.open; }, true);
let saveT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'kbq') { kb.q = el.value; $('#kbList').innerHTML = kbList(); }
  else if (el.id === 'essayTxt') { S.essay[el.dataset.id] = el.value; $('#essayWc').textContent = (el.value.match(/[A-Za-z'’-]+/g) || []).length + ' words · 自动保存'; clearTimeout(saveT); saveT = setTimeout(save, 400); }
  else if (el.dataset.mock && S.mock) { const f = el.dataset.mock; if (f === 'essayAns') S.mock.essayAns = el.value; else S.mock[f][el.dataset.id] = el.value; clearTimeout(saveT); saveT = setTimeout(save, 400); }
});
function tickTimers(){
  document.querySelectorAll('[data-timer]').forEach(el => {
    if (el.dataset.timer === 'mock' && S.mock) { const l = mockLeft(); el.textContent = hms(l); el.style.color = l < 10 * 60e3 ? 'var(--bad)' : ''; }
    if (el.dataset.timer === 'essay') { if (essayT) { const l = 600e3 - (Date.now() - essayT); el.textContent = hms(l).replace(/^(超时 )?0:/, '$1'); el.style.color = l < 0 ? 'var(--bad)' : ''; } else el.textContent = '10:00'; }
  });
}
setInterval(tickTimers, 1000);
window.addEventListener('pagehide', save);
render(true);
</script>
